groups:
  - name: optionedge-hpsf
    interval: 30s
    rules:
      - alert: HpsfKafkaDiskAbove75Percent
        expr: kafka_log_dir_used_percent > 75
        for: 5m
        labels:
          severity: warning
          service: hpsf
        annotations:
          summary: "Kafka disk pressure may affect HPSF topics"
          description: "Kafka disk usage must stay below 75 percent for the RF=1 HPSF cluster. Check broker storage before data loss occurs."
      - alert: HpsfOpraLagTooHigh
        expr: hpsf_kafka_lag{source="opra"} > 2000
        for: 1m
        labels:
          severity: critical
          service: hpsf
        annotations:
          summary: "OPRA lag too high"
          description: "HPSF must force NO_TRADE while OPRA input lag is above threshold."
      - alert: HpsfUnderlyingLagTooHigh
        expr: hpsf_kafka_lag{source="underlying"} > 2000
        for: 1m
        labels:
          severity: critical
          service: hpsf
        annotations:
          summary: "Underlying lag too high"
          description: "ES/SPX source lag is above threshold. HPSF must not emit BUY signals."
      # --- DBP-R32: prod takes ES trades from es4 over a LAN bridge -------------------------
      # After the ES-futures Databento subscription moved to the es env, these trades drive the
      # A1-certified ES->SPX basis, so prod now depends on another box, a bridge process and the
      # LAN. Without an alert the failure is SILENT: the last basis sits on a COMPACTED topic
      # looking perfectly valid, because a silent source publishes no new record to replace it.
      #
      # `> 0` on the timestamp is REQUIRED, not decorative: the age gauge is NaN until the first
      # trade of the process, and the timestamp is 0. Alerting on the age alone would never fire
      # for a feed that never received anything at all — the worst case.
      - alert: EsTradesSourceSilent
        # SESSION GATED. Globex is legitimately closed ~Fri 17:00 ET -> ~Sun 18:00 ET, so an
        # ungated rule pages critically every weekend — which trains people to ignore it, the
        # exact opposite of fail-loud. The gate uses the feed's own session gauge, evaluated from
        # the same is_globex_open() the liveness probe uses, so alert and probe cannot disagree.
        expr: >-
          options_edge_databento_feed_globex_session_open == 1
          and
          options_edge_databento_feed_es_trades_source_timestamp_seconds > 0
          and
          (time() - options_edge_databento_feed_es_trades_source_timestamp_seconds) > 600
        # THRESHOLD IS DELIBERATELY CONSERVATIVE, and this is a known trade-off rather than an
        # oversight. 10m + for:5m means ~15 minutes to page, which IS slow for an A1-certified
        # input: ES front-contract trades are frequent during RTH, so a 10-minute gap is already
        # extraordinary. Tightening to ~1-2 minutes is the right end state — but ONLY once the
        # scheduled equity-index halt (~16:15-16:30 ET) is modelled in is_globex_open(), which it
        # currently is NOT: the model covers holidays, Saturday, the Sunday 18:00 reopen, the
        # Friday 17:00 close and the Mon-Thu 17:00-18:00 maintenance break, but treats the
        # afternoon halt as OPEN. A 60-120s threshold would page every weekday through that halt,
        # and an alert that fires daily is one people mute. Tighten after modelling the halt.
        for: 5m
        labels:
          severity: critical
          service: databento-feed
        annotations:
          summary: "ES trades from es4 have stopped reaching prod"
          description: >-
            No usable ES trade has arrived over the ES-trades Kafka source for more than 10
            minutes. The ES->SPX basis is driven by these records, and a silent source does NOT
            republish an UNAVAILABLE state — the last value stays on the compacted topic looking
            valid. Check the es4 feed, the es-trades bridge launchd unit on the ops Mac, and the
            LAN path to 192.168.100.4.
      # Never-received is a DISTINCT failure from went-silent, and the alert above cannot see it
      # (timestamp stays 0, so the guard excludes it). A feed that has been up well past its
      # startup grace and has still never received one ES trade is misconfigured or disconnected.
      - alert: EsTradesSourceNeverReceived
        # Also session gated, for the same reason: a feed that boots on a Saturday has legitimately
        # never received an ES trade, and saying so at 03:00 helps nobody.
        expr: >-
          options_edge_databento_feed_globex_session_open == 1
          and
          options_edge_databento_feed_es_trades_source_timestamp_seconds == 0
        for: 30m
        labels:
          severity: critical
          service: databento-feed
        annotations:
          summary: "ES-trades source has never delivered a record"
          description: >-
            This feed has been running for 30 minutes with the ES-trades Kafka source enabled and
            has never received a usable ES trade. Check ES_TRADES_SOURCE_BOOTSTRAP/_TOPIC and that
            the es4->prod bridge is installed and flowing.
      # ⚠️ SAFETY NET for the two session-gated rules above. They gate on a gauge exported BY THE
      # FEED ITSELF, so if the feed dies the gauge DISAPPEARS, `... == 1 and ...` matches nothing,
      # and neither rule can fire — the gate silently disarms exactly when things are worst.
      # absent() is the complement: it fires when the series is missing entirely.
      - alert: EsFeedMetricsAbsent
        expr: absent(options_edge_databento_feed_globex_session_open)
        for: 10m
        labels:
          severity: critical
          service: databento-feed
        annotations:
          summary: "databento-feed is not exporting metrics at all"
          description: >-
            The feed's own session gauge is absent, so it is not being scraped — the process is
            down, wedged, or unreachable. This also means the session-gated ES-source alerts CANNOT
            fire, because they gate on this same series. Treat this as covering both.
      - alert: HpsfEvaluationDurationTooHigh
        expr: hpsf_evaluation_duration_ms > 1000
        for: 2m
        labels:
          severity: warning
          service: hpsf
        annotations:
          summary: "HPSF evaluation duration exceeds interval"
          description: "Stage B evaluation is slower than the expected evaluation cadence."
      - alert: HpsfDlqIncreasingFast
        expr: increase(hpsf_dlq_count[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: hpsf
        annotations:
          summary: "HPSF DLQ is increasing"
          description: "Mapping, validation, stale-source, or schema errors are entering options.hpsf.dlq."
      - alert: HpsfWriterDlqNonZero
        expr: hpsf_writer_dlq_count > 0
        for: 1m
        labels:
          severity: critical
          service: hpsf-postgres-writer
        annotations:
          summary: "HPSF writer DLQ has records"
          description: "The HPSF Postgres writer rejected or failed to persist one or more HPSF records."
      - alert: HpsfPostgresWriterUnhealthy
        expr: up{job="options-edge-hpsf-postgres-writer-service"} == 0
        for: 2m
        labels:
          severity: critical
          service: hpsf-postgres-writer
        annotations:
          summary: "HPSF Postgres writer scrape is down"
          description: "Writer health or metrics endpoint is unavailable."
      - alert: HpsfChangelogRestoreSlow
        expr: hpsf_changelog_restore_duration_ms > 60000
        for: 1m
        labels:
          severity: warning
          service: hpsf
        annotations:
          summary: "HPSF changelog restore is slow"
          description: "Critical state-store restore exceeded 60 seconds."
      - alert: HpsfStaleDataGateActiveTooLong
        expr: increase(hpsf_signals_no_trade_count{reason=~".*STALE.*|.*LAG.*"}[10m]) > 0
        for: 10m
        labels:
          severity: critical
          service: hpsf
        annotations:
          summary: "HPSF stale-data gate active too long"
          description: "Freshness or lag gates have suppressed signals for at least 10 minutes."
      - alert: HpsfOldBucketKeysNotDeleted
        expr: increase(hpsf_state_old_bucket_keys_deleted_count[30m]) == 0 and hpsf_state_strike_bucket_keys > 0
        for: 30m
        labels:
          severity: warning
          service: hpsf
        annotations:
          summary: "HPSF old bucket cleanup may not be running"
          description: "strike-bucket-state-store keys are present but no old bucket keys were deleted recently."

  # ==========================================================================
  # delta-flow-service (R19). Job label is options-edge-delta-flow-service
  # (apply-prometheus-scrapes.sh prepends options-edge- to delta-flow-service).
  # Thresholds calibrated from real backdata (SPXW 0DTE): ~60% at-touch HIGH,
  # ~15% midpoint baseline, ~99.9% normal markets. TUNE against live metrics.
  # Kafka Streams state ordinals: healthy = RUNNING(2)/REBALANCING(1); >2 = shutdown/error.
  # ==========================================================================
  - name: delta-flow.health
    interval: 30s
    rules:
      - alert: DeltaFlowStreamsError
        expr: delta_flow_kafka_streams_state{job="options-edge-delta-flow-service"} > 2
        for: 2m
        labels:
          severity: critical
          service: delta-flow
        annotations:
          summary: "delta-flow Kafka Streams in shutdown/error on {{ $labels.instance }}"
          description: "kafka_streams_state={{ $value }} (>2 = PENDING_SHUTDOWN/NOT_RUNNING/ERROR) for 2m."
      - alert: DeltaFlowNotReady
        expr: delta_flow_ready{job="options-edge-delta-flow-service"} == 0
        for: 5m
        labels:
          severity: warning
          service: delta-flow
        annotations:
          summary: "delta-flow not READY on {{ $labels.instance }} for 5m"
      - alert: DeltaFlowNonFiniteOutput
        expr: increase(delta_flow_non_finite_signed_delta_flow_total{job="options-edge-delta-flow-service"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: delta-flow
        annotations:
          summary: "delta-flow produced a NON-FINITE signed-delta on {{ $labels.instance }} (math/guard defect)"
      - alert: DeltaFlowNoFreshEvents
        # No trades seen while it should flow. The market_hours_only label is only a routing HINT — it
        # does NOT gate on its own, so we ALSO gate here in PromQL as defense-in-depth: fire only on
        # weekdays during regular US options hours. NB this is a COARSE UTC gate — it covers RTH under
        # BOTH DST regimes (EDT 13:30-20:00 UTC and EST 14:30-21:00 UTC) by using 13:30-21:00 UTC, and
        # it is NOT holiday/early-close aware. The correct long-term gate is a service-emitted
        # delta_flow_market_open metric; replace the time predicate with it once that exists.
        expr: |
          (increase(delta_flow_trades_seen_total{job="options-edge-delta-flow-service"}[10m]) == 0)
            and on() (day_of_week() > 0)
            and on() (day_of_week() < 6)
            and on() (
              (hour() == 13 and minute() >= 30) or (hour() > 13 and hour() < 21)
            )
        for: 10m
        labels:
          severity: warning
          service: delta-flow
          market_hours_only: "true"
        annotations:
          summary: "delta-flow saw no trades in 10m on {{ $labels.instance }} (weekday RTH, coarse UTC gate)"

  - name: delta-flow.input-quality
    interval: 30s
    rules:
      - alert: DeltaFlowStaleGreekRateHigh
        expr: |
          sum by (instance) (rate(delta_flow_stale_greek_total{job="options-edge-delta-flow-service"}[5m]))
            / clamp_min(sum by (instance) (rate(delta_flow_trades_seen_total{job="options-edge-delta-flow-service"}[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
          service: delta-flow
        annotations:
          summary: "delta-flow stale-greek rate > 5% on {{ $labels.instance }} (GEX surface lagging)"
      - alert: DeltaFlowUnknownAggressorRateHigh
        # Real baseline ~15% (midpoint). Sustained >30% => quote quality / classifier degradation.
        expr: delta_flow_unknown_aggressor_rate{job="options-edge-delta-flow-service"} > 0.30
        for: 15m
        labels:
          severity: warning
          service: delta-flow
        annotations:
          summary: "delta-flow unknown-aggressor rate > 30% on {{ $labels.instance }}"
      - alert: DeltaFlowLookaheadDetected
        expr: increase(delta_flow_lookahead_greek_total{job="options-edge-delta-flow-service"}[10m])
              + increase(delta_flow_lookahead_quote_total{job="options-edge-delta-flow-service"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
          service: delta-flow
        annotations:
          summary: "delta-flow lookahead quote/greek on {{ $labels.instance }} (clock skew / ordering)"
      - alert: DeltaFlowConditionRejectSurge
        expr: |
          sum by (instance) (rate(delta_flow_condition_rejected_total{job="options-edge-delta-flow-service"}[5m]))
            / clamp_min(sum by (instance) (rate(delta_flow_trades_seen_total{job="options-edge-delta-flow-service"}[5m])), 1) > 0.10
        for: 10m
        labels:
          severity: warning
          service: delta-flow
        annotations:
          summary: "delta-flow condition-reject rate > 10% on {{ $labels.instance }} (feed metadata degraded)"
      - alert: DeltaFlowContractRefUnknownRateHigh
        expr: sum by (instance) (rate(delta_flow_contract_ref_unknown_total{job="options-edge-delta-flow-service"}[10m])) > 0.5
        for: 15m
        labels:
          severity: warning
          service: delta-flow
        annotations:
          summary: "delta-flow CONTRACT_REF_UNKNOWN rate high on {{ $labels.instance }}"

  - name: delta-flow.calibration
    interval: 30s
    rules:
      - alert: DeltaFlowSideAccuracyBelowFloor
        expr: delta_flow_side_accuracy_ci_low{job="options-edge-delta-flow-service"} < 0.75
              and delta_flow_side_accuracy_comparable_total{job="options-edge-delta-flow-service"} > 500
        for: 15m
        labels:
          severity: warning
          service: delta-flow
        annotations:
          summary: "delta-flow side-accuracy CI-low < 0.75 on {{ $labels.instance }} (classifier regressed)"
      - alert: DeltaFlowClusterUncalibrated
        # cluster_calibrated == 0 = enabled but uncalibrated; -1 = feature disabled (inert).
        expr: delta_flow_cluster_calibrated{job="options-edge-delta-flow-service"} == 0
        for: 30m
        labels:
          severity: warning
          service: delta-flow
          market_hours_only: "true"
        annotations:
          summary: "delta-flow cluster NOT calibrated for 30m (weighted signal suppressed)"

  - name: delta-flow.reversal-positioning
    interval: 30s
    rules:
      - alert: DeltaFlowCancelUnlinkableRateHigh
        expr: |
          sum by (instance) (rate(delta_flow_cancel_unlinkable_total{job="options-edge-delta-flow-service"}[10m]))
            / clamp_min(sum by (instance) (
                rate(delta_flow_cancel_unlinkable_total{job="options-edge-delta-flow-service"}[10m])
              + rate(delta_flow_cancel_applied_total{job="options-edge-delta-flow-service"}[10m])), 1) > 0.5
        for: 15m
        labels:
          severity: warning
          service: delta-flow
        annotations:
          summary: "delta-flow >50% of cancels UNLINKABLE on {{ $labels.instance }} (feed linkage gap, R16)"
      - alert: DeltaFlowPositioningUnknownRateHigh
        expr: |
          sum by (instance) (rate(delta_flow_positioning_unknown_total{job="options-edge-delta-flow-service"}[15m]))
            / clamp_min(sum by (instance) (rate(delta_flow_positioning_emit_total{job="options-edge-delta-flow-service"}[15m])), 1) > 0.5
        for: 20m
        labels:
          severity: warning
          service: delta-flow
        annotations:
          summary: "delta-flow >50% of positioning emits UNKNOWN on {{ $labels.instance }} (OI gap, R1)"

  - name: strike-liquidity-heatmap
    interval: 30s
    rules:
      # The strike-liquidity heatmap went dark on a market open while the pod was up and 0-restart:
      # quotes were reaching the heatmap service but no frames came out. Catch that specific stall
      # WITHOUT a market-hours calendar: fire only when quote input IS flowing (so the market is
      # live, the feed is delivering, and the pod is scraping) yet ZERO frames are emitted. When the
      # market is closed or the feed is dead, quote_events_seen is flat too, so this stays silent —
      # a dead feed is the feed-liveness probe's job, not this alert's.
      - alert: HeatmapFramesStalledWhileQuotesFlowing
        expr: |
          increase(options_edge_strike_liquidity_quote_events_seen_total{job="options-edge-strike-liquidity-heatmap-service"}[5m]) > 0
          and
          increase(options_edge_strike_liquidity_frame_emitted_total{job="options-edge-strike-liquidity-heatmap-service"}[5m]) == 0
        for: 3m
        labels:
          severity: critical
          service: strike-liquidity-heatmap
          market_hours_only: "true"
        annotations:
          summary: "Liquidity heatmap emitting NO frames while quotes flow on {{ $labels.instance }} (heatmap dark)"
          description: "options.databento quotes are reaching the strike-liquidity-heatmap service but frame_emitted has not advanced for 5m. The option-chain heatmap layer is dark despite live input — the streams topology is stuck (rekey/join, store, or serialization), not the feed. Check the heatmap pod logs and process_errors/rejected_total before the next open."
