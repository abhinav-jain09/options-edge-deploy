# Topics whose records are retained, wire-exact, for replaying the VWAP / zone acceptance-rejection
# indicator (and any other consumer of the same inputs). One topic per line; a topic that does not
# exist yet is skipped and picked up the run after it appears. DEV only.
#
# NOT listed on purpose (already archived by an existing job - do not duplicate):
#   spx.basis.state, underlying.es.price, underlying.spx.price, underlying.spx.index.price
#       -> dev-nas-archive "spot" job, decoded JSON, every 10 min.
#   es.underlying.es.trades, es.futures.footprint.strike, es.futures.footprint.outcomes,
#   es.futures.auction, es.tape-zones.cells  -> the es4 job (es4 host; not touched here).

# --- host structure the indicator consumes (Avro) -------------------------------------------------
options.spx.market-structure.patterns
options.spx.market-structure.tools
options.spx.market-structure.geometry
options.spx.market-structure.break-events
options.spx.market-structure.swing-pivots
options.spx.market-structure.equal-levels

# --- indicator VWAP snapshots and bars (Avro) -------------------------------------------------------
es.options.indicators.snapshot.current
options.indicators.snapshot.current
es.options.indicators.bars
options.indicators.bars

# --- ES order flow ------------------------------------------------------------------------------------
# aggressor-flow is in NO archive anywhere. footprint.bars / cvd.bars ARE in the es4 job's set, but
# that job's last run was 2026-10-26 (runs.log on the NAS), so the dev mirror copy is kept too. They
# are a few MB a day. underlying.es.trades.linearized is the ordered ES tape the dev services read.
es.futures.aggressor-flow
es.futures.footprint.bars
es.futures.cvd.bars
underlying.es.trades.linearized

# --- line-acceptance service (empty until it runs; picked up automatically) -----------------------------
options.spx.line-acceptance
options.spx.line-acceptance.journal
options.spx.line-acceptance.checkpoint
options.spx.line-acceptance.dlq
