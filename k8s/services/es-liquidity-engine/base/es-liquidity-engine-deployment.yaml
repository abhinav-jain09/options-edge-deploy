apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-liquidity-engine-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: es-liquidity-engine-service
    app.kubernetes.io/component: es-liquidity-engine-service
    app.kubernetes.io/part-of: options-edge
spec:
  # DEV ONLY (services.yaml envs: [dev]). The ES MBO liquidity engine: a supervisor over the byte-identical drop-classifier engine (ES_TRADES, writes es.drop.*) and, in later phases, the MBO engine.
  # SINGLE replica (strategy Recreate): one engine owns the es.drop.* outputs.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: es-liquidity-engine-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: es-liquidity-engine-service
        app.kubernetes.io/component: es-liquidity-engine-service
        app.kubernetes.io/part-of: options-edge
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: es-liquidity-engine
          image: 192.168.100.252:5000/options-edge-es-liquidity-engine:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: ENGINE_MODE
              value: SHADOW
            - name: HEALTH_PORT
              value: "8080"
            # The drop engine's inputs and outputs: every broker is the dev broker; ES_TRADES mode on the dev ES tape. Outputs es.drop.* (the prefix default in ES_TRADES mode).
            - name: DROP_UNDERLYING_MODE
              value: ES_TRADES
            - name: DROP_UNDERLYING_BOOTSTRAP
              value: host.docker.internal:19092
            - name: DROP_UNDERLYING_TOPIC
              value: underlying.es.trades
            - name: DROP_FLOW_BOOTSTRAP
              value: host.docker.internal:19092
            - name: DROP_FLOW_TOPIC
              value: delta-flow-by-trade
            - name: DROP_FLOW_SCHEMA_REGISTRY_URL
              value: ""
            - name: DROP_OUTPUT_BOOTSTRAP
              value: host.docker.internal:19092
            - name: DROP_NOWCAST_RETENTION_MS
              value: "604800000"
            - name: DROP_GAMMA_BOOTSTRAP
              value: host.docker.internal:19092
            - name: DROP_GAMMA_TOPIC
              value: options.spx.gamma-migration.current
            - name: DROP_VIX_BOOTSTRAP
              value: ""
            - name: DROP_VIX_TOPIC
              value: underlying.vix.price
            - name: DROP_LOOKBACK_MINUTES
              value: "30"
            - name: DROP_SR_BOOTSTRAP
              value: ""
            # The MBO engine: reads es.rithmic.mbo (Avro id 3302, the dev mirror of the es4 collector) and writes es.mbo.level-flow (3502) and es.mbo.health (version 2, 3509) on the dev broker.
            # The topics are deploy-owned (scripts/kafka/ensure-es-liquidity-engine-topics.sh). The collector's literal since the 2026-11-04 cutover is "Rithmic Paper Trading";
            # ALLOW_TEST is off (the test literal is never admitted). SCHEMA_REGISTRY_URL comes from options-edge-config.
            - name: ES_MBO_ENABLED
              value: "true"
            - name: ES_MBO_BOOTSTRAP
              value: host.docker.internal:19092
            - name: ES_MBO_OUTPUT_BOOTSTRAP
              value: host.docker.internal:19092
            - name: ES_MBO_ENVIRONMENT
              value: Rithmic Paper Trading
            - name: ES_MBO_ALLOW_TEST
              value: "false"
            # <date>=<contract>: the front ES contract from that trade date. Roll it with the quarterly roll.
            - name: ES_MBO_CONTRACT_TABLE
              value: 2026-09-14=ESZ6
            # The FINAL fill/cancel attribution stage runs only when BOTH ledger values are set. DESCRIPTIVE starting values from the 2026-11-05 dev measurement
            # (es-liquidity-engine-service/docs/measurements/fill-window-2026-11-05.md): the delete-vs-print delta peaks in [0,10) ms with its sharp part within +-50 ms, so W=100 ms;
            # the trade-order bound is a conservative 2 s over the ~90 ms Kafka transport delay measured on 2026-11-05. Not calibrated; the Phase 3 corpus run sets the ledger.
            - name: ES_MBO_FILL_WINDOW_MS
              value: "100"
            - name: ES_MBO_TRADE_ORDER_MS
              value: "2000"
            # Fill attribution order: "optimal" = the exact per-bucket matching (OptimalMatching); "greedy" = the feed order. Measured over the 23 NAS sessions 2026-11-08 (POST-HOC, J revision 2;
            # es-liquidity-engine-service/docs/measurements/fill-error-runs-2026-11-07.md): optimal 27 of 28 cells within 5 points and 4.8 % of levels off by more than one contract,
            # greedy 16 of 28 cells. DEV-ONLY service. Part of the engine's config fingerprint: switching it restarts from a cold replay (a snapshot of the other mode is not restored).
            - name: ES_MBO_FILL_MATCHING
              value: "optimal"
            # Restart source: the engine snapshots every 60 closed buckets to the compacted es.mbo.snapshot and restarts from it (0 turns it off).
            - name: ES_MBO_SNAPSHOT_INTERVAL_BUCKETS
              value: "60"
            # The liquidity vacuum detector (SHADOW): DESCRIPTIVE bounds from the 2026-11-06 corpus measurement (es-liquidity-engine-service/docs/measurements/vacuum-depth-2026-11-06.md):
            # fewer than 398 contracts on the next 10 ticks beyond the inside (the 5th percentile of regular hours, the smaller of 409 above and 398 below); the empty-run rule
            # measured degenerate (0 at the 99th percentile) so it is 0. Not calibrated; unset (negative) disables the detector.
            - name: ES_MBO_VACUUM_DEPTH_TICKS
              value: "10"
            - name: ES_MBO_VACUUM_DEPTH_BELOW
              value: "398"
            - name: ES_MBO_VACUUM_RUN_AT_LEAST
              value: "0"
            # The source-lag bound of document A revision 12 section 5.4 (work package K2): the health record of every bucket carries FRESH, LAGGING, SILENT or UNKNOWN judged against this
            # many milliseconds on the engine's own clock (receipt time against exchange time of the admitted UPDATE records). 10 seconds is the owner's bound of 2026-11-06, the same as the
            # collector's gate (rithmic-depth-bridge PR 16). A label, not a filter: the engine publishes its rows whatever the status.
            - name: ES_MBO_SOURCE_LAG_BOUND_MILLIS
              value: "10000"
            # THE COVERAGE MESSAGE (EsMboCoverage, contracts 0.91.0 fixed id 3511): the interval
            # through which this engine states it observed and classified the book CONTINUOUSLY,
            # keyed by contract on a compacted topic. A run extends only across contiguous buckets
            # that closed LIVE, on the BOOK clock, and carried admitted records — a bucket the
            # wall-clock timer closed, or one a late record swept over in silence, breaks it. Read
            # by strike-hold-service, which cannot claim an absence without it.
            - name: ES_MBO_COVERAGE_TOPIC
              value: es.mbo.coverage
            - name: ES_MBO_TAPE_TOPIC
              value: underlying.es.trades
            # TAPE ADMISSION (TapeAdmission, design G 4.4, requirement F E5): a print of another feed, another schema or another instrument is refused and counted instead of being matched against
            # the active contract's orders. The values are what the dev tape carries today, sampled 2026-11-13 on all 32 partitions of underlying.es.trades (the last 50 prints of each, 1,600 prints, no exception):
            # source DATABENTO, sourceSchema trades, instrumentId 10252 for the front contract ESZ6. A contract roll needs the next contract's row here BEFORE the roll date, in step with
            # ES_MBO_CONTRACT_TABLE; until then the first print of the new contract is refused and counted (mbo_tape_otherInstrument), which is the intended alarm.
            - name: ES_MBO_TAPE_SOURCE
              value: DATABENTO
            - name: ES_MBO_TAPE_SOURCE_SCHEMA
              value: trades
            - name: ES_MBO_INSTRUMENT_TABLE
              value: ESZ6=10252
            - name: JAVA_TOOL_OPTIONS
              value: -Xms256m -Xmx1024m
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 2Gi
