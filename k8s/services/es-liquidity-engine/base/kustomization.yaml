# SERVICE SLICE — es-liquidity-engine (the ES MBO liquidity engine) on DEV. Owns ONLY this service's Deployment.
#
# DEV-ONLY: referenced from k8s/overlays/dev (NOT k8s/base, NOT production or experiment); services.yaml declares envs: [dev]. One JVM: a supervisor over the drop-classifier engine
# (ES_TRADES mode, publishes es.drop.*) and the MBO engine. No Service object: kubelet probes reach the pod directly. No ConfigMap, Secret or PVC of its own.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - es-liquidity-engine-deployment.yaml
