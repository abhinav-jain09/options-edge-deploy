# short-premium-agent — Agent A (live 0DTE SPX credit-spread recommender) + Agent B
# (end-of-day system-improvement advisor). ONE Deployment, TWO containers sharing an
# emptyDir at /data so Agent B can read the paper book / audits that Agent A writes
# (separate pods could not share a filesystem, and a CronJob is forbidden in the
# service slice by validate-services.sh's blast-radius rule).
#
# Both containers use the SAME Python image (SP_BACKEND=sdk → ANTHROPIC_API_KEY from
# options-edge-runtime-secrets). Agent A self-gates market hours; Agent B self-schedules
# to SP_EOD_TIME ET. DEV is ENABLED (SP_ENABLED=1 on both containers); agent-a still only
# acts inside SP_MARKET_GATE (09:35-16:00 ET) and refuses synthetic data, so cost is bounded
# to real market hours. To pause: set SP_ENABLED=0 here + re-run service-deploy (a dedicated
# short-premium-toggle Jenkins job that does `kubectl set env` is a tracked follow-up).
# DEV-ONLY (envs: [dev]).
# The dev overlay remaps the prod-registry base ref → host.docker.internal:5001 via its
# images: transformer.
#
# NOTE: /data (paper book, audits, daily cost) is an emptyDir — ephemeral, wiped on every
# pod restart/rollout. Acceptable for paper/Phase-0; a durable store (Postgres) is the
# follow-up for cross-restart history + the web Paper Trades page (separate pod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: short-premium-agent-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: short-premium-agent-service
    app.kubernetes.io/component: short-premium-agent-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: short-premium-agent-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: short-premium-agent-service
        app.kubernetes.io/component: short-premium-agent-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        # ---- Agent A: live recommender (entrypoint = run_agent.py) ----
        - name: agent-a
          image: 192.168.100.252:5000/options-edge-short-premium-agent:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config          # KAFKA_BOOTSTRAP_SERVERS, SCHEMA_REGISTRY_URL, …
            - secretRef:
                name: options-edge-runtime-secrets  # ANTHROPIC_API_KEY (SP_BACKEND=sdk)
          env:
            # --- control (SP_ENABLED; DEV is ENABLED — self-gates market hours via SP_MARKET_GATE) ---
            - {name: SP_ENABLED,        value: "1"}
            # OPEN-SOURCE backend: local Ollama (Qwen2.5) on the Mac host — $0/call, NO Claude.
            - {name: SP_BACKEND,        value: "ollama"}
            - {name: SP_OLLAMA_URL,     value: "http://host.docker.internal:11434"}
            - {name: SP_OLLAMA_MODEL,   value: "qwen2.5:72b"}
            - {name: SP_EMIT_KAFKA,     value: "1"}       # publish recs to the gateway topic
            - {name: SP_HEALTH_PORT,    value: "8130"}
            # --- model (SP_MODEL only used by anthropic backends; ollama uses SP_OLLAMA_MODEL) ---
            - {name: SP_MODEL,          value: "claude-opus-4-8"}
            - {name: SP_MAX_TOKENS,     value: "4000"}
            # --- strategy guardrails ---
            - {name: SP_WING,           value: "5"}
            - {name: SP_MIN_CREDIT,     value: "2.50"}
            - {name: SP_MAX_TRADES,     value: "2"}
            - {name: SP_QTY,            value: "1"}
            - {name: SP_SYMBOL,         value: "SPX"}
            # --- cadence: 60s normal, ramps to 30s in the final 5 min into the close ---
            #     (USER 2026-07-12: once a minute normally, faster into the close; not 10-15s)
            - {name: SP_CADENCE,        value: "60"}    # every 60s (free / local Ollama)
            - {name: SP_CADENCE_T10_5,  value: "60"}    # T-10..T-5 → 60s
            - {name: SP_CADENCE_FINAL5, value: "30"}    # final 5 min → 30s (0DTE resolves into close)
            # --- market gate / data integrity ---
            - {name: SP_OPEN,           value: "09:35"}
            - {name: SP_CLOSE,          value: "16:00"}
            - {name: SP_MARKET_GATE,    value: "1"}
            # SP_REQUIRE_REAL=0 in BOTH envs, but for different reasons:
            #  - dev: the feed is a pure SYNTHETIC simulator (APP_PROFILE=dev) — accepted to exercise
            #    the recommend→overlay pipeline.
            #  - prod: the feed is LIVE, but SPOT is a DERIVED value (computed from the live chain) that
            #    still carries the "SYNTHETIC" quality tag — it's real, current data, so refusing it
            #    would leave the agent idle on genuinely live prices.
            # The freshness gate (SP_MAX_AGE) still refuses STALE data in both, so a dead feed is caught.
            - {name: SP_REQUIRE_REAL,   value: "0"}
            - {name: SP_MAX_AGE,        value: "20"}
            - {name: SP_REC_TOPIC,      value: "options.short-premium.recommendation"}
            # --- shared paper-book/audit/cost state (read by Agent B in the sidecar) ---
            - {name: SP_BOOK,           value: "/data/paper_book.json"}
            - {name: SP_AUDIT_DIR,      value: "/data/audit"}
            - {name: SP_COST,           value: "/data/daily_cost.json"}
          volumeMounts:
            - {name: sp-data, mountPath: /data}
          ports:
            - {name: health, containerPort: 8130}
          livenessProbe:
            httpGet: {path: /health, port: health}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /health, port: health}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits:   {memory: 512Mi}
        # ---- Agent B: end-of-day advisor daemon (entrypoint override) ----
        - name: agent-b
          image: 192.168.100.252:5000/options-edge-short-premium-agent:dev
          imagePullPolicy: Always
          command: ["python", "run_agent_b.py", "--daemon"]
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - {name: SP_ENABLED,   value: "1"}       # matches agent-a; daemon runs the EOD review when 1
            # OPEN-SOURCE backend (same as agent-a): local Ollama — $0/call, NO Claude.
            - {name: SP_BACKEND,   value: "ollama"}
            - {name: SP_OLLAMA_URL,   value: "http://host.docker.internal:11434"}
            - {name: SP_OLLAMA_MODEL, value: "qwen2.5:72b"}
            - {name: SP_MODEL,     value: "claude-opus-4-8"}
            - {name: SP_SYMBOL,    value: "SPX"}
            - {name: SP_EOD_TIME,  value: "16:05"}
            # same shared state paths as Agent A (same pod, shared /data)
            - {name: SP_BOOK,      value: "/data/paper_book.json"}
            - {name: SP_AUDIT_DIR, value: "/data/audit"}
            - {name: SP_COST,      value: "/data/daily_cost.json"}
          volumeMounts:
            - {name: sp-data, mountPath: /data}
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits:   {memory: 256Mi}
      volumes:
        - name: sp-data
          emptyDir: {}
