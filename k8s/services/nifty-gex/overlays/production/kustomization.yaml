# STANDALONE nifty-gex overlay — production. Used ONLY by Jenkinsfile.nifty-gex-service.
# The monolithic prod deploy renders this service via k8s/overlays/production.
#
# ⚠ MIRROR RULE: every nifty-gex-targeting patch in k8s/overlays/production/kustomization.yaml
# MUST be replicated here. scripts/ci/validate-services.sh enforces render equivalence.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # Mirror of the monolith's all-Deployments IfNotPresent + progressDeadlineSeconds
  # patches, scoped to this service.
  - target:
      kind: Deployment
      name: nifty-gex-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/progressDeadlineSeconds
        value: 1200

# MIRROR of the monolithic k8s/overlays/production images: block (validate-services: mono==slice).
# That block exists so a committed production render never carries the base :dev ref - a raw
# `kubectl apply` of this slice would otherwise roll the dev image into production. The monolith
# gained this mapping on 2026-10-18; without the same mapping here the two renders disagree and the
# mirror rule fails, which is how this file came to need editing at all.
# Deploy behaviour is unchanged either way: service-deploy.sh remaps via image-tags/production.yaml
# and digest-pins fail-closed before any apply. This hardens the at-rest render only.
images:
  - name: 192.168.100.252:5000/options-edge-nifty-gex
    newTag: prod
