# STANDALONE public Gamma Lab overlay — production.
#
# ⚠️ The Deployment ships at replicas: 0 and stays there until PGL-072's evidence exists for the
# exact image digest (scripts/deploy/verify-public-gate.sh). Raising it is a reviewed change that
# carries that evidence, not an edit made in passing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# PGL-072. The image is PINNED TO A DIGEST here, in git, rather than left as a tag for the deploy to
# resolve later.
#
# WHY. The gate refuses a public replica whose image is not digest-pinned, because a tag can be
# re-pushed and evidence gathered against it proves nothing about what will actually run. That is not
# theoretical: on 2026-08-16 `:prod` resolved to four different digests inside twenty minutes while
# options-edge-web-deploy ran four times, so "read the digest, run the tests, write the evidence,
# deploy" was a race that lost twice.
#
# `common-infra-deploy` gates the OVERLAY as written and never remaps, so a tag here fails it outright
# — which is what blocked bo-app-postgres from deploying at all. `service-deploy` remaps dev→prod and
# then pins; a digest is already pinned, so its remap finds no `:dev` to rewrite and its pin is a
# no-op. Both paths therefore agree on one immutable image.
#
# THIS DIGEST HAS EVIDENCE, EARNED BEFORE THIS EDIT: public-gate-evidence #25 attested
# sha256:0414b000… built from main at 8a522e96 (which contains options-edge#655,
# 86433216 — the evidence qualifies the ARTEFACT, not one commit inside it) and recorded PGL-050/051/052 as PASS
# against that exact digest. The job resolves the revision from the registry rather than
# taking it from the operator, and refuses unless the checkout under test matches — it did
# refuse twice while this was being prepared, because the image on :prod had been built
# from an earlier commit, which is exactly the mistake it exists to catch.
#
# WHY: the digest this replaces carried a REGRESSION OF ITS OWN, reported from the live
# site at 04:55 ET — "why it says board is filling, no data on the screen", and then, of
# INTC, "board is filling, after sometime graph appears why". With the market SHUT a board
# still enters `warming`, finds no OPRA quotes, and sits there for the full 120s warm
# deadline before admitting it. The outgoing build waited that out, so an evening reader got
# two minutes of "the board is filling…" and then a chart — and that chart was never a board
# that had filled. It was the CLOSING board, ready from the first second, held back by the
# page. Measured on the live service: INTC state=degraded,
# reason=WARM_DEADLINE_EXCEEDED_MARKET_CLOSED, marketOpen=False, quoted=0.
#
# The incoming build falls back at once when marketOpen is false. That field is consulted
# ONLY to shorten the wait, never to extend it: the service documents market_open_now() as a
# weekday/session CLOCK, not a trading calendar — it reads true through regular hours on
# exchange holidays — so such a day takes the slow path and waits out the bounded deadline.
# The field can make the closing board arrive sooner; it can never keep it away.
#
# Changing this line means producing evidence for the new digest FIRST — that is the point of it
# being a reviewed edit rather than a deploy-time lookup.
#
# WHAT ELSE MOVES WITH IT. The image is built from main, so advancing this digest ships
# everything merged since the outgoing one: 48f8b7a7 (build #1104) -> 8a522e96 (build #1114),
# 23 commits, 62 files — of which 51 are tests. The runtime source delta is
# RuntimeProfileConfig, OptionMonitorWebServer, WebNav, and the context-tape, multileg,
# option-chain, strike-board and gamma-lab assets.
#
# Only one of those ASSET SETS reaches this surface, and USER 2026-08-27 confirmed the rule
# it follows: the Gamma Lab is public and nothing else is. PUBLIC_SURFACE_PATHS is an
# allowlist — "/",
# /gamma-lab(.js|.css), /leaderboard*, /env.js, /option-chain-auth.*, /feed-url.js,
# /favicon.ico, /register — and every other path falls through to denyAll. context-tape,
# multileg, option-chain and strike-board are not on it and cannot be fetched here at all;
# their assets ride in the image and are unreachable. The shared runtime pieces
# (RuntimeProfileConfig, OptionMonitorWebServer, WebNav) DO apply, and each went through its
# own review on main. PGL-050/051/052 qualify the public security boundary and nothing else,
# which is why this note exists rather than an implied "it is just the one fix".
#
# ROLLBACK TARGET: the OUTGOING digest is sha256:5afc846f… (evidence #24).
#
# IT IS DURABLE, and the reason is structural rather than a promise. Every prod build pushes
# a per-build tag beside the moving :prod one — `prod-<build>-<sha12>`, precisely so a digest
# can be named after :prod has moved on. This one is prod-1104-48f8b7a7d647, verified to
# resolve to 5afc846f at the time of this edit. A registry garbage-collect deletes only
# manifests NO TAG references, so that tag is what protects it; the GC in
# offhours-clean-slate is in any case gated on RECLAIM_DOCKER and points at the local dev
# registry container, not at 192.168.100.252:5000, and nothing in this repository deletes
# prod-* tags. Roll back by digest or by that tag.
#
# For the GAMMA LAB it is the same page without the closed-market shortcut: two minutes of
# "the board is filling…" before the closing board appears, every time the site is opened
# outside market hours, which is most of the day. It KEEPS the four fixes 5afc846f
# introduced. Rolling back also reverts the shared runtime pieces above — judge it against
# those too. (sha256:976030…, evidence #20, is older still; not a rollback candidate.)
images:
  - name: 192.168.100.252:5000/options-edge-web
    newName: 192.168.100.252:5000/options-edge-web
    digest: sha256:0414b000be757c5c76713af92b2c4228aede58b1e56d5a595ef664d1ff7dedae
