# STANDALONE public Gamma Lab overlay — production.
#
# ⚠️ The Deployment ships at replicas: 0 and stays there until PGL-072's evidence exists for the
# exact image digest (scripts/deploy/verify-public-gate.sh). Raising it is a reviewed change that
# carries that evidence, not an edit made in passing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# PGL-072. The image is PINNED TO A DIGEST here, in git, rather than left as a tag for the deploy to
# resolve later.
#
# WHY. The gate refuses a public replica whose image is not digest-pinned, because a tag can be
# re-pushed and evidence gathered against it proves nothing about what will actually run. That is not
# theoretical: on 2026-08-16 `:prod` resolved to four different digests inside twenty minutes while
# options-edge-web-deploy ran four times, so "read the digest, run the tests, write the evidence,
# deploy" was a race that lost twice.
#
# `common-infra-deploy` gates the OVERLAY as written and never remaps, so a tag here fails it outright
# — which is what blocked bo-app-postgres from deploying at all. `service-deploy` remaps dev→prod and
# then pins; a digest is already pinned, so its remap finds no `:dev` to rewrite and its pin is a
# no-op. Both paths therefore agree on one immutable image.
#
# THIS DIGEST HAS EVIDENCE, EARNED BEFORE THIS EDIT: public-gate-evidence #27 attested
# sha256:2c9052ff… built from main at 2652a204 by options-edge-web-deploy #1151 (the
# evidence qualifies the ARTEFACT, not one commit inside it) and recorded PGL-050/051/052 as PASS
# against that exact digest. The job resolves the revision from the registry rather than
# taking it from the operator, and refuses unless the checkout under test matches — it did
# refuse twice while this was being prepared, because the image on :prod had been built
# from an earlier commit, which is exactly the mistake it exists to catch.
#
# WHY: "why after sometime view get reset". The reader would zoom into a price band and,
# minutes later, find the chart back at its default window. MEASURED by driving the page
# through every kind of refresh: an ordinary poll HELD, a new expiry appearing HELD, an
# expiry vanishing HELD — and a swap to the frozen closing board RESET it, "27 of 200" back
# to "53 of 200", then RESET again on the way back to live.
#
# The page falls back to the frozen board when a live poll is FALLBACK-ELIGIBLE and a usable
# frozen board exists — not on every hiccup: a degraded board that still carries strikes is
# drawn, and an actionable failure is reported rather than replaced. What does reach the
# fallback is an EMPTY live board, which is what a freshly created one is, so an idle
# retirement or a restart can produce it. The
# closing board is a previous session's, its expiry list differs, and the frame's identity is
# symbol#expiries — so the swap read as a NEW SELECTION and the window was discarded twice.
#
# The incoming build carries the window BY STRIKE: {offset, width} name different strikes on a
# different axis, so on a source swap the first and last strike on screen are looked up in the
# new axis and the window is rebuilt around them. A reader-driven change — new symbol, new
# slider position — still gets the default window, because those are new questions.
#
# WHAT ELSE MOVES WITH IT. The image is built from main, so advancing this digest ships
# everything merged since the outgoing one: 8a522e96 (build #1114) -> b47cd4d5 (build #1116),
# 4 commits. The non-test source delta is gamma-lab.js, option-chain.js, and the tape-zones /
# zones assets.
#
# Only one of those ASSET SETS reaches this surface, and USER 2026-08-27 confirmed the rule it
# follows: the Gamma Lab is public and nothing else is. PUBLIC_SURFACE_PATHS is an allowlist —
# "/", /gamma-lab(.js|.css), /leaderboard*, /env.js, /option-chain-auth.*, /feed-url.js,
# /favicon.ico, /register — and every other path falls through to denyAll. option-chain,
# tape-zones and zones are not on it and cannot be fetched here at all; their assets ride in
# the image unreachable. PGL-050/051/052 qualify the public security boundary and nothing
# else, which is why this note exists rather than an implied "it is just the one fix".
#
# ROLLBACK TARGET: the OUTGOING digest is sha256:0414b000… (evidence #25).
#
# IT IS DURABLE, and the reason is structural rather than a promise. Every prod build pushes
# a per-build tag beside the moving :prod one — `prod-<build>-<sha12>`, precisely so a digest
# can be named after :prod has moved on. This one is prod-1114-8a522e96a376, verified to
# resolve to 0414b000 at the time of this edit. A registry garbage-collect deletes only
# manifests NO TAG references, so that tag is what protects it; the GC in
# offhours-clean-slate is in any case gated on RECLAIM_DOCKER and points at the local dev
# registry container, not at 192.168.100.252:5000, and nothing in this repository deletes
# prod-* tags. Roll back by digest or by that tag.
#
# For the GAMMA LAB it is the same page without the strike-anchored window: the reader's zoom
# is discarded whenever the page swaps to the frozen board and back, so a few minutes of
# reading is undone by a poll they never saw. It KEEPS everything 0414b000 carried, including
# the closed-market shortcut. This advancement touches no shared runtime code — the delta is
# the five assets named above and their tests — so there is nothing else to weigh.
# (sha256:5afc846f…, evidence #24, is older still; not a rollback candidate.)
images:
  - name: 192.168.100.252:5000/options-edge-web
    newName: 192.168.100.252:5000/options-edge-web
    digest: sha256:2c9052ff041a995462da8c3643170b1eb2238db9c01a5e21ccb9281ab9b9f6ce
