# STANDALONE public Gamma Lab overlay — production.
#
# ⚠️ The Deployment ships at replicas: 0 and stays there until PGL-072's evidence exists for the
# exact image digest (scripts/deploy/verify-public-gate.sh). Raising it is a reviewed change that
# carries that evidence, not an edit made in passing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# PGL-072. The image is PINNED TO A DIGEST here, in git, rather than left as a tag for the deploy to
# resolve later.
#
# WHY. The gate refuses a public replica whose image is not digest-pinned, because a tag can be
# re-pushed and evidence gathered against it proves nothing about what will actually run. That is not
# theoretical: on 2026-08-16 `:prod` resolved to four different digests inside twenty minutes while
# options-edge-web-deploy ran four times, so "read the digest, run the tests, write the evidence,
# deploy" was a race that lost twice.
#
# `common-infra-deploy` gates the OVERLAY as written and never remaps, so a tag here fails it outright
# — which is what blocked bo-app-postgres from deploying at all. `service-deploy` remaps dev→prod and
# then pins; a digest is already pinned, so its remap finds no `:dev` to rewrite and its pin is a
# no-op. Both paths therefore agree on one immutable image.
#
# THIS DIGEST HAS EVIDENCE, EARNED BEFORE THIS EDIT: public-gate-evidence #46 attested
# sha256:bd966b23… , recorded PGL-050/051/052 as PASS with 11 + 3 startup/isolation tests green,
# and reported "digest unchanged across the run". BUILD_IMAGE was false, as this job now REFUSES
# true outright: it holds no permitted commit for the image publisher, so the image is built under
# options-edge-web-deploy's own permission first (#1291, PERMITTED_SHA 3490fe92) and attested
# afterwards. That is also why attesting never rebuilds: on 2026-08-16 rebuilding to attest
# produced four digests in twenty minutes and the evidence chased a moving tag.
#
# WHY THIS MOVES. The Gamma Lab's "Near Flip →" link is BACK (owner, 2026-09-21). It was removed
# on 2026-09-08 — "this is not working very well" — and the reason it was worth removing still
# stands: the page shows one filtered list, and on a session where nothing meets the filter a
# reader following the link arrives at an empty page. The 2026-09-18 board is exactly that case:
# seven names qualified across all 504 boards (FANG, MRK, MO, PG, COHR, DELL, TPL) and not one of
# them is in the 84-name page universe. The owner was offered the two hidden lists back alongside
# and chose the link alone, so that cost is deliberate and is recorded here rather than forgotten.
#
# WHAT ELSE MOVES WITH IT: THIRTY-FOUR commits, 1fbaf38b -> 3490fe92. The public ALLOWLIST DOES
# NOT CHANGE. Both PUBLIC_SURFACE_PATHS and PUBLIC_SURFACE_API_PATHS were extracted from
# SecurityConfig.java at each commit and compared — byte-identical. The comparison itself was
# checked first: an earlier attempt truncated each list at the first semicolon and reported
# "identical" over a fragment that did not even contain /flips, which the live site answers 200
# for. A comparison that cannot see the thing it compares proves nothing, so the extractor is
# asserted to find /flips before its verdict is believed. Premium Danger Clock paths did arrive
# in this range, in PUBLIC_PATHS — the INTERNAL deployment's list, which this surface never reads.
#
# ⚠️ The prose and the digest drifted apart TWICE before this edit: the block described
# sha256:c6f72c47… from 52d9496b while the digest line held 29a9adae (prod-1274-1fbaf38b0570).
# Whoever edits this next: the paragraph and the digest are one change.
#
# ROLLBACK TARGET: the OUTGOING digest is
# sha256:29a9adae9097c17c861eec668312988cb0d1419eab67f604bfd4a3bb13fef0d3, durable tag
# prod-1274-1fbaf38b0570, re-resolved against the registry at the time of this edit and present.
# The incoming one has prod-1291-3490fe927018, resolved the same way. Every prod build pushes a
# per-build tag beside the moving :prod one, and a garbage-collect deletes only manifests no tag
# references, so both stay reachable by name.
#
images:
  - name: 192.168.100.252:5000/options-edge-web
    newName: 192.168.100.252:5000/options-edge-web
    digest: sha256:bd966b234470b8948d4163ff47a6fb12bf0f0a3a8f895c575059528a010c4853
