# STANDALONE public Gamma Lab overlay — production.
#
# ⚠️ The Deployment ships at replicas: 0 and stays there until PGL-072's evidence exists for the
# exact image digest (scripts/deploy/verify-public-gate.sh). Raising it is a reviewed change that
# carries that evidence, not an edit made in passing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# PGL-072. The image is PINNED TO A DIGEST here, in git, rather than left as a tag for the deploy to
# resolve later.
#
# WHY. The gate refuses a public replica whose image is not digest-pinned, because a tag can be
# re-pushed and evidence gathered against it proves nothing about what will actually run. That is not
# theoretical: on 2026-08-16 `:prod` resolved to four different digests inside twenty minutes while
# options-edge-web-deploy ran four times, so "read the digest, run the tests, write the evidence,
# deploy" was a race that lost twice.
#
# `common-infra-deploy` gates the OVERLAY as written and never remaps, so a tag here fails it outright
# — which is what blocked bo-app-postgres from deploying at all. `service-deploy` remaps dev→prod and
# then pins; a digest is already pinned, so its remap finds no `:dev` to rewrite and its pin is a
# no-op. Both paths therefore agree on one immutable image.
#
# THIS DIGEST HAS EVIDENCE, EARNED BEFORE THIS EDIT: public-gate-evidence #35 attested
# sha256:f44f06be… built from main at 845207a6 by options-edge-web-deploy #1203, and recorded
# PGL-050/051/052 as PASS against that exact digest, with "digest unchanged across the run".
# BUILD_IMAGE was false on purpose: the image was already on :prod and already serving the
# internal surface, so the attestation qualifies the artefact that will actually run rather
# than a fresh build nobody has looked at. Rebuilding to attest is how 2026-08-16 produced
# four digests in twenty minutes.
#
# WHY THIS MOVES. The owner asked for the sentence under "At the flip, positive gamma
# dominant" to come off the Near Flip page (2026-09-04). The internal surface got it with
# web-service-deploy #703; this surface has its own pinned image, so until this edit the
# public page kept showing the line the internal one had dropped.
#
# WHAT ELSE MOVES WITH IT. The image is built from main, so advancing this digest ships
# everything merged since the outgoing one: c85d503c (build #1183) -> 845207a6 (build #1203),
# 28 commits — the delta-flow acceleration publisher, the pressure boards, the hunt voice fix,
# the strike board's work, and flips.js.
#
# THE PUBLIC BOUNDARY DOES NOT MOVE. PUBLIC_SURFACE_PATHS and PUBLIC_SURFACE_API_PATHS are
# byte-for-byte identical at c85d503c and 845207a6 — compared explicitly before this edit,
# because "28 commits" is exactly the circumstance in which a new public path arrives
# unnoticed. The pressure boards' shells were added to PUBLIC_PATHS, which is the INTERNAL
# deployment's list; this surface's allowlist never saw them, and everything not on it falls
# through to denyAll. The rule the owner set on 2026-08-27 — the Gamma Lab is public and
# nothing else is, with Near Flip since — still holds exactly as it did.
#
# ROLLBACK TARGET: the OUTGOING digest is sha256:8b3aa3c2… (evidence #34), durable tag
# prod-1183-c85d503cd90d, verified present in the registry at the time of this edit. The
# incoming one has prod-1203-845207a619f6 for the same reason: every prod build pushes a
# per-build tag beside the moving :prod one, and a registry garbage-collect deletes only
# manifests no tag references. Roll back by digest or by that tag.
#
images:
  - name: 192.168.100.252:5000/options-edge-web
    newName: 192.168.100.252:5000/options-edge-web
    digest: sha256:f44f06be56b66645b9bb8dc644b01ff90a77116f60cce46eb4daf7c33e73a4db
