# SERVICE SLICE — market-commentary. Owns ONLY this service's Deployment.
#
# Referenced from k8s/overlays/dev and k8s/overlays/production (shadow), at replicas: 1. Single replica only: its
# transactional.id is per environment, so a second instance would fence the first.
#
# No Service object on purpose (the market-structure / vol-state pattern): kubelet probes reach the pod directly.
# What reads this service's output reads it from Kafka (options.spx.market-commentary.current for the newest state).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - market-commentary-deployment.yaml
