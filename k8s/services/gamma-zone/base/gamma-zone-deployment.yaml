apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamma-zone-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: gamma-zone-service
    app.kubernetes.io/component: gamma-zone-service
    app.kubernetes.io/part-of: options-edge
spec:
  # DEV ONLY (services.yaml envs: [dev]). Measures the trading zone a heavy dealer-gamma strike
  # anchors: the price at which the session's traded volume balances, the extreme of the completed
  # leg, and how far the other side must travel to round-trip that inventory. Publishes the
  # measurement and its evidence on options.spx.gamma-zone.{current,log,profile}.
  # SHADOW: it never trades, emits no signal and adds no decision consumer. It reads ONE market
  # topic, es.futures.footprint.bars, and writes THREE of its own: .current (the newest measurement
  # per session), .log (every emission, the corpus) and .profile (the session's whole volume profile,
  # which is what answers "how many contracts traded between these two strikes" -- the measurement
  # carries the ratio curve for +/-30 points and a level count, a different question).
  # SINGLE replica (strategy Recreate): the log is a totally ordered record of what the service
  # said and when, and both outputs are keyed by session, so one writer owns them. Recreate fences
  # the predecessor before the new pod starts rather than running two writers side by side.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gamma-zone-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gamma-zone-service
        app.kubernetes.io/component: gamma-zone-service
        app.kubernetes.io/part-of: options-edge
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gamma-zone
          # Base-registry name, like every other base manifest: the dev overlays (monolith AND the
          # standalone slice) remap it to host.docker.internal:5001 via `images:`, and apply.sh's
          # digest-pin loop keys its rewrite on exactly this `<base registry>/<image>` name.
          image: 192.168.100.252:5000/options-edge-gamma-zone:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config              # the shared platform config (broker and registry addresses)
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            # The INPUT topic, named in full. The code's default is the bare "futures.footprint.bars"
            # and TOPIC_PREFIX is empty on dev, so without this the service resolves a topic that
            # does not exist and refuses to start -- which it did, on the first real rollout, with
            # "input topic has no partitions: futures.footprint.bars". Every other reader of this
            # tape names it the same way (k8s/base/feed-gateway-deployment.yaml, the es4 services).
            # The local probe passed the topic as an argument, so it never exercised this
            # resolution: a probe that bypasses settings cannot check the settings.
            - name: KAFKA_ES_FOOTPRINT_BARS_TOPIC
              value: es.futures.footprint.bars
            # The series the zone is measured on. The round trip is a session-scale measurement and
            # the reversal is judged on closes: a coarser bar would place the turn later than it
            # happened, a finer one would multiply the bars without adding a contract to the profile.
            # "ES.v.0", not "ES": the footprint producer stamps a VERSIONED contract identity, read
            # off the live dev tape rather than assumed. A symbol that names no series makes this
            # service fold nothing AND refuse nothing, which is indistinguishable from no input at
            # all -- so the emission publishes every series the tape carries beside this value.
            - name: GAMMA_ZONE_SYMBOL
              value: ES.v.0
            - name: GAMMA_ZONE_TIMEFRAME
              value: 1m
            # 20 hours, so the seek on every start lands BEFORE any session's first bar and the
            # session roll is OBSERVED in the stream. Only an observed roll proves the profile covers
            # the whole session; without it the emission publishes sessionStartObserved=false rather
            # than presenting a partial profile as the session's.
            - name: GAMMA_ZONE_LOOKBACK_MS
              value: "72000000"
            # Contracts before a balance price is reported at all. Below roughly this the profile is
            # a few hundred prints and its balance moves points per bar.
            - name: GAMMA_ZONE_MIN_VOLUME
              value: "50000"
            # THE RETRACE, ON CLOSES, THAT CONFIRMS A LEG IS FINISHED -- a share of the session's
            # OWN close range, not a constant. The service shipped with a flat 5.00 points; replayed
            # over four live sessions it cut them into 159, 75, 103 and 38 confirmed legs, and the
            # "stretch" it then picked covered only 0.30, 0.33, 0.42 and 0.29 of each session's close
            # range. Those four sessions ranged 76.57 to 210.97 points, a factor of 2.75, so no one
            # number is the right retrace for all of them.
            #
            # FLOOR 5.00 points: what was deployed. Keeping it as the floor means the rule can only
            # ever make the threshold coarser than the shipped value, never finer.
            - name: GAMMA_ZONE_REVERSAL_MIN_CENTS
              value: "500"
            # CEILING 50.00 points: nearly double the widest the rule produced over those four
            # sessions (26.25, on 2026-11-09's 210.97-point range). It exists because TOO COARSE
            # fails silently -- at a sixth of the range that session confirmed only 3 legs, its
            # 209-point main move was still in flight at the close, and the stretch fell back to a
            # 64-point scrap. The emission names that case (swing.stretchExceededByCurrentLeg).
            - name: GAMMA_ZONE_REVERSAL_MAX_CENTS
              value: "5000"
            # 1250 basis points = one eighth of the close range. Of every fraction swept over those
            # four sessions it gave the best worst case: the stretch covered 0.46, 0.99, 0.59 and
            # 0.51 of the session's range. Still a guess, now with four sessions behind it instead of
            # one; the emission publishes the rule and the range so the corpus can replace it. Set to
            # 0 to run at the floor, which is exactly the behaviour that shipped.
            - name: GAMMA_ZONE_REVERSAL_RANGE_BPS
              value: "1250"
            # With nothing folded the loop still publishes this often, so a service that is refusing
            # every bar shows its refusal tally instead of going quiet. Silence reads as health.
            - name: GAMMA_ZONE_HEARTBEAT_MS
              value: "60000"
            - name: JAVA_TOOL_OPTIONS
              value: -Xmx512m -XX:+UseSerialGC
          resources:
            # No HTTP server and so no probes: one consumer loop and one producer. The pod's health
            # is read from its own emission — barsFolded, the refusal tally and sessionStartObserved
            # on options.spx.gamma-zone.current — which says more than a liveness endpoint would.
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
