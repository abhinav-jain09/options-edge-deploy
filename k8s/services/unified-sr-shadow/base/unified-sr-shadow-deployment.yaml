# PRODUCTION SHADOW ONLY. This workload intentionally has no dev overlay and starts held at zero.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-sr-shadow-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: unified-sr-shadow-service
    app.kubernetes.io/part-of: options-edge
    options-edge.io/mode: shadow
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: unified-sr-shadow-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unified-sr-shadow-service
        app.kubernetes.io/part-of: options-edge
        options-edge.io/mode: shadow
    spec:
      containers:
        - name: unified-sr-shadow
          image: 192.168.100.252:5000/options-edge-unified-sr:prod
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: HEALTH_PORT
              value: "8108"
            - name: UNIFIED_SR_SHADOW_ONLY
              value: "true"
            # Read-only shared inputs. No producer, partition, retention, or schema settings are changed.
            - name: KAFKA_UNIFIED_SR_GEX_TOPIC
              value: options.databento.gex.strike
            - name: KAFKA_UNIFIED_SR_FLOW_TOPIC
              value: options.databento.strike-flow.strike.avro
            - name: KAFKA_UNIFIED_SR_RAW_TOPIC
              value: options.databento.raw
            # Separate sinks, Streams application identity, and local state are mandatory in shadow mode.
            - name: KAFKA_UNIFIED_SR_OUTPUT_TOPIC
              value: options.spx.strike-sr.current.shadow
            - name: KAFKA_UNIFIED_SR_HISTORY_TOPIC
              value: options.spx.strike-sr.history.shadow
            - name: KAFKA_UNIFIED_SR_STREAMS_APP_ID
              value: options-edge-unified-sr-shadow
            - name: KAFKA_UNIFIED_SR_STREAMS_COMMIT_INTERVAL_MS
              value: "1000"
            - name: KAFKA_UNIFIED_SR_STREAMS_NUM_THREADS
              value: "2"
            - name: KAFKA_UNIFIED_SR_AUTO_OFFSET_RESET
              value: latest
            - name: KAFKA_STREAMS_STATE_DIR
              value: /var/lib/options-edge/kafka-streams/unified-sr-shadow
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx1g"
          ports:
            - name: health
              containerPort: 8108
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-shadow-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: kafka-streams-shadow-state
          emptyDir: {}
