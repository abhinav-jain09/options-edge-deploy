apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamma-effort-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: gamma-effort-service
    app.kubernetes.io/component: gamma-effort-service
    app.kubernetes.io/part-of: options-edge
spec:
  # DEV ONLY (services.yaml envs: [dev]). SPX gamma measured against ES contracts traded: at each
  # strike, the forced dealer hedge the gamma implies against the aggressive flow the footprint
  # actually carried in the direction of travel. Publishes on
  # options.spx.gamma-effort.{current,log}.
  # SHADOW: it never trades, issues no final verdict and adds no decision consumer. It reads TWO
  # market topics -- es.futures.footprint.bars (the flow) and options.databento.gex.strike (the
  # gamma) -- and writes two of its own.
  # SINGLE replica (strategy Recreate): the log is a totally ordered record of what the service
  # said and both outputs are keyed by session, so one writer owns them. Recreate fences the
  # predecessor before the new pod starts rather than running two writers side by side.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gamma-effort-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gamma-effort-service
        app.kubernetes.io/component: gamma-effort-service
        app.kubernetes.io/part-of: options-edge
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gamma-effort
          # Base-registry name, like every other base manifest: the dev overlays remap it to
          # host.docker.internal:5001 via `images:`, and apply.sh's digest-pin loop keys its rewrite
          # on exactly this `<base registry>/<image>` name.
          image: 192.168.100.252:5000/options-edge-gamma-effort:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config              # the shared platform config (broker and registry addresses)
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            # THE FLOW. Named in full: the code's default is the bare "futures.footprint.bars" and
            # TOPIC_PREFIX is empty on dev, so without this the service resolves a topic that does
            # not exist and refuses to start. gamma-zone learned this on its first real rollout.
            - name: KAFKA_ES_FOOTPRINT_BARS_TOPIC
              value: es.futures.footprint.bars
            # THE GAMMA. SPX per-strike dealer gamma, read as a generic Avro record because its
            # subject is ENV_LOCAL and the manifest cannot bind it (see the service's pom).
            - name: KAFKA_GAMMA_EFFORT_GEX_TOPIC
              value: options.databento.gex.strike
            # "ES.v.0", not "ES": the footprint producer stamps a VERSIONED contract identity, read
            # off the live dev tape rather than assumed. A symbol that names no series folds nothing
            # AND refuses nothing, which is indistinguishable from no input at all.
            - name: GAMMA_EFFORT_SYMBOL
              value: ES.v.0
            - name: GAMMA_EFFORT_TIMEFRAME
              value: 1m
            # SECTION 13.1's VALUES, AND SECTION 12.3 MEASURED THEM AS WEAK. At CROSS_DIST = 5 the
            # effort ratio exceeded 1 on 53% of the 2026-11-11 cash minutes -- near maximum entropy
            # -- because the median hedge requirement (91 contracts) sits below the median
            # per-minute flow (131). The sweep said the answer is nearer 20 than 5. They are left at
            # the specified values anyway: section 11 forbids tuning on one session, and changing
            # them before the corpus exists would bake one day's accident into the service. Every
            # emission carries the values it was computed under, so the corpus can settle it.
            - name: GAMMA_EFFORT_CROSS_DIST_CENTS
              value: "500"
            - name: GAMMA_EFFORT_ZONE_CENTS
              value: "200"
            - name: GAMMA_EFFORT_WINDOW_MS
              value: "60000"
            # Below this a strike's hedge is a rounding error against a minute of ES flow and the
            # ratio is noise, so the strike is not scored at all rather than scored meaninglessly.
            - name: GAMMA_EFFORT_MIN_GEX_DOLLARS
              value: "50000000"
            # 20 hours of tape, so the seek on every start lands BEFORE any session's first bar.
            - name: GAMMA_EFFORT_BARS_LOOKBACK_MS
              value: "72000000"
            # The gex topic is COMPACTED and large; the producer re-sweeps every strike often, so a
            # two-hour lookback still yields a complete map. The emission publishes the strike count,
            # so a lookback that did NOT cover a sweep is visible rather than assumed away.
            - name: GAMMA_EFFORT_GEX_LOOKBACK_MS
              value: "7200000"
            # Past this the map is still used -- an old map beats no map -- but the emission says
            # `stale`, because a reading taken against an hour-old map is a different reading.
            - name: GAMMA_EFFORT_GEX_STALE_MS
              value: "900000"
            # With nothing folded the loop still publishes this often, so a service refusing every
            # bar shows its refusal tally instead of going quiet. Silence reads as health.
            - name: GAMMA_EFFORT_HEARTBEAT_MS
              value: "60000"
            - name: JAVA_TOOL_OPTIONS
              value: -Xmx512m -XX:+UseSerialGC
          resources:
            # No HTTP server and so no probes: two consumer loops and one producer. The pod's health
            # is read from its own emission -- barsFolded, the refusal tally, and the gamma map's
            # strike count and staleness on options.spx.gamma-effort.current.
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
