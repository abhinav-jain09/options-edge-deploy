apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamma-effort-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: gamma-effort-service
    app.kubernetes.io/component: gamma-effort-service
    app.kubernetes.io/part-of: options-edge
spec:
  # DEV ONLY (services.yaml envs: [dev]). SPX gamma measured against ES contracts traded: at each
  # strike, the forced dealer hedge the gamma implies against the aggressive flow the footprint
  # actually carried in the direction of travel. Publishes on
  # options.spx.gamma-effort.{current,log}.
  # SHADOW: it never trades, issues no final verdict and adds no decision consumer. It reads TWO
  # market topics -- es.futures.footprint.bars (the flow) and options.databento.gex.strike (the
  # gamma) -- and writes two of its own.
  # SINGLE replica (strategy Recreate): the log is a totally ordered record of what the service
  # said and both outputs are keyed by session, so one writer owns them. Recreate fences the
  # predecessor before the new pod starts rather than running two writers side by side.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gamma-effort-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gamma-effort-service
        app.kubernetes.io/component: gamma-effort-service
        app.kubernetes.io/part-of: options-edge
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gamma-effort
          # Base-registry name, like every other base manifest: the dev overlays remap it to
          # host.docker.internal:5001 via `images:`, and apply.sh's digest-pin loop keys its rewrite
          # on exactly this `<base registry>/<image>` name.
          image: 192.168.100.252:5000/options-edge-gamma-effort:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config              # the shared platform config (broker and registry addresses)
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            # THE FLOW. Named in full: the code's default is the bare "futures.footprint.bars" and
            # TOPIC_PREFIX is empty on dev, so without this the service resolves a topic that does
            # not exist and refuses to start. gamma-zone learned this on its first real rollout.
            - name: KAFKA_ES_FOOTPRINT_BARS_TOPIC
              value: es.futures.footprint.bars
            # THE GAMMA. SPX per-strike dealer gamma, read as a generic Avro record because its
            # subject is ENV_LOCAL and the manifest cannot bind it (see the service's pom).
            - name: KAFKA_GAMMA_EFFORT_GEX_TOPIC
              value: options.databento.gex.strike
            # "ES.v.0", not "ES": the footprint producer stamps a VERSIONED contract identity, read
            # off the live dev tape rather than assumed. A symbol that names no series folds nothing
            # AND refuses nothing, which is indistinguishable from no input at all.
            - name: GAMMA_EFFORT_SYMBOL
              value: ES.v.0
            - name: GAMMA_EFFORT_TIMEFRAME
              value: 1m
            # SECTION 13.1's VALUES, AND SECTION 12.3 MEASURED THEM AS WEAK. At CROSS_DIST = 5 the
            # effort ratio exceeded 1 on 53% of the 2026-11-11 cash minutes -- near maximum entropy
            # -- because the median hedge requirement (91 contracts) sits below the median
            # per-minute flow (131). The sweep said the answer is nearer 20 than 5. They are left at
            # the specified values anyway: section 11 forbids tuning on one session, and changing
            # them before the corpus exists would bake one day's accident into the service. Every
            # emission carries the values it was computed under, so the corpus can settle it.
            - name: GAMMA_EFFORT_CROSS_DIST_CENTS
              value: "500"
            - name: GAMMA_EFFORT_ZONE_CENTS
              value: "200"
            - name: GAMMA_EFFORT_WINDOW_MS
              value: "60000"
            # Below this a strike's hedge is a rounding error against a minute of ES flow and the
            # ratio is noise, so the strike is not scored at all rather than scored meaninglessly.
            - name: GAMMA_EFFORT_MIN_GEX_DOLLARS
              value: "50000000"
            # 20 hours of tape, so the seek on every start lands BEFORE any session's first bar.
            - name: GAMMA_EFFORT_BARS_LOOKBACK_MS
              value: "72000000"
            # The gex topic is COMPACTED and large; the producer re-sweeps every strike often, so a
            # two-hour lookback still yields a complete map. The emission publishes the strike count,
            # so a lookback that did NOT cover a sweep is visible rather than assumed away.
            - name: GAMMA_EFFORT_GEX_LOOKBACK_MS
              value: "7200000"
            # Past this the map is still used -- an old map beats no map -- but the emission says
            # `stale`, because a reading taken against an hour-old map is a different reading.
            - name: GAMMA_EFFORT_GEX_STALE_MS
              value: "900000"
            # The PRICE's own staleness bound, and it is a guard where there was none. The service
            # used to prefer the gamma board's spot copy over the live price off the tape; when the
            # gex consumer died at 06:40:56 on 2026-11-12 that copy froze at 7585.48 for 644
            # minutes while ES traded to 7652, and nothing said so because the only check was for
            # null. The copy is gone and the price is the footprint bar's own SPX-equivalent close;
            # past five minutes with no print the emission says `stale`. Five minutes is
            # UNCALIBRATED: a 1m tape that has not printed for five minutes is not a live price.
            - name: GAMMA_EFFORT_PRICE_STALE_MS
              value: "300000"
            # With nothing folded the loop still publishes this often, so a service refusing every
            # bar shows its refusal tally instead of going quiet. Silence reads as health.
            - name: GAMMA_EFFORT_HEARTBEAT_MS
              value: "60000"
            # ---- THE DEALER-SCALPING MODEL. Each value is labelled with WHOSE number it is, and
            # every one of them also rides every emission under scalp.calibration.provenance. There
            # is NO BACKTEST behind any of them, by instruction: the model ships, runs, and is
            # corrected each evening against that day's data. So the record is the only place a
            # wrong one can be found, and only if it says what it was computed under.
            #
            # MEASURED. The 0DTE board's own spacing: options.databento.gex.strike carried 380
            # distinct keys on 2026-11-12, 187 strikes for the 0DTE expiry spanning 7000 to 8000,
            # which is 5.00 points. The hot strike is a strike, so the grid is the board's.
            - name: GAMMA_EFFORT_STRIKE_GRID_CENTS
              value: "500"
            # OWNER, and the one number here that comes from the model itself. The requirements
            # document states TEN per cent of the peak band, and that is what this runs.
            #
            # IT SHIPPED AT 1.0 FOR A FEW HOURS ON 2026-11-13 AND THAT WAS WRONG. A correction to
            # 1.0 was relayed with figures behind it -- 0.23 and 0.55 per cent at 2026-11-12's two
            # turns -- which turned out to be ONE-POINT buckets measured against the busiest
            # one-point bucket, while this threshold compares FIVE-POINT bands against the busiest
            # band. Six or seven times finer than what it was being compared with. Measured at the
            # right resolution off the same tape: 11-12's low band reads 1.54 per cent and its high
            # band 2.94, and on 11-11 and 11-13 nothing reads under one per cent at all -- so 1.0
            # fires once in three sessions and misses 11-12's high. Ten catches both of its turns.
            #
            # THE CODE DEFAULT IS ALSO 10.0, and this line still has to be right: an explicit env
            # var BEATS the default, so a render left at 1.0 runs 1.0 however the code reads. That
            # is exactly what happened here -- the code was corrected in processing #1775 while
            # this file still said 1.0, and dev ran the wrong threshold while everyone believed it
            # had been fixed. Since processing #1776 the record SAYS SO: the provenance is derived
            # from the value in force, so a render that disagrees with the document publishes
            # `OVERRIDDEN` rather than borrowing the owner's name for it.
            #
            # A PERCENTAGE, 0 to 100, in the page's own units -- the two readings that matter live
            # in the first decimal place. GAMMA_EFFORT_WING_FRACTION, which was a fraction, is
            # RETIRED and the service REFUSES to start while it is set: 0.10 read as a percentage
            # would be a hundred times tighter than the 10 per cent it was asked for.
            - name: GAMMA_EFFORT_WING_PCT_OF_PEAK
              value: "10.0"
            # MEASURED on ONE session, from the OWNER's own swing sizes. It is the minimum swing
            # AND the zigzag's reversal threshold, so it decides what counts as a wave at all.
            # 10.00 points is the smallest round trip the model names ("50, then 30, then 10") and
            # it admits the smallest leg the owner's own 2026-11-12 figures report (+12.50). Driven
            # over that session's real tape it gives 16 swings; the 2.50 points this shipped with
            # first gave 153, of 2.50 to 25.75 points -- a 1-minute ES tape reverses 2.50 points
            # constantly, so that was noise and not waves.
            - name: GAMMA_EFFORT_MIN_SWING_CENTS
              value: "1000"
            # MEASURED. The requirements document's own regime definition: the sign of gamma summed
            # over strikes within 10 points of spot, below zero amplifying and above zero braking.
            # This is what decides the long-or-short-gamma case BEFORE any sign is assigned.
            - name: GAMMA_EFFORT_LOCAL_GAMMA_RADIUS_CENTS
              value: "1000"
            # UNCALIBRATED. The owner says that in negative gamma the hot strike may be "far away"
            # and the sign rule is then not fixed, without naming a distance. Past this, no dealer
            # side is assigned at all -- a rule that is not fixed must not be applied anyway.
            - name: GAMMA_EFFORT_HOT_STRIKE_FAR_CENTS
              value: "2000"
            # UNCALIBRATED. "Heavy" volume at a strike price has reached, as a PERCENTAGE of the
            # peak band's -- the same units as the wing line above, because comparing a percentage
            # against a fraction made 50 per cent read as half of one per cent and called almost
            # every band heavy. Heavy AND two-way is the owner's acceptance test; either alone is
            # UNDECIDED. GAMMA_EFFORT_ACCEPT_FRACTION is RETIRED and refused for the same reason.
            - name: GAMMA_EFFORT_ACCEPT_PCT_OF_PEAK
              value: "50.0"
            # UNCALIBRATED. "Two-way", as min over max of the aggressor split at that strike. The
            # net cannot tell 2,000 bought from an even 1,000/1,000, and that is the difference.
            - name: GAMMA_EFFORT_TWO_SIDED_MIN
              value: "0.40"
            # UNCALIBRATED. The window "the volume keeps dropping" is read over, for the owner's
            # crossing rule. The newest bar is held OUT of the mean it is compared with.
            - name: GAMMA_EFFORT_TREND_BARS
              value: "5"
            # A bound on the EMISSION, not a model parameter. The swing history is published in
            # full and the corpus log's byte cap is measured from the record's size.
            - name: GAMMA_EFFORT_MAX_AMPLITUDES
              value: "12"
            - name: JAVA_TOOL_OPTIONS
              value: -Xmx512m -XX:+UseSerialGC
          resources:
            # No HTTP server and so no probes: two consumer loops and one producer. The pod's health
            # is read from its own emission -- barsFolded, the refusal tally, and the gamma map's
            # strike count and staleness on options.spx.gamma-effort.current.
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
