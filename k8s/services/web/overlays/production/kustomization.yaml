# STANDALONE web overlay — production. Used ONLY by Jenkinsfile.web-service (the
# per-service fast path). The monolithic prod deploy renders web via
# k8s/overlays/production.
#
# ⚠ MIRROR RULE: every web-targeting patch in k8s/overlays/production/kustomization.yaml
# MUST be replicated here. scripts/ci/validate-services.sh enforces render equivalence.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # Prod reuses the node's cached image to avoid the kubelet pull-QPS throttle (mirror of
  # the monolith's all-Deployments IfNotPresent patch, scoped to this service).
  - target:
      kind: Deployment
      name: options-edge-web
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      # Mirror the monolith's all-Deployments progressDeadlineSeconds:1200 (raised so the
      # controller deadline fires before apply.sh's rollout --timeout on a slow roll).
      - op: add
        path: /spec/progressDeadlineSeconds
        value: 1200
      # Position-flow Leaderboard store on the INTERNAL surface: APP_POSTGRES_* pointed at the
      # platform Postgres (no bo-app-postgres here; the nightly publisher writes options_flow
      # too). MIRRORS the web patch in k8s/overlays/production/kustomization.yaml exactly.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_POSTGRES_JDBC_URL
          value: jdbc:postgresql://192.168.100.252:5432/options_flow
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_POSTGRES_USER
          value: options_flow
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: options-edge-runtime-secrets
              key: POSTGRES_PASSWORD
