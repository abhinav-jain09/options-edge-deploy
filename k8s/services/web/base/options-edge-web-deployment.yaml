# OptionsEdge web app (option-chain UI + /api backend), Spring Boot jar served at "/" on :8080.
# Replaces the legacy off-cluster Tomcat instance on the host :8090. Auth is MANDATORY in prod: the app
# fails to start unless VITE_AUTH_ISSUER (non-loopback HTTPS) + AUTH_AUDIENCE are set (RuntimeProfileConfig),
# and the front-end force-login gate points at the prod Keycloak. Market-chain data reaches the BROWSER via
# the feed-gateway WS (wss://fullfunding.nl/ws/events); this backend only serves the page + /api and needs
# Kafka (egress to the host broker) — so no hostNetwork required (it dials Kafka by host IP like the other
# processor pods; pod->ClusterIP/host egress works on this cluster, only pod->pod-IP does not).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: options-edge-web
  namespace: options-edge
  labels:
    app.kubernetes.io/name: options-edge-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  # RollingUpdate with maxUnavailable:0 guarantees the new pod is Ready (readinessProbe GET /) before
  # the old one is terminated, so the Service always keeps >=1 endpoint. Recreate left a zero-endpoint
  # window on every deploy that made the docker-desktop LoadBalancer drop the :8090 host-port binding
  # and not re-establish it — breaking http://localhost:8090 after each deploy. The web app is fully
  # stateless (no PVC/hostPort/singleton), so briefly running 2 pods during the roll is safe.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: options-edge-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: options-edge-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: options-edge
    spec:
      # Pin to the control-plane node (192.168.100.252). The oe-failover-56 node (.4) has intermittently
      # broken pod DNS, which makes the startup OIDC issuer fetch (https://auth.fullfunding.nl) fail with
      # UnknownHostException. The control-plane node resolves reliably (same reason Keycloak is pinned here).
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: web
          image: 192.168.100.252:5000/options-edge-web:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_PROFILE
              value: "prod"
            - name: APP_WEB_PORT
              value: "8080"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx2g"
            # --- Auth (mandatory in prod; runtime-injected into the page + JWT validation) ---
            - name: VITE_AUTH_ENABLED
              value: "true"
            - name: VITE_AUTH_ISSUER
              value: "https://auth.fullfunding.nl/realms/optionsedge"
            - name: VITE_AUTH_CLIENT_ID
              value: "options-edge-web"
            - name: VITE_AUTH_AUDIENCE
              value: "options-edge-web"
            - name: AUTH_AUDIENCE
              value: "options-edge-web"
            # --- Feed-gateway WS (the browser connects here for chain data) + UI URLs (public edge) ---
            - name: APP_FEED_GATEWAY_WS_URL
              value: "wss://fullfunding.nl/ws/events"
            - name: VITE_WS_URL
              value: "wss://fullfunding.nl/ws/events"
            # The browser-facing WS above is the PUBLIC edge (Cloudflare -> traefik). The web POD,
            # however, computes feedGatewayAvailable by probing APP_FEED_GATEWAY_HEALTH_URL — and a
            # pod must NOT health-check itself by round-tripping out to the public wss://fullfunding.nl
            # and back (fragile: depends on egress + Cloudflare + DNS just to know the in-cluster
            # gateway is up). The gateway Service is directly pod-reachable, so probe its stable
            # cluster DNS name rather than hairpinning through the node's external address.
            - name: APP_FEED_GATEWAY_HEALTH_URL
              value: "http://feed-gateway-service:8091/health"
            - name: VITE_API_BASE_URL
              value: "https://fullfunding.nl"
            - name: VITE_MISSION_CONTROL_URL
              value: "https://fullfunding.nl"
            - name: VITE_REPLAY_ORCHESTRATOR_URL
              value: "https://fullfunding.nl"
            - name: APP_MARKET_DATA_SOURCE
              value: "DATABENTO"
            # Dealer-ledger strike-signal render gate, served to the browser as config.dealerLedgerVisible.
            # In the BASE (env-independent) so dev and prod are IDENTICAL. Pairs with the backend
            # dealer-ledger-service base UI_VISIBLE=true + CALIBRATION_QUALITY=SHADOW.
            - name: DEALER_LEDGER_UI_VISIBLE
              value: "true"
          envFrom:
            # Provides KAFKA_BOOTSTRAP_SERVERS (required, non-loopback), schema registry, and the prod
            # Postgres coordinates (POSTGRES_JDBC_URL=.../options_flow, POSTGRES_USER=options_flow,
            # POSTGRES_ENABLED=true). RuntimeProfileConfig requires POSTGRES_PASSWORD in prod regardless of
            # POSTGRES_ENABLED, so the runtime-secrets secret is mounted too (same pattern as the
            # postgres-writer services). The web app uses this prod DB exactly as the legacy Tomcat did.
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            # GET / is CPU/GC-heavy under load; a 1s default timeout flaps the
            # pod out of endpoints. Give the JVM room to answer before failing.
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 4Gi
