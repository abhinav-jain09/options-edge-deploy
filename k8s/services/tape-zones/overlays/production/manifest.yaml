# HAND-AUTHORED render source for the es4-ONLY tape-zones-service.
#
# tape-zones runs ONLY on es4 (192.168.100.4): it consumes the mirrored ES future
# trades (es.underlying.es.trades) and publishes the tape-zones cells/board views.
# It is deliberately NOT registered in services.yaml and NOT part of the dev/prod
# monolith or Jenkinsfile.service-deploy — there is nothing to deploy it to prod.
# This slice exists ONLY as the input scripts/es4/render_es4_manifests.py reads to
# generate k8s/es4/services/tape-zones.yaml (the same source path the renderer uses
# for every other es4 service). Like the es-aggressor-flow precedent, all TAPE_ZONES_*
# tuning defaults are compiled into the service; only the es4 wiring is set here.
#
# DEPLOYMENT SAFETY — NEVER kubectl-apply this manifest directly. The image ref
# below is a mutable TAG; the ONLY deploy path is Jenkinsfile.es4-deploy, which
# digest-pins the :prod tag fail-closed before any apply.
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: tape-zones-service
    app.kubernetes.io/part-of: options-edge
  name: tape-zones-service
  namespace: options-edge
spec:
  ports:
    - name: health
      port: 8140
      targetPort: health
  selector:
    app.kubernetes.io/name: tape-zones-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: tape-zones-service
    app.kubernetes.io/part-of: options-edge
  name: tape-zones-service
  namespace: options-edge
spec:
  progressDeadlineSeconds: 1200
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tape-zones-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tape-zones-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - env:
            # The service's OWN bootstrap env (TapeZonesSettings reads
            # TAPE_ZONES_BOOTSTRAP_SERVERS, not KAFKA_BOOTSTRAP_SERVERS) — same value
            # every es4 service gets from es4-common-env, set explicitly like
            # es-aggressor-flow's ES_AGGRESSOR_BOOTSTRAP_SERVERS.
            - name: TAPE_ZONES_BOOTSTRAP_SERVERS
              value: 192.168.100.4:9092
            # Topic envs go through KafkaSettings.topicValue: TOPIC_PREFIX=es. from
            # es4-common-env is idempotent (a value already carrying es. is untouched),
            # so these full names land on the broker exactly as written.
            - name: KAFKA_ES_TRADES_TOPIC
              value: es.underlying.es.trades
            - name: KAFKA_TAPE_ZONES_CELLS_TOPIC
              value: es.tape-zones.cells
            - name: KAFKA_TAPE_ZONES_BOARD_TOPIC
              value: es.tape-zones.board
            # 8140 is unused across k8s/es4/services (verified 2026-08-08; the only
            # other 8140 user, es-spx-align, does not run on es4).
            - name: HEALTH_PORT
              value: "8140"
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          image: 192.168.100.252:5000/options-edge-tape-zones:dev
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          name: tape-zones
          ports:
            - containerPort: 8140
              name: health
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
