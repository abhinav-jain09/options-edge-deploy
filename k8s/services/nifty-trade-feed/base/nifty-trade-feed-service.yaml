# NodePort PINNED to 30189 in every env (30188 is the Pressure boards): the
# Jenkins health gate targets it by number, so a Service recreation must not
# reassign it. Cluster-internal consumers use nifty-trade-feed-service:8189.
apiVersion: v1
kind: Service
metadata:
  name: nifty-trade-feed-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: nifty-trade-feed-service
    app.kubernetes.io/component: trade-feed
    app.kubernetes.io/part-of: options-edge
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nifty-trade-feed-service
  ports:
    - name: http
      port: 8189
      targetPort: 8189
      nodePort: 30189
