# The Level Absorption configuration the pod mounts at /home/options-edge/config/level-absorption (read-only).
#
# SOURCE OF TRUTH: options-edge-processing docs/level-absorption/phase0/ (README.md there), copied VERBATIM from origin/main
# f4affb218 (PR 1344). Both files were produced by the Phase 0 run of 2026-10-25 by Claude under the owner's standing instruction
# (the owner may overrule); scripts/ci/validate-level-absorption-config.sh pins the copies and the events topic's byte cap together.
#
# frozen-configuration.json is the EYEBALL-ONLY PROVISIONAL configuration (eyeball-configuration.json there): the comparison fold
# selected NO candidate, so this is NOT a Phase 0 freeze, no verdict may be published on it, and the service refuses to start in any
# phase but EYEBALL with it (StartupChecks.requireSelectionForPhase). A new Phase 0 on a longer corpus replaces it; the replacement
# is a change to THIS file and to topics.env's retention bytes in one PR.
# retention-artifact.json: retentionBytes 21765840 = ceil(362,764 B/day (largest measured day of 158) x 30 days x 2).
#
# The standalone slices carry Deployment/Service only, so service-deploy does not create this ConfigMap: Jenkinsfile.service-deploy
# applies this one file in the stage 'Apply level-absorption configuration' (the same kind of service-owned step as the
# feed-gateway ConfigMap reconcile). A change needs a pod restart (the service reads both files once at start).
apiVersion: v1
kind: ConfigMap
metadata:
  name: level-absorption-config
  namespace: options-edge
  labels:
    app.kubernetes.io/name: level-absorption-service
    app.kubernetes.io/part-of: options-edge
