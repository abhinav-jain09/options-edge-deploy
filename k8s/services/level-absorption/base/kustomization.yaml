# SERVICE SLICE — level-absorption. Owns ONLY this service's Deployment.
#
# Referenced from BOTH k8s/overlays/dev and k8s/overlays/production (NOT k8s/base). The base is HELD AT replicas: 0 (production stays
# there); dev runs it through k8s/overlays/dev/level-absorption-dev-enable-patch.yaml. EYEBALL phase only (no verdict is published).
# Single replica only. The ConfigMap the dev pod mounts is NOT in this shared base (production must render none): it is k8s/overlays/dev/level-absorption-config.yaml,
# in the dev monolithic render only (the slices are Deployment/Service only; scripts/ci/validate-level-absorption-config.sh fails if a slice or the
# production render ever carries it), and Jenkinsfile.service-deploy applies that one file on dev.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - level-absorption-deployment.yaml
