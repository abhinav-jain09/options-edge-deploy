# SERVICE SLICE — level-absorption. Owns ONLY this service's Deployment.
#
# Referenced from BOTH k8s/overlays/dev and k8s/overlays/production (NOT k8s/base), HELD AT replicas: 0: the Phase 0 freeze file and
# the retention artifact it requires at start do not exist yet. EYEBALL phase only (no verdict is published). Single replica only.
#
# No Service object on purpose (the vol-state / es-compression-expansion shadow pattern): kubelet probes reach the pod
# directly and a ClusterIP would make /metrics reachable in-cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - level-absorption-deployment.yaml
