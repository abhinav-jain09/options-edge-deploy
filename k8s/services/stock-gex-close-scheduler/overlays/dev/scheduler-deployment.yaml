apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-gex-close-scheduler
  namespace: options-edge
  labels:
    app.kubernetes.io/name: stock-gex-close-scheduler
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 1200
  selector:
    matchLabels:
      app.kubernetes.io/name: stock-gex-close-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stock-gex-close-scheduler
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: host.docker.internal:5001/oe-close-batch:dev
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "spx-scheduler"
            - name: SPX_CLOSE_ENABLED
              value: "true"
            - name: SPX_DAILY_CLOSE_JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: options-edge-config
                  key: POSTGRES_JDBC_URL
            - name: SPX_DAILY_CLOSE_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: options-edge-config
                  key: POSTGRES_USER
            - name: SPX_DAILY_CLOSE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: options-edge-runtime-secrets
                  key: POSTGRES_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=UTC"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
