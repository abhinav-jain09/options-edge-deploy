apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-gex-close-scheduler
  namespace: options-edge
  labels:
    app.kubernetes.io/name: stock-gex-close-scheduler
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 1200
  selector:
    matchLabels:
      app.kubernetes.io/name: stock-gex-close-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stock-gex-close-scheduler
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: host.docker.internal:5001/oe-close-batch:dev
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "spx-scheduler"
            - name: SPX_CLOSE_ENABLED
              value: "true"
            - name: SPX_DAILY_CLOSE_JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: options-edge-config
                  key: POSTGRES_JDBC_URL
            - name: SPX_DAILY_CLOSE_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: options-edge-config
                  key: POSTGRES_USER
            - name: SPX_DAILY_CLOSE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: options-edge-runtime-secrets
                  key: POSTGRES_PASSWORD
            # THE MARKET-STRETCH MORNING REPORT, owned by this batch (it used to be a launchd job on a laptop that
            # produced nothing whenever the Mac slept or the dev topic had been reset). One attempt every five minutes
            # from 06:30 to 09:25 ET until the day's report is issued; the gamma board comes from the dev Kafka, the
            # index closes and the live VIX from the ThetaData terminal on the host.
            - name: STRETCH_ENABLED
              value: "true"
            - name: STRETCH_KAFKA_BOOTSTRAP
              valueFrom:
                configMapKeyRef:
                  name: options-edge-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: STRETCH_SCHEMA_REGISTRY_URL
              valueFrom:
                configMapKeyRef:
                  name: options-edge-config
                  key: KAFKA_SCHEMA_REGISTRY_URL
            - name: STRETCH_THETA_URL
              value: "http://host.docker.internal:25503/v3"
            # THE AFTER-CLOSE LEARNING JOB (oscillationZoneLearn): copies the day's index prints from the dev Kafka before the
            # 20:30 ET reset, scores the session against what was drawn that morning, learns from it and writes the end-of-day
            # report. Every 15 minutes from 16:45 ET until stored, and a 07:55 ET catch-up.
            - name: OSCILLATION_ENABLED
              value: "true"
            - name: OSCILLATION_KAFKA_BOOTSTRAP
              valueFrom:
                configMapKeyRef:
                  name: options-edge-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=UTC"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
