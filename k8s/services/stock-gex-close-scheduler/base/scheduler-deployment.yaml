# THE NIGHTLY SCHEDULE, AS A WORKLOAD — replacing the Jenkins crons that used to drive it.
#
# TWO DUTIES NOW, both in this one pod: the closing-board freeze (16:10 ET, healed at 17:40 and
# 07:45) and the open-interest index snapshot (20:30 ET, healed at 07:50). The index job existed
# in this image from 2026-08-28 and nothing ever launched it — its python equivalent ran from a
# Jenkins timer outside the cluster, stopped producing an index on 2026-10-02, and had no retry
# but the next night's firing into the same wall, so the published index froze at tradeDate
# 2026-10-01 and the public site froze with it for four sessions. It is on the batch's own queue
# and lease now, which is what makes a failure at 20:30 a retry at 20:45.
#
# A CronJob COULD NOT HAVE FIXED THAT, and not only for the reasons below: the cluster enforces
# a ValidatingAdmissionPolicy (options-edge-jenkins-only-workloads, failurePolicy: Fail) that
# DENIES batch/jobs and batch/cronjobs CREATE to every principal except the Jenkins deployer, and
# a CronJob's Jobs are created by the controller's identity. A native firing is rejected every
# night.
#
# The owner's instruction, 2026-09-01: "I don't want anything Jenkins-based, it should run based
# on Spring Batch configuration." That is what this is. The batch decides which session it owns,
# reads the market calendar itself, retries by RESUMING its own job, and skips a night already
# published — all in-process, on the two cron triggers in app.closebatch.schedule.
#
# WHY A DEPLOYMENT AND NOT A CRONJOB. A CronJob would put the schedule back outside the batch, in
# a place with its own opinion about time zones and its own failure modes, and the pod it starts
# still cannot decide anything for itself. This pod holds the schedule, so "when do we freeze"
# and "how do we freeze" are one program, testable in one test run.
#
# IT IS THE SAME POD SPEC AS THE JOB, deliberately: same image, same hostPath for the OI index
# and the vendor staging directory, same node pin (that directory is on ONE node), same secret,
# same non-root read-only container. The only differences are what they must be — it stays
# running, and SPRING_PROFILES_ACTIVE=scheduler turns the schedule on and the start-up job runner
# OFF, so a restart at 03:00 does not freeze a board out of whatever the vendor had at 03:00.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-gex-close-scheduler
  namespace: options-edge
  labels:
    app.kubernetes.io/name: stock-gex-close-scheduler
    app.kubernetes.io/part-of: options-edge
spec:
  # EXACTLY ONE. Two schedulers would each launch the same session; Spring Batch's job repository
  # would refuse the second, but the right number of pods asking is one.
  replicas: 1
  strategy:
    # Never two at once, not even for a second during a rollout — a deploy at 16:10 must not have
    # the old pod and the new pod both deciding they own tonight.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stock-gex-close-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stock-gex-close-scheduler
    spec:
      nodeSelector:
        kubernetes.io/hostname: localhost.localdomain
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: 192.168.100.252:5000/oe-close-batch:prod
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "scheduler"
            - name: DATABENTO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: options-edge-databento-feed-env
                  key: DATABENTO_API_KEY
            - name: STOCK_GEX_CLOSE_DB_DSN
              value: "postgresql://bleedingoptions:fAE80oxjlQ75edJe5nmfTLoIDJerlkddoFRm@bo-app-postgres-db.bleedingoptions.svc.cluster.local:5432/bleedingoptions"
            # The vol-premium daily validation job (BATCH_JOB_NAME=volPremiumValidation) reads the
            # service's own .events/.warnings and writes one scorecard per session into the database
            # the web reads (options_flow), NOT the batch's bleedingoptions repo DB above. The scheduler
            # launches it in-process (16:45 ET + 07:55 ET catch-up); it is inert for the close-board /
            # OI jobs, which never touch these.
            - name: VP_VALIDATION_KAFKA_BOOTSTRAP
              value: "192.168.100.252:9092"
            - name: VP_VALIDATION_DB_DSN
              value: "postgresql://options_flow:Options#100@192.168.100.252:5432/options_flow"
            - name: CLOSE_SNAPSHOT_ROOT
              value: "/oi-index/close/.batch-fetch-csv"
            # THE OPEN-INTEREST JOB'S CHUNKS, under a root of their own. Both jobs name their
            # staging directories after a date, so one shared root would put their days in one
            # namespace and the board's retention pass would be free to delete the chunks an OI
            # execution could still restart onto. Each job prunes the root it writes.
            - name: CLOSE_OI_SNAPSHOT_ROOT
              value: "/oi-index/oi-snapshots"
            # BOTH A READ AND A WRITE NOW. The board reads this path; the index job INSTALLS it
            # here, which is the whole reason the index job has a schedule — stock-gex-service
            # resolves STOCK_GEX_OI_INDEX at exactly this name and serves every stock GEX board
            # from it. The mount below is read-write and the written file is mode 0644, because
            # the service pod runs as a different uid (10001) than this job (1000).
            - name: CLOSE_INDEX_PATH
              value: "/oi-index/stock-gex-oi-index.json.gz"
            - name: CLOSE_KEEP_SESSIONS
              value: "10"
            - name: CLOSE_AWAIT_VENDOR_SECONDS
              value: "3600"
            # UTC inside the JVM, New York in the schedule. The cron triggers carry their own zone
            # so the container's clock never gets a vote on when the market closed.
            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=UTC"
          volumeMounts:
            - name: oi-index
              mountPath: /oi-index
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m          # idle almost all day; the runs themselves are bursty
              memory: 2Gi
            limits:
              # 4Gi, raised from 3Gi when the OI index job gained a schedule. This pod launches
              # its jobs IN PROCESS, and the index is the largest single thing either of them
              # holds. MEASURED, not estimated: the real 2026-10-05 production index — 507 roots,
              # 574,004 contracts — loads through this build's validator in 2.9 s, canonicalises
              # to 69,991,490 characters, and the whole read-verify-canonicalise path completed
              # inside a 2 GB heap. 4Gi at MaxRAMPercentage=75 gives 3 GB, which leaves room for
              # the build path, which also holds the definitions and the statistics. The request
              # is unchanged at 2Gi.
              memory: 4Gi
      volumes:
        - name: oi-index
          hostPath:
            path: /home/options-edge/stock-gex-oi
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
