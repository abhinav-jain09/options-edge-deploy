apiVersion: apps/v1
kind: Deployment
metadata:
  name: early-auction-verdict-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: early-auction-verdict-service
    app.kubernetes.io/component: early-auction-verdict-service
    app.kubernetes.io/part-of: options-edge
spec:
  # HELD AT replicas 0 (shadow, owner-gated). Two gates must open before scaling up:
  # (1) the EAV-R2a input lock file — the pod mounts it from the ConfigMap
  #     early-auction-verdict-lock, which exists only once the read-only verifier
  #     (EavLockVerifier) has run green against this environment's producers; the loader
  #     also fail-closes on any placeholder row, so a stale or partial ConfigMap cannot boot;
  # (2) the owner's enable (EARLY-AUCTION-VERDICT-STAGE1-GATE1.md rev 18a, EAV-R17:
  #     BLOCKED_UNREACHABLE_FLOOR blocks any non-dev enable).
  # SINGLE replica only when enabled: the RocksDB commit unit and the ledger journal are
  # per-instance; a second instance would double-emit (dedupe hides it, but nothing needs it).
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: early-auction-verdict-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: early-auction-verdict-service
        app.kubernetes.io/component: early-auction-verdict-service
        app.kubernetes.io/part-of: options-edge
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: early-auction-verdict
          image: 192.168.100.252:5000/options-edge-early-auction-verdict:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config              # KAFKA_BOOTSTRAP_SERVERS, TOPIC_PREFIX
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            # Inputs (all read-only): es.futures.auction (context + labels) and the witness
            # topics the lock file names. Output: early-auction.verdicts.shadow (1 partition,
            # retention -1, delete-only) — scripts/kafka/ensure-early-auction-verdict-topics.sh
            # is the first-deploy barrier. This base is the dev slice; the production overlay
            # patches EAV_ENVIRONMENT (the sessionId's environment component).
            - name: EAV_ENVIRONMENT
              value: dev
            - name: EAV_LOCK_FILE
              value: /etc/options-edge/eav/eav-inputs.lock.json
            - name: EAV_STATE_DIR
              value: /var/lib/options-edge/eav
            - name: EAV_METRICS_PORT
              value: "9472"
            - name: JAVA_TOOL_OPTIONS
              value: -Xms128m -Xmx512m
          ports:
            - name: health
              containerPort: 9472
          # /healthz answers once the boot chain (lock file -> literals -> store -> Kafka
          # restore) has succeeded; the boot chain is fail-closed, so a pod that answers is a
          # pod whose input contract verified.
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1024Mi
          volumeMounts:
            - name: eav-lock
              mountPath: /etc/options-edge/eav
              readOnly: true
            - name: eav-state
              mountPath: /var/lib/options-edge/eav
      volumes:
        # The verifier-produced input lock file (EAV-R2a). optional: false ON PURPOSE — the pod
        # cannot even schedule its container before verification has published the ConfigMap.
        - name: eav-lock
          configMap:
            name: early-auction-verdict-lock
            optional: false
        # emptyDir, deliberately (same rationale as vol-premium): the RocksDB commit unit is a
        # local copy — a replaced pod re-seeks from "earliest", rebuilds the session
        # deterministically, and every re-emitted ledger record deduplicates by its full
        # semantic key (literalsHash|sessionId|kind|discriminator).
        - name: eav-state
          emptyDir: {}
