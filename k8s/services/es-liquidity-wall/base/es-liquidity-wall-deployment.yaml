apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-liquidity-wall-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: es-liquidity-wall-service
    app.kubernetes.io/component: es-liquidity-wall-service
    app.kubernetes.io/part-of: options-edge
spec:
  # DEV ONLY (services.yaml envs: [dev]): the one environment that renders this service. NEW Kafka Streams service (ES book liquidity walls): reads es.rithmic.depth (Avro id 3301, the
  # "Rithmic Test" depth mirrored es4 -> dev) and underlying.es.trades.linearized (JSON), publishes the seven single-partition futures.liquidity-wall.* Avro topics (ids 3401-3407).
  # SINGLE replica ONLY (strategy Recreate): the Streams application id is options-edge-es-liquidity-wall over one-partition sources, so a second pod would own no task and only rebalance
  # the first; `kubectl scale` above 1 has no valid result. Streams local state is an emptyDir (dev only, as zn-gex): every pod start rebuilds it from the changelogs.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: es-liquidity-wall-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: es-liquidity-wall-service
        app.kubernetes.io/component: es-liquidity-wall-service
        app.kubernetes.io/part-of: options-edge
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: es-liquidity-wall
          # Base-registry name, like every other base manifest: the dev overlays (monolith AND the standalone slice) remap it to host.docker.internal:5001 via `images:`, and apply.sh's
          # digest-pin loop keys its rewrite on exactly this `<base registry>/<image>` name.
          image: 192.168.100.252:5000/options-edge-es-liquidity-wall:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config              # KAFKA_BOOTSTRAP_SERVERS, SCHEMA_REGISTRY_URL (ids 3401-3407 are resolved from it at start), TOPIC_PREFIX and the runtime profile
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            # The one flag. "false" serves health and touches no broker; "true" runs the engine.
            - name: ES_LIQUIDITY_WALL_ENABLED
              value: "true"
            - name: HEALTH_PORT
              value: "8080"
            # Kafka Streams local state on the emptyDir below (dev only; rebuilt from the changelogs on every pod start).
            - name: KAFKA_STREAMS_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            - name: ES_LIQUIDITY_WALL_STREAMS_APP_ID
              value: options-edge-es-liquidity-wall
            # A fresh application id (or a wiped group) starts from the live book, not from 12 h of retained depth.
            - name: ES_LIQUIDITY_WALL_STREAMS_AUTO_OFFSET_RESET
              value: latest
            # Layer A: the depth admission literal. Since 2026-11-04 (owner cutover) the collector is on the live Rithmic system and stamps "Rithmic Paper Trading";
            # a frame carrying any other literal (the old "Rithmic Test") is refused ENVIRONMENT. ALLOW_TEST is off: the test literal is never admitted again.
            - name: ES_LIQUIDITY_WALL_DEPTH_TOPIC
              value: es.rithmic.depth
            - name: ES_LIQUIDITY_WALL_DEPTH_ENVIRONMENT
              value: "Rithmic Paper Trading"
            - name: ES_LIQUIDITY_WALL_DEPTH_ALLOW_TEST
              value: "false"
            # Layer B's live literal: REQUIRED and refused when blank or "Rithmic Test" (document D section 7). Layer B runs only while the admitted frames carry exactly this value,
            # which is the literal the live collector stamps since the 2026-11-04 cutover (measured on es.rithmic.depth: environment "Rithmic Paper Trading", a full book).
            - name: ES_LIQUIDITY_WALL_LIVE_ENVIRONMENT
              value: "Rithmic Paper Trading"
            # <date>=<contract>: the front ES contract the depth is read for, from that date. Roll it with the quarterly roll.
            - name: ES_LIQUIDITY_WALL_CONTRACT_TABLE
              value: 2026-09-14=ESZ6
            # Wall detection STARTING VALUES, measured on the free Databento window 2026-10-06. DESCRIPTIVE, not calibrated: the document's starting values produce no cluster on the ES
            # book, these do. Expect to re-measure once dev has a few live sessions.
            - name: ES_LIQUIDITY_WALL_WALL_MIN_FLOOR
              value: "127"
            - name: ES_LIQUIDITY_WALL_WALL_MIN_SIZE
              value: "127"
            - name: ES_LIQUIDITY_WALL_LOW_SIZE
              value: "58"
            - name: ES_LIQUIDITY_WALL_WALL_REL_K
              value: "1.460"
            - name: ES_LIQUIDITY_WALL_FLIP_LEAN_THRESHOLD
              value: "0.100"
            - name: JAVA_TOOL_OPTIONS
              value: -Xms256m -Xmx1024m
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - mountPath: /var/lib/options-edge/kafka-streams
              name: kafka-streams-state
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
