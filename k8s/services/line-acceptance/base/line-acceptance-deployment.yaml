apiVersion: apps/v1
kind: Deployment
metadata:
  name: line-acceptance-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: line-acceptance-service
    app.kubernetes.io/component: line-acceptance-service
    app.kubernetes.io/part-of: options-edge
spec:
  # LIVE ON DEV, UNVALIDATED (owner 2026-11-02, overriding design K9 / section 15 "nothing runs before the backtest report"): replicas 1 and LINE_ACCEPTANCE_ENABLED "true" on dev, the only
  # environment that renders this service. Every record it publishes is labelled UNVALIDATED; alerts stay OFF (a per-viewer opt-in on the page); production is untouched (no overlay, image, topic or
  # gateway flag exists there). It is NOT held down any more: it is absent from DISABLED_DEV (dev-cleanup.sh) and from KEEP_DOWN of morning-autostart.sh and oe-boot-bringup.sh, so a start raises it
  # to 1 like every other dev service (tests/test_keep_down_lists_agree.py keeps the two prod lists in step). Rollback: set the flag back to "false" and replicas to 0 here, put the name back in
  # all three lists in the SAME change, regenerate the slice, deploy.
  # SINGLE replica ONLY: the transactional.id is line-acceptance-<ENVIRONMENT>, a second instance fences the first.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: line-acceptance-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: line-acceptance-service
        app.kubernetes.io/component: line-acceptance-service
        app.kubernetes.io/part-of: options-edge
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: line-acceptance
          image: 192.168.100.252:5000/options-edge-line-acceptance:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config              # KAFKA_BOOTSTRAP_SERVERS, SCHEMA_REGISTRY_URL, TOPIC_PREFIX and the runtime profile
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            # The one flag. "false" serves health and metrics and touches no broker; "true" runs the engine.
            - name: LINE_ACCEPTANCE_ENABLED
              value: "true"
            # options-edge-config carries no ENVIRONMENT; the service's transactional.id and consumer group are line-acceptance-<ENVIRONMENT>.
            - name: ENVIRONMENT
              value: dev
            # 8171 belongs to break-classifier.
            - name: LINE_ACC_HEALTH_PORT
              value: "8172"
            # The evidence/line-class gates (design 3, 15.3), default false in the service, enabled ONE AT A TIME on dev in this order: structure -> geometry -> vwap -> footprint -> candles.
            # GATE_PHASEF_EVIDENCE stays false (no Phase F join contract yet, DT-PF). GATE_BASIS_SERIES keeps its default ES_PRICE_AVRO (the Avro underlying.es.price, amendment A1).
            - name: GATE_STRUCTURE_ENABLED
              value: "true"
            - name: GATE_GEOMETRY_ENABLED
              value: "true"
            - name: GATE_VWAP_ENABLED
              value: "true"
            - name: GATE_FOOTPRINT_ENABLED
              value: "true"
            - name: GATE_CANDLES_ENABLED
              value: "true"
            - name: GATE_PHASEF_EVIDENCE
              value: "false"
            # The semantic gate of host completeness (VWAP-ACCEPTANCE-REJECTION-DESIGN.md DN7, 6.3 revision 2): BAR_MARKER reads the per-bar BreakCompletenessMarker that market-structure-service publishes on
            # break-events; the default NONE evaluates no host-associated episode. DEV ONLY: the service refuses BAR_MARKER when ENVIRONMENT is prod, and this base renders on dev only.
            - name: GATE_HOST_COMPLETENESS
              value: BAR_MARKER
          ports:
            - name: health
              containerPort: 8172
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 768Mi
