# Hand-authored base for the DEV-ONLY databento-maxpain service. Referenced from
# k8s/overlays/dev (NOT k8s/base/kustomization.yaml), so prod/experiment never render it.
# The generated dev slice (../overlays/dev) mirrors the monolith dev render of this base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - databento-maxpain-deployment.yaml
  - databento-maxpain-service.yaml
