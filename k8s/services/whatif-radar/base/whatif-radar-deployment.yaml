apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatif-radar-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: whatif-radar-service
    app.kubernetes.io/component: whatif-radar-service
    app.kubernetes.io/part-of: options-edge
spec:
  # DEV ONLY (services.yaml envs: [dev]). Service B of the dealer what-if grid, the Close Squeeze
  # Radar: it reads the gamma-exposure service's per-strike rows, builds the board at its OWN
  # geometry -- a 0.5-point grid over 30 points, where Service A's is 1 point over 120 -- and
  # publishes the live strikes with R-B-5's per-strike liveness statistic, the lean at 3 and 5
  # points with both side magnitudes, the ACCELERATE chain, the squeeze alert, the knife-edge flag
  # and its own two charm drifts, on options.spx.whatif.radar.
  #
  # IT PRODUCES NOTHING ABOVE TEN MINUTES TO EXPIRY (R-B-1), and every ten seconds at or under it,
  # inclusive. About 60 records a session, where Service A's is about 540. A quiet pod at two hours
  # to expiry is the rule working, not a wedged process.
  #
  # SHADOW: it emits no signal, names no level to act at and never trades. The four record blocks
  # that belong to later modules -- the ladder, the staircase, the counter-move and the signal
  # layer -- are ABSENT and not zeroed.
  #
  # SINGLE replica (strategy Recreate), for Service A's reason: the output is keyed by the CYCLE,
  # so one writer owns the stream, and Recreate fences the predecessor before the new pod starts
  # rather than running two writers that would interleave two boards under one session.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: whatif-radar-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whatif-radar-service
        app.kubernetes.io/component: whatif-radar-service
        app.kubernetes.io/part-of: options-edge
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: whatif-radar
          # THE SAME IMAGE AS whatif-map, WITH A DIFFERENT MAIN CLASS. The estate already does
          # this: zerodte-research-writer runs the vix-option-inteligence image under its own
          # Deployment the same way. Service A and Service B are two services in one Maven module,
          # so one jar holds both mains; a second image would be a second build of identical bytes
          # and a second place for the two to drift apart in version.
          image: 192.168.100.252:5000/options-edge-whatif-map:dev
          imagePullPolicy: Always
          # The jar's own Main-Class is Service A's, so Service B is named explicitly. `-cp` and
          # not `-jar`: with `-jar` the manifest's Main-Class wins and this pod would run a SECOND
          # Service A -- two writers on options.spx.whatif.map, interleaving two boards under one
          # session, which is exactly what the Recreate strategy above exists to prevent.
          command: ["java", "-cp", "/app/app.jar", "com.optionsedge.whatifgrid.radar.WhatIfRadarServiceMain"]
          envFrom:
            - configMapRef:
                name: options-edge-config              # the shared platform config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            # The two OE_-prefixed cluster addresses, MAPPED and not restated -- the same thing
            # whatif-map's manifest explains at length and for the same reason: options-edge-config
            # declares KAFKA_BOOTSTRAP_SERVERS and SCHEMA_REGISTRY_URL and no OE_-prefixed broker
            # or registry key at all, and RadarSettings REFUSES to start without either ("a service
            # that starts without it would read or publish against a cluster nobody chose, and
            # would look healthy while doing it"). configMapKeyRef keeps ONE source of truth for
            # the addresses, so a broker move is still a one-place change.
            - name: OE_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: options-edge-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: OE_SCHEMA_REGISTRY_URL
              valueFrom:
                configMapKeyRef:
                  name: options-edge-config
                  key: SCHEMA_REGISTRY_URL
            # The INPUT topic, shared with Service A and read INDEPENDENTLY. Named in full: the
            # service applies no TOPIC_PREFIX of its own and TOPIC_PREFIX is empty on dev.
            - name: OE_GEX_STRIKE_TOPIC
              value: options.databento.gex.strike
            # The OUTPUT topic. Avro with the registry id on the message, subject
            # app.options.whatif.WhatIfRadarRecord under RecordNameStrategy -- the record's FULL
            # NAME and not the topic's. Declared in scripts/kafka/topics.env; this service VERIFIES
            # it at start-up and never creates it, so a missing topic refuses the pod by name.
            - name: OE_WHATIF_RADAR_TOPIC
              value: options.spx.whatif.radar
            # ITS OWN consumer group, and RadarSettings REFUSES the map service's by name. Sharing
            # one group would make the two services PARTITIONS of a single consumer: each would see
            # only some of the gex rows and each would publish a FRAGMENT of the chain as though it
            # were the board -- with a fingerprint, and nothing on either record saying so. Like
            # Service A's, this group is an identity for offset bookkeeping and lag and not a
            # rebalancing group: every partition is ASSIGNED explicitly from partitionsFor.
            - name: OE_WHATIF_RADAR_GROUP
              value: whatif-radar-service
            # The instrument whose rows build the board, as a SETTING and not as the first row to
            # arrive (C-26), so the board cannot be decided by a race.
            - name: OE_WHATIF_SYMBOL
              value: SPX
            # The same heap as Service A. Its sweep is SMALLER -- 601 prices over 30 points against
            # A's 121 levels over 120 -- but its per-strike liveness walks each strike's band twice,
            # with and without that strike (R-B-5's leave-one-out), so the figure is not reduced on
            # the strength of the narrower grid alone. It is Service A's figure until this service
            # has been measured, and that is stated rather than implied.
            - name: JAVA_TOOL_OPTIONS
              value: -Xmx512m -XX:+UseSerialGC
          resources:
            # No HTTP server and so NO probes, exactly as Service A: one assigned consumer and one
            # producer. The pod's health is read from its own output -- a published cycle names its
            # live-strike count, its lean distances, the knife-edge flag and both charm drifts, and
            # a service that has not yet seen a full round of the board says so by name every
            # cycle rather than going quiet. A quiet pod ABOVE ten minutes is R-B-1 and not a
            # fault, which is the one reason a readiness probe on output would be wrong here.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
