apiVersion: apps/v1
kind: Deployment
metadata:
  name: oi-next-publication-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: oi-next-publication-service
    app.kubernetes.io/component: oi-next-publication-service
    app.kubernetes.io/part-of: options-edge
spec:
  # Exactly one replica, Recreate: the service funnels the whole SPX chain through a
  # single-partition repartition topic, so a second instance would have no partition to own
  # and a RollingUpdate would briefly run two against the same Streams application id.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oi-next-publication-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oi-next-publication-service
        app.kubernetes.io/component: oi-next-publication-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: oi-next-publication
          image: 192.168.100.252:5000/options-edge-oi-next-publication:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: HEALTH_PORT
              value: "8160"
            # ON: the service accumulates every session of options.databento.normalized into
            # its changelog-backed ledger and evaluates each at Curb close (17:00 ET + grace).
            # Whether it PUBLISHES is decided by OI_NEXTPUB_MODEL_PATH below, not by this flag.
            - name: OI_NEXTPUB_ENABLED
              value: "true"
            - name: OI_NEXTPUB_SYMBOL
              value: "SPX"
            # DECLARED so the Kafka cleanup Job can SEE it: that job scans workload env for
            # names ending in APP_ID and purges Streams-internal topics belonging to no active
            # app. This service HAS a persistent store (its session ledger) whose changelog
            # topic, and a single-partition repartition topic, are named from this id — an
            # id computed inside the process would be invisible to that scan and its changelog
            # could be purged while the service is running. KafkaSettings appends the
            # environment suffix as for every other Streams app.
            - name: OI_NEXTPUB_APP_ID
              value: oi-next-publication
            # The aggregator's republished snapshot (session-accumulated volume flagged
            # AGGREGATE), the same input oi-shadow reads. DECLARED, not defaulted, for the
            # reason oi-shadow learned: a defaulted raw topic that holds zero records on dev
            # comes up healthy and reads nothing forever.
            - name: KAFKA_SNAPSHOT_TOPIC
              value: options.databento.normalized
            # Stamped by the service itself at startup as 1 partition / delete / 90-day retention
            # (processing #910) — the environment's KAFKA_TOPIC_PARTITIONS_DEFAULT=32 is NOT
            # consulted. An image from before #910 would create it 32-wide and compacted, which
            # Kafka cannot undo, so ../MIN_IMAGE_BUILD (options-edge-processing 1678) makes
            # service-deploy REFUSE any older image by its options-edge.jenkins-build label.
            - name: KAFKA_OI_NEXTPUB_TOPIC
              value: options.spx.oi.next-publication
            # Two closes, deliberately different (a review BLOCKER when they were one):
            #   SPOT_CLOSE  16:00 — the index close; the close spot is the last acceptable
            #                       canonicalSpot at or before it.
            #   SESSION_END 16:15 — the end of SPX RTH options trading. The research volume is
            #                       RTH + Curb (to 17:00), and the code default is 17:00 + 15 min
            #                       grace. ON DEV THAT IS TOO LATE: dev's nightly clean (dev-cleanup
            #                       do_clean, CLEAN slot = close+30 = 16:30 ET; it ran 16:26 ET on
            #                       both 2026-10-02 and 2026-10-05) scales every deployment to 0 and
            #                       deletes every non-system Kafka topic, ledger included — both
            #                       sessions were lost 47-48 min before a 17:15 evaluation. So on dev
            #                       the session is scored at 16:15 + 5 min = 16:20 ET, before the
            #                       clean, and the ~0.4% of day volume that Curb adds (tape status
            #                       2026-10-01: curb 15,760 vs rth 4,280,083) is forgone. A session is
            #                       still evaluated exactly once; a late Curb print after 16:20 for
            #                       an already-evaluated session is ignored by design.
            #                       EARLY-CLOSE DAYS (13:00 close): the clean fires 13:30 and these
            #                       fixed times are not calendar-aware — that day's OI is lost until
            #                       the service learns the calendar's close (follow-up).
            - name: OI_NEXTPUB_SPOT_CLOSE
              value: "16:00"
            - name: OI_NEXTPUB_SESSION_END
              value: "16:15"
            - name: OI_NEXTPUB_EVALUATE_GRACE_MINUTES
              value: "5"
            # PRODUCING (USER 2026-10-02: "throw away python job and make this service produce
            # oi"). The image ships its model at this path (processing PR #911, model/README.md);
            # the first deploy ran DARK (empty path) for the live-feed soak and the Python
            # producer is now retired, so this service + its postgres-writer are the ONLY source
            # of options_flow.oi_next_publication.
            - name: OI_NEXTPUB_MODEL_PATH
              value: /app/model/model_db_v1.json.gz
            # The shipped model is fitted on the ThetaData tape (fitSource THETA_TAPE_DB_COMPAT);
            # the service refuses any fit source not listed here. Listing it is the owner's
            # decision: it is the same model the retired Python producer used, and its accuracy
            # on the feed is measured by the writer's oi_actual scoring from here on.
            - name: OI_NEXTPUB_ACCEPTED_FIT_SOURCES
              value: THETA_TAPE_DB_COMPAT
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx512m"
          ports:
            - name: health
              containerPort: 8160
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
