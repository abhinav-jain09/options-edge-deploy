apiVersion: apps/v1
kind: Deployment
metadata:
  name: reversal-confirmation-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: reversal-confirmation-service
    app.kubernetes.io/component: reversal-confirmation-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: reversal-confirmation-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reversal-confirmation-service
        app.kubernetes.io/component: reversal-confirmation-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: reversal-confirmation
          image: 192.168.100.252:5000/options-edge-reversal-confirmation:dev
          imagePullPolicy: Always
          # SHADOW-mode ES reversal engine (design: reversal-confirmation-v1-2s-spec.md v6).
          # Cross-broker by design: ES inputs + es.reversal.* outputs live on the es4
          # broker (.4); only the optional VIX diagnostic reads the local prod broker.
          # The shared configmap's KAFKA_BOOTSTRAP_SERVERS is intentionally NOT used —
          # both brokers are pinned explicitly below.
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: ENGINE_MODE
              value: SHADOW
            - name: HEALTH_PORT
              value: "8124"
            - name: REVERSAL_ES_BOOTSTRAP_SERVERS
              value: 192.168.100.4:9092
            - name: REVERSAL_VIX_BOOTSTRAP_SERVERS
              value: 192.168.100.252:9092
            # --- input topics ---
            - name: REVERSAL_ES_TRADES_TOPIC
              value: es.underlying.es.trades
            - name: REVERSAL_DELTA_FLOW_TOPIC
              value: es.delta-flow-by-trade
            - name: REVERSAL_VIX_TOPIC
              value: underlying.vix.price
            # --- output topics (all on the .4 broker) ---
            - name: REVERSAL_VERDICTS_TOPIC
              value: es.reversal.verdicts
            - name: REVERSAL_STRENGTH_TOPIC
              value: es.reversal.strength
            - name: REVERSAL_FINAL_SUMMARY_TOPIC
              value: es.reversal.final-summary
            - name: REVERSAL_OUTCOME_TOPIC
              value: es.reversal.outcome
            # --- consumer group id (assign-mode, no commits: identifies the client in
            #     tooling; committed-offset lag is not reported by design) ---
            - name: REVERSAL_GROUP_ID
              value: reversal-confirmation-v1
            # --- detection sensitivity (2026-07-14 first-session retune) ---
            # Defaults (12t decline / 4t bounce / 10s cooldown) produced 263
            # candidates in one session on a tape with constant 3-5pt wiggles —
            # pure noise, 0 confirmed. Config-only retune per design §14:
            # 7pt declines over >=60s, 2pt bounce trigger, 60s cooldown.
            - name: REVERSAL_MIN_DECLINE_TICKS
              value: "28"
            - name: REVERSAL_MIN_DECLINE_BUCKETS
              value: "30"
            - name: REVERSAL_BOUNCE_TRIGGER_TICKS
              value: "8"
            - name: REVERSAL_RESTART_COOLDOWN_BUCKETS
              value: "30"
            # --- day-1 autopsy calibration (2026-07-14, Bugzilla #157) ---
            # Ground truth: 79% of candidates were true continuations, 0
            # confirmed. Values below are the MEASURED prints of the winning
            # reversals, not guesses.
            - name: REVERSAL_CONFIRM_MIN_CORE_GATES
              value: "3"
            - name: REVERSAL_MIN_BOUNCE_IMBALANCE
              value: "0.05"
            - name: REVERSAL_RV_PRIMARY_THRESHOLD
              value: "1.15"
            - name: REVERSAL_RV_WEIGHT_ES
              value: "0.60"
            - name: REVERSAL_RV_WEIGHT_OPTION_CONTRACTS
              value: "0.20"
            - name: REVERSAL_RV_WEIGHT_OPTION_PREMIUM
              value: "0.20"
            - name: REVERSAL_FLIP_POST_ALIGN
              value: "0.15"
            - name: REVERSAL_ALIGNED_STRONG_POST_ALIGN
              value: "0.25"
            - name: REVERSAL_POST_WINDOW_CAP_BUCKETS
              value: "45"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx1024m"
          ports:
            - name: health
              containerPort: 8124
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            # readiness = replay catch-up complete; replay covers 25 min of tape
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 2Gi
