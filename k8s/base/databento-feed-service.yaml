apiVersion: v1
kind: Service
metadata:
  name: options-edge-databento-feed
  namespace: options-edge
  labels:
    app.kubernetes.io/name: options-edge-databento-feed
    app.kubernetes.io/part-of: options-edge
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8010"
spec:
  selector:
    app.kubernetes.io/name: options-edge-databento-feed
  ports:
    - name: metrics
      port: 8010
      targetPort: metrics
