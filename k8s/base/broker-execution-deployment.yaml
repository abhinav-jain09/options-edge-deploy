apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker-execution-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: broker-execution-service
    app.kubernetes.io/component: broker-execution-service
    app.kubernetes.io/part-of: options-edge
spec:
  # Deployed INERT. BROKER_EXECUTION_MODE=SHADOW places nothing and connects to no broker; ENABLED=false
  # refuses every intent. Turning this into something that trades is three values below, set by the account
  # owner — not by this manifest landing.
  # replicas 0 — but the hold that MATTERS is the entry in the three ops lists, because a replica count
  # in a manifest is not a hold by itself. All three list this service, and each reaches it by its own
  # route — do not assume one shape covers all three:
  #   scripts/ops/oe-boot-bringup.sh      KEEP_DOWN, applied to every Deployment in the namespace that
  #                                       is currently at 0. No part-of selector, and `grep -vE` is a
  #                                       SUBSTRING match, not an exact one.
  #   scripts/ops/morning-autostart.sh    KEEP_DOWN, applied to the part-of=options-edge Deployments,
  #                                       compared as exact names.
  #   scripts/ops/dev-cleanup.sh          DISABLED_DEV, compared as exact names (`grep -qxE`).
  # tests/test_keep_down_lists_agree.py fails CI when the two KEEP_DOWN lists disagree. DISABLED_DEV is
  # dev-only and is NOT covered by that test, so it has to be kept in step by hand.
  #
  # The image is built by options-edge-processing, NOT by service-deploy, so no service-deploy outcome
  # tells you whether one exists. service-deploy's 'Build image (this service only)' stage triggers
  # that job when BUILD_IMAGES=true and DEPLOY_DRY_RUN=false (and both permitted-commit guards pass);
  # the job can also be run on its own; and the REQUIRED_IMAGE parameter deploys an already-pushed
  # digest with no build at all. The child can succeed and the parent then fail while fetching its
  # image lock (fetch-permitted-image-lock.sh), so a RED service-deploy can sit on top of a pushed
  # image. Do not infer. Resolve it the way the deploy does — a tag listing is not enough, since a tag
  # can dangle or carry no manifest for the deploy platform:
  #   . scripts/deploy/pin-image.sh
  #   DEPLOY_PLATFORM=linux/arm64 resolve_repo_digest localhost:5001       options-edge-broker-execution dev
  #   DEPLOY_PLATFORM=linux/amd64 resolve_repo_digest 192.168.100.252:5000 options-edge-broker-execution prod
  # (those are the per-env platforms service-deploy.sh defaults to.) It fails closed unless the named
  # tag has exactly one manifest for that platform, and prints the digest that will be pinned.
  # The two registries are NOT one registry under two names: :5001 is the Mac's local registry
  # (host.docker.internal:5001 from inside the cluster) and .252:5000 is a different machine's. Which
  # tags each holds is an OBSERVATION this repo cannot prove — on 2026-09-24, :5001 answered with a dev
  # tag for options-edge-indicator-service and .252:5000 with only prod-* ones. The two commands above
  # re-check it for THIS service, which is the point: ask the registry, do not trust this sentence.
  # Until that resolves, a running replica sits in ImagePullBackOff and tells nobody anything. Scale
  # to 1 once it does — and only when the account owner wants the values above set.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: broker-execution-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: broker-execution-service
        app.kubernetes.io/component: broker-execution-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: broker-execution
          image: 192.168.100.252:5000/options-edge-broker-execution:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
          env:
            # NOTE: no HTTP health server is implemented yet, so this port is declared and unused and there
            # are deliberately no readiness/liveness probes — a probe against a port nothing listens on
            # would fail the pod rather than describe it.
            - name: HEALTH_PORT
              value: "8131"
            # --- what it reads and writes ---
            - name: BROKER_EXECUTION_INTENT_TOPIC
              value: trading.order.intent
            - name: BROKER_EXECUTION_STATUS_TOPIC
              value: trading.order.status
            - name: BROKER_EXECUTION_CONSUMER_GROUP
              value: broker-execution-service
            # --- the three values that decide whether anything is placed (OWNER SETS THESE) ---
            - name: BROKER_EXECUTION_MODE
              value: "SHADOW"          # SHADOW records tickets; PAPER connects to the paper gateway
            - name: BROKER_EXECUTION_ENABLED
              value: "false"           # false refuses every intent
            - name: BROKER_EXECUTION_TRANSMIT
              value: "false"           # false stages the order for a human to transmit
            # --- IB GATEWAY PAPER. 4002 is paper; 4001 (in the configmap as IB_PORT) is LIVE. The adapter
            #     also asserts the gateway's managed-account list is exactly the DU account below. ---
            - name: BROKER_EXECUTION_IBKR_HOST
              value: "127.0.0.1"
            - name: BROKER_EXECUTION_IBKR_PORT
              value: "4002"
            - name: BROKER_EXECUTION_IBKR_CLIENT_ID
              value: "21"
            - name: BROKER_EXECUTION_PAPER_ACCOUNT
              value: "DUQ287805"
            # --- bounds ---
            - name: BROKER_EXECUTION_MAX_QUANTITY
              value: "1"
            - name: BROKER_EXECUTION_REPRICE_MS
              value: "3000"
            - name: BROKER_EXECUTION_CHASE_MS
              value: "300000"
            - name: BROKER_EXECUTION_MAX_CHASE_GIVEUP_FRACTION
              value: "0.25"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
