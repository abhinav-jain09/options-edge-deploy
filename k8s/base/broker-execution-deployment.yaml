apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker-execution-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: broker-execution-service
    app.kubernetes.io/component: broker-execution-service
    app.kubernetes.io/part-of: options-edge
spec:
  # Deployed INERT. BROKER_EXECUTION_MODE=SHADOW places nothing and connects to no broker; ENABLED=false
  # refuses every intent. Turning this into something that trades is three values below, set by the account
  # owner — not by this manifest landing.
  # replicas 0 — but the hold that MATTERS is the entry in the three ops lists, because a replica count
  # in a manifest is not a hold by itself (review, BLOCKER). All three list this service, verified
  # 2026-09-24, and each reaches it by its own route — do not assume one shape covers all three:
  #   oe-boot-bringup.sh:40,90  KEEP_DOWN, applied to every Deployment in the namespace that is
  #                             currently at 0 — no part-of selector, and `grep -vE` is a SUBSTRING
  #                             match, not an exact one
  #   morning-autostart.sh:29,75  KEEP_DOWN, applied to the part-of=options-edge Deployments, compared
  #                             as exact names
  #   dev-cleanup.sh:46,587     DISABLED_DEV, compared as exact names (`grep -qxE`)
  # tests/test_keep_down_lists_agree.py fails CI when the two KEEP_DOWN lists disagree. DISABLED_DEV is
  # dev-only and is NOT covered by that test, so it has to be kept in step by hand.
  # The code merged to options-edge-processing main on 2026-09-24 (#888, 7b71452e), but a merge does not
  # produce an image. The image exists only after a SUCCESSFUL service-deploy run for this service with
  # BUILD_IMAGES=true AND DEPLOY_DRY_RUN=false. Those two are necessary, not sufficient:
  # Jenkinsfile.service-deploy:276 gates the build stage on BOTH of them AND on
  # PERMITTED_SHA_GUARD=='PASSED' AND DEPLOY_WORKSPACE_PERMITTED=='PASSED', so a dry run, a run refused
  # by either permission guard, and a failed run all build nothing while still being a run. Until a
  # successful build a running replica would sit in ImagePullBackOff and tell nobody anything. Scale to 1
  # after it — and only when the account owner wants the values above set.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: broker-execution-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: broker-execution-service
        app.kubernetes.io/component: broker-execution-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: broker-execution
          image: 192.168.100.252:5000/options-edge-broker-execution:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
          env:
            # NOTE: no HTTP health server is implemented yet, so this port is declared and unused and there
            # are deliberately no readiness/liveness probes — a probe against a port nothing listens on
            # would fail the pod rather than describe it.
            - name: HEALTH_PORT
              value: "8131"
            # --- what it reads and writes ---
            - name: BROKER_EXECUTION_INTENT_TOPIC
              value: trading.order.intent
            - name: BROKER_EXECUTION_STATUS_TOPIC
              value: trading.order.status
            - name: BROKER_EXECUTION_CONSUMER_GROUP
              value: broker-execution-service
            # --- the three values that decide whether anything is placed (OWNER SETS THESE) ---
            - name: BROKER_EXECUTION_MODE
              value: "SHADOW"          # SHADOW records tickets; PAPER connects to the paper gateway
            - name: BROKER_EXECUTION_ENABLED
              value: "false"           # false refuses every intent
            - name: BROKER_EXECUTION_TRANSMIT
              value: "false"           # false stages the order for a human to transmit
            # --- IB GATEWAY PAPER. 4002 is paper; 4001 (in the configmap as IB_PORT) is LIVE. The adapter
            #     also asserts the gateway's managed-account list is exactly the DU account below. ---
            - name: BROKER_EXECUTION_IBKR_HOST
              value: "127.0.0.1"
            - name: BROKER_EXECUTION_IBKR_PORT
              value: "4002"
            - name: BROKER_EXECUTION_IBKR_CLIENT_ID
              value: "21"
            - name: BROKER_EXECUTION_PAPER_ACCOUNT
              value: "DUQ287805"
            # --- bounds ---
            - name: BROKER_EXECUTION_MAX_QUANTITY
              value: "1"
            - name: BROKER_EXECUTION_REPRICE_MS
              value: "3000"
            - name: BROKER_EXECUTION_CHASE_MS
              value: "300000"
            - name: BROKER_EXECUTION_MAX_CHASE_GIVEUP_FRACTION
              value: "0.25"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
