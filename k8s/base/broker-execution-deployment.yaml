apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker-execution-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: broker-execution-service
    app.kubernetes.io/component: broker-execution-service
    app.kubernetes.io/part-of: options-edge
spec:
  # Deployed INERT. BROKER_EXECUTION_MODE=SHADOW places nothing and connects to no broker; ENABLED=false
  # refuses every intent. Turning this into something that trades is three values below, set by the account
  # owner — not by this manifest landing.
  # DEV IS NO LONGER HELD DOWN (2026-10-11): the dev overlay lifts this to 1 replica and
  # scripts/ops/dev-cleanup.sh no longer lists it in DISABLED_DEV, so dev's full start brings it up.
  # The lists below are the PRODUCTION paths (morning-autostart.sh, oe-boot-bringup.sh) and production
  # stays down. Note dev's post-clean OVERNIGHT_SET still excludes it, so after a clean it returns at
  # the 06:15 full start rather than overnight.
  # replicas 0 — but the hold that MATTERS is the entry in the three ops lists, because a replica count
  # in a manifest is not a hold by itself. All three list this service, and each reaches it by its own
  # route — do not assume one shape covers all three:
  #   scripts/ops/oe-boot-bringup.sh      KEEP_DOWN, applied to every Deployment in the namespace that
  #                                       is currently at 0. No part-of selector, and `grep -vE` is a
  #                                       SUBSTRING match, not an exact one.
  #   scripts/ops/morning-autostart.sh    KEEP_DOWN, applied to the part-of=options-edge Deployments,
  #                                       compared as exact names.
  #   scripts/ops/dev-cleanup.sh          DISABLED_DEV, compared as exact names (`grep -qxE`).
  # tests/test_keep_down_lists_agree.py fails CI when the two KEEP_DOWN lists disagree. DISABLED_DEV is
  # dev-only and is NOT covered by that test, so it has to be kept in step by hand.
  #
  # The image is built by options-edge-processing, NOT by service-deploy, so no service-deploy outcome
  # tells you whether one exists. service-deploy's 'Build image (this service only)' stage triggers
  # that job when BUILD_IMAGES=true and DEPLOY_DRY_RUN=false (and both permitted-commit guards pass);
  # the job can also be run on its own; and the REQUIRED_IMAGE parameter deploys an already-pushed
  # digest with no build at all. The child can succeed and the parent then fail while fetching its
  # image lock (fetch-permitted-image-lock.sh), so a RED service-deploy can sit on top of a pushed
  # image. Do not infer. Resolve it the way the deploy does — a tag listing is not enough, since a tag
  # can dangle or carry no manifest for the deploy platform:
  #   . scripts/deploy/pin-image.sh
  #   DEPLOY_PLATFORM=linux/arm64 resolve_repo_digest localhost:5001       options-edge-broker-execution dev
  #   DEPLOY_PLATFORM=linux/amd64 resolve_repo_digest 192.168.100.252:5000 options-edge-broker-execution prod
  # (those are the per-env platforms service-deploy.sh defaults to.) It fails closed unless the named
  # tag has exactly one manifest for that platform, and prints the digest that will be pinned.
  # The two registries are NOT one registry under two names: :5001 is the Mac's local registry
  # (host.docker.internal:5001 from inside the cluster) and .252:5000 is a different machine's. Which
  # tags each holds is an OBSERVATION this repo cannot prove — on 2026-09-24, :5001 answered with a dev
  # tag for options-edge-indicator-service and .252:5000 with only prod-* ones. The two commands above
  # re-check it for THIS service, which is the point: ask the registry, do not trust this sentence.
  # Until that resolves, a running replica sits in ImagePullBackOff and tells nobody anything. Scale
  # to 1 once it does — and only when the account owner wants the values above set.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: broker-execution-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: broker-execution-service
        app.kubernetes.io/component: broker-execution-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: broker-execution
          image: 192.168.100.252:5000/options-edge-broker-execution:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
          env:
            # Process health is separate from authenticated end-to-end trading readiness.
            - name: SERVER_PORT
              value: "8131"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m -XX:MaxDirectMemorySize=128m"
            - name: VISUAL_ORDER_STORE_BUDGET_BYTES
              value: "34359738368" # 32 GiB external audit-state budget; new entries stop at 90%
            - name: AUTH_ISSUER_URI
              value: "https://auth.bleadingoptions.com/realms/optionsedge"
            - name: AUTH_AUDIENCE
              value: "options-edge-web"
            - name: CONTEXT_TAPE_EXECUTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: context-tape-execution-auth
                  key: token
            # --- what it reads and writes ---
            - name: BROKER_EXECUTION_INTENT_TOPIC
              value: trading.order.intent
            - name: BROKER_EXECUTION_STATUS_TOPIC
              value: trading.order.status
            - name: BROKER_EXECUTION_CONSUMER_GROUP
              value: broker-execution-service
            # The Jenkins cutover must establish/reverify the fresh Avro partition boundary at zero.
            # Zero skips no records. Any unexpected retained JSON fails the Avro decoder closed.
            - name: BROKER_EXECUTION_AVRO_START_OFFSETS
              value: "0:0"
            # --- the values that decide whether anything is placed (OWNER SETS THESE) ---
            # Armed 2026-10-11 at the account owner's instruction: PAPER + ENABLED + TRANSMIT. This now
            # places paper orders WITHOUT a human pressing Transmit. It still cannot reach a live account:
            # LIVE has no adapter and is refused at startup, and the adapter asserts the gateway's
            # managed-account list is exactly the DU paper account on every connect.
            - name: BROKER_EXECUTION_MODE
              value: "PAPER"           # SHADOW records tickets; PAPER connects to the paper gateway
            - name: BROKER_EXECUTION_ENABLED
              value: "true"            # false refuses every intent
            - name: BROKER_EXECUTION_TRANSMIT
              value: "true"            # false stages the order for a human to transmit
            # Which deployment caused a ticket. The paper account is PINNED and therefore SHARED by dev and
            # production, so without this the account's own order list cannot tell them apart. It rides
            # Interactive Brokers' orderRef and is shown against the order in Trader Workstation. PAPER
            # REFUSES TO START without it, so a manifest that arms the mode and forgets the label does not
            # trade — it fails to boot. Base carries the dev name; production overrides it in
            # k8s/overlays/production/broker-execution-prod-env-patch.yaml.
            - name: BROKER_EXECUTION_ENVIRONMENT
              value: "dev"
            # --- IB GATEWAY PAPER. 4002 is paper; 4001 (in the configmap as IB_PORT) is LIVE. The adapter
            #     also asserts the gateway's managed-account list is exactly the DU account below. ---
            # host.docker.internal, NOT 127.0.0.1: inside a pod, loopback is the POD, and the gateway runs
            # on the Mac that hosts the dev cluster. Verified 2026-10-11 reachable on 4002 from a container.
            # Live capability is enabled only on the dev overlay with a configured local gateway.
            # Production remains silent with zero broker replicas. Numerical risk bounds are unchanged.
            - name: BROKER_LIVE_EXECUTION_ENABLED
              value: "false"
            - name: BROKER_EXECUTION_IBKR_HOST
              value: "host.docker.internal"
            - name: BROKER_EXECUTION_IBKR_PORT
              value: "4002"
            - name: BROKER_EXECUTION_IBKR_CLIENT_ID
              value: "21"
            - name: BROKER_EXECUTION_PAPER_ACCOUNT
              value: "DUQ287805"
            # --- bounds ---
            # MAX_QUANTITY caps ONE order's quantity, not the number of orders a session can place —
            # review was right that this manifest declared no money bound at all. MAX_CREDIT is stated
            # here explicitly at the value the code already defaults to, so the ceiling is visible
            # where an operator looks rather than only in BrokerExecutionSettings. Lowering it is a
            # trading decision for the account owner, not a deployment one; a malformed value stops
            # the service rather than becoming the default.
            # Session dates (Eastern) on which this service OPENS NOTHING. Federal Reserve decision days,
            # from the desk's own event calendar: OE0DTE_EVENT_CALENDAR_v1.json in
            # vix-option-inteligence-service (fomcDecisionDates, sourced from federalreserve.gov).
            #
            # EXITS ARE NOT BLOCKED by this — a date rule that could stop a position being closed would trap
            # it through the very event the rule exists to avoid. R16_EVENT_DAY refuses ENTER only.
            #
            # ⚠️ The calendar covers 2026-01-01 to 2026-12-31 ONLY. These eight dates are that whole year;
            # the list must be EXTENDED for 2027, and nothing here detects that it has run out — a stale list
            # simply stops matching and the desk trades through the day. Re-read the calendar each January.
            #
            # The inflation-report dates in that calendar are deliberately NOT included: it carries 2 for the
            # year where a full year has 12, so the list is incomplete and would give false protection.
            - name: BROKER_EXECUTION_NO_TRADE_DATES
              value: "2026-01-28,2026-03-18,2026-04-29,2026-06-17,2026-07-29,2026-09-16,2026-10-28,2026-12-09"
            - name: BROKER_EXECUTION_MAX_QUANTITY
              value: "1"
            - name: BROKER_EXECUTION_MAX_CREDIT
              value: "100.0"
            - name: BROKER_EXECUTION_REPRICE_MS
              value: "3000"
            - name: BROKER_EXECUTION_CHASE_MS
              value: "300000"
            - name: BROKER_EXECUTION_MAX_CHASE_GIVEUP_FRACTION
              value: "0.25"
          ports:
            - name: http
              containerPort: 8131
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 1Gi
