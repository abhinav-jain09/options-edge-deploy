apiVersion: v1
kind: Service
metadata:
  name: spx-mission-control-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: spx-mission-control-service
    app.kubernetes.io/component: mission-control
    app.kubernetes.io/part-of: options-edge
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8096"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: spx-mission-control-service
  ports:
    - name: http
      port: 8096
      targetPort: http
