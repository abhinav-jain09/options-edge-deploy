apiVersion: apps/v1
kind: Deployment
metadata:
  name: amt-order-bridge
  namespace: options-edge
  labels:
    app.kubernetes.io/name: amt-order-bridge
    app.kubernetes.io/component: amt-order-bridge
    app.kubernetes.io/part-of: options-edge
spec:
  # Deployed INERT: AMT_BRIDGE_ENABLED=false reads the desk and publishes nothing, logging only what it
  # WOULD ask for. The bridge holds no broker connection in any case.
  # replicas 0 — but the hold that MATTERS is the entry in the three ops lists, because a replica count
  # in a manifest is not a hold by itself (review, BLOCKER). All three list this service, verified
  # 2026-09-24, and each reaches it by its own route — do not assume one shape covers all three:
  #   oe-boot-bringup.sh:40,90  KEEP_DOWN, applied to every Deployment in the namespace that is
  #                             currently at 0 — no part-of selector, and `grep -vE` is a SUBSTRING
  #                             match, not an exact one
  #   morning-autostart.sh:29,75  KEEP_DOWN, applied to the part-of=options-edge Deployments, compared
  #                             as exact names
  #   dev-cleanup.sh:46,587     DISABLED_DEV, compared as exact names (`grep -qxE`)
  # tests/test_keep_down_lists_agree.py fails CI when the two KEEP_DOWN lists disagree. DISABLED_DEV is
  # dev-only and is NOT covered by that test, so it has to be kept in step by hand.
  # The code merged to options-edge-processing main on 2026-09-24 (#888, 7b71452e), but a merge does not
  # produce an image — and neither does any particular service-deploy OUTCOME. Five review rounds were
  # spent trying to write a run-outcome rule here and every version was wrong, because the image is not
  # produced by THIS job: options-edge-processing builds and pushes it. service-deploy triggers that job
  # when BUILD_IMAGES=true (Jenkinsfile.service-deploy:276,351), it can be run on its own, and
  # REQUIRED_IMAGE (:97) deploys an already-pushed digest with no build at all. So a RED service-deploy
  # can sit on top of a pushed image — the child can succeed and the parent then fail fetching its image
  # lock (:374) — and a green parent is not the only way one arrives.
  # Do not infer it from a build result. LOOK: the image exists exactly when the registry has it.
  #   dev   curl -s http://localhost:5001/v2/options-edge-amt-order-bridge/tags/list
  #   prod  curl -s http://192.168.100.252:5000/v2/options-edge-amt-order-bridge/tags/list
  # (the cluster dials the dev one as host.docker.internal:5001; from a shell on the Mac it is
  # localhost:5001. NAME_UNKNOWN means no image has ever been pushed for this service.)
  # Until that answers with the tag, a running replica sits in ImagePullBackOff and tells nobody
  # anything. Scale to 1 once it does — and only when the account owner wants the values above set.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: amt-order-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amt-order-bridge
        app.kubernetes.io/component: amt-order-bridge
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: amt-order-bridge
          image: 192.168.100.252:5000/options-edge-amt-order-bridge:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
          env:
            # NOTE: no HTTP health server is implemented yet, so this port is declared and unused and there
            # are deliberately no readiness/liveness probes — a probe against a port nothing listens on
            # would fail the pod rather than describe it.
            - name: HEALTH_PORT
              value: "8132"
            - name: AMT_BRIDGE_AUCTION_TOPIC
              value: es.futures.auction
            - name: AMT_BRIDGE_INTENT_TOPIC
              value: trading.order.intent
            - name: AMT_BRIDGE_CONSUMER_GROUP
              value: amt-order-bridge
            - name: AMT_BRIDGE_ENABLED
              value: "false"          # OWNER SETS THIS: false publishes no intents
            - name: AMT_BRIDGE_INTENT_VALID_MS
              value: "600000"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
