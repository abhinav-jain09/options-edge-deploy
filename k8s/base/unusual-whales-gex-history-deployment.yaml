apiVersion: apps/v1
kind: Deployment
metadata:
  name: unusual-whales-gex-history-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: unusual-whales-gex-history-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unusual-whales-gex-history-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unusual-whales-gex-history-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: unusual-whales-gex-history
          image: 192.168.100.252:5000/options-edge-unusual-whales-gex-history:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: KAFKA_UNUSUAL_WHALES_GEX_TOPIC
              value: options.ibkr.unusualwhales.gex.strike
            - name: KAFKA_UNUSUAL_WHALES_GEX_HISTORY_TOPIC
              value: options.ibkr.unusualwhales.gex.strike.history
            - name: KAFKA_UNUSUAL_WHALES_GEX_HISTORY_STREAMS_APP_ID
              value: options-flow-uw-gex-history-streams-v1
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
