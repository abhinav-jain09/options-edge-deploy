apiVersion: v1
kind: Service
metadata:
  name: pin-flow-explorer
  namespace: options-edge
  labels:
    app.kubernetes.io/name: pin-flow-explorer
    app.kubernetes.io/component: pin-flow-explorer
    app.kubernetes.io/part-of: options-edge
  # No prometheus.io/scrape: this internal tool exposes only the page + /data + /health (no
  # /metrics endpoint). Add a scrape annotation when a metrics endpoint lands.
spec:
  # ClusterIP: internal-only. It is a read-only browser tool, so there is no public ingress.
  # Browser access is via `kubectl -n options-edge port-forward svc/pin-flow-explorer 8080:8080`
  # (this repo has no shared ingress pattern for internal tools to copy).
  selector:
    app.kubernetes.io/name: pin-flow-explorer
  ports:
    - name: http
      port: 8080
      targetPort: http
