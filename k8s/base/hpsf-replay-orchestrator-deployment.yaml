apiVersion: v1
kind: ServiceAccount
metadata:
  name: hpsf-replay-orchestrator
  namespace: options-edge
  labels:
    app.kubernetes.io/name: hpsf-replay-orchestrator-service
    app.kubernetes.io/component: hpsf-replay-orchestrator
    app.kubernetes.io/part-of: options-edge
---
# RBAC: the orchestrator launches per-run Deployments + Jobs and reads live deployment specs +
# pod status for clone-env classification and K8s symmetric failure detection (G1 Phase A).
# Scope is the options-edge namespace only — no cluster-wide permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hpsf-replay-orchestrator
  namespace: options-edge
  labels:
    app.kubernetes.io/name: hpsf-replay-orchestrator-service
    app.kubernetes.io/component: hpsf-replay-orchestrator
    app.kubernetes.io/part-of: options-edge
rules:
  # Discover live deployment shapes for clone (KubernetesReplayProcessorFleet). `watch` is required
  # for the orchestrator's teardown path (`kubectl wait --for=delete`) to confirm clone deletion.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Create/destroy the historical-feed Job per run (KubernetesReplayHistoricalPublisher).
  # `watch` for the same `kubectl wait --for=delete` teardown confirmation.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read pod status for K8s symmetric failure detection (KubeHandle.failures() — G1 Phase A).
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch"]
  # Read ConfigMaps + Secrets the live deployments reference via envFrom so the clone classifier
  # can resolve effective env (ReplayCloneSourceReader).
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hpsf-replay-orchestrator
  namespace: options-edge
  labels:
    app.kubernetes.io/name: hpsf-replay-orchestrator-service
    app.kubernetes.io/component: hpsf-replay-orchestrator
    app.kubernetes.io/part-of: options-edge
subjects:
  - kind: ServiceAccount
    name: hpsf-replay-orchestrator
    namespace: options-edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hpsf-replay-orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpsf-replay-orchestrator-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: hpsf-replay-orchestrator-service
    app.kubernetes.io/component: hpsf-replay-orchestrator
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hpsf-replay-orchestrator-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hpsf-replay-orchestrator-service
        app.kubernetes.io/component: hpsf-replay-orchestrator
        app.kubernetes.io/part-of: options-edge
    spec:
      serviceAccountName: hpsf-replay-orchestrator
      containers:
        - name: hpsf-replay-orchestrator
          image: 192.168.100.252:5000/options-edge-hpsf-replay-orchestrator:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            # Replay safety: orchestrated runs MUST never place live orders.
            - name: HPSF_ORDER_PLACEMENT_ENABLED
              value: "false"
            - name: ORDER_PLACEMENT_ENABLED
              value: "false"
            # Run mode: SAFE-BY-DEFAULT = SIMULATED. SIMULATED accepts API requests but never
            # actually launches real fleet workloads or publishes records — so a prod kustomize
            # render that forgets to patch this stays harmless (no unauthenticated live replay).
            # Dev overlay patches to LIVE_UNSECURED (auth disabled, suitable for Mac docker-desktop).
            # Prod overlay MUST patch to LIVE + supply HPSF_REPLAY_AUTH_ISSUER_URI +
            # HPSF_REPLAY_AUTH_AUDIENCE before the orchestrator can actually run real backtests.
            - name: HPSF_REPLAY_MODE
              value: SIMULATED
            # Runtime selector: kubernetes engages ReplayKubeApi + KubernetesReplayProcessorFleet +
            # KubernetesReplayHistoricalPublisher. Without this the orchestrator stays simulated or
            # falls to process-mode and the RBAC granted to this SA is never exercised.
            - name: HPSF_REPLAY_FLEET_RUNTIME
              value: kubernetes
            # Tell the orchestrator which namespace it operates in (matches the SA + Role above).
            # Env name MUST match ReplayKubeSettings.java's HPSF_REPLAY_FLEET_NAMESPACE.
            - name: HPSF_REPLAY_FLEET_NAMESPACE
              value: options-edge
            # Default-OFF distributed admission so a single-replica deploy works out of the box
            # (in-memory store + rate limit). Switch to postgres/redis when scaling to >1 replica.
            - name: HPSF_REPLAY_ADMISSION_STORE
              value: memory
            - name: HPSF_REPLAY_ADMISSION_RATELIMIT
              value: memory
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx1g"
          ports:
            - name: http
              containerPort: 8095
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
