apiVersion: apps/v1
kind: Deployment
metadata:
  name: breakout-sequencer-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: breakout-sequencer-service
    app.kubernetes.io/part-of: options-edge
spec:
  # THE BASE IS INERT. The sequencer is the ONE writer of the SPX breakout label stream (requirement LBL 12) and refuses to
  # start until two things are true: a registered, unexpired JSON-ingress exception (BREAKOUT_SEQ_JSON_EXCEPTION_ID and
  # _EXPIRES; underlying.spx.price is still JSON and JSON on Kafka is prohibited, ARC 02) and, in any non-dev profile, the
  # writer/resolver/operator principals and a Kafka security file. Neither is set here. replicas 0 is not a hold on its own
  # (boot bring-up, morning autostart and dev-cleanup scale selected deployments up), so the service is ALSO named in all three
  # hold lists.
  replicas: 0
  # One writer only: a rolling update would run the outgoing and incoming sequencer together. (The transactional id fences the
  # old one, but Recreate avoids the fencing event altogether.)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: breakout-sequencer-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: breakout-sequencer-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: breakout-sequencer
          image: 192.168.100.252:5000/options-edge-breakout-sequencer:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
          env:
            # dev-unsecured skips the ACL read-back and says so in the log; a secured environment sets the principals and
            # BREAKOUT_SEQ_KAFKA_SECURITY_FILE instead.
            - name: BREAKOUT_SEQ_PROFILE
              value: dev-unsecured
            - name: BREAKOUT_SEQ_SOURCE_TOPIC
              value: underlying.spx.price
            - name: BREAKOUT_SEQ_STREAM_TOPIC
              value: breakout.sequenced
            - name: BREAKOUT_SEQ_QUARANTINE_TOPIC
              value: breakout.quarantine
            - name: BREAKOUT_SEQ_CONTROL_TOPIC
              value: breakout.control.in
            - name: BREAKOUT_SEQ_CORRECTION_TOPIC
              value: breakout.correction.in
            - name: BREAKOUT_SEQ_PRIVATE_KEY_PATH
              value: /etc/breakout-sequencer/v1/signing.key
            - name: BREAKOUT_SEQ_PUBLIC_KEY_PATH
              value: /etc/breakout-sequencer/v1/signing.pub
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx512m"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            # Writable: the development profile generates its key set here ONCE (KeyInit, atomic, never replaces an existing set).
            - name: signing-key
              mountPath: /etc/breakout-sequencer
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: signing-key
          persistentVolumeClaim:
            claimName: breakout-sequencer-keys
