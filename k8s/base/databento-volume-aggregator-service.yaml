apiVersion: v1
kind: Service
metadata:
  name: databento-volume-aggregator
  namespace: options-edge
  labels:
    app.kubernetes.io/name: databento-volume-aggregator
    app.kubernetes.io/part-of: options-edge
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
spec:
  selector:
    app.kubernetes.io/name: databento-volume-aggregator
  ports:
    - name: health
      port: 8080
      targetPort: health
