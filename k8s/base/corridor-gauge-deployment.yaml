apiVersion: apps/v1
kind: Deployment
metadata:
  name: corridor-gauge-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: corridor-gauge-service
    app.kubernetes.io/part-of: options-edge
spec:
  # OFF PERMANENTLY on dev and production (owner decision 2026-10-26: "Corridor Gauge service on
  # production and dev put permanent off"). There is no *_ENABLED flag on this service, so replicas
  # IS the switch, and setting it in the BASE keeps every generated overlay slice at 0 instead of
  # relying on each env to remember. Paired with adding corridor-gauge-service to DISABLED_DEV in
  # ~/oe-ops/dev-cleanup.sh: do_start scales everything NOT in that set to --replicas=1 regardless of
  # the manifest, so the repo change alone would be undone by the next dev bring-up.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: corridor-gauge-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: corridor-gauge-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: corridor-gauge
          image: 192.168.100.252:5000/options-edge-corridor-gauge:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          # No CORRIDOR_GAUGE_* overrides on purpose: the in-code defaults ARE the locked
          # 24-session backtest values (CORRIDOR-GAUGE-GATE1.md), and every published record
          # carries a hash of the effective config — changing a value here starts a NEW
          # evidence cohort and restarts the shadow-mode acceptance clock. SHADOW MODE:
          # nothing reads corridor-gauge-state until the gate passes on live sessions.
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          # Sized against gamma-migration, the closest peer: same one-task-per-board topology,
          # LIGHTER input (strike-intelligence-by-strike, ~640k records/day vs the per-second
          # GEX ladder), a 15-second punctuator instead of per-second emission. Memory holds
          # ~18 min of per-strike series for ~150 strikes plus four small state stores.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
