apiVersion: apps/v1
kind: Deployment
metadata:
  name: option-pressure-state-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: option-pressure-state-service
    app.kubernetes.io/part-of: options-edge
spec:
  # THE BASE IS INERT, and production runs the base. Both gates here are shut:
  #   1. OPTION_PRESSURE_ENABLED defaults false, so this service's topology does not start.
  #   2. Upstream, OPB_L1_ENABLED is false in the base, so option-price-behavior emits no
  #      option-price-behavior-l1-contributions records for it to read.
  # DEV opens both, and only dev: the OPB dev env patch sets OPB_L1_ENABLED, and
  # k8s/overlays/dev/option-pressure-state-dev-enable-patch.yaml sets replicas 1 and
  # OPTION_PRESSURE_ENABLED=true. The PRODUCER must be deployed first, because it is what creates
  # the input topic and Kafka Streams refuses to start a topology whose source topic is absent.
  # Production therefore stays at zero from this file, and no production image is built for it.
  # NOTE, checked 2026-10-17 rather than assumed: production's INSTALLED
  # ~/oe-ops/morning-autostart.sh does NOT carry the KEEP_DOWN entry this repository added for this
  # service, and ~/oe-ops/oe-boot-bringup.sh is not installed there at all. That script scales every
  # deployment it does not hold down to one replica, so once a production image exists it would
  # start this service inert rather than leave it absent. Installing this repository's copy is what
  # would actually hold it; until then what holds production is that there is no image to pull.
  # The topics are provisioned by the services themselves at startup, with declared retention rather
  # than the platform default of infinite: contributions 4 days, symbol rekey 2 days, evidence
  # 3 days, and the head topic compacted. Measured on a real session of 944,068 contributions that is
  # roughly 12.5 GiB steady state; see docs/option-price-behavior/L1-PRESSURE-STATE-CAPACITY.md in
  # options-edge-processing.
  #
  # What it does, where it runs: consume the L1 contributions, aggregate one-second information
  # blocks per strike AND per symbol, and publish option-pressure-state-current / -evidence as AVRO
  # through the Schema Registry (released schemas in options-edge-contracts, schemas/optionpressure).
  # This is a DESCRIPTIVE surface. Every frame carries actionable=false and nothing downstream may
  # trade on one: the register was REJECTED on two gate sets, and a Lane D validation over the
  # Databento SPXW year found no directional content (see
  # opb-calibration/LANE-D-VALIDATION-RESULT.md in options-edge-processing). What it does say is what
  # the flow currently looks like, in a vocabulary that is MEASURED rather than seeded: the symbol
  # thresholds are the p95 and p90 of |level| over 5,504,676 GOOD seconds of the 251-session corpus,
  # replacing a seed that fired on 34.5% of all seconds. The strike thresholds remain seeds.
  #
  # Enabling production is not just a replica count. It needs an ENVIRONMENT=production image, and it
  # needs OPB_L1_ENABLED on option-price-behavior, which adds a per-trade sink forward inside that
  # service's exactly-once transaction — the same class of change as the 2026-07-14 incident recorded
  # in k8s/overlays/production/option-price-behavior-prod-patch.yaml, which froze all OPB output for
  # about an hour during RTH and is read by the gateway and the web page. Measure the throughput on a
  # real dev session before enabling it here.
  replicas: 0
  # Recreate, not RollingUpdate: both engines keep RocksDB state on one ReadWriteOnce PVC under a
  # single Streams application id, and a rolling replacement can run the outgoing and incoming pod
  # against the same state directory. Set now so a later enable cannot inherit the wrong strategy.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: option-pressure-state-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: option-pressure-state-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: option-pressure-state
          image: 192.168.100.252:5000/options-edge-option-pressure-state:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            # Shut. The topology is not built until this is true.
            - name: OPTION_PRESSURE_ENABLED
              value: "false"
            # Produced by option-price-behavior only when OPB_L1_ENABLED is true, which it is not.
            - name: OPTION_PRESSURE_INPUT_TOPIC
              value: option-price-behavior-l1-contributions
            - name: OPTION_PRESSURE_HEAD_TOPIC
              value: option-pressure-state-current
            - name: OPTION_PRESSURE_EVIDENCE_TOPIC
              value: option-pressure-state-evidence
            - name: OPTION_PRESSURE_STREAMS_APP_ID
              value: option-pressure-state-service
            - name: OPTION_PRESSURE_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            # perBlockWeightCap is MEASURED (options-edge-processing #1062, #1063): 181.7464 for the
            # strike engine and 457.2593 for the symbol engine, the 99.5th percentiles of uncapped
            # block mass over the Databento SPXW year. They are code defaults, not env-readable, and
            # are named here only so an operator can see which values an image carries.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx1g"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
      volumes:
        - name: kafka-streams-state
          # Both engines use persistent RocksDB stores, so local state must survive a pod
          # replacement rather than rebuilding from the changelogs on every restart.
          persistentVolumeClaim:
            claimName: option-pressure-state-service-streams-state
