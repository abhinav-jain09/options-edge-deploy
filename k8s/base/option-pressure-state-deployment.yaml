apiVersion: apps/v1
kind: Deployment
metadata:
  name: option-pressure-state-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: option-pressure-state-service
    app.kubernetes.io/part-of: options-edge
spec:
  # THE BASE IS INERT, and that is now a default rather than a policy: BOTH dev and production
  # enable this service through their own overlay patch, and the base stays shut so a third
  # environment does not inherit it by accident. The experiment overlay does not patch this service
  # at all, which is exactly why the gates were not simply flipped here.
  #   1. OPTION_PRESSURE_ENABLED defaults false, so this service's topology does not start.
  #   2. Upstream, OPB_L1_ENABLED is false in the base, so option-price-behavior emits no
  #      option-price-behavior-l1-contributions records for it to read.
  # Dev opens both via k8s/overlays/dev/option-pressure-state-dev-enable-patch.yaml and the OPB dev
  # env patch; production opens both via
  # k8s/overlays/production/option-pressure-state-prod-enable-patch.yaml and OPB_L1_ENABLED in
  # k8s/overlays/production/option-price-behavior-prod-patch.yaml. In BOTH environments the PRODUCER
  # must be deployed first, because it creates the input topic and Kafka Streams refuses to start a
  # topology whose source topic is absent.
  #
  # The hold-down entries this service used to carry in scripts/ops/morning-autostart.sh and
  # scripts/ops/oe-boot-bringup.sh are REMOVED, because production is meant to run it now. They were
  # never the production hold in any case: checked outside this repository on 2026-10-17 and again on
  # 2026-10-18, `ssh abhinav@192.168.100.252 'grep -c option-pressure-state-service ~/oe-ops/morning-autostart.sh'`
  # returned 0 - the INSTALLED copy never carried the entry - and
  # `ssh abhinav@192.168.100.252 'test -f ~/oe-ops/oe-boot-bringup.sh && echo PRESENT || echo ABSENT'`
  # prints ABSENT, so that script is not installed there at all. Both are external facts this
  # repository cannot establish; re-run them rather than trusting these lines.
  #
  # HISTORY, kept because it was wrong in a way worth not repeating. Earlier versions of this note,
  # and three files that copied it, said the absent production image was what held production inert.
  # An absent image is not a hold. A scale-up sets the desired count to 1 and what follows depends on
  # the node: the PRODUCTION RENDER sets imagePullPolicy IfNotPresent
  # (k8s/services/option-pressure-state/overlays/production/manifest.yaml - the field two screens
  # below in THIS file says Always, and the render is what runs), so a node holding that exact image
  # cached starts the pod without contacting the registry and only a node without it gets
  # ImagePullBackOff. Either outcome is a pod that should not be there, not replicas 0. That question
  # is now moot for this service, since production is supposed to be running it.
  # The topics are provisioned by the services themselves at startup, with declared retention rather
  # than the platform default of infinite: contributions 4 days, symbol rekey 2 days, evidence
  # 3 days, and the head topic compacted. Measured on a real session of 944,068 contributions that is
  # roughly 12.5 GiB steady state; see docs/option-price-behavior/L1-PRESSURE-STATE-CAPACITY.md in
  # options-edge-processing.
  #
  # What it does, where it runs: consume the L1 contributions, aggregate one-second information
  # blocks per strike AND per symbol, and publish option-pressure-state-current / -evidence as AVRO
  # through the Schema Registry (released schemas in options-edge-contracts, schemas/optionpressure).
  # This is a DESCRIPTIVE surface. Every frame carries actionable=false and nothing downstream may
  # trade on one. What it does say is what the flow currently looks like, in a vocabulary that is
  # MEASURED rather than seeded. Every claim in the next sentence comes from ANOTHER repository and
  # cannot be checked here - each has a named artefact in options-edge-processing at the commit that
  # merged it, and that artefact is the evidence, not this comment: the register was REJECTED on two
  # gate sets and a Lane D validation over the Databento SPXW year found no directional content
  # (opb-calibration/LANE-D-VALIDATION-RESULT.md); the symbol thresholds are the p95 and p90 of
  # |level| over 5,504,676 GOOD seconds of the 251-session corpus, replacing a seed that fired on
  # 34.5% of all seconds (PR #1102, merged 2026-10-18, PressureConfig and
  # PressureConfigIdentityTest); the Avro schemas are options-edge-contracts PR #109 and the
  # producer change is options-edge-processing PR #1103, both merged 2026-10-18. The strike
  # thresholds remain seeds, which PressureConfig says in the code.
  #
  # PRODUCTION IS ENABLED, and the two prerequisites it had are met by the change that enabled it.
  # BOTH are external facts this repository cannot establish - re-run the commands rather than
  # trusting these lines:
  #   - An ENVIRONMENT=production image of this service exists. Checked 2026-10-18:
  #     `curl -s http://192.168.100.252:5000/v2/options-edge-option-pressure-state/tags/list`
  #     returns {"name":"options-edge-option-pressure-state","tags":["prod-1924-2bf3f8bb2a6c","prod"]}.
  #     Before this change the same command returned NAME_UNKNOWN for the repository itself, which is
  #     stronger than a missing :prod tag.
  #   - OPB_L1_ENABLED is set in k8s/overlays/production/option-price-behavior-prod-patch.yaml
  #     together with a rebuilt production image that actually READS it. The previous one,
  #     prod-1650-d6a7d010980a built 2026-09-22, contained zero occurrences of that variable, so the
  #     flag alone would have been inert. Verifiable in options-edge-processing, not here. On
  #     2026-10-18 this printed 0 for BOTH variables at the OLD commit - the sink name as well as the
  #     flag - and 1 and 3 at the NEW one, which is what establishes that the replacement image
  #     actually reads the flag rather than merely being newer:
  #     `for c in d6a7d010980a e0274feaf6b2; do for v in OPB_L1_ENABLED L1_CONTRIB_SINK; do git show $c:option-price-behavior-service/src/main/java/app/pricebehavior/OptionPriceBehaviorStreams.java | grep -c "$v"; done; done`
  #     The new production image is tag prod-1927-e0274feaf6b2, whose suffix is that commit; the
  #     registry listing for options-edge-option-price-behavior shows it alongside the old
  #     prod-1650-d6a7d010980a.
  #
  # THE EVIDENCE FOR THE OFFSET CLAIM BELOW lives here too, so the three files that mention it can
  # point at one copy instead of repeating it - which is how four copies of an earlier note drifted
  # apart. On 2026-10-18 this printed `0 across 32 partitions` for all four topics:
  #   for t in option-price-behavior-l1-contributions option-pressure-state-current option-pressure-state-evidence option-pressure-state-service-dev-symbol-rk; do printf '%s ' "$t"; ~/kafka-4.3.0/bin/kafka-get-offsets.sh --bootstrap-server localhost:19092 --topic "$t" | awk -F: '{s+=$3; n++} END {if (n==0) print "NO-OUTPUT-DO-NOT-READ-AS-ZERO"; else printf "%d across %d partitions\n", s, n}'; done
  # It leaves stderr alone and prints its partition count on purpose: a bare
  # `awk '{s+=$3} END {print s+0}'` prints 0 on NO input, so an absent topic or an unreachable
  # broker would read as a confirmed zero. All of these are external checks; re-run them.
  #
  # THE RISK THAT CAME WITH IT, stated here because this is where someone will look. OPB_L1_ENABLED
  # adds a per-trade sink forward inside option-price-behavior's exactly-once transaction. The
  # 2026-07-14 incident recorded in that same production patch is the comparison: added per-trade
  # multi-key STORE work under exactly-once wedged OPB's SESSION thread and froze all OPB output for
  # about an hour during RTH, and the gateway and the web page read that output. A sink forward is a
  # much smaller operation than those store updates, but that is an argument about magnitude and not
  # a measurement - none exists, because every pressure topic on dev still reads log end offset 0
  # (the command and its output are above, in this same comment).
  # IF OPB OUTPUT STALLS, SET OPB_L1_ENABLED BACK TO false FIRST.
  replicas: 0
  # Recreate, not RollingUpdate: both engines keep RocksDB state on one ReadWriteOnce PVC under a
  # single Streams application id, and a rolling replacement can run the outgoing and incoming pod
  # against the same state directory. Set now so a later enable cannot inherit the wrong strategy.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: option-pressure-state-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: option-pressure-state-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: option-pressure-state
          image: 192.168.100.252:5000/options-edge-option-pressure-state:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            # Shut. The topology is not built until this is true.
            - name: OPTION_PRESSURE_ENABLED
              value: "false"
            # Produced by option-price-behavior only when OPB_L1_ENABLED is true, which it is not.
            - name: OPTION_PRESSURE_INPUT_TOPIC
              value: option-price-behavior-l1-contributions
            - name: OPTION_PRESSURE_HEAD_TOPIC
              value: option-pressure-state-current
            - name: OPTION_PRESSURE_EVIDENCE_TOPIC
              value: option-pressure-state-evidence
            - name: OPTION_PRESSURE_STREAMS_APP_ID
              value: option-pressure-state-service
            - name: OPTION_PRESSURE_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            # perBlockWeightCap is MEASURED (options-edge-processing #1062, #1063): 181.7464 for the
            # strike engine and 457.2593 for the symbol engine, the 99.5th percentiles of uncapped
            # block mass over the Databento SPXW year. They are code defaults, not env-readable, and
            # are named here only so an operator can see which values an image carries.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx1g"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
      volumes:
        - name: kafka-streams-state
          # Both engines use persistent RocksDB stores, so local state must survive a pod
          # replacement rather than rebuilding from the changelogs on every restart.
          persistentVolumeClaim:
            claimName: option-pressure-state-service-streams-state
