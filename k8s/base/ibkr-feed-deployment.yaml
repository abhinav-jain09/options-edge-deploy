apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibkr-feed-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: ibkr-feed-service
    app.kubernetes.io/part-of: options-edge
spec:
  # DISABLED until further notice (USER 2026-07-30): ibkr-feed-service must NEVER be
  # deployed to production. IBKR is out of scope; VIX comes from vix-option-inteligence
  # + the vix bridge. Held at 0 in every monolith env (dev + production).
  # Re-enable = replicas 1 + re-run generate-service-slices.sh + revert the ops entries.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ibkr-feed-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ibkr-feed-service
        app.kubernetes.io/part-of: options-edge
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Pin to the control-plane node (192.168.100.252). IB Gateway / TWS runs ONLY on
      # node A and this pod uses hostNetwork + IB_HOST=127.0.0.1:4001, so it MUST be
      # co-located with IB Gateway — on the oe-failover-56 node (.4) there is no
      # :4001 listener and the feed crash-loops ("Could not connect to IBKR at
      # 127.0.0.1:4001"). Same control-plane pin as the web + keycloak deployments.
      # (The dev overlay removes this selector — docker-desktop's single node is not
      # labelled control-plane=true.)
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: ibkr-feed
          image: 192.168.100.252:5000/options-edge-ibkr-feed:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 8
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
