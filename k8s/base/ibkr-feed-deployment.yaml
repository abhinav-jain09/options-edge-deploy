apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibkr-feed-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: ibkr-feed-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ibkr-feed-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ibkr-feed-service
        app.kubernetes.io/part-of: options-edge
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: ibkr-feed
          image: 192.168.100.252:5000/options-edge-ibkr-feed:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 8
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
