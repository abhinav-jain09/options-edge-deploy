apiVersion: apps/v1
kind: Deployment
metadata:
  name: delta-flow-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: delta-flow-service
    app.kubernetes.io/component: delta-flow-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: delta-flow-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: delta-flow-service
        app.kubernetes.io/component: delta-flow-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: delta-flow
          image: 192.168.100.252:5000/options-edge-delta-flow:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: HEALTH_PORT
              value: "8110"
            - name: DELTA_FLOW_INPUT_TCBBO_TOPIC
              value: options.opra.tcbbo
            - name: DELTA_FLOW_INPUT_GEX_TOPIC
              value: options.databento.gex.strike
            - name: DELTA_FLOW_STREAMS_APP_ID
              value: options-edge-delta-flow-service
            - name: DELTA_FLOW_STREAMS_COMMIT_INTERVAL_MS
              value: "1000"
            - name: DELTA_FLOW_STREAMS_AUTO_OFFSET_RESET
              value: latest
            - name: DELTA_FLOW_STREAMS_NUM_THREADS
              value: "1"
            - name: KAFKA_STREAMS_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx768m"
          ports:
            - name: health
              containerPort: 8110
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 4Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
