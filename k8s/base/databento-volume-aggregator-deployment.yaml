apiVersion: apps/v1
kind: Deployment
metadata:
  name: databento-volume-aggregator
  namespace: options-edge
  labels:
    oe.replay/include: "true"
    oe.replay/side-effects: "false"
    oe.replay/topic-remap: "required"
    oe.replay/state: "ephemeral"
    oe.replay/determinism: "event-time"
    app.kubernetes.io/name: databento-volume-aggregator
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: databento-volume-aggregator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: databento-volume-aggregator
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: databento-volume-aggregator
          image: 192.168.100.252:5000/options-edge-databento-volume-aggregator:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: KAFKA_DATABENTO_EVENTS_TOPIC
              value: options.databento.events.raw
            - name: KAFKA_DATABENTO_SNAPSHOT_TOPIC
              value: options.databento.raw
            - name: KAFKA_DATABENTO_NORMALIZED_TOPIC
              value: options.databento.normalized
            # -v2: topology reshaped so the events accumulator is the sole writer of the volume state
            # store and the snapshot path reads a global projection (fixes cumulative volume resetting to
            # 0 on redeploy). The bump gives a fresh changelog/consumer-group/state-dir, so the polluted
            # -v1 state is never restored — no manual Kafka reset required. Must match the configmap value.
            - name: KAFKA_DATABENTO_VOLUME_AGGREGATOR_APP_ID
              value: options-flow-databento-volume-aggregator
            - name: KAFKA_DATABENTO_VOLUME_AGGREGATOR_STREAMS_NUM_THREADS
              value: "2"
            - name: KAFKA_DATABENTO_VOLUME_AGGREGATOR_CACHE_MAX_BYTES_BUFFERING
              value: "0"
            - name: KAFKA_DATABENTO_VOLUME_AGGREGATOR_PROCESSING_GUARANTEE
              value: exactly_once_v2
            # exactly_once_v2 makes Streams REFUSE to open a RocksDB state dir that was not cleanly
            # closed ("State store ... didn't find a valid state, since under EOS it has the risk of
            # getting uncommitted data in stores"). A hard reboot of .252 leaves exactly that, and
            # because the state lives on a PVC it SURVIVES the pod restart — so the pod
            # CrashLoopBackOffs forever until someone wipes the dir by hand (done manually on
            # 2026-07-22 and again on 2026-07-29). Wiping local state on start makes the service
            # self-healing: the store rebuilds from its changelog (no data loss, ~50s restore).
            # Same knob strike-flow-classifier already uses.
            - name: KAFKA_STREAMS_CLEANUP_ON_START
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx1536m"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
