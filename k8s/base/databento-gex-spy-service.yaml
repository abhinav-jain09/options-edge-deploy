apiVersion: v1
kind: Service
metadata:
  name: databento-gex-spy-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: databento-gex-spy-service
    app.kubernetes.io/part-of: options-edge
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8100"
spec:
  selector:
    app.kubernetes.io/name: databento-gex-spy-service
  ports:
    - name: health
      port: 8100
      targetPort: health
