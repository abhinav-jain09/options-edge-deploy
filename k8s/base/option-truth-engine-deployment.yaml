apiVersion: apps/v1
kind: Deployment
metadata:
  name: option-truth-engine-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: option-truth-engine-service
    app.kubernetes.io/component: option-truth-engine-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 1200
  selector:
    matchLabels:
      app.kubernetes.io/name: option-truth-engine-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: option-truth-engine-service
        app.kubernetes.io/component: option-truth-engine-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: option-truth-engine
          image: 192.168.100.252:5000/options-edge-option-truth-engine:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: HEALTH_PORT
              value: "8131"
            - name: OPTION_TRUTH_ENABLED
              value: "true"
            - name: OPTION_TRUTH_INPUT_TOPIC
              value: options.databento.gex.flow.by-strike
            - name: OPTION_TRUTH_OUTPUT_TOPIC
              value: options.spx.option-truth-engine-service.by-strike
            - name: OPTION_TRUTH_STREAMS_APP_ID
              value: options-edge-option-truth-engine-service
            - name: OPTION_TRUTH_PRICING_MODEL
              value: SPOT_BLACK_SCHOLES
            - name: OPTION_TRUTH_EXCLUDE_ZERO_BID
              value: "true"
            - name: OPTION_TRUTH_EOS_ENABLED
              value: "true"
            - name: KAFKA_STREAMS_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            - name: JAVA_TOOL_OPTIONS
              value: -Xms256m -Xmx768m
          ports:
            - name: health
              containerPort: 8131
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
