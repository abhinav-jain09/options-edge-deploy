apiVersion: apps/v1
kind: Deployment
metadata:
  name: raw-to-display-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: raw-to-display-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: raw-to-display-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raw-to-display-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: raw-to-display
          image: 192.168.100.252:5000/options-edge-raw-to-display:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: IBKR
            - name: KAFKA_RAW_TOPIC
              value: options.ibkr.raw
            - name: KAFKA_RAW_IBKR_TOPIC
              value: options.ibkr.raw
            - name: KAFKA_DISPLAY_STREAMS_APP_ID
              value: options-flow-display-streams-v8
            - name: KAFKA_DISPLAY_STREAMS_NUM_THREADS
              value: "2"
            - name: KAFKA_DISPLAY_STREAMS_CACHE_MAX_BYTES_BUFFERING
              value: "0"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx1536m"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
