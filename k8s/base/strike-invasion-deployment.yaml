apiVersion: apps/v1
kind: Deployment
metadata:
  name: strike-invasion-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: strike-invasion-service
    app.kubernetes.io/component: strike-invasion-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: strike-invasion-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strike-invasion-service
        app.kubernetes.io/component: strike-invasion-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: strike-invasion
          image: 192.168.100.252:5000/options-edge-strike-invasion:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: HEALTH_PORT
              value: "8120"
            # --- input topics (existing derived analytics only; no raw OPRA) ---
            - name: STRIKE_INVASION_INPUT_SPOT_TOPIC
              value: underlying.spx.price
            - name: STRIKE_INVASION_INPUT_SR_TOPIC
              value: options.spx.strike-sr.current
            - name: STRIKE_INVASION_INPUT_GEX_TOPIC
              value: options.databento.gex.strike
            - name: STRIKE_INVASION_INPUT_DELTA_FLOW_TOPIC
              value: delta-flow-by-strike
            - name: STRIKE_INVASION_INPUT_PRICE_BEHAVIOR_TOPIC
              value: option-price-behavior-by-strike
            - name: STRIKE_INVASION_INPUT_PACE_TOPIC
              value: options.databento.pace.mission
            # --- output topics (consumed by feed-gateway / mission-control / postgres-writer) ---
            - name: STRIKE_INVASION_OUTPUT_CURRENT_TOPIC
              value: options.spx.strike-invasion.current
            - name: STRIKE_INVASION_OUTPUT_EVENTS_TOPIC
              value: options.spx.strike-invasion.events
            # --- Kafka Streams ---
            - name: STRIKE_INVASION_STREAMS_APP_ID
              value: options-edge-strike-invasion-service-v1
            - name: STRIKE_INVASION_STREAMS_COMMIT_INTERVAL_MS
              value: "1000"
            - name: STRIKE_INVASION_STREAMS_AUTO_OFFSET_RESET
              value: latest
            - name: STRIKE_INVASION_STREAMS_NUM_THREADS
              value: "1"
            - name: STRIKE_INVASION_EOS_ENABLED
              value: "true"
            - name: KAFKA_STREAMS_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            - name: STRIKE_INVASION_ENABLED
              value: "true"
            # Stateful Streams app: per-source RocksDB stores (SR/GEX/flow/behavior/pace) hold
            # off-heap native memory outside the JVM heap. 2Gi heap + 4Gi limit matches the tier
            # given to the other OOM-tight per-strike Streams services (strike-intelligence).
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx2048m"
          ports:
            - name: health
              containerPort: 8120
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
