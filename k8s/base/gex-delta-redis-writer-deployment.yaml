apiVersion: apps/v1
kind: Deployment
metadata:
  name: gex-delta-redis-writer
  namespace: options-edge
  labels:
    app.kubernetes.io/name: gex-delta-redis-writer
    app.kubernetes.io/component: gex-delta-redis-writer
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gex-delta-redis-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gex-delta-redis-writer
        app.kubernetes.io/component: gex-delta-redis-writer
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: gex-delta-redis-writer
          image: 192.168.100.252:5000/options-edge-gex-delta-redis-writer:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: HEALTH_PORT
              value: "8101"
            # Source: the GEX strike topic databento-gex-service produces.
            - name: KAFKA_DATABENTO_GEX_STRIKE_TOPIC
              value: options.databento.gex.strike
            # Redis target. The key prefix MUST match the classifier's STRIKE_FLOW_DELTA_REDIS_KEY_PREFIX
            # or every classifier lookup silently misses.
            - name: GEX_DELTA_REDIS_HOST
              value: options-edge-redis
            - name: GEX_DELTA_REDIS_PORT
              value: "6379"
            - name: GEX_DELTA_REDIS_KEY_PREFIX
              value: "gexdelta:"
            # GC budget for Redis keys (ms). The classifier's freshness gate (~90s) is authoritative;
            # this just expires stale strikes from the cache.
            - name: GEX_DELTA_REDIS_TTL_MS
              value: "300000"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx512m"
          ports:
            - name: health
              containerPort: 8101
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
