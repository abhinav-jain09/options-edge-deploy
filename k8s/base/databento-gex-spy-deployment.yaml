apiVersion: apps/v1
kind: Deployment
metadata:
  name: databento-gex-spy-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: databento-gex-spy-service
    app.kubernetes.io/part-of: options-edge
# Dedicated SPY GEX instance for the unified support/resistance engine's SPX+SPY confluence.
# Reads ONLY the isolated SPY raw topic (options.databento.raw.spy) and emits SPY dealer-gamma onto the
# SHARED options.databento.gex.strike (keyed by symbol|expiry|strike), which the unified S/R engine reads.
# It NEVER touches the SPX raw pipeline. Identical to databento-gex-service except: input topic, a distinct
# Streams application id (own consumer group + internal/changelog topics + state dir), and the dealer-sign
# model — same NAIVE model as SPX (the 1-year SPXW backtest result; applied to SPY pending its own calibration).
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: databento-gex-spy-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: databento-gex-spy-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: databento-gex-spy
          image: 192.168.100.252:5000/options-edge-databento-gex:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: HEALTH_PORT
              value: "8100"
            # Isolated SPY input topic — NOT the shared SPX options.databento.raw.
            - name: KAFKA_DATABENTO_RAW_TOPIC
              value: options.databento.raw.spy
            # Shared GEX output (keyed by symbol|expiry|strike); the unified S/R engine reads SPY here.
            - name: KAFKA_DATABENTO_GEX_TOPIC
              value: options.databento.gex.strike
            # DISTINCT Streams application id: own consumer group, own *-changelog/*-repartition internal
            # topics, and own state dir — so it does NOT clash with the SPX databento-gex-service.
            - name: KAFKA_GEX_STREAMS_APP_ID
              value: options-databento-gex-spy-streams-v1
            - name: KAFKA_GEX_STREAMS_NUM_THREADS
              value: "4"
            # Same dealer-positioning sign model as SPX (NAIVE call +1 / put -1). See databento-gex-deployment
            # for the 1-year SPXW 0DTE backtest that retired the flow-adjusted path; SPY reuses NAIVE until a
            # SPY-specific calibration exists.
            - name: DATABENTO_GEX_DEALER_SIGN_MODEL
              value: NAIVE_CALL_PLUS_PUT_MINUS
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms1g -Xmx4g"
          ports:
            - name: health
              containerPort: 8100
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 5Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
