apiVersion: apps/v1
kind: Deployment
metadata:
  name: pin-flow-explorer
  namespace: options-edge
  labels:
    app.kubernetes.io/name: pin-flow-explorer
    app.kubernetes.io/component: pin-flow-explorer
    app.kubernetes.io/part-of: options-edge
spec:
  # Single replica: a read-only internal browser tool that queries the pin_* Postgres tables.
  # No Kafka, no shared state — one replica is sufficient and a second adds nothing.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pin-flow-explorer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pin-flow-explorer
        app.kubernetes.io/component: pin-flow-explorer
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: pin-flow-explorer
          image: 192.168.100.252:5000/options-edge-pin-flow-explorer:dev
          imagePullPolicy: Always
          # Shared platform config/secret: POSTGRES_JDBC_URL/USER/PASSWORD (+ the other HPSF_*/
          # platform keys). This service is READ-ONLY — it only reads the pin_* tables and serves
          # an interactive page + /data JSON on the HTTP port. It does NOT use Kafka.
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
