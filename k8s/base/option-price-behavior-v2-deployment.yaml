apiVersion: apps/v1
kind: Deployment
metadata:
  name: option-price-behavior-service-v2
  namespace: options-edge
  labels:
    app.kubernetes.io/name: option-price-behavior-service-v2
    app.kubernetes.io/part-of: options-edge
spec:
  # SURFACE_RESIDUAL_V2 shadow (design §9): runs the SAME image as option-price-behavior-service
  # with OPB_SERVICE_VARIANT=v2, reading the same tcbbo/greeks/underlying inputs and writing the
  # option-price-behavior-v2-* topics. It does NOT touch V1's app.id, state, or output topics.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: option-price-behavior-service-v2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: option-price-behavior-service-v2
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        # Container name stays "option-price-behavior" so the shared image-pin path
        # (scripts/deploy/apply.sh `set image deployment/... option-price-behavior=`) matches.
        - name: option-price-behavior
          image: 192.168.100.252:5000/options-edge-option-price-behavior:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: OPB_SERVICE_VARIANT
              value: v2
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: OPTION_PRICE_BEHAVIOR_INPUT_TCBBO_TOPIC
              value: options.opra.tcbbo
            - name: OPTION_PRICE_BEHAVIOR_INPUT_GREEKS_TOPIC
              value: options.databento.gex.strike
            - name: OPTION_PRICE_BEHAVIOR_INPUT_UNDERLYING_TOPIC
              value: underlying.spx.price
            - name: OPTION_PRICE_BEHAVIOR_V2_BY_OPTION_TOPIC
              value: option-price-behavior-v2-by-option
            - name: OPTION_PRICE_BEHAVIOR_V2_SESSION_TOPIC
              value: option-price-behavior-v2-session
            - name: OPTION_PRICE_BEHAVIOR_V2_STREAMS_APP_ID
              value: option-price-behavior-service-v2
            - name: OPTION_PRICE_BEHAVIOR_V2_STREAMS_NUM_THREADS
              value: "1"
            # First boot reads from earliest so the surface baselines are built before scoring
            # (design §8 bootstrap freshness); steady state advances on committed offsets.
            - name: OPTION_PRICE_BEHAVIOR_V2_STREAMS_AUTO_OFFSET_RESET
              value: earliest
            - name: KAFKA_STREAMS_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx2g"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 2Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
