apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamma-ladder-path-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: gamma-ladder-path-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gamma-ladder-path-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gamma-ladder-path-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: gamma-ladder-path
          image: 192.168.100.252:5000/options-edge-gamma-ladder-path:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            # Gamma Ladder Path (owner requirement 2026-09-19, GATE1 rev 2.3): the ladder is frozen on the
            # first per-strike record carrying today's OI; legs run over spot; the overnight ES path feeds H1.
            # Publishes STATE and EVENTS only — no probabilities until the requirement's §8 gate passes.
            - name: KAFKA_LADDER_PATH_LADDER_TOPIC
              value: options.databento.gex.strike
            - name: KAFKA_LADDER_PATH_PREOPEN_TOPIC
              value: options.databento.gex.strike.preopen
            - name: KAFKA_LADDER_PATH_OI_STATUS_TOPIC
              value: options.databento.gex.oi-status
            - name: KAFKA_LADDER_PATH_SPOT_TOPIC
              value: underlying.spx.index.price
            - name: KAFKA_LADDER_PATH_ES_TOPIC
              value: underlying.es.price
            - name: KAFKA_LADDER_PATH_STATE_TOPIC
              value: options.spx.gamma-ladder-path.state
            - name: KAFKA_LADDER_PATH_EVENTS_TOPIC
              value: options.spx.gamma-ladder-path.events
            - name: LADDER_PATH_SYMBOL
              value: SPX
            - name: LADDER_PATH_SPOT_SYMBOL
              value: SPX
            - name: LADDER_PATH_ES_SYMBOL
              value: ES
            # Two voices on the spot topic (IBKR index LAST in RTH; option-model underlying pre-open): legs
            # read the index only — the same filter context-tape applies.
            - name: LADDER_PATH_SPOT_SOURCE_FILTER
              value: IBKR_INDEX
            - name: LADDER_PATH_SPOT_FIELD_FILTER
              value: LAST
            # Every rule number (band, dwell, thresholds) is a code constant shared with the corpus
            # labeller — deliberately NOT env-tunable, so live labels cannot drift from the corpus.
            - name: LADDER_PATH_HEARTBEAT_MS
              value: "60000"
            - name: LADDER_PATH_SPOT_FRESH_MS
              value: "60000"
            - name: LADDER_PATH_LADDER_FRESH_MS
              value: "120000"
            - name: LADDER_PATH_ES_FRESH_MS
              value: "60000"
            - name: LADDER_PATH_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1024Mi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
