# Off-hours CLEAN-SLATE wipe — SUSPENDED Job template (single source of truth).
#
# This CronJob is created SUSPENDED (spec.suspend: true) and does NOT self-fire.
# It documents the intended cadence + carries the canonical Job template, exactly
# like kafka-changelog-cleanup-cronjob.yaml. It CANNOT wipe anything until a human
# deliberately un-suspends it (and even then, the actual destructive path is gated
# behind the script's DRY_RUN + WIPE_ENABLED + market-hours/identity guards).
#
# WHY SUSPENDED, and why it is NOT the real trigger:
#   1. The cluster enforces a ValidatingAdmissionPolicy
#      (options-edge-jenkins-only-workloads) that DENIES batch/Job creation by any
#      principal except the jenkins-deployer SA. The k8s CronJob controller creates
#      Jobs under its own SA, so a native firing is rejected every night. Keeping it
#      suspend:true avoids spamming denied-Job errors in the k3s log.
#   2. The off-hours wipe needs HOST access (Kafka broker logs, docker json-logs,
#      registry GC) that an in-cluster pod does NOT have. The REAL trigger is the
#      Jenkins job (Jenkinsfile.offhours-clean-slate) which runs the script ON the
#      host over SSH. This manifest is the auditable record of intent + a SAFE
#      no-op until reviewed and explicitly enabled.
#
# DO NOT flip suspend:false without first: (a) provisioning the offhours-* Jenkins
# creds, (b) confirming a DRY-RUN looks correct, (c) sign-off — see the Jenkinsfile
# header and OFFHOURS-CLEAN-SLATE-DESIGN.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: offhours-clean-slate
  namespace: options-edge
  labels:
    app.kubernetes.io/name: offhours-clean-slate
    app.kubernetes.io/part-of: options-edge
    app.kubernetes.io/component: maintenance
spec:
  # SUSPENDED. Never fires until a human un-suspends it AFTER review. The actual
  # run path is the Jenkins job on the host, not this controller.
  suspend: true
  schedule: "30 20 * * 1-5"             # 20:30 ET nightly, trading days — documents the cadence Jenkins fires on
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: offhours-clean-slate
    spec:
      backoffLimit: 0                   # a wipe is not auto-retried in-cluster
      activeDeadlineSeconds: 2400       # 40 min cap per firing
      template:
        metadata:
          labels:
            app.kubernetes.io/name: offhours-clean-slate
        spec:
          restartPolicy: Never
          # Placeholder pod. The in-cluster pod intentionally only ECHOES that the
          # real run path is the Jenkins host job — it does NOT carry the kafka/psql/
          # docker host access the wipe needs, and it must not become an accidental
          # self-firing wipe. The committed script + Jenkinsfile are the truth.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: offhours-clean-slate
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              command: ["sh", "-c"]
              args:
                - |
                  echo "[offhours] This CronJob is a SUSPENDED template only."
                  echo "[offhours] The real off-hours clean-slate runs ON THE HOST via the"
                  echo "[offhours] Jenkins job (Jenkinsfile.offhours-clean-slate), which needs"
                  echo "[offhours] broker-log / docker / registry host access this pod lacks."
                  echo "[offhours] If you are seeing this fire, that is a misconfiguration —"
                  echo "[offhours] re-suspend this CronJob."
                  exit 0
