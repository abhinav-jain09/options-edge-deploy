apiVersion: apps/v1
kind: Deployment
metadata:
  name: option-price-behavior-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: option-price-behavior-service
    app.kubernetes.io/part-of: options-edge
spec:
  # SURFACE_RESIDUAL_V2 is now THE option-price-behavior signal (V1 retired). Same image, run via
  # OPB_SERVICE_VARIANT=v2; reads tcbbo/greeks/underlying and writes the option-price-behavior-v2-*
  # topics that the gateway/UI consume.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: option-price-behavior-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: option-price-behavior-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: option-price-behavior
          image: 192.168.100.252:5000/options-edge-option-price-behavior:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: OPB_SERVICE_VARIANT
              value: v2
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: OPTION_PRICE_BEHAVIOR_INPUT_TCBBO_TOPIC
              value: options.opra.tcbbo
            - name: OPTION_PRICE_BEHAVIOR_INPUT_GREEKS_TOPIC
              value: options.databento.gex.strike
            - name: OPTION_PRICE_BEHAVIOR_INPUT_UNDERLYING_TOPIC
              value: underlying.spx.price
            - name: OPTION_PRICE_BEHAVIOR_V2_BY_OPTION_TOPIC
              value: option-price-behavior-v2-by-option
            - name: OPTION_PRICE_BEHAVIOR_V2_SESSION_TOPIC
              value: option-price-behavior-v2-session
            - name: OPTION_PRICE_BEHAVIOR_V2_STREAMS_APP_ID
              value: option-price-behavior-service-v2
            - name: OPTION_PRICE_BEHAVIOR_V2_STREAMS_NUM_THREADS
              value: "1"
            # First boot reads from earliest so the surface baselines are built before scoring
            # (design §8 bootstrap freshness); steady state advances on committed offsets.
            - name: OPTION_PRICE_BEHAVIOR_V2_STREAMS_AUTO_OFFSET_RESET
              value: earliest
            - name: KAFKA_STREAMS_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            # Calibrated constants from the 22-session 0DTE offline replay (held-out validated;
            # design/OPTION-PRICE-BEHAVIOR-V2-CALIBRATION-LEDGER-RESULTS.md §4). winsorK=7 is the key fix
            # (unit-variance z). The backtest's MID_SIZE_INVALID mark policy is intentionally NOT set:
            # the live tcbbo feed carries real quote sizes, so the default microprice policy applies.
            # k_quote/k_greek stay at defaults until calibrated from this deployment's live staleness.
            - name: OPB_V2_WINSOR_K
              value: "7"
            - name: OPB_V2_HALF_SPREAD_WEIGHT
              value: "0.38"
            - name: OPB_V2_WEIGHT_CAP
              value: "125"
            - name: OPB_V2_Z_THRESHOLD
              value: "2.19"
            # Live-staleness override (stopgap). The default 5s surface/forward freshness gate was fine
            # for the dense offline replay but starves the LIVE signal: the databento gex.strike feed
            # refreshes each strike only ~every 12 min (measured median surface age 706s, p90 ~3h, 0%
            # under 5s), so every trade's baseline surface was >5s old -> surfaceUsable=false -> ~100%
            # excluded NO_BASELINE_SURFACE (samplesEligible=0, directionalPressureZ=0). 900000ms (15 min)
            # accepts ~the fresher half of surfaces; the emitted currentSurfaceAgeMs/baselineSurfaceAgeMs
            # keep staleness auditable. Real fix is faster per-strike gex refresh; revisit when done.
            - name: OPB_V2_MAX_SURFACE_AGE_MS
              value: "900000"
            - name: OPB_V2_MAX_FORWARD_AGE_MS
              value: "900000"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx2g"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 2Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
