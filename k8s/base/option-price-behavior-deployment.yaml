apiVersion: apps/v1
kind: Deployment
metadata:
  name: option-price-behavior-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: option-price-behavior-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: option-price-behavior-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: option-price-behavior-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: option-price-behavior
          image: 192.168.100.252:5000/options-edge-option-price-behavior:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: OPTION_PRICE_BEHAVIOR_INPUT_TCBBO_TOPIC
              value: options.opra.tcbbo
            - name: OPTION_PRICE_BEHAVIOR_INPUT_GREEKS_TOPIC
              value: options.databento.gex.strike
            - name: OPTION_PRICE_BEHAVIOR_INPUT_UNDERLYING_TOPIC
              value: underlying.spx.price
            - name: OPTION_PRICE_BEHAVIOR_DASHBOARD_TOPIC
              value: option-price-behavior-dashboard
            - name: OPTION_PRICE_BEHAVIOR_STREAMS_APP_ID
              value: option-price-behavior-service-v1
            - name: OPTION_PRICE_BEHAVIOR_STREAMS_NUM_THREADS
              value: "1"
            - name: OPTION_PRICE_BEHAVIOR_STREAMS_AUTO_OFFSET_RESET
              value: latest
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx2g"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 2Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
