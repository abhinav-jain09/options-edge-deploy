apiVersion: apps/v1
kind: Deployment
metadata:
  name: option-price-behavior-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: option-price-behavior-service
    app.kubernetes.io/part-of: options-edge
spec:
  # SURFACE_RESIDUAL_V2 is THE (and only) option-price-behavior signal. V1 is DELETED from the codebase
  # (no OptionPriceBehaviorStreams / launcher / OPB_SERVICE_VARIANT), so the image runs V2 directly. It
  # reads tcbbo/greeks/underlying and writes the option-price-behavior-v2-* topics + the per-strike
  # option-price-behavior-by-strike compatibility aggregate that strike-intelligence consumes.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: option-price-behavior-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: option-price-behavior-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: option-price-behavior
          image: 192.168.100.252:5000/options-edge-option-price-behavior:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: OPTION_PRICE_BEHAVIOR_INPUT_TCBBO_TOPIC
              value: options.opra.tcbbo
            - name: OPTION_PRICE_BEHAVIOR_INPUT_GREEKS_TOPIC
              value: options.databento.gex.strike
            - name: OPTION_PRICE_BEHAVIOR_INPUT_UNDERLYING_TOPIC
              value: underlying.spx.price
            - name: OPTION_PRICE_BEHAVIOR_V2_BY_OPTION_TOPIC
              value: option-price-behavior-v2-by-option
            - name: OPTION_PRICE_BEHAVIOR_V2_SESSION_TOPIC
              value: option-price-behavior-v2-session
            # v2r3: bumped for the by-strike stage (new strike-contrib repartition + BY_STRIKE_STORE
            # v2r4: incremental session aggregation (store renamed opb-v2-aggregate-inc). A fresh
            # app.id resets the consumer group to earliest so the new incremental windows backfill
            # from history instead of starting empty mid-session. (v2r3 was the by-strike bump.)
            - name: OPTION_PRICE_BEHAVIOR_V2_STREAMS_APP_ID
              value: option-price-behavior-service-v2r4
            - name: OPTION_PRICE_BEHAVIOR_V2_STREAMS_NUM_THREADS
              value: "4"
            # First boot reads from earliest so the surface baselines are built before scoring
            # (design §8 bootstrap freshness); steady state advances on committed offsets.
            - name: OPTION_PRICE_BEHAVIOR_V2_STREAMS_AUTO_OFFSET_RESET
              value: earliest
            - name: KAFKA_STREAMS_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            # SURFACE_RESIDUAL_V2 bootstrap calibration (OPB_V2_BOOTSTRAP_1 seed values; still
            # BOOTSTRAP_UNCALIBRATED — NOT fit from live samples). Only the env names the code
            # actually reads are set here; the broader calibration/governance knobs are unimplemented.
            - name: OPB_V2_Z_THRESHOLD
              value: "2.05"
            - name: OPB_V2_RESIDUAL_FLOOR_VAR
              value: "0.0004"
            - name: OPB_V2_EWMA_HALFLIFE_MS
              value: "300000"
            # SURFACE_RESIDUAL_V2 bootstrap calibration (OPB_V2_BOOTSTRAP_1 seed values; still
            # BOOTSTRAP_UNCALIBRATED — NOT fit from live samples). Only env names the code reads are
            # set; the broader calibration/governance knobs in the spec are not implemented yet.
            - name: OPB_V2_WINSOR_K
              value: "7.0"
            - name: OPB_V2_K_QUOTE_AGE
              value: "0.12"
            - name: OPB_V2_K_GREEK_AGE
              value: "0.025"
            - name: OPB_V2_HALF_SPREAD_WEIGHT
              value: "0.38"
            - name: OPB_V2_TICK_WEIGHT
              value: "0.50"
            - name: OPB_V2_TICK_SIZE
              value: "0.05"
            - name: OPB_V2_WEIGHT_CAP
              value: "125"
            # Operational status declaration (set by user; verification waived). NOTE: not read by
            # the service code today — the emitted event modelVersion is a hardcoded constant, so
            # this marks the DEPLOYMENT as live/calibrated, not each output event.
            - name: OPB_V2_CALIBRATION_STATUS
              value: "PRODUCTION_CALIBRATED"
            - name: OPB_V2_MODEL_VERSION
              value: "SPXW_0DTE_OPB_AGGRESSIVE_CANDIDATE_V2"
            - name: OPB_V2_DEAUTOCORR_BUCKET_MS
              value: "1000"
            - name: OPB_V2_MIN_VOL
              value: "0.03"
            - name: OPB_V2_MAX_VOL
              value: "5.00"
            - name: OPB_V2_TAU_MIN_SECONDS
              value: "30"
            - name: OPB_V2_MIN_MID
              value: "0.05"
            - name: OPB_V2_MAX_HALF_SPREAD
              value: "1.00"
            - name: OPB_V2_MAX_QUOTE_AGE_MS
              value: "3000"
            - name: OPB_V2_MAX_SURFACE_AGE_MS
              value: "30000"
            - name: OPB_V2_MAX_FORWARD_AGE_MS
              value: "30000"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx2g"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 2Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
