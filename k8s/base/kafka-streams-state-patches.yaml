apiVersion: apps/v1
kind: Deployment
metadata:
  name: strike-flow-classifier-databento
  namespace: options-edge
spec:
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: strike-flow-classifier
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            limits:
              # Must stay >= the base request (raised to 3Gi in "Raise memory for realtime strike services");
              # the old 2560Mi override made request > limit and the API rejected the whole Deployment.
              # 8Gi matches the base limit intent.
              memory: 8Gi
      volumes:
        - name: kafka-streams-state
          persistentVolumeClaim:
            claimName: strike-flow-classifier-databento-streams-state
