---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: databento-volume-aggregator
  namespace: options-edge
spec:
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: databento-volume-aggregator
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            limits:
              memory: 3Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: null
          persistentVolumeClaim:
            claimName: databento-volume-aggregator-streams-state
