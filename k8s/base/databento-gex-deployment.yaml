apiVersion: apps/v1
kind: Deployment
metadata:
  name: databento-gex-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: databento-gex-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: databento-gex-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: databento-gex-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: databento-gex
          image: 192.168.100.252:5000/options-edge-databento-gex:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
            - secretRef:
                name: options-edge-databento-feed-env
                optional: true
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: DATABENTO_DATASET
              valueFrom:
                configMapKeyRef:
                  name: options-edge-databento-feed-config
                  key: DATABENTO_DATASET
                  optional: true
            - name: DATABENTO_GEX_OI_TRADING_CLASS
              valueFrom:
                configMapKeyRef:
                  name: options-edge-databento-feed-config
                  key: DATABENTO_TRADING_CLASS
                  optional: true
            # OI direct-fetch HTTP timeout. The default (20s) is too tight for the SPX parent-chain
            # statistics query, which intermittently times out and returns TRUNCATED OI -> missing
            # near-ATM strikes (e.g. 7510) show no GEX, and a restart can leave GEX ~all-zero. 60s lets
            # the query complete. Both envs. Bounded: at most once per chain/day on the stream thread.
            - name: DATABENTO_GEX_OI_HTTP_TIMEOUT_SECONDS
              value: "60"
            # OI fetch record limit. The default (10000) TRUNCATES the SPXW.OPT parent statistics
            # response (all stat types x all expiries, ordered by ts_recv), silently dropping OI for
            # ~62 strikes — including near-ATM ones with real OI (7500, 7550) — so those strikes show
            # NO GEX. Verified 2026-07-10: the full response is ~18,816 records / 286 OI strikes vs
            # only 224 at limit 10000. 200000 gives generous headroom (returns only the rows that
            # exist, ~19k). Both envs. This was the root cause of recurring "missing GEX on strikes".
            - name: DATABENTO_GEX_OI_FETCH_LIMIT
              value: "200000"
            # The DEFINITION query's own limit, deliberately NOT sharing DATABENTO_GEX_OI_FETCH_LIMIT.
            # Two queries with different response sizes and different growth do not belong on one
            # knob. The universe fetch was refused on every attempt while it inherited a 10,000
            # default against a ~20,200-record definition response, so no anchor manifest could
            # ever be built.
            - name: DATABENTO_GEX_OI_DEFINITION_FETCH_LIMIT
              value: "200000"
            # OI anchor manifest. Reconciles the settled open-interest statistics response against
            # an independent instrument-definition universe and publishes ONE immutable manifest per
            # session to options.databento.oi.anchor-manifest.
            #
            # OFF in base, ON in the dev overlay only. Its sole consumer, oi-shadow-service, is a
            # shadow experiment with no downstream readers, and this flag runs inside the process
            # that produces the live gamma surface -- so it is enabled where it can be watched
            # before anywhere it cannot.
            - name: OI_ANCHOR_MANIFEST_ENABLED
              value: "false"
            - name: HEALTH_PORT
              value: "8100"
            - name: KAFKA_DATABENTO_RAW_TOPIC
              value: options.databento.raw
            - name: KAFKA_DATABENTO_GEX_TOPIC
              value: options.databento.gex.strike
            - name: KAFKA_GEX_STREAMS_APP_ID
              # ONE canonical, UNVERSIONED app-id (One Service One Identity rule): topology changes get a
              # one-time state reset by deleting this app's internal topics at rollout — never an rN
              # suffix (the old "-carry-v2" namespace and its orphaned internal topics were removed
              # 2026-07-24; Streams state rebuilds from the compacted gex.strike topic within minutes).
              value: options-databento-gex-streams
            - name: KAFKA_GEX_STREAMS_NUM_THREADS
              value: "8"
            # Dealer-positioning sign: NAIVE (call +1 / put -1).
            # The 1-year SPXW 0DTE backtest (gex-backtest, run phase3-1w-...-b10, 252 days /
            # 7,541 samples) ranked the three models NAIVE ~= V2 >> V1(FLOW_ADJUSTED):
            #   NAIVE  : Spearman IC(-netGEX, fwd realized var) = 0.56, per-day IC +0.143
            #   V2     : IC 0.56 (tied) but no measurable lift over NAIVE (lift CI crosses 0,
            #            beats-naive in only 3/12 walk-forward months) — flow machinery earns nothing
            #   V1     : IC 0.35 AND per-day IC -0.21 (intraday signal points the WRONG way)
            # The IC=0.56 survives de-seasonalization (within-time-of-day-bucket IC 0.58, 100% of
            # buckets positive), so it is a real signal, not the intraday vol cycle. NAIVE is the
            # best AND simplest, so the flow-adjusted path is retired in production.
            - name: DATABENTO_GEX_DEALER_SIGN_MODEL
              value: NAIVE_CALL_PLUS_PUT_MINUS
            # Daily OI self-fetch: on the first snapshot per (symbol,expiry,day) the gex-service pulls
            # the once-daily settled Open Interest from Databento historical statistics into Postgres,
            # retrying with backoff until it lands (see DatabentoOiBaselineProvider). Set explicitly TRUE
            # so a stray live env-drift can never silently disable it — without OI, GEX is all-zero.
            - name: DATABENTO_GEX_OI_DIRECT_FETCH_ENABLED
              value: "true"
            # Quote-age gate for the IV solve. Default 120s was rejecting ~54% of legs as STALE_QUOTE —
            # incl. good, tight, present NEAR-MONEY quotes whose resting NBBO simply hadn't CHANGED in 2min —
            # so IV/gamma never solved -> dealer-ledger inputQuality DEGRADED -> never armed -> 0 SignalFired
            # (dev AND prod, 2026-07-10). Widened to 10min so greeks actually solve and the dealer-ledger can
            # fire; to be reduced gradually once the feature is confirmed working (never below the observed
            # near-money quote-refresh cadence). Both envs (base) intentionally — prod is meant to fire too.
            - name: DATABENTO_GEX_MAX_QUOTE_AGE_MS
              value: "600000"
            # Live, expiry-specific r/q supplied by market-carry-service. A carry record that is
            # absent, stale, future-dated, or not quality=GOOD is rejected — and then priced via the
            # STATIC_FALLBACK regime below instead of suppressing the strike.
            - name: DATABENTO_GEX_DYNAMIC_CARRY_ENABLED
              value: "true"
            - name: DATABENTO_GEX_MARKET_CARRY_TOPIC
              value: market.spx.market-carry-service.current
            # market-carry publishes on a 5-minute cadence (MARKET_CARRY_MIN_PUBLISH_INTERVAL_MS):
            # carry (r, q) is slow-moving, so a 5-minute cadence is operationally sufficient. The age gate must
            # tolerate one MISSED scheduled publication — i.e. two cadence periods since the last good
            # snapshot — plus 60s scheduling slack: 2 x 300s + 60s = 660s.
            - name: DATABENTO_GEX_DYNAMIC_CARRY_MAX_AGE_MS
              value: "660000"
            # USER requirement 2026-07-23: gex must NOT fail because carry now arrives every 5 minutes.
            # If a snapshot is late/stale beyond the 660s gate, price with the STATIC configured carry
            # (regime STATIC_FALLBACK, PR #464) instead of suppressing the strike. Provenance is stamped
            # on every record and carry_unavailable_reason_total still counts the cause, so this is
            # fail-loud degradation, not a silent mask.
            - name: DATABENTO_GEX_CARRY_STATIC_FALLBACK_ENABLED
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms1g -Xmx4g"
            # ---- Pre-open GEX (PREOPEN-GEX-GATE1-REQUIREMENT.md) ----
            # DORMANT by default in BASE (prod stays off until dev proves it over a full
            # capture@18:00 -> compute@08:00 cycle). Enabled on dev via the overlay patch. Both flags fail-soft:
            # the in-service scheduler never crashes the live GEX pipeline, and Task B abstains (never publishes)
            # when the capture snapshot or the prior-close canonical spot is missing.
            - name: PREOPEN_GEX_ENABLED            # master switch: run the in-service capture+compute scheduler
              value: "false"
            - name: PREOPEN_GEX_PUBLISH_ENABLED    # Task B: transactional publish to the live gex.strike topic
              value: "false"
            - name: PREOPEN_GEX_SYMBOL
              value: SPX
          ports:
            - name: health
              containerPort: 8100
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 5Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
