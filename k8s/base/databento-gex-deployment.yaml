apiVersion: apps/v1
kind: Deployment
metadata:
  name: databento-gex-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: databento-gex-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: databento-gex-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: databento-gex-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: databento-gex
          image: 192.168.100.252:5000/options-edge-databento-gex:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: HEALTH_PORT
              value: "8100"
            - name: KAFKA_DATABENTO_RAW_TOPIC
              value: options.databento.raw
            - name: KAFKA_DATABENTO_GEX_TOPIC
              value: options.databento.gex.strike
            - name: KAFKA_GEX_STREAMS_APP_ID
              value: options-databento-gex-streams-v1
            - name: KAFKA_GEX_STREAMS_NUM_THREADS
              value: "4"
            # Dealer-positioning sign: flow-adjusted (blended with the naive prior). The feed now
            # publishes askVolume/bidVolume + lastTradeAt, so the flow path and the zero-bid mark
            # staleness age-gate are active rather than dormant.
            - name: DATABENTO_GEX_DEALER_SIGN_MODEL
              value: FLOW_ADJUSTED
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms1g -Xmx4g"
          ports:
            - name: health
              containerPort: 8100
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 5Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
