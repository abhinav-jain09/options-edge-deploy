apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-gateway-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: feed-gateway-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: feed-gateway-service
  template:
    metadata:
      annotations:
        # Bump to force a pod roll so envFrom picks up changed shared ConfigMap values
        # (k8s does NOT restart pods when a ConfigMap changes). Set for the 17:30 expiry roll.
        oe/config-nonce: "2026-07-31-heatmap-saturation"
      labels:
        app.kubernetes.io/name: feed-gateway-service
        app.kubernetes.io/part-of: options-edge
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: feed-gateway
          image: 192.168.100.252:5000/options-edge-feed-gateway:dev
          imagePullPolicy: Always
          env:
            - name: APP_WEB_PORT
              value: "18091"
            # ES-GEX-on-SPX (es-spx-align service): consume the align service's options.es-gex-spx-aligned book + emit the es-gex event.
            - name: GATEWAY_ES_GEX_ENABLED
              value: "true"
            # ES strike-intel on SPX (es-spx-align service): consume options.es-strike-intel-spx-aligned and emit
            # the es-strike-intel overlay event (a separate ES-origin layer on the SPX board).
            - name: GATEWAY_ES_STRIKE_INTEL_ENABLED
              value: "true"
            - name: KAFKA_ES_STRIKE_INTEL_SPX_ALIGNED_TOPIC
              value: options.es-strike-intel-spx-aligned
            # ES futures aggressor-flow card (es-aggressor-flow-service on es4, mirrored here as
            # es.futures.aggressor-flow by Jenkinsfile.es-futures-flow-mirror). Opt-in flag; the
            # topic is the mirrored es.-prefixed name on dev+prod (es4 itself uses futures.aggressor-flow).
            - name: GATEWAY_ES_AGGRESSOR_FLOW_ENABLED
              value: "true"
            - name: KAFKA_ES_AGGRESSOR_FLOW_TOPIC
              value: es.futures.aggressor-flow
            # ES CVD stream (ES-CVD-DESIGN.md Gates 2-3; es-cvd-service on es4, mirrored here as
            # es.futures.cvd / es.futures.cvd.bars by Jenkinsfile.es-cvd-mirror). Opt-in flag; the
            # topics are the mirrored es.-prefixed names on dev+prod (es4 itself resolves the
            # unprefixed defaults through TOPIC_PREFIX).
            - name: GATEWAY_ES_CVD_ENABLED
              value: "true"
            - name: KAFKA_ES_CVD_TOPIC
              value: es.futures.cvd
            - name: KAFKA_ES_CVD_BARS_TOPIC
              value: es.futures.cvd.bars
            # ES FOOTPRINT relay (ES-FOOTPRINT-GATEWAY-DESIGN.md; es-cvd-service on es4, mirrored
            # here as es.futures.footprint* by Jenkinsfile.es-cvd-mirror). Same opt-in shape as the
            # CVD block above: the flag is on and the topics are the mirrored es.-prefixed names.
            # An absent topic is not fatal — the gateway consumes without it and the page reports
            # no data — so an env with no mirror installed simply shows nothing.
            - name: GATEWAY_ES_FOOTPRINT_ENABLED
              value: "true"
            - name: KAFKA_ES_FOOTPRINT_TOPIC
              value: es.futures.footprint
            - name: KAFKA_ES_FOOTPRINT_EVIDENCE_TOPIC
              value: es.futures.footprint.evidence
            - name: KAFKA_ES_FOOTPRINT_BARS_TOPIC
              value: es.futures.footprint.bars
            - name: KAFKA_ES_FOOTPRINT_OUTCOMES_TOPIC
              value: es.futures.footprint.outcomes
            # ES-FOOTPRINT-STRIKE-INTERACTION.md R3: the fifth footprint stream (es-footprint-strike on es4,
            # mirrored here by Jenkinsfile.es-cvd-mirror), relayed as cvd-hello `footprintStrike` +
            # es-footprint-strike + /api/footprint/strike/{latest,history}. Same flag as the four above.
            - name: KAFKA_ES_FOOTPRINT_STRIKE_TOPIC
              value: es.futures.footprint.strike
            # SPX Auction Desk (es-amt-service on es4, mirrored here as es.futures.auction by
            # Jenkinsfile.es-auction-mirror): one payload per RTH minute keyed <tradeDate>|<HH:mm>,
            # retained seven CALENDAR days (what the gateway's current + previous trade date view needs
            # after a restart, not a session count). Opt-in flag; the topic is the mirrored es.-prefixed name on
            # dev+prod (es4 itself resolves the unprefixed futures.auction through TOPIC_PREFIX).
            - name: GATEWAY_ES_AUCTION_ENABLED
              value: "true"
            - name: KAFKA_ES_AUCTION_TOPIC
              value: es.futures.auction
            - name: KAFKA_VIX_OPTION_INTELIGENCE_TOPIC
              value: options.spx.vix-option-inteligence-service.current
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx1536m"
            - name: GATEWAY_KAFKA_MAX_POLL_RECORDS
              value: "100"
            - name: GATEWAY_KAFKA_FETCH_MAX_BYTES
              value: "4194304"
            - name: GATEWAY_KAFKA_MAX_PARTITION_FETCH_BYTES
              value: "524288"
            - name: GATEWAY_KAFKA_RECEIVE_BUFFER_BYTES
              value: "524288"
            - name: MARKETDATA_GATEWAY_MAX_STALE_MS
              value: "300000"
            # --- WS auth: close the open market-data WS for the web app (oc.bearer / legacy single-tenant
            # mode). The web app authenticates the /ws/events handshake with the oc.bearer subprotocol +
            # access token; the gateway validates the JWT against the prod Keycloak issuer. This wires ONLY
            # the JWT interceptor (NOT GATEWAY_AUTH_ENABLED / the multi-tenant ticket mode, which requires a
            # replay orchestrator + approval gate that prod does not run — see MtSessionSecurityInvariant).
            # WS_ALLOWED_ORIGINS MUST be an explicit allow-list (not '*') once auth is on or the gateway
            # fails closed. The oc.bearer default Selection (IB_SYMBOL/IB_EXPIRY/APP_MARKET_DATA_SOURCE)
            # comes from options-edge-config (IB_EXPIRY=AUTO resolves and rolls the ET trading date). ---
            - name: WS_AUTH_ENABLED
              value: "true"
            - name: WS_AUTH_ISSUER_URI
              value: "https://auth.bleadingoptions.com/realms/optionsedge"
            - name: WS_AUTH_AUDIENCE
              value: "options-edge-web"
            - name: WS_ALLOWED_ORIGINS
              value: "https://bleadingoptions.com"
            # --- vol-premium session log (feed-gateway VolPremiumSessionStore / VolPremiumSessionLog, PR #185).
            # The gateway keeps each vol-premium series' session as an append-only log on local disk (a cache:
            # rebuilt from Kafka on every start, never read across a restart). Unset, it falls back to
            # java.io.tmpdir = /tmp in the container's writable layer, where nothing sizes or bounds it.
            # Naming a directory also makes it DEDICATED: at start the gateway deletes the vol-premium-log-*
            # directories an earlier process left there (an emptyDir outlives a container restart).
            # The volume, its sizeLimit and the ephemeral-storage request below are sized from the store's
            # DISK_REQUIRED_BYTES; change them together.
            - name: GATEWAY_VOL_PREMIUM_LOG_DIR
              value: /var/lib/vol-premium-log
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          ports:
            - name: http
              containerPort: 18091
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: vol-premium-log
              mountPath: /var/lib/vol-premium-log
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              # The vol-premium log's disk (the emptyDir below), declared so the scheduler counts its capacity
              # against the node's allocatable storage. That is accounting, not a reservation: other workloads'
              # undeclared disk use can still leave less free, so check the node filesystem's actual headroom
              # before rollout (runbook step 2). No ephemeral-storage LIMIT, matching every options-edge
              # workload: a pod-level limit would also count /tmp (SellerActivityDiskStore) and the
              # container log, and evict the gateway for growth this change does not bound. The emptyDir's
              # own sizeLimit bounds the log.
              ephemeral-storage: 4Gi
            limits:
              memory: 4Gi
      volumes:
        # The vol-premium session log (GATEWAY_VOL_PREMIUM_LOG_DIR above). Disk-backed emptyDir: node-local,
        # per pod, wiped when the pod goes (the log is a cache), and NOT medium: Memory — tmpfs pages would be
        # charged to the memory limit unreclaimably. On disk its page cache is charged too, but reclaimable.
        #
        # Size: the store's DISK_REQUIRED_BYTES = (MAX_SYMBOLS + 1) x SERIES_DISK_BUDGET_BYTES
        #       + MAX_SYMBOLS x IvRvReading.MAX_RECORD_BYTES
        #       = 3 x 1,342,177,280 (1,280 MiB) + 2 x 65,536 (64 KiB) = 4,026,662,912 bytes (3,840.1 MiB):
        # each of two series' files up to its budget + one record, plus one rewrite in progress (at most the
        # live bytes). The store refuses a record past a series' budget (counted and logged, nothing evicted)
        # and rewrites a file before an append would take it past that budget.
        # 4Gi = 4,294,967,296 bytes leaves 268,304,384 (255.9 MiB, 6.25%) for filesystem block rounding and
        # directory entries. Past the sizeLimit the kubelet EVICTS the pod, so it must never be below the
        # store's figure.
        - name: vol-premium-log
          emptyDir:
            sizeLimit: 4Gi
