apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-gateway-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: feed-gateway-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: feed-gateway-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feed-gateway-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: feed-gateway
          image: ghcr.io/abhinav-jain09/options-edge-feed-gateway:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: options-edge-config
          ports:
            - name: http
              containerPort: 8091
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
