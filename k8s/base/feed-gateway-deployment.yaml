apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-gateway-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: feed-gateway-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: feed-gateway-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feed-gateway-service
        app.kubernetes.io/part-of: options-edge
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: feed-gateway
          image: 192.168.100.252:5000/options-edge-feed-gateway:dev
          imagePullPolicy: Always
          env:
            - name: APP_WEB_PORT
              value: "18091"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx1536m"
            - name: GATEWAY_KAFKA_MAX_POLL_RECORDS
              value: "100"
            - name: GATEWAY_KAFKA_FETCH_MAX_BYTES
              value: "4194304"
            - name: GATEWAY_KAFKA_MAX_PARTITION_FETCH_BYTES
              value: "524288"
            - name: GATEWAY_KAFKA_RECEIVE_BUFFER_BYTES
              value: "524288"
            - name: MARKETDATA_GATEWAY_MAX_STALE_MS
              value: "300000"
            # --- WS auth: close the open market-data WS for the web app (oc.bearer / legacy single-tenant
            # mode). The web app authenticates the /ws/events handshake with the oc.bearer subprotocol +
            # access token; the gateway validates the JWT against the prod Keycloak issuer. This wires ONLY
            # the JWT interceptor (NOT GATEWAY_AUTH_ENABLED / the multi-tenant ticket mode, which requires a
            # replay orchestrator + approval gate that prod does not run — see MtSessionSecurityInvariant).
            # WS_ALLOWED_ORIGINS MUST be an explicit allow-list (not '*') once auth is on or the gateway
            # fails closed. The oc.bearer default Selection (IB_SYMBOL/IB_EXPIRY/APP_MARKET_DATA_SOURCE)
            # comes from options-edge-config (IB_EXPIRY is filled to a weekday date by the deploy pipeline). ---
            - name: WS_AUTH_ENABLED
              value: "true"
            - name: WS_AUTH_ISSUER_URI
              value: "https://auth.fullfunding.nl/realms/optionsedge"
            - name: WS_AUTH_AUDIENCE
              value: "options-edge-web"
            - name: WS_ALLOWED_ORIGINS
              value: "https://fullfunding.nl"
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          ports:
            - name: http
              containerPort: 18091
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
