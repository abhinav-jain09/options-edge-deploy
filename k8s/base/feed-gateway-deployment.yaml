apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-gateway-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: feed-gateway-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: feed-gateway-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feed-gateway-service
        app.kubernetes.io/part-of: options-edge
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: feed-gateway
          image: 192.168.100.252:5000/options-edge-feed-gateway:dev
          imagePullPolicy: Always
          env:
            - name: APP_WEB_PORT
              value: "18091"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx1536m"
            - name: GATEWAY_KAFKA_MAX_POLL_RECORDS
              value: "100"
            - name: GATEWAY_KAFKA_FETCH_MAX_BYTES
              value: "4194304"
            - name: GATEWAY_KAFKA_MAX_PARTITION_FETCH_BYTES
              value: "524288"
            - name: GATEWAY_KAFKA_RECEIVE_BUFFER_BYTES
              value: "524288"
          envFrom:
            - configMapRef:
                name: options-edge-config
          ports:
            - name: http
              containerPort: 18091
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
