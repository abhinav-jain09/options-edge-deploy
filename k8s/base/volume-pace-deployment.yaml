apiVersion: apps/v1
kind: Deployment
metadata:
  name: volume-pace-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: volume-pace-service
    app.kubernetes.io/part-of: options-edge
spec:
  # DISABLED until further notice (all envs): this is the IBKR volume-pace variant; the IBKR pipeline is
  # idle (ibkr-feed is VIX-only). The active Databento variant is volume-pace-databento-service (separate
  # file, stays up). Held at 0.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: volume-pace-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: volume-pace-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: volume-pace
          image: 192.168.100.252:5000/options-edge-volume-pace:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: IBKR
            - name: KAFKA_RAW_TOPIC
              value: options.ibkr.raw
            - name: KAFKA_RAW_IBKR_TOPIC
              value: options.ibkr.raw
            - name: KAFKA_PACE_TOPIC
              value: options.ibkr.pace
            - name: KAFKA_PACE_STREAMS_APP_ID
              value: options-flow-pace-streams-v3
            - name: KAFKA_PACE_STREAMS_COMMIT_INTERVAL_MS
              value: "1000"
            - name: KAFKA_PACE_STREAMS_NUM_THREADS
              value: "2"
            - name: KAFKA_PACE_STREAMS_CACHE_MAX_BYTES_BUFFERING
              value: "1048576"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms10g -Xmx20g"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 250m
              memory: 10Gi
            limits:
              memory: 24Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
