apiVersion: apps/v1
kind: Deployment
metadata:
  name: options-edge-databento-feed-spy
  namespace: options-edge
  labels:
    app.kubernetes.io/name: options-edge-databento-feed-spy
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: options-edge-databento-feed-spy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: options-edge-databento-feed-spy
        app.kubernetes.io/part-of: options-edge
    spec:
      hostNetwork: true
      dnsPolicy: Default
      containers:
        - name: databento-feed-spy
          image: 192.168.100.252:5000/options-edge-databento-feed:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-databento-feed-spy-config
            # Reuse the SAME Databento API key as the SPX feed (one user, 2nd OPRA session under limit).
            - secretRef:
                name: options-edge-databento-feed-env
          ports:
            - name: metrics
              containerPort: 8011
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
