apiVersion: apps/v1
kind: Deployment
metadata:
  name: strike-flow-classifier-databento
  namespace: options-edge
  labels:
    app.kubernetes.io/name: strike-flow-classifier-databento
    app.kubernetes.io/component: strike-flow-classifier
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: strike-flow-classifier-databento
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strike-flow-classifier-databento
        app.kubernetes.io/component: strike-flow-classifier
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: strike-flow-classifier
          image: 192.168.100.252:5000/options-edge-strike-flow-classifier:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: STRIKE_FLOW_SOURCE
              value: DATABENTO
            - name: STRIKE_FLOW_ENABLED
              value: "true"
            - name: KAFKA_STRIKE_FLOW_INPUT_TOPIC
              value: options.databento.raw
            - name: KAFKA_STRIKE_FLOW_OUTPUT_TOPIC
              value: options.databento.strike-flow
            - name: KAFKA_STRIKE_FLOW_STREAMS_APP_ID
              value: options-edge-databento-strike-flow-classifier-v1
            - name: STRIKE_FLOW_SYMBOL
              value: SPX
            - name: STRIKE_FLOW_OUTPUT_INTERVAL_MS
              value: "500"
            - name: STRIKE_FLOW_BIAS_RATIO
              value: "1.20"
            - name: STRIKE_FLOW_CONTRACT_MULTIPLIER
              value: "100.0"
            - name: HEALTH_PORT
              value: "8097"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx1536m"
          ports:
            - name: http
              containerPort: 8097
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
---
