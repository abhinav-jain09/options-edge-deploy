apiVersion: apps/v1
kind: Deployment
metadata:
  name: strike-flow-classifier-databento
  namespace: options-edge
  labels:
    oe.replay/include: "true"
    oe.replay/side-effects: "false"
    oe.replay/topic-remap: "required"
    oe.replay/state: "ephemeral"
    oe.replay/determinism: "event-time"
    app.kubernetes.io/name: strike-flow-classifier-databento
    app.kubernetes.io/component: strike-flow-classifier
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: strike-flow-classifier-databento
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strike-flow-classifier-databento
        app.kubernetes.io/component: strike-flow-classifier
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: strike-flow-classifier
          image: 192.168.100.252:5000/options-edge-strike-flow-classifier:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: STRIKE_FLOW_SOURCE
              value: DATABENTO
            - name: STRIKE_FLOW_ENABLED
              value: "true"
            # Institutional canary (databento only). Each flag is independent; kill-switch = "false".
            # DELTA_OVERLAY: enables the GEX-backed per-leg delta-weighting that populates
            # deltaWeightedBuyNotional/deltaWeightedSellNotional. The delta is now looked up from Redis
            # (populated by the standalone gex-delta-redis-writer), NOT an in-process Kafka Streams global
            # store — so a GEX/Redis failure can no longer take the classifier to ERROR (the 2026-06-29
            # incident). The lookup is fail-open: if Redis is unreachable the classifier logs a throttled
            # WARN and runs WITHOUT delta weighting. Kill-switch = "false".
            - name: STRIKE_FLOW_DELTA_OVERLAY_ENABLED
              # OFF while options-edge-redis is scaled to 0 (leaked 2026-07-01): with the overlay on and
              # Redis down, EVERY classified trade burns a fail-open connect timeout, capping classifier
              # throughput far below OPRA rate. Re-enable together with restoring redis + the writer.
              value: "false"
            # ONE-TIME state recovery for THIS migration. The previous image registered a gex-delta-by-strike
            # GLOBAL store; this image removes it (delta now comes from Redis). The persistent RocksDB state
            # dir still holds that orphaned global-store state, so GlobalStateManagerImpl.initialize() would
            # throw "Encountered a topic-partition not associated with any global state store" and crash the
            # main thread on first start. "true" makes the classifier streams.cleanUp() before start() —
            # wipes the local state dir and rebuilds fresh from the changelog. Safe to leave on for the
            # strike-flow classifier (STATE_TTL 24h, so a cold rebuild costs at most one session); set to
            # "false" after the first successful post-migration deploy to avoid a cold rebuild per pod cycle.
            - name: KAFKA_STREAMS_CLEANUP_ON_START
              value: "true"
            # Redis the delta lookup reads from. Host + key prefix MUST match the gex-delta-redis-writer's
            # GEX_DELTA_REDIS_HOST / GEX_DELTA_REDIS_KEY_PREFIX. Short timeout so a Redis stall fails open
            # instead of blocking classification.
            - name: STRIKE_FLOW_DELTA_REDIS_HOST
              value: options-edge-redis
            - name: STRIKE_FLOW_DELTA_REDIS_PORT
              value: "6379"
            - name: STRIKE_FLOW_DELTA_REDIS_TIMEOUT_MS
              value: "50"
            - name: STRIKE_FLOW_DELTA_REDIS_KEY_PREFIX
              value: "gexdelta:"
            - name: STRIKE_FLOW_INSTITUTIONAL_ENABLED
              value: "true"
            - name: STRIKE_FLOW_INSTITUTIONAL_TICK_EPSILON
              value: "0.0"
            - name: STRIKE_FLOW_INSTITUTIONAL_FRESHNESS_MS
              value: "3000"
            - name: STRIKE_FLOW_WINDOWS_ENABLED
              value: "true"
            - name: STRIKE_FLOW_SWEEP_ENABLED
              value: "true"
            - name: STRIKE_FLOW_QUALITY_ENABLED
              value: "true"
            - name: KAFKA_STRIKE_FLOW_INPUT_TOPIC
              value: options.opra.tcbbo
            - name: KAFKA_STRIKE_FLOW_OUTPUT_TOPIC
              value: options.databento.strike-flow
            - name: KAFKA_SELLER_ACTIVITY_TOPIC
              value: options.databento.seller-activity
            # Literal app-id pin REQUIRED (One Service One Identity Rule + kafka-cleanup contract): the
            # orphan-generation purge builds its ACTIVE set from every live workload's literal *_APP_ID
            # env and FAILS CLOSED on non-literal/absent ids — a service without this pin would have its
            # changelog/repartition topics classified as orphans by an armed purge. The value must equal
            # the code default and must NEVER carry a version suffix.
            - name: KAFKA_STRIKE_FLOW_STREAMS_APP_ID
              value: options-edge-databento-strike-flow-classifier
            - name: KAFKA_STRIKE_FLOW_STREAMS_AUTO_OFFSET_RESET
              value: earliest
            - name: KAFKA_STRIKE_FLOW_STREAMS_NUM_THREADS
              value: "8"
            - name: STRIKE_FLOW_SYMBOL
              value: SPX
            - name: STRIKE_FLOW_OUTPUT_INTERVAL_MS
              value: "500"
            # Market-stage backpressure mitigation (2026-07-27 prod incident): the by-market stage is a
            # single hot partition (one thread) and fell ~2h behind on a heavy 0DTE Monday with .252
            # CPU-oversubscribed. Each strike's cumulative state is forwarded at most once per this
            # interval (code default 1000); 3000 cuts by-market inflow ~3x. Cumulative totals are
            # unaffected; the visible cost is per-strike market-view cadence (incl. seller-activity
            # per-strike emits) at a NOMINAL ~3s instead of ~1s — a target, not a hard bound: the trailing
            # flush is a wall-clock punctuator, so under CPU starvation (this incident's very condition)
            # flushes can lag further. OUTPUT_INTERVAL_MS stays 500 on purpose.
            - name: STRIKE_FLOW_STRIKE_FORWARD_INTERVAL_MS
              value: "3000"
            - name: STRIKE_FLOW_BIAS_RATIO
              value: "1.20"
            - name: STRIKE_FLOW_CONTRACT_MULTIPLIER
              value: "100.0"
            - name: HEALTH_PORT
              value: "8097"
            # Heap right-size (2026-08-01): with -Xmx4g the pod sat at ~4.2 GiB RSS — G1 expands to Xmx
            # under the classifier's JSON parse/serialize churn and never gives it back, while LIVE state
            # is only tens of MB (chain of a few hundred strikes x ~17KB states). 3g caps RSS ~1 GiB lower;
            # CPU headroom for the extra GC is benchmark-proven (steady-state pure-CPU ~5% of one core,
            # MarketStageEmitBenchmarkTest 2026-07-27). Xms1g so startup doesn't pin 2 GiB it may not need.
            # Watch-item: on a heavy 0DTE open a tight heap could GC-thrash into by-market lag (the
            # 2026-07-27 failure mode) — if the 09:35 ET open check shows sustained lag, raise Xmx back.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms1g -Xmx3g"
          ports:
            - name: http
              containerPort: 8097
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "1"
              # Scheduler honesty: typical in-session RSS is ~3.2-3.5 GiB under the 3g heap (was observed
              # at 4.2 GiB under the old 4g heap against a 3Gi request). Limit stays 8Gi for the
              # restart-restore burst (CLEANUP_ON_START=true rebuilds multi-GiB changelogs).
              memory: 3.5Gi
            limits:
              memory: 8Gi
