apiVersion: apps/v1
kind: Deployment
metadata:
  name: strike-flow-classifier-databento
  namespace: options-edge
  labels:
    oe.replay/include: "true"
    oe.replay/side-effects: "false"
    oe.replay/topic-remap: "required"
    oe.replay/state: "ephemeral"
    oe.replay/determinism: "event-time"
    app.kubernetes.io/name: strike-flow-classifier-databento
    app.kubernetes.io/component: strike-flow-classifier
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: strike-flow-classifier-databento
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strike-flow-classifier-databento
        app.kubernetes.io/component: strike-flow-classifier
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: strike-flow-classifier
          image: 192.168.100.252:5000/options-edge-strike-flow-classifier:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: STRIKE_FLOW_SOURCE
              value: DATABENTO
            - name: STRIKE_FLOW_ENABLED
              value: "true"
            # Institutional canary (databento only). Each flag is independent; kill-switch = "false".
            # DELTA_OVERLAY: enables the GEX-backed per-leg delta-weighting (GexDeltaGlobalProcessor
            # consumes options.databento.gex.strike -> global store; GexBackedDeltaProvider looks up
            # per-leg delta and populates deltaWeightedBuyNotional/deltaWeightedSellNotional). Previously
            # OFF (so those fields emitted 0); turned ON now the databento-feed/GEX topic carries real
            # per-leg delta. Kill-switch = "false". Reads delta from KAFKA_DATABENTO_GEX_STRIKE_TOPIC
            # (default options.databento.gex.strike).
            - name: STRIKE_FLOW_DELTA_OVERLAY_ENABLED
              value: "false"
            # ONE-TIME state recovery. When DELTA_OVERLAY toggles between true/false, the topology's
            # global-store set changes — but the persistent RocksDB state directory remembers the OLD
            # set. On startup, GlobalStateManagerImpl.initialize() reads orphaned global-store state
            # and throws "Encountered a topic-partition not associated with any global state store",
            # crashing the main thread (verified on dev 2026-06-30: pod 0/1 not Ready, output topic
            # empty). Setting this to "true" makes the classifier call streams.cleanUp() before
            # streams.start() — wipes the local state dir, lets the topology bootstrap fresh from the
            # changelog. Safe to leave on permanently for the strike-flow classifier specifically
            # (its STATE_TTL = 86_400_000 / 24h, so a cold rebuild costs at most one session); but
            # carries a one-time bootstrap-from-input penalty per restart. REMOVE OR SET TO "false"
            # after the first successful deploy if you don't want the cold-rebuild on every pod cycle.
            - name: KAFKA_STREAMS_CLEANUP_ON_START
              value: "true"
            - name: STRIKE_FLOW_INSTITUTIONAL_ENABLED
              value: "true"
            - name: STRIKE_FLOW_INSTITUTIONAL_TICK_EPSILON
              value: "0.0"
            - name: STRIKE_FLOW_INSTITUTIONAL_FRESHNESS_MS
              value: "1000"
            - name: STRIKE_FLOW_WINDOWS_ENABLED
              value: "true"
            - name: STRIKE_FLOW_SWEEP_ENABLED
              value: "true"
            - name: STRIKE_FLOW_QUALITY_ENABLED
              value: "true"
            - name: KAFKA_STRIKE_FLOW_INPUT_TOPIC
              value: options.opra.tcbbo
            - name: KAFKA_STRIKE_FLOW_OUTPUT_TOPIC
              value: options.databento.strike-flow
            - name: KAFKA_STRIKE_FLOW_STREAMS_APP_ID
              value: options-edge-databento-strike-flow-classifier-v2
            - name: STRIKE_FLOW_SYMBOL
              value: SPX
            - name: STRIKE_FLOW_OUTPUT_INTERVAL_MS
              value: "500"
            - name: STRIKE_FLOW_BIAS_RATIO
              value: "1.20"
            - name: STRIKE_FLOW_CONTRACT_MULTIPLIER
              value: "100.0"
            - name: HEALTH_PORT
              value: "8097"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx1536m"
          ports:
            - name: http
              containerPort: 8097
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
---
