apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread-skew-postgres-writer
  namespace: options-edge
  labels:
    app.kubernetes.io/name: spread-skew-postgres-writer
    app.kubernetes.io/component: spread-skew-postgres-writer
    app.kubernetes.io/part-of: options-edge
spec:
  # OPERATOR HOLD 2026-07-26: the writer is part of the disabled spread-skew
  # stack and must remain down in every environment until explicitly re-approved.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: spread-skew-postgres-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spread-skew-postgres-writer
        app.kubernetes.io/component: spread-skew-postgres-writer
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: spread-skew-postgres-writer
          image: 192.168.100.252:5000/options-edge-spread-skew-postgres-writer:dev
          imagePullPolicy: Always
          # Shared platform config/secret provide POSTGRES_JDBC_URL/USER/PASSWORD +
          # KAFKA_BOOTSTRAP_SERVERS (the writer's Settings fall back to these).
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: HEALTH_PORT
              value: "8123"
            - name: SKEW_WRITER_CURRENT_TOPIC
              value: options.spx.spread-skew.current
            - name: SKEW_WRITER_EVENTS_TOPIC
              value: options.spx.spread-skew.events
            - name: SKEW_WRITER_ENABLED
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx512m"
          ports:
            - name: health
              containerPort: 8123
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            # /health/ready is 200 only when the consumer reaches RUNNING (503 while reconnecting)
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
