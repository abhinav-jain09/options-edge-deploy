apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-open-direction-postgres-writer
  namespace: options-edge
  labels:
    app.kubernetes.io/name: es-open-direction-postgres-writer
    app.kubernetes.io/component: es-open-direction-postgres-writer
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: es-open-direction-postgres-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: es-open-direction-postgres-writer
        app.kubernetes.io/component: es-open-direction-postgres-writer
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: es-open-direction-postgres-writer
          image: 192.168.100.252:5000/options-edge-es-open-direction-postgres-writer:dev
          imagePullPolicy: Always
          # Shared platform config/secret provide KAFKA_BOOTSTRAP_SERVERS + the platform
          # defaults (same pattern as hpsf-postgres-writer / invasion-postgres-writer).
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: HEALTH_PORT
              value: "8080"
            # --- input topics (produced by es-open-direction-service) ---
            - name: KAFKA_ES_OPEN_DIRECTION_FORECAST_TOPIC
              value: es.open-direction.forecast
            - name: KAFKA_ES_OPEN_DIRECTION_OUTCOME_TOPIC
              value: es.open-direction.outcome
            # --- Postgres: same source as hpsf-postgres-writer (options-edge-config carries
            # POSTGRES_JDBC_URL/USER; options-edge-runtime-secrets carries the password) ---
            - name: ES_OPEN_DIRECTION_WRITER_PG_URL
              valueFrom:
                configMapKeyRef:
                  name: options-edge-config
                  key: POSTGRES_JDBC_URL
            - name: ES_OPEN_DIRECTION_WRITER_PG_USER
              valueFrom:
                configMapKeyRef:
                  name: options-edge-config
                  key: POSTGRES_USER
            - name: ES_OPEN_DIRECTION_WRITER_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: options-edge-runtime-secrets
                  key: POSTGRES_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx512m"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
