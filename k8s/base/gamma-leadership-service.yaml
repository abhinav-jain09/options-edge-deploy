apiVersion: v1
kind: Service
metadata:
  name: gamma-leadership-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: gamma-leadership-service
    app.kubernetes.io/component: gamma-leadership-service
    app.kubernetes.io/part-of: options-edge
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8141"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gamma-leadership-service
  ports:
    - name: health
      port: 8141
      targetPort: health
