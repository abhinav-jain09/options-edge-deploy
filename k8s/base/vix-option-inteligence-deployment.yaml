apiVersion: apps/v1
kind: Deployment
metadata:
  name: vix-option-inteligence-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: vix-option-inteligence-service
    app.kubernetes.io/component: vix-option-inteligence-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vix-option-inteligence-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vix-option-inteligence-service
        app.kubernetes.io/component: vix-option-inteligence-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: vix-option-inteligence
          image: 192.168.100.252:5000/options-edge-vix-option-inteligence:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: HEALTH_PORT
              value: "8080"
            - name: ZERO_DTE_INTELLIGENCE_ENABLED
              value: "true"
            # Gate-3 research evidence store (0DTE-RESEARCH-WRITER-REQUIREMENT rev 18 §5).
            # OFF in base; each environment that wants it must turn it on AND name its own
            # database in the same patch. There is deliberately no URL here, but note what that
            # does and does not buy: the writer's fallback is POSTGRES_JDBC_URL, whose BASE value
            # in options-edge-config IS production. Absent a URL of its own an overlay would
            # inherit production's database, so "no url in base" is not by itself a safeguard —
            # the safeguard is that this stays "false" and the overlay that flips it also states
            # its destination. Credentials come from the POSTGRES_USER/POSTGRES_PASSWORD the
            # container already receives, so no password is duplicated into a ConfigMap.
            # The writer creates its own schema on first start; version-gated, so an ordinary
            # restart applies nothing and takes no table locks.
            - name: ZERODTE_RESEARCH_ENABLED
              value: "false"
            - name: ZERO_DTE_SYMBOL
              value: SPX
            - name: ZERO_DTE_OPTION_EVENTS_TOPIC
              value: options.databento.events.raw
            - name: ZERO_DTE_VIX_TOPIC
              value: underlying.vix.price
            - name: VIX_OPTION_INTELIGENCE_TOPIC
              value: options.spx.vix-option-inteligence-service.current
            # Broad-view anti-blink policy: 20s entry, 30s reversal confirmation and 2m hold.
            - name: ZERO_DTE_DIRECTION_PERSISTENCE_MS
              value: "20000"
            - name: ZERO_DTE_REVERSAL_PERSISTENCE_MS
              value: "30000"
            - name: ZERO_DTE_MIN_DIRECTION_HOLD_MS
              value: "120000"
            - name: ZERO_DTE_UNUSUAL_PERSISTENCE_MS
              value: "10000"
            - name: ZERO_DTE_UNUSUAL_HOLD_MS
              value: "60000"
            - name: JAVA_TOOL_OPTIONS
              value: -Xms128m -Xmx384m
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /health/live, port: health }
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health/ready, port: health }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            # cpu request 100m -> 500m (prod 2026-07-21): at the open every service on the
            # node bursts and CFS shares starved this single-threaded consumer — its input
            # frame fell ~84min behind and only recovered midday. No cpu limit (burstable).
            requests: { cpu: 500m, memory: 256Mi }
            limits: { memory: 512Mi }
