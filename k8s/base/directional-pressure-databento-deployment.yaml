apiVersion: apps/v1
kind: Deployment
metadata:
  name: directional-pressure-databento-service
  namespace: options-edge
  labels:
    oe.replay/include: "true"
    oe.replay/side-effects: "false"
    oe.replay/topic-remap: "required"
    oe.replay/state: "ephemeral"
    oe.replay/determinism: "event-time"
    app.kubernetes.io/name: directional-pressure-databento-service
    app.kubernetes.io/part-of: options-edge
spec:
  # DISABLED until further notice (USER 2026-07-30): held at 0 in every monolith env
  # (dev + production). Re-enable = set back to 1, re-run generate-service-slices.sh,
  # and revert the ops-tooling entries (KEEP_DOWN / DISABLED_DEV / premarket / smoke).
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: directional-pressure-databento-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: directional-pressure-databento-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: directional-pressure
          image: 192.168.100.252:5000/options-edge-directional-pressure:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: KAFKA_RAW_TOPIC
              value: options.databento.normalized
            - name: KAFKA_DIRECTIONAL_PRESSURE_TOPIC
              value: options.databento.directional-pressure
            - name: KAFKA_DIRECTIONAL_PRESSURE_STREAMS_APP_ID
              value: options-flow-directional-pressure-streams-databento
            - name: KAFKA_DIRECTIONAL_PRESSURE_STREAMS_COMMIT_INTERVAL_MS
              value: "1000"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
