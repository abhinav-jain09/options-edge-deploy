apiVersion: apps/v1
kind: Deployment
metadata:
  name: volume-sandwich-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: volume-sandwich-service
    app.kubernetes.io/part-of: options-edge
spec:
  # TEMPORARILY DISABLED until further notice — service must not be deployed/scaled up (2026-07-02, per Abhinav)
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: volume-sandwich-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: volume-sandwich-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: volume-sandwich
          image: 192.168.100.252:5000/options-edge-volume-sandwich:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: IBKR
            - name: KAFKA_DISPLAY_VOLUME_TOPIC
              value: options.ibkr.display.volume.current
            - name: KAFKA_VOLUME_SANDWICH_CURRENT_TOPIC
              value: options.ibkr.volume-sandwich.current
            - name: KAFKA_VOLUME_SANDWICH_ALERTS_TOPIC
              value: options.ibkr.volume-sandwich.alerts
            - name: KAFKA_VOLUME_SANDWICH_STREAMS_APP_ID
              value: options-flow-volume-sandwich-streams-v2
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
