apiVersion: apps/v1
kind: Deployment
metadata:
  name: strike-liquidity-heatmap-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: strike-liquidity-heatmap-service
    app.kubernetes.io/component: strike-liquidity-heatmap-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: strike-liquidity-heatmap-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strike-liquidity-heatmap-service
        app.kubernetes.io/component: strike-liquidity-heatmap-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: strike-liquidity-heatmap
          image: 192.168.100.252:5000/options-edge-strike-liquidity-heatmap:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: HEALTH_PORT
              value: "8111"
            - name: STRIKE_LIQUIDITY_INPUT_EVENTS_TOPIC
              value: options.databento.events.raw
            - name: STRIKE_LIQUIDITY_INPUT_STRIKE_FLOW_TOPIC
              value: options.databento.strike-flow
            - name: STRIKE_LIQUIDITY_STREAMS_APP_ID
              value: options-edge-strike-liquidity-heatmap
            - name: STRIKE_LIQUIDITY_STREAMS_COMMIT_INTERVAL_MS
              value: "1000"
            - name: STRIKE_LIQUIDITY_STREAMS_AUTO_OFFSET_RESET
              value: latest
            - name: STRIKE_LIQUIDITY_STREAMS_NUM_THREADS
              value: "1"
            # exactly_once_v2 is the service default (STRIKE_LIQUIDITY_EOS_ENABLED=true);
            # thresholds/bucketing keep service defaults until the calibration pass
            # (design §13 step 7) writes tuned per-symbol values here.
            - name: KAFKA_STREAMS_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx768m"
          ports:
            - name: health
              containerPort: 8111
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          # Isolation hard requirement (design §7): own requests/limits so a leak or hot loop
          # can never starve co-located services. CPU limit is INTENTIONALLY absent (matches
          # every sibling streams service): CFS throttling would inject tail latency into the
          # 1.5s p99 event->frame SLO, while the CPU request still guarantees fair scheduling;
          # the memory limit bounds the one resource a runaway JVM actually exhausts.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        # DEDICATED PVC (design §7 isolation): state corruption recovers via the standard
        # scale0 / recreate-PVC / scale1 procedure without touching any neighbor.
        - name: kafka-streams-state
          persistentVolumeClaim:
            claimName: strike-liquidity-heatmap-service-streams-state
