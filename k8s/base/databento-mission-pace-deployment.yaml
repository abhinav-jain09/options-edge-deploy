apiVersion: apps/v1
kind: Deployment
metadata:
  name: databento-mission-pace-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: databento-mission-pace-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: databento-mission-pace-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: databento-mission-pace-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: databento-mission-pace
          image: 192.168.100.252:5000/options-edge-databento-mission-pace:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: HEALTH_PORT
              value: "8097"
            - name: KAFKA_MISSION_PACE_RAW_TOPIC
              value: options.databento.raw
            - name: KAFKA_MISSION_PACE_STRIKE_FLOW_TOPIC
              value: options.databento.strike-flow
            - name: KAFKA_MISSION_PACE_OUTPUT_TOPIC
              value: options.databento.pace.mission
            - name: KAFKA_MISSION_PACE_STREAMS_APP_ID
              value: options-edge-databento-mission-pace-v1
            - name: KAFKA_MISSION_PACE_STREAMS_NUM_THREADS
              value: "4"
            - name: KAFKA_MISSION_PACE_OUTPUT_INTERVAL_MS
              value: "1000"
            - name: KAFKA_MISSION_PACE_STALE_AFTER_MS
              value: "15000"
            - name: MISSION_PACE_REQUIRE_DATABENTO_SOURCE
              value: "true"
            - name: MISSION_PACE_ATM_DISTANCE_POINTS
              value: "5.0"
            - name: MISSION_PACE_NEAR_ATM_DISTANCE_POINTS
              value: "15.0"
            - name: MISSION_PACE_CLUSTER_WIDTH_POINTS
              value: "10.0"
            - name: MISSION_PACE_SHOCK_10S_THRESHOLD
              value: "750.0"
            - name: MISSION_PACE_SHOCK_1M_THRESHOLD
              value: "1500.0"
            - name: MISSION_PACE_MIN_VOLUME_FOR_ACTIVE_STRIKE
              value: "50"
            - name: MISSION_PACE_MAX_RANKED_STRIKES
              value: "50"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms1g -Xmx4g"
          ports:
            - name: health
              containerPort: 8097
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 5Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
