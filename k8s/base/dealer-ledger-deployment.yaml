apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealer-ledger-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: dealer-ledger-service
    app.kubernetes.io/component: dealer-ledger-service
    app.kubernetes.io/part-of: options-edge
spec:
  # DISABLED until further notice (USER 2026-07-29): dealer-ledger-service held at 0 in
  # dev + production. Re-enable = set back to 1 and re-run scripts/deploy/generate-service-slices.sh,
  # and drop it from morning-autostart KEEP_DOWN + dev-cleanup DISABLED_DEV.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dealer-ledger-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dealer-ledger-service
        app.kubernetes.io/component: dealer-ledger-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: dealer-ledger
          image: 192.168.100.252:5000/options-edge-dealer-ledger:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: HEALTH_PORT
              value: "8113"
            # --- input topics (DATABENTO derived + heatmap) ---
            - name: DEALER_LEDGER_INPUT_STRIKE_FLOW_TOPIC
              value: options.databento.strike-flow
            - name: DEALER_LEDGER_INPUT_GREEKS_TOPIC
              value: options.databento.gex.strike
            - name: DEALER_LEDGER_INPUT_SNAPSHOT_TOPIC
              value: options.databento.raw
            - name: DEALER_LEDGER_INPUT_HEATMAP_TOPIC
              value: strike-liquidity-heatmap-dashboard
            - name: DEALER_LEDGER_INPUT_DELTA_FLOW_TOPIC
              value: delta-flow-session
            # --- output topics (consumed by feed-gateway) ---
            - name: DEALER_LEDGER_OUTPUT_PROFILE_TOPIC
              value: dealer-ledger-profile
            - name: DEALER_LEDGER_OUTPUT_STATE_TOPIC
              value: dealer-ledger-state
            # --- Kafka Streams ---
            - name: DEALER_LEDGER_STREAMS_APP_ID
              value: options-edge-dealer-ledger-service
            - name: DEALER_LEDGER_STREAMS_COMMIT_INTERVAL_MS
              # EOS is ON, so every commit is a Kafka transaction. At 1s the hot task pays that
              # cost 60x a minute while its own recompute backlog is the thing to protect. 3s
              # keeps end-to-end latency well inside the 1-per-minute cadence every consumer of
              # dealer-ledger-profile actually samples at.
              value: "3000"
            - name: DEALER_LEDGER_STREAMS_AUTO_OFFSET_RESET
              value: latest
            - name: DEALER_LEDGER_STREAMS_NUM_THREADS
              # Evidence, from the rendered topology (Topology.describe()):
              #   sub-topology 0: sources flow-in / greeks-in / snapshot-in / heatmap-in ->
              #                   rekey-json + rekey-avro (stores: []) -> sink chain-rekey
              #   sub-topology 1: source chain-in (chain-rekey) -> ledger (all six state stores)
              #   sub-topology 2: deltaflow-in            sub-topology 3: global store (no tasks)
              # So the rekey stage is stateless and its tasks are per input partition, while EVERY
              # ledger state store belongs to the single "ledger" processor. All records for one
              # symbol|expiry hash to one chain-rekey partition, so the SPX chain remains exactly
              # one task and extra threads cannot execute it concurrently - Streams never runs one
              # task on two threads. What 4 threads buy is that the stateless rekey tasks and the
              # deltaflow task run alongside the ledger task instead of queueing behind it during
              # open/close bursts. It does not, and cannot, parallelise the chain itself.
              value: "4"
            - name: DEALER_LEDGER_EOS_ENABLED
              value: "true"
            - name: KAFKA_STREAMS_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            # --- kill switches: runs + emits profile/state, but DARK (no advisory, not UI-visible,
            #     UNCALIBRATED) until the calibration feature promotes it. Flip these deliberately. ---
            - name: DEALER_LEDGER_ENABLED
              value: "true"
            # ADVISORY stays false in ALL envs: an uncalibrated signal is never auto-advisory/tradeable.
            - name: DEALER_LEDGER_ADVISORY_ENABLED
              value: "false"
            # UI_VISIBLE + CALIBRATION_QUALITY live in the BASE (env-independent) so dev and prod render
            # IDENTICALLY. SHADOW = signal computed + shown, explicitly NOT advisory, before the calibration
            # engine earns LIVE via Wilson-passing evidence. Flip both together if ever shipping fully dark.
            - name: DEALER_LEDGER_UI_VISIBLE
              value: "true"
            - name: DEALER_LEDGER_CALIBRATION_QUALITY
              value: SHADOW
            # Quote-staleness for the greeks-quality gate. Default 30s flags STALE_QUOTE when a strike's
            # resting NBBO quoteAt trails the chain watermark by >30s — which then degrades inputQuality
            # and blocks arming, even for good, tight, present near-money quotes that simply haven't
            # re-quoted in 30s. Widened to 10min (matching DATABENTO_GEX_MAX_QUOTE_AGE_MS) so a stable
            # resting quote isn't thrown away; reduce gradually once firing is confirmed. Both envs (base).
            - name: DEALER_LEDGER_QUOTE_STALE_MS
              value: "600000"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms384m -Xmx1024m"
          ports:
            - name: health
              containerPort: 8113
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              # The ledger stage is a SINGLE Kafka Streams task (every input is rekeyed to
              # symbol|expiry, so one SPX chain = one partition = one thread) and it carries the
              # whole session: ~2.6M records measured on 2026-06-18, each triggering a full
              # per-strike state read + profile recompute. A 100m request means the scheduler
              # guarantees a tenth of a core for that thread, so under any node contention the
              # chain falls seconds behind and every downstream consumer sees stale analytics.
              # Headroom evidence (production .252, measured 2026-07-25): node capacity and
              # allocatable are both 24 CPU; summing the cpu requests of all 57 workloads at one
              # replica each gives 10.97 cores, so this raise (0.1 -> 2) leaves ~11 cores of
              # request headroom and cannot make the pod Pending. Note requests are scheduling
              # weights, not a reservation of two physical cores; there is deliberately no cpu
              # limit, so the pod may burst above 2 when the node is idle.
              cpu: "2"
              memory: 512Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
