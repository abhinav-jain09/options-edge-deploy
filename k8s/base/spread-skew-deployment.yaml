apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread-skew-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: spread-skew-service
    app.kubernetes.io/component: spread-skew-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: spread-skew-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spread-skew-service
        app.kubernetes.io/component: spread-skew-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: spread-skew
          image: 192.168.100.252:5000/options-edge-spread-skew:dev
          imagePullPolicy: Always
          # Shared platform config/secret provide KAFKA_BOOTSTRAP_SERVERS + APP_PROFILE and
          # POSTGRES_JDBC_URL/USER/PASSWORD. The service reads multi-session baselines
          # (spread_skew_sample) READ-ONLY over the same PG env the postgres-writer gets.
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: HEALTH_PORT
              value: "8122"
            # --- input topics ---
            - name: SPREAD_SKEW_INPUT_SPOT_TOPIC
              value: underlying.spx.price
            # --- output topics (consumed by feed-gateway / postgres-writer) ---
            - name: SPREAD_SKEW_OUTPUT_CURRENT_TOPIC
              value: options.spx.spread-skew.current
            - name: SPREAD_SKEW_OUTPUT_EVENTS_TOPIC
              value: options.spx.spread-skew.events
            # --- Kafka Streams ---
            - name: SPREAD_SKEW_STREAMS_APP_ID
              value: options-edge-spread-skew-service-v1
            - name: SPREAD_SKEW_STREAMS_COMMIT_INTERVAL_MS
              value: "1000"
            - name: SPREAD_SKEW_STREAMS_AUTO_OFFSET_RESET
              value: latest
            - name: SPREAD_SKEW_STREAMS_NUM_THREADS
              value: "1"
            - name: SPREAD_SKEW_EOS_ENABLED
              value: "true"
            - name: KAFKA_STREAMS_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            - name: SPREAD_SKEW_ENABLED
              value: "true"
            # Stateful Streams app: RocksDB stores hold off-heap native memory outside the
            # JVM heap. 2Gi heap + 4Gi limit matches the tier given to the other OOM-tight
            # per-strike Streams services (strike-intelligence, strike-invasion).
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx2048m"
          ports:
            - name: health
              containerPort: 8122
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
