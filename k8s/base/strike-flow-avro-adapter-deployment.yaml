apiVersion: apps/v1
kind: Deployment
metadata:
  name: strike-flow-avro-adapter
  namespace: options-edge
  labels:
    app.kubernetes.io/name: strike-flow-avro-adapter
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: strike-flow-avro-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strike-flow-avro-adapter
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: strike-flow-avro-adapter
          image: 192.168.100.252:5000/options-edge-strike-flow-avro-adapter:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: HEALTH_PORT
              value: "8109"
            # Stateless fan-out: classifier JSON snapshot topic in, per-strike Avro out (the topic the
            # unified-sr engine consumes as its FLOW input). No flow value is computed here.
            - name: KAFKA_STRIKE_FLOW_AVRO_INPUT_TOPIC
              value: options.databento.strike-flow
            - name: KAFKA_STRIKE_FLOW_AVRO_OUTPUT_TOPIC
              value: options.databento.strike-flow.strike.avro
            - name: KAFKA_STRIKE_FLOW_AVRO_STREAMS_APP_ID
              value: options-edge-strike-flow-avro-adapter-v1
            - name: KAFKA_STRIKE_FLOW_AVRO_STREAMS_NUM_THREADS
              value: "8"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx768m"
          ports:
            - name: health
              containerPort: 8109
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
