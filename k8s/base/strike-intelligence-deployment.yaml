apiVersion: apps/v1
kind: Deployment
metadata:
  name: strike-intelligence-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: strike-intelligence-service
    app.kubernetes.io/component: strike-intelligence-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: strike-intelligence-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strike-intelligence-service
        app.kubernetes.io/component: strike-intelligence-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: strike-intelligence
          image: 192.168.100.252:5000/options-edge-strike-intelligence:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: HEALTH_PORT
              value: "8114"
            # --- input topics (derived analytics only; no raw OPRA) ---
            - name: STRIKE_INTEL_INPUT_STRIKE_FLOW_TOPIC
              value: options.databento.strike-flow
            - name: STRIKE_INTEL_INPUT_DELTA_FLOW_TOPIC
              value: delta-flow-by-strike
            - name: STRIKE_INTEL_INPUT_PRICE_BEHAVIOR_TOPIC
              value: option-price-behavior-by-strike
            - name: STRIKE_INTEL_INPUT_GEX_FLOW_TOPIC
              value: options.databento.gex.flow.by-strike
            - name: STRIKE_INTEL_INPUT_UNDERLYING_TOPIC
              value: underlying.spx.price
            # --- output topics (consumed by feed-gateway later) ---
            - name: STRIKE_INTEL_BY_STRIKE_TOPIC
              value: strike-intelligence-by-strike
            - name: STRIKE_INTEL_DASHBOARD_TOPIC
              value: strike-intelligence-dashboard
            # --- Kafka Streams ---
            - name: STRIKE_INTEL_STREAMS_APP_ID
              value: options-edge-strike-intelligence-service-v1
            - name: STRIKE_INTEL_STREAMS_COMMIT_INTERVAL_MS
              value: "1000"
            - name: STRIKE_INTEL_STREAMS_AUTO_OFFSET_RESET
              value: latest
            - name: STRIKE_INTEL_STREAMS_NUM_THREADS
              value: "1"
            - name: STRIKE_INTEL_EOS_ENABLED
              value: "true"
            - name: KAFKA_STREAMS_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            # --- feature gate: computes + publishes signals; action bias is heuristic (not calibrated). ---
            - name: STRIKE_INTEL_ENABLED
              value: "true"
            - name: STRIKE_INTEL_ACTION_BIAS_ENABLED
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms384m -Xmx1024m"
          ports:
            - name: health
              containerPort: 8114
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
