apiVersion: apps/v1
kind: Deployment
metadata:
  name: unusual-whales-gex-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: unusual-whales-gex-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unusual-whales-gex-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unusual-whales-gex-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: unusual-whales-gex
          image: 192.168.100.252:5000/options-edge-unusual-whales-gex:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
          env:
            - name: UNUSUAL_WHALES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: options-edge-secrets
                  key: unusual-whales-api-key
                  optional: true
            - name: KAFKA_MARKET_DATA_SELECTION_TOPIC
              value: options.marketdata.selection
            - name: KAFKA_UNUSUAL_WHALES_GEX_TOPIC
              value: options.ibkr.unusualwhales.gex.strike
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
