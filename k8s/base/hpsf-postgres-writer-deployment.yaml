apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpsf-postgres-writer-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: hpsf-postgres-writer-service
    app.kubernetes.io/component: hpsf-postgres-writer
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hpsf-postgres-writer-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hpsf-postgres-writer-service
        app.kubernetes.io/component: hpsf-postgres-writer
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: hpsf-postgres-writer
          image: 192.168.100.252:5000/options-edge-hpsf-postgres-writer:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: HPSF_POSTGRES_WRITER_ENABLED
              value: "true"
            - name: HPSF_POSTGRES_WRITER_GROUP_ID
              value: options-hpsf-postgres-writer-v1
            - name: HPSF_POSTGRES_WRITER_AUTO_OFFSET_RESET
              value: earliest
            - name: HPSF_POSTGRES_WRITER_TOPICS
              value: options.hpsf.signal,options.hpsf.latest-signal,options.hpsf.audit,options.hpsf.market-flow,options.hpsf.strike-score,options.hpsf.dlq,options.hpsf.writer-dlq,options.hpsf.exit-signal
            - name: HPSF_ORDER_PLACEMENT_ENABLED
              value: "false"
            - name: ORDER_PLACEMENT_ENABLED
              value: "false"
            - name: HEALTH_PORT
              value: "8080"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx1536m"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
