# databento-maxpain — per-(symbol,expiry) max-pain payout-surface engine. Kafka Streams service that
# consumes options.databento.raw and emits options.databento.maxpain. It is INDEPENDENT of the GEX
# service (parses OI itself; uses only open interest + strikes — no Greeks, no GEX topic).
#
# Referenced from k8s/base/kustomization.yaml, so every monolith env renders it (promoted
# dev-only -> dev+production by PR #357). The dev overlay remaps the prod-registry base ref
# -> host.docker.internal:5001 via its images: transformer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: databento-maxpain-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: databento-maxpain-service
    app.kubernetes.io/component: databento-maxpain-service
    app.kubernetes.io/part-of: options-edge
spec:
  # PROD-ONLY (USER 2026-08-01: "turn on prod only"). Base stays 0 so dev/experiment keep
  # rendering the service down (dev-cleanup DISABLED_DEV still lists it); the production
  # overlay patches replicas -> 1. Re-enable elsewhere = patch that env's overlay +
  # re-run generate-service-slices.sh. Supersedes the 2026-07-30 all-env hold (PR #652).
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: databento-maxpain-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: databento-maxpain-service
        app.kubernetes.io/component: databento-maxpain-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: databento-maxpain
          image: 192.168.100.252:5000/options-edge-databento-maxpain:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config              # KAFKA_BOOTSTRAP_SERVERS, SCHEMA_REGISTRY_URL, …
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: HEALTH_PORT
              value: "8101"
            - name: KAFKA_DATABENTO_RAW_TOPIC
              value: options.databento.raw
            - name: KAFKA_DATABENTO_MAXPAIN_TOPIC
              value: options.databento.maxpain
            # v2 state-store format (feedEpochId-last codec). A fresh app id guarantees a clean state
            # store — the service has no prior deployment, so this is a clean start, not a migration.
            - name: KAFKA_MAXPAIN_STREAMS_APP_ID
              value: options-databento-maxpain-streams
            - name: KAFKA_MAXPAIN_STREAMS_NUM_THREADS
              value: "2"
            # Settlement policy (AM/PM classification + reference timing). PM cash close 16:00 ET; the
            # code defaults cover options-last-trade/AM-SET/lag/holidays/early-closes.
            - name: DATABENTO_MAXPAIN_SETTLEMENT_ZONE
              value: America/New_York
            - name: DATABENTO_MAXPAIN_PM_CLOSE
              value: "16:00"
            - name: KAFKA_STREAMS_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx2g"
          ports:
            - name: health
              containerPort: 8101
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
