apiVersion: apps/v1
kind: Deployment
metadata:
  name: databento-maxpain-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: databento-maxpain-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: databento-maxpain-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: databento-maxpain-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: databento-maxpain
          image: 192.168.100.252:5000/options-edge-databento-maxpain:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: HEALTH_PORT
              value: "8101"
            - name: KAFKA_DATABENTO_RAW_TOPIC
              value: options.databento.raw
            - name: KAFKA_DATABENTO_MAXPAIN_TOPIC
              value: options.databento.maxpain
            - name: KAFKA_MAXPAIN_STREAMS_APP_ID
              value: options-databento-maxpain-streams-v1
            - name: KAFKA_MAXPAIN_STREAMS_NUM_THREADS
              value: "2"
            # Settlement policy: PM cash close at 16:00 America/New_York (DST-correct via zoned time).
            # Early-close half-days can be supplied as CSV "yyyymmdd=HH:mm,..." here when needed.
            - name: DATABENTO_MAXPAIN_SETTLEMENT_ZONE
              value: America/New_York
            - name: DATABENTO_MAXPAIN_PM_CLOSE
              value: "16:00"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx2g"
          ports:
            - name: health
              containerPort: 8101
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 3Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
