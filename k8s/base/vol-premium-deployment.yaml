# vol-premium-service: the Gate-1 danger-clock ENGINE (options-edge-processing vol-premium-service, merged
# PR #790; calendar ledger in PostgreSQL, PR #807). Runbook: options-edge-documents
# runbook/VOL-PREMIUM-DANGER-CLOCK-RUNBOOK.md §2 "Required environment" and the step-4 row of its rollout
# sequence. It runs as an UNCALIBRATED SHADOW: VOL_PREMIUM_BASELINE_VERSION=NONE, UI locked.
#
# The image is built from options-edge-processing main (image-tags/<env>.yaml: vol-premium-service), so the
# engine arrives through the normal build; nothing in this file names a build.
#
# BEFORE THE FIRST ROLLOUT of this manifest the pinned calendar must be a row in the production database:
# Jenkinsfile.vol-premium-ledger-publish (dry run, then CONFIRM=true). Without it every pod halts at boot
# (exit 70) with CALENDAR_LEDGER_UNAVAILABLE (no table) or CALENDAR_VERSION_MISMATCH (no row) and crash-loops,
# which is the intended behaviour, not a fault to work around.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vol-premium-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: vol-premium-service
    app.kubernetes.io/component: vol-premium-service
    app.kubernetes.io/part-of: options-edge
spec:
  # replicas 2 with one warm standby (design §8.5, VP-80; runbook §2 "Sizing"). This is a Kafka Streams
  # application: exactly one instance owns the engine task at a time, the other holds a standby copy of its
  # state stores (VOL_PREMIUM_NUM_STANDBY_REPLICAS below), so a lost pod fails over without replaying the
  # changelog from scratch. Output ordering does not rest on the replica count: the engine creates every output
  # topic with ONE partition and refuses to start on any other count.
  #
  # READINESS OF THE STANDBY. /health/ready inside RTH (past VOL_PREMIUM_READY_WARMUP_MS) requires THIS instance
  # to have published a frame recently, and only the instance owning the task publishes. During RTH the standby
  # pod therefore reports NotReady while the active one is Ready (the Deployment reads 1/2); outside RTH both
  # are Ready. Deploy off-hours, as below.
  #
  # Recreate: every pod stops before the new ones start, so there is never an old and a new build owning the
  # task in the same session. A code change inside a session is DEPLOYMENT_IDENTITY_CHANGED to the engine
  # (design §8.1): the new identity publishes no more scored frames for the rest of that session. DEPLOY THIS
  # SERVICE OUTSIDE MARKET HOURS, and treat an off-hours deploy as finished at the next open, when frames are
  # expected: vol_premium_frames_published rising and vol_premium_last_frame_age_ms small.
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vol-premium-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vol-premium-service
        app.kubernetes.io/component: vol-premium-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: vol-premium
          image: 192.168.100.252:5000/options-edge-vol-premium:dev
          imagePullPolicy: Always
          # Shared platform config/secret provide the runtime profile the engine validates first
          # (processing-common RuntimeProfileConfig): APP_PROFILE, KAFKA_BOOTSTRAP_SERVERS, SCHEMA_REGISTRY_URL,
          # TOPIC_PREFIX, KAFKA_TOPIC_REPLICATION_FACTOR / KAFKA_TOPIC_MIN_IN_SYNC_REPLICAS and, on production,
          # OPTIONS_EDGE_UNCOMPACTED_SERVED_TOPICS — exactly like every sibling service.
          #
          # NOT SET HERE, on purpose:
          #   * VOL_PREMIUM_CODE_VERSION / VOL_PREMIUM_CONTRACTS_VERSION — baked into the image by the processing
          #     build (vol-premium-service/Dockerfile ENV from --build-arg CODE_VERSION / CONTRACTS_VERSION). A value
          #     here would override the build's own identity on every frame.
          #   * VOL_PREMIUM_BASELINE_CONTENT_HASH — with BASELINE_VERSION=NONE the engine REFUSES a non-blank hash
          #     ("a content hash with BASELINE_VERSION=NONE names nothing"). It arrives with a pinned baseline.
          #   * VOL_PREMIUM_CALENDAR_TOPIC — withdrawn 2026-09-13; the calendar is a PostgreSQL table.
          #   * the §11 thresholds (EngineSettings) — every one has its documented default in the engine.
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: HEALTH_PORT
              value: "8152"
            # §9.1 kill switch: false keeps the pod alive and INERT (the topology is never started).
            - name: VOL_PREMIUM_ENABLED
              value: "true"
            # --- inputs (producer-owned; the engine never creates them and halts SOURCE_TOPIC_ABSENT without them) ---
            - name: VOL_PREMIUM_INPUT_GEX_TOPIC
              value: options.databento.gex.strike
            - name: VOL_PREMIUM_INPUT_SPOT_TOPIC
              value: underlying.spx.price
            # --- outputs (service-owned: the engine creates/stamps them at every boot, one partition each) ---
            # Base names; the engine applies TOPIC_PREFIX through the platform helper (KafkaSettings.topicValue),
            # like every other service. Each must match its declaration in scripts/kafka/topics.env.
            - name: VOL_PREMIUM_IVRV_TOPIC
              value: options.spx.vol-premium.ivrv
            - name: VOL_PREMIUM_EVENTS_TOPIC
              value: options.spx.vol-premium.events
            - name: VOL_PREMIUM_CURRENT_TOPIC
              value: options.spx.vol-premium.current
            - name: VOL_PREMIUM_WARNINGS_TOPIC
              value: options.spx.vol-premium.warnings
            - name: VOL_PREMIUM_DLQ_TOPIC
              value: options.spx.vol-premium.dlq
            # The baseline version ledger is the PUBLISHER's topic; the engine never creates it and reads it only
            # when a baseline is pinned (not under BASELINE_VERSION=NONE).
            - name: VOL_PREMIUM_BASELINE_TOPIC
              value: options.spx.vol-premium.baseline
            # --- Streams sizing (runbook §2) ---
            # One stream thread; the engine sub-topology repartitions to a single partition, so one task.
            - name: VOL_PREMIUM_STREAM_THREADS
              value: "1"
            # The warm standby that replicas: 2 exists for (design §8.5).
            - name: VOL_PREMIUM_NUM_STANDBY_REPLICAS
              value: "1"
            # Must stay true: the engine asserts exactly_once_v2 and halts EXACTLY_ONCE_REQUIRED without it.
            - name: VOL_PREMIUM_EXACTLY_ONCE
              value: "true"
            # Must match the mounted volume below (the engine's own default is /tmp).
            - name: VOL_PREMIUM_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            # How often the one-partition output contract is re-checked while running; a violation STOPS
            # publication (halt OUTPUT_TOPOLOGY_INVALID). Watch vol_premium_output_topology_valid.
            - name: VOL_PREMIUM_TOPOLOGY_CHECK_MS
              value: "60000"
            # Allowed lateness before a sampling slot is sealed (a correctness setting; engine cap 300000).
            - name: VOL_PREMIUM_GRID_LATENESS_MS
              value: "30000"
            # --- deploy pins (§6.1–§6.3, §8.1(4)) ---
            # NONE must be DECLARED: the engine refuses to boot with this key unset (§6.2). NONE = UNCALIBRATED
            # SHADOW; a pinned version needs a published, validated baseline (§6.5 open, owner decision).
            - name: VOL_PREMIUM_BASELINE_VERSION
              value: "NONE"
            # THE CALENDAR LEDGER LIVES IN POSTGRES, NOT IN A KAFKA TOPIC: table vol_premium_calendar_ledger, created
            # and written only by VolPremiumLedgerPublisher --confirm (Jenkinsfile.vol-premium-ledger-publish). The
            # engine reads the row under the version pin at boot, RECOMPUTES its content hash from the wire and
            # compares it to the hash pin. It halts (70) with CALENDAR_LEDGER_UNAVAILABLE (table unreadable/absent),
            # CALENDAR_VERSION_MISMATCH (no row), CALENDAR_HASH_MISMATCH or CALENDAR_MALFORMED. The pins below and
            # scripts/vol-premium/calendars/calendar-2026.1.json must agree, which
            # scripts/ci/validate-vol-premium-calendar.sh asserts on every PR. Both keys are required; the engine
            # has no NONE mode for the calendar.
            - name: VOL_PREMIUM_CALENDAR_VERSION
              value: "2026.1"
            - name: VOL_PREMIUM_CALENDAR_CONTENT_HASH
              value: "cf209ff9ff428428988322928b27cd625556a2bb5a28131410b4d4631ea9c347"
            # The UI stays LOCKED (§9.1: promotion is a config change made by a person who has read the gate
            # report). false is also the engine's default; it is written out so the lock is a reviewed line in git,
            # not an absence.
            - name: VOL_PREMIUM_UI_ACTIVATED
              value: "false"
            # --- Postgres: the calendar ledger's home, the same source every Postgres-using service reads
            # (options-edge-config carries POSTGRES_JDBC_URL/USER; options-edge-runtime-secrets carries the
            # password). Both are already in envFrom above; naming the three keys here makes the dependency explicit
            # and mirrors es-open-direction / reversal-postgres-writer / signal-follower. The engine's prod profile
            # requires all three and refuses a localhost URL; its dev profile requires a *_dev database, which the
            # dev overlay's options-edge-config supplies (options_flow_dev).
            - name: POSTGRES_JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: options-edge-config
                  key: POSTGRES_JDBC_URL
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: options-edge-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: options-edge-runtime-secrets
                  key: POSTGRES_PASSWORD
            # Heap sized to the design's SLO_HEAP_MB 1024 (§10.5): the engine's continuation state, its fold buffers
            # (MAX_PENDING_RECORDS 400000, DEDUP_CAPACITY 200000 are boot-asserted capacities) and the smile.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx1024m"
          ports:
            - name: health
              containerPort: 8152
          # Liveness is MARKET-GATED by design: it returns 200 outside RTH so a quiet market cannot turn a healthy
          # pod into a restart loop. That is why the process takes itself down when boot fails rather than leaning
          # on this probe: every boot refusal is written to the DLQ topic and stderr, then the process halts with
          # exit 70, so CrashLoopBackOff shows the fault immediately, in any session or none.
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              # 1024 MiB heap plus what lives OFF the heap: the five RocksDB state stores (options-edge-config
              # KAFKA_STREAMS_STORE_TYPE=persistent — block caches and memtables), metaspace, thread stacks and the
              # Kafka clients' buffers.
              memory: 2Gi
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
      volumes:
        # emptyDir, deliberately. The engine's five state stores are RocksDB stores in this directory
        # (KAFKA_STREAMS_STORE_TYPE=persistent from options-edge-config) and every one is changelog-backed, so the
        # directory is a local copy: a replaced pod restores from the changelog, or the warm standby takes over.
        # A PVC would add nothing but the failure mode where a deleted claim on a DEPLOYMENT is never recreated and
        # the pod sits Pending. Never reset Streams state by deleting storage; reset the consumer group through the
        # documented Kafka job (runbook §2).
        - name: kafka-streams-state
          emptyDir: {}
