# THIS IS A REALISED-ONLY LAUNCH.
#
# The card is named "Implied vs Realised" and today it draws ONE of those two lines. That is a
# deliberate, owner-approved scope decision, not a defect and not a temporary state waiting on any
# of this: nothing in this service, the gateway or the browser has to change for the implied line
# to appear — it appears the day an upstream chain publisher supplies what the producer already
# asks for (a provable quote age AND a cohort identity on the same record). Until then, deploying
# this deploys a realised-volatility series with the implied half explicitly absent and explained
# on the card itself. The detail, including the two named counters, is below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vol-premium-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: vol-premium-service
    app.kubernetes.io/component: vol-premium-service
    app.kubernetes.io/part-of: options-edge
spec:
  # One replica, stated accurately rather than dramatically. The topology REPARTITIONS to a single
  # partition ahead of the processor, so a second replica sharing this application id would not
  # interleave frames — Streams would assign the one task to one instance and leave the other idle.
  # What a second replica actually buys is an idle pod, a rebalance on every roll and a second
  # local state directory to warm.
  #
  # The correctness fence lives in the SERVICE and is re-checked every boot: it creates its output
  # topic compacted with exactly ONE partition and refuses to start on any other count, because two
  # partitions WOULD interleave frames from two tasks with no way for a consumer to re-order them.
  #
  # Recreate, and the reason is specific rather than conventional. A surge rollout looks safer and
  # is not, because Kubernetes readiness and Kafka task ownership are different things: a surged
  # pod joins the consumer group BEFORE it is Ready. Either the sole task stays with the old pod,
  # in which case the new pod can never publish and so can never satisfy this service's
  # market-hours readiness — a good build times out — or the task moves to the new pod, in which
  # case a defective replacement silences production while the old pod sits idle but "available".
  # maxUnavailable: 0 protects Kubernetes availability accounting, not the thing that actually
  # produces records.
  #
  # So the honest trade is taken instead of a false guarantee: Recreate gives a brief gap while the
  # single task moves, with no ambiguity about who owns it, and a bad build fails the rollout
  # visibly.
  #
  # THE REAL COST IS LARGER THAN THE GAP, and it is stated here because it decides WHEN to deploy.
  # The sampling grid is ordinary in-memory processor state, not a changelog-backed store, and the
  # replacement resumes from committed offsets rather than replaying the session from its open —
  # the emptyDir cannot restore it either. So a MID-SESSION rollout discards every return
  # accumulated so far that day: for the rest of the session the "Realised (session)" figure
  # describes only what has been seen since the restart.
  #
  # A ROLLOUT IS NOT THE ONLY WAY THAT HAPPENS, and reading this comment as a deploy-time cost
  # would be reading it too narrowly. The same reset follows anything that recreates the task: an
  # uncaught stream exception under REPLACE_THREAD, a rebalance, an OOM kill, a node drain. None of
  # those is scheduled, and none of them stops the service publishing — which is what makes the
  # reset quiet. It is therefore made explicit in three places rather than left to be inferred:
  #
  #   * every reading carries measurementEpochMs, the moment the CURRENT accumulator began, so a
  #     consumer breaks the line at the reset instead of drawing across it, and the card says
  #     "Realised restarted HH:MM ET". A page that JOINED after the reset never sees that
  #     transition — the gateway replays one current reading per session — so the card also judges
  #     the epoch against the session open from a single frame and says "Realised covers only from
  #     HH:MM ET" on its own;
  #   * vol_premium_processor_starts counts the constructions — anything above 1 inside a session
  #     is a reset, and it is the metric to alert on;
  #   * the readiness probe goes NotReady until the NEW instance has published — but ONLY while
  #     frames are expected, which is inside RTH past the warm-up. The frame clock is cleared when
  #     the task is created, so a pod cannot report Ready on the strength of a frame its
  #     predecessor published; outside that window readiness is topology and process health alone,
  #     because a quiet market must never become a restart loop.
  #
  #     READ THAT LIMIT BEFORE TRUSTING A GREEN OFF-HOURS ROLLOUT, which is the rollout this
  #     manifest recommends. Overnight, at a weekend, on a holiday or before the warm-up elapses,
  #     Ready means the process is up, the engine is running and the output topology still holds —
  #     it does NOT mean a realised reading reached Kafka, the gateway or a browser. Nothing in
  #     the rollout can mean that, because nothing is being measured yet.
  #
  #     So an off-hours deploy is finished at the NEXT OPEN, not at the green rollout: past 09:40
  #     ET check that vol_premium_frames_published is rising and vol_premium_last_frame_age_ms is
  #     small. If it is not, the pod will also have gone NotReady on its own by then — that is
  #     what the market-hours gate is for — but the deploy that caused it will already have been
  #     reported as successful hours earlier.
  #
  # returnsObserved and gridCoverage additionally collapse across a reset, so the wire says how
  # MUCH of the session is behind the number as well as WHICH accumulator produced it. None of this
  # makes the loss recoverable before the next open.
  # DEPLOY THIS SERVICE OUTSIDE MARKET HOURS unless the change is urgent enough to be worth one
  # session's realised series.
  #
  # WHAT THIS SERVICE PUBLISHES TODAY, so the deploy decision is made with it in view: the REALISED
  # series only. The producer refuses any option leg whose quote age it cannot PROVE, and no
  # current chain publisher supplies that evidence — the Databento live path stamps
  # quoteOldestReceiptTimeMs zero, and the IBKR pre-open path stamps it but carries no
  # (feedEpochId, epochSeq) cohort identity, so it is refused by the cohort rule instead. Both
  # refusals are counted (GEX_NO_PROVABLE_QUOTE_AGE, GEX_NO_COHORT_IDENTITY) and the card states
  # the absence in words rather than showing an empty half of a two-line chart.
  #
  # This is a deliberate, stated launch limitation, not an oversight: an implied volatility whose
  # maximum age cannot be proved is worse than no implied volatility on a 0DTE card, and the
  # realised series is useful on its own. The implied line appears with NO change here on the day
  # either upstream gap closes.
  #
  # HOW YOU WILL KNOW IT CLOSED — and it is not a unit test, because no unit test can observe an
  # upstream deployment. The service's own counters are the detector:
  #
  #     vol_premium_rejected{reason="GEX_NO_PROVABLE_QUOTE_AGE"}   stops rising, and
  #     vol_premium_rejected{reason="GEX_NO_COHORT_IDENTITY"}      stops rising,
  #
  # while atmIvPct starts appearing on the wire. The service test named
  # bothUpstreamGapsClosedProducesAReading SPECIFIES the shape that would be accepted; it is green
  # today, against a synthetic record, and cannot tell you anything about what upstream publishes.
  # Do not read it as a go-live signal.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vol-premium-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vol-premium-service
        app.kubernetes.io/component: vol-premium-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: vol-premium
          image: 192.168.100.252:5000/options-edge-vol-premium:dev
          imagePullPolicy: Always
          # Shared platform config/secret provide KAFKA_BOOTSTRAP_SERVERS (+ the rest of the
          # platform defaults) exactly like every sibling service.
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: HEALTH_PORT
              value: "8152"
            - name: VOL_PREMIUM_ENABLED
              value: "true"
            # --- inputs ---
            - name: VOL_PREMIUM_INPUT_GEX_TOPIC
              value: options.databento.gex.strike
            - name: VOL_PREMIUM_INPUT_SPOT_TOPIC
              value: underlying.spx.price
            # --- output ---
            - name: VOL_PREMIUM_IVRV_TOPIC
              value: options.spx.vol-premium.ivrv
            # Must match the mounted volume below. The service's own default is /tmp, so leaving
            # this unset would mount an emptyDir the process never writes to and keep Streams state
            # on the container filesystem instead.
            - name: VOL_PREMIUM_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            # UNCALIBRATED is the honest default and is deliberately NOT a placeholder: no baseline
            # has been calibrated yet, and every reading says so on the wire so the seasonally
            # conditioned components report NO_BASELINE rather than inventing one. Setting
            # Note what setting this to a version does and does NOT do today: any value other than
            # the literal NONE makes the service DECLARE itself PINNED on every reading. It does not
            # yet verify that the named baseline exists or matches. Do not set it until that
            # verification is built, or every reading will claim a calibration it does not have.
            # HOW OFTEN THE OUTPUT TOPOLOGY IS RE-CHECKED WHILE RUNNING.
            #
            # The one-partition contract on options.spx.vol-premium.ivrv is what makes the frame
            # ordinal meaningful, and boot-time enforcement cannot protect a topic from being
            # removed underneath a live pod — the routine cleanup deletes and recreates declared
            # topics, and in the window between the two a running producer can have the broker
            # auto-create the output with default partitions. From then on frames land on whichever
            # partition their key hashes to and no consumer can re-order them.
            #
            # So the service re-checks on this timer and STOPS PUBLISHING if the contract has
            # stopped holding: silence is recoverable, an unorderable series is not. It also goes
            # NotReady, which is visible through the market-hours liveness gate. Watch
            # vol_premium_output_topology_valid; a zero there is a stopped producer, and the fix is
            # to restore the topic at one partition and restart the pod.
            - name: VOL_PREMIUM_TOPOLOGY_CHECK_MS
              value: "60000"
            # ALLOWED LATENESS BEFORE A SAMPLING SLOT IS SEALED, and it is a correctness
            # setting, not a tuning knob. The merged stream's time is the max event time over the
            # chain feed AND the tape, so a chain record stamped ahead of the newest spot tick
            # advances it; without this buffer the next frame would seal slots the tape has not
            # reached, and a spot tick arriving afterwards with an earlier event time — valid, not
            # a regression — could no longer represent its boundary. The slot would then carry an
            # older price or none, and the realised figure would be quietly wrong rather than
            # honestly absent.
            #
            # It costs NOTHING while spot is flowing: slots seal up to the newest tick, which is
            # complete evidence. It only delays sealing during a spot OUTAGE, where it is how long
            # the measurement waits before recording the gap as a gap. Raise it if
            # vol_premium_late_spot_ticks starts rising — that counter is the residual, and a
            # non-zero value means a slot's evidence was lost for good.
            - name: VOL_PREMIUM_GRID_LATENESS_MS
              value: "30000"
            - name: VOL_PREMIUM_BASELINE_VERSION
              value: "NONE"
            # In-memory sampling grid plus a trimmed smile; the Streams runtime dominates.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx512m"
          ports:
            - name: health
              containerPort: 8152
          # Liveness is MARKET-GATED by design: it returns 200 outside RTH so a quiet market
          # cannot turn a healthy pod into a restart loop. That gate is also why the process must
          # take itself down when its engine fails to start rather than leaning on this probe —
          # off-hours a dead engine would answer 200/NOT_RUNNING until the rollout timed out, and
          # off-hours is exactly when this service is meant to be deployed. It exits 71 instead
          # (71 = engine/platform, 70 = configuration), so CrashLoopBackOff shows the fault
          # immediately, in any session or none.
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
      volumes:
        # emptyDir, deliberately — but NOT because the state is rebuildable. It is not: see the
        # rollout note above, which is the authoritative statement of what a restart costs. A PVC
        # would buy nothing here, because the thing lost on restart is the in-memory sampling grid
        # and no volume holds it; what it would cost is the failure mode where a deleted claim on a
        # DEPLOYMENT is never recreated (only a StatefulSet volumeClaimTemplate does that) and the
        # pod sits Pending indefinitely. This directory holds only the Streams runtime's own files.
        - name: kafka-streams-state
          emptyDir: {}
