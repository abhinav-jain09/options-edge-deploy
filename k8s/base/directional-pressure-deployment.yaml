apiVersion: apps/v1
kind: Deployment
metadata:
  name: directional-pressure-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: directional-pressure-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: directional-pressure-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: directional-pressure-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: directional-pressure
          image: 192.168.100.252:5000/options-edge-directional-pressure:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: options-edge-config
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: IBKR
            - name: KAFKA_RAW_TOPIC
              value: options.ibkr.raw
            - name: KAFKA_RAW_IBKR_TOPIC
              value: options.ibkr.raw
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
