apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealer-ledger-calibration-scorer
  namespace: options-edge
  labels:
    app.kubernetes.io/name: dealer-ledger-calibration-scorer
    app.kubernetes.io/component: dealer-ledger-calibration-scorer
    app.kubernetes.io/part-of: options-edge
spec:
  # DISABLED until further notice (USER 2026-07-29): calibration scorer held at 0 in dev + production.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dealer-ledger-calibration-scorer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dealer-ledger-calibration-scorer
        app.kubernetes.io/component: dealer-ledger-calibration-scorer
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: dealer-ledger-calibration-scorer
          image: 192.168.100.252:5000/options-edge-dealer-ledger-calibration:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            # role select: this Deployment runs the SignalFired + spot -> OutcomeScored Streams topology.
            - name: CALIBRATION_ROLE
              value: scorer
            - name: HEALTH_PORT
              value: "8080"
            # inputs: the audit SignalFired stream + the canonical-spot SSOT (the dedicated JSON spot
            # stream, NOT the option-snapshot firehose it used to mine canonicalSpot out of); output topic.
            - name: SCORER_INPUT_SIGNAL_FIRED_TOPIC
              value: dealer-ledger-signal-fired
            - name: SCORER_INPUT_SPOT_TOPIC
              value: underlying.spx.price
            - name: SCORER_OUTPUT_OUTCOME_SCORED_TOPIC
              value: dealer-ledger-outcome-scored
            - name: KAFKA_STREAMS_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            # 1-minute bars; session flush grace after 16:00 ET close. ORACLE_* LABEL params default in-code.
            - name: SCORER_BAR_SIZE_MS
              value: "60000"
            - name: SCORER_SESSION_GRACE_MS
              value: "120000"
            # Explicit heap so container-RAM growth is bounded + predictable (default was ~25% of the
            # limit). The scorer buffers a session's spot in memory; that heap + RocksDB off-heap + the
            # enlarged Kafka producer/consumer buffers OOMKilled the 1536Mi container in ~52s (exit 137,
            # crash-loop) back when every option-strike snapshot carried a duplicate spot. Raise the limit
            # to 4Gi and pin -Xmx2560m, leaving ~1.5Gi for RocksDB/direct buffers/metaspace. The
            # bounded-buffer code fix removes the root cause; this headroom is the belt-and-suspenders.
            #
            # NOTE: the scorer no longer "replays the spot backlog on restart" — it cannot. The spot source
            # underlying.spx.price is cleanup.policy=compact, so the broker keeps only the current segment
            # (measured on prod 2026-07-30: 277 records retained against log-end offset 585,102). The
            # session history lives in the changelogged scorer-session-buffer store, NOT in the topic.
            # Ordinary restarts and rebalances are safe; do NOT change SCORER_STREAMS_APP_ID or wipe the
            # kafka-streams-state PVC on a live session — the day's spot path cannot be rebuilt and every
            # fire before the resume point scores CENSORED_DATA_GAP. The scorer logs SPOT-COVERAGE when
            # that happens.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx2560m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
