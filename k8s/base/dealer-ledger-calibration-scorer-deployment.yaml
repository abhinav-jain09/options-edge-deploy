apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealer-ledger-calibration-scorer
  namespace: options-edge
  labels:
    app.kubernetes.io/name: dealer-ledger-calibration-scorer
    app.kubernetes.io/component: dealer-ledger-calibration-scorer
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dealer-ledger-calibration-scorer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dealer-ledger-calibration-scorer
        app.kubernetes.io/component: dealer-ledger-calibration-scorer
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: dealer-ledger-calibration-scorer
          image: 192.168.100.252:5000/options-edge-dealer-ledger-calibration:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            # role select: this Deployment runs the SignalFired + spot -> OutcomeScored Streams topology.
            - name: CALIBRATION_ROLE
              value: scorer
            - name: HEALTH_PORT
              value: "8080"
            # inputs: the audit SignalFired stream + the canonical-spot SSOT (Avro raw); output topic.
            - name: SCORER_INPUT_SIGNAL_FIRED_TOPIC
              value: dealer-ledger-signal-fired
            - name: SCORER_INPUT_RAW_TOPIC
              value: options.databento.raw
            - name: SCORER_OUTPUT_OUTCOME_SCORED_TOPIC
              value: dealer-ledger-outcome-scored
            - name: KAFKA_STREAMS_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            # 1-minute bars; session flush grace after 16:00 ET close. ORACLE_* LABEL params default in-code.
            - name: SCORER_BAR_SIZE_MS
              value: "60000"
            - name: SCORER_SESSION_GRACE_MS
              value: "120000"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
