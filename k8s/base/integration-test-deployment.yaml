apiVersion: apps/v1
kind: Deployment
metadata:
  name: options-edge-integration-test
  namespace: options-edge
  labels:
    app.kubernetes.io/name: options-edge-integration-test
    app.kubernetes.io/part-of: options-edge
spec:
  # DISABLED until further notice (all envs): smoke/integration-test runner, not part of the live chain.
  # Held at 0.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: options-edge-integration-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: options-edge-integration-test
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: integration-test
          image: 192.168.100.252:5000/options-edge-integration-test:dev
          imagePullPolicy: Always
          env:
            # Login is enforced on the web + gateway WS, so the synthetic verifier
            # authenticates as a read-only dummy user (oe-smoke) via the OIDC
            # password grant. SMOKE_AUTH_PASSWORD comes from the
            # options-edge-runtime-secrets secret (envFrom below); the Jenkinsfile
            # injects it from the options-edge-smoke-password credential.
            - name: SMOKE_AUTH_ENABLED
              value: "true"
            - name: SMOKE_AUTH_CLIENT_ID
              value: "options-edge-web"
            - name: SMOKE_AUTH_USERNAME
              value: "oe-smoke"
            # Base = PROD issuer; the dev overlay overrides this. It MUST exactly
            # match the issuer the web/gateway validate, else the token's iss claim
            # is rejected even though the grant succeeds.
            - name: SMOKE_AUTH_ISSUER_URI
              value: "https://auth.fullfunding.nl/realms/optionsedge"
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
