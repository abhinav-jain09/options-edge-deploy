apiVersion: apps/v1
kind: Deployment
metadata:
  name: volume-pace-databento-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: volume-pace-databento-service
    app.kubernetes.io/part-of: options-edge
spec:
  # DISABLED until further notice (USER 2026-07-23): volume-pace-databento-service held at 0 in
  # all monolith envs (dev + production). Re-enable = set back to 1 and re-run
  # scripts/deploy/generate-service-slices.sh. es4 slice (k8s/es4/services/volume-pace.yaml) is
  # separate and intentionally untouched.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: volume-pace-databento-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: volume-pace-databento-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: volume-pace
          image: 192.168.100.252:5000/options-edge-volume-pace:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: KAFKA_RAW_TOPIC
              value: options.databento.normalized
            - name: KAFKA_PACE_TOPIC
              value: options.databento.pace
            - name: KAFKA_PACE_STREAMS_APP_ID
              value: options-flow-pace-streams-databento
            - name: KAFKA_PACE_STREAMS_COMMIT_INTERVAL_MS
              value: "1000"
            - name: KAFKA_PACE_STREAMS_NUM_THREADS
              value: "2"
            - name: KAFKA_PACE_STREAMS_CACHE_MAX_BYTES_BUFFERING
              value: "1048576"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms2g -Xmx6g"
            # Pace-of-volume trajectory window = full RTH session (~6h45m) at a 5-min grid, so the popup
            # spans the session. Grid coarse enough to keep the ring within the 256-bucket codec cap
            # (24300/300 ≈ 81 buckets) and the emitted payload + per-strike state bounded (prod CPU-limited).
            - name: PACE_TRAJ_HORIZON_MS
              value: "24300000"
            - name: PACE_TRAJ_GRID_MS
              value: "300000"
            - name: PACE_TRAJ_MAX_FLOOR_AGE_MS
              value: "300000"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              memory: 8Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
