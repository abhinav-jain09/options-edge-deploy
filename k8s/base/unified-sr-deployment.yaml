apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-sr-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: unified-sr-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: unified-sr-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unified-sr-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: unified-sr
          image: 192.168.100.252:5000/options-edge-unified-sr:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: HEALTH_PORT
              value: "8108"
            # Input topics: GEX (per-strike Avro), strike-flow per-strike Avro (P0a additive topic),
            # and the raw option snapshot stream (for canonical spot via RawSpotProcessor — SSOT B3 fix).
            - name: KAFKA_UNIFIED_SR_GEX_TOPIC
              value: options.databento.gex.strike
            - name: KAFKA_UNIFIED_SR_FLOW_TOPIC
              value: options.databento.strike-flow.strike.avro
            - name: KAFKA_UNIFIED_SR_RAW_TOPIC
              value: options.databento.raw
            - name: KAFKA_UNIFIED_SR_OUTPUT_TOPIC
              value: options.spx.strike-sr.current
            - name: KAFKA_UNIFIED_SR_HISTORY_TOPIC
              value: options.spx.strike-sr.history
            - name: KAFKA_UNIFIED_SR_STREAMS_APP_ID
              value: options-edge-unified-sr
            - name: KAFKA_UNIFIED_SR_STREAMS_COMMIT_INTERVAL_MS
              value: "1000"
            - name: KAFKA_UNIFIED_SR_STREAMS_NUM_THREADS
              value: "8"
            # Streams state dir = the kafka-streams-state mount (PVC via kafka-streams-state-patches.yaml),
            # so RocksDB state persists across restarts instead of replaying the full changelog each time.
            - name: KAFKA_STREAMS_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx2g"
          ports:
            - name: health
              containerPort: 8108
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              # 2026-10-16: raised from 250m. Measured on prod while this service worked through a backlog: the
              # process sustained 155-197% CPU, i.e. about two cores, so a 250m request understated it by ~8x.
              # There is no cpu limit, so 250m never CFS-throttled it; what 250m did do is set its RELATIVE CPU
              # WEIGHT, which is what decides who yields when the 24-core prod host is oversubscribed (50+ services
              # plus research replays have driven load past 70). At 250m it was the lightest-weighted heavy
              # consumer on the box and could not keep up with its own input: after the 10-16 recovery it published
              # while its backlog still GREW 20.5k records per 90s with 24.1M outstanding. Live capacity measured on
              # the prod node before raising it: allocatable 24 cores; admitted pod requests cpu 12675m (52.8%) and
              # memory 38012Mi (59%). This change adds 1750m, taking admitted CPU requests to ~14425m, i.e. ~60%
              # of 24 cores - it schedules with room. Still deliberately NO cpu limit, so catch-up can burst
              # past two cores.
              cpu: "2"
              memory: 768Mi
            limits:
              memory: 3Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
