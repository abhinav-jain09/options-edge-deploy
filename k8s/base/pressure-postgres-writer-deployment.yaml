apiVersion: apps/v1
kind: Deployment
metadata:
  name: pressure-postgres-writer
  namespace: options-edge
  labels:
    app.kubernetes.io/name: pressure-postgres-writer
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pressure-postgres-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pressure-postgres-writer
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: pressure-postgres-writer
          image: 192.168.100.252:5000/options-edge-pressure-postgres-writer:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
