apiVersion: apps/v1
kind: Deployment
metadata:
  name: databento-mission-pressure-service
  namespace: options-edge
  labels:
    oe.replay/include: "true"
    oe.replay/side-effects: "false"
    oe.replay/topic-remap: "required"
    oe.replay/state: "ephemeral"
    oe.replay/determinism: "event-time"
    app.kubernetes.io/name: databento-mission-pressure-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: databento-mission-pressure-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: databento-mission-pressure-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: databento-mission-pressure
          image: 192.168.100.252:5000/options-edge-databento-mission-pressure:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: HEALTH_PORT
              value: "8098"
            - name: KAFKA_MISSION_PRESSURE_RAW_TOPIC
              value: options.databento.raw
            - name: KAFKA_MISSION_PRESSURE_STRIKE_FLOW_TOPIC
              value: options.databento.strike-flow
            - name: KAFKA_MISSION_PRESSURE_PACE_TOPIC
              value: options.databento.pace.mission
            - name: KAFKA_MISSION_PRESSURE_OUTPUT_TOPIC
              value: options.databento.market-pressure.mission
            - name: KAFKA_MISSION_PRESSURE_STREAMS_APP_ID
              value: options-edge-databento-mission-pressure-v1
            - name: KAFKA_MISSION_PRESSURE_STREAMS_NUM_THREADS
              value: "4"
            - name: KAFKA_MISSION_PRESSURE_OUTPUT_INTERVAL_MS
              value: "1000"
            - name: KAFKA_MISSION_PRESSURE_STALE_AFTER_MS
              value: "15000"
            - name: MISSION_PRESSURE_REQUIRE_DATABENTO_SOURCE
              value: "true"
            - name: MISSION_PRESSURE_ENABLE_PACE
              value: "true"
            - name: MISSION_PRESSURE_ENABLE_GEX
              value: "false"
            - name: MISSION_PRESSURE_ENABLE_PARTICIPANT_FLOW
              value: "false"
            - name: MISSION_PRESSURE_ATM_DISTANCE_POINTS
              value: "5.0"
            - name: MISSION_PRESSURE_NEAR_ATM_DISTANCE_POINTS
              value: "15.0"
            - name: MISSION_PRESSURE_CLUSTER_WIDTH_POINTS
              value: "10.0"
            - name: MISSION_PRESSURE_MAX_RANKED_STRIKES
              value: "75"
            - name: MISSION_PRESSURE_MIN_VOLUME_FOR_ACTIVE_STRIKE
              value: "50"
            - name: MISSION_PRESSURE_FLOW_VS_OI_ACTIVE_RATIO
              value: "0.10"
            - name: MISSION_PRESSURE_PERSISTENCE_WINDOW_MS
              value: "60000"
            - name: MISSION_PRESSURE_MIGRATION_LOOKBACK_MS
              value: "300000"
            - name: MISSION_PRESSURE_DEALER_HEDGE_WEIGHT
              value: "1.0"
            - name: MISSION_PRESSURE_PACE_CONFIRMATION_WEIGHT
              value: "1.0"
            - name: MISSION_PRESSURE_STRIKE_FLOW_CONFIRMATION_WEIGHT
              value: "1.0"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms1g -Xmx4g"
          ports:
            - name: health
              containerPort: 8098
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 5Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
