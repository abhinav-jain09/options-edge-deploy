apiVersion: apps/v1
kind: Deployment
metadata:
  name: options-edge-databento-feed
  namespace: options-edge
  labels:
    app.kubernetes.io/name: options-edge-databento-feed
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: options-edge-databento-feed
  template:
    metadata:
      annotations:
        # Bump to force a pod roll so envFrom picks up changed shared ConfigMap values
        # (k8s does NOT restart pods on ConfigMap change). Set for the 17:30 expiry roll.
        oe/config-nonce: "2026-07-26-es-trades-from-es4-dbp-r32"
      labels:
        app.kubernetes.io/name: options-edge-databento-feed
        app.kubernetes.io/part-of: options-edge
    spec:
      hostNetwork: true
      dnsPolicy: Default
      containers:
        - name: databento-feed
          image: 192.168.100.252:5000/options-edge-databento-feed:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-databento-feed-config
            - secretRef:
                name: options-edge-databento-feed-env
          # Data-freshness liveness knobs (feed monitoring.evaluate_liveness). Explicit here so the
          # /health/live thresholds are tunable via this deployment (edit + service-deploy databento-feed)
          # with no code rebuild — the infra configmap is applied by common-infra-deploy, which is
          # currently blocked by an unrelated guard, so the deployment env is the reliable knob. Values
          # match the code defaults: STALE = restart a RUNNING feed whose last live record is older than
          # this (market open); STARTUP_GRACE = longer window until the first record this process so a
          # restart can't loop. Applies to all envs; add a per-env overlay patch to differ.
          env:
            - name: DATABENTO_FEED_LIVENESS_STALE_SECONDS
              value: "15"
            - name: DATABENTO_FEED_LIVENESS_STARTUP_GRACE_SECONDS
              value: "90"
            # Feed reads SPX ONLY — no SPY (or any other) extra underlying. Set explicitly here (empty
            # = single-symbol; feed config._parse_extra_instruments treats blank as no extras) so it is
            # the RELIABLE, deploy-durable knob: this Deployment env OVERRIDES the configmap's
            # DATABENTO_EXTRA_INSTRUMENTS and is applied by service-deploy (the infra configmap path via
            # common-infra-deploy is currently blocked). The base configmap is also cleared to "" for
            # source hygiene, but this override guarantees SPX-only even if the cluster configmap is stale.
            # Applies to all envs; to re-enable an extra underlying, set the JSON list here (and configmap).
            - name: DATABENTO_EXTRA_INSTRUMENTS
              value: ""
          ports:
            - name: metrics
              containerPort: 8010
          # Data-freshness liveness: /health/live fails when the market is OPEN but no live record
          # has been published within the feed's stale window (a subscribed-but-silent "zombie"
          # Databento session) — Kubernetes then restarts the pod to re-establish the session.
          # /metrics only proved the process was up, so a zombie feed passed forever. Off-hours the
          # check always passes (never restart-loops nights/weekends/holidays). With the feed's 15s
          # in-app stale window, 2 x 15s here => a stalled feed restarts ~45s after data stops (fast
          # recovery) while initialDelaySeconds 45 + 30s still comfortably clears a normal boot+seed.
          livenessProbe:
            httpGet:
              path: /health/live
              port: metrics
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 2
          # Readiness stays on /metrics (process-up): a stale-data window should NOT flap readiness;
          # only liveness (restart) reacts to staleness.
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
