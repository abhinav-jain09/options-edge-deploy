apiVersion: apps/v1
kind: Deployment
metadata:
  name: options-edge-databento-feed
  namespace: options-edge
  labels:
    app.kubernetes.io/name: options-edge-databento-feed
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: options-edge-databento-feed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: options-edge-databento-feed
        app.kubernetes.io/part-of: options-edge
    spec:
      hostNetwork: true
      dnsPolicy: Default
      containers:
        - name: databento-feed
          image: 192.168.100.252:5000/options-edge-databento-feed:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-databento-feed-config
            - secretRef:
                name: options-edge-databento-feed-env
          ports:
            - name: metrics
              containerPort: 8010
          # Data-freshness liveness: /health/live fails when the market is OPEN but no live record
          # has been published within the feed's stale window (a subscribed-but-silent "zombie"
          # Databento session) — Kubernetes then restarts the pod to re-establish the session.
          # /metrics only proved the process was up, so a zombie feed passed forever. Off-hours the
          # check always passes (never restart-loops nights/weekends/holidays). With the feed's 15s
          # in-app stale window, 2 x 15s here => a stalled feed restarts ~45s after data stops (fast
          # recovery) while initialDelaySeconds 45 + 30s still comfortably clears a normal boot+seed.
          livenessProbe:
            httpGet:
              path: /health/live
              port: metrics
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 2
          # Readiness stays on /metrics (process-up): a stale-data window should NOT flap readiness;
          # only liveness (restart) reacts to staleness.
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
