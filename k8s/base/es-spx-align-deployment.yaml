apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-spx-align-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: es-spx-align-service
    app.kubernetes.io/component: es-spx-align-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: es-spx-align-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: es-spx-align-service
        app.kubernetes.io/component: es-spx-align-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: es-spx-align
          image: 192.168.100.252:5000/options-edge-es-spx-align:dev
          imagePullPolicy: Always
          # Runs on the SPX cluster. Aligns ES data types onto SPX strikes via one shared basis truth: the
          # ES-GEX whole-book (live) and ES strike-intelligence signals. Consumes the MM1-mirrored ES bridge
          # topics + the native basis-bearing ES index-price. Shared config provides KAFKA_BOOTSTRAP_SERVERS.
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            # Service master switch (renamed from ES_GEX_ALIGN_ENABLED with the es-gex→es-spx rename; the
            # image still reads the legacy key as a fallback during the transition).
            - name: ES_SPX_ALIGN_ENABLED
              value: "true"
            - name: HEALTH_PORT
              value: "8140"
            # ── GEX data type (live) ─────────────────────────────────────────────────────────────────────
            # Mirrored ES-GEX bridge JSON topic. Byte-copy identity name from the es-gex-mirror Jenkins job
            # (MM1, kafka-mirror-maker) — NOT the old MM2 es4.-prefixed name. Every env mirrors .4 the same way.
            - name: KAFKA_ES_GEX_SPXBRIDGE_MIRRORED_TOPIC
              value: es.options.databento.gex.spxbridge
            # Output: compacted SPX-aligned whole-book.
            - name: KAFKA_ES_GEX_SPX_ALIGNED_TOPIC
              value: options.es-gex-spx-aligned
            # ── strike-intel data type (ENABLED) ─────────────────────────────────────────────────────────
            # Project every ES strike-intelligence signal onto its translated SPX strike (all roles), keyed by
            # the native ES identity, with wall-clock withdrawal (NORMAL marker). Input is the
            # es-strike-intel-mirror MM1 job's byte-copy of es4's es.strike-intelligence-by-strike (identity
            # name, same convention as the GEX bridge). Output options.es-strike-intel-spx-aligned is
            # provisioned compact,delete from the topics.env SSOT AND self-ensured by the service at boot.
            # Prerequisite for live signals: the es-strike-intel-mirror must be running + es4 producing (until
            # then the service idles safely on an empty input). See docs/es-spx-align-cutover-runbook.md.
            - name: ES_SPX_ALIGN_STRIKE_INTEL_ENABLED
              value: "true"
            - name: KAFKA_ES_STRIKE_INTEL_MIRRORED_TOPIC
              value: es.strike-intelligence-by-strike
            - name: KAFKA_ES_STRIKE_INTEL_SPX_ALIGNED_TOPIC
              value: options.es-strike-intel-spx-aligned
            # ── shared ───────────────────────────────────────────────────────────────────────────────────
            # Future-timestamp admission tolerance (AlignProcessor GEX gate + BasisSnapshot validity). The GEX
            # bridge records are produced on es4 and mirrored cross-cluster to the SPX broker; the es4 host
            # clock runs materially AHEAD of the SPX cluster (observed ~5-10s), so every fresh gex.spxbridge
            # record's eventTimeMs lands in the SPX aligner's future. The 2s default (ES_CLOCK_SKEW_MS) then
            # rejects EVERY fresh record as "non-future"-gate-failing -> the book never builds and the ES-gamma
            # overlay stays blank. Widen to 30s (symmetric with the 30s ES_GEX_STALE_MS past-side window) to
            # absorb the es4 skew + drift margin while keeping a bounded, meaningful future guard. The basis is
            # SPX-cluster-native (not skewed), so this only loosens acceptance of the es4-sourced gex stream.
            - name: ES_CLOCK_SKEW_MS
              value: "30000"
            # Basis-bearing ES index-price (native on the SPX cluster); the single basis truth for both types.
            - name: KAFKA_ES_TRADES_TOPIC
              value: underlying.es.trades
            - name: ES_ALIGN_TARGET_SYMBOL
              value: SPX
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx2048m"
          ports:
            - name: health
              containerPort: 8140
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 4Gi
