apiVersion: apps/v1
kind: Deployment
metadata:
  name: raw-to-display-databento-service
  namespace: options-edge
  labels:
    oe.replay/include: "true"
    oe.replay/side-effects: "false"
    oe.replay/topic-remap: "required"
    oe.replay/state: "ephemeral"
    oe.replay/determinism: "event-time"
    app.kubernetes.io/name: raw-to-display-databento-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: raw-to-display-databento-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raw-to-display-databento-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: raw-to-display
          image: 192.168.100.252:5000/options-edge-raw-to-display:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: APP_MARKET_DATA_SOURCE
              value: DATABENTO
            - name: KAFKA_RAW_TOPIC
              value: options.databento.raw
            - name: KAFKA_DISPLAY_TOPIC
              value: options.databento.display
            - name: KAFKA_DISPLAY_VOLUME_TOPIC
              value: options.databento.display.volume.current
            - name: KAFKA_GAMMA_HISTORY_TOPIC
              value: options.databento.display.gamma.history
            - name: KAFKA_DISPLAY_STREAMS_APP_ID
              value: options-flow-display-streams-v8-databento
            - name: KAFKA_DISPLAY_STREAMS_NUM_THREADS
              value: "2"
            - name: KAFKA_DISPLAY_STREAMS_CACHE_MAX_BYTES_BUFFERING
              value: "0"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx1536m"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
