apiVersion: apps/v1
kind: Deployment
metadata:
  name: oi-shadow-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: oi-shadow-service
    app.kubernetes.io/component: oi-shadow-service
    app.kubernetes.io/part-of: options-edge
spec:
  # Publish-once for a session's anchor is enforced IN MEMORY, so it is correct for exactly one
  # replica and not for two. Recreate rather than RollingUpdate for the same reason.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oi-shadow-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oi-shadow-service
        app.kubernetes.io/component: oi-shadow-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: oi-shadow
          image: 192.168.100.252:5000/options-edge-oi-shadow:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: HEALTH_PORT
              value: "8150"
            # OFF until the experiment is deliberately started. Disabled it idles healthy and
            # consumes nothing; the requirement's calendar starts at a NAMED session, so the
            # service must not begin observing merely because it was deployed.
            - name: OI_SHADOW_ENABLED
              value: "false"
            - name: OI_SHADOW_SYMBOL
              value: "SPX"
            # The settled anchor, and the ONLY admissible source of open interest: without a
            # COMPLETE manifest, "the exchange published zero" and "we never saw this leg" cannot
            # be told apart.
            # DECLARED so the Kafka cleanup Job can SEE it. That job builds its authoritative set of
            # live Streams application.ids by scanning workload env for names ending in APP_ID or
            # APPLICATION_ID, and purges internal topics belonging to no active app. An app-id
            # computed inside the process is invisible to that scan, so this service's changelog and
            # repartition topics could be classified as orphaned while it is running. There are no
            # state stores yet, so nothing is at risk today -- which is exactly why it costs nothing
            # to declare now rather than after the calibration loop adds them.
            #
            # oi-shadow-v1 is the value the code already defaults to, so this changes no behaviour;
            # KafkaSettings appends the environment suffix as it does for every other Streams app.
            - name: OI_SHADOW_APP_ID
              value: oi-shadow-v1
            # DECLARED, not defaulted. OiShadowSettings falls back to KafkaSettings.rawTopic(),
            # which is the IBKR topic -- and on dev that topic holds ZERO records while
            # options.databento.raw holds four million. The service came up healthy, joined its
            # consumer group, reported no error, and would have read an empty topic forever.
            #
            # It has to be the Databento topic for a second reason: the anchor manifest below is
            # keyed off the Databento chain, so an IBKR-sourced volume would be matched against
            # anchors it has no relationship to.
            - name: KAFKA_RAW_TOPIC
              value: options.databento.raw
            - name: KAFKA_OI_ANCHOR_MANIFEST_TOPIC
              value: options.databento.oi.anchor-manifest
            - name: KAFKA_OI_SHADOW_TOPIC
              value: options.databento.oi.shadow.by-strike
            # Session bounds and zone. The zone is the SAME key the anchor is keyed in -- a second
            # independently-read zone setting lets a session be identified in one and evaluated in
            # another, and the two only ever disagree in production.
            - name: OI_SHADOW_SESSION_OPEN
              value: "09:30"
            - name: OI_SHADOW_SESSION_CLOSE
              value: "16:00"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx512m"
          ports:
            - name: health
              containerPort: 8150
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
