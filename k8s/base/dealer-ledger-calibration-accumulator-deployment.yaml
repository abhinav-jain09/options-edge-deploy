apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealer-ledger-calibration-accumulator
  namespace: options-edge
  labels:
    app.kubernetes.io/name: dealer-ledger-calibration-accumulator
    app.kubernetes.io/component: dealer-ledger-calibration-accumulator
    app.kubernetes.io/part-of: options-edge
spec:
  # DISABLED until further notice (USER 2026-07-29): completes the dealer-ledger stack shutdown
  # (service + scorer disabled in #646). Re-enable = replicas 1 + generate-service-slices.sh +
  # drop from morning-autostart KEEP_DOWN and dev-cleanup DISABLED_DEV.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dealer-ledger-calibration-accumulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dealer-ledger-calibration-accumulator
        app.kubernetes.io/component: dealer-ledger-calibration-accumulator
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: dealer-ledger-calibration-accumulator
          image: 192.168.100.252:5000/options-edge-dealer-ledger-calibration:dev
          imagePullPolicy: Always
          envFrom:
            # options-edge-config carries POSTGRES_JDBC_URL/USER + KAFKA bootstrap; secrets carry the password.
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            # role select: OutcomeScored -> Postgres (schema `calibration`, EXCLUDED from the nightly wipe)
            # -> CalibrationState. Re-seeds corpus + states from Postgres on start (survives the wipe).
            - name: CALIBRATION_ROLE
              value: accumulator
            - name: HEALTH_PORT
              value: "8080"
            - name: CALIBRATION_OUTCOME_SCORED_TOPIC
              value: dealer-ledger-outcome-scored
            - name: CALIBRATION_STATE_TOPIC
              value: dealer-ledger-calibration-state
            # gate thresholds are SAFETY params (never swept). Defaults are in-code; overridable per env.
            - name: CALIBRATION_PRIMARY_HORIZON
              value: M15
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1024Mi
