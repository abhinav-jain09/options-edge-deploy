apiVersion: apps/v1
kind: Deployment
metadata:
  name: options-edge-redis
  namespace: options-edge
  labels:
    app.kubernetes.io/name: options-edge-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: options-edge-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: options-edge-redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Cache only — the GEX delta overlay. Every key carries a PX TTL (set by the
          # gex-delta-redis-writer) and the classifier's freshness gate is authoritative, so Redis
          # holds no durable state: no RDB/AOF persistence, and allkeys-lru bounds memory. Losing
          # this whole pod degrades the classifier to "no delta enrichment" (fail-open) — never an
          # outage.
          args:
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            - "--maxmemory"
            - "256mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 320Mi
