apiVersion: apps/v1
kind: Deployment
metadata:
  name: spx-mission-control-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: spx-mission-control-service
    app.kubernetes.io/component: mission-control
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spx-mission-control-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spx-mission-control-service
        app.kubernetes.io/component: mission-control
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: spx-mission-control
          image: 192.168.100.252:5000/options-edge-spx-mission-control:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
          env:
            - name: HEALTH_PORT
              value: "8096"
            - name: KAFKA_SPX_MISSION_STRIKE_FLOW_TOPIC
              value: options.databento.strike-flow
            - name: KAFKA_SPX_MISSION_PACE_TOPIC
              value: options.ibkr.pace
            - name: KAFKA_SPX_MISSION_DIRECTIONAL_PRESSURE_TOPIC
              value: options.ibkr.directional-pressure
            - name: KAFKA_SPX_MISSION_SANDWICH_CURRENT_TOPIC
              value: display.volume.sandwich.current
            - name: KAFKA_SPX_MISSION_SANDWICH_ALERTS_TOPIC
              value: display.volume.sandwich.alerts
            - name: KAFKA_SPX_MISSION_PARTICIPANT_FLOW_TOPIC
              value: options.spx.participant-flow
            - name: KAFKA_SPX_MISSION_OUTPUT_TOPIC
              value: options.spx.mission-control.current
            - name: SPX_MISSION_OUTPUT_INTERVAL_MS
              value: "1000"
            - name: SPX_MISSION_STALE_AFTER_MS
              value: "15000"
            - name: SPX_MISSION_ATM_DISTANCE_POINTS
              value: "5.0"
            - name: KAFKA_SPX_MISSION_STREAMS_APP_ID
              value: options-edge-spx-mission-control-v1
            - name: KAFKA_SPX_MISSION_STREAMS_NUM_THREADS
              value: "4"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx1536m"
          ports:
            - name: http
              containerPort: 8096
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
