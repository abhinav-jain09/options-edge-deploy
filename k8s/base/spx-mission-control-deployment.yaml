apiVersion: apps/v1
kind: Deployment
metadata:
  name: spx-mission-control-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: spx-mission-control-service
    app.kubernetes.io/component: mission-control
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spx-mission-control-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spx-mission-control-service
        app.kubernetes.io/component: mission-control
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: spx-mission-control
          image: 192.168.100.252:5000/options-edge-spx-mission-control:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: HEALTH_PORT
              value: "8096"
            - name: KAFKA_SPX_MISSION_STRIKE_FLOW_TOPIC
              value: options.databento.strike-flow
            - name: KAFKA_SPX_MISSION_PACE_TOPIC
              value: options.databento.pace.mission
            - name: KAFKA_SPX_MISSION_PRESSURE_TOPIC
              value: options.databento.market-pressure.mission
            - name: KAFKA_SPX_MISSION_SANDWICH_TOPIC
              value: options.databento.sandwich.mission
            - name: KAFKA_SPX_MISSION_PARTICIPANT_FLOW_TOPIC
              value: options.spx.participant-flow
            - name: KAFKA_SPX_MISSION_OUTPUT_TOPIC
              value: options.spx.mission-control.current
            - name: SPX_MISSION_OUTPUT_INTERVAL_MS
              value: "1000"
            - name: SPX_MISSION_STALE_AFTER_MS
              value: "15000"
            - name: SPX_MISSION_ATM_DISTANCE_POINTS
              value: "5.0"
            - name: KAFKA_SPX_MISSION_STREAMS_APP_ID
              value: options-edge-spx-mission-control-v2
            - name: KAFKA_SPX_MISSION_STREAMS_NUM_THREADS
              value: "4"
            - name: SPX_MISSION_ALLOW_LEGACY_PACE
              value: "false"
            - name: SPX_MISSION_ALLOW_LEGACY_PRESSURE
              value: "false"
            - name: SPX_MISSION_ALLOW_LEGACY_SANDWICH
              value: "false"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx1536m"
            # SPX Mission Control auth (mandatory in EVERY env). The code path
            # MissionAuthSettings.validate() fail-closes when any of the three URIs
            # below is blank; the previous MISSION_AUTH_ENABLED off-switch was
            # deliberately removed by the spx-mission-control Codex security rounds
            # (commits c2608f6 + 01224ab). Without these env vars the container
            # crash-loops on IllegalStateException at startup.
            # Base values point at PROD Keycloak; dev overlay overrides to the local
            # Mac Keycloak (spx-mission-control-dev-env-patch.yaml). Audience matches
            # the gateway/web client (options-edge-web) so a single UI token works.
            - name: MISSION_AUTH_ISSUER_URI
              value: "https://auth.fullfunding.nl/realms/optionsedge"
            - name: MISSION_AUTH_AUDIENCE
              value: "options-edge-web"
            - name: MISSION_AUTH_JWK_SET_URI
              value: "https://auth.fullfunding.nl/realms/optionsedge/protocol/openid-connect/certs"
          ports:
            - name: http
              containerPort: 8096
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
