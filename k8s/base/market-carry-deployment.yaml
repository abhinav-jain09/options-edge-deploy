apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-carry-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: market-carry-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: market-carry-service
  template:
    metadata:
      annotations:
        # Increment only after an intentional source-history reset. This forces a clean
        # emptyDir/state-store pod even when the image digest itself is unchanged.
        optionsedge.io/state-restore-generation: "2"
      labels:
        app.kubernetes.io/name: market-carry-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: market-carry
          image: 192.168.100.252:5000/options-edge-market-carry:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: HEALTH_PORT
              value: "8132"
            - name: MARKET_CARRY_ENABLED
              value: "true"
            - name: MARKET_CARRY_OPTIONS_TOPIC
              value: options.databento.raw
            - name: MARKET_CARRY_SR3_TOPIC
              value: rates.sofr.databento-sr3-feed-service.history
            - name: MARKET_CARRY_CURRENT_TOPIC
              value: market.spx.market-carry-service.current
            - name: MARKET_CARRY_HISTORY_TOPIC
              value: market.spx.market-carry-service.history
            - name: MARKET_CARRY_STREAMS_APP_ID
              value: options-edge-market-carry-service
            - name: MARKET_CARRY_WRITER_ENABLED
              value: "true"
            - name: MARKET_CARRY_EOS_ENABLED
              value: "true"
            # Carry is slow-moving; typical (r, q) drift over 5 minutes is far below single-estimate
            # bid-ask noise, so one snapshot per 5 minutes per (symbol, expiry) is operationally
            # sufficient and lets the service skip the full-chain parity scan on >99% of records.
            # Consumers must keep their staleness gates above this interval
            # (gex: DATABENTO_GEX_DYNAMIC_CARRY_MAX_AGE_MS=660000).
            - name: MARKET_CARRY_MIN_PUBLISH_INTERVAL_MS
              value: "300000"
            # COMMIT INTERVAL BACK TO 100 ms — the code default of 1000 (processing #1193) was
            # MEASURED WORSE on production and is held off here until the real cause is fixed.
            #
            # The reasoning for 1000 was sound on paper: at 100 ms this service opens ~600
            # transactions a minute to publish two records every 300 s, and every commit writes
            # markers. What that reasoning missed is that a longer commit cycle holds a transaction
            # open longer, and the production node is at 98% CPU — so the cycle stretched past
            # transaction.timeout.ms (10 s), the broker fenced the producer, and Streams saw
            # InvalidProducerEpochException -> TaskMigratedException and re-initialised the task,
            # over and over.
            #
            # Measured on 2026-10-19 at an IDENTICAL 10,752 raw records/min on both sides:
            #     100 ms   1.43 warnings per 1000 records,  16.2/min,   0 errors, raw lag single digits
            #   1,000 ms  12.00 warnings per 1000 records, 111.8/min,  45 errors, raw lag 33,592
            # Dev stayed on 100 ms throughout and had no lag at the same volume, which is what
            # isolates this to the interval rather than to the hour or the data.
            #
            # So: the transaction churn is real and still worth removing, but not by this knob alone
            # on a saturated box. Raising transaction.timeout.ms alongside it, or giving production
            # back some CPU headroom, has to come first — and the next attempt gets measured on
            # dev before production, which this one was not.
            - name: MARKET_CARRY_STREAMS_COMMIT_INTERVAL_MS
              value: "100"
            - name: KAFKA_STREAMS_STATE_DIR
              value: /var/lib/options-edge/kafka-streams
            - name: JAVA_TOOL_OPTIONS
              value: -Xms256m -Xmx768m
          ports:
            - name: health
              containerPort: 8132
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: kafka-streams-state
              mountPath: /var/lib/options-edge/kafka-streams
      volumes:
        - name: kafka-streams-state
          emptyDir: {}
