apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-open-direction-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: es-open-direction-service
    app.kubernetes.io/component: es-open-direction-service
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: es-open-direction-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: es-open-direction-service
        app.kubernetes.io/component: es-open-direction-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
        - name: es-open-direction
          image: 192.168.100.252:5000/options-edge-es-open-direction:dev
          imagePullPolicy: Always
          # Shared platform config/secret provide KAFKA_BOOTSTRAP_SERVERS (+ SCHEMA_REGISTRY_URL
          # and the rest of the platform defaults) exactly like every sibling service.
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - name: HEALTH_PORT
              value: "8080"
            # --- input topic (ES trades published by databento-feed; the shared configmap only
            # carries the feed-side HPSF_TOPIC_UNDERLYING_ES_TRADES key, so set the consumer
            # env explicitly like the feed configmap does) ---
            - name: KAFKA_HPSF_ES_TRADES_TOPIC
              value: underlying.es.trades
            # --- output topics ---
            - name: KAFKA_ES_OPEN_DIRECTION_FORECAST_TOPIC
              value: es.open-direction.forecast
            - name: KAFKA_ES_OPEN_DIRECTION_OUTCOME_TOPIC
              value: es.open-direction.outcome
            # --- Postgres: same source as hpsf-postgres-writer (options-edge-config carries
            # POSTGRES_JDBC_URL/USER; options-edge-runtime-secrets carries the password) ---
            - name: ES_OD_PG_URL
              valueFrom:
                configMapKeyRef:
                  name: options-edge-config
                  key: POSTGRES_JDBC_URL
            - name: ES_OD_PG_USER
              valueFrom:
                configMapKeyRef:
                  name: options-edge-config
                  key: POSTGRES_USER
            - name: ES_OD_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: options-edge-runtime-secrets
                  key: POSTGRES_PASSWORD
            # DEV BOOTSTRAP ONLY (design: atrMethod=STATIC_OVERRIDE): lets the service forecast
            # before 5 sessions of ATR history accumulate. Remove once history is in Postgres.
            - name: ATR_STATIC_POINTS
              value: "55"
            # Heap below the container limit so the overnight ES-trade buffer + JVM overhead
            # can't be kernel-OOMKilled (limit 1536Mi).
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx1024m"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          # Buffers a full overnight session of ES trades in memory — mid-size tier (CPU limit
          # intentionally absent, matching every sibling service: the memory limit bounds the
          # one resource a runaway JVM actually exhausts).
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 1536Mi
