apiVersion: v1
kind: Service
metadata:
  name: close-direction-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: close-direction-service
    app.kubernetes.io/component: close-direction-service
    app.kubernetes.io/part-of: options-edge
  annotations:
