apiVersion: v1
kind: Service
metadata:
  name: context-tape-service
  namespace: options-edge
  labels:
    app.kubernetes.io/name: context-tape-service
    app.kubernetes.io/component: context-tape-service
    app.kubernetes.io/part-of: options-edge
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8135"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: context-tape-service
  ports:
    - name: api
      port: 8134
      targetPort: api
    - name: health
      port: 8135
      targetPort: health
