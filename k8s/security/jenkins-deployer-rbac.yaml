apiVersion: v1
kind: Namespace
metadata:
  name: options-edge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: options-edge
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-deployer-token
  namespace: options-edge
  annotations:
    kubernetes.io/service-account.name: jenkins-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer
  namespace: options-edge
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
      - services
      # persistentvolumeclaims required for the Kafka-Streams disk-backed state
      # PVCs (RocksDB persistent stores) the deploy applies — without this,
      # `apply -k` fails on the first PVC with a forbidden error.
      - persistentvolumeclaims
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources:
      - serviceaccounts
    # Full mgmt needed because services (e.g. hpsf-replay-orchestrator) own a per-service SA
    # bound to a per-service namespaced Role; without create/update/delete the apply -k aborts
    # the moment a Deployment that references a new SA + Role + RoleBinding lands.
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
    # Per-service namespaced RBAC (e.g. hpsf-replay-orchestrator needs to read live deployment
    # specs / pod status to clone the live HPSF Stage A/B per-run). Cluster-wide perms are not
    # needed and are not granted here — the new Roles are themselves namespace-scoped.
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - pods/portforward
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - deployments/scale
      - statefulsets
      - statefulsets/scale
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: options-edge
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: options-edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: options-edge-jenkins-deployer-namespace
rules:
  - apiGroups: [""]
    resources:
      - namespaces
    resourceNames:
      - options-edge
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: options-edge-jenkins-deployer-namespace
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: options-edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: options-edge-jenkins-deployer-namespace
