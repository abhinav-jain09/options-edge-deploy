apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: options-edge-jenkins-only-workloads
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources:
          - configmaps
          - secrets
          - serviceaccounts
          - services
          # PVCs back the Kafka-Streams disk-backed state stores (RocksDB
          # SST files). Gated same as the other workload resources: only
          # the jenkins-deployer SA may CREATE/UPDATE/DELETE them.
          - persistentvolumeclaims
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources:
          - daemonsets
          - deployments
          - deployments/scale
          - statefulsets
          - statefulsets/scale
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources:
          - cronjobs
          - jobs
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources:
          - ingresses
          - networkpolicies
  validations:
    # Allow the Jenkins deployer, AND the Kubernetes system principals that MUST mutate these resources for
    # the cluster to function. In particular: with PersistentVolumeClaims now gated, a WaitForFirstConsumer
    # StorageClass requires system:kube-scheduler to patch/bind the PVC during pod scheduling, and the
    # kube-controller-manager / kube-system controllers (e.g. the PV binder) to manage binding. Without this
    # exemption the scheduler's PVC bind is denied -> PVC stays Pending -> the pod never schedules (the
    # Streams pods deadlock). Human/app (non-system, non-deployer) workload changes remain blocked.
    - expression: >-
        request.userInfo.username == 'system:serviceaccount:options-edge:jenkins-deployer'
        || request.userInfo.username == 'system:kube-scheduler'
        || request.userInfo.username == 'system:kube-controller-manager'
        || request.userInfo.username.startsWith('system:serviceaccount:kube-system:')
        || request.userInfo.username.startsWith('system:node:')
      message: "OptionsEdge Kubernetes workload changes are blocked unless they run through the Jenkins deployer ServiceAccount."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: options-edge-jenkins-only-workloads
spec:
  policyName: options-edge-jenkins-only-workloads
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        options-edge/deploy-guard: jenkins-only
