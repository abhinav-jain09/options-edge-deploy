apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: options-edge-jenkins-only-workloads
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources:
          - configmaps
          - secrets
          - serviceaccounts
          - services
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources:
          - daemonsets
          - deployments
          - deployments/scale
          - statefulsets
          - statefulsets/scale
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources:
          - cronjobs
          - jobs
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources:
          - ingresses
          - networkpolicies
  validations:
    - expression: "request.userInfo.username == 'system:serviceaccount:options-edge:jenkins-deployer'"
      message: "OptionsEdge Kubernetes workload changes are blocked unless they run through the Jenkins deployer ServiceAccount."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: options-edge-jenkins-only-workloads
spec:
  policyName: options-edge-jenkins-only-workloads
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        options-edge/deploy-guard: jenkins-only
