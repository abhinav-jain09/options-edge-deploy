# Hard budget for the tenant: 2 CPU and 2 GiB, as specified by Abhinav.
#
# Memory is requested AND limited at the same 2Gi, deliberately: the space can never consume
# more than 2 GiB, so it cannot push the node into memory pressure and cause kubelet to evict
# options-edge pods. Node feasibility was checked against this figure — the trading stack's
# measured requests are 38.97Gi of the node's 62.23Gi, so 2Gi fits with margin.
#
# CPU is requested at 1 and limited at 2. The asymmetry is deliberate and load-bearing: under
# contention the Linux CFS share of a cgroup derives from `requests.cpu`, NOT from limits. A
# small request is therefore what protects options-edge's CPU share; the limit only bounds the
# burst. options-edge itself sets no CPU limits anywhere (verified: 0 of 55 deployments) and
# must keep it that way.
#
# services.loadbalancers/nodeports are ZERO on purpose. k3s LoadBalancer Services bind host
# ports through klipper, and host ports are already contested on this box (8091 is held by a
# Docker container while a k3s Service also claims it; that svclb pod has restarted 24 times).
# The tenant reaches the outside world through the traefik Ingress only.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: fullfunding-quota
  namespace: fullfunding
spec:
  hard:
    requests.cpu: "1"
    limits.cpu: "2"
    requests.memory: 2Gi
    limits.memory: 2Gi
    # Ephemeral storage is on `/` (kubelet's nodefs), which has only ~37 GiB free. Kept to a
    # token allowance: with disk-medium emptyDir denied (see validating-policy.yaml) and all
    # real state on PVCs, nothing legitimate should be written there.
    requests.ephemeral-storage: 256Mi
    limits.ephemeral-storage: 1Gi
    pods: "12"
    persistentvolumeclaims: "4"
    requests.storage: 40Gi
    count/services: "6"
    count/secrets: "12"
    count/configmaps: "12"
    count/cronjobs.batch: "4"
    count/jobs.batch: "12"
    services.loadbalancers: "0"
    services.nodeports: "0"
