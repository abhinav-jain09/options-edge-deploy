# Default-deny both directions, then a narrow allowlist.
#
# The point is not to defend against a hostile deployer (the tenant ships through the same
# main-only Jenkins path as options-edge). It is to stop an accident in the new application from
# reaching the trading platform's data plane. In particular the host runs Kafka (9092/9093),
# Postgres (5432), Schema Registry (8081), AKHQ (8082), the internal Bugzilla (8092) and the
# image registry (5000) OUTSIDE Kubernetes, on the node's own IP — a namespace alone gives no
# protection from any of them, which is exactly why egress is denied by default here.
#
# NOTE: egress to the node's own IP is a known weak spot in some CNIs. Before any real workload
# is trusted in this namespace, verify from a throwaway pod that 192.168.100.252 on 9092, 5432,
# 8081, 8082, 8092 and 5000 all FAIL to connect. If any of them succeeds, this policy is not
# providing the protection it appears to.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: fullfunding
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: fullfunding
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        # BOTH protocols: a rule that omits `protocol` defaults to TCP only, and DNS is UDP first.
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-within-namespace
  namespace: fullfunding
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tenant: fullfunding
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              tenant: fullfunding
---
# Public traffic: traefik -> the tenant's web pod, on the web port only.
# Applied by label so the web workload can be added later without touching this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-web
  namespace: fullfunding
spec:
  podSelector:
    matchLabels:
      fullfunding.io/public: "web"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: TCP, port: 8080 }
---
# The application service -> Postgres, on 5432 only.
#
# Written as a pair of policies keyed on labels so the service can be added later without
# touching this file: the service carries `fullfunding.io/role: app`, the database carries
# `app.kubernetes.io/component: database`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-postgres
  namespace: fullfunding
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: database
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              fullfunding.io/role: app
      ports:
        - { protocol: TCP, port: 5432 }
