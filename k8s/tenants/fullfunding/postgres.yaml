# Postgres for the fullfunding application — the database for the service being developed.
#
# Modelled directly on k8s/keycloak/keycloak-postgres.yaml, which is the proven-working shape on
# this cluster. Two things are copied from it deliberately, not by habit:
#
#  1. TWO Services. This cluster's overlay does NOT route pod-IP-to-pod-IP traffic (verified in
#     the Keycloak manifest: pod->ClusterIP works via kube-proxy DNAT, pod->pod-IP fails). A
#     headless Service hands the client a raw pod IP — the broken path — so the application MUST
#     connect through the ClusterIP Service `fullfunding-postgres-db`, never the headless one.
#     The headless Service exists only as the StatefulSet's governing Service.
#  2. PGDATA in a SUBDIRECTORY of the mount. Postgres refuses to initialise into a non-empty
#     mount root, and some volumes arrive with lost+found.
#
# Durability: StatefulSet + volumeClaimTemplate, so data is on disk and survives pod restarts.
# local-path is node-affine and this is a single-node cluster; a PVC protects against pod loss,
# NOT against deletion or corruption. A pg_dump CronJob is a follow-up, not included here.
apiVersion: v1
kind: Service
metadata:
  name: fullfunding-postgres
  namespace: fullfunding
  labels:
    app.kubernetes.io/name: fullfunding-postgres
    app.kubernetes.io/part-of: fullfunding
    app.kubernetes.io/component: database
spec:
  clusterIP: None          # headless — governing Service for the StatefulSet only
  selector:
    app.kubernetes.io/name: fullfunding-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# The Service the application connects to. Use THIS one.
apiVersion: v1
kind: Service
metadata:
  name: fullfunding-postgres-db
  namespace: fullfunding
  labels:
    app.kubernetes.io/name: fullfunding-postgres
    app.kubernetes.io/part-of: fullfunding
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fullfunding-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fullfunding-postgres
  namespace: fullfunding
  labels:
    app.kubernetes.io/name: fullfunding-postgres
    app.kubernetes.io/part-of: fullfunding
    app.kubernetes.io/component: database
spec:
  serviceName: fullfunding-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fullfunding-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fullfunding-postgres
        app.kubernetes.io/part-of: fullfunding
        app.kubernetes.io/component: database
    spec:
      priorityClassName: fullfunding-low
      # NOTE: unlike the options-edge namespace, `fullfunding` enforces Pod Security Admission at
      # `restricted`, so the pod must declare non-root identity, dropped capabilities and a seccomp
      # profile explicitly. The official postgres image supports running as the postgres uid
      # directly (it normally drops from root via gosu); fsGroup makes the mounted volume writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # postgres
        runAsGroup: 999
        fsGroup: 999            # so the mounted volume is writable
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Same digest-pinned image the Keycloak database already runs on this node, so the layer
          # is present locally and the version is one that is known to work here.
          image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: fullfunding
            - name: POSTGRES_USER
              value: fullfunding
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fullfunding-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U fullfunding -d fullfunding"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U fullfunding -d fullfunding"]
            initialDelaySeconds: 30
            periodSeconds: 20
          # Sized for the namespace's 2 CPU / 2 GiB budget, leaving ~1.2 GiB and 1.5 CPU for the
          # application service. Requests are deliberately modest: a data-entry workload spends
          # most of its time idle.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 500m
              memory: 768Mi
              ephemeral-storage: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        # Named explicitly — the namespace's admission policy requires it, because the class
        # decides which disk the data lands on. `local-path`'s provisioner root is
        # /home/options-edge/data/k3s/storage, i.e. on /home, NEVER on the root filesystem.
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
