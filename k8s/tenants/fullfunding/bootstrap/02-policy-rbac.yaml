# Supplement to the built-in `admin` ClusterRole, which deliberately EXCLUDES ResourceQuota and
# LimitRange (Kubernetes treats them as cluster policy, not namespace administration) and forbids
# creating a Role that grants permissions the creator does not itself hold.
#
# Both are granted here, scoped to the tenant namespace by the RoleBinding below — nothing widens
# outside fullfunding. `escalate`/`bind` are real privileges, but bounded to a namespace where the
# deployer already holds `admin`, so they add no reach it does not effectively have.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fullfunding-tenant-policy
rules:
  - apiGroups: [""]
    resources: [resourcequotas, resourcequotas/status, limitranges]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete, bind, escalate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer-tenant-policy
  namespace: fullfunding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fullfunding-tenant-policy
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: options-edge
