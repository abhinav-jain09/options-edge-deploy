# Backstop, not the sizing method: production manifests declare their own requests and limits.
# This exists so a workload that forgets them still lands inside the budget instead of becoming
# BestEffort (which would make it the node's first OOM victim) or unbounded.
#
# `max` is set below the namespace quota so no single container can consume the whole space.
apiVersion: v1
kind: LimitRange
metadata:
  name: fullfunding-defaults
  namespace: fullfunding
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
        ephemeral-storage: 64Mi
      default:
        cpu: 250m
        memory: 384Mi
        ephemeral-storage: 128Mi
      max:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 256Mi
