# Production identity provider (Keycloak) — a self-contained kustomize component referenced ONLY by the
# production overlay (k8s/overlays/production), never by base. Dev uses the docker Keycloak on :8089, so dev
# deploys must not get these prod-hostname manifests. See docs/keycloak-prod.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - keycloak-realm-configmap.yaml
  - keycloak-postgres.yaml
  - keycloak-deployment.yaml
  - keycloak-ingress.yaml
