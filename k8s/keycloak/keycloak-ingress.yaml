# Internal routing for Keycloak: the Cloudflare tunnel forwards auth.fullfunding.nl to the prod node's
# traefik (k3s built-in ingress controller) on :80, and this Ingress routes Host=auth.fullfunding.nl to the
# oe-keycloak ClusterIP Service. No TLS is configured here — TLS terminates at Cloudflare's edge; the
# tunnel -> traefik -> Keycloak hops are in-cluster HTTP and Keycloak trusts X-Forwarded-* (KC_PROXY_HEADERS).
#
# Why an Ingress and not a LoadBalancer on a host port: keeping Keycloak as a ClusterIP behind traefik means
# Keycloak is never directly reachable on the LAN, so a LAN client cannot bypass Cloudflare and spoof the
# X-Forwarded-* headers Keycloak trusts.
#
# SELF-PROTECTING ADMIN BLOCK: this Ingress only routes the public OIDC login surface — `/realms/optionsedge`
# (discovery, token, login-actions, account) and `/resources` (login theme assets). It deliberately does NOT
# route `/` , so the admin console (`/admin`), the admin REST API (`/admin/realms/...`), and the master realm
# (`/realms/master`) have NO route and traefik returns 404 — the k8s config blocks admin on its own, without
# depending on the cloudflared rules. The cloudflared `/admin` + `/realms/master` 404 rules (docs/keycloak-prod.md)
# are kept as belt-and-suspenders at the public edge. Admin is performed in-cluster via kcadm.sh / port-forward.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oe-keycloak
  namespace: options-edge
  labels:
    app.kubernetes.io/name: oe-keycloak
    app.kubernetes.io/part-of: options-edge
    app.kubernetes.io/component: auth
spec:
  ingressClassName: traefik
  rules:
    - host: auth.fullfunding.nl
      http:
        paths:
          # Public OIDC endpoints for the optionsedge realm only (NOT /realms/master).
          - path: /realms/optionsedge
            pathType: Prefix
            backend:
              service:
                name: oe-keycloak
                port:
                  number: 8080
          # Login theme CSS/JS and other static assets the login page references.
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: oe-keycloak
                port:
                  number: 8080
