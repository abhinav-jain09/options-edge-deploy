# LEGACY in-cluster routing for Keycloak. This Ingress was the intended public path (tunnel -> traefik
# :80 -> ClusterIP), but traefik :80 proved broken on this cluster, so the LIVE public path bypasses it:
# the cloudflared tunnel targets the oe-keycloak ClusterIP directly (see the canonical tunnel file
# infra/prod/cloudflared/options-edge-stable.yml). The Ingress is kept as an in-cluster routing
# definition only; its admin-path filtering is NOT the operative control — the cloudflared edge 404
# rules are (they cover every public auth hostname, both domains during the migration). No TLS here —
# TLS terminates at Cloudflare's edge; Keycloak trusts X-Forwarded-* (KC_PROXY_HEADERS).
#
# ADMIN-PATH FILTERING (legacy, non-operative): this Ingress routes only `/realms/optionsedge` +
# `/resources`, so traffic that DID flow through traefik would find no route to /admin or
# /realms/master. But the live public path bypasses traefik entirely (see header), so this filter
# protects nothing today — the cloudflared edge 404 rules are the operative admin block, and the
# LAN admin console is intentionally reachable at the oe-keycloak-lan LoadBalancer (:8089). Kept
# because it is harmless, and correct if traffic is ever moved back onto traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oe-keycloak
  namespace: options-edge
  labels:
    app.kubernetes.io/name: oe-keycloak
    app.kubernetes.io/part-of: options-edge
    app.kubernetes.io/component: auth
spec:
  ingressClassName: traefik
  rules:
    # Only the live public auth hostname. auth.fullfunding.nl was retired 2026-08-08 (Phase 3).
    - host: auth.bleadingoptions.com
      http:
        paths:
          - path: /realms/optionsedge
            pathType: Prefix
            backend:
              service:
                name: oe-keycloak
                port:
                  number: 8080
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: oe-keycloak
                port:
                  number: 8080
