apiVersion: v1
kind: ConfigMap
metadata:
  name: options-edge-config
  namespace: options-edge
data:
  APP_PROFILE: prod
  TOPIC_PREFIX: ""
  KAFKA_APPLICATION_ID_SUFFIX: -prod
  SCHEMA_REGISTRY_URL: http://192.168.100.252:8082
  APP_MARKET_DATA_SOURCE: DATABENTO
  APP_FEED_GATEWAY_ENABLED: "true"
  APP_FEED_GATEWAY_WS_URL: ws://192.168.100.252:30097/ws/events
  APP_WEB_PORT: "8091"
  IB_HOST: 127.0.0.1
  IB_PORT: "4001"
  IB_CLIENT_ID: "212"
  IB_SYMBOL: SPX
  IB_EXPIRY: ""
  IB_CURRENCY: USD
  IB_UNDERLYING_EXCHANGE: CBOE
  IB_OPTION_EXCHANGE: SMART
  IB_TRADING_CLASS: SPXW
  IB_MULTIPLIER: "100"
  IB_MAX_STRIKES: "43"
  IB_USE_DELAYED_DATA: "true"
  IB_GENERIC_TICKS: 100,101,104,106
  # VIX-only: skip the SPX underlying + option-chain subscriptions and publish only
  # underlying.vix.price. We only want VIX from IBKR (SPX chain/spot come from Databento).
  # ibkr-feed runs on prod only; dev stays scaled to 0 and gets VIX via the prod->dev bridge.
  IBKR_CHAIN_ENABLED: "false"
  IBKR_VIX_PRICE_ENABLED: "true"
  IBKR_VIX_SYMBOL: VIX
  IBKR_VIX_EXCHANGE: CBOE
  KAFKA_BOOTSTRAP_SERVERS: 192.168.100.252:9092
  KAFKA_SCHEMA_REGISTRY_URL: http://192.168.100.252:8082
  KAFKA_BROKER_COUNT: "1"
  KAFKA_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TOPIC_MIN_IN_SYNC_REPLICAS: "1"
  KAFKA_TOPIC_RETENTION_MS: "43200000"
  # Platform-wide 12h retention cap (2026-07-08). create-hpsf-topics.sh / verify-hpsf-topics.sh cap EVERY
  # topic's retention.ms at this value on create AND alter, so the per-topic 2d/7d/30d defaults (market-flow,
  # underlying-state, latest-signal, strike-flow/score) are all forced to <= 12h in every environment.
  # WHY 12h: the market session is ~6.5h and the overnight gap is ~17h > 12h, so each session's data
  # self-expires before the next open — this is what lets us retire the nightly Kafka wipe (see
  # offhours-clean-slate.sh WIPE_KAFKA=false). Compacted system topics (_schemas, __consumer_offsets)
  # ignore time retention and are unaffected. NOTE: this caps deploy-managed topics only; the external
  # Kafka brokers' log.retention.ms (43200000) is set separately on the broker hosts as the belt-and-braces
  # default for any topic WITHOUT a per-topic override.
  KAFKA_MAX_RETENTION_MS: "43200000"
  KAFKA_TOPIC_CLEANUP_POLICY: delete
  KAFKA_TOPIC_PARTITIONS_DEFAULT: "32"
  KAFKA_STREAMS_INTERNAL_RETENTION_MS: "43200000"
  KAFKA_STREAMS_INTERNAL_SEGMENT_MS: "3600000"
  KAFKA_CHANGELOG_RETENTION_MS: "43200000"
  KAFKA_CHANGELOG_DELETE_RETENTION_MS: "3600000"
  KAFKA_CHANGELOG_MIN_CLEANABLE_DIRTY_RATIO: "0.01"
  KAFKA_STREAMS_STORE_TYPE: persistent
  KAFKA_CONTROL_TOPIC_PARTITIONS: "1"
  HPSF_ENABLED: "true"
  HPSF_TOPOLOGY_ENABLED: "false"
  HPSF_MODE: LIVE_SIGNAL_ONLY
  HPSF_SCHEMA_VERSION: "2"
  HPSF_ALGORITHM_VERSION: HPSF_V2.1
  HPSF_CONFIG_VERSION: hpsf-v2.1-dev
  HPSF_MARKET_HOLIDAYS: 2026-01-01,2026-01-19,2026-02-16,2026-04-03,2026-05-25,2026-06-19,2026-07-03,2026-09-07,2026-11-26,2026-12-25
  HPSF_MARKET_EARLY_CLOSES: 2026-11-27=13:00:00,2026-12-24=13:00:00
  HPSF_STREAMS_REPLICATION_FACTOR: "2"
  HPSF_STREAMS_NUM_STANDBY_REPLICAS: "0"
  HPSF_STREAMS_STATE_DIR: /home/options-edge/data/kafka-streams/hpsf
  HPSF_STREAMS_AUTO_OFFSET_RESET: latest
  HPSF_STATE_STORE_TYPE: persistent
  HPSF_STATE_CHANGELOG_ENABLED: "true"
  HPSF_STATE_STRIKE_CURRENT_STORE_NAME: strike-current-state-store
  HPSF_STATE_STRIKE_BUCKET_STORE_NAME: strike-bucket-state-store
  HPSF_STATE_ACTIVE_STRIKES_STORE_NAME: active-strikes-store
  HPSF_STATE_CHAIN_SNAPSHOT_STORE_NAME: hpsf-chain-snapshot-store
  HPSF_STATE_BUCKET_MAX_AGE_MS: "1200000"
  HPSF_TOPIC_OPRA_TCBBO: options.opra.tcbbo
  HPSF_TOPIC_OPRA_TRADES: options.opra.trades
  HPSF_TOPIC_OPRA_QUOTES: options.opra.quotes
  HPSF_TOPIC_UNDERLYING_ES_TRADES: underlying.es.trades
  HPSF_TOPIC_UNDERLYING_SPX_PRICE: underlying.spx.price
  HPSF_TOPIC_UNDERLYING_STATE: options.hpsf.underlying-state
  HPSF_TOPIC_MARKET_FLOW: options.hpsf.market-flow
  HPSF_TOPIC_STRIKE_FLOW: options.hpsf.strike-flow
  HPSF_TOPIC_STRIKE_SCORE: options.hpsf.strike-score
  HPSF_TOPIC_LATEST_SIGNAL: options.hpsf.latest-signal
  HPSF_TOPIC_SIGNAL: options.hpsf.signal
  HPSF_TOPIC_AUDIT: options.hpsf.audit
  HPSF_TOPIC_DLQ: options.hpsf.dlq
  HPSF_TOPIC_WRITER_DLQ: options.hpsf.writer-dlq
  HPSF_TOPIC_EXIT_SIGNAL: options.hpsf.exit-signal
  HPSF_POSTGRES_WRITER_ENABLED: "true"
  HPSF_POSTGRES_WRITER_GROUP_ID: options-hpsf-postgres-writer-v1
  HPSF_POSTGRES_WRITER_AUTO_OFFSET_RESET: earliest
  HPSF_POSTGRES_WRITER_TOPICS: options.hpsf.signal,options.hpsf.latest-signal,options.hpsf.audit,options.hpsf.market-flow,options.hpsf.strike-score,options.hpsf.dlq,options.hpsf.writer-dlq,options.hpsf.exit-signal
  HPSF_ORDER_PLACEMENT_ENABLED: "false"
  ORDER_PLACEMENT_ENABLED: "false"
  KAFKA_SPX_MISSION_STRIKE_FLOW_TOPIC: options.databento.strike-flow
  KAFKA_SPX_MISSION_PACE_TOPIC: options.databento.pace.mission
  KAFKA_SPX_MISSION_PRESSURE_TOPIC: options.databento.market-pressure.mission
  KAFKA_SPX_MISSION_SANDWICH_TOPIC: options.databento.sandwich.mission
  KAFKA_SPX_MISSION_PARTICIPANT_FLOW_TOPIC: options.spx.participant-flow
  KAFKA_SPX_MISSION_OUTPUT_TOPIC: options.spx.mission-control.current
  KAFKA_SPX_MISSION_STREAMS_APP_ID: options-edge-spx-mission-control-v2
  KAFKA_SPX_MISSION_MAX_CHANGELOG_BYTES: "4194304"
  SPX_MISSION_ALLOW_LEGACY_PACE: "false"
  SPX_MISSION_ALLOW_LEGACY_PRESSURE: "false"
  SPX_MISSION_ALLOW_LEGACY_SANDWICH: "false"
  SPX_MISSION_OUTPUT_INTERVAL_MS: "1000"
  SPX_MISSION_STALE_AFTER_MS: "15000"
  SPX_MISSION_ATM_DISTANCE_POINTS: "5.0"
  STRIKE_FLOW_SOURCE: DATABENTO
  KAFKA_STRIKE_FLOW_INPUT_TOPIC: options.opra.tcbbo
  KAFKA_STRIKE_FLOW_OUTPUT_TOPIC: options.databento.strike-flow
  KAFKA_STRIKE_FLOW_STREAMS_APP_ID: options-edge-databento-strike-flow-classifier-v3
  KAFKA_DATABENTO_STRIKE_FLOW_TOPIC: options.databento.strike-flow
  KAFKA_IBKR_STRIKE_FLOW_TOPIC: options.ibkr.strike-flow
  STRIKE_FLOW_ENABLED: "true"
  STRIKE_FLOW_SYMBOL: SPX
  STRIKE_FLOW_EXPIRY: ""
  STRIKE_FLOW_OUTPUT_INTERVAL_MS: "500"
  STRIKE_FLOW_STATE_TTL_MS: "86400000"
  STRIKE_FLOW_PRICE_EPSILON: "0.0001"
  STRIKE_FLOW_BIAS_RATIO: "1.20"
  STRIKE_FLOW_TOP_N: "3"
  STRIKE_FLOW_CONTRACT_MULTIPLIER: "100.0"
  KAFKA_MARKET_DATA_SELECTION_TOPIC: options.marketdata.selection
  KAFKA_DATABENTO_CONTROL_TOPIC: options.databento.control
  KAFKA_DATABENTO_EVENTS_TOPIC: options.databento.events.raw
  KAFKA_DATABENTO_SNAPSHOT_TOPIC: options.databento.raw
  KAFKA_DATABENTO_NORMALIZED_TOPIC: options.databento.normalized
  KAFKA_RAW_TOPIC: options.ibkr.raw
  KAFKA_RAW_IBKR_TOPIC: options.ibkr.raw
  KAFKA_DISPLAY_TOPIC: options.ibkr.display
  KAFKA_DISPLAY_VOLUME_TOPIC: options.ibkr.display.volume.current
  KAFKA_GAMMA_HISTORY_TOPIC: options.ibkr.display.gamma.history
  KAFKA_PACE_TOPIC: options.ibkr.pace
  KAFKA_DIRECTIONAL_PRESSURE_TOPIC: options.ibkr.directional-pressure
  KAFKA_VOLUME_SANDWICH_CURRENT_TOPIC: options.ibkr.volume-sandwich.current
  KAFKA_VOLUME_SANDWICH_ALERTS_TOPIC: options.ibkr.volume-sandwich.alerts
  KAFKA_IBKR_DISPLAY_TOPIC: options.ibkr.display
  KAFKA_IBKR_DISPLAY_VOLUME_TOPIC: options.ibkr.display.volume.current
  KAFKA_IBKR_PACE_TOPIC: options.ibkr.pace
  KAFKA_IBKR_DIRECTIONAL_PRESSURE_TOPIC: options.ibkr.directional-pressure
  KAFKA_IBKR_VIX_PRICE_TOPIC: underlying.vix.price
  KAFKA_IBKR_VOLUME_SANDWICH_CURRENT_TOPIC: options.ibkr.volume-sandwich.current
  KAFKA_IBKR_VOLUME_SANDWICH_ALERTS_TOPIC: options.ibkr.volume-sandwich.alerts
  KAFKA_DATABENTO_DISPLAY_TOPIC: options.databento.display
  KAFKA_DATABENTO_DISPLAY_VOLUME_TOPIC: options.databento.display.volume.current
  KAFKA_DATABENTO_PACE_TOPIC: options.databento.pace
  KAFKA_DATABENTO_DIRECTIONAL_PRESSURE_TOPIC: options.databento.directional-pressure
  KAFKA_DATABENTO_VOLUME_SANDWICH_CURRENT_TOPIC: options.databento.volume-sandwich.current
  KAFKA_DATABENTO_VOLUME_SANDWICH_ALERTS_TOPIC: options.databento.volume-sandwich.alerts
  # -v2: see databento-volume-aggregator-deployment.yaml — fresh namespace so the redeploy-resets-volume
  # fix lands without a manual Kafka reset. Keep in sync with the deployment env of the same name.
  KAFKA_DATABENTO_VOLUME_AGGREGATOR_APP_ID: options-flow-databento-volume-aggregator-v2
  KAFKA_UNUSUAL_WHALES_GEX_TOPIC: options.ibkr.unusualwhales.gex.strike
  KAFKA_UNUSUAL_WHALES_GEX_HISTORY_TOPIC: options.ibkr.unusualwhales.gex.strike.history
  KAFKA_IBKR_UNUSUAL_WHALES_GEX_TOPIC: options.ibkr.unusualwhales.gex.strike
  KAFKA_IBKR_UNUSUAL_WHALES_GEX_HISTORY_TOPIC: options.ibkr.unusualwhales.gex.strike.history
  KAFKA_UNUSUAL_WHALES_GEX_HISTORY_STREAMS_APP_ID: options-flow-uw-gex-history-streams-v1
  KAFKA_UNUSUAL_WHALES_GEX_HISTORY_STREAMS_NUM_THREADS: "1"
  KAFKA_STREAMS_STATE_DIR: /var/lib/options-edge/kafka-streams
  UNUSUAL_WHALES_ENABLED: "true"
  UNUSUAL_WHALES_BASE_URL: https://api.unusualwhales.com
  UNUSUAL_WHALES_POLL_SECONDS: "60"
  UNUSUAL_WHALES_STALE_AFTER_MS: "90000"
  UNUSUAL_WHALES_SYMBOL: SPX
  UNUSUAL_WHALES_EXPIRY: ""
  UNUSUAL_WHALES_CONTROL_GROUP_ID: unusual-whales-gex-service-control
  UNUSUAL_WHALES_QUIET_HOURS_ENABLED: "true"
  UNUSUAL_WHALES_QUIET_START: "22:00"
  UNUSUAL_WHALES_QUIET_END: "02:00"
  UNUSUAL_WHALES_QUIET_ZONE: Europe/Amsterdam
  UNUSUAL_WHALES_WEEKEND_PAUSE_ENABLED: "false"
  UNUSUAL_WHALES_ES_CALENDAR_PAUSE_ENABLED: "true"
  UNUSUAL_WHALES_ES_SESSION_ZONE: America/New_York
  UNUSUAL_WHALES_ES_FULL_CLOSE_DATES: ""
  UNUSUAL_WHALES_ES_EARLY_CLOSES: ""
  POSTGRES_ENABLED: "true"
  POSTGRES_JDBC_URL: jdbc:postgresql://192.168.100.252:5432/options_flow
  POSTGRES_USER: options_flow
  # Let raw-postgres-writer self-migrate its table on startup (idempotent ADD COLUMN IF NOT EXISTS) so the
  # additive spot-SSOT columns (canonical_spot, spot_event_time_ns, feed_epoch_id, epoch_seq, ...) are
  # added without a manual DBA step. Platform is self-managed (no DBA) in every env; the migrations are
  # additive/non-destructive. Without this the writer crash-loops on the missing canonical_spot column.
  RAW_POSTGRES_WRITER_ENSURE_SCHEMA_ON_START: "true"
  PACE_POSTGRES_BACKFILL_ENABLED: "true"
  POSTGRES_RAW_AUTO_OFFSET_RESET: earliest
  POSTGRES_DIRECTIONAL_PRESSURE_AUTO_OFFSET_RESET: earliest
  DIRECTIONAL_PRESSURE_THRESHOLDS_ENABLED: "true"
  DIRECTIONAL_PRESSURE_OI_BASELINE_BACKFILL_ENABLED: "true"
  WEB_BASE_URL: http://192.168.100.252:8090
  GATEWAY_WS_URL: ws://192.168.100.252:30097/ws/events
  GATEWAY_CACHE_TTL_MS: "21600000"
  CHECK_MARKET_DATA_SOURCES: DATABENTO
  EXPECTED_MAX_STRIKES: "43"
  MIN_OPTION_ROWS: "1"
  MONITOR_ENABLED: "false"
  MONITOR_INTERVAL_MS: "30000"
  WEBSOCKET_WAIT_MS: "60000"
