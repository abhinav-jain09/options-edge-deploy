  namespace: options-edge
  labels:
    app.kubernetes.io/component: kafka-streams-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # 100Gi to match the live claim and the 5 sibling streams-state PVCs. PVC size
      # is immutable except growth on a bound claim, so a manifest value below the
      # live 100Gi makes `kubectl apply -k` fail closed ("spec is immutable") and
      # aborts the monolithic deploy. Keep in lockstep with reality.
      storage: 100Gi
---
# 2026-08-27: option-price-behavior-service was the last large stateful Streams app still on
# emptyDir. emptyDir dies with the pod, so every scale-to-0 and every pod replacement destroyed
# its RocksDB stores and forced a full rebuild from 7.8 GB of changelogs on 4 threads - restoring
# ~1.24M aggregate records from one partition and ~575k surface records per active partition
# before it could process anything. That rebuild, not market activity, is what put this pod at
# 2.2-2.8 cores after every restart and drove the box to load 66-108 on a bring-up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: option-price-behavior-service-streams-state
  namespace: options-edge
  labels:
    app.kubernetes.io/component: kafka-streams-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
---
# option-pressure-state-service: both engines keep persistent RocksDB stores (one snapshot per
# store, plus the one-second blocks held for the longest rolling horizon). Far smaller than the
# surface/aggregate stores above, so 20Gi rather than 100Gi. Claimed now so a later enable does
# not have to provision storage at the same time as flipping the data path on.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: option-pressure-state-service-streams-state
  namespace: options-edge
  labels:
    app.kubernetes.io/component: kafka-streams-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
# breakout-sequencer-service: the DEVELOPMENT signing key set (Ed25519, generated once by the KeyInit init container and never
# changed, so a stream signed today still verifies on replay after any restart). Production uses the platform signing authority
# instead and does not rely on this claim. Tiny on purpose.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: breakout-sequencer-keys
  namespace: options-edge
  labels:
    app.kubernetes.io/component: signing-keys
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
