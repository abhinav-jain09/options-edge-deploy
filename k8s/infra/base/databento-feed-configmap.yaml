apiVersion: v1
kind: ConfigMap
metadata:
  name: options-edge-databento-feed-config
  namespace: options-edge
data:
  APP_PROFILE: prod
  DATABENTO_DATASET: OPRA.PILLAR
  DATABENTO_SYMBOL: SPX
  DATABENTO_TRADING_CLASS: SPXW
  DATABENTO_EXPIRY: ""
  # The SPX Auction Desk's ONLY proof of what is LISTED for today's SPXW PM expiry. The feed already
  # resolves the whole contract set and then flattens the OPRA root away; this publishes it as one
  # atomic record per completed resolve on options.databento.opra.definition.enumeration, keyed
  # SPX|SPXW|<YYYYMMDD>, which options-edge-deploy mirrors prod -> es4 for es-amt-service to read.
  # Default OFF in code; turned on HERE, and only here, so the switch is reviewable in one place.
  # Settings.validate() refuses this flag anywhere but the OPRA.PILLAR / SPX / SPXW feed, because the
  # record is published under a FIXED key and another feed's rejection would retract the real one.
  # It costs one extra parent query per resolve, which is why it is not on by default.
  #
  # This configmap is SHARED by dev and prod, so this turns it on in BOTH — checked before setting it:
  # dev and prod both run OPRA.PILLAR / SPX / SPXW, so neither is refused by that validation (a feed it
  # does refuse does not degrade, it declines to START, which is why this was verified against the live
  # configmaps rather than assumed). Dev therefore also pays the extra parent query per resolve. That is
  # deliberate: only the prod record is mirrored to es4 and read by the desk, but dev publishing the same
  # record is what makes the dev desk testable without a second switch to forget.
  DATABENTO_DEFINITION_ENUMERATION_ENABLED: "true"
  # Align the SPX 0DTE roll to the ES roll (17:30 ET) instead of midnight, so the SPX chain
  # flips to the next expiry when es4 does and the mapped ES gamma shows immediately (not until 00:00 ET).
  DATABENTO_EXPIRY_ROLL_AFTER: "17:30"
  # Off-hours STRIKE LADDER (definitions only): when OPRA is closed, resolve the target expiry
  # from the Databento definition schema (SPXW parent) and publish the strike ladder so the chain
  # is not empty overnight and the gateway can form its active selection (symbol+expiry) — without
  # it the gateway drops the es-gex aligned books as "inactive" (no selection). No quotes/marks/OI
  # are fabricated; GEX skips unquoted legs.
  DATABENTO_OFFHOURS_STRIKE_LADDER_ENABLED: "true"
  DATABENTO_MIN_STRIKE: "7000"
  DATABENTO_MAX_STRIKE: "8000"
  DATABENTO_STRIKE_STEP: "5"
  DATABENTO_SPOT_SOURCE: SYNTHETIC
  DATABENTO_STATIC_SPOT: "7500"
  # Extra option-chain underlyings ingested by the SAME feed (empty = SPX only). SPY was REMOVED
  # 2026-07-09 per request — the feed reads SPX only. The reliable, deploy-durable SPX-only setting is
  # the explicit DATABENTO_EXTRA_INSTRUMENTS="" env on the feed Deployment (service-deploy path, which
  # OVERRIDES this configmap); this default is kept at "" for source hygiene since common-infra-deploy
  # (the configmap apply path) is currently blocked. To add an underlying, set a JSON list of objects
  # BOTH here and on the Deployment env, e.g.
  # [{"symbol":"SPY","trading_class":"SPY","min_strike":650,"max_strike":820,"strike_step":1,"static_spot":740}]
  DATABENTO_EXTRA_INSTRUMENTS: ""
  # false = feed seeds the full chain snapshot immediately from live data on boot
  # (service.py:_publish_seed_snapshots). true deferred the seed until a market-time
  # replay trigger, which never fires on a mid-day (re)start -> gateway never marks the
  # selection ready -> blank chain until the next pre-market start. Live feed needs no replay.
  DATABENTO_USE_LIVE_REPLAY: "false"
  DATABENTO_REPLAY_START_MINUTES: "5"
  DATABENTO_RECONNECT_INITIAL_SECONDS: "5"
  DATABENTO_RECONNECT_MAX_SECONDS: "60"
  DATABENTO_RECONNECT_RESET_SECONDS: "300"
  DATABENTO_CONTROL_ENABLED: "true"
  DATABENTO_MARKET_OPEN_ALIGNMENT: "true"
  DATABENTO_CONTROL_GROUP_ID: options-edge-databento-feed-control
  KAFKA_BOOTSTRAP_SERVERS: 192.168.100.252:9092
  KAFKA_SCHEMA_REGISTRY_URL: http://192.168.100.252:8082
  KAFKA_MARKET_DATA_SELECTION_TOPIC: options.marketdata.selection
  KAFKA_DATABENTO_EVENTS_TOPIC: options.databento.events.raw
  KAFKA_DATABENTO_SNAPSHOT_TOPIC: options.databento.raw
  KAFKA_DATABENTO_CONTROL_TOPIC: options.databento.control
  DATABENTO_HPSF_TCBBO_ENABLED: "true"
  KAFKA_HPSF_TCBBO_TOPIC: options.opra.tcbbo
  KAFKA_HPSF_DLQ_TOPIC: options.hpsf.dlq
  DATABENTO_HPSF_ES_TRADES_ENABLED: "true"
  DATABENTO_HPSF_ES_DATASET: GLBX.MDP3
  DATABENTO_HPSF_ES_SYMBOL: ES.v.0
  DATABENTO_HPSF_ES_STYPE_IN: continuous
  KAFKA_HPSF_ES_TRADES_TOPIC: underlying.es.trades
  DATABENTO_HPSF_SPX_PRICE_ENABLED: "true"
  KAFKA_HPSF_SPX_PRICE_TOPIC: underlying.spx.price
  HPSF_SPX_SPOT_SOURCE: SYNTHETIC_OPTION_SPOT
  HPSF_SPX_SPOT_QUALITY: SYNTHETIC
  METRICS_ENABLED: "true"
  METRICS_HOST: 0.0.0.0
  METRICS_PORT: "8010"
