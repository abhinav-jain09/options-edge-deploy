apiVersion: v1
kind: ConfigMap
metadata:
  name: options-edge-config
  namespace: options-edge
data:
  APP_PROFILE: dev
  TOPIC_PREFIX: ""
  KAFKA_APPLICATION_ID_SUFFIX: -dev
  SCHEMA_REGISTRY_URL: http://host.docker.internal:8082
  KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
  KAFKA_SCHEMA_REGISTRY_URL: http://host.docker.internal:8082
  KAFKA_BROKER_COUNT: "1"
  KAFKA_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TOPIC_MIN_IN_SYNC_REPLICAS: "1"
  # Dev-only data-topic retention: 10h (36,000,000 ms). Overrides the base 24h
  # (KAFKA_TOPIC_RETENTION_MS=86400000); prod keeps 24h. load-kafka-settings.sh
  # derives KAFKA_TOPIC_RETENTION_MS from this rendered per-env configmap, so the
  # Kafka Topics stage applies 10h to dev data topics.
  KAFKA_TOPIC_RETENTION_MS: "36000000"
  # Dev-only universal retention CAP: 10h. load-kafka-settings.sh exports this, and
  # the HPSF topic create/verify scripts + the Kafka Internal Topics stage cap every
  # topic's retention.ms at this value when set — so ALL dev Kafka topics (data,
  # streams-internal, changelog, HPSF/opra/signal/dlq/audit) retain at most 10h.
  # Unset in prod -> no cap -> prod keeps its per-topic retention (24h/7d/30d).
  KAFKA_MAX_RETENTION_MS: "36000000"
  # Dev-only Kafka Streams internal/changelog retention: 10h. These are consumed at
  # RUNTIME by the Streams pods (hpsf-stage-a/b, etc., via the options-edge-config
  # envFrom) when they (re)create their *-changelog / *-repartition topics — e.g.
  # after the "Reset HPSF Stage B Internal Topics" stage deletes them, the pod
  # recreates them from these values, NOT from the deploy-time cap. Without this
  # override they would inherit the base 24h (86400000). Prod keeps the base 24h.
  KAFKA_STREAMS_INTERNAL_RETENTION_MS: "36000000"
  KAFKA_CHANGELOG_RETENTION_MS: "36000000"
  POSTGRES_JDBC_URL: jdbc:postgresql://host.docker.internal:5432/options_flow_dev
  POSTGRES_USER: options_flow
  POSTGRES_PASSWORD: Options#100
  APP_FEED_GATEWAY_WS_URL: ws://feed-gateway-service:8091/ws/events
  # WEB_BASE_URL: the browser-facing base URL of the .2 web. EXPERIMENT serves the SPA at
  # http://localhost:18090 (localhost for OIDC/PKCE secure context; UNIQUE port 18090 so it
  # never collides with the dev http://localhost:8090) via an SSH tunnel to .2:18090. Matches
  # the web origin the feed-gateway trusts — see web-dev-env-patch.yaml + kustomization.yaml.
  WEB_BASE_URL: http://localhost:18090
  GATEWAY_WS_URL: ws://feed-gateway-service:8091/ws/events
  CHECK_MARKET_DATA_SOURCES: DATABENTO
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: options-edge-databento-feed-config
  namespace: options-edge
data:
  APP_PROFILE: dev
  DATABENTO_MARKET_OPEN_ALIGNMENT: "true"
  KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
  KAFKA_SCHEMA_REGISTRY_URL: http://host.docker.internal:8082
