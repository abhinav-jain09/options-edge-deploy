# PROD feed spot = EXACTLY like dev, per explicit user request (2026-07-06).
#
# The base databento-feed config already defaults the spot keys to SYNTHETIC (dev values); the
# only thing that made prod differ is APP_PROFILE=prod, which trips the feed's fail-loud guard
# (config.py: synthetic spot forbidden when runtime_profile in {prod,production}). To run prod's
# feed the same way dev does, set APP_PROFILE=dev here so that guard does not fire, and pin the
# spot keys to the dev values explicitly.
#
# NOTE: this intentionally OVERRIDES the "prod must carry real data" SSOT rule — prod's SPX spot
# is now the SYNTHETIC (option-parity-derived) value, not a real index price, so every downstream
# number is built on a derived spot. APP_PROFILE only gates the feed's spot/replay guards
# (verified) — it does NOT change Kafka RF, credentials, or topics. To go back to real data,
# restore APP_PROFILE=prod + DATABENTO_SPOT_SOURCE/HPSF_SPX_SPOT_SOURCE=CASCADED.
apiVersion: v1
kind: ConfigMap
metadata:
  name: options-edge-databento-feed-config
  namespace: options-edge
data:
  APP_PROFILE: dev
  # ---- IBKR SPX index = priority-1 spot (2026-07-29, IBKR-SPX-INDEX-PRIORITY-SPOT rev4) ----
  # CASCADED: tier-1 = IBKR SPX cash index (SPX_INDEX_SOURCE_* consumer below, LIVE-only,
  # 10s freshness), tier-2 = ES-basis (live on prod via the es4 underlying.es.trades flow),
  # tier-3 = synthetic parity. Fallback and recovery are automatic per tick.
  # Kill switch: DATABENTO_SPOT_SOURCE/HPSF_SPX_SPOT_SOURCE back to
  # SYNTHETIC/SYNTHETIC_OPTION_SPOT.
  DATABENTO_SPOT_SOURCE: CASCADED
  HPSF_SPX_SPOT_SOURCE: CASCADED
  # ⚠️ Read UNPREFIXED like ES_TRADES_SOURCE_* — a DATABENTO_-prefixed spelling is silently
  # absent. LOCAL bootstrap: ibkr-feed (dev k8s) dual-produces the hop topic to THIS cluster.
  SPX_INDEX_SOURCE_ENABLED: "true"
  SPX_INDEX_SOURCE_BOOTSTRAP: 192.168.100.252:9092
  SPX_INDEX_SOURCE_TOPIC: underlying.spx.index.price
  SPX_INDEX_SOURCE_GROUP_ID: prod-feed-spx-index
  # Starvation-incident guard (2026-07-15 class): bound the cascade's full-book snapshot
  # refresh so tier-1/tier-2 ticks cannot starve the OPRA read loop.
  DATABENTO_CASCADE_REFRESH_MIN_INTERVAL_MS: "250"
  # USER rule 2026-07-29: first IBKR, second SYNTHETIC, third ES-basis (the crude
  # cost-of-carry tier is last resort — review F3's ~10pt discrepancy source).
  DATABENTO_CASCADE_TIER_ORDER: NATIVE,SYNTHETIC,ES_BASIS

  # ---- DBP-R32: prod stops holding its own ES Databento subscription (2026-07-26) ----------
  #
  # PRODUCTION-ONLY ON PURPOSE. These keys must NOT go in k8s/infra/base — dev inherits that
  # base and would then (a) lose the ES trade stream its cascade comment says it "reuses via
  # base's DATABENTO_HPSF_ES_TRADES_ENABLED=true", and (b) inherit the bootstrap below and start
  # consuming from the PRODUCTION broker. Both silent.
  #
  # WHERE THE SESSION SAVING COMES FROM: _use_separate_es_live_client() opens an EXTRA Databento
  # live client only when hpsf_es_dataset != databento_dataset. Prod is OPRA.PILLAR vs GLBX.MDP3
  # -> a whole extra concurrent session on the shared key. es4 is GLBX.MDP3 vs GLBX.MDP3 -> the
  # same subscription there costs +0. Net effect of the flip: -1 concurrent session.
  DATABENTO_HPSF_ES_TRADES_ENABLED: "false"
  #
  # ES trades now arrive over Kafka instead. LOCAL bootstrap on purpose: the es4->prod bridge
  # (Jenkinsfile.es-trades-bridge) already made the single cross-LAN hop and renamed
  # es.underlying.es.trades -> underlying.es.trades on THIS cluster, so the feed reads it like
  # any other local topic. One hop, not two, and every existing prod consumer of
  # underlying.es.trades (close-direction, es-open-direction, es-spx-align, ...) is untouched.
  #
  # ⚠️ These four are read WITHOUT a DATABENTO_ prefix (config.py:520-523), unlike almost every
  # other key here. A DATABENTO_-prefixed spelling parses as absent and the consumer stays
  # silently OFF — which would take the ES->SPX basis dark with no error at all.
  #
  # REQUIRES feed >= c599296 (PR #96), which makes the Kafka-source path drive the basis engine
  # exactly as the native subscription did. Deployed to prod 2026-07-25 (service-deploy #878,
  # digest sha256:2abf0418). Without it this flip silently kills the A1-certified ES->SPX basis,
  # because the enrichment is best-effort and never fails a publish.
  ES_TRADES_SOURCE_ENABLED: "true"
  ES_TRADES_SOURCE_BOOTSTRAP: 192.168.100.252:9092
  ES_TRADES_SOURCE_TOPIC: underlying.es.trades
  # Distinct from es4's historic "es-feed-spot" group: those committed offsets belong to a
  # different consumer on a different cluster; inheriting them would skip or replay records.
  ES_TRADES_SOURCE_GROUP_ID: prod-feed-es-spot
