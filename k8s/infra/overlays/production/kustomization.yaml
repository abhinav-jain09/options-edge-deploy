# COMMON INFRA — production (.252 standalone k3s node).
# Applied standalone by Jenkinsfile.common-infra AND included by k8s/overlays/production
# (the monolithic deploy) so both paths render identical infra.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  # Keycloak is NOT here any more. It moved to the infra-deploy repo on 2026-08-09, with
  # its own Jenkins job, because it is shared by both applications rather than owned by
  # this one: a trading-platform deploy should not be able to disturb the login path, and
  # a Keycloak change should not have to queue behind trading-platform CI.
  #
  # Removing it from this list does not delete anything. common-infra applies without
  # --prune, so the live Keycloak in the options-edge namespace is simply no longer
  # touched from here. It is owned by infra-deploy now, and by only that.
patches:
  # Prod is a STANDALONE SINGLE-BROKER Kafka node — force RF=1 (moved here from
  # k8s/overlays/production; it patches the shared configmap, which is infra).
  - path: configmap-prod-single-broker-patch.yaml
  # Prod feed spot = exactly like dev (APP_PROFILE=dev disables the synthetic-spot guard;
  # spot keys pinned to the dev SYNTHETIC values). Per explicit user request; overrides the
  # "prod must carry real data" rule — see the patch file header.
  - path: configmap-prod-feed-synthetic-spot-patch.yaml
  # Streams-state PVCs: prod k3s provisions with the 'local-path' storage class (matches
  # the 22 live prod PVCs). storageClassName is immutable — base's former hard-coded
  # 'standard' is exactly what failed every prod deploy with "spec: Forbidden: spec is
  # immutable" (deploy #490/#502). This pins prod to its real class.
  - target:
      kind: PersistentVolumeClaim
      labelSelector: app.kubernetes.io/component=kafka-streams-state
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: local-path
  # Prod's live strike-liquidity-heatmap PVC is 20Gi (created before the base bumped to 100Gi);
  # every OTHER prod streams-state PVC is already 100Gi. local-path does NOT support resize, so
  # rendering 100Gi here makes `kubectl apply -k` fail closed ("only dynamically provisioned pvc
  # can be resized ...") and aborts the whole prod deploy. Pin THIS pvc to its live 20Gi for prod
  # (name-targeted, so the other PVCs stay 100Gi). Dev keeps the base 100Gi (its live PVC is 100Gi).
  - target:
      kind: PersistentVolumeClaim
      name: strike-liquidity-heatmap-service-streams-state
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 20Gi
