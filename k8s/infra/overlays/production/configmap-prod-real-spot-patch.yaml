# PROD real-spot override. The base options-edge-databento-feed-config defaults the spot
# source to SYNTHETIC — fine for dev/experiment (no live index feed), but the feed's fail-loud
# guard FORBIDS a synthetic spot in prod (SSOT: prod must carry real data), so prod crash-loops
# on it. Prod has the live Databento feed, so it uses CASCADED (real SPX via native-index /
# ES-basis cascade). This restores the value from 752e761 ("flip SPX feed spot source to
# CASCADED") that was lost when the configmap moved to k8s/infra/base with no prod override —
# the reason prod had no data. Dev/experiment keep the base SYNTHETIC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: options-edge-databento-feed-config
  namespace: options-edge
data:
  DATABENTO_SPOT_SOURCE: CASCADED
  HPSF_SPX_SPOT_SOURCE: CASCADED
