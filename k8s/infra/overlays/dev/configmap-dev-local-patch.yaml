apiVersion: v1
kind: ConfigMap
metadata:
  name: options-edge-config
  namespace: options-edge
data:
  APP_PROFILE: dev
  TOPIC_PREFIX: ""
  KAFKA_APPLICATION_ID_SUFFIX: -dev
  SCHEMA_REGISTRY_URL: http://host.docker.internal:8082
  KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:19092
  KAFKA_SCHEMA_REGISTRY_URL: http://host.docker.internal:8082
  KAFKA_BROKER_COUNT: "1"
  KAFKA_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TOPIC_MIN_IN_SYNC_REPLICAS: "1"
  KAFKA_TOPIC_PARTITIONS_DEFAULT: "32"
  # Retention: -1 (ETERNAL, 2026-07-11) — matches base+prod. Data is wiped MANUALLY by the nightly
  # clean (WIPE_KAFKA=true), not by TTL. Kept explicit so load-kafka-settings.sh derives
  # KAFKA_TOPIC_RETENTION_MS from this rendered per-env configmap for the Kafka Topics stage.
  KAFKA_TOPIC_RETENTION_MS: "-1"
  # Universal retention CAP: -1 (no TTL cap). load-kafka-settings.sh exports this; the HPSF topic
  # create/verify scripts + the Kafka Internal Topics stage cap every topic's retention.ms
  # create/verify scripts + Internal Topics stage stamp every topic eternal (data,
  # streams-internal, changelog, HPSF/opra/dlq/audit). Same value in prod (base).
  KAFKA_MAX_RETENTION_MS: "-1"
  # Kafka Streams internal/changelog retention: -1 (eternal). Consumed at RUNTIME by the Streams
  # pods (via the options-edge-config envFrom) when they (re)create their *-changelog /
  # *-repartition topics. Kept explicit so a dev topic-reset stage recreates them at 12h.
  KAFKA_STREAMS_INTERNAL_RETENTION_MS: "-1"
  KAFKA_CHANGELOG_RETENTION_MS: "-1"
  POSTGRES_JDBC_URL: jdbc:postgresql://host.docker.internal:5432/options_flow_dev
  POSTGRES_USER: options_flow
  POSTGRES_PASSWORD: Options#100
  APP_FEED_GATEWAY_WS_URL: ws://feed-gateway-service:8091/ws/events
  # WEB_BASE_URL: the k8s web LoadBalancer Service on the dev cluster, bound on the Mac
  # agent's localhost by docker-desktop's ServiceLB. The dev web Service is patched to
  # :8090 (the legacy local Docker container that owned :8090 has been removed), the origin
  # the feed-gateway/orchestrator already trust — see web-dev-env-patch.yaml.
  WEB_BASE_URL: http://localhost:8090
  GATEWAY_WS_URL: ws://feed-gateway-service:8091/ws/events
  CHECK_MARKET_DATA_SOURCES: DATABENTO
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: options-edge-databento-feed-config
  namespace: options-edge
data:
  APP_PROFILE: dev
  DATABENTO_MARKET_OPEN_ALIGNMENT: "true"
  KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:19092
  KAFKA_SCHEMA_REGISTRY_URL: http://host.docker.internal:8082
  # ---- IBKR SPX index = priority-1 spot (2026-07-29, requirement rev4) --------------------
  # The deployment env pins DATABENTO_SPOT_SOURCE=CASCADED (databento-feed-dev-patch.yaml);
  # these keys wire the tier-1 consumer to the LOCAL dev copy of the hop topic, which
  # ibkr-feed (running on dev k8s) dual-produces to both clusters. ⚠️ Read UNPREFIXED, like
  # the ES_TRADES_SOURCE_* family — a DATABENTO_-prefixed spelling is silently absent.
  SPX_INDEX_SOURCE_ENABLED: "true"
  SPX_INDEX_SOURCE_BOOTSTRAP: host.docker.internal:19092
  SPX_INDEX_SOURCE_TOPIC: underlying.spx.index.price
  SPX_INDEX_SOURCE_GROUP_ID: dev-feed-spx-index
  HPSF_SPX_SPOT_SOURCE: CASCADED
  # USER rule 2026-07-29: first IBKR, second SYNTHETIC, third ES-basis (the crude
  # cost-of-carry tier is last resort — review F3's ~10pt discrepancy source).
  DATABENTO_CASCADE_TIER_ORDER: NATIVE,SYNTHETIC,ES_BASIS
  # Starvation-incident guard (2026-07-15 class): bound the cascade's full-book snapshot
  # refresh so tier-1/tier-2 ticks cannot starve the OPRA read loop.
  DATABENTO_CASCADE_REFRESH_MIN_INTERVAL_MS: "250"
