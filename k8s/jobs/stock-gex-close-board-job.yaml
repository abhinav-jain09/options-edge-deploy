# FREEZE ONE SESSION'S CLOSING GEX BOARD.
#
# A live board is retired 900s after its last subscriber and dies with the process, so at 16:05
# there is nothing left to look at. This Job writes the closing picture down, per root, into
# /oi-index/close/dt=YYYY-MM-DD/, where the service reads it on demand.
#
# WHY THIS IS A JOB TEMPLATE IN GIT AND NOT A CronJob OBJECT — the same reason as
# stock-gex-oi-snapshot-job.yaml (read that header): the options-edge-jenkins-only-workloads
# admission policy (failurePolicy: Fail) permits batch/jobs and batch/cronjobs ONLY to
# system:serviceaccount:options-edge:jenkins-deployer, so the schedule lives in Jenkins — the one
# principal that can create the workload — and the workload itself is rendered from this file per
# run. A CronJob would also fire on a node the wrapper did not choose.
#
# WHAT MAKES THIS JOB MUCH SIMPLER THAN THE INDEX ONE, and it is not an oversight:
#
#   * NO ROLLOUT. The service does not load closing boards at boot; CloseBoardStore rescans the
#     directory every 60 seconds and opens the requested root's file per request. So publishing is
#     complete when the manifest lands — there is nothing to restart, no pod-template annotation
#     to carry the intent, and no drift between "what was published" and "what the pod is serving".
#   * NO WRITER LOCK against the index producer. This job never touches the index or the snapshot
#     directory: it reads the index (read-only, by path) and writes only under close/.
#   * PUBLICATION IS ONE SYMLINK MOVE. The builder writes a whole GENERATION directory
#     (dt=<session>.gen-<stamp>/) and then moves the dt=<session> symlink onto it, so a rebuild
#     replaces a session entirely or not at all. A killed run leaves a generation nothing points
#     at, which readers cannot see however complete it is. That is also why two concurrent runs
#     cannot corrupt a session: they produce two generations, and the later promote simply wins.
#
# WHAT IT DOES NOT PROTECT AGAINST, stated rather than implied:
#   * A run for a session the vendor has not published yet fails on the chunk size floor — an
#     empty response is a failed attempt, never data. That is the intended outcome: publishing a
#     hollow session is worse than publishing nothing.
#   * Two concurrent runs still both spend a full vendor pull, and each drops the OTHER'S
#     .fetch scratch directory at start-up (they only keep their own session's). The publication
#     is safe; the waste is not prevented here. Jenkins serialises this pipeline and the wrapper
#     refuses to start beside an active close-board Job, which is where that is handled.
#
# NODE PINNING is required for the same reason as the index job: /oi-index is a node-local
# hostPath, so this must run on the node the service pod runs on, or it writes a copy nobody
# reads.
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: options-edge
  labels:
    app.kubernetes.io/name: stock-gex-close-board
    app.kubernetes.io/part-of: options-edge
    app.kubernetes.io/component: maintenance
spec:
  # NO k8s-level retry: the CLI retries each chunk itself (--max-attempts), and a backoffLimit > 0
  # would restart the whole pull from scratch on a late failure.
  backoffLimit: 0
  # 100 min, and most of it is the vendor WAIT rather than work. The CLI polls
  # metadata.get_dataset_range until the archive covers the closing minute (up to 60 min by
  # default) before spending a single data request; the pull itself is ONE schema over ~21
  # chunks and the build is CPU work over ~500 roots. The wrapper waits LONGER than this on
  # purpose, so the deadline is enforced by the component that can actually stop the work.
  activeDeadlineSeconds: __JOB_DEADLINE_S__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stock-gex-close-board
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: __NODE_NAME__
      # This Job never talks to the k8s API — the token would be an unnecessary credential in a
      # pod that holds a Databento key.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000        # MUST match the hostPath dir owner on the node (abhinav)
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: close-board
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATABENTO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: options-edge-databento-feed-env
                  key: DATABENTO_API_KEY
            # The session to freeze, YYYY-MM-DD. ALWAYS explicit — resolved by the wrapper from
            # the market calendar, never defaulted in here. A freeze is about ONE named day, and a
            # job that picked its own day could silently refreeze yesterday after a late start.
            - name: SESSION
              value: "__SESSION__"
            - name: KEEP_SESSIONS
              value: "__KEEP_SESSIONS__"
            # How long to wait for the vendor's archive to reach the closing minute before
            # pulling. The lag is NOT a constant — measured 20.6 min, then still climbing at 32
            # — so the job asks rather than the schedule guessing. Must stay comfortably under
            # activeDeadlineSeconds so the wait fails with its own message rather than being
            # killed without one.
            - name: WAIT_FOR_VENDOR_S
              value: "__WAIT_FOR_VENDOR_S__"
            # How many PREVIOUSLY MISSED sessions this run may also freeze SUCCESSFULLY, and how
            # many it may ATTEMPT. Two numbers, because one starves: counting attempts alone lets
            # three permanently unbuildable oldest sessions consume the whole quota every day, so
            # newer gaps are never tried and age out of the retention window unnoticed — the very
            # failure this feature exists to end.
            #
            # Neither is the real bound. That is TIME: the loop stops when there is not enough of
            # the Job's activeDeadlineSeconds (6000) left for another freeze. Arithmetic on
            # WAIT_FOR_VENDOR_S cannot do it — the wait is a race that has measured 245s and is
            # allowed 3600 — so the loop asks the clock instead.
            - name: MAX_CATCH_UP
              value: "__MAX_CATCH_UP__"
            - name: MAX_CATCH_UP_ATTEMPTS
              value: "__MAX_CATCH_UP_ATTEMPTS__"
            # The Job's own deadline, so the catch-up loop can leave room rather than be killed
            # mid-freeze. Kept in step with activeDeadlineSeconds by the wrapper, which renders
            # both from one value.
            - name: JOB_DEADLINE_S
              value: "__JOB_DEADLINE_S__"
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              # Stamped ONCE, at the top: the catch-up loop below leaves room inside the Job's
              # activeDeadlineSeconds rather than being killed mid-freeze, and it can only do
              # that if it knows when the clock started.
              # The container starts AFTER scheduling and the image pull, so this is later
              # than the clock activeDeadlineSeconds runs on. The catch-up budget subtracts a
              # startup allowance as well as its margin: it cannot measure that delay, so it
              # assumes a generous one rather than overestimating the time it has.
              JOB_START_S=$(date +%s)
              JOB_STARTUP_ALLOWANCE_S=180
              test -n "${SESSION}" || { echo "FATAL: SESSION is empty" >&2; exit 1; }
              # The download lands in a per-session scratch directory under close/. The name
              # starts with a dot, so it is not a dt= directory and the service's session scan
              # cannot see it; and it is NOT in the nightly snapshot root, which the index
              # producer prunes on its own schedule and would not expect to find a stray session
              # in.
              FETCH="/oi-index/close/.fetch"
              SNAP="${FETCH}/dt=${SESSION}"
              # Leftovers from a FAILED run of ANOTHER session are dropped first. This session's
              # own leftovers are kept on purpose: the CLI skips chunks that are already complete,
              # so a re-run resumes instead of re-billing ~350 MB of vendor traffic.
              if [ -d "${FETCH}" ]; then
                for d in "${FETCH}"/dt=*; do
                  [ -d "${d}" ] || continue
                  [ "${d}" = "${SNAP}" ] && continue
                  echo "dropping stale fetch scratch ${d}"
                  rm -rf "${d}"
                done
              fi
              mkdir -p "${SNAP}"
              options-edge-stock-gex-close-board \
                --session "${SESSION}" \
                --index /oi-index/stock-gex-oi-index.json.gz \
                --snapshot-dir "${SNAP}" \
                --out-root /oi-index/close \
                --keep-sessions "${KEEP_SESSIONS}" \
                --wait-for-vendor-s "${WAIT_FOR_VENDOR_S}" \
                --skip-non-session \
                --fetch
              # Only on SUCCESS. The chunks are ~350 MB and nothing else reads them once the
              # boards exist, but on a failure they are what makes the re-run cheap — see above.
              rm -rf "${SNAP}"

              # --- CATCH UP ---------------------------------------------------------------
              # A freeze that fails is a day that VANISHES. This job runs once and never looks
              # again, so a run lost to a scaled-down service, a mid-flight deploy or a vendor
              # stall leaves a hole nothing reports: the page falls back to the newest board it
              # has — a complete, plausible picture of a DIFFERENT day — and the only way anyone
              # finds out is by noticing that a price is wrong. That is how 2026-08-19 sat
              # missing for eight days.
              #
              # AFTER today's freeze, never before: today's is the one with a deadline, and a
              # backlog must not be allowed to eat the window it needs.
              if [ "${MAX_CATCH_UP}" -gt 0 ]; then
                # THE LISTING MUST SUCCEED OR CATCH-UP DOES NOT RUN. `cmd | sed` hides the
                # command's exit status — /bin/sh has no pipefail, so sed returns 0 over a
                # crashed producer, MISSING comes back empty, and catch-up disables itself
                # silently on every run for as long as the fault lasts. Status first, parse
                # second, and the marker has to be exactly one well-formed line.
                CU_LOG="$(mktemp)"
                MISSING=""
                if options-edge-stock-gex-close-board \
                     --session "${SESSION}" \
                     --index /oi-index/stock-gex-oi-index.json.gz \
                     --snapshot-dir "${SNAP}" \
                     --out-root /oi-index/close \
                     --keep-sessions "${KEEP_SESSIONS}" \
                     --print-missing >"${CU_LOG}" 2>&1; then
                  markers="$(grep -c '^STOCK_GEX_CLOSE_BOARD_MISSING=' "${CU_LOG}" || true)"
                  if [ "${markers}" = "1" ]; then
                    MISSING="$(sed -n 's/^STOCK_GEX_CLOSE_BOARD_MISSING=//p' "${CU_LOG}")"
                    # ISO dates and commas only. The values come from our own binary, so this is
                    # not a security boundary — it is a promise that the loop below iterates over
                    # dates and nothing else, whatever a future change prints.
                    # EVERY DATE, not a character whitelist. "-", "2026--08", a trailing
                    # comma and an empty element all pass a whitelist and then reach the loop
                    # as a session name. One bad element voids the WHOLE list: a list this
                    # code cannot read is a list it should not act on.
                    case "${MISSING}" in
                      *,,*|,*|*,)
                        echo "catch-up: malformed list '${MISSING}' — not catching up" >&2
                        MISSING="" ;;
                    esac
                    for d in $(printf '%s' "${MISSING}" | tr ',' ' '); do
                      case "${d}" in
                        [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) : ;;
                        *) echo "catch-up: '${d}' is not a session date — not catching up" >&2
                           MISSING=""; break ;;
                      esac
                    done
                  else
                    echo "catch-up: expected exactly one marker line, saw ${markers} — not catching up" >&2
                    tail -5 "${CU_LOG}" >&2 || true
                  fi
                else
                  echo "catch-up: the listing itself FAILED — not catching up this run" >&2
                  tail -5 "${CU_LOG}" >&2 || true
                fi
                rm -f "${CU_LOG}"
                echo "catch-up: missing sessions in the retention window: ${MISSING:-<none>}"

                # THE REAL BOUND IS TIME. A freeze measures ~6 min; the loop stops while that
                # still fits inside the Job's deadline, with a margin for the prune and the
                # receipt. Arithmetic on WAIT_FOR_VENDOR_S cannot do this — the wait is a race
                # that has measured 245s and is allowed 3600 — so ask the clock.
                CU_FREEZE_S=420
                CU_MARGIN_S=300
                CU_UNTIL=$(( JOB_START_S + JOB_DEADLINE_S - JOB_STARTUP_ALLOWANCE_S - CU_MARGIN_S ))
                cu_ok=0
                cu_tried=0
                for gap in $(printf '%s' "${MISSING}" | tr ',' ' '); do
                  [ -n "${gap}" ] || continue
                  if [ "${cu_ok}" -ge "${MAX_CATCH_UP}" ]; then
                    echo "catch-up: ${cu_ok} frozen this run — the rest are named above"
                    break
                  fi
                  if [ "${cu_tried}" -ge "${MAX_CATCH_UP_ATTEMPTS}" ]; then
                    echo "catch-up: attempt budget spent (${cu_tried}) — the rest are named above" >&2
                    break
                  fi
                  if [ $(( $(date +%s) + CU_FREEZE_S )) -gt "${CU_UNTIL}" ]; then
                    echo "catch-up: not enough of the Job's deadline left for another freeze — stopping" >&2
                    break
                  fi
                  cu_tried=$(( cu_tried + 1 ))
                  GAP_SNAP="${FETCH}/dt=${gap}"
                  mkdir -p "${GAP_SNAP}"
                  echo "catch-up: freezing ${gap} (attempt ${cu_tried}, ${cu_ok} done)"
                  # --wait-for-vendor-s 0: these sessions closed days ago, so the archive already
                  # reaches them. Waiting is only for TODAY, where it is a race.
                  #
                  # A gap that fails does NOT fail the run and does NOT stop the loop. Today's
                  # freeze already succeeded, and a session that cannot be built — an
                  # extraordinary closure the calendar does not know, a chain the vendor no
                  # longer serves — would otherwise consume the quota every single day and
                  # starve every newer gap behind it until they aged out.
                  # timeout, so CU_FREEZE_S BOUNDS the freeze instead of estimating it. Without
                  # it the guard above only HOPED a freeze would fit, and Kubernetes would kill
                  # the pod mid-build — taking today's receipt down with it.
                  if timeout "${CU_FREEZE_S}" options-edge-stock-gex-close-board \
                       --session "${gap}" \
                       --index /oi-index/stock-gex-oi-index.json.gz \
                       --snapshot-dir "${GAP_SNAP}" \
                       --out-root /oi-index/close \
                       --keep-sessions "${KEEP_SESSIONS}" \
                       --wait-for-vendor-s 0 \
                       --skip-non-session \
                       --fetch; then
                    cu_ok=$(( cu_ok + 1 ))
                    echo "catch-up: ${gap} frozen"
                  else
                    echo "catch-up: ${gap} FAILED — moving on to the next gap" >&2
                  fi
                  rm -rf "${GAP_SNAP}"
                done
                echo "catch-up: ${cu_ok} frozen, ${cu_tried} attempted"
              fi
          volumeMounts:
            - name: oi-index
              mountPath: /oi-index      # READ-WRITE: this job writes under close/.
            - name: tmp
              mountPath: /tmp           # readOnlyRootFilesystem: python/urllib need a temp dir
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            # The build holds ONE chunk's symbology and last quotes at a time (25 roots), never
            # the whole session, so this is bounded by the largest chunk rather than by the
            # universe. 2Gi matches the index job's ceiling.
            limits:
              memory: 2Gi
      volumes:
        - name: oi-index
          hostPath:
            path: /home/options-edge/stock-gex-oi
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
