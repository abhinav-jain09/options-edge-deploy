# INTERNAL flip-track snapshot — one short Job after the nightly close batch promotes.
#
# Captures the evening's Near Flip lists (as /flips served them) into gex_flip_track in the
# same bleedingoptions database the closing boards live in, so "what did the list say on the
# 30th, and what happened over the next five sessions" is answerable forever. INTERNAL ONLY:
# no endpoint serves these tables; the public surface's allowlists do not change.
#
# A Job TEMPLATE, not a CronJob, for the same two reasons as the OI snapshot and the close
# batch (see stock-gex-oi-snapshot-job.yaml): the admission policy denies the CronJob
# controller's identity, and the service-deploy path cannot pin a CronJob's image. Created by
# scripts/ops/stock-gex-close-board.sh under the deployer identity, right after promotion —
# and because the CLI SELF-HEALS (it fills every promoted session the table is missing), a
# night this never fires is repaired by the next night that does.
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: options-edge
  labels:
    app.kubernetes.io/name: stock-gex-flip-track
    app.kubernetes.io/part-of: options-edge
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stock-gex-flip-track
    spec:
      restartPolicy: Never
      containers:
        - name: flip-track
          image: __IMAGE__
          command: ["options-edge-stock-gex-flip-track"]
          env:
            # Same DSN, same standing decision as the close batch (USER 2026-08-27): inline,
            # because nothing but the Jenkins deployer may write a Secret in this namespace.
            # Retiring this value means ROTATING the bo-app-postgres password.
            - name: STOCK_GEX_CLOSE_DB_DSN
              value: "postgresql://bleedingoptions:fAE80oxjlQ75edJe5nmfTLoIDJerlkddoFRm@bo-app-postgres-db.bleedingoptions.svc.cluster.local:5432/bleedingoptions"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
