# DERIVED from scripts/es4/render_es4_manifests.py + k8s/services/vix-option-inteligence/overlays/production/manifest.yaml,
# but HELD: this name is in validate-es4-render.sh's KNOWN_STALE, so the renderer does NOT overwrite it and this file is
# the source of authority for es4 until that list is emptied. It said "DO NOT EDIT BY HAND" while being, in fact, the only
# place an es4 operand can be declared — which is how the Stage-B environment operand came to be missing here.
# WHY IT IS HELD: re-rendering would also take the production CPU request (100m -> 500m) on a box whose capacity pressure is
# why ES4_KEEP_DOWN exists. That is an OWNER capacity decision, not a drive-by change, so the hold stands and the operand is
# declared BOTH here (es4 as it runs today) and as an _override in the renderer (es4 whenever the hold is lifted). Keep the two
# in step: tests/test_vix_option_inteligence_deploy.py requires this file to declare es4, exactly once, with no second name.
# es4 environment: env-level knobs come from es4-common-env / es4-runtime-secrets;
# every topic gets the es. prefix at runtime via TOPIC_PREFIX (incl. env-supplied values).
# Deploy ONLY via Jenkinsfile.es4-deploy (digest-pins the :prod tag before apply).
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: vix-option-inteligence-service
    app.kubernetes.io/name: vix-option-inteligence-service
    app.kubernetes.io/part-of: options-edge
  name: vix-option-inteligence-service
  namespace: options-edge
spec:
  ports:
  - name: health
    port: 8080
    targetPort: health
  selector:
    app.kubernetes.io/name: vix-option-inteligence-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: vix-option-inteligence-service
    app.kubernetes.io/name: vix-option-inteligence-service
    app.kubernetes.io/part-of: options-edge
  name: vix-option-inteligence-service
  namespace: options-edge
spec:
  progressDeadlineSeconds: 1200
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vix-option-inteligence-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: vix-option-inteligence-service
        app.kubernetes.io/name: vix-option-inteligence-service
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
      - env:
        - name: HEALTH_PORT
          value: '8080'
        - name: ZERO_DTE_INTELLIGENCE_ENABLED
          value: 'true'
        - name: ZERO_DTE_SYMBOL
          value: ES
        - name: ZERODTE_RESEARCH_ENVIRONMENT
          value: es4
        - name: ZERO_DTE_OPTION_EVENTS_TOPIC
          value: options.databento.events.raw
        - name: ZERO_DTE_VIX_TOPIC
          value: underlying.vix.price
        - name: VIX_OPTION_INTELIGENCE_TOPIC
          value: options.spx.vix-option-inteligence-service.current
        - name: ZERO_DTE_DIRECTION_PERSISTENCE_MS
          value: '20000'
        - name: ZERO_DTE_REVERSAL_PERSISTENCE_MS
          value: '30000'
        - name: ZERO_DTE_MIN_DIRECTION_HOLD_MS
          value: '120000'
        - name: ZERO_DTE_UNUSUAL_PERSISTENCE_MS
          value: '10000'
        - name: ZERO_DTE_UNUSUAL_HOLD_MS
          value: '60000'
        - name: JAVA_TOOL_OPTIONS
          value: -Xms128m -Xmx384m
        envFrom:
        - configMapRef:
            name: es4-base-env
        - configMapRef:
            name: es4-common-env
        - secretRef:
            name: es4-runtime-secrets
        image: 192.168.100.252:5000/options-edge-vix-option-inteligence:prod
        livenessProbe:
          httpGet:
            path: /health/live
            port: health
          initialDelaySeconds: 15
          periodSeconds: 15
        name: vix-option-inteligence
        ports:
        - containerPort: 8080
          name: health
        readinessProbe:
          httpGet:
            path: /health/ready
            port: health
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
