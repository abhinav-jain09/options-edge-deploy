# es-feed — the ES-0DTE-options Databento feed. RUNS ON THE ES4 CLUSTER (192.168.100.4),
# next to es4 Kafka and es4 Schema Registry.
#
# RELOCATED from the prod cluster 2026-07-25 (USER: "in any case we need to move the es feed
# to es env"). Requirement: DATABENTO-BACKPRESSURE-REMEDIATION-GATE1.md rev 6, DBP-R26;
# design: ES-FEED-MIGRATION-AND-INGESTION-DESIGN.md rev 5, "Phase 1 lift-and-shift".
#
# What relocation buys (and it is structural, not a mitigation):
#   * final Avro records are produced LOCALLY against es4's own Schema Registry, so the
#     cross-host schema-ID poisoning class disappears (DBP-R24);
#   * no cross-LAN produce under acks=all + idempotence on the socket hot path — the
#     .4:9092 / .4:8081 hops are now node-local;
#   * ~1 core of contended CPU is returned on .252 to the SPX OPRA feed, which is the
#     client behind Databento's standing "consistently too slow" complaint.
#
# ⚠️ WHAT THIS DOES **NOT** FIX. Intake and processing are still coupled in one process
# and there is NO durable relay, so DBP-R13/R15 remain open. This reduces exposure; it
# does not remove the failure class. That is Phase 2 (log-native intake/builder split),
# which is proven on the prod SPX feed FIRST.
#
# ⚠️ The SPX feed (options-edge-databento-feed, prod cluster) is NOT touched by this file.
#    This manifest is applied with the ES4 kubeconfig and cannot reach the prod cluster.
#
# ⚠️ replicas: 0 IS THE INTENDED STATE. One shared Databento API key cannot carry two
#    concurrent ES option-chain sessions, and the prod es-feed deployment still exists
#    (also at 0) for rollback. Activation is a separate, explicitly authorized action —
#    never a side effect of a deploy, a clean-reset, or an autostart. See the
#    ES_FEED_ACTIVE parameter in Jenkinsfile.es4-deploy.
#
# PREREQ: the `options-edge-databento-feed-env` secret must exist in the es4 cluster
# (namespace options-edge). It does not exist there yet and must be provisioned by a
# human — this file only references it. The deploy stage fails closed if it is absent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-feed
  namespace: options-edge
  labels:
    app.kubernetes.io/name: es-feed
    app.kubernetes.io/part-of: options-edge-es4
spec:
  # 0 = intended. See the replicas note in the header; activation is a separate action.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: es-feed
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: es-feed
        app.kubernetes.io/part-of: options-edge-es4
    spec:
      containers:
        - name: es-feed
          image: 192.168.100.252:5000/options-edge-databento-feed:prod
          envFrom:
            # es-feed's OWN configmap (k8s/es4/es4-feed-config.yaml). Fixes the root cause of
            # the 2026-07-24 incident: a secret-only envFrom silently inherited the library's
            # code defaults (USE_LIVE_REPLAY=true, PUBLISH_INTERVAL_MS=250). DBP-R1/R2.
            # ⚠️ NEVER add configMapRef: options-edge-databento-feed-config here — it carries
            #    SPX values (OPRA.PILLAR / SPX / strikes 7000-8000).
            - configMapRef:
                name: es-feed-databento-config
            - secretRef:
                name: options-edge-databento-feed-env   # DATABENTO_API_KEY
          env:
            # ---- outputs -> es4 (NODE-LOCAL after the relocation) ----------------
            # Kafka and Schema Registry run on the es4 HOST, not as pods, so the pod must
            # still address them by node IP — but the hop is now node-local rather than
            # crossing the LAN from .252.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "192.168.100.4:9092"
            - name: KAFKA_SCHEMA_REGISTRY_URL
              value: "http://192.168.100.4:8081"
            - name: KAFKA_DATABENTO_SNAPSHOT_TOPIC
              value: "es.options.databento.raw"
            - name: KAFKA_DATABENTO_EVENTS_TOPIC
              value: "es.options.databento.events.raw"
            - name: KAFKA_HPSF_TCBBO_TOPIC
              value: "es.options.opra.tcbbo"
            - name: KAFKA_HPSF_DLQ_TOPIC
              value: "es.options.hpsf.dlq"
            - name: KAFKA_DATABENTO_CONTROL_TOPIC
              value: "es.options.databento.control"
            - name: KAFKA_MARKET_DATA_SELECTION_TOPIC
              value: "es.options.marketdata.selection"
            - name: DATABENTO_CONTROL_GROUP_ID
              value: "es-feed-control"
            # ---- GLBX ES 0DTE options subscription ------------------------------
            - name: DATABENTO_DATASET
              value: "GLBX.MDP3"
            - name: DATABENTO_SYMBOLOGY
              value: "glbx-parent"   # ES.OPT parent resolution (new feed code; default "osi" = SPX path)
            # ES 0DTE/weekly options are NOT under ES.OPT (quarterly/monthly only) — they live under
            # day-of-week weekly parents: Mon E1A-E5A, Tue E1B-E5B, Wed E1C-E5C, Thu E1D-E5D, Fri EW1-EW5,
            # plus EOM EW. Resolve the whole set in one parent query (Databento ignores parents that
            # don't list on a given day); the asset filter stays on DATABENTO_SYMBOL=ES.
            - name: DATABENTO_OPTION_PARENTS
              value: "ES,EW,E1A,E2A,E3A,E4A,E5A,E1B,E2B,E3B,E4B,E5B,E1C,E2C,E3C,E4C,E5C,E1D,E2D,E3D,E4D,E5D,EW1,EW2,EW3,EW4,EW5"
            # GLBX.MDP3 has no cbbo-1s/tcbbo (OPRA-only, multi-venue). Use the single-venue GLBX
            # equivalents: bbo-1s (quote) + tbbo (trade+quote). Same record fields; the feed maps
            # BBOMsg->cbbo path and MBP1Msg->tcbbo path.
            - name: DATABENTO_CBBO_SCHEMA
              value: "bbo-1s"
            - name: DATABENTO_TCBBO_SCHEMA
              value: "tbbo"
            - name: DATABENTO_SYMBOL
              value: "ES"
            # GLBX ES options trade the near-24h Globex session, but the feed's options
            # subscription is gated on the OPRA/equity calendar (9:30-16:00 ET) — so it idled
            # ES overnight ("Market closed; idling both OPRA and ES"). Disable the equity-hours
            # gate: always subscribe; Databento just goes quiet during the Globex maintenance
            # break / weekend closure. This feed is GLBX-dedicated, so no OPRA session applies.
            - name: DATABENTO_MARKET_HOURS_ENABLED
              value: "false"
            - name: DATABENTO_TRADING_CLASS
              value: "ES"   # never the SPXW default (Codex blocker #2); glbx-parent resolution keys on symbol.OPT
            - name: DATABENTO_EXPIRY
              value: "AUTO"
            # Roll the ES 0DTE expiry to the next trade date at 17:30 ET — inside the 17:00-18:00 ET
            # CME maintenance break, so ES + SPX flip together (SPX now also rolls at 17:30) and are
            # ready before the 18:00 ET Globex reopen. (Trade-off: 16:00-17:30 the just-expired 0DTE
            # is still shown for ~90 min.) NOT at midnight ET and NOT at the 18:00 ET session reopen.
            # expiry (a) never freezes the chain on the dead contracts, and (b) gives the feed the
            # full 16:00->18:00 ET window (incl. the 17:00-18:00 ET CME maintenance break) to
            # re-resolve + resubscribe the next 0DTE, so it is READY before the session reopens
            # rather than resetting the book mid-open. Feed PR#60. Empty on SPX (whose 9:30-16:00 ET
            # session never crosses midnight; SPX now aligns to this same 17:30 roll for ES-gamma-on-SPX).
            - name: DATABENTO_EXPIRY_ROLL_AFTER
              value: "17:30"
            - name: DATABENTO_MIN_STRIKE
              value: "5000"
            - name: DATABENTO_MAX_STRIKE
              value: "8000"
            - name: DATABENTO_STRIKE_STEP
              value: "5"
            # ---- ES future's trades are NOT subscribed here (no double subscription)
            - name: DATABENTO_HPSF_ES_TRADES_ENABLED
              value: "false"
            # ---- SPX publishers OFF: this is an ES options feed. Leaving the SPX price
            #      publisher on defaults HPSF_SPX_SPOT_SOURCE to STATIC_DEV, which config.py
            #      validate() forbids under APP_PROFILE=prod (feed refuses boot). The ES
            #      underlying reaches processing via the mirrored es.underlying.es.trades +
            #      the canonicalSpot embedded in option snapshots — no SPX spot is published.
            - name: DATABENTO_HPSF_SPX_PRICE_ENABLED
              value: "false"
            - name: KAFKA_UNDERLYING_PRICE_ENABLED
              value: "false"
            # ---- ES spot = the ES future's OWN traded price, verbatim -----------
            # ES options settle on the ES future, so its last trade IS the underlying spot —
            # no cost-of-carry, no put-call parity (that's the SPX ES-basis path). ES_TRADE
            # selects EsFutureSpotProvider (proc feed PR#59): the ES-trades source below feeds
            # it, and the price is stamped verbatim as canonicalSpot on the option snapshots.
            # Without this the source defaulted to STATIC -> canonicalSpot 0 -> UI Spot 0.00
            # and ATM stuck at the 5000 default.
            - name: DATABENTO_SPOT_SOURCE
              value: "ES_TRADE"
            # ---- ES price source: consume prod's underlying.es.trades ------------
            # ⚠️ This is now the ONLY cross-LAN dependency, and it is a CONSUME (single
            # partition, ~3M records) rather than a produce under acks=all — the favourable
            # direction of the trade (design ESM-R29). The ES future's trades are still
            # subscribed from Databento exactly ONCE, by the prod SPX feed, never twice.
            - name: ES_TRADES_SOURCE_ENABLED
              value: "true"
            - name: ES_TRADES_SOURCE_BOOTSTRAP
              value: "192.168.100.252:9092"
            - name: ES_TRADES_SOURCE_TOPIC
              value: "underlying.es.trades"
            # Group id is INTENTIONALLY unchanged from the prod-cluster deployment: on cutover the
            # relocated feed resumes from the committed offset instead of re-consuming ~3M records
            # or skipping a gap. Because the group is shared, the two locations must never run
            # concurrently — they would split the single partition and only one would see trades.
            # The deploy preflight in Jenkinsfile.es4-deploy enforces that.
            - name: ES_TRADES_SOURCE_GROUP_ID
              value: "es-feed-spot"
            # ---- compacted ES spot-price topic (feed PR #63) ---------------------
            # Republish the ES future price (from ES_TRADES_SOURCE above) as a compacted,
            # "ES"-keyed es.underlying.es.price — the spot TOPIC an es4 strike-intelligence
            # instance reads (its spot global store reads a price topic, not canonicalSpot).
            - name: ES_PRICE_ENABLED
              value: "true"
            - name: ES_PRICE_TOPIC
              value: "es.underlying.es.price"
            # ---- misc ------------------------------------------------------------
            - name: APP_PROFILE
              value: "prod"
            # ---- data-freshness liveness (feed repo monitoring.py) ----------------
            # ES trades on CME Globex ~23h/day; the default RTH session model left the
            # freshness gate blind overnight — exactly when the 2026-07-17 half-wedge
            # (options publisher dead, spot alive) went unrestarted. GLBX dataset already
            # auto-selects the globex session; stale/grace are widened for the THIN
            # overnight tape (quote gaps minutes long are normal at 3am ET) and the
            # statistics-replay catch-up a fresh boot performs before first live publish.
            - name: DATABENTO_FEED_LIVENESS_SESSION
              value: "globex"
            - name: DATABENTO_FEED_LIVENESS_STALE_SECONDS
              value: "120"
            # ⚠️ INTERIM (Phase 1) — 300s was the exact budget that killed this pod 8 times on
            # 2026-07-24: grace 300s + 3 x 30s probe failures = 390s, while the statistics
            # catch-up had not yet produced its first quote publish. 2000 ms publishing (down
            # from the inherited 250 ms) cuts that catch-up work ~8x, but the probe must not be
            # able to SIGKILL mid-catch-up. Widened to 1800s.
            # ⚠️ This is NOT the real fix, and on its own it is the failure mode requirement
            # DBP-R12 explicitly rejects: a wider grace can mask a client that is hours behind
            # and still back-pressuring Databento. It is acceptable ONLY because (a) this
            # deployment sits at replicas 0 pending authorized validation, and (b) source-age
            # alerting (DBP-R9/R11) is a Phase-2 deliverable that must land before sustained
            # running. Do not treat "no restarts" as health.
            - name: DATABENTO_FEED_LIVENESS_STARTUP_GRACE_SECONDS
              value: "1800"
          ports:
            - name: metrics
              containerPort: 8010
          # Liveness was NEVER wired here — the feed exposed /health/live but no probe called
          # it, so a wedged feed ran forever (fleet-liveness convention, 2026-07-17).
          livenessProbe:
            httpGet:
              path: /health/live
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { memory: "1536Mi" }
