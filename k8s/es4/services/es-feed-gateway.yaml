# ES feed-gateway on es4. Same options-edge-feed-gateway binary as prod; env-only divergence.
# Reads es.* topics from the .4 Kafka/SchemaRegistry via TOPIC_PREFIX (es4-common-env) — the
# gateway applies TOPIC_PREFIX to every _TOPIC value (GatewaySettings, PR #73). WS handshake is
# Keycloak-protected against the PRODUCTION realm (auth.bleadingoptions.com). Exposed on NodePort 30091
# so the ES web (NodePort 30080) can open ws://192.168.100.4:30091/ws/events.
# Deploy ONLY via Jenkinsfile.es4-deploy (digest-pins :prod before apply).
apiVersion: v1
kind: Service
metadata:
  name: es-feed-gateway
  namespace: options-edge
  labels:
    app.kubernetes.io/name: es-feed-gateway
    app.kubernetes.io/part-of: options-edge
spec:
  type: NodePort
  ports:
  - name: http
    port: 18091
    targetPort: http
    nodePort: 30091
  selector:
    app.kubernetes.io/name: es-feed-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-feed-gateway
  namespace: options-edge
  labels:
    app.kubernetes.io/name: es-feed-gateway
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: es-feed-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: es-feed-gateway
        app.kubernetes.io/part-of: options-edge
    spec:
      # Durable fix for the boot-time "Timeout expired while fetching topic metadata" race: the gateway
      # (k3s) can start before es4-kafka / schema-registry (docker-compose on the .4 HOST) are serving —
      # e.g. after a host reboot where k3s comes up before the compose stack. Its Kafka consumers then
      # time out on the first metadata fetch and recover only slowly (once left es.options.databento.gex.strike
      # unsubscribed ~2h -> GEX blank on the ES UI). Gate startup on BOTH deps being ready so the first
      # metadata fetch succeeds and every topic (incl. the 32-partition gex.strike) is subscribed at boot.
      initContainers:
      # Reuse the gateway image (already present + digest-pinned by es4-deploy — a foreign image like
      # busybox is NOT anchorable to a prod-registry sha256 and fail-closes the pin step). It ships
      # bash + curl, so bash /dev/tcp checks the kafka broker port and curl checks SR /subjects (a 200
      # implies kafka is up, since SR depends on it).
      - name: wait-for-kafka-sr
        image: 192.168.100.252:5000/options-edge-feed-gateway:prod
        command:
        - bash
        - -c
        - |
          until (echo > /dev/tcp/192.168.100.4/9092) 2>/dev/null; do echo "waiting for kafka 192.168.100.4:9092"; sleep 2; done
          until curl -sf -o /dev/null http://192.168.100.4:8081/subjects; do echo "waiting for schema-registry 192.168.100.4:8081"; sleep 2; done
          echo "kafka + schema-registry reachable"
      containers:
      - name: feed-gateway
        image: 192.168.100.252:5000/options-edge-feed-gateway:prod
        ports:
        - name: http
          containerPort: 18091
        env:
        - name: APP_WEB_PORT
          value: "18091"
        - name: KAFKA_VIX_OPTION_INTELIGENCE_TOPIC
          value: options.spx.vix-option-inteligence-service.current
        # spread-skew on es4 emits options.es.* (proc PR#316 relabel) — point the gateway's two skew
        # subscriptions there (TOPIC_PREFIX then yields es.options.es.spread-skew.*).
        - name: KAFKA_SPREAD_SKEW_TOPIC
          value: options.es.spread-skew.current
        - name: KAFKA_SPREAD_SKEW_EVENTS_TOPIC
          value: options.es.spread-skew.events
        # Option Truth emits an ES-labelled base topic on this cluster. TOPIC_PREFIX from
        # es4-common-env then isolates it as es.options.es.option-truth-engine-service.by-strike.
        - name: KAFKA_OPTION_TRUTH_BY_STRIKE_TOPIC
          value: options.es.option-truth-engine-service.by-strike
        # ES-only continuous native futures buyer/seller flow card. The gateway code keeps this opt-in
        # so the SPX production cluster never requires the ES-only topic.
        - name: GATEWAY_ES_AGGRESSOR_FLOW_ENABLED
          value: "true"
        - name: KAFKA_ES_AGGRESSOR_FLOW_TOPIC
          value: futures.aggressor-flow
        # es4 serves ES, not SPX: the gateway's active market-data selection symbol is IB_SYMBOL
        # (default SPX). Without this the selection is SPX and the ES option records (underlying=ES)
        # never match -> empty chain even at market open. IB_EXPIRY stays unset = AUTO (0DTE daily roll).
        - name: IB_SYMBOL
          value: "ES"
        # Roll the AUTO 0DTE expiry to the next trade date at 17:30 ET (mirrors the es-feed + SPX).
        # Without this the gateway keeps activeSelection on the just-expired date and drops the feed's
        # next-expiry records until midnight ET, freezing the chain all evening (gateway PR#74).
        - name: IB_EXPIRY_ROLL_AFTER
          value: "17:30"
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms256m -Xmx1536m"
        # Flow Explorer (/api/pin-flow) default strike band. The gateway's built-in default is a
        # hardcoded SPX-era 7490..7590 — only 100 points wide and NOT centred on spot, so on ES
        # (spot ~7500, strikes 6850..7755) it started AT the spot and looked only upward: ~28% of
        # rows, with every put below the spot excluded. Widen to cover the live ES strike ladder
        # (gateway caps band width at 1000). Superseded once the band is derived from spot.
        - name: PIN_FLOW_STRIKE_LO
          value: "7000"
        - name: PIN_FLOW_STRIKE_HI
          value: "7800"
        # ES trades 18:00 ET -> 17:00 ET the NEXT day. The gateway's default pin-flow window is the SPX
        # cash session (09:30..16:01 ET), so an ES request in the evening resolved to a window where ES
        # was CLOSED (zero rows) and the Flow Explorer showed nothing for ES's main trading hours. These
        # make the window span midnight; the gateway rolls the end to date+1 and resolves the live
        # session date (gateway PR #90).
        - name: PIN_FLOW_SESSION_START
          value: "18:00"
        - name: PIN_FLOW_SESSION_END
          value: "17:00"
        # WS handshake auth against the PRODUCTION Keycloak realm.
        - name: WS_AUTH_ENABLED
          value: "true"
        - name: WS_AUTH_ISSUER_URI
          value: "https://auth.bleadingoptions.com/realms/optionsedge"
        - name: WS_AUTH_AUDIENCE
          value: "options-edge-web"
        # Browser origins of the ES web UI. Public edge origin first; the LAN NodePort origin is
        # kept for direct-on-.4 debugging. (fullfunding.nl retired 2026-08-08.)
        - name: WS_ALLOWED_ORIGINS
          value: "https://es.bleadingoptions.com,http://192.168.100.4:30080"
        # Multi-tenant session auth (Redis-backed) stays OFF — only the Keycloak WS bearer is used.
        - name: GATEWAY_AUTH_ENABLED
          value: "false"
        envFrom:
        - configMapRef:
            name: es4-base-env
        - configMapRef:
            name: es4-common-env
        - secretRef:
            name: es4-runtime-secrets
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            memory: "1536Mi"
