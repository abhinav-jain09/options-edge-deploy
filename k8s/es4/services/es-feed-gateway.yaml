# ES feed-gateway on es4. Same options-edge-feed-gateway binary as prod; env-only divergence.
# Reads es.* topics from the .4 Kafka/SchemaRegistry via TOPIC_PREFIX (es4-common-env) — the
# gateway applies TOPIC_PREFIX to every _TOPIC value (GatewaySettings, PR #73). WS handshake is
# Keycloak-protected against the PRODUCTION realm (auth.bleadingoptions.com). Exposed on NodePort 30091
# so the ES web (NodePort 30080) can open ws://192.168.100.4:30091/ws/events.
# Deploy ONLY via Jenkinsfile.es4-deploy (digest-pins :prod before apply).
apiVersion: v1
kind: Service
metadata:
  name: es-feed-gateway
  namespace: options-edge
  labels:
    app.kubernetes.io/name: es-feed-gateway
    app.kubernetes.io/part-of: options-edge
spec:
  type: NodePort
  ports:
  - name: http
    port: 18091
    targetPort: http
    nodePort: 30091
  selector:
    app.kubernetes.io/name: es-feed-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-feed-gateway
  namespace: options-edge
  labels:
    app.kubernetes.io/name: es-feed-gateway
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: es-feed-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: es-feed-gateway
        app.kubernetes.io/part-of: options-edge
    spec:
      # Durable fix for the boot-time "Timeout expired while fetching topic metadata" race: the gateway
      # (k3s) can start before es4-kafka / schema-registry (docker-compose on the .4 HOST) are serving —
      # e.g. after a host reboot where k3s comes up before the compose stack. Its Kafka consumers then
      # time out on the first metadata fetch and recover only slowly (once left es.options.databento.gex.strike
      # unsubscribed ~2h -> GEX blank on the ES UI). Gate startup on BOTH deps being ready so the first
      # metadata fetch succeeds and every topic (incl. the 32-partition gex.strike) is subscribed at boot.
      initContainers:
      # Reuse the gateway image (already present + digest-pinned by es4-deploy — a foreign image like
      # busybox is NOT anchorable to a prod-registry sha256 and fail-closes the pin step). It ships
      # bash + curl, so bash /dev/tcp checks the kafka broker port and curl checks SR /subjects (a 200
      # implies kafka is up, since SR depends on it).
      - name: wait-for-kafka-sr
        image: 192.168.100.252:5000/options-edge-feed-gateway:prod
        command:
        - bash
        - -c
        - |
          until (echo > /dev/tcp/192.168.100.4/9092) 2>/dev/null; do echo "waiting for kafka 192.168.100.4:9092"; sleep 2; done
          until curl -sf -o /dev/null http://192.168.100.4:8081/subjects; do echo "waiting for schema-registry 192.168.100.4:8081"; sleep 2; done
          echo "kafka + schema-registry reachable"
      containers:
      - name: feed-gateway
        image: 192.168.100.252:5000/options-edge-feed-gateway:prod
        ports:
        - name: http
          containerPort: 18091
        env:
        - name: APP_WEB_PORT
          value: "18091"
        # The es4 heatmap service creates its dashboard topic with the 32-partition default
        # (KAFKA_TOPIC_PARTITIONS_DEFAULT=32), and topics.env (OPTIONS_EDGE_ES4_TOPICS) declares it
        # at 32 too. Calibrate the gateway's liquidity-history topology guard to expect 32 so it does
        # not WARN a false 4-vs-actual policy drift.
        - name: HEATMAP_HISTORY_EXPECTED_PARTITIONS
          value: "32"
        - name: KAFKA_VIX_OPTION_INTELIGENCE_TOPIC
          value: options.spx.vix-option-inteligence-service.current
        # spread-skew on es4 emits options.es.* (proc PR#316 relabel) — point the gateway's two skew
        # subscriptions there (TOPIC_PREFIX then yields es.options.es.spread-skew.*).
        - name: KAFKA_SPREAD_SKEW_TOPIC
          value: options.es.spread-skew.current
        - name: KAFKA_SPREAD_SKEW_EVENTS_TOPIC
          value: options.es.spread-skew.events
        # Option Truth emits an ES-labelled base topic on this cluster. TOPIC_PREFIX from
        # es4-common-env then isolates it as es.options.es.option-truth-engine-service.by-strike.
        - name: KAFKA_OPTION_TRUTH_BY_STRIKE_TOPIC
          value: options.es.option-truth-engine-service.by-strike
        # ES-only continuous native futures buyer/seller flow card. The gateway code keeps this opt-in
        # so the SPX production cluster never requires the ES-only topic.
        - name: GATEWAY_ES_AGGRESSOR_FLOW_ENABLED
          value: "true"
        - name: KAFKA_ES_AGGRESSOR_FLOW_TOPIC
          value: futures.aggressor-flow
        # ES CVD stream (Gate 2 of ES-CVD-DESIGN.md): live 1 Hz snapshot + compacted bar-close
        # records, published by es-cvd-service on this cluster. Opt-in for the same reason as the
        # aggressor card — the ES-only topics do not exist on the SPX production cluster. Topic
        # names are unprefixed; the gateway's TOPIC_PREFIX=es. resolves them to es.futures.cvd*.
        - name: GATEWAY_ES_CVD_ENABLED
          value: "true"
        - name: KAFKA_ES_CVD_TOPIC
          value: futures.cvd
        - name: KAFKA_ES_CVD_BARS_TOPIC
          value: futures.cvd.bars
        # ES Footprint relay (ES-FOOTPRINT-GATEWAY-DESIGN.md G-R1..G-R11). Same opt-in reason as the
        # CVD block above, and the same unprefixed names — TOPIC_PREFIX=es. resolves them to
        # es.futures.footprint*. These topics are NATIVE here: es-cvd-service publishes them on this
        # cluster, so unlike dev and prod there is no mirror in the path.
        #
        # G-R8a is fail-closed — a topic whose effective max.message.bytes exceeds the ceiling or
        # whose compression.type is not producer/uncompressed makes the gateway REFUSE TO START, as
        # do the three HotSpot layout flags the retained-heap arithmetic depends on. All verified on
        # es4 before enabling: every one of the four topics reads compression.type=producer and
        # max.message.bytes=1048588 (equal to the ceiling, and the check rejects only ABOVE it), and
        # UseCompressedOops / UseCompressedClassPointers / CompactStrings are all true on the
        # running JVM.
        - name: GATEWAY_ES_FOOTPRINT_ENABLED
          value: "true"
        - name: KAFKA_ES_FOOTPRINT_TOPIC
          value: futures.footprint
        - name: KAFKA_ES_FOOTPRINT_EVIDENCE_TOPIC
          value: futures.footprint.evidence
        - name: KAFKA_ES_FOOTPRINT_BARS_TOPIC
          value: futures.footprint.bars
        - name: KAFKA_ES_FOOTPRINT_OUTCOMES_TOPIC
          value: futures.footprint.outcomes
        # ES-FOOTPRINT-STRIKE-INTERACTION.md R3: the fifth footprint stream, NATIVE here (es-footprint-strike
        # publishes futures.footprint.strike on this broker; TOPIC_PREFIX resolves it to es.futures.footprint.strike).
        - name: KAFKA_ES_FOOTPRINT_STRIKE_TOPIC
          value: futures.footprint.strike
        # G-R8 requires this and the producer's FOOTPRINT_MAX_RECORD_BYTES to be ONE value, set
        # together. Both defaults are 262144, so they agreed only by coincidence of two independent
        # defaults — a change to either side alone would have silently broken the bound the whole
        # retained-heap argument rests on. Pinned explicitly on both sides; see the matching entry in
        # k8s/es4/services/es-cvd.yaml. MOVE THEM TOGETHER OR NOT AT ALL.
        - name: GATEWAY_ES_FOOTPRINT_MAX_RECORD_BYTES
          value: "262144"
        # SPX Auction Desk (es-amt-service on this cluster): one payload per RTH minute keyed
        # <tradeDate>|<HH:mm>. Opt-in like the CVD stream. Unprefixed: TOPIC_PREFIX=es. resolves
        # it to es.futures.auction, the name Jenkinsfile.es-auction-mirror copies to dev and prod.
        - name: GATEWAY_ES_AUCTION_ENABLED
          value: "true"
        - name: KAFKA_ES_AUCTION_TOPIC
          value: futures.auction
        # es4 serves ES, not SPX: the gateway's active market-data selection symbol is IB_SYMBOL
        # (default SPX). Without this the selection is SPX and the ES option records (underlying=ES)
        # never match -> empty chain even at market open. The 0DTE daily roll comes from es4-base-env's
        # IB_EXPIRY: "AUTO" — the LITERAL string, not an unset value: GatewaySettings.isAutoExpiry treats
        # blank as NOT auto (the handshake then fails closed on a blank expiry), so clearing that key
        # would stop the roll AND break every WS connection. Do not "tidy" it away.
        - name: IB_SYMBOL
          value: "ES"
        # Roll the AUTO 0DTE expiry to the next trade date at 17:30 ET (mirrors the es-feed + SPX).
        # Without this the gateway keeps activeSelection on the just-expired date and drops the feed's
        # next-expiry records until midnight ET, freezing the chain all evening (gateway PR#74).
        - name: IB_EXPIRY_ROLL_AFTER
          value: "17:30"
        # The gateway resolves its session calendar from its OWN keys, NOT from the HPSF_MARKET_* pair
        # es4-base-env carries. Without these the calendar was EMPTY: on 2026-09-07 (Labor Day) the
        # gateway treated the holiday as a session, AUTO-resolved the expiry to 20260907, and rejected
        # every 20260908 record the ES feed published as belonging to an inactive expiry —
        # inactiveDroppedEvents into the millions, UI connected to a chain that stayed blank all day.
        # The gateway now also falls back to HPSF_MARKET_* when these are unset, but keep these
        # explicit: HPSF is being retired (PR #995) and those keys may not outlive it. Refresh both
        # pairs together from the annual OPRA/NYSE schedule.
        - name: GATEWAY_MARKET_HOLIDAYS
          value: "2026-01-01,2026-01-19,2026-02-16,2026-04-03,2026-05-25,2026-06-19,2026-07-03,2026-09-07,2026-11-26,2026-12-25"
        - name: GATEWAY_MARKET_EARLY_CLOSES
          value: "2026-11-27=13:00,2026-12-24=13:00"
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms256m -Xmx1536m"
        # Flow Explorer (/api/pin-flow) default strike band. The gateway's built-in default is a
        # hardcoded SPX-era 7490..7590 — only 100 points wide and NOT centred on spot, so on ES
        # (spot ~7500, strikes 6850..7755) it started AT the spot and looked only upward: ~28% of
        # rows, with every put below the spot excluded. Widen to cover the live ES strike ladder
        # (gateway caps band width at 1000). Superseded once the band is derived from spot.
        - name: PIN_FLOW_STRIKE_LO
          value: "7000"
        - name: PIN_FLOW_STRIKE_HI
          value: "7800"
        # ES trades 18:00 ET -> 17:00 ET the NEXT day. The gateway's default pin-flow window is the SPX
        # cash session (09:30..16:01 ET), so an ES request in the evening resolved to a window where ES
        # was CLOSED (zero rows) and the Flow Explorer showed nothing for ES's main trading hours. These
        # make the window span midnight; the gateway rolls the end to date+1 and resolves the live
        # session date (gateway PR #90).
        - name: PIN_FLOW_SESSION_START
          value: "18:00"
        - name: PIN_FLOW_SESSION_END
          value: "17:00"
        # WS handshake auth against the PRODUCTION Keycloak realm.
        - name: WS_AUTH_ENABLED
          value: "true"
        - name: WS_AUTH_ISSUER_URI
          value: "https://auth.bleadingoptions.com/realms/optionsedge"
        - name: WS_AUTH_AUDIENCE
          value: "options-edge-web"
        # Browser origins of the ES web UI. Public edge origin first; the LAN NodePort origin is
        # kept for direct-on-.4 debugging. (fullfunding.nl retired 2026-08-08.)
        - name: WS_ALLOWED_ORIGINS
          value: "https://es.bleadingoptions.com,http://192.168.100.4:30080"
        # Multi-tenant session auth (Redis-backed) stays OFF — only the Keycloak WS bearer is used.
        - name: GATEWAY_AUTH_ENABLED
          value: "false"
        envFrom:
        - configMapRef:
            name: es4-base-env
        - configMapRef:
            name: es4-common-env
        - secretRef:
            name: es4-runtime-secrets
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
        # The limit was EQUAL to the heap: limit == Xmx == 1536Mi. That is not a tight budget, it
        # is an absent one — metaspace, code cache, thread stacks and direct/socket buffers all live
        # OUTSIDE -Xmx, so the container can be OOM-killed on native growth the heap never sees. No
        # amount of GC tuning, and no alarm that watches heap occupancy, can see that coming while
        # Xmx == limit; the only other way out would be to LOWER -Xmx, which buys native headroom by
        # taking it from the heap. G-R8 (options-edge-feed-gateway/ES-FOOTPRINT-GATEWAY-DESIGN.md)
        # states the rule as limit - Xmx >= 512 MiB; this manifest violated it outright, and it does
        # so today with the footprint relay OFF. Fixed here on that ground alone.
        #
        # Measured on es-feed-gateway-755c5544d5-6ftk6 (6h53m, CVD on, footprint off), from the
        # container itself rather than a sampled `kubectl top`:
        #   cgroup memory.peak  668 426 240 B = 638 MiB
        #   cgroup memory.current 665 686 016 B = 635 MiB
        #   /proc/1 VmHWM       664 432 KiB    = 649 MiB   (pid 1 is the only real process)
        # Only ONE G-R8 quantity is derivable from these: working set = memory.current -
        # inactive_file <= memory.current, and memory.peak is the high-water of memory.current, so
        #   W_peak <= 638 MiB   ->   limit - W_peak >= 2560 - 638 = 1922 MiB
        # H_peak is NOT derivable here. G-R8 defines it as peak jvm_memory_bytes_used{area="heap"},
        # which counts USED heap bytes; those need not all be resident, so process RSS does not
        # bound it and VmHWM proves nothing about it. This manifest therefore makes no claim about
        # Xmx - H_peak. That inequality belongs to the enablement change, which needs the real heap
        # series anyway.
        # (VmHWM exceeds memory.peak by ~12 MB, and VmRSS exceeds memory.current by the same amount
        # on a re-read. The cause was NOT established and no mechanism is claimed for it; it does not
        # affect the W_peak bound, which comes from the cgroup counters alone.)
        #   limit - Xmx = 2560 - 1536 = 1024 MiB   (the inequality that was violated)
        #
        # NOT sufficient to enable the footprint relay. G-R8's deployment contingency requires
        # H_peak from jvm_memory_bytes_used{area="heap"} and W_peak from
        # container_memory_working_set_bytes, over a FULL ES session. This gateway exports no JVM
        # heap series on :18091, and 2026-09-07 is in GATEWAY_MARKET_HOLIDAYS above — a shortened
        # holiday session. Enablement is a separate change, after a regular session.
        #
        # requests.memory rises with it: 512Mi sits below this pod's observed usage — 635 MiB at the
        # single point in time above; no claim is made about every moment of its life. While usage is
        # above the request the kubelet's memory eviction ranking counts the pod as over-request, and
        # raising the request above the observed baseline improves that ranking. It does NOT change
        # the QoS class — the
        # pod stays Burstable (memory request < limit, cpu request with no limit, and the
        # wait-for-kafka-sr init container declares neither) and remains an eviction candidate. The
        # es4 node is at 24% of allocatable requests (15 628 MiB of 63.6 GiB), so 256 MiB is
        # affordable; declared limit overcommit goes from ~107% to ~109%, which this node already
        # runs at with 35 GiB actually free.
        resources:
          requests:
            cpu: "250m"
            memory: "768Mi"
          limits:
            memory: "2560Mi"
