# ES session-anchored Cumulative Volume Delta. Deploy via Jenkinsfile.es4-deploy.
# Cross-env wiring (ES-CVD-DESIGN.md 6a): the ES tape and output topics live on the es4 broker;
# the TRUE SPX index feed lives on the dev broker — ES_CVD_SPX_BOOTSTRAP_SERVERS points there.
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: '8141'
    prometheus.io/scrape: 'true'
  labels:
    app.kubernetes.io/name: es-cvd-service
    app.kubernetes.io/part-of: options-edge
  name: es-cvd-service
  namespace: options-edge
spec:
  ports:
  - name: health
    port: 8141
    targetPort: health
  selector:
    app.kubernetes.io/name: es-cvd-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: es-cvd-service
    app.kubernetes.io/part-of: options-edge
  name: es-cvd-service
  namespace: options-edge
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: es-cvd-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: es-cvd-service
        app.kubernetes.io/part-of: options-edge
    spec:
      # The dev broker advertises host.docker.internal:19092 (a Docker-Desktop-on-the-Mac name).
      # Bootstrap reaches 192.168.100.102 fine, but the ADVERTISED listener is what the client must
      # dial for fetches — unresolvable from this cluster without this alias. Scoped to this pod:
      # nothing else on es4 consumes the dev broker.
      hostAliases:
      - ip: "192.168.100.102"
        hostnames:
        - "host.docker.internal"
      containers:
      - name: es-cvd
        image: 192.168.100.252:5000/options-edge-es-cvd:prod
        env:
        - name: JAVA_TOOL_OPTIONS
          value: -Xms128m -Xmx768m
        - name: HEALTH_PORT
          value: '8141'
        - name: ES_CVD_BOOTSTRAP_SERVERS
          value: 192.168.100.4:9092
        - name: ES_CVD_SPX_BOOTSTRAP_SERVERS
          value: 192.168.100.102:19092
        - name: KAFKA_ES_TRADES_TOPIC
          value: underlying.es.trades
        - name: KAFKA_SPX_INDEX_PRICE_TOPIC
          value: underlying.spx.index.price
        - name: KAFKA_ES_CVD_TOPIC
          value: futures.cvd
        - name: KAFKA_ES_CVD_BARS_TOPIC
          value: futures.cvd.bars
        - name: ES_CVD_GROUP_ID
          value: es-cvd-service
        - name: ES_CVD_SYMBOL
          value: ES.v.0
        - name: ES_CVD_SPX_SYMBOL
          value: SPX
        - name: ES_CVD_SESSION_ZONE
          value: America/New_York
        - name: ES_CVD_SESSION_START
          value: '18:00'
        - name: ES_CVD_PUBLISH_INTERVAL_MS
          value: '1000'
        - name: ES_CVD_REPLAY_LOOKBACK_HOURS
          value: '24'
        - name: ES_CVD_GRACE_PERIOD_MS
          value: '2000'
        - name: ES_CVD_IDLE_TIMEOUT_MS
          value: '10000'
        - name: ES_CVD_MAX_FUTURE_SKEW_MS
          value: '5000'
        - name: ES_CVD_STALE_AFTER_MS
          value: '5000'
        - name: ES_CVD_SPX_STALE_AFTER_MS
          value: '30000'
        envFrom:
        - configMapRef:
            name: es4-base-env
        - configMapRef:
            name: es4-common-env
        - secretRef:
            name: es4-runtime-secrets
        ports:
        - containerPort: 8141
          name: health
        livenessProbe:
          httpGet:
            path: /health/live
            port: health
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health/ready
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
