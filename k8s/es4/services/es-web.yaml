# ES web UI on es4. Same options-edge-web binary as prod; env-only divergence — points at the ES
# feed-gateway (NodePort 30091 on the .4 node) and the PRODUCTION Keycloak realm. Exposed on
# NodePort 30080: open http://192.168.100.4:30080 on the LAN.
# Deploy ONLY via Jenkinsfile.es4-deploy (digest-pins :prod before apply).
apiVersion: v1
kind: Service
metadata:
  name: es-web
  namespace: options-edge
  labels:
    app.kubernetes.io/name: es-web
    app.kubernetes.io/part-of: options-edge
spec:
  type: NodePort
  ports:
  - name: http
    port: 8080
    targetPort: http
    nodePort: 30080
  selector:
    app.kubernetes.io/name: es-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-web
  namespace: options-edge
  labels:
    app.kubernetes.io/name: es-web
    app.kubernetes.io/part-of: options-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: es-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: es-web
        app.kubernetes.io/part-of: options-edge
    spec:
      containers:
      - name: web
        image: 192.168.100.252:5000/options-edge-web:prod
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: APP_PROFILE
          value: "prod"
        - name: APP_WEB_PORT
          value: "8080"
        - name: APP_MARKET_DATA_SOURCE
          value: "DATABENTO"
        # es4 UI defaults to the ES symbol (AppConfig reads IB_SYMBOL, default SPX) so the chain
        # selects ES and matches the gateway's ES selection.
        - name: IB_SYMBOL
          value: "ES"
        - name: DEALER_LEDGER_UI_VISIBLE
          value: "true"
        # PRODUCTION Keycloak auth (same realm + client + audience as prod).
        - name: VITE_AUTH_ENABLED
          value: "true"
        - name: VITE_AUTH_ISSUER
          value: "https://auth.fullfunding.nl/realms/optionsedge"
        - name: VITE_AUTH_CLIENT_ID
          value: "options-edge-web"
        - name: VITE_AUTH_AUDIENCE
          value: "options-edge-web"
        - name: AUTH_AUDIENCE
          value: "options-edge-web"
        # Browser-facing URLs go through the public edge (Cloudflare -> cloudflared -> ES svcs on .4),
        # so they are https/wss on es.fullfunding.nl. TLS terminates at Cloudflare; the tunnel forwards
        # /ws/events -> ES gateway and everything else -> ES web.
        - name: APP_FEED_GATEWAY_WS_URL
          value: "wss://es.fullfunding.nl/ws/events"
        - name: VITE_WS_URL
          value: "wss://es.fullfunding.nl/ws/events"
        # Server-to-server gateway health stays on the in-cluster LAN address (both pods on .4).
        - name: APP_FEED_GATEWAY_HEALTH_URL
          value: "http://192.168.100.4:30091/health"
        - name: VITE_API_BASE_URL
          value: "https://es.fullfunding.nl"
        # Required-in-prod by RuntimeProfileConfig.validate(). No mission-control/replay backend runs
        # on es4, so these point at the UI's own https origin to satisfy validation (features inert).
        - name: VITE_MISSION_CONTROL_URL
          value: "https://es.fullfunding.nl"
        - name: VITE_REPLAY_ORCHESTRATOR_URL
          value: "https://es.fullfunding.nl"
        # Per-strike delta-flow freshness TTL (ms). ES 0DTE overnight trades far more sparsely than SPX,
        # so the 90s default blanks most strikes between prints. Raise it to keep a strike's last session
        # flow visible ~10min; tune up if overnight coverage still looks thin. SPX keeps the 90s default.
        - name: DELTA_FLOW_STALE_MS
          value: "600000"
        envFrom:
        - configMapRef:
            name: es4-base-env
        - configMapRef:
            name: es4-common-env
        - secretRef:
            name: es4-runtime-secrets
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1500m"
            memory: "2Gi"
