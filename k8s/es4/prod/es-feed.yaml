# es-feed — the ES-0DTE-options Databento feed. Runs in the PROD cluster (.252, next to
# prod Kafka) but produces EVERYTHING to the es4 box (192.168.100.4). Gate-2 rev 10 wiring:
#   * subscribes GLBX.MDP3 ES 0DTE OPTIONS ONLY (the ES future's trades are subscribed
#     exactly once, by the existing prod feed — never twice);
#   * consumes prod's underlying.es.trades from prod Kafka (localhost network) to drive
#     canonicalSpot = the ES future's own traded price, verbatim (DATABENTO_SPOT_SOURCE=ES_TRADE
#     -> EsFutureSpotProvider; ES options settle on the future, so no carry/parity is applied);
#   * publishes es.-prefixed topics to es4 Kafka + registers Avro in es4's Schema Registry.
#
# The SPX feed deployment is NOT touched by this file. Same image as the SPX feed
# (options-edge-databento-feed) — behavior is env-only + the es-feed code paths.
# Deploy ONLY via Jenkinsfile.es4-deploy ACTION=deploy-es-feed (digest-pinned).
# PREREQ: the feed repo es-feed changes must be merged + image rebuilt first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-feed
  namespace: options-edge
  labels:
    app.kubernetes.io/name: es-feed
    app.kubernetes.io/part-of: options-edge-es4
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: es-feed
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: es-feed
        app.kubernetes.io/part-of: options-edge-es4
    spec:
      containers:
        - name: es-feed
          image: 192.168.100.252:5000/options-edge-databento-feed:prod
          envFrom:
            - secretRef:
                name: options-edge-databento-feed-env   # DATABENTO_API_KEY (prod key; per-account session limits verified)
          env:
            # ---- outputs -> es4 -------------------------------------------------
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "192.168.100.4:9092"
            - name: KAFKA_SCHEMA_REGISTRY_URL
              value: "http://192.168.100.4:8081"
            - name: KAFKA_DATABENTO_SNAPSHOT_TOPIC
              value: "es.options.databento.raw"
            - name: KAFKA_DATABENTO_EVENTS_TOPIC
              value: "es.options.databento.events.raw"
            - name: KAFKA_HPSF_TCBBO_TOPIC
              value: "es.options.opra.tcbbo"
            - name: KAFKA_HPSF_DLQ_TOPIC
              value: "es.options.hpsf.dlq"
            - name: KAFKA_DATABENTO_CONTROL_TOPIC
              value: "es.options.databento.control"
            - name: KAFKA_MARKET_DATA_SELECTION_TOPIC
              value: "es.options.marketdata.selection"
            - name: DATABENTO_CONTROL_GROUP_ID
              value: "es-feed-control-v1"
            # ---- GLBX ES 0DTE options subscription ------------------------------
            - name: DATABENTO_DATASET
              value: "GLBX.MDP3"
            - name: DATABENTO_SYMBOLOGY
              value: "glbx-parent"   # ES.OPT parent resolution (new feed code; default "osi" = SPX path)
            # ES 0DTE/weekly options are NOT under ES.OPT (quarterly/monthly only) — they live under
            # day-of-week weekly parents: Mon E1A-E5A, Tue E1B-E5B, Wed E1C-E5C, Thu E1D-E5D, Fri EW1-EW5,
            # plus EOM EW. Resolve the whole set in one parent query (Databento ignores parents that
            # don't list on a given day); the asset filter stays on DATABENTO_SYMBOL=ES.
            - name: DATABENTO_OPTION_PARENTS
              value: "ES,EW,E1A,E2A,E3A,E4A,E5A,E1B,E2B,E3B,E4B,E5B,E1C,E2C,E3C,E4C,E5C,E1D,E2D,E3D,E4D,E5D,EW1,EW2,EW3,EW4,EW5"
            # GLBX.MDP3 has no cbbo-1s/tcbbo (OPRA-only, multi-venue). Use the single-venue GLBX
            # equivalents: bbo-1s (quote) + tbbo (trade+quote). Same record fields; the feed maps
            # BBOMsg->cbbo path and MBP1Msg->tcbbo path.
            - name: DATABENTO_CBBO_SCHEMA
              value: "bbo-1s"
            - name: DATABENTO_TCBBO_SCHEMA
              value: "tbbo"
            - name: DATABENTO_SYMBOL
              value: "ES"
            # GLBX ES options trade the near-24h Globex session, but the feed's options
            # subscription is gated on the OPRA/equity calendar (9:30-16:00 ET) — so it idled
            # ES overnight ("Market closed; idling both OPRA and ES"). Disable the equity-hours
            # gate: always subscribe; Databento just goes quiet during the Globex maintenance
            # break / weekend closure. This feed is GLBX-dedicated, so no OPRA session applies.
            - name: DATABENTO_MARKET_HOURS_ENABLED
              value: "false"
            - name: DATABENTO_TRADING_CLASS
              value: "ES"   # never the SPXW default (Codex blocker #2); glbx-parent resolution keys on symbol.OPT
            - name: DATABENTO_EXPIRY
              value: "AUTO"
            # Roll the ES 0DTE expiry to the next trade date the instant today's 0DTE EXPIRES
            # (16:00 ET), NOT at midnight ET and NOT at the 18:00 ET session reopen. Rolling at
            # expiry (a) never freezes the chain on the dead contracts, and (b) gives the feed the
            # full 16:00->18:00 ET window (incl. the 17:00-18:00 ET CME maintenance break) to
            # re-resolve + resubscribe the next 0DTE, so it is READY before the session reopens
            # rather than resetting the book mid-open. Feed PR#60. Empty on SPX (whose 9:30-16:00 ET
            # session never crosses midnight, so midnight-ET rollover is correct there).
            - name: DATABENTO_EXPIRY_ROLL_AFTER
              value: "16:00"
            - name: DATABENTO_MIN_STRIKE
              value: "5000"
            - name: DATABENTO_MAX_STRIKE
              value: "8000"
            - name: DATABENTO_STRIKE_STEP
              value: "5"
            # ---- ES future's trades are NOT subscribed here (no double subscription)
            - name: DATABENTO_HPSF_ES_TRADES_ENABLED
              value: "false"
            # ---- SPX publishers OFF: this is an ES options feed. Leaving the SPX price
            #      publisher on defaults HPSF_SPX_SPOT_SOURCE to STATIC_DEV, which config.py
            #      validate() forbids under APP_PROFILE=prod (feed refuses boot). The ES
            #      underlying reaches processing via the mirrored es.underlying.es.trades +
            #      the canonicalSpot embedded in option snapshots — no SPX spot is published.
            - name: DATABENTO_HPSF_SPX_PRICE_ENABLED
              value: "false"
            - name: KAFKA_UNDERLYING_PRICE_ENABLED
              value: "false"
            # ---- ES spot = the ES future's OWN traded price, verbatim -----------
            # ES options settle on the ES future, so its last trade IS the underlying spot —
            # no cost-of-carry, no put-call parity (that's the SPX ES-basis path). ES_TRADE
            # selects EsFutureSpotProvider (proc feed PR#59): the ES-trades source below feeds
            # it, and the price is stamped verbatim as canonicalSpot on the option snapshots.
            # Without this the source defaulted to STATIC -> canonicalSpot 0 -> UI Spot 0.00
            # and ATM stuck at the 5000 default.
            - name: DATABENTO_SPOT_SOURCE
              value: "ES_TRADE"
            # ---- ES price source: consume prod's underlying.es.trades (new code) -
            - name: ES_TRADES_SOURCE_ENABLED
              value: "true"
            - name: ES_TRADES_SOURCE_BOOTSTRAP
              value: "192.168.100.252:9092"
            - name: ES_TRADES_SOURCE_TOPIC
              value: "underlying.es.trades"
            - name: ES_TRADES_SOURCE_GROUP_ID
              value: "es-feed-spot-v1"
            # ---- compacted ES spot-price topic (feed PR #63) ---------------------
            # Republish the ES future price (from ES_TRADES_SOURCE above) as a compacted,
            # "ES"-keyed es.underlying.es.price — the spot TOPIC an es4 strike-intelligence
            # instance reads (its spot global store reads a price topic, not canonicalSpot).
            - name: ES_PRICE_ENABLED
              value: "true"
            - name: ES_PRICE_TOPIC
              value: "es.underlying.es.price"
            # ---- misc ------------------------------------------------------------
            - name: APP_PROFILE
              value: "prod"
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { memory: "1536Mi" }
