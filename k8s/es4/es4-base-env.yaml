# es4-base-env — the FULL prod options-edge-config carried into es4 as a base layer, MINUS the
# connection/identity keys es4 overrides (those live authoritatively in es4-common-env /
# es4-runtime-secrets, applied AFTER this in envFrom order). This restores the ~170 operational
# keys the lean es4-common-env dropped — notably KAFKA_TOPIC_REPLICATION_FACTOR=1, without which
# every Streams app requests RF=3 against the single es4 broker and crash-loops
# (InvalidReplicationFactorException).
#
# CAPTURED from prod options-edge-config on 2026-07-13. Refresh (re-run the
# capture in docs/es4/README) when prod config materially changes; it is a reviewed snapshot,
# not a live copy, so es4 config changes go through PR review like everything else.
apiVersion: v1
kind: ConfigMap
metadata:
  name: es4-base-env
  namespace: options-edge
  labels:
    app.kubernetes.io/part-of: options-edge
data:
  APP_WEB_PORT: "8091"
  CHECK_MARKET_DATA_SOURCES: "DATABENTO"
  DIRECTIONAL_PRESSURE_OI_BASELINE_BACKFILL_ENABLED: "true"
  DIRECTIONAL_PRESSURE_THRESHOLDS_ENABLED: "true"
  EXPECTED_MAX_STRIKES: "43"
  GATEWAY_CACHE_TTL_MS: "21600000"
  HPSF_ALGORITHM_VERSION: "HPSF_V2.1"
  HPSF_CONFIG_VERSION: "hpsf-v2.1-dev"
  HPSF_ENABLED: "true"
  HPSF_MARKET_EARLY_CLOSES: "2026-11-27=13:00:00,2026-12-24=13:00:00"
  HPSF_MARKET_HOLIDAYS: "2026-01-01,2026-01-19,2026-02-16,2026-04-03,2026-05-25,2026-06-19,2026-07-03,2026-09-07,2026-11-26,2026-12-25"
