# es4 copy of the production Jenkins-only workload guard.
#
# USER 2026-07-26: "block es for direct restart, it should only be done by jenkins."
#
# ORDER MATTERS. This policy denies every gated mutation whose principal is not the deployer
# ServiceAccount, and admission runs AFTER authorization — so system:masters does NOT bypass it.
# Applying this before k8s/es4/security/jenkins-deployer-rbac.yaml exists, and before
# Jenkinsfile.es4-deploy actually authenticates as that SA, would deny every es4 deploy.
#
# The BINDING is inert until the namespace carries the label, which is the intended safety valve:
#   arm:    kubectl label ns options-edge options-edge/deploy-guard=jenkins-only
#   disarm: kubectl label ns options-edge options-edge/deploy-guard-
#
# KNOWN CONSEQUENCE, by design: scripts/es4/bootstrap-es4.sh applies the es4-runtime-secrets Secret
# with `sudo /usr/local/bin/k3s kubectl` (host admin). Secrets are gated here, so a bootstrap run
# while the label is on WILL be denied. That is the guard working, not a bug — disarm, bootstrap,
# re-arm. Reads are never gated (the policy covers CREATE/UPDATE/DELETE only), so every monitoring
# path — the freshness watcher, the restart sampler, `kubectl top`, `get` of any kind — is
# unaffected.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: options-edge-jenkins-only-workloads
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources:
          - configmaps
          - secrets
          - serviceaccounts
          - services
          # PVCs back the Kafka-Streams disk-backed state stores (RocksDB
          # SST files). Gated same as the other workload resources: only
          # the jenkins-deployer SA may CREATE/UPDATE/DELETE them.
          - persistentvolumeclaims
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources:
          - daemonsets
          - deployments
          - deployments/scale
          - statefulsets
          - statefulsets/scale
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources:
          - cronjobs
          - jobs
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources:
          - ingresses
          - networkpolicies
  validations:
    # The Jenkins deployer SA may mutate ANY gated resource. System principals are exempted ONLY for
    # persistentvolumeclaims, and only the ones that actually bind a PVC: with a WaitForFirstConsumer
    # StorageClass, system:kube-scheduler patches/binds the PVC during pod scheduling, and the
    # kube-controller-manager / a kube-system controller (the PV binder) completes the bind. Without this
    # the scheduler's PVC bind is denied -> PVC stays Pending -> the pod never schedules (Streams pods
    # deadlock). The carveout is PVC-scoped, so these system principals CANNOT touch Deployments/Secrets/
    # etc.; all human/app (non-system, non-deployer) workload changes remain blocked. (system:node:* is NOT
    # exempted -- kubelets do not mutate the PVC resource for binding.)
    - expression: >-
        request.userInfo.username == 'system:serviceaccount:options-edge:jenkins-deployer'
        || (request.resource.resource == 'persistentvolumeclaims'
            && (request.userInfo.username == 'system:kube-scheduler'
                || request.userInfo.username == 'system:kube-controller-manager'
                || request.userInfo.username.startsWith('system:serviceaccount:kube-system:')))
      message: "OptionsEdge Kubernetes workload changes are blocked unless they run through the Jenkins deployer ServiceAccount."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: options-edge-jenkins-only-workloads
spec:
  policyName: options-edge-jenkins-only-workloads
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        options-edge/deploy-guard: jenkins-only
