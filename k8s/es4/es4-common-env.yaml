# es4-common-env — the environment-level knobs every es4 service shares.
# (es4 = the self-contained ES-0DTE box, 192.168.100.4; Gate-2 GATE-2-SERVICE-DESIGNS.md §0.)
#
# THE es-prefix mechanism: TOPIC_PREFIX=es. — processing-common RuntimeProfileConfig
# prefixes EVERY topic (compiled defaults AND env-supplied values) with "es.", and
# KAFKA_APPLICATION_ID_SUFFIX namespaces every Streams application.id. APP_PROFILE=prod
# enforces fail-loud config (no localhost, no default passwords) and an empty base prefix.
apiVersion: v1
kind: ConfigMap
metadata:
  name: es4-common-env
  namespace: options-edge
  labels:
    app.kubernetes.io/part-of: options-edge
data:
  APP_PROFILE: "prod"
  TOPIC_PREFIX: "es."
  KAFKA_APPLICATION_ID_SUFFIX: "-es4"
  # Fleet liveness market-hours gate (processing-common app.kafka.Liveness/MarketHours): the ES
  # stack trades CME Globex (~23h/day), not NYSE RTH — gate the dead-engine restart window to the
  # Globex session (armed from 5 min before each open through 5 min past each close).
  LIVENESS_SESSION: "globex"
  # ── System Status page (PIPELINE-STALL-REJECT-ALERTING-DESIGN.md §3.5/§3.6) ──
  # es4 writes its watcher evidence into the SAME oe_watch ledger as dev/prod (rows carry env), so
  # there is ONE verification point; this gateway reads it back with the read-only oe_watch_reader
  # role. .4 reaches .252:5432 (verified). That Postgres has NO TLS, so plaintext is accepted
  # EXPLICITLY and the page renders a "LEDGER LINK UNENCRYPTED" chip — visible, not silent.
  # The password arrives via the es4-runtime-secrets envFrom (key OE_WATCH_DB_PASSWORD); without it
  # the gateway still starts and the page reports LEDGER UNAVAILABLE.
  OE_WATCH_JDBC_URL: "jdbc:postgresql://192.168.100.252:5432/options_flow"
  OE_WATCH_DB_USER: "oe_watch_reader"
  OE_WATCH_ALLOW_PLAINTEXT: "true"
  OE_ENV: "es4"
  # Mirror of the es4 rows in ~/oe-ops/freshness-topics.conf — the EXPECTED topic universe, so a
  # registered topic with no evidence renders NO_EVIDENCE instead of vanishing. NB these are the
  # FULL topic names: TOPIC_PREFIX is applied by the gateway to *_TOPIC settings, not to this list.
  OE_SYSTEM_STATUS_TOPICS: "es.underlying.es.trades,es.options.databento.raw,es.options.databento.gex.strike,es.options.databento.gex.magnet,es.options.databento.gex.flow.by-strike,es.delta-flow-by-strike,es.strike-liquidity-heatmap-dashboard,es.market.spx.market-carry-service.current"
  # Consumer-group ids VERIFIED against the live .4 broker (kafka list_consumer_groups) — guessing
  # them yields NO_COMMITS for a healthy service, which is worse than showing nothing.
  OE_SYSTEM_STATUS_LAG_REGISTRY: "databento-gex-service:options-databento-gex-streams-es4:es.options.databento.raw;strike-intelligence-service:options-edge-strike-intelligence-service-es4:es.options.databento.gex.strike;delta-flow-service:options-edge-delta-flow-service-es4-r2:es.options.opra.tcbbo"
  # §9b trail = full-session board history (user 2026-07-17), same as prod/dev overlays.
  STRIKE_INTEL_RECENT_SIGNALS_WINDOW_MS: "86400000"
  STRIKE_INTEL_RECENT_SIGNALS_MAX: "50"
  # §7c two-sided mode "strength" (STRONG-only briefly trialed 2026-07-17, rolled back same
  # evening — LEAN stays visible for data gathering; re-trial with "require" later).
  STRIKE_INTEL_TWO_SIDED_FLOW_MODE: "strength"
  # Two-sided magnitude floor (processing #382): prod default 5000 is SPX-calibrated;
  # ES delta flows run 100-1000x smaller, so the floor is OFF here until the first
  # Globex sessions provide an ES calibration (else every ES story would demote).
  STRIKE_INTEL_TWO_SIDED_MIN_ABS_FLOW: "0"
  KAFKA_BOOTSTRAP_SERVERS: "192.168.100.4:9092"
  SCHEMA_REGISTRY_URL: "http://192.168.100.4:8081"
  KAFKA_SCHEMA_REGISTRY_URL: "http://192.168.100.4:8081"
  POSTGRES_JDBC_URL: "jdbc:postgresql://192.168.100.4:5432/options_edge_es"
  APP_MARKET_DATA_SOURCE: "DATABENTO"
  # HEATMAP RAMP SATURATION — mirrors the SPX cluster's options-edge-config key. ONE value read by
  # TWO services: es-web injects every HEATMAP_* key into window.__OPTIONS_EDGE_ENV__ for
  # liquidity-heatmap.js, and es-feed-gateway reads the same key for the history projection's
  # rawP99. They must be equal or the ribbon's backfilled part renders on a different scale than
  # its live part for ~5 min after every page load. Calibrated on SPX data (2026-07-30, 144,611
  # buckets) — ES quoted-size distribution has NOT been measured yet, so this is the SPX value
  # carried over deliberately, not an ES calibration. See HEATMAP-CALIBRATION-LEDGER section 6.
  HEATMAP_COLOR_SATURATION_PCT: "0.95"
