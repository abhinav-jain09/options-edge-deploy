# DEV-ONLY capacity patch (2026-08-05). TEMPORARY — see dealer-ledger-dev-scale-down-patch.yaml for
# the full arithmetic.
#
# The first two patches bring the fleet to 8350m against the 8550m budget: 200m of headroom. That is
# enough for steady state but NOT for a rollout — a RollingUpdate surge pod must SCHEDULE before the
# old one goes away, and the largest such pod on dev asks 250m (hpsf-postgres-writer-service and
# option-price-behavior-service). At 200m free those rollouts deadlock: service-deploy.sh applies the
# new template and then waits on a pod that can never satisfy "Insufficient cpu".
#
# Freeing another 100m here takes the headroom to 300m, which covers that 250m surge on its own. It
# does NOT cover a surge PLUS a concurrent on-demand Job (350m), and dev also has a 500m replay Job
# that can be started by hand; covering the worst case would need ~750m, which this node cannot give
# without disabling services that are genuinely in use. The standalone surge IS hard-asserted; only
# the overlap is left to the runtime control. validate-dev-capacity.sh therefore asserts
# steady state and REPORTS the rollout picture rather than pretending to guarantee it.
#
# Two alternatives were tried and rejected. Pinning the 250m services to Recreate on dev required the
# HPSF ops job to stop applying from k8s/base, and the replacement risked pushing dev-rendered
# manifests at whatever kubectl context that job holds; web's base manifest also records that
# Recreate previously made its :8090 LoadBalancer binding vanish and not return. Disabling the ES
# open-direction pair looked free but is not: dev-cleanup's OVERNIGHT_SET deliberately starts both
# after the close for overnight ES tracking.
#
# WHY THIS SERVICE COSTS NOTHING: pressure-postgres-writer persists the directional-pressure plane,
# and BOTH its producers — directional-pressure-service and directional-pressure-databento-service —
# already render at replicas 0 on dev. It has had nothing to consume for as long as they have been
# down, so this frees 100m at no functional cost. It comes back with them.
#
# RESTORING: same four steps as the dealer-ledger patch (delete file, unwire from kustomization,
# drop from DISABLED_DEV, re-run generate-service-slices.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pressure-postgres-writer
  namespace: options-edge
spec:
  replicas: 0
