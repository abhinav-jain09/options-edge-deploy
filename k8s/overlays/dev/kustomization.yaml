resources:
  - ../../base
  # Common infra (namespace, shared ConfigMaps with the dev-local values, streams-state
  # PVCs with dev's 'standard' storageClassName, ops CronJobs) — the same overlay
  # Jenkinsfile.common-infra applies standalone. The former top-level
  # configmap-dev-local-patch.yaml moved INTO that overlay.
  - ../../infra/overlays/dev
  # The web app's service slice (Deployment+Service). Its dev env patches stay HERE at the
  # top level (below) so this monolithic render is unchanged; the STANDALONE web overlay
  # (k8s/services/web/overlays/dev) mirrors them — sync is enforced by
  # scripts/ci/validate-services.sh render equivalence.
  - ../../services/web/base
  # NOTE: the databento timewarp replay Job + snapshot-replay Deployment used to live
  # here. They moved to k8s/replay/dev and now deploy on-demand via the dedicated
  # `replay-deploy` job (Jenkinsfile.replay) — OUT of the dev/prod bring-up path. A Job's
  # pod template is immutable, so re-applying it inside the monolith aborted the whole
  # deploy whenever the image/config changed; and re-running a historical replay on every
  # deploy risks polluting live topics. Keep replay a separate, deliberate action.
patches:
  - path: streams-processing-guarantee-dev-patch.yaml
  - path: web-dev-env-patch.yaml
  # DEV-ONLY: give the k8s feed-gateway the dev WS auth/origins/replay config the retired host :8093
  # gateway had, so the browser's live WS connects to the Jenkins-owned k8s gateway (:8091).
  - path: feed-gateway-dev-env-patch.yaml
  # The base web Deployment pins itself to the prod control-plane node
  # (nodeSelector node-role.kubernetes.io/control-plane: "true") because the
  # .4 failover node has intermittent DNS. Dev is single-node docker-desktop,
  # whose node is labelled node-role.kubernetes.io/control-plane="" (empty, not
  # "true"), so that selector leaves the web pod unschedulable (Pending). Remove
  # the selector for dev — there is only one node to schedule on anyway.
  - target:
      kind: Deployment
      name: options-edge-web
    patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
  # ibkr-feed is PROD-ONLY and INTENTIONALLY scaled to 0 on dev — DO NOT bring it up on dev.
  # It is the live IBKR VIX source and needs the prod IB Gateway (co-located on the prod
  # control-plane node); dev has no IB feed and instead receives underlying.vix.price via the
  # prod->dev vix-bridge (scripts/vix-bridge/). The base Deployment stays replicas:1 so PROD
  # runs it; this dev-overlay patch forces it to 0 for dev only. The nodeSelector removal below
  # is harmless with 0 replicas but kept so a manual dev scale-up still schedules on the single
  # docker-desktop node (whose control-plane label is "" not "true"), never Pending.
  - target:
      kind: Deployment
      name: ibkr-feed-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
      - op: remove
        path: /spec/template/spec/nodeSelector
  # DEV-ONLY: serve the k8s web on :8090 (not the base :8094). The legacy host web that
  # owned :8090 is retired, so :8090 is free; and the feed-gateway WS_ALLOWED_ORIGINS
  # already trusts http://localhost:8090, so the browser's live WS is accepted with no
  # per-port allow-list churn, and the existing http://localhost:8090/option-chain URL
  # works. Prod keeps the base Service :8094.
  - target:
      kind: Service
      name: options-edge-web
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8090
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  # DEV-ONLY: option-price-behavior uses Kafka Streams/RocksDB state. Its JVM heap is
  # 2g, so a 2Gi pod limit leaves no native/off-heap headroom and the kubelet OOM-kills
  # it during replay. Give the container enough room without changing service logic.
  - target:
      kind: Deployment
      name: option-price-behavior-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 4Gi
  # DEV-ONLY dealer-ledger heap: -Xmx1024m OOM'd (java.lang.OutOfMemoryError) on the day's-backlog
  # catch-up → StreamThread died → readiness 503 → rollout-wait timeout. Raise heap to -Xmx6144m and
  # the container limit to 8Gi so the 6GB heap + RocksDB off-heap (193 Kafka-Streams partitions) + JVM
  # overhead can't be kernel-OOMKilled. Prod stays -Xmx1024m/3Gi (RAM-constrained single node — separate
  # capacity check). env/19 = JAVA_TOOL_OPTIONS (in-place replace keeps env order == the standalone slice).
  # MUST MIRROR the standalone slice k8s/services/dealer-ledger/overlays/dev (validate-services: mono==slice).
  - target:
      kind: Deployment
      name: dealer-ledger-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/19/value
        value: -Xms1024m -Xmx6144m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 8Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 2Gi
  # DEV-ONLY spx-mission-control auth: base points at the prod Keycloak
  # (https://auth.fullfunding.nl/realms/optionsedge) which dev cannot reach.
  # Override the issuer + JWKS URIs to the local Mac Keycloak (192.168.100.102:8089)
  # so the mandatory MissionAuthSettings.validate() check is satisfied AND the JWKS
  # is actually fetchable at startup. Audience inherits from base ("options-edge-web").
  - path: spx-mission-control-dev-env-patch.yaml
  # unified-sr + strike-flow-avro-adapter are now promoted to main and built for every env, so they
  # render and deploy in dev too (exclusions removed). Their dev image remaps are in the images: block.
