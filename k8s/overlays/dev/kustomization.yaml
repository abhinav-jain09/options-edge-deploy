  # nifty-gex: the NIFTY/BANKNIFTY Pressure boards (DhanHQ). Dev renders at replicas 0
  # (patch below) — one Dhan account token, and prod owns it. MIRRORS
  # k8s/services/nifty-gex/overlays/dev exactly — validate-services enforces it.
  - ../../services/nifty-gex/base
patches:
  # nifty-gex runs at ZERO replicas on dev (mirror of the standalone slice patch): prod
  # polls Dhan with the SAME account token; a second poller trips the per-account 429
  # and a second renewer invalidates prod's token.
  - target:
      kind: Deployment
      name: nifty-gex-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # THE SESSION-SCALE SWING PATH ON DEV. MIRRORS the standalone overlay
  # k8s/services/reversal-confirmation/overlays/dev exactly — validate-services
  # enforces the render equality, and it caught this block's absence.
  #
  # Only safe because of REVERSAL_HUNT_INSTANCE_ID (processing #700): dev and
  # production both point REVERSAL_ES_BOOTSTRAP_SERVERS at the SAME es4 broker,
  # so without an identity this hunt would have shared production's transactional
  # id — fencing its producer and killing the deployed hunt — put dev's calls on
  # the real alerts topic in production's voice, and mixed dev candidates into
  # the corpus the thresholds are to be decided from. "PROD-ONLY" was the
  # workaround for exactly that. The service now REFUSES to start if any owned
  # resource is configured outside the namespace.
  - target:
      kind: Deployment
      name: reversal-confirmation-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REVERSAL_HUNT_INSTANCE_ID
          value: dev
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REVERSAL_HUNT_ENABLED
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REVERSAL_HUNT_AUTO_ARM
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REVERSAL_HUNT_MIN_DECLINE_TICKS
          value: "28"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REVERSAL_HUNT_MIN_DECLINE_BUCKETS
          value: "31"
      # Preconditions, not preferences: a 90-minute reference cannot be rebuilt
      # from a 25-minute replay, and the ring must hold that replay.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REVERSAL_REPLAY_LOOKBACK_SECONDS
          value: "5460"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REVERSAL_RING_CAPACITY_BUCKETS
          value: "2790"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REVERSAL_HUNT_SWING_ENABLED
          value: "true"
  # oi-shadow: ENABLED on DEV (2026-09-21), with the SEEDED arm on. BY DESIGN it reads the anchor
  # manifest and the raw chain and writes one record per strike to
  # options.databento.oi.nowcast.by-strike. IT IS NOT DOING THAT TODAY, and the design is stated
  # here only so the gap below is legible -- it emits no output records at all (see the note on the
  # removed replicas patch).
  #
  # ⚠️ THAT OUTPUT TOPIC IS CONSUMER-FREE AGAIN, and its input is producer-free. This block used to
  # say "CONSUMED BY GEX (DATABENTO_GEX_DYNAMIC_OI_ENABLED), so what this service publishes reaches
  # the live gamma surface". That was true from 2026-08-04 until d845a415 (2026-09-02) deleted
  # OiEstimateOverlay together with the whole anchor-manifest subsystem. No code on processing main
  # reads that env var any more; what survives there is prose -- Avro doc strings for
  # oiQuality=ESTIMATED, a comment in strike-intelligence's FreshnessGate, and a (now stale) comment
  # in that repo's own Jenkinsfile which still asserts GEX consumes this output. GEX prices from
  # Postgres-captured OI now. So enabling this service reaches neither the board nor the topic.
  # MUST MIRROR the standalone slice k8s/services/oi-shadow/overlays/dev (validate-services).
  - target:
      kind: Deployment
      name: oi-shadow-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: oi-shadow-service
        namespace: options-edge
      spec:
        template:
          spec:
            containers:
              - name: oi-shadow
                env:
                  # ON since 2026-09-21 (USER: "bring up on dev ... and deploy again"), which
                  # lifts the 2026-08-10 retirement ON DEV ONLY. The retirement's finding is
                  # unchanged and still the reason production stays off: what this model can be
                  # scored on is END-OF-DAY 1DTE OI against the next morning's print (29% error
                  # against frozen OI's 47%, 178 walk-forward sessions), and the desk trades 0DTE,
                  # where there is no next-day settled print to score against at all. Its intraday
                  # path stays an assumption -- OPRA publishes open interest ONCE, 06:30 ET, one
                  # print per contract -- so nothing here has become measurable.
                  # See docs/oi-nowcast-retirement.md.
                  #
                  # ⚠️ ENABLED does NOT mean producing. OiShadowTopology publishes no OUTPUT
                  # RECORDS for a session without a COMPLETE anchor manifest, by design (without
                  # one, "the exchange published zero" and "we never saw this leg" are
                  # indistinguishable), and since d845a415 nothing produces that manifest. It is
                  # not inert, though: OiShadowServiceMain calls KafkaTopics.ensureServedTopic()
                  # for the output topic right after the enabled() gate, and it consumes the raw
                  # stream under its own profile-scoped Streams application id. See the note on the
                  # removed replicas patch below.
                  - name: OI_SHADOW_ENABLED
                    value: "true"
                  # The SEEDED arm, restoring dev's pre-retirement state (on 2026-08-04 alongside
                  # the anchor arm). The cells the service assigns ARE the cells the panel fitted
                  # (signed band, DTE {0,1}/{2,3}/{4-7}) and the nine coefficients were refitted on
                  # them over the full 251-session panel -- 190+ independent sessions per cell.
                  # Seed evidence: chain-wide error 0.242 -> 0.175, better on 24 of 25 post-panel
                  # sessions; it does NOT improve which strike leads (92.0% -> 88.0%).
                  - name: OI_SHADOW_SEED_COEFFICIENTS_ENABLED
                    value: "true"
