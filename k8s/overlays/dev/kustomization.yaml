resources:
  - ../../base
  # pin-postgres-writer is DEV-ONLY for now: its manifests live in this overlay (not base/), so the
  # production overlay (live 252 cluster, prod DB) is untouched until pin storage is deliberately gated
  # into prod as its own change. The image below is rewritten to the dev registry by the images: block.
  - pin-postgres-writer-deployment.yaml
  - pin-postgres-writer-service.yaml
patches:
  - path: configmap-dev-local-patch.yaml
  - path: web-dev-env-patch.yaml
  # DEV-ONLY: give the k8s feed-gateway the dev WS auth/origins/replay config the retired host :8093
  # gateway had, so the browser's live WS connects to the Jenkins-owned k8s gateway (:8091).
  - path: feed-gateway-dev-env-patch.yaml
  # The base web Deployment pins itself to the prod control-plane node
  # (nodeSelector node-role.kubernetes.io/control-plane: "true") because the
  # .4 failover node has intermittent DNS. Dev is single-node docker-desktop,
  # whose node is labelled node-role.kubernetes.io/control-plane="" (empty, not
  # "true"), so that selector leaves the web pod unschedulable (Pending). Remove
  # the selector for dev — there is only one node to schedule on anyway.
  - target:
      kind: Deployment
      name: options-edge-web
    patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
  # Same removal for ibkr-feed: it pins to the control-plane node in prod (co-located
  # with IB Gateway), but docker-desktop's node is labelled control-plane="" (empty),
  # so the selector would leave it Pending in dev. There is one node to schedule on.
  - target:
      kind: Deployment
      name: ibkr-feed-service
    patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
  # DEV-ONLY: serve the k8s web on :8090 (not the base :8094). The legacy host web that
  # owned :8090 is retired, so :8090 is free; and the feed-gateway WS_ALLOWED_ORIGINS +
  # replay-orchestrator CORS already trust http://localhost:8090, so the browser's live
  # WS + replay are accepted with no per-port allow-list churn, and the existing
  # http://localhost:8090/option-chain URL works. Prod keeps the base Service :8094.
  - target:
      kind: Service
      name: options-edge-web
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8090
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  # DEV-ONLY orchestrator mode: base ships SIMULATED (safe-by-default for prod kustomize); dev
  # flips to LIVE_UNSECURED so the Mac dev cluster's "Run Backtest" actually launches HPSF replays.
  - path: hpsf-replay-orchestrator-dev-patch.yaml
