resources:
  - ../../base
  # Common infra (namespace, shared ConfigMaps with the dev-local values, streams-state
  # PVCs with dev's 'standard' storageClassName, ops CronJobs) — the same overlay
  # Jenkinsfile.common-infra applies standalone. The former top-level
  # configmap-dev-local-patch.yaml moved INTO that overlay.
  - ../../infra/overlays/dev
  # The web app's service slice (Deployment+Service). Its dev env patches stay HERE at the
  # top level (below) so this monolithic render is unchanged; the STANDALONE web overlay
  # (k8s/services/web/overlays/dev) mirrors them — sync is enforced by
  # scripts/ci/validate-services.sh render equivalence.
  - ../../services/web/base
  # short-premium-agent is DEV-ONLY: referenced here (NOT in k8s/base/kustomization.yaml)
  # so the production/experiment monolith overlays never render it. services.yaml declares
  # envs: [dev] to match; the dev image remap below applies to it.
  - ../../services/short-premium-agent/base
  # NOTE: the databento timewarp replay Job + snapshot-replay Deployment used to live
  # here. They moved to k8s/replay/dev and now deploy on-demand via the dedicated
  # `replay-deploy` job (Jenkinsfile.replay) — OUT of the dev/prod bring-up path. A Job's
  # pod template is immutable, so re-applying it inside the monolith aborted the whole
  # deploy whenever the image/config changed; and re-running a historical replay on every
  # deploy risks polluting live topics. Keep replay a separate, deliberate action.
  # databento-vix-feed: standalone VIX OPRA feed — dev leg of the USER-directed
  # simultaneous cutover (2026-07-28). Same base as production; dev patch overrides
  # broker/profile/image.
  - ../../services/databento-vix-feed/base
patches:
  # oi-shadow: ENABLED on DEV, with the SEEDED arm on. The service reads the anchor manifest and
  # the raw chain and writes one record per strike to options.databento.oi.nowcast.by-strike; that
  # topic is now CONSUMED BY GEX (DATABENTO_GEX_DYNAMIC_OI_ENABLED), so what this service
  # publishes reaches the live gamma surface. It was consumer-free when this was first enabled;
  # that is no longer true and nothing here should be read as if it were.
  #
  # The seed is switched on rather than left at its default-off, because the point is to see the
  # estimator produce numbers against a live chain. Production runs the seeded arm too, enabled the
  # same day -- the environments are NOT split between arms, so dev is not a control for prod.
  # Seed evidence: fitted over 277 sessions on this service's own
  # cell definitions and measured on 25 sessions that post-date that panel — chain-wide error
  # 0.242 -> 0.175, better on 24 of 25. It does NOT improve which strike leads (92.0% -> 88.0%).
  # MUST MIRROR the standalone slice k8s/services/oi-shadow/overlays/dev (validate-services).
  - target:
      kind: Deployment
      name: oi-shadow-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: oi-shadow-service
        namespace: options-edge
      spec:
        template:
          spec:
            containers:
              - name: oi-shadow
                env:
                  - name: OI_SHADOW_ENABLED
                    value: "true"
                  - name: OI_SHADOW_SEED_COEFFICIENTS_ENABLED
                    value: "true"
  # greek-move-authenticity: ENABLED on DEV (the SPX proving ground — advisory-only, in-session
  # baseline bootstrap). Strategic-merge on env name (namespace required for the dev overlay).
  # MUST MIRROR the standalone slice k8s/services/greek-move-authenticity/overlays/dev (validate-services).
  - target:
      kind: Deployment
      name: greek-move-authenticity-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: greek-move-authenticity-service
        namespace: options-edge
      spec:
        template:
          spec:
            containers:
              - name: greek-move-authenticity
                env:
                  - name: GREEK_MOVE_AUTH_ENABLED
                    value: "true"
  # market-carry restores the SR3 history as a GlobalKTable. Keep the same
  # memory envelope as production: the 1Gi/768Mi profile is OOM-killed by
  # RocksDB/native restore memory before the service can publish carry.
  - target:
      kind: Deployment
      name: market-carry-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: market-carry-service
      spec:
        template:
          spec:
            containers:
              - name: market-carry
                env:
                  - name: JAVA_TOOL_OPTIONS
                    value: -Xms512m -Xmx2048m
                resources:
                  requests:
                    cpu: 200m
                    memory: 2Gi
                  limits:
                    memory: 5Gi
  - path: streams-processing-guarantee-dev-patch.yaml
  - path: web-dev-env-patch.yaml
  # DEV-ONLY: give the k8s feed-gateway the dev WS auth/origins/replay config the retired host :8093
  # gateway had, so the browser's live WS connects to the Jenkins-owned k8s gateway (:8091).
  - path: feed-gateway-dev-env-patch.yaml
  # DEV-ONLY: feed publish interval 5s, same as prod (code default 250ms) — see the patch header.
  - path: databento-feed-dev-patch.yaml
  - path: databento-vix-feed-dev-patch.yaml
  # DEV-ONLY: Gate-3 research evidence store ON (base is OFF and carries no URL — see the patch).
  - path: vix-option-inteligence-dev-patch.yaml
  # DEV-ONLY: dealer-ledger aggressive candidate V1 (ABSORB_MIN_FRACTION=0.50). Prod untouched.
  - path: dealer-ledger-dev-env-patch.yaml
  # DEV-ONLY: delta-flow greek lookahead tolerance 3000ms (code default 0ms rejects 100% of trades
  # against dev's thin greek surface — see the patch header). Prod untouched.
  - path: delta-flow-dev-env-patch.yaml
  - path: drop-classifier-dev-env-patch.yaml
  # Dev gex settings. Created for the pre-open GEX pipeline, but that is NO LONGER what it does:
  # the ibkr-preopen-gate patch below is applied AFTER it and sets PREOPEN_GEX_ENABLED back to
  # "false" for the one-publisher invariant, so the legacy pre-open publisher is live in neither
  # environment (dev: ENABLED=false PUBLISH=true; production: both false).
  #
  # "Prod untouched" is also wrong now: TOP_N, GEX_SMILE_IV_FALLBACK and
  # DATABENTO_GEX_DYNAMIC_OI_ENABLED all accumulated in that file and are set on production too.
  # Read k8s/services/databento-gex/overlays/<env>/manifest.yaml, not the patch name.
  - path: databento-gex-preopen-dev-patch.yaml
  # DEV-ONLY gate β/γ: the pre-open IBKR GEX window publishes onto the live topic and the
  # gateway relays its status stream. Turns the legacy PREOPEN publisher OFF (mutually
  # exclusive by construction). Prod untouched — base flags stay false.
  - path: ibkr-preopen-gate-dev-patch.yaml
  # GAMMA (user-visible) — enabled now that its ONE stated precondition is met: the conforming
  # UI is deployed on dev (web #439: the option-chain pre-open handler, the IBKR palette, the
  # two-plane number-visibility rules and truthful provenance), so an IBKR value can no longer
  # render labelled Databento. R-ROLL order is preserved — beta shipped first and ran on dev —
  # and dev remains the ONLY environment flipped: prod stays dark on the base flag.
  - path: ibkr-preopen-gateway-dev-patch.yaml
  # DEV mirror of the standalone overlay: OPB rolling windows disabled on dev (matches #482, which
  # touched only the standalone overlay and drifted the monolithic dev render). Prod already has it.
  - path: option-price-behavior-dev-env-patch.yaml
  # strike-intelligence §7a conflict bypass: 2-of-4 fresh agreement clears a non-opposed
  # (FAKE_VOLUME/PIN/EXHAUSTION) near-tie; opposed runner-ups still veto regardless. Dev/prod
  # parity with the production overlay (PRs #462/#463 — engine default stays 3).
  # MUST MIRROR the standalone slice k8s/services/strike-intelligence/overlays/dev (validate-services).
  - target:
      kind: Deployment
      name: strike-intelligence-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STRIKE_INTEL_CONFLICT_BYPASS_MIN_AGREEMENT
          value: "2"
  # GMT Stage-1 SHADOW — DEV-FIRST enable (GAMMA-MIGRATION-TILT-STAGE1-GATE1.md rev 11, Codex
  # design + code-review APPROVE; proc commit 95641009). Pure shadow: records whether the
  # gamma-migration regime agreed with each actionable signal (additive fields + the
  # strike-intel.gamma-tilt.shadow evidence ledger); ZERO effect on emitted decisions (verified
  # by the OFF/ON decision-projection topology test). Code default is OFF; this flag is the only
  # enable. Prod/es4 stay off until the shadow record justifies Stage 2.
  # MUST MIRROR the standalone slice k8s/services/strike-intelligence/overlays/dev (validate-services).
  - target:
      kind: Deployment
      name: strike-intelligence-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STRIKE_INTEL_GAMMA_MIGRATION_SHADOW
          value: "true"
  # strike-intelligence action band LOW — dev/prod parity with the production trial (PR #472):
  # LOW-band (conf 0.25-0.50) directional roles emit BUY/SELL LEAN instead of gating to NONE.
  # MUST MIRROR the standalone slice k8s/services/strike-intelligence/overlays/dev (validate-services).
  - target:
      kind: Deployment
      name: strike-intelligence-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STRIKE_INTEL_ACTION_BIAS_MIN_BAND
          value: LOW
  # §7c two-sided mode: back to "strength" (STRONG-only tried 2026-07-17 evening, ROLLED BACK
  # same evening — user wants LEAN visible again to gather data; re-trial via mode=require later).
  - target:
      kind: Deployment
      name: strike-intelligence-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STRIKE_INTEL_TWO_SIDED_FLOW_MODE
          value: strength
  # §9b trail = FULL-SESSION board history (user 2026-07-17: "do not take away"): entries stay
  # until the trading-date rollover purge instead of aging out after 15 min; cap raised to 50.
  # MUST MIRROR the standalone slice k8s/services/strike-intelligence/overlays/* (validate-services).
  - target:
      kind: Deployment
      name: strike-intelligence-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STRIKE_INTEL_RECENT_SIGNALS_WINDOW_MS
          value: "86400000"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STRIKE_INTEL_RECENT_SIGNALS_MAX
          value: "50"
  # The base web Deployment pins itself to the prod control-plane node
  # (nodeSelector node-role.kubernetes.io/control-plane: "true") because the
  # .4 failover node has intermittent DNS. Dev is single-node docker-desktop,
  # whose node is labelled node-role.kubernetes.io/control-plane="" (empty, not
  # "true"), so that selector leaves the web pod unschedulable (Pending). Remove
  # the selector for dev — there is only one node to schedule on anyway.
  - target:
      kind: Deployment
      name: options-edge-web
    patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
  # ibkr-feed is now DEV-ONLY (2026-07-29, IBKR-SPX-INDEX-PRIORITY-SPOT-REQUIREMENT.md rev4):
  # the IB Gateway lives on the dev Mac, and this ONE instance streams the SPX cash index
  # (chain OFF, VIX OFF — VIX stays OPRA-parity from the databento feed) and dual-produces
  # underlying.spx.index.price to BOTH clusters via per-cluster dispatcher threads
  # (IBKR_SPX_KAFKA_TARGETS). Prod overlay keeps ibkr-feed at 0 — prod consumes the hop topic
  # the dev-hosted pod produces into the prod broker (established cross-env-into-prod pattern,
  # like the es4 es-trades bridge). hostNetwork/dnsPolicy are removed on dev: those exist for
  # the prod control-plane co-location; on docker-desktop a NORMAL pod network is what resolves
  # host.docker.internal (the Gateway and the dev broker both live on the Mac host).
  - target:
      kind: Deployment
      name: ibkr-feed-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: remove
        path: /spec/template/spec/nodeSelector
      - op: remove
        path: /spec/template/spec/hostNetwork
      - op: remove
        path: /spec/template/spec/dnsPolicy
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: IB_HOST
            value: host.docker.internal
          # IB Gateway on the dev Mac runs the PAPER profile, whose API listener is 4002
          # (verified 2026-07-29: only *:4002 LISTEN; 4001 closed → the pod crash-looped
          # "Couldn't connect to TWS"). The shared configmap's IB_PORT=4001 is the LIVE
          # port and stays for prod; dev overrides it here.
          - name: IB_PORT
            value: "4002"
          - name: IB_USE_DELAYED_DATA
            value: "false"
          - name: IBKR_SPX_PRICE_ENABLED
            value: "true"
          - name: KAFKA_IBKR_SPX_PRICE_TOPIC
            value: underlying.spx.index.price
          - name: IBKR_SPX_KAFKA_TARGETS
            value: prod=192.168.100.252:9092,dev=host.docker.internal:19092
          # Pre-open option-chain raw fan-out (OVERNIGHT-IBKR-GEX rev13 R-CHAIN.1): DARK —
          # read only when IBKR_CHAIN_ENABLED=true. Explicit rather than relying on the
          # IBKR_SPX_KAFKA_TARGETS fallback so the chain contract is visible here.
          - name: IBKR_CHAIN_ENABLED
            value: "true"
          # SPX options quote pre-market on CBOE's Global Trading Hours session, but the base
          # config subscribes the chain through SMART, which has no pre-open route for them:
          # verified 2026-08-05 07:50 ET, when every strike's raw snapshot carried
          # {"ASK":"-1","BID":"-1"} with "bboExchange":"" while CLOSE and
          # OPTION_MODEL_UNDERLYING were populated. With no bid/ask the IV solver cannot run,
          # so the pre-open window published GATED/IV_SOLVER_FAILED for every strike and the
          # board stayed numberless even after today's OI baseline landed. The underlying is
          # already pinned to CBOE for SPX (IB_UNDERLYING_EXCHANGE); this makes the option legs
          # agree with it. DEV ONLY while the window is proven — prod keeps SMART.
          - name: IB_OPTION_EXCHANGE
            value: "CBOE"
          - name: IBKR_CHAIN_KAFKA_TARGETS
            # label=bootstrap|schemaRegistry — registry IDs are REGISTRY-LOCAL, so each
            # cluster's producer registers against ITS OWN registry (feed
            # fix/chain-per-target-registry).
            #
            # DEV-ONLY FAN-OUT for the gate-beta proving run: prod's raw-to-display-service
            # runs at 1 replica and CONSUMES options.ibkr.raw, so fanning the chain to the
            # prod broker would activate the legacy chain-display pipeline there — a real
            # production effect. The D15 prod fan-out lands with the PROD gate, together with
            # raw-to-display's own disposition.
            value: dev=host.docker.internal:19092|http://host.docker.internal:8082
          # The chain window opens at the PINNED 06:15 (R-OPS/D13) — never the feed's own
          # 06:00 default. The 06:15 cleanup/autostart schedule is a convenience, not a
          # safety fence: a manifest applied between 06:00 and 06:15 must not arm early.
          - name: IB_CHAIN_WINDOW_START
            value: "06:15"
          - name: IBKR_VIX_PRICE_ENABLED
            value: "true"
          # HOP topic + fan-out targets (requirement §12): raw IBKR VIX ticks go to the
          # internal hop topic on BOTH clusters; the canonical underlying.vix.price is
          # owned by the databento-vix-feed role (ibkr-feed fail-louds if pointed at it).
          - name: KAFKA_IBKR_VIX_PRICE_TOPIC
            value: underlying.vix.index.price
          - name: IBKR_VIX_KAFKA_TARGETS
            value: prod=192.168.100.252:9092,dev=host.docker.internal:19092
          - name: MARKET_DATA_SELECTION_ENABLED
            value: "false"
          - name: POSTGRES_ENABLED
            value: "false"
  # G2 DEV SOAK (§11, 2026-07-19): signal-follower-spx flags TRUE on dev (LEDGER mode).
  # MUST MIRROR the standalone slice k8s/services/signal-follower/overlays/dev
  # (validate-services: mono==slice).
  - path: signal-follower-dev-env-patch.yaml
  # signal-follower-es is PROD-ONLY: dev is SPX-only (no ES services on dev — USER rule
  # 2026-07-17) and the ES instance reads the es4 broker, unreachable/meaningless from dev.
  # Base stays replicas:1 so PROD runs it; this dev-overlay patch forces it to 0 on dev.
  - target:
      kind: Deployment
      name: signal-follower-es
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # DEV-ONLY: serve the k8s web on :8090 (not the base :8094). The legacy host web that
  # owned :8090 is retired, so :8090 is free; and the feed-gateway WS_ALLOWED_ORIGINS
  # already trusts http://localhost:8090, so the browser's live WS is accepted with no
  # per-port allow-list churn, and the existing http://localhost:8090/option-chain URL
  # works. Prod keeps the base Service :8094.
  - target:
      kind: Service
      name: options-edge-web
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8090
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      # Kafka Streams apps rebalance on roll; when the WHOLE fleet rolls at once
      # (cold, pre-market) a pod can take >600s (k8s default progressDeadlineSeconds)
      # to report Available, so `kubectl rollout status` fails the deploy even though
      # every pod goes Ready ~1-2min later (state=REBALANCING->ready is normal). Raise
      # the controller deadline to 1200s so the deploy tolerates the rebalance. The CLI
      # `rollout status --timeout=1260s` (apply.sh) is set just above it so the
      # controller's meaningful "exceeded progress deadline" fires first.
      - op: add
        path: /spec/progressDeadlineSeconds
        value: 1200
  # DEV-ONLY: option-price-behavior uses Kafka Streams/RocksDB state. Four stream threads
  # restoring 32 partitions repeatedly exceeded the 4Gi limit (exit 137). Match the stable
  # production 8Gi envelope so the 3Gi heap and native/off-heap state have headroom.
  - target:
      kind: Deployment
      name: option-price-behavior-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 8Gi
  # DEV-ONLY dealer-ledger heap: -Xmx1024m OOM'd (java.lang.OutOfMemoryError) on the day's-backlog
  # catch-up → StreamThread died → readiness 503 → rollout-wait timeout. Raise heap to -Xmx6144m and
  # the container limit to 8Gi so the 6GB heap + RocksDB off-heap (193 Kafka-Streams partitions) + JVM
  # overhead can't be kernel-OOMKilled. DEALER_LEDGER_ADVISORY_ENABLED=true is SHADOW-mode enable so it
  # fires + accumulates calibration (still SHADOW = observe-only). NAME-KEYED strategic merge (NOT env/N
  # json6902): the prior index patch targeted env/19 for JAVA_TOOL_OPTIONS, but PR#364 inserted
  # DEALER_LEDGER_QUOTE_STALE_MS ahead of it, shifting the index so the heap string landed on
  # QUOTE_STALE_MS (=> 30s default) and JAVA_TOOL_OPTIONS reverted to the 1GB base default. Merging env by
  # name is immune to future base env-array insertions.
  # MUST MIRROR the standalone slice k8s/services/dealer-ledger/overlays/dev (validate-services: mono==slice).
  - target:
      kind: Deployment
      name: dealer-ledger-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dealer-ledger-service
      spec:
        template:
          spec:
            containers:
              - name: dealer-ledger
                env:
                  - name: DEALER_LEDGER_ADVISORY_ENABLED
                    value: "true"
                  - name: JAVA_TOOL_OPTIONS
                    value: -Xms1024m -Xmx6144m
                resources:
                  limits:
                    memory: 8Gi
                  requests:
                    memory: 2Gi
  # DEV-ONLY spx-mission-control auth: base points at the prod Keycloak
  # (https://auth.fullfunding.nl/realms/optionsedge) which dev cannot reach.
  # Override the issuer + JWKS URIs to the local Mac Keycloak (192.168.100.102:8089)
  # so the mandatory MissionAuthSettings.validate() check is satisfied AND the JWKS
  # is actually fetchable at startup. Audience inherits from base ("options-edge-web").
  - path: spx-mission-control-dev-env-patch.yaml
  # spx-mission-control is kept OFF (replicas:0) in dev (USER 2026-07-09). MUST MIRROR the standalone
  # slice k8s/services/spx-mission-control/overlays/dev (validate-services: mono==slice). Re-enable by
  # removing this patch AND setting the slice back to replicas:1.
  - target:
      kind: Deployment
      name: spx-mission-control-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # unified-sr + strike-flow-avro-adapter are now promoted to main and built for every env, so they
