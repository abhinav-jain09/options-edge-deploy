# DEV-ONLY: publish each strike's snapshot at most once per second (1000ms) instead of the 250ms
# code default. Prod uses 2000ms (databento-feed-prod-patch.yaml) to relieve its single-core CPU
# backpressure that runs ~5-6.5 min behind real-time; dev has more headroom, so 1s gives fresher
# data while still cutting per-strike publish/serialize/Kafka work ~4x vs the 250ms default. An
# explicit container env overrides the shared configmap's envFrom value, so this ships via the
# per-service deploy (service-deploy) WITHOUT touching common-infra (the shared feed configmap is
# also consumed by databento-gex and lives in the infra layer).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: options-edge-databento-feed
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: databento-feed
          env:
            - name: DATABENTO_PUBLISH_INTERVAL_MS
              value: "1000"
            # DEV-ONLY spot cascade: native SPX index (unwired stub) -> ES-basis (cost-of-carry from
            # the ES front-month) -> synthetic put-call parity fallback (60s ES freshness gate). In
            # practice ES-basis -> synthetic. Reuses the ES trade stream already ingested via base's
            # DATABENTO_HPSF_ES_TRADES_ENABLED=true; no code change (CascadedSpotProvider shipped in
            # options-edge-databento-feed PR #41). Set as a Deployment env override (NOT the infra
            # configmap) so it is the reliable, deploy-durable knob applied by service-deploy — the
            # container env beats the shared configmap's envFrom value AND service-deploy rolls the
            # pod, so activation is deterministic (the common-infra configmap path neither restarts
            # the feed nor is currently unblocked). Prod stays SYNTHETIC (deliberate) — untouched.
            # 2026-07-15: SYNTHETIC is the STANDING dev state (user directive) — do not
            # re-flip to CASCADED. CASCADED's per-ES-tick snapshot refresh (348 publishes +
            # blocking flush inside _book_lock, gate only 0.05 spot delta) starved the OPRA
            # read loop; dev tcbbo fell 30+ min behind and delta-flow rejected everything as
            # stale. If CASCADED is ever wanted again, land feed PR #69 (refresh throttle)
            # first.
            - name: DATABENTO_SPOT_SOURCE
              value: SYNTHETIC
            # VIX-via-OPRA-parity, MIRRORS the prod enablement (feed
            # docs/vix-opra-parity-price/DESIGN.md v11, PR #65; prod enablement
            # deploy PR #456; USER directive 2026-07-15: enable on dev as well).
            # Same AUTO_VIX_MONTHLY instrument on the same OPRA session; the dev
            # feed publishes underlying.vix.price to the DEV broker where the dev
            # feed-gateway consumes it (KAFKA_IBKR_VIX_PRICE_TOPIC default), so
            # the dev option-chain VixPriceCard lights up like prod's.
            # Rollback = set "" / false here and redeploy.
            - name: DATABENTO_EXTRA_INSTRUMENTS
              value: '[{"symbol":"VIX","trading_class":"VIX","min_strike":12,"max_strike":45,"strike_step":0.5,"expiry_mode":"AUTO_VIX_MONTHLY"}]'
            - name: DATABENTO_VIX_PRICE_ENABLED
              value: "true"
