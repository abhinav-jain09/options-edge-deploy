# DEV-ONLY: publish each strike's snapshot at most once per second (1000ms) instead of the 250ms
# code default. Prod uses 2000ms (databento-feed-prod-patch.yaml) to relieve its single-core CPU
# backpressure that runs ~5-6.5 min behind real-time; dev has more headroom, so 1s gives fresher
# data while still cutting per-strike publish/serialize/Kafka work ~4x vs the 250ms default. An
# explicit container env overrides the shared configmap's envFrom value, so this ships via the
# per-service deploy (service-deploy) WITHOUT touching common-infra (the shared feed configmap is
# also consumed by databento-gex and lives in the infra layer).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: options-edge-databento-feed
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: databento-feed
          env:
            - name: DATABENTO_PUBLISH_INTERVAL_MS
              value: "1000"
            # DEV-ONLY spot cascade: native SPX index (unwired stub) -> ES-basis (cost-of-carry from
            # the ES front-month) -> synthetic put-call parity fallback (60s ES freshness gate). In
            # practice ES-basis -> synthetic. Reuses the ES trade stream already ingested via base's
            # DATABENTO_HPSF_ES_TRADES_ENABLED=true; no code change (CascadedSpotProvider shipped in
            # options-edge-databento-feed PR #41). Set as a Deployment env override (NOT the infra
            # configmap) so it is the reliable, deploy-durable knob applied by service-deploy — the
            # container env beats the shared configmap's envFrom value AND service-deploy rolls the
            # pod, so activation is deterministic (the common-infra configmap path neither restarts
            # the feed nor is currently unblocked). Prod stays SYNTHETIC (deliberate) — untouched.
            # 2026-07-29 (USER decision, IBKR-SPX-INDEX-PRIORITY-SPOT-REQUIREMENT.md rev4):
            # CASCADED so the IBKR SPX cash index (tier-1, via the SPX_INDEX_SOURCE_* consumer
            # in the feed configmap) is the priority-1 spot; absent/stale/DELAYED falls back
            # automatically and recovers automatically. The 2026-07-15 starvation incident's
            # prerequisite fix (refresh throttle, feed PR #69) is MERGED and pinned explicitly
            # via DATABENTO_CASCADE_REFRESH_MIN_INTERVAL_MS in the feed configmap.
            # Kill switch: set this back to SYNTHETIC.
            - name: DATABENTO_SPOT_SOURCE
              value: CASCADED
            # VIX-via-OPRA-parity, MIRRORS the prod enablement (feed
            # docs/vix-opra-parity-price/DESIGN.md v11, PR #65; prod enablement
            # deploy PR #456; USER directive 2026-07-15: enable on dev as well).
            # Same AUTO_VIX_MONTHLY instrument on the same OPRA session; the dev
            # feed publishes underlying.vix.price to the DEV broker where the dev
            # feed-gateway consumes it (KAFKA_IBKR_VIX_PRICE_TOPIC default), so
            # the dev option-chain VixPriceCard lights up like prod's.
            # Rollback = set "" / false here and redeploy.
            # SECOND extra instrument: the 1DTE SPXW track (feed PR #82, AUTO_NEXT_SESSION).
            # The 0DTE volatility engine's constant-one-day-vol needs the NEXT session's chain;
            # without this the feature has no live input at all and the engine abstains on it.
            # It is an ISOLATED extra entry keyed by (symbol, expiry), so the primary 0DTE track
            # (expiry_mode FEED) is untouched -- that isolation is exactly what feed #82 built,
            # after the earlier config-level separation was found not to be failure isolation.
            # Same OPRA session and the SAME db.Live client -- the existing subscription's symbol
            # set expands; no new Databento client/session is created, which is what the
            # one-live-client-per-key constraint actually cares about.
            # Rollback = drop the second object here and redeploy.
            - name: DATABENTO_EXTRA_INSTRUMENTS
              # Strike range MIRRORS the primary 0DTE track exactly (configmap
              # DATABENTO_MIN_STRIKE/MAX_STRIKE/STRIKE_STEP = 7000/8000/5). The two tracks must
              # cover the same strikes or the 0DTE and 1DTE surfaces are not comparable and
              # constant-one-day-vol interpolates across a hole.
              value: '[{"symbol":"SPX","trading_class":"SPXW","min_strike":7000,"max_strike":8000,"strike_step":5,"expiry_mode":"AUTO_NEXT_SESSION"}]'
            - name: DATABENTO_VIX_PRICE_ENABLED
              value: "false"
            # ---- ES->SPX basis engine on DEV, mirrored from prod (2026-07-27) --------------
            # Dev's feed has BOTH engine legs in-process (base DATABENTO_HPSF_ES_TRADES_ENABLED
            # =true native ES + the SPX leg), so the engine already ran here — but with samples
            # and A1 evidence UNSET it could never measure and stamped every dev es.trade with
            # UNAVAILABLE/COLD_START forever, which keeps dev's es-spx-align fail-closed (no
            # ES->SPX translation on dev). Same certification discipline as prod: samples stay
            # OFF until the A1:<session_date> PASS cert lands on DEV's spx.basis.state —
            # committed by the same launchd automation that certifies prod
            # (~/oe-ops/a1-cert-daily.sh, per-env targets), so this is standing/daily, not a
            # one-shot. Dev align keeps reading underlying.es.trades (dev enriches the trades
            # topic directly on the native path — no es.price re-point needed here).
            - name: ES_SPX_BASIS_A1_EVIDENCE_ENABLED
              value: "true"
            - name: ES_SPX_BASIS_SAMPLES_ENABLED
              value: "true"
            - name: ES_SPX_BASIS_CLOSE_PRINCIPALS
              value: "abhinav"
            - name: ES_SPX_BASIS_ACK_PRINCIPALS
              value: "abhinav"
