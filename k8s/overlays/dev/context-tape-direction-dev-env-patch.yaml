# DEV-ONLY: Candle Direction subsystem hosted in context-tape-service (design A3, Codex Gate-2) — COMMISSIONING
# SHADOW. The feature flag defaults OFF in code; only the dev overlay turns it on. It adds three consumers (canonical
# spot `underlying.spx.price`, `options.indicators.snapshot.current`, `underlying.es.trades` via the host's ES topic),
# an idempotent producer on `context-tape.direction.commissioning`, a compacted checkpoint on
# `context-tape.direction.checkpoint`, and its OWN read-only projection server on :8136
# (/api/context-tape/direction, /health/direction). The host API/readiness are untouched; direction readiness is
# never the pod probe. Amendment A4 (owner 2026-09-07): the shadow decision cut and the push/reversal engine publish
# CURRENT copies for the gateway/UI; every record is actionable=false (COMMISSIONING_SHADOW, CALIBRATION phase).
# Off-hours dev spot is SYNTHETIC and is rejected by the tier/provenance pairing — commissioning starts on RTH
# LIVE_INDEX/NATIVE_SPX_INDEX records. Prod overlay untouched. env merges by name over the base.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-tape-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: context-tape
          env:
            - { name: CONTEXT_TAPE_DIRECTION_ENABLED, value: "true" }
            - { name: CONTEXT_TAPE_DIRECTION_SPOT_TOPIC, value: "underlying.spx.price" }
            - { name: CONTEXT_TAPE_DIRECTION_INDICATOR_TOPIC, value: "options.indicators.snapshot.current" }
            - { name: CONTEXT_TAPE_DIRECTION_OUTPUT_TOPIC, value: "context-tape.direction.commissioning" }
            - { name: CONTEXT_TAPE_DIRECTION_CHECKPOINT_TOPIC, value: "context-tape.direction.checkpoint" }
            # A4 (push/reversal engine): the CURRENT decision, the push state, the alerts and the scorecard — compacted
            # (current/push/scorecard) or delete-retained (alert), all consumed by the feed gateway as websocket events.
            - { name: CONTEXT_TAPE_DIRECTION_CURRENT_TOPIC, value: "context-tape.direction.current" }
            - { name: CONTEXT_TAPE_DIRECTION_PUSH_TOPIC, value: "context-tape.direction.push" }
            - { name: CONTEXT_TAPE_DIRECTION_ALERT_TOPIC, value: "context-tape.direction.alert" }
            - { name: CONTEXT_TAPE_DIRECTION_SCORECARD_TOPIC, value: "context-tape.direction.scorecard" }
            - { name: CONTEXT_TAPE_DIRECTION_API_PORT, value: "8136" }
            # ZDCE-113/114: causal 0DTE compression/expansion detector. This is deliberately
            # SHADOW_ONLY: the frozen artifact rejects production eligibility and the UI labels
            # it as such. Rollback is one flag flip; host Context Tape readiness is independent.
            - { name: ZERO_DTE_COMPRESSION_ENABLED, value: "true" }
            - { name: ZERO_DTE_SPOT_TOPIC, value: "underlying.spx.price" }
            - { name: ZERO_DTE_ES_TOPIC, value: "underlying.es.trades" }
            - { name: ZERO_DTE_ES_SYMBOL, value: "ES.v.0" }
            - { name: ZERO_DTE_OPTION_TOPIC, value: "options.databento.gex.strike" }
            - { name: ZERO_DTE_CURRENT_TOPIC, value: "context-tape.compression.current" }
            - { name: ZERO_DTE_HISTORY_TOPIC, value: "context-tape.compression.history" }
            - { name: ZERO_DTE_CHECKPOINT_TOPIC, value: "context-tape.compression.checkpoint" }
            - { name: ZERO_DTE_TRANSACTIONAL_ID, value: "context-tape-compression-dev-v1" }
            - { name: ZERO_DTE_ARTIFACT_SHA256, value: "d774ed59ca3148e6f9b36accfc0a4744d43fc1f6bf36cdaa30d4ae899f419d82" }
            - { name: ZERO_DTE_ALLOWED_LATENESS_MS, value: "5000" }
            - { name: ZERO_DTE_OPTION_MAX_AGE_MS, value: "120000" }
            - { name: ZERO_DTE_SESSION_MINUTES, value: "390" }
          ports:
            - name: direction
              containerPort: 8136
---
apiVersion: v1
kind: Service
metadata:
  name: context-tape-service
  namespace: options-edge
spec:
  ports:
    - name: direction
      port: 8136
      targetPort: direction
