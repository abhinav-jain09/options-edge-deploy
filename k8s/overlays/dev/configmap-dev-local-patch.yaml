apiVersion: v1
kind: ConfigMap
metadata:
  name: options-edge-config
  namespace: options-edge
data:
  APP_PROFILE: dev
  TOPIC_PREFIX: ""
  KAFKA_APPLICATION_ID_SUFFIX: -dev
  SCHEMA_REGISTRY_URL: http://host.docker.internal:8082
  KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
  KAFKA_SCHEMA_REGISTRY_URL: http://host.docker.internal:8082
  KAFKA_BROKER_COUNT: "1"
  KAFKA_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TOPIC_MIN_IN_SYNC_REPLICAS: "1"
  # Dev-only data-topic retention: 10h (36,000,000 ms). Overrides the base 24h
  # (KAFKA_TOPIC_RETENTION_MS=86400000); prod keeps 24h. load-kafka-settings.sh
  # derives KAFKA_TOPIC_RETENTION_MS from this rendered per-env configmap, so the
  # Kafka Topics stage applies 10h to dev data topics. (Streams-internal/changelog
  # retention is set separately in the Jenkinsfile and is unchanged.)
  KAFKA_TOPIC_RETENTION_MS: "36000000"
  POSTGRES_JDBC_URL: jdbc:postgresql://host.docker.internal:5432/options_flow_dev
  POSTGRES_USER: options_flow
  POSTGRES_PASSWORD: Options#100
  APP_FEED_GATEWAY_WS_URL: ws://feed-gateway-service:8091/ws/events
  WEB_BASE_URL: http://host.docker.internal:8090
  GATEWAY_WS_URL: ws://feed-gateway-service:8091/ws/events
  CHECK_MARKET_DATA_SOURCES: DATABENTO
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: options-edge-databento-feed-config
  namespace: options-edge
data:
  APP_PROFILE: dev
  KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
  KAFKA_SCHEMA_REGISTRY_URL: http://host.docker.internal:8082
