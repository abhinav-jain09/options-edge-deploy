# DEV-ONLY feed-gateway config. This replaces the retired hand-run host gateway (:8093): its dev env
# (ci/config/feed-gateway.env) is mirrored here so the k8s gateway (feed-gateway-service, :8091) is the
# single gateway in dev and Jenkins owns it. The base manifest hardcodes PROD WS auth/origins
# (https://bleadingoptions.com, auth.bleadingoptions.com) as direct container env, which override the configmap;
# this patch overrides them back to dev so a http://localhost:8090 browser with a dev-Keycloak token is
# accepted. Prod overlay is untouched (keeps the base prod values).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-gateway-service
  namespace: options-edge
spec:
  # NOTE: strategy stays Recreate (base). The gateway runs hostNetwork: true and binds the node port
  # :18091 directly, so two pods cannot co-exist on the single docker-desktop node — a surge pod
  # (RollingUpdate maxSurge:1) could never bind the port and the rollout would hang. Gateway deploys are
  # infrequent and the browser WS auto-reconnects, so the brief :8091 blip on a gateway deploy is fine.
  template:
    spec:
      containers:
        - name: feed-gateway
          # env merges by name: these override the base prod WS values and add the dev GATEWAY_* keys.
          env:
            - name: GATEWAY_RITHMIC_DEPTH_ENABLED
              value: "true"
            # Sockets one account may hold at once: 8 (owner 2026-11-10; gateway default 4). Measured the same day: one Order
            # page opens several sockets (the dev-lan and dev origins of one login together held 6), so 4 starved the Order page
            # ("Gateway WebSocket disconnected"). The 9th socket is refused alone with "connection limit reached for this account
            # (8 of 8 in use)" and the first eight are untouched (gateway #319, #320).
            - name: GATEWAY_MAX_SOCKETS_PER_APP_SESSION
              value: "8"
            # Native full-book history uses the existing approved AppSession authority.
            - name: GATEWAY_AUTH_ENABLED
              value: "true"
            - name: GATEWAY_KEYCLOAK_AUDIENCE
              value: "options-edge-web"
            - name: GATEWAY_RITHMIC_SYSTEM
              value: "Rithmic Paper Trading"
            # ES liquidity wall relays (gateway feat/es-liquidity-wall-relays): futures.liquidity-wall.{dashboard,events,voice,buckets} (ids 3408 (3403 archival version 1 is accepted too)/3404/3407/3402, dev only)
            # -> websocket events es-liquidity-heatmap / es-liquidity-wall / es-liquidity-voice and GET /api/es-liquidity-history (the 60-s projection). The producer
            # es-liquidity-wall-service runs on dev only; the relay is off everywhere else (default false).
            - name: ES_LIQUIDITY_WALL_RELAY_ENABLED
              value: "true"
            # Freshness bound of a dashboard frame (order page liquidity walls, design rev 9 section 6, requirement OW-X-8). The gateway broadcasts a dashboard frame live only while its
            # bucketEnd is within this many ms of now; the default is 5000. The wall service closes each second only after its grace (10000 ms on dev) and was MEASURED on 2026-11-06
            # (a consumer on futures.liquidity-wall.dashboard, wall clock minus the record's bucket end, 40 consecutive records) publishing 8.0 to 12.2 s after the bucket end; the gateway
            # counted every dashboard frame stale (gateway_es_liquidity_wall_stale_frames_total = dashboard_accepted_total = 23596) so none was ever broadcast. A consumer's
            # wall-clock bound must exceed its producer's hold time: 20000 = the measured maximum plus a margin. Dev only (the relay is off everywhere else).
            - name: ES_LIQUIDITY_WALL_FRESH_MS
              value: "20000"
            # Liquidity-validator label relay (gateway LiquidityValidatorRelay; design/geometry-trade-rules/VALIDATOR-LABEL-ON-ORDER-PAGE-REQUIREMENT.md): futures.liquidity-validator.evaluations
            # (id 3604, dev only) -> the websocket event liquidity-validator, a label + spoken sentence beside each geometry signal on the Order page. Display only. The producer
            # liquidity-validator-service runs on dev only; the relay is off everywhere else (default false).
            - name: LIQUIDITY_VALIDATOR_RELAY_ENABLED
              value: "true"
            # Line health relay (requirement LH-O-6, gateway LineHealthRelay): futures.line-health.{state,events,voice,status} (ids 3701/3702/3703/3705 and the version-2 ids 3708/3709/3710, dev only) -> websocket frames
            # line-health-state / -event / -voice / -status, the hello field lineHealth and the line-health-resume answer. The producer is the line-health loop of level-absorption-service; off everywhere else (default false).
            - name: LINE_HEALTH_RELAY_ENABLED
              value: "true"
            # MARKET STRUCTURE relay (gateway #194): the latest market-structure record is retained and
            # replayed to the Context Tape page as the `market-structure` frame, which draws the STRUCTURE
            # layer. The topic is market-structure-service's UI projection — the namespace R13 of
            # MARKET-STRUCTURE-SERVICE-DESIGN.md gives that service, declared in scripts/kafka/topics.env and
            # created by scripts/kafka/ensure-market-structure-topics.sh — and NOT the gateway's own code
            # default (options.market-structure.levels), which nothing declares, nothing creates and nothing
            # publishes to.
            #
            # PER-ENVIRONMENT on purpose, not in the base: market-structure-service renders in dev and
            # production only, and the experiment overlay has no instance of it, so enabling the relay there
            # would point the gateway at a topic that environment never fills. These two values were live on
            # the DEV gateway as a hand-applied `kubectl set env` and existed in no manifest (they are absent
            # from that deployment's last-applied configuration), so the next redeploy would have silently
            # switched the relay off.
            #
            # ⚠️ Applying feed-gateway ROLLS THE GATEWAY: it runs hostNetwork with strategy Recreate, so the
            # :8091 WebSocket blips while the new pod binds the port. Deliberate, and the same blip every
            # gateway deploy has — but it is a shared workload, so a production apply belongs outside the
            # session, not mid-afternoon.
            - name: GATEWAY_MARKET_STRUCTURE_ENABLED
              value: "true"
            - name: KAFKA_MARKET_STRUCTURE_TOPIC
              value: options.spx.market-structure.ui
            # Candlestick pattern annotations (processing CANDLESTICK-PATTERN-REQUIREMENT.md R6.4): the gateway's
            # own switch for frame market-structure-patterns and the hello's patterns field. ON by default (owner
            # decision 2026-10-16), paired with MARKET_STRUCTURE_PATTERNS_ENABLED=true on the market-structure service.
            - name: GATEWAY_MARKET_STRUCTURE_PATTERNS_ENABLED
              value: "true"
            - name: KAFKA_MARKET_STRUCTURE_PATTERNS_TOPIC
              value: options.spx.market-structure.patterns
            # DEV-ONLY: the pre-market ESTIMATE pattern sets (processing market-structure-service PREMARKET-ESTIMATE-CANDLESTICK-PATTERNS-REQUIREMENT.md
            # P6): the same sets built on the ES estimate candles, from options.spx.market-structure.estimate.patterns (written by the
            # market-structure-estimate container). They join the SAME per-timeframe retention and the SAME frame, newest asOfMs wins, so the
            # regular sets replace them at the cash open. Production's patch does not carry this variable (the code default is off).
            - name: GATEWAY_MARKET_STRUCTURE_ESTIMATE_PATTERNS_ENABLED
              value: "true"
            # DEV-ONLY: the pre-market ESTIMATE structure record (levels, trend, selection) from options.spx.market-structure.estimate.ui, written by
            # the same market-structure-estimate container. It joins the SAME retention and the SAME market-structure frame, newest asOfMs wins,
            # so the regular record replaces it at the cash open. Production's patch does not carry this variable (the code default is off).
            - name: GATEWAY_MARKET_STRUCTURE_ESTIMATE_ENABLED
              value: "true"
            # INDICATOR-STUDIES studies relay (frames indicator-studies / indicator-studies-current and the hello's studies fields):
            # ON in DEV (production overlay: false). The producer flag INDICATOR_STUDIES_ENABLED is set true for dev by
            # indicator-studies-dev-enable-patch.yaml. Preconditions for dev (verified when this was enabled): schemas 2501-2503 registered
            # on the DEV registry and options.indicators.studies.bars/current ensured on the dev broker. The es4 registry, the es. mirrors and
            # production are NOT part of this change: ES studies need them first (schemas on es4 and prod, mirrors installed).
            - name: GATEWAY_STUDIES_ENABLED
              value: "true"
            # DEV-ONLY: the line acceptance / rejection relay (VWAP-ACCEPTANCE-REJECTION P5; gateway PR 274): the gateway reads options.spx.line-acceptance and serves the page's "Line tests" lens.
            # It was set on the live dev gateway by `kubectl set env`, which a Jenkins apply would reset, so it is declared here. Production's patch and the base do not carry it (code default off).
            # The producer, line-acceptance-service, runs on dev since 2026-11-02 (replicas 1, LINE_ACCEPTANCE_ENABLED "true", UNVALIDATED by owner override of design K9), so the lens shows its status/monitor records, all labelled UNVALIDATED.
            - name: GATEWAY_LINE_ACCEPTANCE_ENABLED
              value: "true"
            # TA-books relays (frame contracts GEOMETRY-/TRADE-TOOLS-/WAVES-FRAME-CONTRACT.md in options-edge-processing docs/ta-books/catalog). The names are GatewaySettings' (feat/ta-geometry-feed-gateway:
            # structureToolsEnabled / geometryEnabled / tradeToolsEnabled / waveCycleEnabled) and the topic variables it also reads
            # (KAFKA_MARKET_STRUCTURE_{TOOLS,GEOMETRY}_TOPIC, KAFKA_TT_*_TOPIC, KAFKA_WAVE_CYCLE_{WAVES,CYCLES}_TOPIC) default to exactly the topics
            # scripts/kafka/topics.env declares, so none is set here. All four are ON in DEV ONLY since 2026-10-21 (owner: "enable dev flags in the deploy repo too", for the Order tab
            # analysis layers); production keeps all four OFF, explicitly (a flag off sends no frame and the hello carries no such field). Each is an independent layer. Order for each: Avro subjects registered on EVERY registry the producer and gateway use ->
            # topic ensured -> producer image live -> THIS gateway flag (the gateway then waits for records) -> the producer flag.
            # CHART-STRUCTURE-TOOLS  options.spx.market-structure.tools
            - name: GATEWAY_STRUCTURE_TOOLS_ENABLED
              value: "true"
            # CLASSICAL-CHART-PATTERNS  options.spx.market-structure.geometry
            - name: GATEWAY_GEOMETRY_ENABLED
              value: "true"
            # Server-side pattern break alerts  options.spx.market-structure.pattern-alerts + options.spx.market-structure.estimate.pattern-alerts (PatternAlertEvent 2224 / PatternAlertWatermark 2225; PATTERN-ALERTS-SERVER-SIDE-DESIGN.md
            # sections 6 and 8, requirement AL-19). ON in DEV ONLY; the production overlays do not carry it (default false: no relay, no `alerts` hello part, no audit read). An image without the feature ignores the variable.
            # Order: subjects registered (schema-sync), topics ensured, producer image live -> THIS flag -> the producer flag.
            - name: GATEWAY_PATTERN_ALERTS_ENABLED
              value: "true"
            # TICK-TRADE-TOOLS  futures.pf.* / futures.volume-nodes / futures.flow.*
            - name: GATEWAY_TRADE_TOOLS_ENABLED
              value: "true"
            # ELLIOTT-FIB-CYCLE-TOOLS  options.spx.wave-cycle.{waves,cycles}
            - name: GATEWAY_WAVE_CYCLE_ENABLED
              value: "true"
            # Phase F BREAK CLASSIFICATION relay  options.spx.break-classification (BreakMark/BreakOutcome/BreakStatus). The topic variable KAFKA_BREAK_CLASSIFICATION_TOPIC defaults to exactly the topic
            # scripts/kafka/topics.env declares, so none is set here. ON in dev and production (owner standing goal: every service out of shadow); dev has run it ON since the
            # 2026-10-30 Phase F rollout, and this file said "false" until then, which the next gateway deploy would have reverted. Until a Phase B/C producer feeds
            # break-classifier-service its parents the topic carries status records only (no marks).
            - name: GATEWAY_BREAK_CLASSIFICATION_ENABLED
              value: "true"
            # Early-auction verdict ledger relay (the read-only /early-auction panel + the home-page
            # strip behind GET /api/early-auction/events). ON since 2026-10-13 (owner: "flip the
            # relay flag when rollout lands") — DEV ONLY; production stays off with the shadow
            # service itself. The topic (early-auction.verdicts.shadow) is empty until the service
            # scales up (scheduled 2026-10-14 ~09:45 Eastern Time), so until then the panel renders
            # its empty state ("relay on, no session records yet"), which is correct. Topic override:
            # KAFKA_EARLY_AUCTION_VERDICT_TOPIC; replay window: GATEWAY_EARLY_AUCTION_VERDICT_SEEK_BACK_MS.
            - name: GATEWAY_EARLY_AUCTION_VERDICT_ENABLED
              value: "true"
            # MARKET COMMENTARY relay: the per-minute records of market-commentary-service, polled by the read-only
            # /market-commentary panel through GET /api/market-commentary/state (a REST view, no WebSocket event). The topic is the
            # code default; declared in scripts/kafka/topics.env and created by ensure-market-commentary-topics.sh. Applying
            # feed-gateway ROLLS THE GATEWAY (hostNetwork, Recreate): the :8091 WebSocket blips, so apply it outside the session.
            - name: GATEWAY_MARKET_COMMENTARY_ENABLED
              value: "true"
            - name: WS_ALLOWED_ORIGINS
              value: "http://localhost:8090,https://dev.bleadingoptions.com,https://dev-lan.bleadingoptions.com:8443"
            - name: WS_AUTH_ISSUER_URI
              value: "https://dev-auth.bleadingoptions.com/realms/optionsedge"
            # Fetch signing keys over the dev host network, independently of Cloudflare.
            - name: GATEWAY_KEYCLOAK_JWKS_URL
              value: "http://host.docker.internal:8089/realms/optionsedge/protocol/openid-connect/certs"
            - name: GATEWAY_KEYCLOAK_ISSUER
              value: "https://dev-auth.bleadingoptions.com/realms/optionsedge"
            - name: GATEWAY_KEYCLOAK_CLIENT_ID
              value: "options-edge-web"
            # Replay orchestrator is a host process on :8095; in-cluster it is reached via host.docker.internal.
            - name: GATEWAY_REPLAY_ORCHESTRATOR_URL
              value: "http://host.docker.internal:8095"
            # Realm role a login must carry for the gateway to attach its sockets (owner 2026-11-10). It was "replay-admin",
            # which is the FULL replay-administration role (start/stop/delete runs): only two accounts held it, so every other
            # login got a silent 401 ("Feed unavailable") once GATEWAY_AUTH_ENABLED=true came with #1545. "oe-approved" carries
            # no replay rights; it is granted in Keycloak (realm optionsedge) to each account allowed to see the feed.
            - name: GATEWAY_APPROVAL_ROLE
              value: "oe-approved"
            # Dev-only relaxations (the host gateway set these): non-durable in-memory ticket store and
            # PLAINTEXT Kafka while auth is on. NEVER set in prod.
            - name: GATEWAY_ALLOW_INMEMORY_TICKETS
              value: "true"
            - name: GATEWAY_ALLOW_INSECURE_KAFKA
              value: "true"
            # Dev-only live evaluation of the reviewed gamma-navigation decision surface.
            # Production remains default-off because its overlay does not set this flag.
            - name: GAMMA_NAVIGATION_ENABLED
              value: "true"
            # Dev-only relay of the GAMMA ZONE and its session volume profile, the two topics
            # gamma-zone-service writes. The page at /gamma-zone reads both: the measurement, and
            # the profile that answers "how many contracts traded between these two strikes".
            # Production remains default-off because its overlay does not set this flag, and
            # gamma-zone-service itself is dev-only (services.yaml envs: [dev]) -- so on production
            # the flag would subscribe the gateway to two topics that do not exist there.
            - name: GAMMA_ZONE_ENABLED
              value: "true"
            # The gamma-effort relay. DEV ONLY for the same reason and in the same shape:
            # gamma-effort-service is services.yaml envs: [dev], so on production this flag would
            # subscribe the gateway to a topic that does not exist there. Production stays
            # default-off by NOT setting it, like GAMMA_ZONE_ENABLED above.
            - name: GAMMA_EFFORT_ENABLED
              value: "true"
            - name: GATEWAY_MARKET_HOLIDAYS
              value: "2026-01-01,2026-01-19,2026-02-16,2026-04-03,2026-05-25,2026-06-19,2026-07-03,2026-09-07,2026-11-26,2026-12-25"
            - name: GATEWAY_MARKET_EARLY_CLOSES
              value: "2026-11-27=13:00,2026-12-24=13:00"
            # DEV replay cadence is slower than live one-second liquidity columns; keep prod's 5s default
            # untouched, but give dev replay a stable window so the UI can render between replay bursts.
            - name: GATEWAY_LIQUIDITY_HEATMAP_TTL_MS
              value: "60000"
            # The SPX dashboard topic is provisioned with 32 partitions in dev. Keep the gateway's
            # topology guard aligned while ES retains the binary's four-partition default.
            - name: HEATMAP_HISTORY_EXPECTED_PARTITIONS
              value: "32"
            # ── System Status page (PIPELINE-STALL-REJECT-ALERTING-DESIGN.md §3.5/§3.6) ──
            # Read-only view of the freshness watcher's oe_watch verification ledger, which on dev lives
            # in the Mac's options_flow_dev (host.docker.internal from inside docker-desktop). All of
            # this is OPTIONAL: with none of it set the gateway behaves exactly as before and the page
            # reports LEDGER UNAVAILABLE / NOT CONFIGURED rather than a falsely-healthy screen.
            # NB loopback/host.docker.internal is exempt from the endpoint's verify-full TLS enforcement
            # (dev Postgres has no server cert); prod must reach the ledger over TLS or an ssh tunnel.
            - name: OE_WATCH_JDBC_URL
              value: "jdbc:postgresql://host.docker.internal:5432/options_flow_dev"
            - name: OE_WATCH_DB_USER
              value: "oe_watch_reader"
            - name: OE_WATCH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: options-edge-runtime-secrets
                  key: OE_WATCH_READER_PASSWORD
                  optional: true
            - name: OE_ENV
              value: "dev"
            # Dev drop-classifier runs in SPX_PRICE mode and publishes spx.drop.* on the dev broker;
            # the gateway default (es.drop.nowcast) exists only on prod .252. Without this override the
            # optional-topic handling keeps dev healthy but the board strip stays permanently empty.
            - name: KAFKA_DROP_NOWCAST_TOPIC
              value: "spx.drop.nowcast"
            # This Postgres has no TLS ("server does not support SSL"), and every other service
            # already talks to it unencrypted on the same host/LAN. Accept plaintext EXPLICITLY: the
            # endpoint then reports ledger.transport=PLAINTEXT_ACCEPTED and the page shows a
            # "LEDGER LINK UNENCRYPTED" chip, so the posture stays visible. Enabling TLS on the
            # Postgres servers is the real fix and is tracked separately.
            - name: OE_WATCH_ALLOW_PLAINTEXT
              value: "true"
            # Mirror of ~/oe-ops/freshness-topics.conf (dev rows): the EXPECTED topic universe. A
            # registered topic with no ledger evidence renders NO_EVIDENCE — it can never silently
            # vanish from the page. 2026-08-02: the three option-price-behavior rows were added to
            # the watcher registry on 2026-07-30 but never mirrored here; re-synced so "mirror" is
            # true again. No underlying.vix.price row here — the dev VIX publisher has never been
            # proven to flow, so dev has no production contract for that topic to be measured against.
            - name: OE_SYSTEM_STATUS_TOPICS
              value: "underlying.spx.price,options.databento.raw,options.databento.gex.strike,options.databento.gex.magnet,options.databento.gex.flow.by-strike,delta-flow-by-strike,strike-liquidity-heatmap-dashboard,option-price-behavior-session,option-price-behavior-by-option,option-price-behavior-by-strike"
            # service:consumer-group:input-topics — lag is computed ONLY for allowlisted services.
            - name: OE_SYSTEM_STATUS_LAG_REGISTRY
              value: "databento-gex-service:databento-gex-service:options.databento.raw;strike-intelligence-service:strike-intelligence-service:options.databento.gex.strike;delta-flow-service:delta-flow-service:options.opra.tcbbo"
