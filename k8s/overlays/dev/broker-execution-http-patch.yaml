apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker-execution-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: broker-execution
          env:
            - name: BROKER_EXECUTION_IBKR_CLIENT_ID
              value: "31"
            - name: LINKED_EXIT_SPOT_ENABLED
              value: "true"
            - name: LINKED_EXIT_ARMING_ENABLED
              value: "true"
            - name: LINKED_EXIT_MID_CHASE_ENABLED
              value: "true"
            - name: TRIGGER_ORDERS_ENABLED
              value: "true"
            - name: ORDER_MID_PRICING_ENABLED
              value: "true"
            - name: BRACKET_ORDERS_ENABLED
              value: "true"
            - name: BROKER_PROBE_ON_START
              value: "true"
            - name: CONTEXT_TAPE_SPOT_TOPIC
              value: underlying.spx.index.price
            - name: AUTH_ISSUER_URI
              value: "https://dev-auth.bleadingoptions.com/realms/optionsedge"
            # Owner-authorized UI Paper/Live selection; account choice remains explicit in the service.
            # This does not submit an order, change quantity/money limits or start a production broker.
            - name: BROKER_LIVE_EXECUTION_ENABLED
              value: "true"
            - name: BROKER_LIVE_EXECUTION_HOST
              value: host.docker.internal
            - name: BROKER_LIVE_EXECUTION_PORT
              value: "7496"
            - name: BROKER_LIVE_EXECUTION_CLIENT_BASE
              value: "31001"
