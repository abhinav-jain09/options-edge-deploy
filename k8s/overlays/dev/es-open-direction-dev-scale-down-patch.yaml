# DEV-ONLY capacity patch (2026-08-05). TEMPORARY — see dealer-ledger-dev-scale-down-patch.yaml for
# the full arithmetic.
#
# The budget has to survive a rollout that overlaps an operational Job, not just steady state. The
# dev render carries three CronJobs — kafka-changelog-cleanup and feed-gateway-nightly-restart at
# 100m, offhours-clean-slate at 50m. All three are suspend: true, but Jenkinsfile.kafka-cleanup
# triggers the cleanup Job on demand and it may run for 1800s, so 100m can disappear from under a
# rollout whose surge pod needs 250m. Headroom therefore has to cover BOTH: 250m + 100m = 350m.
#
# These two free 150m, taking the headroom to 450m — 100m of margin over that worst case.
#
# WHY THESE COST NOTHING HERE: dev is SPX-only (no ES feed), so the ES open-direction service has no
# input to work from and its postgres writer has nothing to persist. Disabling the pair is
# self-consistent — the writer's only producer is the service above it.
#
# RESTORING: same four steps as the dealer-ledger patch (delete file, unwire from kustomization,
# drop from DISABLED_DEV, re-run generate-service-slices.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-open-direction-service
  namespace: options-edge
spec:
  replicas: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-open-direction-postgres-writer
  namespace: options-edge
spec:
  replicas: 0
