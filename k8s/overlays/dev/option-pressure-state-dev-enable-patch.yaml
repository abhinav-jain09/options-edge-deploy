# DEV-ONLY: start the L1 pressure CONSUMER.
#
# The base ships this service inert on purpose: replicas 0 and OPTION_PRESSURE_ENABLED=false, with
# the upstream gate (OPB_L1_ENABLED) shut as well, so nothing was produced and nothing consumed.
#
# The producer flag is a separate change. The order it enforces is the OPPOSITE of what this file
# first claimed, and the correction is kept here because the original reasoning looked sound and was
# not: splitting these was meant to start the consumer first, so that option-price-behavior never
# wrote 735 MiB a session into a topic nothing read. Kafka Streams will not allow that order. It
# refuses to start a topology whose source topic is absent — MissingSourceTopicException, handler
# opts to SHUTDOWN_CLIENT — so with the producer still shut this deployment crash-looped, which is
# how the mistake was found rather than reasoned out. option-price-behavior CREATES the input topic,
# so the producer must go first. Nothing is wasted by that order either: the consumer sets
# auto.offset.reset=earliest, so it reads the topic from the beginning whenever it starts.
#
# It also must not land before the image exists - which, when this patch was written, it did not. A
# deploy with replicas 1 and no image aborts at the digest-pinning step, and a direct apply gives
# ImagePullBackOff, so the image is built first with the service's own deploy job while the base is
# still inert. That ordering still holds for any new environment. Both the dev and the production
# images now exist; the registry listings that show them are in
# k8s/base/option-pressure-state-deployment.yaml rather than asserted here.
# Dev runs it, and so does PRODUCTION now, through its own patch
# (k8s/overlays/production/option-pressure-state-prod-enable-patch.yaml). The base stays inert so the
# experiment overlay, which patches nothing here, does not inherit it. Production's prerequisites and
# the exactly-once risk that came with enabling it are stated ONCE, in
# k8s/base/option-pressure-state-deployment.yaml. Do not restate them here.
#
# Nothing on dev contends with this patch. The two scripts whose KEEP_DOWN lists would force a
# deployment to zero — scripts/ops/morning-autostart.sh and scripts/ops/oe-boot-bringup.sh — are not
# scheduled on dev (com.optionsedge.dev-boot-start.plist is disabled-untilfurthernotice, and
# morning-autostart defaults EXPECTED_ENV=prod and is installed on the production host). Their
# entries for this service are now REMOVED from both scripts, because production is meant to run it.
# They were never the production hold anyway: the installed copies did not carry this service
# (checked 2026-10-18). See the base manifest. Only the DISABLED_DEV entry in
# scripts/ops/dev-cleanup.sh is removed, because that script IS run against dev and would scale this
# service back to zero on every clean.
#
# What turning it on costs, measured rather than assumed, on a real session of 944,068 contributions:
# the contributions topic carries 735 MiB, the symbol rekey topic the same, the evidence topic
# 2,709 MiB, and the two state stores write 10.29 GiB and 6.29 GiB of changelog. Retention is
# declared in the services (4 days, 2 days, 3 days), so this is roughly 12.5 GiB steady state rather
# than growth without end. The head topic is compacted and stays at a few hundred kilobytes.
#
# What it is for, stated plainly: collecting the live stream, nothing more. Every frame carries
# actionable=false and nothing may act on one. The register was REJECTED on two gate sets, and a
# Lane D validation over the Databento SPXW year found no directional content — Brier 0.63877
# against a 0.63910 momentum baseline, a confidence interval spanning zero, and a PUT_PRESSURE
# UP-minus-DOWN edge that flipped sign between splits. Enabling it buys live data for research; it
# does not make the signal usable, and no consumer should be built on it on that basis.
#
# NAME-KEYED strategic merge, deliberately — not an env/N json6902 patch, which lands on whichever
# variable has drifted into that index (this repository has the dealer-ledger heap landing on
# QUOTE_STALE_MS from exactly that mistake).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: option-pressure-state-service
  namespace: options-edge
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: option-pressure-state
          env:
            - name: OPTION_PRESSURE_ENABLED
              value: "true"
