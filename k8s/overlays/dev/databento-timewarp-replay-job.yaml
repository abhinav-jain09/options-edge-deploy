apiVersion: batch/v1
kind: Job
metadata:
  name: databento-timewarp-replay
  namespace: options-edge
  labels:
    app.kubernetes.io/name: databento-timewarp-replay
    app.kubernetes.io/component: replay
    app.kubernetes.io/part-of: options-edge
    oe.replay/mode: time-warp
spec:
  # Dev safety: deploy the add-on without publishing until it is explicitly unsuspended.
  # Run with:
  #   kubectl -n options-edge delete job databento-timewarp-replay --ignore-not-found
  #   kubectl apply -k k8s/overlays/dev
  #   kubectl -n options-edge patch job databento-timewarp-replay --type=merge -p '{"spec":{"suspend":false}}'
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: databento-timewarp-replay
        app.kubernetes.io/component: replay
        app.kubernetes.io/part-of: options-edge
    spec:
      restartPolicy: Never
      containers:
        - name: timewarp-replay
          image: host.docker.internal:5001/options-edge-databento-feed:dev
          imagePullPolicy: Always
          command: ["options-edge-databento-timewarp-replay"]
          envFrom:
            - configMapRef:
                name: options-edge-config
          env:
            - name: TIMEWARP_INPUT_FILE
              value: /historical-data/bt_260626B_input.jsonl
            - name: TIMEWARP_TOPIC
              value: options.opra.tcbbo
            - name: TIMEWARP_TARGET_TRADE_DATE
              value: "2026-07-06"
            - name: TIMEWARP_TARGET_EXPIRY
              value: "20260706"
            - name: TIMEWARP_TARGET_START
              value: "2026-07-06T13:30:00Z"
            - name: TIMEWARP_CLOCK_MODE
              value: session-shift
            - name: TIMEWARP_MAX_RECORDS
              value: "0"
            - name: TIMEWARP_PROGRESS_EVERY
              value: "10000"
          volumeMounts:
            - name: historical-data
              mountPath: /historical-data
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: historical-data
          hostPath:
            path: /var/lib/options-edge/historical-data
            type: Directory
