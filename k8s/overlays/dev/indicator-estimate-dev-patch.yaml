# DEV-ONLY: overnight ES-basis estimate bars (owner request 2026-10-19: "draw bars overnight from the ES feed").
# A SECOND container in the dev indicator-service pod runs the same image with INDICATOR_SOURCE_MODE=SPX_GLOBEX_ESTIMATE
# (indicator-service PR "dev-only SPX_GLOBEX_ESTIMATE"): it builds SPX-equivalent bars from the ES-basis-derived spot tier over
# the Globex hours until the 09:30 ET cash open and writes them to ITS OWN topic options.indicators.estimate.bars. It never
# writes options.indicators.bars, so market-structure, hunt and every other production consumer cannot see an estimate.
# The container refuses to start unless INDICATOR_ESTIMATE_ENABLED=true and the runtime profile is not production.
# Isolation, stated exactly: the container has no readiness probe and the entrypoint halts the JVM when its loop fails, so
# kubelet restarts ONLY this container (liveness covers a hung loop). A sidecar still shares the pod: while kubelet restarts
# it, the pod's ContainersReady condition is briefly false and the (single) indicator-service endpoint leaves the Service;
# the native indicator container itself keeps running and Kafka consumers are unaffected. Accepted for dev only.
# Production overlays do not reference this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indicator-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: indicator-estimate
          image: 192.168.100.252:5000/options-edge-indicator-service:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - { name: INDICATOR_SOURCE_MODE, value: "SPX_GLOBEX_ESTIMATE" }
            - { name: INDICATOR_ESTIMATE_ENABLED, value: "true" }
            - { name: INDICATOR_INPUT_TOPIC, value: "underlying.spx.price" }
            - { name: INDICATOR_BARS_TOPIC, value: "options.indicators.estimate.bars" }
            - { name: HEALTH_PORT, value: "8139" }
            - { name: JAVA_TOOL_OPTIONS, value: "-Xms64m -Xmx256m" }
          ports:
            - name: estimate
              containerPort: 8139
          livenessProbe:
            httpGet:
              path: /health/live
              port: estimate
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
