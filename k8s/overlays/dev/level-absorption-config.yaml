# IMMUTABLE and NAMED BY ITS CONTENT: the name suffix is the first 12 hex digits of sha256(json.dumps(data, sort_keys=True)); the Deployment
# references this exact name, so a changed configuration is a NEW object and a changed pod template (the pod rolls), a pod can only ever
# mount the content its template names, and an out-of-band edit is refused by the API server. Old objects are left in place (a rollback
# re-points to one). scripts/ci/validate-level-absorption-config.sh computes the name and fails CI on any disagreement.
#
# LINE HEALTH CONFIGURATION (second document below): inputCompletionGraceSeconds is 10 on development (design starting value 5). The tape the loop reads,
# underlying.es.trades.linearized, is held about 5 s by the linearizer (its reorder grace), so a second is complete at about 5.3 s after its end; with a grace of
# 5 the loop took a TAPE_TIMER decision first and dropped the prints that arrived a moment later (measured on the live topic 2026-11-06: 141 prints dropped in
# one minute). A consumer's wall-clock grace must exceed its producer's hold. Made by Claude under the owner's standing instruction; the owner may overrule.
# The Level Absorption configuration the pod mounts at /home/options-edge/config/level-absorption (read-only).
#
# SOURCE OF TRUTH: processing phase0/desk-levels-eyeball-configuration.json (2026-11-06: the PR #1414 market-structure configuration with sitesEnabled
# extended by the desk's PRIOR_HIGH, PRIOR_LOW, OVERNIGHT_HIGH, OVERNIGHT_LOW, IB_HIGH, IB_LOW and SESSION_EXTREME, dev only) and
# two-sided-host-retention-artifact.json.
# Enable market-structure swing/range/opening-range support and resistance, with opt-in two-sided gross effort diagnostics.
# Indicator study kinds are disabled. Host mode suppresses one-bar OBSERVATION output; gross-side reward thresholds are provisional and never authorize LIVE.
# EYEBALL ONLY: provisional thresholds and the NO_CANDIDATE/publication gate remain. This is not a Phase 0 selection.
# Retention: one Friday diagnostic session (including the missing-bar tail), 1361259 bytes/day x 30 x 2 = 81675540 bytes.
# Deploy only with the companion native host enum/decimal decoder and persistence-mode observation suppression.
#
# The standalone slices carry Deployment/Service only, so service-deploy does not create this ConfigMap: Jenkinsfile.service-deploy
# applies this one file in the stage 'Apply level-absorption configuration' (the same kind of service-owned step as the
# feed-gateway ConfigMap reconcile). The service reads both files once at start.
