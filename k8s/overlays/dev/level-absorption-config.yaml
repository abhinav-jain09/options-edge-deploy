# The Line health configuration (requirement rev 25 section 17, design 4.6a), a SECOND ConfigMap in this file so that the one existing apply
# step ("Apply level-absorption configuration" in Jenkinsfile.service-deploy, which cannot grow) creates it. IMMUTABLE and NAMED BY ITS CONTENT:
# the suffix is the first 12 hex digits of the SHA-256 of the file text below (keys sorted, one key=value per line, newline-terminated), which is
# also the configDigest the service writes into every line-health record, so the live check is: the name's suffix equals the first 12 digits of
# the digest in the status record. A changed value is a NEW object and a changed pod template. Mounted read-only at /home/options-edge/config/line-health,
# development only (k8s/overlays/dev/level-absorption-dev-enable-patch.yaml); production renders none.
# displayStaleSeconds=20 on development (M6, decision made by Claude under the owner's standing instruction; the owner may overrule): measured on dev 2026-11-06, status records reach the broker 5.7 to 9.3 s (median 6.85 s) after their second and consecutive status records are at most 3.2 s apart, because the tape the loop reads is held about 5 s by the linearizer; 5 s would show every line stale on a healthy pipeline. Requirement LH-N-2 does not hold on dev for the same reason (tracked deviation, see options-edge-documents design/line-health/m6-results.md).
# guardTicks=8 is EXPLORATORY (M6, decision made by Claude under the owner's standing instruction; the owner may overrule): candidate C2 of the guard search, chosen after the starting value 2 failed AC-8 on the 2026-11-05 windows (lag-free window active 0.84 of seconds) and scored on the same four windows, so it is NOT validated; `provisional` stays set. See options-edge-documents design/line-health/m6-results.md.
# Every value is a starting value made by Claude under the owner's standing instruction (the owner may overrule); all are uncalibrated (requirement LH-L-2).
# depthEnvironment is required and has no default: dev reads "Rithmic Paper Trading".
# scripts/ci/validate-line-health-config.sh checks the key set, the name against the hash, the mount and that only dev turns line health on.
