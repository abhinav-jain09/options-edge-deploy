# IMMUTABLE and NAMED BY ITS CONTENT: the name suffix is the first 12 hex digits of sha256(json.dumps(data, sort_keys=True)); the Deployment
# references this exact name, so a changed configuration is a NEW object and a changed pod template (the pod rolls), a pod can only ever
# mount the content its template names, and an out-of-band edit is refused by the API server. Old objects are left in place (a rollback
# re-points to one). scripts/ci/validate-level-absorption-config.sh computes the name and fails CI on any disagreement.
#
# The Level Absorption configuration the pod mounts at /home/options-edge/config/level-absorption (read-only).
#
# SOURCE OF TRUTH: options-edge-processing PR #1414, docs/level-absorption/phase0/indicator-eyeball-configuration.json
# and indicator-retention-artifact.json, copied verbatim and pinned by the validator. This enables the SPX indicator's
# support/resistance study kinds while keeping the existing provisional thresholds, EYEBALL-only marker and publication gate.
# This is not a selected Phase 0 candidate. The historical study remains in the processing repository unchanged.
# Retention is remeasured from one Friday dev replay (including the post-session missing-bar tail), not the old 158-session study:
# 5728075 bytes/day x 30 days x 2 = 343684500 bytes. The one-session sample is provisional; remeasure as more days become available.
# Deploy only with the companion image handling SPX study prices, enum decoding, named observations and moving-level withdrawals.
#
# The standalone slices carry Deployment/Service only, so service-deploy does not create this ConfigMap: Jenkinsfile.service-deploy
# applies this one file in the stage 'Apply level-absorption configuration' (the same kind of service-owned step as the
# feed-gateway ConfigMap reconcile). The service reads both files once at start.
