# DEV-ONLY ONE-TIME GRANT (2026-08-12) — the monolithic mirror of the standalone
# overlay's grant in k8s/services/indicator-service/overlays/dev (#801). dev's Kafka
# was wiped, so the epoch lineage is gone and indicator-service fail-closes rather
# than inventing one; the grant is deliberate and dev-only.
#
# MUST BE REVERTED to "false" — in BOTH overlays, together — once dev has genesis'd.
# Leaving it true would let any future wipe silently re-genesis, which is exactly what
# the fail-closed guard exists to prevent. The two overlays must render identically
# (validate-services mirror check); patching only one fails every service-deploy run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indicator-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: indicator-service
          env:
            - { name: INDICATOR_EPOCH_GENESIS, value: "true" }
