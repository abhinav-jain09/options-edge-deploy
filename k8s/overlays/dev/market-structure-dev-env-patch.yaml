# DEV-ONLY market-structure flags. The shared base carries every layer flag "false"; production's patch (market-structure-prod-env-patch.yaml) turns tools and geometry on.
# MARKET_STRUCTURE_TOOLS_ENABLED and MARKET_STRUCTURE_GEOMETRY_ENABLED are "true" here because that is what the running dev Deployment already reads (the feed-gateway dev patch has the matching
# GATEWAY_STRUCTURE_TOOLS_ENABLED / GATEWAY_GEOMETRY_ENABLED "true"); the manifest said "false", so a service-deploy of the base would have switched both layers off on dev. Recording the live
# state here is not a new rollout. Both are sampled once per schedule start and recorded in the recovery checkpoint (processing docs/ta-books/DEPLOY-ROLLOUT.md).
# MARKET_STRUCTURE_SWING_PIVOTS_ENABLED is "true" on dev only (X2, task T-5 of the level-absorption closure; decision made by Claude under the owner's standing instruction, the owner may overrule):
# the degree-2 swing points of the tools fold are published as Avro SwingPivotRecord (subject id 2606) on options.spx.market-structure.swing-pivots. Preconditions: subject 2606 on the dev registry
# (registered by service-deploy SERVICE=break-classifier REGISTER_TA_SCHEMAS=true; the service logs "swing-pivot publication off, schema not obtainable" and stays off for the schedule when it is
# missing) and the topic (ensure-market-structure-topics.sh, which the service-deploy barrier runs). Rollback: set it back to "false" here, regenerate the slices, deploy market-structure.
# MARKET_STRUCTURE_BREAK_EVENTS_ENABLED and MARKET_STRUCTURE_BREAK_COMPLETENESS_ENABLED are "true" on dev only, on the REGULAR container only (the estimate container does not publish break events; P1 of the
# producer requirement: at most one publisher of options.spx.market-structure.break-events per trade date). They were set by hand on the running dev Deployment on 2026-11-03 (processing PR 1592: the break events
# and the per-bar BreakCompletenessMarker, schema id 2608, which line-acceptance-service reads under GATE_HOST_COMPLETENESS=BAR_MARKER); a service-deploy of the base would have dropped them. Recording the live state
# here is not a new rollout. Production is untouched. MARKET_STRUCTURE_IGNORE_RECOVERY is deliberately NOT here (the W0 rollover flag is never committed; tests/test_ta_geometry_deploy_wiring.py pins that).
# MARKET_STRUCTURE_PATTERN_ALERTS_ENABLED is "true" on dev only (server-side pattern break alerts, processing market-structure-service/docs/PATTERN-ALERTS-SERVER-SIDE-DESIGN.md sections 4 and 8, requirement AL-19):
# PatternAlertEvent (id 2224) and PatternAlertWatermark (id 2225) on options.spx.market-structure.pattern-alerts (this container) and options.spx.market-structure.estimate.pattern-alerts (the estimate container, set in
# market-structure-estimate-dev-patch.yaml). It needs MARKET_STRUCTURE_GEOMETRY_ENABLED (true above). Preconditions, in this order: subjects 2224/2225 on the dev registry (schema-sync, manifest entries), the two topics
# (ensure-market-structure-topics.sh with ENVIRONMENT=dev), the image that reads the flag. The service checks the topics at boot (PatternAlertTopicCheck) and, on a miss, only stops publishing alerts; the host fold is untouched.
# An image without the feature ignores the variable. Production overlays are not edited by this work (the flag is absent there, default false). Rollback: "false" here, regenerate the slices, deploy market-structure.
# MIRRORS k8s/services/market-structure/overlays/dev — the slice generator renders it from here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-structure-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: market-structure
          env:
            - name: MARKET_STRUCTURE_TOOLS_ENABLED
              value: "true"
            - name: MARKET_STRUCTURE_GEOMETRY_ENABLED
              value: "true"
            - name: MARKET_STRUCTURE_SWING_PIVOTS_ENABLED
              value: "true"
            - name: MARKET_STRUCTURE_BREAK_EVENTS_ENABLED
              value: "true"
            - name: MARKET_STRUCTURE_BREAK_COMPLETENESS_ENABLED
              value: "true"
            - name: MARKET_STRUCTURE_PATTERN_ALERTS_ENABLED
              value: "true"
