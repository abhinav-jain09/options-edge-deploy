# DEV-ONLY: candlestick patterns on the PRE-MARKET estimate candles (owner request 2026-10-26: "make the candle pattern analysis work on
# pre-market candles too"; processing market-structure-service/docs/PREMARKET-ESTIMATE-CANDLESTICK-PATTERNS-REQUIREMENT.md).
# A SECOND container in the dev market-structure pod runs the same image with MARKET_STRUCTURE_SESSION_PROFILE=PREMARKET_ESTIMATE: it reads
# options.indicators.estimate.bars (the indicator-estimate container's bars, which carry the pre-market schedule and the average true range)
# and writes ONLY its own topics options.spx.market-structure.estimate.{ui,sequence,dlq,recovery,patterns}, which it creates itself. Its names
# are fixed in code and it refuses a generic override of them, so it cannot write a regular topic or share the regular transactional id.
# The container refuses to start unless MARKET_STRUCTURE_ESTIMATE_ENABLED=true, MARKET_STRUCTURE_PATTERNS_ENABLED=true and the runtime
# profile is not production. The regular container is not touched, and production overlays do not reference this file.
# Isolation, stated exactly (as for the indicator-estimate sidecar): the entrypoint halts the JVM when its loop fails, so kubelet restarts
# ONLY this container; a sidecar still shares the pod, so while it restarts the pod's ContainersReady condition is briefly false. Accepted for dev only.
# The sidecar has no readiness probe: its /health/ready is red outside 04:00-09:30 ET by design (no session), and a red probe must not take the
# regular container out of the pod's readiness. Liveness covers a hung loop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-structure-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: market-structure-estimate
          image: 192.168.100.252:5000/options-edge-market-structure:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: options-edge-config
            - secretRef:
                name: options-edge-runtime-secrets
          env:
            - { name: MARKET_STRUCTURE_SESSION_PROFILE, value: "PREMARKET_ESTIMATE" }
            - { name: MARKET_STRUCTURE_ESTIMATE_ENABLED, value: "true" }
            - { name: MARKET_STRUCTURE_PATTERNS_ENABLED, value: "true" }
            - { name: MARKET_STRUCTURE_HEALTH_PORT, value: "8082" }
            - { name: JAVA_TOOL_OPTIONS, value: "-Xms128m -Xmx384m" }
          ports:
            - name: estimate
              containerPort: 8082
          livenessProbe:
            httpGet:
              path: /health/live
              port: estimate
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
