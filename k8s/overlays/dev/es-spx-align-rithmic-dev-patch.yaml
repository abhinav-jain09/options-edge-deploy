apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-spx-align-service
  namespace: options-edge
spec:
  template:
    spec:
      initContainers:
        - name: align-schema-provision
          env:
            - name: ES_SPX_ALIGN_RITHMIC_DEPTH_ENABLED
              value: "true"
      containers:
        - name: es-spx-align
          env:
            - name: ES_SPX_ALIGN_RITHMIC_DEPTH_ENABLED
              value: "true"
