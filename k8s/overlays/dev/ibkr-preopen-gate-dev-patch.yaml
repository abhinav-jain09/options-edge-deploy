# DEV-ONLY pre-open publisher SELECT (OVERNIGHT-IBKR-GEX-GATE1-REQUIREMENT.md rev13+D15). BASE
# keeps every IBKR_GEX_* flag AND PREOPEN_GEX_ENABLED "false" (prod dormant); this last-applied
# dev patch picks which single pre-open publisher is live.
#
# R-PREOPEN one-publisher invariant: the Databento in-service PREOPEN_GEX publisher and the IBKR
# pre-open window are mutually exclusive by construction — IbkrPreOpenConfig REFUSES BOOT when
# both are true. So exactly one of {PREOPEN_GEX_ENABLED, IBKR_GEX_CONSUME/PUBLISH} may be true.
#
# CURRENT SELECTION: the IBKR pre-open window is LIVE on dev (IBKR_GEX_CONSUME_ENABLED and
# IBKR_GEX_PUBLISH_ENABLED true, PREOPEN_GEX_ENABLED false) — the rendered values below, not the
# 2026-08-20 Databento selection this paragraph used to describe. To go back to the Databento
# in-service publisher, flip this patch: IBKR CONSUME/PUBLISH → false and PREOPEN_GEX_ENABLED →
# true (never both true).
#
# databento-gex-preopen-dev-patch.yaml (applied BEFORE this one) already sets PREOPEN_GEX_ENABLED
# =true; keeping it true here makes the render unambiguous regardless of patch order.
#
# R-DOWN PREREQUISITE (satisfied): options-edge-processing feat/rdown-dispositions filters
# pre-open records out of the gamma-flow topology AND the gex history series, so publishing the
# window onto the shared live topic cannot contaminate either RTH construct.
#
# Databento Task B spot source is underlying.spx.price (PR6 PreOpenUnderlyingSpotReader) — the
# feed's live ES-basis SPX, NOT the flat SYNTHETIC_OPTION_SPOT that would fail IV solves; Task B
# fail-loud abstains if that spot is missing/stale rather than pricing against a bad number.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: databento-gex-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: databento-gex
          env:
            - { name: PREOPEN_GEX_ENABLED, value: "false" }
            - { name: IBKR_GEX_CONSUME_ENABLED, value: "true" }
            - { name: IBKR_GEX_PUBLISH_ENABLED, value: "true" }
            # The lines below are inert while IBKR consume/publish are false; they are retained so a
            # rollback to the IBKR window is a three-flag flip (the two above + PREOPEN_GEX_ENABLED).
            - { name: IBKR_GEX_TOPIC_STAGE, value: "live" }
            # The pre-open spot reader consumes the CANONICAL spot topic, which is Avro since the 18 Oct cutover.
            # This override still named underlying.spx.index.price, which the IBKR feed still writes as JSON, so the
            # Avro-only reader threw RecordDeserializationException on every poll and the pre-open path stayed
            # GATED reasons=SPOT_UNAVAILABLE — no gamma board at all on 19 Oct, in both environments.
            - { name: IBKR_GEX_SPOT_TOPIC, value: "underlying.spx.price" }
            - { name: IBKR_GEX_TOPIC, value: "options.databento.gex.strike" }
