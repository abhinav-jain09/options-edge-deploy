apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpsf-replay-orchestrator-service
  namespace: options-edge
spec:
  # DEV-ONLY: the historical-replay orchestrator is not part of the live option-chain path and is not
  # currently needed in dev, so it is scaled to 0 here. This keeps the deployment object (prod overlay
  # unaffected) but runs no pod — so it cannot CrashLoopBackOff and `kubectl rollout status` returns
  # immediately on 0/0 instead of timing out and failing the deploy. To re-enable dev backtest later,
  # set replicas back to 1 AND add HPSF_REPLAY_ALLOW_UNAUTHENTICATED_LIVE=true below (the LIVE_UNSECURED
  # security guard refuses to start without that explicit acknowledgement).
  replicas: 0
  template:
    spec:
      containers:
        - name: hpsf-replay-orchestrator
          env:
            # DEV-ONLY: flip from base SIMULATED to LIVE_UNSECURED so the dev cluster's "Run Backtest"
            # button actually launches HPSF replay runs. LIVE_UNSECURED disables Keycloak auth — safe
            # only on the Mac docker-desktop dev cluster which has no external exposure.
            # Prod overlay (when added) MUST use HPSF_REPLAY_MODE=LIVE + supply the auth env.
            - name: HPSF_REPLAY_MODE
              value: LIVE_UNSECURED
