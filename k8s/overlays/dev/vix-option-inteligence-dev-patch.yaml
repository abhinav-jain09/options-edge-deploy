# DEV-ONLY: turn the Gate-3 research evidence store ON, and say WHERE in the same breath.
#
# Both variables are set here TOGETHER, deliberately. The switch alone would be enough — the
# writer falls back to POSTGRES_JDBC_URL — but that fallback resolves through the shared
# options-edge-config, whose BASE value is production (k8s/infra/base/configmap.yaml:
# jdbc:postgresql://192.168.100.252:5432/options_flow). dev is correct today only because a
# SEPARATE file, configmap-dev-local-patch.yaml, overrides it. If that override were ever dropped,
# renamed, or left out of a new overlay, this pod would come up ENABLED and pointed at the
# PRODUCTION database — writing research evidence into it.
#
# So enablement and destination live in one file: nothing can turn the writer on in dev without
# also stating the dev database, and the two cannot drift apart in separate reviews. The URL below
# is intentionally the same value the dev configmap patch carries; if they ever disagree, this one
# wins and the writer is still in the right database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vix-option-inteligence-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: vix-option-inteligence
          env:
            - name: ZERODTE_RESEARCH_ENABLED
              value: "true"
            - name: ZERODTE_RESEARCH_JDBC_URL
              value: jdbc:postgresql://host.docker.internal:5432/options_flow_dev
            # Shadow prediction model (REQ rev 7 §6a/§8 step 1) — dev only. Same atomicity rule
            # as above: the switch and its required companion travel together. The writer
            # FAIL-FASTS if the shadow flag is on without ZERODTE_RESEARCH_ENVIRONMENT, because
            # every shadow row must say which environment produced it; setting them in one file
            # means no future overlay can inherit the flag without the provenance. Prod and es4
            # carry neither: flag absent = shadow off, and predicted_state stays NOT_EVALUATED
            # everywhere until promotion — shadow rows are invisible through the live view by
            # construction (zp_shadow_complete + zerodte_model_prediction_live).
            - name: ZERODTE_SHADOW_MODEL_ENABLED
              value: "true"
            - name: ZERODTE_RESEARCH_ENVIRONMENT
              value: dev
