# DEV-ONLY: enable the full pre-open GEX pipeline (PREOPEN-GEX-GATE1-REQUIREMENT.md) so a real
# capture@18:00 -> compute@08:00 cycle can be verified on dev before production is enabled. BASE keeps both
# flags "false" (prod dormant), so this patch is the ONLY place the feature is live. env merges by name over
# base. Both flags are fail-soft: the in-service scheduler never crashes the live GEX pipeline, and Task B
# abstains (never publishes) if the capture snapshot or the prior-close canonical spot is missing.
#
# DEPENDENCY: Task B's prior-close spot comes from databento_option_raw_snapshot.canonical_spot, written by
# the raw-postgres-writer. If that writer is not persisting on dev, Task B fail-loud abstains (no publish).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: databento-gex-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: databento-gex
          env:
            - { name: PREOPEN_GEX_ENABLED, value: "true" }
            - { name: PREOPEN_GEX_PUBLISH_ENABLED, value: "true" }
            # Dev now receives the same market-derived carry as production. Static carry remains an explicit
            # fallback below, so a delayed carry publication degrades loudly instead of blanking all strikes.
            - { name: DATABENTO_GEX_DYNAMIC_CARRY_ENABLED, value: "true" }
            # A single missed 5-minute publication must not disappear from the UI. Keep strike records usable
            # for 15 minutes, matching production, while the producer catches up.
            - { name: DATABENTO_GEX_STALE_AFTER_MS, value: "900000" }
            # Gamma-flow is an optional derivative of core per-strike GEX. Its startup must never remove the
            # healthy core stream from Service endpoints; flow health remains visible in its own metrics.
            - { name: GEX_FLOW_READINESS_GATE, value: "false" }
            # Deliberately reset the dev Streams application after enabling market carry so old static-carry
            # state cannot be replayed into the new calculation regime.
            - { name: KAFKA_GEX_STREAMS_APP_ID, value: "options-databento-gex-streams" }
            # DEV-FIRST rollout of the top-N gate (proc PR #466, requirement 2026-07-22): fade (gamma-flow)
            # + lifecycle (EMERGING/STICKY/FADING) compute ONLY the top-3 |netGex| strikes per chain; the
            # rest are gated before those calculations. Stage-1 per-strike netGex is unchanged. Enabling
            # switches the fade branch to isolated "-topn" stores (one-time fade-state reset, by design).
            # Prod stays 0 (default, byte-identical) until explicitly enabled after dev verification.
            - { name: DATABENTO_GEX_FLOW_TOP_N, value: "3" }
