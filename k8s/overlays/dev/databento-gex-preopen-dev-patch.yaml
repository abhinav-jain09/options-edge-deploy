# DEV-ONLY: enable the full pre-open GEX pipeline (PREOPEN-GEX-GATE1-REQUIREMENT.md) so a real
# capture@18:00 -> compute@08:00 cycle can be verified on dev before production is enabled. BASE keeps both
# flags "false" (prod dormant), so this patch is the ONLY place the feature is live. env merges by name over
# base. Both flags are fail-soft: the in-service scheduler never crashes the live GEX pipeline, and Task B
# abstains (never publishes) if the capture snapshot or the prior-close canonical spot is missing.
#
# DEPENDENCY: Task B's prior-close spot comes from databento_option_raw_snapshot.canonical_spot, written by
# the raw-postgres-writer. If that writer is not persisting on dev, Task B fail-loud abstains (no publish).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: databento-gex-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: databento-gex
          # DEV-ONLY CPU request (2026-07-29). Base reserves 250m for a Streams app configured with
          # KAFKA_GEX_STREAMS_NUM_THREADS=8, so under load the scheduler gives it almost nothing while
          # the dev node (docker-desktop, 16 cores / 93 GB) sits idle. Measured symptom: the 0DTE chain's
          # repartition partition fell ~1.1M records behind and was still GROWING at +6849/min during RTH,
          # which froze the 0DTE gex.magnet ~90 minutes behind while the 1DTE track stayed current.
          # NOT changed in base: prod runs the same deployment on a node measured at 90% CPU / loadavg 36
          # on 24 threads, where a larger reservation would take cores from the SPX feed it is starving on.
          # This raises the floor only; it does not remove the single-partition ceiling (see PR body).
          resources:
            requests:
              cpu: "2"
          env:
            - { name: PREOPEN_GEX_ENABLED, value: "true" }
            - { name: PREOPEN_GEX_PUBLISH_ENABLED, value: "true" }
            # Dev now receives the same market-derived carry as production. Static carry remains an explicit
            # fallback below, so a delayed carry publication degrades loudly instead of blanking all strikes.
            - { name: DATABENTO_GEX_DYNAMIC_CARRY_ENABLED, value: "true" }
            # A single missed 5-minute publication must not disappear from the UI. Keep strike records usable
            # for 15 minutes, matching production, while the producer catches up.
            - { name: DATABENTO_GEX_STALE_AFTER_MS, value: "900000" }
            # Gamma-flow is an optional derivative of core per-strike GEX. Its startup must never remove the
            # healthy core stream from Service endpoints; flow health remains visible in its own metrics.
            - { name: GEX_FLOW_READINESS_GATE, value: "false" }
            # Deliberately reset the dev Streams application after enabling market carry so old static-carry
            # state cannot be replayed into the new calculation regime.
            - { name: KAFKA_GEX_STREAMS_APP_ID, value: "options-databento-gex-streams" }
            # DEV-FIRST rollout of the top-N gate (proc PR #466, requirement 2026-07-22): fade (gamma-flow)
            # + lifecycle (EMERGING/STICKY/FADING) compute ONLY the top-3 |netGex| strikes per chain; the
            # rest are gated before those calculations. Stage-1 per-strike netGex is unchanged. Enabling
            # switches the fade branch to isolated "-topn" stores (one-time fade-state reset, by design).
            # Prod stays 0 (default, byte-identical) until explicitly enabled after dev verification.
            - { name: DATABENTO_GEX_FLOW_TOP_N, value: "3" }
            # DEV-FIRST: turn the OI anchor manifest on where it can be watched (OI-SHADOW-EXECUTION-PLAN
            # step 2). It reconciles the morning settled open-interest response against an independent
            # instrument-definition universe and publishes ONE immutable manifest per session.
            #
            # Publication is NOT on the first sound response: the manifest is immutable and once-only, so
            # the first one accepted holds the session's only slot all day, and early fetches are routinely
            # sound and routinely thin while the exchange's publication is still landing. It waits for two
            # sound observations 120s apart carrying identical content, and falls back to the newest sound
            # view at 09:25 ET. Attempts before 08:00 ET are not candidates. So expect a manifest during
            # the 08:00-09:25 ET window, not at 08:00 sharp.
            #
            # What to watch: oi_anchor_published_total should reach 1, carried by
            # ..._published_on_stability_total rather than ..._published_on_fallback_total. A fallback
            # publication means no two observations ever agreed -- usable, but worth investigating.
            # ..._incomplete_attempts_total counts unsound responses, which are never published at all.
            #
            # Fail-soft: the work runs on its own daemon thread behind a bounded queue, so it cannot make
            # the live gamma surface wait on it. Its only consumer, oi-shadow-service, stays disabled.
            - { name: OI_ANCHOR_MANIFEST_ENABLED, value: "true" }
            # DEV-FIRST validation of the EXPERIMENTAL smile-IV fallback (proc commit 3fe1a2f7,
            # Codex round-3 APPROVE): rebuild short-dated legs whose IV solve failed on the measured
            # BELOW-INTRINSIC branch from the freshest near-ATM solved IV. The measured 0DTE failure
            # mode drops ~half the near-ATM ladder (100% SD_IV_FAIL_BELOW_INTRINSIC; parity recovery
            # starved). Rebuilt legs are flagged SMILE_IV_FALLBACK, excluded from netGexStrict, and
            # never anchor-eligible; default in code is OFF, this flag is the only enable. Prod stays
            # off until dev shows near-ATM coverage recovery without flip-level artifacts. Watch
            # options_edge_databento_gex_smile_fallback_total{event=...} and the near-ATM GEX-missing
            # share in strike-intelligence.
            - { name: GEX_SMILE_IV_FALLBACK, value: "true" }
