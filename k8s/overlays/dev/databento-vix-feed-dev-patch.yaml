# databento-vix-feed DEV overrides (VIX-FEED-SEPARATION §12 dev phase, USER-directed
# simultaneous cutover 2026-07-28): dev broker + dev runtime profile. Everything else
# (instrument, topic, port, probes) inherits the role base unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: databento-vix-feed
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: databento-vix-feed
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: host.docker.internal:19092
            - name: VIX_FEED_RUNTIME_PROFILE
              value: dev
            # IBKR VIX hop topic lives on THIS env's local broker (ibkr-feed fans out
            # to both clusters) — same env-local rule as KAFKA_BOOTSTRAP_SERVERS.
            - name: VIX_INDEX_SOURCE_BOOTSTRAP
              value: host.docker.internal:19092
          # Canonical registry name on purpose: the overlay's images: transformer matches
          # 192.168.100.252:5000/... and rewrites it to the dev registry, and only then does
          # the deploy's digest pin apply. Writing host.docker.internal here bypassed BOTH,
          # leaving the one un-pinned image that aborted every apply (guard: "rendered
          # Deployment images are not digest-pinned before apply").
          # databento-vix-feed runs the databento-feed binary in VIX-only mode — same image.
          image: 192.168.100.252:5000/options-edge-databento-feed:dev
