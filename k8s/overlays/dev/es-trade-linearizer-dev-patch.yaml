# DEV-ONLY patch for es-trade-linearizer-service (2026-10-07).
# The base deployment sets ES_LINEARIZER_BOOTSTRAP_SERVERS to the production broker because the service was
# production-only; LinearizerSettings reads that key BEFORE the shared KAFKA_BOOTSTRAP_SERVERS, so the configmap
# alone would not redirect it. On dev the ES trades (underlying.es.trades) and the linearized tape live on the
# env-local broker, exactly like the feeds' KAFKA_BOOTSTRAP_SERVERS in the sibling dev patches.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-trade-linearizer-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: es-trade-linearizer
          env:
            - name: ES_LINEARIZER_BOOTSTRAP_SERVERS
              value: host.docker.internal:19092
            # DEV-ONLY reorder window. The base sets 5000 and production inherits it, which is correct where
            # underlying.es.trades is produced locally. On dev that topic is MirrorMaker-copied from es4
            # partition-by-partition (32 partitions) and merged into the 1-partition linearized tape, so
            # cross-partition skew is far larger than 5 s. Measured 2026-10-26:
            #   es_linearizer_late_appended_total         829   (of 289,516 received, 0.29%)
            #   es_linearizer_late_appended_max_behind_ms 66765
            #   es_linearizer_late_reordered_total         13   (the in-grace path works)
            # Every late APPEND lands behind the head of a topic its consumers are told is 'a single partition
            # in total order', and level-absorption's GlobexPath fail-closes on the first one
            # (ContractViolation GLOBEX_PATH_TAPE_ORDER_VIOLATED, 21 crash-restarts in 90 min). 120 s puts the
            # window clear of the observed 66.8 s so those records are REORDERED in the buffer instead. This
            # fixes the INPUT rather than weakening the consumer's contract.
            # COST, accepted for dev: the linearized tape now lags real time by up to 120 s, and every dev
            # consumer of it sees that delay - break-score, es-compression-expansion, es-trade-tools and
            # level-absorption. All are dev shadow/eyeball services.
            # LIMIT, stated honestly: this REDUCES out-of-order emissions, it does not make them impossible. A
            # skew above 120 s would still produce one and GlobexPath would still fail-closed. The guaranteed
            # fix is for the consumer to treat an out-of-order print as late - which GlobexPath already does
            # one line earlier for prints behind the bar boundary - and that is the owning service's call, not
            # a deploy-config decision.
            - name: ES_LINEARIZER_GRACE_MS
              value: "120000"
