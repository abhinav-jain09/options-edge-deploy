# DEV-ONLY capacity patch (2026-08-05). TEMPORARY — see RESTORING below.
#
# THE ARITHMETIC. The dev node is docker-desktop with 10 allocatable CPUs. kube-system takes 950m
# and jenkins 500m, so options-edge has 8550m. Before these patches the rendered dev fleet asked
# for 10600m, and with dealer-ledger alone it would still ask 8600m — 50m MORE than exists — because
# databento-gex-service's dev overlay deliberately reserves 2 full CPUs
# (databento-gex-preopen-dev-patch.yaml: at the base 250m its 8-thread Streams app fell ~1.1M
# records behind on the 0DTE repartition, growing +6849/min). The fleet only ever ran because
# several deployments were failing to schedule anyway. When the local-registry container exited at
# 02:02 on 2026-08-05 and every deployment rescheduled at once, databento-gex-service lost the race
# and sat Pending on "Insufficient cpu" — GEX went dark on dev with no bad code anywhere.
#
# THE LEVER (one of three patches; see the kustomization for the set). dealer-ledger-service is the
# largest non-critical consumer at exactly 2000m and sits
# DOWNSTREAM of GEX (it consumes options.databento.gex.strike; the gateway reads GEX directly and
# treats the dealer-ledger topics as optional), so it yields precisely the reservation gex needs
# without touching the evidence-backed gex request. It is the first of THREE: with unified-sr the
# render is 8350m, and pressure-postgres-writer takes it to 8250m — 300m of headroom, which the
# budget needs for a rollout surge (250m), not merely for steady state.
# scripts/ci/validate-dev-capacity.sh holds the current numbers and asserts them.
#
# WHAT THIS COSTS (stated explicitly): the dealer-ledger UI plane is gone from the dev board;
# close-direction-service stops receiving fresh dealer-ledger input; and the calibration chain goes
# quiet with it — the scorer sees no new dealer-ledger-signal-fired, so no fresh outcomes reach the
# accumulator. All of it resumes when the patch is reverted.
#
# RESTORING (all four steps, or the fix half-reverts):
#   1. delete this file
#   2. remove its entry from k8s/overlays/dev/kustomization.yaml
#   3. remove dealer-ledger-service from DISABLED_DEV in scripts/ops/dev-cleanup.sh
#   4. re-run scripts/deploy/generate-service-slices.sh — otherwise the standalone slice stays at
#      replicas 0 and either fails mirror validation or silently keeps the service down
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealer-ledger-service
  namespace: options-edge
spec:
  replicas: 0
