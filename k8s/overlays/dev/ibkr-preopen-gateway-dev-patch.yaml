# 2026-09-08: the board needs BOTH halves. GATEWAY_IBKR_PREOPEN_ENABLED=true keeps the
# slice-1 STATUS plane (path/FRESH/GATED) flowing; the value plane stands down so pre-open
# numbers ride the ordinary gex-by-strike delivery the UI actually renders. Slice 2 publishes
# them as "ibkr-preopen-gex", which no web client consumes (zero hits in options-edge-web
# main), so with the value plane ON the browser reads every row as numberless.
# Turn ARBITRATION back on once the web grows that consumer (gateway #169).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-gateway-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: feed-gateway
          env:
            - { name: GATEWAY_IBKR_PREOPEN_ENABLED, value: "true" }
            - { name: GATEWAY_IBKR_PREOPEN_GEX_ARBITRATION_ENABLED, value: "false" }
