# Dev overlay env patch for the OptionsEdge web Deployment.
#
# The base manifest (k8s/base/options-edge-web-deployment.yaml) hard-codes the PROD
# public edge URLs (auth.bleadingoptions.com, wss://bleadingoptions.com, …). Those are direct
# container env values, so they win over the dev `options-edge-config` ConfigMap
# (envFrom). This strategic-merge patch overrides only the URL/profile env vars with
# the dev-local values — the exact set proven by the historical local-run dev deploy
# (options-edge-web-deploy #224, which passed the Selenium live-UI smoke):
#   - Keycloak issuer:  http://192.168.100.102:8089/realms/optionsedge
#   - Feed-gateway WS:   ws://192.168.100.102:8093/ws/events  (browser + server)
#   - Replay orchestrator: http://localhost:8095 (dev host jar)
#
# UI base / mission-control point at the k8s web Service's own port. PR #104 originally
# exposed options-edge-web on :8094 to coexist with the legacy local Docker web on :8090
# during cutover; that legacy :8090 listener is gone (container stopped + options-edge-web-
# deploy RUN_LOCAL=false), so DEV now serves the k8s web on :8090 (the kustomization patches
# the Service port to 8090). This matters: the feed-gateway (WS_ALLOWED_ORIGINS) and replay
# orchestrator (CORS) trust origin http://localhost:8090, so a browser loading the UI at
# :8090 gets its live-data WS + replay accepted with NO per-port allow-list churn — and the
# user's existing http://localhost:8090/option-chain URL works. PROD is unchanged: it keeps
# the base Service :8094 behind Cloudflare (this is a dev-overlay-only move). In docker-
# desktop k3s the ServiceLB binds :8090 on localhost; the dev Verify/Smoke stages default to
# http://localhost:8090 (Jenkinsfile), so the pipeline verifies THIS k8s web.
#
# Auth stays MANDATORY in dev (mirrors prod per rule.md) — only the issuer host changes.
# Image + imagePullPolicy are handled by the dev overlay kustomization (images: rewrite
# to host.docker.internal:5001/options-edge-web:dev, and the all-Deployments
# imagePullPolicy: Always patch). Postgres/Kafka/schema-registry come from the dev
# `options-edge-config` ConfigMap via the base's envFrom (unchanged here).
#
# Strategic-merge merges env entries by `name`, so only the overridden vars are listed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: options-edge-web
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            # Read-only Rithmic Test depth, supplied by the owner's loopback collector/private tunnel.
            - name: APP_PROFILE
              value: "dev"
            # Auth ON in dev (mirrors prod). Keycloak's OWN configured hostname is dev-auth.bleadingoptions.com
            # (its discovery doc self-reports this issuer regardless of which address you query it on --
            # confirmed by hitting both http://192.168.100.102:8089/... and https://dev-auth.bleadingoptions.com/...
            # discovery endpoints directly), so every token it mints carries THAT iss claim. The old
            # 192.168.100.102:8089 value below was reachable but WRONG: SecurityConfig.java's
            # JwtIssuerValidator matches this value against the token's iss claim byte-for-byte, so it
            # rejected every token with a bare 401 (no body) -- the root cause of the 2026-09-24
            # "signing in forever" loop AND every /api/* 401 once signed in (the frontend's generic
            # on-401 handler re-triggers login(), which re-loops). Reachable from BOTH the pod
            # (jwtDecoder validation, verified via a throwaway pod curl) and the browser (already the
            # actual login redirect target). If the Mac IP or hostname ever drifts again, re-add
            # VITE_AUTH_ENABLED=false + AUTH_ALLOW_DISABLED=true here to boot public.
            # Shared dev broker is owner-only (Local Broker Step 0 / R23): only these Keycloak subjects pass
            # /api/context-tape/orders/**. Absent or blank = the namespace denies everyone. Dev only; prod and
            # experiment deliberately do not set it.
            - name: CONTEXT_TAPE_ORDER_OWNER_SUBJECTS
              value: "c7e72344-2b53-4435-b9d2-05b7ac17363b"
            # Local Broker dev-side services (web PRs 1137-1146): off unless LOCAL_BROKER_ENABLED=true; the same switch
            # publishes LOCAL_BROKER_ALLOWED on /env.js. The two introspection client secrets come from the
            # `local-broker-keycloak` Secret (created out of band from the owner's file; never in git). The introspection
            # URI uses the internal Keycloak address the pod already uses for AUTH_JWK_SET_URI (the public issuer host is
            # not what this pod is proven to reach). Dev only: prod and experiment do not set any of these.
            - name: LOCAL_BROKER_ENABLED
              value: "true"
            - name: LOCAL_BROKER_INTROSPECTION_URI
              value: "http://host.docker.internal:8089/realms/optionsedge/protocol/openid-connect/token/introspect"
            - name: LOCAL_BROKER_LEASE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: local-broker-keycloak
                  key: LOCAL_BROKER_LEASE_CLIENT_SECRET
            - name: LOCAL_BROKER_SPOT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: local-broker-keycloak
                  key: LOCAL_BROKER_SPOT_CLIENT_SECRET
            # Level Absorption dev visibility (2026-10-25, owner standing goal): turns on the web tier's level-absorption listener
            # and the manual-line commands. The ack secret (16+ chars) is generated into the `level-absorption-web` Secret on the
            # dev cluster out of band and referenced here; its value is never in git. Dev only: prod and experiment do not set either.
            # MUST MIRROR the other dev web env patch (validate-services render equivalence).
            # Line health user lines (requirement LH-U-2, M5; dev only): PUT/DELETE /api/line-health/user-lines/{lineId} publish the Order view's drawings to
            # futures.line-health.user-lines (id 3704). Default false in the image (the endpoints answer 409); prod and experiment do not set it.
            - name: LINE_HEALTH_USER_LINES_ENABLED
              value: "true"
            - name: LEVEL_ABSORPTION_PATH_UI_ENABLED
              value: "true"
            - name: LEVEL_ABSORPTION_UI_ENABLED
              value: "true"
            - name: LEVEL_ABSORPTION_ACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: level-absorption-web
                  key: LEVEL_ABSORPTION_ACK_SECRET
            - name: CONTEXT_TAPE_PUBLIC_ORIGINS
              value: "http://localhost:8090,http://127.0.0.1:8090,https://dev.bleadingoptions.com,https://dev-lan.bleadingoptions.com:8443"
            - name: VITE_AUTH_ISSUER
              value: "https://dev-auth.bleadingoptions.com/realms/optionsedge"
            # Fetch signing keys directly from the dev host, independently of Cloudflare.
            # Token issuer, audience, expiry and signature validation remain enabled.
            - name: AUTH_JWK_SET_URI
              value: "http://host.docker.internal:8089/realms/optionsedge/protocol/openid-connect/certs"
            # Both dev web origins use the existing authenticated dev stream ingress. The LAN TLS
            # bridge forwards only to the web tier, so /ws/events cannot use that bridge's origin.
            # Keep the server's health probe on Kubernetes Service DNS below.
            - name: APP_FEED_GATEWAY_WS_URL
              value: "wss://dev.bleadingoptions.com/ws/events"
            - name: APP_FEED_GATEWAY_HEALTH_URL
              value: "http://feed-gateway-service:8091/health"
            # Server-side history-backfill proxy target (GET /api/liquidity-history in
            # Explicit for clarity; this is also the REST base derivable from the health URL above.
            - name: FEED_GATEWAY_REST_URL
              value: "http://feed-gateway-service:8091"
            - name: VITE_WS_URL
              value: "wss://dev.bleadingoptions.com/ws/events"
            # This deployment serves APIs from the origin root, including pages at /option-chain.
            # An explicit / keeps each page route out of API and mission-control request paths.
            - name: VITE_API_BASE_URL
              value: "/"
            - name: VITE_MISSION_CONTROL_URL
              value: "/"
            - name: VITE_REPLAY_ORCHESTRATOR_URL
              value: "http://localhost:8095"
            # ES BOX layer on /context-tape (2026-10-07): the es-compression-expansion shadow view (dev runs it too).
            - name: VITE_ES_BOX_ENABLED
              value: "true"
            # Personal trading journal (options-edge-trading-journal). The BASE URL of that
            # service, not a link target: the Journal page itself is served by this web app on
            # this origin, like every other nav item, and only its DATA is fetched from here with
            # the token the shared auth module already holds.
            #
            # That is the whole point. Pointing the nav item at this port made it a different
            # ORIGIN, which the shared session cannot reach, so the journal had to run its own
            # sign-in and the user was asked to log in a second time. The data is now same-origin
            # too, so nothing about the journal crosses an origin any more.
            # Kept in step with the standalone slice k8s/services/web/overlays/dev — the mirror
            # rule requires the two to render identically, and it caught exactly this when only
            # one was changed.
            #
            # DEV ONLY and deliberately absent from the base: that service is deployed at dev
            # alone, so a base value would put a dead Journal item in the production nav. This one
            # setting drops the nav item, 404s the page AND 404s the data proxy together, so
            # production cannot answer on a route for a feature it does not have.
            #
            # A CLUSTER Service name, because the fetch is NOT made by the browser. The page
            # asks this origin for /journal/api/** and the web app proxies it from here.
            #
            # This was "http://localhost:8097", handed to the page to fetch directly, on the
            # reasoning that the journal API is a LoadBalancer on the dev machine and the fetch is
            # made by the browser, which runs there. The browser runs wherever the person is. So
            # every request went to port 8097 ON THE READER'S OWN MACHINE, was refused, and the
            # page reported the journal unreachable — while the service answered 200 in the
            # cluster the whole time. An address that is only true on one machine must not be
            # shipped to every machine, so it stays here, where it is true.
            #
            # The item is owner-only — hidden unless the token carries journal-owner — and the
            # journal's own API default-denies regardless, so the nav entry is convenience, not
            # access control.
            - name: APP_JOURNAL_API
              value: "http://journal-api:8097"
            # THE HUNT TOPICS THE DEV WEB LISTENS TO AND COMMANDS. Dev's hunt runs under its own
            # identity (REVERSAL_HUNT_INSTANCE_ID=dev, processing #700) and so writes
            # dev.es.reversal.hunt.{status,alerts,state} and reads dev.es.reversal.hunt.commands.
            # The web's default is the UN-prefixed names, which belong to production's hunt on the
            # same es4 broker: the dev page was hearing production, and when that stopped writing
            # (last record 2026-11-02 23:45 UTC) every "Bottom found" / "Top found" shout and the
            # LIVE badge went quiet, while dev's own hunt kept publishing voice-eligible calls
            # (120 alerts in one pod's life) into topics nothing read. ARM/DISARM went to the
            # un-prefixed commands topic, where dev's hunt is not a consumer, for the same reason.
            - name: HUNT_STATUS_TOPIC
              value: "dev.es.reversal.hunt.status"
            - name: HUNT_ALERTS_TOPIC
              value: "dev.es.reversal.hunt.alerts"
            - name: HUNT_STATE_TOPIC
              value: "dev.es.reversal.hunt.state"
            - name: HUNT_COMMANDS_TOPIC
              value: "dev.es.reversal.hunt.commands"
