# DEV mirror of the standalone overlay (k8s/services/option-price-behavior/overlays/dev): the session
# aggregate is keyed by symbol, so all SPX work lands on one Kafka partition. Keep the optional rolling tiles
# disabled on the capacity-limited dev cluster just as in production; otherwise five window updates per print
# make the session output fall behind. #482 added this to the standalone overlay only, drifting the monolithic
# dev render — this patch restores mirror parity. env merges by name over the base.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: option-price-behavior-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: option-price-behavior
          env:
            - { name: OPB_ROLLING_WINDOWS_ENABLED, value: "false" }
            - { name: JAVA_TOOL_OPTIONS, value: "-Xms512m -Xmx3g" }
            # DEV-ONLY: emit the L1 contribution stream, which also CREATES the topic
            # option-price-behavior-l1-contributions. That creation is why this has to land: Kafka
            # Streams refuses to start a topology whose source topic does not exist
            # (MissingSourceTopicException, SHUTDOWN_CLIENT), so option-pressure-state cannot run
            # at all until this does. Measured on a real session it adds 735 MiB to that topic,
            # which the service retains for 4 days rather than forever. It adds one sink to the
            # topology, which keeps the application id and the existing store identities — but
            # calling the existing outputs "untouched" was wrong: applying it restarts the service,
            # and because its RocksDB state is on one ReadWriteOnce PVC the base now pins
            # strategy: Recreate, so the restart is a brief full stop and
            # option-price-behavior-by-strike is unavailable for that window.
            - { name: OPB_L1_ENABLED, value: "true" }
