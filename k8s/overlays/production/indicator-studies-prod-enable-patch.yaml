# PRODUCTION: Phase A indicator studies (STUDIES_V1) switched ON for the indicator-service container.
# The base manifest carries INDICATOR_STUDIES_ENABLED="false" (experiment and base keep it); this patch overrides it for production only.
# Writes options.indicators.studies.bars / .current (declared in scripts/kafka/topics.env; schema ids 2501-2503 registered on the prod
# registry, topics ensured on the prod broker). The indicator-estimate sidecar is a different container and is not touched.
# Rollback (complete): ONE PR that BOTH sets GATEWAY_STUDIES_ENABLED back to "false" in k8s/overlays/production/feed-gateway-prod-env-patch.yaml AND
# sets this producer flag to "false" (or removes this patch AND reverts the gateway flag in the same PR - never one without the other),
# then scripts/deploy/generate-service-slices.sh to regenerate k8s/services/{indicator-service,feed-gateway}/overlays/production/manifest.yaml
# (CI's mirror rule and tests/test_indicator_studies_topics.py refuse a slice that disagrees with the overlay), then service-deploy of both
# services and a check that the live pod environment reads false. The flag is read at start.
# Enable order (operationally enforced: service-deploy rolls ONE service per Jenkins run, so the two applies are separate, ordered runs):
# feed-gateway first (verify the pod's imageID and gateway_* metrics), indicator-service second (verify the pod and the studies topics).
# Preflight (before the first run): the digest part (the text after '@') of the imageID of the container NAMED indicator-service (`kubectl -n options-edge get pod <pod> -o jsonpath='{.status.containerStatuses[?(@.name=="indicator-service")].imageID}'`; the runtime prefix before '@' is ignored) is EXACTLY sha256:318537b9402ab7b3e40ebea4467e52bf29b8d3a2ee91dfe9bccc2ff9d9bfcad4 (options-edge-processing build #2041 at commit 06a8fd8e05b3eacfe17f4427019dfa6fb47e5baf, which contains the studies code and the bar-id bound fix) and NO other digest (a different digest needs its own PR that updates this line after a capability check; read the live value with `kubectl get pod -o jsonpath` imageID); feed-gateway runs EXACTLY sha256:62d099c5483b4570c17c34df93ebe9f20ba47761fef09f6b95abe8064b3a2c5b (option-edge-feed-gateway build #801 at commit fd4fe773abe7868cccd77dfb7f541cef269a2e0b, studies relay + bar-id bound fix) and web runs EXACTLY sha256:9a983a56d8c3265d67bb795421d21e3e9ac5c62396bff95107700930ea5c39ba (options-edge-web-deploy build #1461 at commit 643b80609e6126c1e30d3627747ae884975f58d5), compared the same way (container named feed-gateway / web, digest after '@'); schema ids 2501-2503 resolve on the production registry; the two studies topics exist.
# Validation signals after the producer run: options.indicators.studies.current end offset advances and a newly produced record decodes with SCHEMA ID 2502 (subject com.optionsedge.contracts.indicators.avro.StudiesCurrent; bars use schema id 2501, subject ...StudyBar); gateway_studies_* metrics show accepted > 0 and drops 0. Bars: options.indicators.studies.bars receives records only while SPX cash bars exist (the session), so a newly produced record decoding with schema id 2501 at offset >= the pre-run end offset is verified at the next session; outside the session it is NOT claimed. Schema id 2503 (subject ...StudyEngineImage) is the producer's own engine-image checkpoint record (not a UI output); it is checked by the pod starting without a schema error.
# Provenance: the digest being activated is recorded in the rollout record before the run and compared with the live imageID after it. Soak: after the rollout capture the NEW pod's name and UID (the pod whose imageID is the digest above; the Deployment is Recreate, so exactly one) and query that pod only: the restartCount of the container NAMED indicator-service (select by name in status.containerStatuses) must be 0 at first Running and stay 0 through 10 minutes; `kubectl -n options-edge logs <that pod> -c indicator-service --since=10m | grep -c ' ERROR '` must be 0; gateway_studies_accepted_total (rises) and gateway_studies_drops_total (flat) are read at both ends of the window from the one feed-gateway pod, whose UID and feed-gateway-container restartCount are captured at the start and re-read at the end: ANY change of that UID or restartCount, or a counter that DECREASES between reads, voids the window and it is restarted from fresh start reads; the gateway pod is also confirmed to be the one running the gateway digest above.
# Abort criteria (either run): the deploy's health gate fails, the pod restarts, or its log shows a schema/serialization error - then roll the flag back FIRST.
# Rollback order (reverse of enable): indicator-service (producer false) first, then feed-gateway (relay false); verify each live pod environment reads "false".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indicator-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: indicator-service
          env:
            - { name: INDICATOR_STUDIES_ENABLED, value: "true" }
