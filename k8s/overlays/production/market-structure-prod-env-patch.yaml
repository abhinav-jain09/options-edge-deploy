# PROD-ONLY: the transactional.id of market-structure-service. Each environment has its OWN id (a
# second producer with the same id fences the first, and a dev pod must never fence the prod one on a
# shared broker). The base carries the dev id.
#
# PRODUCTION layer flags (owner: complete the prod deployment, one layer at a time): MARKET_STRUCTURE_TOOLS_ENABLED is "true" here (CHART-STRUCTURE-TOOLS,
# topic options.spx.market-structure.tools, Avro subject id 2211; the base carries "false"). MARKET_STRUCTURE_GEOMETRY_ENABLED is "true" here since its own PR (CLASSICAL-CHART-PATTERNS, topic options.spx.market-structure.geometry, subjects 2221/2222).
# Enable order (two ordered service-deploy runs; one service per run - service-deploy takes exactly one SERVICE and the Jenkins job is single-flight, so the two applies cannot be concurrent; never use the full-stack options-edge-deploy monolith for this flip): feed-gateway first (GATEWAY_STRUCTURE_TOOLS_ENABLED, the gateway then waits for records),
# then market-structure (the flag is read once per schedule, so the rollout restarts the pod; the pod restores from its ms-runtime-5 checkpoint).
# Preflight: the live gateway and market-structure imageIDs equal the digests recorded in the rollout record; subjects 2211 (tools) and 2221/2222 (geometry) resolve on the production registry;
# options.spx.market-structure.tools AND options.spx.market-structure.geometry exist. Abort: the deploy's health gate fails, the restartCount of the container NAMED market-structure in the NEW pod (select it by name in status.containerStatuses; it must read 0 at first Running and is polled at least every 60 s through the whole 10-minute window that starts at state.running.startedAt; the planned rollout replacement itself is not a restart) rises above 0, `kubectl -n options-edge logs <new pod> -c market-structure --since=10m | grep -c ' ERROR '` is not 0, or the gateway's `gateway_structure_tools_drops_total` or `gateway_geometry_drops_total` (each layer is judged on its own counter; geometry correctness signal: the geometry topic's end offset is recorded BEFORE the producer run (baseline B); within the 10-minute window a record at offset >= B must exist and decode with subject id 2221 (GeometryAnnotationSet) or 2222 (GeometryUnavailable) - either is a valid emission, 2222 being the producer's explicit 'unavailable' set - and gateway_geometry_accepted_total must have risen; if no record at offset >= B appears by the end of the window the layer is ABORTED and rolled back, and a record at offset < B never counts (single series, read from the one feed-gateway pod's /metrics at the start and end of the window; both samples are pinned to the same gateway pod UID; ANY change of that UID or of its restartCount between the samples voids the window and it is restarted from a fresh start sample) rises.
# Rollback (reverse order, ONE PR): set MARKET_STRUCTURE_TOOLS_ENABLED, MARKET_STRUCTURE_GEOMETRY_ENABLED, GATEWAY_STRUCTURE_TOOLS_ENABLED and GATEWAY_GEOMETRY_ENABLED back (a single layer may be rolled back alone by flipping only its own two flags) to "false" in this file and in
# feed-gateway-prod-env-patch.yaml, run `timeout 120 scripts/deploy/generate-service-slices.sh`, deploy market-structure first, then feed-gateway, and verify both live environments read "false"; after EACH reverse-order deployment repeat the same 10-minute observation window (pod Running, restartCount 0, no ERROR, drop counter flat) before declaring that step complete.
# Fail-closed verification protocol (every layer; any failure of any query, decode, metric read or log read is ABORT-AND-ROLLBACK, never "no finding"):
#   run every shell check under `set -euo pipefail` and treat a non-zero exit of kubectl/kcat/curl as a failed check.
#   1 before the producer run, from the pinned healthy gateway pod (record its UID): capture the layer topic's partition->end-offset vector (these topics are
#     exact 1-partition topics, so the vector is one entry; a different partition count, a leadership change or an end offset that went DOWN is an anomaly = abort) and the gateway counters.
#   2 run the producer deployment; the deadline starts at the new pod's state.running.startedAt (10 minutes).
#   3 correlation: the only producer that can write these topics is the single transactional id market-structure-service-production (Kafka cannot be written by this id from two pods;
#     the Deployment is Recreate, one replica); a record at offset >= the baseline whose decoded sessionDate/scheduleId is today's schedule and whose key is that schedule's key is this rollout's
#     emission; the gateway counter must rise between the step-1 read and a final read taken from the SAME gateway pod UID.
#   4 rollback assertion: after the layer is disabled and redeployed, the layer topic's end offset stays flat for a further 10 minutes and the gateway counter does not rise.
# MIRRORS k8s/services/market-structure/overlays/production — the slice generator renders it from here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-structure-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: market-structure
          env:
            - name: MARKET_STRUCTURE_TRANSACTIONAL_ID
              value: market-structure-service-production
            - name: MARKET_STRUCTURE_TOOLS_ENABLED
              value: "true"
            - name: MARKET_STRUCTURE_GEOMETRY_ENABLED
              value: "true"
