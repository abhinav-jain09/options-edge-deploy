# PROD-ONLY: the transactional.id of market-structure-service. Each environment has its OWN id (a
# second producer with the same id fences the first, and a dev pod must never fence the prod one on a
# shared broker). The base carries the dev id.
#
# PRODUCTION layer flags (owner: complete the prod deployment, one layer at a time): MARKET_STRUCTURE_TOOLS_ENABLED is "true" here (CHART-STRUCTURE-TOOLS,
# topic options.spx.market-structure.tools, Avro subject id 2211; the base carries "false"). MARKET_STRUCTURE_GEOMETRY_ENABLED stays "false" until its own PR.
# Enable order (two ordered service-deploy runs; one service per run - service-deploy takes exactly one SERVICE and the Jenkins job is single-flight, so the two applies cannot be concurrent; never use the full-stack options-edge-deploy monolith for this flip): feed-gateway first (GATEWAY_STRUCTURE_TOOLS_ENABLED, the gateway then waits for records),
# then market-structure (the flag is read once per schedule, so the rollout restarts the pod; the pod restores from its ms-runtime-5 checkpoint).
# Preflight: the live gateway and market-structure imageIDs equal the digests recorded in the rollout record; subject 2211 resolves on the production registry;
# options.spx.market-structure.tools exists. Abort: the deploy's health gate fails, the restartCount of the container NAMED market-structure in the NEW pod (select it by name in status.containerStatuses; it must read 0 at first Running and is polled at least every 60 s through the whole 10-minute window that starts at state.running.startedAt; the planned rollout replacement itself is not a restart) rises above 0, `kubectl -n options-edge logs <new pod> -c market-structure --since=10m | grep -c ' ERROR '` is not 0, or the gateway's `gateway_structure_tools_drops_total` (single series, read from the one feed-gateway pod's /metrics at the start and end of the window; both samples are pinned to the same gateway pod UID; ANY change of that UID or of its restartCount between the samples voids the window and it is restarted from a fresh start sample) rises.
# Rollback (reverse order, ONE PR): set MARKET_STRUCTURE_TOOLS_ENABLED and GATEWAY_STRUCTURE_TOOLS_ENABLED back to "false" in this file and in
# feed-gateway-prod-env-patch.yaml, run scripts/deploy/generate-service-slices.sh, deploy market-structure first, then feed-gateway, and verify both live environments read "false".
# MIRRORS k8s/services/market-structure/overlays/production — the slice generator renders it from here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-structure-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: market-structure
          env:
            - name: MARKET_STRUCTURE_TRANSACTIONAL_ID
              value: market-structure-service-production
            - name: MARKET_STRUCTURE_TOOLS_ENABLED
              value: "true"
