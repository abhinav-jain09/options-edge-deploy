resources:
  - ../../base
  # Common infra (namespace, shared ConfigMaps with the prod single-broker RF=1 override,
  # streams-state PVCs with prod's 'local-path' storageClassName, ops CronJobs, and the
  # production Keycloak) — the same overlay Jenkinsfile.common-infra applies standalone.
  # The former top-level configmap-prod-single-broker-patch.yaml and the ../../keycloak
  # inclusion moved INTO that overlay (Keycloak is shared auth infra).
  - ../../infra/overlays/production
  # The web app's service slice (Deployment+Service). The STANDALONE web overlay
  # (k8s/services/web/overlays/production) mirrors the prod patches — sync enforced by
  # scripts/ci/validate-services.sh render equivalence.
  - ../../services/web/base
  # short-premium-agent runs on prod too (7B on the .252 GPU) — same base as dev, with the
  # prod env patch below overriding model/Ollama-URL/SP_REQUIRE_REAL. Mirrors the web pattern.
  - ../../services/short-premium-agent/base
  # databento-vix-feed: the STANDALONE VIX OPRA feed (VIX feed separation PR-2, design §5).
  # PROD-ONLY by design — dev keeps its in-process VIX path, so this base is referenced
  # here and nowhere else. Committed replicas: 0 until the VFS-R1 session evidence is
  # recorded (the shadow commit flips it); image reuse (options-edge-databento-feed) with
  # a `command` override selecting the vix role — no new images entry needed.
  - ../../services/databento-vix-feed/base

# Prod-only: the node already has the images cached, so re-pulling all ~26 at
# once on every rollout trips the kubelet image-pull QPS limit ("pull QPS
# exceeded" -> ImagePullBackOff), making rollouts flaky. IfNotPresent reuses the
# cached image (no pull, no throttle). Dev keeps Always so it always picks up a
# freshly-built :dev image.
patches:
  # PROD-ONLY: the ES GEX strike topic for the databento display service. MIRRORS the standalone
  # slice k8s/services/raw-to-display/overlays/production, which #714 added it to without the
  # matching top-level patch — validate-services caught the drift and blocked every deploy.
  # Inserted at INDEX 4, immediately after KAFKA_DISPLAY_VOLUME_TOPIC, because the mirror check
  # compares the rendered manifests and an appended entry would still differ by position.
  - target:
      kind: Deployment
      name: raw-to-display-databento-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/4
        value:
          name: KAFKA_DATABENTO_GEX_STRIKE_TOPIC
          value: options.databento.gex.strike
  # PROD-ONLY: arm the reversal hunt (requirement rev 5). MIRRORS the
  # standalone overlay k8s/services/reversal-confirmation/overlays/production
  # exactly — validate-services enforces the render equality.
  - target:
      kind: Deployment
      name: reversal-confirmation-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REVERSAL_HUNT_ENABLED
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REVERSAL_HUNT_SPX_BOOTSTRAP
          value: 192.168.100.252:9092
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REVERSAL_HUNT_MIN_DECLINE_BUCKETS
          value: "30"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REVERSAL_HUNT_AUTO_ARM
          value: "true"
  # greek-move-authenticity: ENABLED on PROD (go-live — advisory-only, CHARM_SIGN pinned by the
  # Gate-1 fixture, options-edge-processing #409). Strategic-merge on env name (namespace required).
  # MUST MIRROR the standalone slice k8s/services/greek-move-authenticity/overlays/production (validate-services).
  - target:
      kind: Deployment
      name: greek-move-authenticity-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: greek-move-authenticity-service
        namespace: options-edge
      spec:
        template:
          spec:
            containers:
              - name: greek-move-authenticity
                env:
                  - name: GREEK_MOVE_AUTH_ENABLED
                    value: "true"
                  # Bootstrap the robust-Z baseline from the CURRENT session (the dev default).
                  # baselineReady() counts prior-session samples, plus current-session samples ONLY
                  # when this is true. On a freshly-deployed service `prior` is empty, so with the
                  # prod default (false) n==0 forever and EVERY frame is DATA_DEGRADED /
                  # MOVE_BASELINE_NOT_READY for the entire first session — observed live on es4 at
                  # the 2026-07-19 globex open (364 verdicts, all MOVE_BASELINE_NOT_READY).
                  # Trade-off: an in-session baseline is statistically weaker early on (it self-
                  # corrects as samples accumulate) — the alternative is a dead first session.
                  # REVERT = drop this env entry (falls back to prior-session-only baselines).
                  - name: GREEK_MOVE_AUTH_BOOTSTRAP_IN_SESSION
                    value: "true"
  # Restoring the 4.3M-record SR3 GlobalKTable needs substantial RocksDB/native
  # headroom in addition to the Java heap. The previous 1Gi cgroup with a 768Mi
  # heap was OOM-killed during restore and left the pod-local store corrupted.
  # Keep the heap at 2Gi and reserve the remaining ~3Gi for RocksDB, direct
  # buffers, class metadata, and restore bursts.
  - target:
      kind: Deployment
      name: market-carry-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: market-carry-service
      spec:
        template:
          spec:
            containers:
              - name: market-carry
                env:
                  - name: JAVA_TOOL_OPTIONS
                    value: -Xms512m -Xmx2048m
                resources:
                  limits:
                    memory: 5Gi
                  requests:
                    memory: 2Gi
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      # Kafka Streams apps rebalance on roll; a full-fleet roll can take >600s (k8s
      # default progressDeadlineSeconds) to report Available, failing the deploy even
      # though pods go Ready shortly after. Raise the controller deadline to 1200s so
      # the deploy tolerates the rebalance. apply.sh's `rollout status --timeout=1260s`
      # is set just above it so the controller's "exceeded progress deadline" fires first.
      - op: add
        path: /spec/progressDeadlineSeconds
        value: 1200
  # A clean 4.3M-record GlobalKTable restore takes longer than the fleet
  # default. This must follow the fleet-wide 1200s patch above so it wins.
  - target:
      kind: Deployment
      name: market-carry-service
    patch: |-
      - op: replace
        path: /spec/progressDeadlineSeconds
        value: 7200
  # PROD dealer-ledger heap: -Xmx6144m (6GB, dev/prod parity — -Xmx1024m OOM'd on dev's day's-backlog
  # catch-up; prod runs the same SPX data). Container 8Gi leaves ~2Gi for RocksDB off-heap + JVM overhead.
  # .252 has 62Gi total / ~30Gi free, so 8Gi fits. DEALER_LEDGER_ADVISORY_ENABLED=true is SHADOW-mode
  # enable (observe-only). NAME-KEYED strategic merge (NOT env/N json6902): the prior index patch targeted
  # env/19 for JAVA_TOOL_OPTIONS, but PR#364 inserted DEALER_LEDGER_QUOTE_STALE_MS ahead of it, shifting the
  # index so the heap string landed on QUOTE_STALE_MS (=> parsed as 0 -> 30s default) and JAVA_TOOL_OPTIONS
  # reverted to the 1GB base default. Merging env by name is immune to any future base env-array insertion.
  # MUST MIRROR the standalone slice k8s/services/dealer-ledger/overlays/production (validate-services).
  - target:
      kind: Deployment
      name: dealer-ledger-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dealer-ledger-service
      spec:
        template:
          spec:
            containers:
              - name: dealer-ledger
                env:
                  - name: DEALER_LEDGER_ADVISORY_ENABLED
                    value: "true"
                  # SHADOW-live gates (spec dl-shadow-live r3, Codex-approved 2026-08-08): absorption
                  # verdict is evidence-only (matched-null OR 0.817 — no signal as a hard gate), greeks
                  # DEGRADED may fire (live is 100% MISSING_IV), MIN_WAVES=1 (waves never close; 3 is
                  # unsatisfiable), confidence floor LOW until the OI-seeded morning book lands.
                  # Fires stay SHADOW-quality; rollback = remove these four (defaults restore HARD/FULL/3/MEDIUM).
                  - name: DEALER_LEDGER_ABSORPTION_GATE_MODE
                    value: CONFIDENCE
                  - name: DEALER_LEDGER_FIRE_GREEKS_MIN_QUALITY
                    value: DEGRADED
                  - name: DEALER_LEDGER_ABSORB_MIN_WAVES
                    value: "1"
                  - name: DEALER_LEDGER_TRIGGER_MIN_CONFIDENCE
                    value: LOW
                  # Chain-changelog record hit 4,214,084 B > the 4 MiB default at first SHADOW-live
                  # boot (open wave accumulates all session deltas until wave-lifecycle repair lands)
                  # — 16 MiB headroom; existing changelog topics live-altered to match (2026-08-08).
                  - name: KAFKA_DEALER_LEDGER_MAX_RECORD_BYTES
                    value: "16777216"
                  - name: JAVA_TOOL_OPTIONS
                    value: -Xms1024m -Xmx6144m
                resources:
                  limits:
                    memory: 8Gi
                  requests:
                    memory: 2Gi
  # PROD enable of the top-N gate (proc PR #466/#467, requirement 2026-07-22; dev-verified first per
  # rollout decision): fade (gamma-flow) + lifecycle (EMERGING/STICKY/FADING) compute ONLY the top-3
  # |netGex| strikes per chain — the rest are gated BEFORE those calculations. Stage-1 per-strike netGex
  # (gex.strike, UI board, magnet, strike-intel input) is UNCHANGED. Enabling switches fade+lifecycle to
  # isolated "-topn" store lineages: ONE-TIME fade/lifecycle state reset at rollout (by design; fade
  # windows re-seed within minutes). NAME-KEYED strategic merge like the dealer-ledger patch above.
  # MUST MIRROR the standalone slice k8s/services/databento-gex/overlays/production (validate-services).
  - target:
      kind: Deployment
      name: databento-gex-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: databento-gex-service
      spec:
        template:
          spec:
            containers:
              - name: databento-gex
                env:
                  # RAISED 3 -> 40 (2026-08-03, with the smile-IV fallback below): measured on dev,
                  # strike-intelligence's ONLY GEX input is options.databento.gex.flow.by-strike —
                  # the topic THIS gate feeds — so top-3 starved every other strike's GEX component
                  # (dev: 38k gated vs 1.1k forwarded; near-ATM stuck at GEX-missing/NORMAL). The
                  # original comment's claim that strike-intel input is unchanged by the gate was
                  # wrong. 40 restored dev near-ATM coverage 70%->15% missing with zero streams lag.
                  # PROD CPU WATCH: this node runs hot — if gex lag or feed CPU degrades after
                  # rollout, drop this back to 3 and split strike-intel onto gex.strike instead.
                  - name: DATABENTO_GEX_FLOW_TOP_N
                    value: "40"
                  # EXPERIMENTAL smile-IV fallback (proc 3fe1a2f7, Codex round-3 APPROVE; code
                  # default OFF, this flag is the only enable). Rebuilds short-dated legs whose IV
                  # solve failed on the measured BELOW-INTRINSIC branch (100% of 0DTE failures; the
                  # ITM mark sits at intrinsic while the worthless OTM twin has no usable quote, so
                  # parity recovery starves and the strike drops — silently removing ~half the
                  # near-ATM 0DTE ladder). Rebuilt legs are flagged SMILE_IV_FALLBACK, excluded
                  # from netGexStrict, never anchor-eligible. Dev-validated 2026-08-03 before this
                  # prod enable. Watch options_edge_databento_gex_smile_fallback_total.
                  - name: GEX_SMILE_IV_FALLBACK
                    value: "true"
                  # DYNAMIC OPEN INTEREST. GEX stops pricing with the print the exchange published
                  # this morning and prices with oi-shadow's estimate of where open interest lands at
                  # the close, wherever that estimate is fresh. gex is LINEAR in open interest, so
                  # this changes every number on the board.
                  #
                  # Measured on 25 sessions that post-date the panel the model was chosen on:
                  # chain-wide error 0.242 -> 0.175, better on 24 of 25, DTE 0-1 improving 35%.
                  #
                  # It does NOT improve WHICH strike carries the most open interest -- 92.0% -> 88.0%
                  # out of sample. The board becomes more accurate about how much gamma sits at a
                  # strike and slightly LESS accurate about which strike leads. Anything downstream
                  # reading it as a level-finder is reading it backwards.
                  #
                  # The intraday SHAPE is unverifiable. Ground truth arrives once a day, so the close
                  # estimate is what was validated while the path to it assumes open interest accrues
                  # with cumulative volume. A number read at 15:55 is near what was measured; one read
                  # at 11:00 carries that assumption.
                  #
                  # Fail-soft by design (processing#555, Codex round-8 APPROVE, 17 overlay tests):
                  # no estimate, stale, future-dated, a leg the model declined to price, a missing
                  # symbol, an expiry that will not canonicalise, or a dead oi-shadow all leave the
                  # settled print in place. That is the implementation's contract and its unit
                  # evidence — it has not yet been OBSERVED on a running environment.
                  #
                  # ROLLBACK: set this to "false" HERE and re-run scripts/deploy/generate-service-slices.sh
                  # — the generated slice carries its own copy, so editing one without the other
                  # either drifts or fails validate-services.
                  #
                  # Watch ..._dynamic_oi_applied_total climbing during the session; the fallback
                  # counters say WHY when it does not.
                  - name: DATABENTO_GEX_DYNAMIC_OI_ENABLED
                    value: "true"
                  # PROD capture of the daily settled open-interest print (2026-08-03). Writes ONE
                  # immutable manifest per session to options.databento.oi.anchor-manifest and to
                  # calibration.oi_anchor_manifest.
                  #
                  # It is no longer read by nothing. oi-shadow-service runs on production at one
                  # replica and consumes this manifest, and with DATABENTO_GEX_DYNAMIC_OI_ENABLED
                  # above, GEX consumes what oi-shadow publishes. The chain is
                  # anchor -> oi-shadow -> GEX, so this capture is now on the path to the live board
                  # rather than beside it.
                  #
                  # The PUBLISHING work is still isolated: its own daemon thread behind a bounded
                  # queue, and a full queue drops rather than blocks the caller.
                  #
                  # Enabled on prod because the capture must not miss sessions. Dev is brought up by
                  # hand each morning, so any morning it is late past 09:25 ET leaves a permanent
                  # hole in the series, and the whole point of the record is the day-over-day
                  # difference. Verified on dev 07-31 and 08-03: 2534 and 2494 legs, both sound,
                  # both surviving the nightly wipe.
                  - name: OI_ANCHOR_MANIFEST_ENABLED
                    value: "true"
  # oi-shadow: ENABLED on PRODUCTION with the SEEDED arm, 2026-08-04. It reads the anchor manifest
  # and the raw chain and writes one record per strike to options.databento.oi.nowcast.by-strike.
  # That topic is now CONSUMED BY GEX (DATABENTO_GEX_DYNAMIC_OI_ENABLED above), so what this
  # service publishes reaches the live gamma surface. It was consumer-free when this was first
  # enabled; it is not any more, and the isolation argument that justified enabling it no longer
  # applies -- the justification now rests on the measured accuracy in processing#555.
  #
  # It also adds a
  # continuous consumer of the 32-partition raw topic on the single production broker. Headroom
  # measured 2026-08-04 before enabling: 24 cores at load 1.29, all java processes together 320%
  # of 2400%, 14 GB memory available. The service requests 100m CPU and is capped at 1 GiB.
  #
  # Seed evidence (processing#553): fitted over 277 sessions on this service's own cell
  # definitions, measured on 25 sessions that post-date that panel -- chain-wide error
  # 0.242 -> 0.175, better on 24 of 25, DTE 0-1 improving 35%. It does NOT improve which strike
  # carries the most open interest (92.0% -> 88.0%): it improves how much, not where.
  #
  # Watched on dev first, where enabling it surfaced two defects that were invisible while the
  # flag was off: the raw topic defaulted to the empty IBKR one, and the manifest source skipped
  # its own session's anchor on a fresh consumer group. Both are fixed in the base and in
  # processing#554.
  # MUST MIRROR the standalone slice k8s/services/oi-shadow/overlays/production (validate-services).
  - target:
      kind: Deployment
      name: oi-shadow-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: oi-shadow-service
      spec:
        template:
          spec:
            containers:
              - name: oi-shadow
                env:
                  - name: OI_SHADOW_ENABLED
                    value: "true"
                  # Re-enabled 2026-08-10 after the quarantine's cause was removed: the cells the
                  # service assigns now ARE the cells the panel fitted (signed band, DTE {0,1}/{2,3}
                  # /{4-7}), and the nine coefficients were refitted on them over the full
                  # 251-session panel -- 190+ independent sessions per cell.
                  - name: OI_SHADOW_SEED_COEFFICIENTS_ENABLED
                    value: "true"
  # PROD-ONLY: §7a conflict bypass needs only 2-of-4 fresh agreement to clear a non-opposed
  # (FAKE_VOLUME/PIN/EXHAUSTION) near-tie; opposed runner-ups still veto regardless (PR #462).
  # MUST MIRROR the standalone slice k8s/services/strike-intelligence/overlays/production (validate-services).
  - target:
      kind: Deployment
      name: strike-intelligence-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STRIKE_INTEL_CONFLICT_BYPASS_MIN_AGREEMENT
          value: "2"
  # PROD-ONLY TRIAL (2026-07-16): emit LOW-band directional signals as BUY/SELL LEAN. The
  # 09:48 ET rip-bottom CALL_CHASE scored conf 0.38-0.43 (LOW) — deltaScore scale (1e5) and
  # inception-zero gexScore structurally cap real move-start signals below the 0.50 MEDIUM
  # floor. Trial pending a proper STRIKE_INTEL_DELTA_SCORE_SCALE recalibration; dev stays
  # MEDIUM as reference. Revert = remove this patch.
  # MUST MIRROR the standalone slice k8s/services/strike-intelligence/overlays/production (validate-services).
  - target:
      kind: Deployment
      name: strike-intelligence-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STRIKE_INTEL_ACTION_BIAS_MIN_BAND
          value: LOW
  # PROD LAG TOLERANCE (2026-07-17): the single-core SPX feed runs 3-4 min behind on heavy
  # sessions, keeping spot/delta/gex above the 120s freshness gates -> all-day INSUFFICIENT_DATA
  # (signal blackout during the most tradeable tape). Widen the gates to 5 min so a CONSISTENTLY
  # lagged (coherent event-time) pipeline still signals — accepted trade-off: signals arrive
  # ~lag-minutes late. Dev keeps 120s defaults (its feed keeps up). REVERT when the feed
  # split/capacity fix lands. MUST MIRROR the standalone slice (validate-services).
  - target:
      kind: Deployment
      name: strike-intelligence-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STRIKE_INTEL_MAX_UNDERLYING_AGE_MS
          value: "300000"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STRIKE_INTEL_MAX_DELTA_FLOW_AGE_MS
          value: "300000"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STRIKE_INTEL_MAX_GEX_FLOW_AGE_MS
          value: "300000"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STRIKE_INTEL_MAX_STRIKE_FLOW_AGE_MS
          value: "300000"
  # §7c two-sided mode: back to "strength" (STRONG-only tried 2026-07-17 evening, ROLLED BACK
  # same evening — user wants LEAN visible again to gather data; re-trial via mode=require later).
  - target:
      kind: Deployment
      name: strike-intelligence-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STRIKE_INTEL_TWO_SIDED_FLOW_MODE
          value: strength
  # §9b trail = FULL-SESSION board history (user 2026-07-17: "do not take away"): entries stay
  # until the trading-date rollover purge instead of aging out after 15 min; cap raised to 50.
  # MUST MIRROR the standalone slice k8s/services/strike-intelligence/overlays/* (validate-services).
  - target:
      kind: Deployment
      name: strike-intelligence-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STRIKE_INTEL_RECENT_SIGNALS_WINDOW_MS
          value: "86400000"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: STRIKE_INTEL_RECENT_SIGNALS_MAX
          value: "50"
  # PROD: option-price-behavior V2 heap 3g + limit 5Gi (base 2g/2Gi OOMKilled —
  # heap == limit, no off-heap room). Re-enabled after the 2026-07-07 freeze.
  - path: short-premium-prod-env-patch.yaml
  # PROD FLAG FLIP (USER 2026-07-19, r19: flags equal across envs): both signal-follower
  # instances DETECTOR+FOLLOWER true, LEDGER. MUST MIRROR the standalone slice
  # k8s/services/signal-follower/overlays/production (validate-services: mono==slice).
  - path: signal-follower-prod-env-patch.yaml
  - path: option-price-behavior-prod-patch.yaml
  # PROD-ONLY: databento-feed 5s snapshot publish interval (explicit container env overrides the
  # shared configmap default; ships via service-deploy). Relieves the single-core CPU backpressure.
  # MUST MIRROR the standalone slice k8s/services/databento-feed/overlays/production (validate-services).
  - path: databento-feed-prod-patch.yaml
  # PROD-ONLY: es-spx-align basis source -> underlying.es.price (DBP-R32 gap fix; the trades
  # topic arrives unenriched from the es4 bridge, the feed's locally-computed basis lands on
  # the ES price topic). DEPLOY ORDER: databento-feed (ES_PRICE_ENABLED patch above) FIRST,
  # es-spx-align second — see the patch headers. MUST MIRROR the standalone slice
  # k8s/services/es-spx-align/overlays/production (validate-services: mono==slice).
  - path: es-spx-align-prod-env-patch.yaml
  # PROD-ONLY: System Status page — the gateway reads the freshness watcher's oe_watch ledger from
  # this same Postgres with the read-only oe_watch_reader role, and reports the link as
  # PLAINTEXT_ACCEPTED because that server has no TLS (visible on the page, not silent).
  # MUST MIRROR the standalone slice k8s/services/feed-gateway/overlays/production (validate-services).
  - path: feed-gateway-prod-env-patch.yaml
  # PROD-ONLY: strike-liquidity-heatmap CPU request 100m -> 750m. At 100m the single stream
  # thread stalled >10s under busy-open contention, tripping the EOS transaction timeout and
  # fencing the producer (2026-07-16, twice; processing PR #356 raised the timeout to 60s as
  # the backstop). 750m guarantees most of a core under CFS contention; node request headroom
  # is ample (~32% of 24 cores requested). CPU limit stays absent per the base's no-throttle
  # discipline. MUST MIRROR the standalone slice
  # k8s/services/strike-liquidity-heatmap/overlays/production (validate-services: mono==slice).
  - target:
      kind: Deployment
      name: strike-liquidity-heatmap-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 750m
  # spx-mission-control is kept OFF (replicas:0) in prod (USER 2026-07-09). MUST MIRROR the standalone
