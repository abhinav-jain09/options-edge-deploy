resources:
  - ../../base
  # --- Production identity provider (Keycloak) — PRODUCTION ONLY (dev uses the docker Keycloak on :8089).
  # A self-contained component dir (not in base) so dev deploys never get the prod-hostname KC. See
  # docs/keycloak-prod.md.
  - ../../keycloak

# Prod-only: the node already has the images cached, so re-pulling all ~26 at
# once on every rollout trips the kubelet image-pull QPS limit ("pull QPS
# exceeded" -> ImagePullBackOff), making rollouts flaky. IfNotPresent reuses the
# cached image (no pull, no throttle). Dev keeps Always so it always picks up a
# freshly-built :dev image.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  # Exception: the integration-test image carries the deploy smoke checks and is
  # rebuilt under the mutable :dev tag, so it must always re-pull to run the
  # latest checks. It is a single deployment, so this does not reintroduce the
  # all-at-once pull-QPS throttle that IfNotPresent avoids for the other ~25.
  - target:
      kind: Deployment
      name: options-edge-integration-test
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  # unified-sr is experiment-only (live on .2); it's in k8s/base but never wired into the prod build or
  # apply.sh's image build/pin list, so it renders with a mutable prod-registry :tag and the digest-pin
  # guard would abort the prod deploy. It is NOT running on prod (no prod image exists). Remove it from
  # the production render until it's properly built+pinned for prod. (Both the Deployment and Service are
  # named unified-sr-service.) Mirrors the dev-overlay exclusion.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unified-sr-service
        namespace: options-edge
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: unified-sr-service
        namespace: options-edge
      $patch: delete
  # strike-flow-avro-adapter is experiment-only (the producer of unified-sr's per-strike Avro flow
  # topic, live on .2). Same situation as unified-sr above: it's in k8s/base but has no prod image, so
  # the prod render must exclude it or the digest-pin guard aborts the prod deploy. Remove until it is
  # properly built+pinned for prod. Mirrors the dev-overlay exclusion.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: strike-flow-avro-adapter
        namespace: options-edge
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: strike-flow-avro-adapter
        namespace: options-edge
      $patch: delete
