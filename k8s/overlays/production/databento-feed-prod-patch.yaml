# PROD-ONLY: publish each strike's snapshot at most once per second (dev keeps the 250ms default).
# An explicit container env overrides the shared configmap's envFrom value, so this ships via the
# per-service deploy (service-deploy) WITHOUT touching common-infra (the shared feed configmap is
# consumed by databento-gex too and lives in the infra layer). Cuts the feed's per-strike publish/
# serialize/Kafka work ~4x to relieve the single-core CPU backpressure that runs prod ~5-6.5 min
# behind real-time. 1s is ample freshness for GEX.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: options-edge-databento-feed
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: databento-feed
          # Reserve one production core. Keep this in the source overlay so
          # monolithic and generated standalone deployments preserve it.
          resources:
            requests:
              cpu: "1"
          env:
            - name: DATABENTO_PUBLISH_INTERVAL_MS
              value: "2000"
            # VIX-via-OPRA-parity (feed docs/vix-opra-parity-price/DESIGN.md v11, PR #65;
            # USER directive 2026-07-15: deploy ENABLED, manual verification via the
            # option-chain VixPriceCard). The AUTO_VIX_MONTHLY instrument joins the SAME
            # OPRA session (no new Databento session); underlying.vix.price is published
            # by the feed's dedicated isolated producer to the prod broker where the
            # feed-gateway already consumes it (KAFKA_IBKR_VIX_PRICE_TOPIC default).
            # Rollback = set "" / false here and redeploy.
            - name: DATABENTO_EXTRA_INSTRUMENTS
              value: '[{"symbol":"VIX","trading_class":"VIX","min_strike":12,"max_strike":45,"strike_step":0.5,"expiry_mode":"AUTO_VIX_MONTHLY"}]'
            - name: DATABENTO_VIX_PRICE_ENABLED
              value: "true"
            # ES->SPX basis engine (ES-SPX-TRANSLATION-ENGINE.md, Codex-approved).
            # ONE engine, no version knob (feed #79): it runs structurally on the
            # instance publishing both legs. Samples stay OFF until the A1
            # eventTime verification records a PASS (anchor+projection till then).
            - name: ES_SPX_BASIS_CLOSE_PRINCIPALS
              value: "abhinav"
            - name: ES_SPX_BASIS_ACK_PRINCIPALS
              value: "abhinav"
            # A1 verification (feed #81): evidence pairs onto spx.basis.a1.evidence
            # (pre-created, delete/3d). SAMPLES_ENABLED=true is SAFE pre-certificate:
            # the engine keeps samples off (fail-honest WARN at boot) until the
            # A1:<date> PASS record for the running SYNTHETIC_CALC_VERSION lands —
            # tools/a1_verify.py after Monday's session commits it; samples then
            # activate without another deploy. A FAIL revokes.
            - name: ES_SPX_BASIS_A1_EVIDENCE_ENABLED
              value: "true"
            - name: ES_SPX_BASIS_SAMPLES_ENABLED
              value: "true"
            # DBP-R32 gap fix (2026-07-27): since the flip, prod's underlying.es.trades
            # arrives UNENRICHED from the es4 bridge (es-feed has no SPX leg, stamps no
            # spxBasis*), so es-spx-align's basis global store — which read exactly those
            # enrichment fields — starved and the ES->SPX mapping went dark. The feed's
            # Kafka-source path (PR #96) computes local_basis on every bridged trade but
            # its ONLY sink is _publish_es_price, off by default. Enable it: the
            # underlying.es.price record carries the locally-computed spxBasis* fields
            # (local_basis wins over the empty producer passthrough), and es-spx-align's
            # basis topic re-points there (es-spx-align-prod-env-patch.yaml).
            # ⚠️ DEPLOY ORDER: databento-feed FIRST, es-spx-align second — service-deploy
            # applies one slice at a time, and align re-pointed before the feed publishes
            # would read an empty topic (same dark state, no error). REQUIRES a feed image
            # with the engine-construction gate accepting the Kafka ES source
            # ((native OR source) AND spx leg) — without it the engine is None on this
            # shape and es.price carries no basis fields at all.
            # The prod topic is broker-AUTO-CREATED on first publish (delete cleanup,
            # 12h retention — NOT compacted like es4's es.underlying.es.price); fine here:
            # the align store only trusts basis records fresher than ES_BASIS_STALE_MS=30s.
            # Read UNPREFIXED (config.py: ES_PRICE_ENABLED), like the ES_TRADES_SOURCE_*
            # keys; config validation requires ES_TRADES_SOURCE_ENABLED=true, which
            # prod's infra configmap sets.
            - name: ES_PRICE_ENABLED
              value: "true"
