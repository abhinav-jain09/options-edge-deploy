# PROD gamma-migration R11 other-board sidecar (strategic-merge, merges env by name).
# Reads ES4's own strike-history cross-cluster; values are read RAW in code
# (KafkaSettings.value, not topicValue) so a topic prefix can never rewrite them.
# MUST MIRROR the standalone slice k8s/services/gamma-migration/overlays/production
# (validate-services enforces the render equality).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamma-migration-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: gamma-migration
          env:
            - {name: KAFKA_GAMMA_MIGRATION_OTHER_BOARD_BOOTSTRAP, value: "192.168.100.4:9092"}
            - {name: KAFKA_GAMMA_MIGRATION_OTHER_BOARD_TOPIC, value: "es.options.databento.gex.strike.history"}
            - {name: KAFKA_GAMMA_MIGRATION_OTHER_BOARD_SYMBOL, value: "ES"}
