# 2026-09-08 STOPGAP — pre-open GEX arbitration (slice 2) drops EVERY pre-open record.
# The producer writes sessionId "IBKR_PREOPEN:20260908" (BASIC_ISO_DATE); the gateway's
# validator demands "IBKR_PREOPEN:2026-09-08" (ISO_LOCAL_DATE), so every record fails closed:
# measured 2026-09-08 06:45 ET, dropped_sessioned dev 23,744 / prod 54,576, candidates 0.
# Turning the flag off short-circuits interceptSharedGexRecord and restores the pre-slice-2
# path (values reach the board; the status plane and the 09:35 sweep are the cost).
# RE-ENABLE once the gateway accepts the producer's real session-id format.
# PROD gate (gamma), gateway half — mirrors k8s/overlays/dev/ibkr-preopen-gateway-dev-patch.yaml.
#
# Lets the gateway relay the pre-open status stream (options.ibkr.gex.status) to the UI, which is
# what drives the per-strike FRESH/STALE/GATED states and the D12++ SWITCHING/LIVE chips. Without
# it the gex values would reach the board with no status plane: the UI could not tell a modelled
# pre-open number from a live one, which is precisely the mislabelling the dev gate refused to ship.
#
# Rollback = drop this patch (the gateway then ignores the status topic; values fall back to the
# pre-existing Databento-only presentation).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-gateway-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: feed-gateway
          env:
            - { name: GATEWAY_IBKR_PREOPEN_ENABLED, value: "false" }
