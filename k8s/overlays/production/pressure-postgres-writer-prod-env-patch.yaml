# PROD: run pressure-postgres-writer for ONE of its four writers - the option pressure state reader -
# and leave the other three off. Mirrors k8s/overlays/dev/pressure-postgres-writer-dev-env-patch.yaml.
#
# The base already renders replicas 1, and the live Deployment was 0/0 in BOTH environments with no
# KEEP_DOWN or DISABLED_DEV list naming it - so that zero was drift from a manual scale-down rather
# than policy, and a deploy starts all four writers at once. External checks, 2026-10-18:
#   `ssh abhinav@192.168.100.252 'kubectl -n options-edge get deploy pressure-postgres-writer'`
#     printed 0/0 and still does.
#   `kubectl -n options-edge get deploy pressure-postgres-writer`
#     printed 0/0 before the dev enable landed and prints 1/1 now.
#
# The other three writers are switched off because they would not idle. Their producer is held down -
# directional-pressure-service is in both production hold-down lists - but each would act on its
# first tick, which is verifiable in options-edge-processing rather than here - and the REVISION must
# be in the command or it reports whatever is checked out. On 2026-10-18:
#   git grep -c ensureTopic e0274feaf6b2 -- pressure-postgres-writer/src/main/java/app/kafka/DirectionalPressurePostgresWriter.java
#     -> e0274feaf6b2:pressure-postgres-writer/src/main/java/app/kafka/DirectionalPressurePostgresWriter.java:1
#        (that call would CREATE options.ibkr.directional-pressure)
#   git grep -c 'create table if not exists' e0274feaf6b2 -- pressure-postgres-writer/src/main/java/app/kafka/DirectionalPressureOutcomeWriter.java pressure-postgres-writer/src/main/java/app/kafka/DirectionalPressureThresholdCalibrator.java
#     -> one `<rev>:<path>:1` line for each of the two files
# git grep -c prints `<rev>:<path>:<count>`, not a bare count, which is why the outputs are quoted
# in that shape. Creating a topic and three tables as a side effect of enabling an unrelated
# reader is the kind of change nobody looks for later. Turning any of them on is a separate decision
# with its own reason.
#
# The reader needs no flag: POSTGRES_PRESSURE_STATE_ENABLED defaults true. It consumes
# option-pressure-state-evidence and writes option_pressure_state_frame. On production that table is
# the point: the evidence topic keeps three days, so the table is what makes the record outlive it,
# and it is the production calibration history the offline forward-corpus job on the development
# machine assembles by hand today.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pressure-postgres-writer
  namespace: options-edge
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: pressure-postgres-writer
          env:
            # The three directional writers, off. Their producer is held down in both environments.
            - name: POSTGRES_DIRECTIONAL_PRESSURE_ENABLED
              value: "false"
            - name: POSTGRES_DIRECTIONAL_OUTCOME_ENABLED
              value: "false"
            - name: POSTGRES_DIRECTIONAL_THRESHOLD_CALIBRATOR_ENABLED
              value: "false"
            # Symbol granularity only, which is the calibrated vocabulary: the strike thresholds are
            # still seeds. One row per state change, and otherwise at most one a minute per key.
            - name: POSTGRES_PRESSURE_STATE_GRANULARITY
              value: "SYMBOL"
            - name: POSTGRES_PRESSURE_STATE_MIN_INTERVAL_MS
              value: "60000"
