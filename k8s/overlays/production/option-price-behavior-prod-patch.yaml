# PROD: option-price-behavior V2 OOMKill-crash-looped because the base container
# limit (2Gi) == JVM heap (-Xmx2g), leaving ZERO room for Kafka-Streams RocksDB
# off-heap + JVM overhead. Give the heap headroom AND off-heap headroom on prod:
#   heap  -Xmx3g   (was 2g)
#   limit 5Gi      (was 2Gi)  -> ~2Gi for off-heap/overhead above the heap
# dev/experiment keep the base 2g/their own limits. Re-enabled (replicas back to
# base 1) after the 2026-07-07 freeze incident, per USER (heap 3g / limit 5Gi).
#
# NUM_THREADS 1->4 + requests.cpu 250m->1: a single stream thread could not keep up with
# SPX trade+surface volume across 32 partitions, so OPB ran ~12min behind. Its surface store
# is latest-wins, so every lagged trade matched a NEWER surface -> look-ahead guard rejected
# it -> baselines stored bootstrap -> ~73% NO_BASELINE_SURFACE -> zero price behavior ->
# strike-intel directional roles (which require non-zero pricing) never fired -> no buy/sell.
# 4 threads parallelize the partitions; cpu request backs them. (Mirrors the standalone overlay
# k8s/services/option-price-behavior/overlays/production/manifest.yaml.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: option-price-behavior-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: option-price-behavior
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx3g"
            # Incremental O(1)-per-trade session aggregation (app id v2r4): rolling windows are a few
            # point-ops each, so they are back ON. The flag stays as an operational escape hatch for the
            # single-key session thread.
            - name: OPB_V2_ROLLING_WINDOWS_ENABLED
              value: "true"
            # The incremental layout spans several store keys per logical update; exactly_once_v2 makes
            # the changelog + emits commit transactionally (broker hosts __transaction_state).
            - name: OPB_V2_EXACTLY_ONCE
              value: "true"
          resources:
            limits:
              memory: 5Gi
            requests:
              cpu: "1"
