# PROD: option-price-behavior V2 OOMKill-crash-looped because the base container
# limit (2Gi) == JVM heap (-Xmx2g), leaving ZERO room for Kafka-Streams RocksDB
# off-heap + JVM overhead. Give the heap headroom AND off-heap headroom on prod:
#   heap  -Xmx3g   (was 2g)
#   limit 5Gi      (was 2Gi)  -> ~2Gi for off-heap/overhead above the heap
# dev/experiment keep the base 2g/their own limits. Re-enabled (replicas back to
# base 1) after the 2026-07-07 freeze incident, per USER (heap 3g / limit 5Gi).
#
# PERF (mirrors the standalone slice — commit 7457f25 set these on the slice only;
# added here so the monolith render matches, validate-services passes):
#   NUM_THREADS 1 -> 4  — a single stream thread can't keep up with SPX trade+surface
#     volume across 32 partitions (OPB ran ~12min behind → ~73% NO_BASELINE_SURFACE →
#     directional roles never fired). 4 threads parallelize the partitions.
#   requests.cpu 250m -> 1 — back the 4 threads so they aren't CPU-throttled on the node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: option-price-behavior-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: option-price-behavior
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx3g"
            - name: OPTION_PRICE_BEHAVIOR_V2_STREAMS_NUM_THREADS
              value: "4"
          resources:
            limits:
              memory: 5Gi
            requests:
              cpu: "1"
