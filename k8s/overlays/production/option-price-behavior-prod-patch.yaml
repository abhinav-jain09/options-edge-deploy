# PROD: option-price-behavior V2 OOMKill-crash-looped because the base container
# limit (2Gi) == JVM heap (-Xmx2g), leaving ZERO room for Kafka-Streams RocksDB
# off-heap + JVM overhead. Give the heap headroom AND off-heap headroom on prod:
#   heap  -Xmx3g   (was 2g)
#   limit 8Gi      (2026-07-15, per USER: OOMKilled again mid-RTH at ~5.2GB RSS with
#                   limit 5Gi — RocksDB off-heap alone outgrew the ~2Gi that 5Gi left
#                   above the 3g heap. Heap stays 3g: it was NOT the constraint, and a
#                   bigger heap would only eat the new off-heap headroom. Host peers
#                   already run 8-9Gi limits.)
# dev/experiment keep the base 2g/their own limits. Re-enabled (replicas back to
# base 1) after the 2026-07-07 freeze incident, per USER (heap 3g / limit 5Gi).
#
# NUM_THREADS 1->4 + requests.cpu 250m->1: a single stream thread could not keep up with
# SPX trade+surface volume across 32 partitions, so OPB ran ~12min behind. Its surface store
# is latest-wins, so every lagged trade matched a NEWER surface -> look-ahead guard rejected
# it -> baselines stored bootstrap -> ~73% NO_BASELINE_SURFACE -> zero price behavior ->
# strike-intel directional roles (which require non-zero pricing) never fired -> no buy/sell.
# 4 threads parallelize the partitions; cpu request backs them. (Mirrors the standalone overlay
# k8s/services/option-price-behavior/overlays/production/manifest.yaml.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: option-price-behavior-service
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: option-price-behavior
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx3g"
            # EMERGENCY DISABLE (2026-07-14 incident): with rolling windows ON, the incremental
            # aggregator's per-trade multi-key window updates under exactly_once tipped the single-key
            # SESSION thread into CONCURRENT_TRANSACTIONS wedge -> processed_trades/emitted_events = 0,
            # all OPB output frozen for ~1h during RTH. Keep only the SESSION window (this flag is the
            # code's documented escape hatch) until the incremental rolling-window path is fixed +
            # validated offline via the calibration-replay harness. app id stays the stable unversioned
            # identity (inc store already backfilled); exactly_once stays ON (required by the incremental multi-key crash-consistency).
            - name: OPB_ROLLING_WINDOWS_ENABLED
              value: "false"
            # The incremental layout spans several store keys per logical update; exactly_once_v2 makes
            # the changelog + emits commit transactionally (broker hosts __transaction_state).
            - name: OPB_EXACTLY_ONCE
              value: "true"
            # Publish the L1 contributions the option pressure register consumes, so that surface
            # exists on production and not only on dev. This adds a per-trade sink forward INSIDE the
            # exactly-once transaction configured just above, which is the same transaction the
            # 2026-07-14 incident recorded in this file wedged. That incident was rolling-window
            # multi-key STORE updates per trade; a sink forward is one append to the transaction's
            # producer batch, a much smaller operation - but that is magnitude, not measurement, and
            # no throughput measurement exists yet because every pressure topic on dev still reads
            # log end offset 0. IF OPB OUTPUT STALLS, SET THIS BACK TO false FIRST: the gateway and
            # the web option price behaviour page read this service's output.
            #
            # It also requires an image that HAS the sink. The production image before this change
            # (prod-1650-d6a7d010980a, built 2026-09-22) contains zero occurrences of OPB_L1_ENABLED,
            # so the flag was inert there; this ships with a rebuilt production image.
            - name: OPB_L1_ENABLED
              value: "true"
          resources:
            limits:
              memory: 8Gi
            requests:
              cpu: "1"
