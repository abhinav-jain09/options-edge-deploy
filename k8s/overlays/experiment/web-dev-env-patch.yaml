# EXPERIMENT (.2) env patch for the OptionsEdge web Deployment.
#
# EXPERIMENT PORT SCHEME (unique, so .2 never collides with the local dev deploy on the same dev Mac):
# the browser-facing URLs use localhost on a UNIQUE port block — web :18090 (dev uses :8090), gateway
# WS :18091 (dev uses :8091) — reached from the dev Mac via SSH tunnels:
#     ssh -L 18090:localhost:18090 -L 18091:localhost:8091 AMSKEL@192.168.100.2
# So http://localhost:18090 is a different origin from the dev http://localhost:8090 — no collision.
# (Replay UI is OFF on .2, so the :18095 replay URL below is unused; if it is ever enabled, also add
#  -L 18095:localhost:8095 to the tunnel.)
#
# WHY localhost (not the .2 LAN IP): the option-chain SPA logs in with OIDC + PKCE, which calls
# crypto.subtle (option-chain-auth.js). crypto.subtle is ONLY available in a SECURE CONTEXT — HTTPS, or
# the http://localhost / http://127.0.0.1 exemption — NEVER on a plain http://192.168.100.2 origin. So a
# LAN-IP HTTP origin makes PKCE throw and login dead-loops on the redirect. localhost (via the tunnel)
# is a secure context, so PKCE works — exactly like dev. (A no-tunnel LAN-IP option would require real
# HTTPS/TLS on .2; not done.) The web SERVICE LoadBalancer still binds :18090 on .2, so the tunnel
# forwards localhost:18090 -> .2:18090; the gateway tunnel forwards localhost:18091 -> .2:8091.
#
# Keycloak issuer stays http://192.168.100.2:8089 (the .2 LAN IP), NOT localhost: the web POD validates
# /api/** JWTs by fetching the issuer JWKS, and from inside the pod localhost is the pod itself, not
# Keycloak — only the .2 host IP is pod-reachable (verified: /api/config returns 200 with a real token).
# The browser reaches the issuer over the LAN for the login redirect; crypto.subtle depends on the APP
# origin (localhost), not the issuer, so PKCE is unaffected.
#
# The base manifest (k8s/base/options-edge-web-deployment.yaml) hard-codes the PROD public edge URLs
# (auth.fullfunding.nl, wss://fullfunding.nl, …) as direct container env, which win over the
# `options-edge-config` ConfigMap (envFrom). This strategic-merge patch overrides only the URL/profile
# env vars with the experiment values:
#   - Keycloak issuer:     http://192.168.100.2:8089/realms/optionsedge  (.2 LAN IP; pod-reachable)
#   - Feed-gateway WS:     ws://localhost:18091/ws/events                (tunnel -> .2:8091)
#   - UI base / mission:   http://localhost:18090                        (tunnel -> .2:18090)
#   - Replay orchestrator: http://localhost:18095                        (tunnel; replay UI OFF on .2)
# The feed-gateway WS_ALLOWED_ORIGINS is set to the SAME origin (http://localhost:18090) so the browser's
# live-data WS handshake is accepted. PROD is unchanged: it keeps the base Service :8094 behind Cloudflare.
#
# Auth stays MANDATORY (mirrors prod per rule.md) — only the host/ports change. Image + imagePullPolicy
# are handled by the kustomization (images: rewrite to host.docker.internal:5001/...:dev + all-Deployments
# imagePullPolicy: Always). Postgres/Kafka/schema-registry come from the ConfigMap envFrom (unchanged).
#
# Strategic-merge merges env entries by `name`, so only the overridden vars are listed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: options-edge-web
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: APP_PROFILE
              value: "dev"
            - name: VITE_AUTH_ISSUER
              value: "http://192.168.100.2:8089/realms/optionsedge"
            # The browser's live WS talks to the feed-gateway at ws://localhost:18091 (tunnel -> .2:8091;
            # the gateway pod is hostNetwork-bound to :18091 so its LoadBalancer Service stays :8091). The
            # web SERVES this URL to the browser as config.feedGatewayWsUrl, so it MUST be browser-reachable.
            # feedGatewayAvailable (the gate the client honours before opening the socket) is computed by the
            # web POD probing APP_FEED_GATEWAY_HEALTH_URL. In docker-desktop the gateway is only reachable
            # from the HOST, NOT from inside a pod, so an in-pod gateway probe is impossible here; we point it
            # at the web's own always-up port (localhost:8080 inside the web pod) so the gate is satisfied,
            # while the browser connects to the real gateway via the tunnel. In a real prod cluster the
            # gateway Service IS pod-reachable, so prod probes the in-cluster gateway Service.
            - name: APP_FEED_GATEWAY_WS_URL
              value: "ws://localhost:18091/ws/events"
            - name: APP_FEED_GATEWAY_HEALTH_URL
              value: "ws://localhost:8080/ws/events"
            - name: VITE_WS_URL
              value: "ws://localhost:18091/ws/events"
            # The web serves its own /api + /mission-control on the unique port :18090, reached via the
            # tunnel (localhost:18090 -> .2:18090). Set EXPLICITLY (older images mis-default a BLANK
            # VITE_API_BASE_URL to the container-internal :8080, which the browser cannot reach, so
            # /api/config 503s and the chain never loads). localhost keeps it a SECURE CONTEXT for PKCE.
            - name: VITE_API_BASE_URL
              value: "http://localhost:18090"
            - name: VITE_MISSION_CONTROL_URL
              value: "http://localhost:18090"
            # Browser-facing (VITE_), so it uses the same localhost tunnel scheme on a unique port :18095.
            # Replay UI is OFF on .2 (DATABENTO_REPLAY_UI_ENABLED=false) and no orchestrator runs there yet,
            # but the URL is kept localhost/.2-scoped (not the dev :8095) for correctness/consistency.
            - name: VITE_REPLAY_ORCHESTRATOR_URL
              value: "http://localhost:18095"
