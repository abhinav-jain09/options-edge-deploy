# EXPERIMENT (.2) env patch for the OptionsEdge web Deployment.
#
# EXPERIMENT PORT SCHEME (unique, so .2 never collides with the local dev deploy on the
# same dev Mac): the browser-facing URLs use the .2 LAN IP 192.168.100.2 (docker-desktop
# binds the LoadBalancers on all interfaces, so .2 services are LAN-reachable) with a
# UNIQUE web port 18090 (dev uses 8090). So http://192.168.100.2:18090 is a different
# origin from the dev http://localhost:8090 — no tunnel, no collision. The feed-gateway
# WS stays on :8091 (its pod is hostNetwork-bound to :18091, so a LoadBalancer on :18091
# would conflict) but is likewise LAN-IP-scoped (ws://192.168.100.2:8091), and Keycloak
# stays at 192.168.100.2:8089. The web Service port is patched to 18090 in kustomization.
#
# The base manifest (k8s/base/options-edge-web-deployment.yaml) hard-codes the PROD
# public edge URLs (auth.fullfunding.nl, wss://fullfunding.nl, …). Those are direct
# container env values, so they win over the dev `options-edge-config` ConfigMap
# (envFrom). This strategic-merge patch overrides only the URL/profile env vars with
# the experiment-local values (.2 LAN IP, per the PORT SCHEME header):
#   - Keycloak issuer:     http://192.168.100.2:8089/realms/optionsedge
#   - Feed-gateway WS:     ws://192.168.100.2:8091/ws/events  (browser + server)
#   - UI base / mission:   http://192.168.100.2:18090
#   - Replay orchestrator: http://192.168.100.2:8095 (.2 host process; replay UI is OFF on .2)
#
# The UI base / mission-control / replay URLs are browser-facing, so they all use the .2 LAN
# IP (docker-desktop binds the web LoadBalancer :18090 on all .2 interfaces). The feed-gateway
# WS_ALLOWED_ORIGINS is set to the SAME origin (http://192.168.100.2:18090) so the browser's
# live-data WS handshake is accepted. PROD is unchanged: it keeps the base Service :8094 behind
# Cloudflare. This is an experiment-overlay-only move; dev keeps localhost:8090.
#
# Auth stays MANDATORY in dev (mirrors prod per rule.md) — only the issuer host changes.
# Image + imagePullPolicy are handled by the dev overlay kustomization (images: rewrite
# to host.docker.internal:5001/options-edge-web:dev, and the all-Deployments
# imagePullPolicy: Always patch). Postgres/Kafka/schema-registry come from the dev
# `options-edge-config` ConfigMap via the base's envFrom (unchanged here).
#
# Strategic-merge merges env entries by `name`, so only the overridden vars are listed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: options-edge-web
  namespace: options-edge
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: APP_PROFILE
              value: "dev"
            - name: VITE_AUTH_ISSUER
              value: "http://192.168.100.2:8089/realms/optionsedge"
            # The browser's live WS talks to the .2 feed-gateway at ws://192.168.100.2:8091 (LAN-IP
            # scoped — its pod is hostNetwork-bound to :18091, so the LoadBalancer Service stays :8091).
            # The web SERVES this URL to the browser as config.feedGatewayWsUrl, so it MUST be
            # browser-reachable. feedGatewayAvailable (the gate the client honours before opening the
            # socket) is computed by the web POD probing APP_FEED_GATEWAY_HEALTH_URL. In docker-desktop
            # the gateway is only reachable from the HOST (LoadBalancer / host process), NOT from inside a
            # pod (no service DNS / ClusterIP / pod IP / host-address reachability — verified). So an
            # in-pod gateway probe is impossible here; we point it at the web's own always-up port
            # (localhost:8080 inside the web pod) so the gate is satisfied, while the browser still
            # connects to the real, browser-reachable gateway at 192.168.100.2:8091. In a real prod
            # cluster the gateway Service IS pod-reachable, so prod probes the in-cluster gateway Service.
            - name: APP_FEED_GATEWAY_WS_URL
              value: "ws://192.168.100.2:8091/ws/events"
            - name: APP_FEED_GATEWAY_HEALTH_URL
              value: "ws://localhost:8080/ws/events"
            - name: VITE_WS_URL
              value: "ws://192.168.100.2:8091/ws/events"
            # The web serves its own /api + /mission-control on the .2 host port :18090. The same-origin
            # ("blank") behaviour requires the #89 web image (RuntimeProfileConfig treats blank as
            # window.location); older images mis-default a BLANK VITE_API_BASE_URL to the container-
            # internal :8080, which is NOT reachable from the host — so the browser's /api/config 503s and
            # the chain never loads. Set these EXPLICITLY to the host-reachable http://192.168.100.2:18090
            # so the browser hits the web's own origin regardless of image age.
            - name: VITE_API_BASE_URL
              value: "http://192.168.100.2:18090"
            - name: VITE_MISSION_CONTROL_URL
              value: "http://192.168.100.2:18090"
            # Browser-facing (VITE_), so it must NOT be localhost (that would target the dev Mac and could
            # collide with a local dev orchestrator). Point at the .2 host on :8095 — the same host process
            # the gateway reaches in-cluster via host.docker.internal:8095. Replay UI is OFF on .2
            # (DATABENTO_REPLAY_UI_ENABLED=false) and no orchestrator runs there yet, but the URL is kept
            # .2-scoped for correctness/consistency.
            - name: VITE_REPLAY_ORCHESTRATOR_URL
              value: "http://192.168.100.2:8095"
