resources:
  - ../../base
  # Common infra (namespace, shared ConfigMaps with the .2-local values, streams-state
  # PVCs with k3s's 'local-path' storageClassName, ops CronJobs) — same overlay
  # Jenkinsfile.common-infra applies standalone. The former top-level
  # configmap-dev-local-patch.yaml moved INTO that overlay.
  - ../../infra/overlays/experiment
  # The web app's service slice (Deployment+Service). Env patches stay HERE (below);
  # k8s/services/web/overlays/experiment mirrors them — sync enforced by
  # scripts/ci/validate-services.sh render equivalence.
  - ../../services/web/base
patches:
  # reversal-confirmation is dev+production only (services.yaml envs) — the shared base
  # would otherwise render it ON in experiment with the remote .252 image on an
  # Apple-Silicon local cluster. Keep it OFF here (same pattern as other env-scoped services).
  - target:
      kind: Deployment
      name: reversal-confirmation-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # signal-follower is dev+production only (services.yaml envs) — same reasoning and
  # pattern as reversal-confirmation above: keep BOTH instances OFF in experiment
  # (unremapped .252 image; the ES instance would otherwise reach the real es4 broker).
  - target:
      kind: Deployment
      name: signal-follower-spx
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: signal-follower-es
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # stock-gex is dev+production only (services.yaml envs) — same pattern again. Experiment builds
  # no :dev image for it, its hostPath OI index does not exist on .2, and a live Databento
  # subscription there would burn a connection slot for nothing. Keep it OFF.
  - target:
      kind: Deployment
      name: stock-gex-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # context-tape is dev+production only (services.yaml envs) — same pattern as stock-gex /
  # signal-follower above: experiment builds no image for it and its image var is only
  # emitted for dev+production, so keep it OFF here.
  - target:
      kind: Deployment
      name: context-tape-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # multileg-structure is dev+production only (services.yaml envs) — same pattern as
  # context-tape above: experiment builds no image for it, so keep it OFF here.
  - target:
      kind: Deployment
      name: multileg-structure-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - path: web-dev-env-patch.yaml
  # EXPERIMENT: give the k8s feed-gateway the .2 WS auth/origins/replay config, so the browser's live
  # WS (ws://localhost:18091, tunnel -> .2:8091) is accepted from the web origin http://localhost:18090.
  - path: feed-gateway-dev-env-patch.yaml
  # EXPERIMENT-ONLY: drop the ibkr-feed workload. The experiment build job
  # (Jenkinsfile.experiment-build) deliberately does NOT build a :dev image for it — .2 runs the
  # Databento data path only (no IBKR). Without these deletes the base brings it into the overlay
  # and the pods sit in ImagePullBackOff.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ibkr-feed-service
        namespace: options-edge
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: ibkr-feed-service
        namespace: options-edge
      $patch: delete
  # The base web Deployment pins itself to the prod control-plane node
  # (nodeSelector node-role.kubernetes.io/control-plane: "true") because the
  # .4 failover node has intermittent DNS. Dev is single-node docker-desktop,
  # whose node is labelled node-role.kubernetes.io/control-plane="" (empty, not
  # "true"), so that selector leaves the web pod unschedulable (Pending). Remove
  # the selector for dev — there is only one node to schedule on anyway.
  - target:
      kind: Deployment
      name: options-edge-web
    patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
  # spread-skew-service + spread-skew-postgres-writer are kept OFF (replicas:0) on experiment for the
  # initial rollout (dev-only, mirrors the production keep-off). Re-enable = remove these patches and
  # regenerate the standalone slices.
  - target:
      kind: Deployment
      name: spread-skew-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: spread-skew-postgres-writer
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # (the prior ibkr-feed-service nodeSelector-removal patch was here; obsolete now that the
  # Deployment is excluded above — kustomize errors if a patch targets a deleted resource.)
  # EXPERIMENT-ONLY: serve the k8s web on the UNIQUE port :18090 (not dev :8090, not base :8094). The
  # browser reaches it at http://localhost:18090 via an SSH tunnel (localhost -> .2:18090) — localhost is
  # required for the OIDC/PKCE secure context (crypto.subtle), and :18090 keeps it distinct from the dev
  # http://localhost:8090 on the same Mac. docker-desktop's LoadBalancer binds :18090 on .2. The
  # feed-gateway WS_ALLOWED_ORIGINS matches that origin (http://localhost:18090). Prod keeps base :8094.
  - target:
      kind: Service
      name: options-edge-web
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 18090
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      # Kafka Streams apps rebalance on roll; a full-fleet roll can take >600s (k8s
      # default progressDeadlineSeconds) to report Available, failing the deploy even
      # though pods go Ready shortly after. Raise the controller deadline to 1200s so
      # the deploy tolerates the rebalance. apply.sh's `rollout status --timeout=1260s`
      # is set just above it so the controller's "exceeded progress deadline" fires first.
      - op: add
        path: /spec/progressDeadlineSeconds
        value: 1200
  # DEV-ONLY spx-mission-control auth: base points at the prod Keycloak
  # (https://auth.bleadingoptions.com/realms/optionsedge) which dev cannot reach.
  # Override the issuer + JWKS URIs to the local Mac Keycloak (192.168.100.2:8089)
  # so the mandatory MissionAuthSettings.validate() check is satisfied AND the JWKS
  # is actually fetchable at startup. Audience inherits from base ("options-edge-web").
  - path: spx-mission-control-dev-env-patch.yaml
