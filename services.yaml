  # seconds of the 251-session historical corpus (enter 4.8688, exit 3.8817). The seed values it
  # shipped with, enter 2.0, sat at the 65.5th percentile and declared CALL_PRESSURE or PUT_PRESSURE
  # on 34.5% of all seconds; a word true a third of the time is not a state. The STRIKE-granularity
  # thresholds are still seeds and are labelled as such in PressureConfig: calibrating them needs a
