# SERVICE REGISTRY — single source of truth for the standalone-service-deployment design
# (design doc: options-edge-documents/design/STANDALONE-SERVICE-DEPLOYMENT-DESIGN.md §5).
#
# Every deployable unit is registered here. scripts/ci/validate-services.sh enforces:
#   * every `standalone` service has its k8s/services/<name> slice + env overlays, and
#     its standalone render is EQUIVALENT to the monolithic overlay's render of the same
#     workload (the mirror rule);
#   * every Deployment rendered by the monolithic overlays is registered here
#     (completeness — a new service that skips registration fails CI: the gap that let
#     delta-flow/maxpain/integration-test reach a deploy with no image);
#   * blast-radius: standalone slices carry only service-owned kinds.
#
# deployment: the k8s Deployment name(s) the service owns.
# image:      the image basename in the env registry (oeProfile prepends the registry).
# managedBy:  standalone = has its own <svc>-deploy fast path;
#             monolith   = still deployed by the monolithic options-edge-deploy.
# namespace:  WHICH APPLICATION the service belongs to. Optional; unset means `options-edge`,
#             so every pre-existing entry keeps its behaviour and nothing needs back-filling.
#             Set it to `fullfunding` (or a future tenant) and service-deploy applies there
#             instead — the build reads this rather than assuming, and refuses if the rendered
#             manifests disagree with what is registered here.
#             The namespace itself is created by its own tenant/infra job, never by a service
#             deploy: see k8s/tenants/<tenant>/bootstrap.
# Migration COMPLETE for the processing repo (2026-07-02): every processing service is
# standalone. sliceGenerated entries get their overlays from
# scripts/deploy/generate-service-slices.sh (the monolith render of just that service —
# mirror rule by construction); re-run it whenever base manifests/patches change.
# Still monolith-only: feeds, gateway, integration-test, redis (other repos / infra).

services:
  # --- standalone (per-service fast path) ---------------------------------------------
  - name: web
    managedBy: standalone
    image: options-edge-web
    deployments: [options-edge-web]
    container: web
    buildJob: options-edge-web-deploy
    sourceRepo: options-edge
    envs: [dev, production, experiment]
    dependsOnInfraOnly: true
    consumedTopics: []       # browser data arrives via the feed-gateway WS, not Kafka
    producedTopics: []
    requiredConfigKeys: [KAFKA_BOOTSTRAP_SERVERS, SCHEMA_REGISTRY_URL, POSTGRES_JDBC_URL]

  # --- bleedingoptions tenant (the PUBLIC Gamma Lab) ------------------------------------
  # The `namespace` field routes this away from options-edge; without it the deploy would default
  # there and the render/registry guard would refuse it.
  #
  # ⚠️ Ships at replicas: 0. scripts/deploy/verify-public-gate.sh runs on this service's apply path
  # (service-deploy.sh) and refuses a scale-up without PGL-050/051/052 evidence for the exact image
  # digest. Same image as `web` — one codebase, one image, one PUBLIC_SURFACE switch.
  - name: bleedingoptions-gamma-lab
    managedBy: standalone
    namespace: bleedingoptions
    image: options-edge-web
    deployments: [bleedingoptions-gamma-lab]
    container: web
    buildJob: options-edge-web-deploy
    sourceRepo: options-edge
    envs: [production]
    dependsOnInfraOnly: true
    consumedTopics: []       # the public tier reads one REST endpoint; it touches no Kafka at all
    producedTopics: []
    requiredConfigKeys: [PUBLIC_SURFACE, PUBLIC_BOARD_UPSTREAM_URL, VITE_AUTH_ISSUER, AUTH_JWK_SET_URI]

  # The tenant's email sender (approval notices today; any outbound mail from here on).
  # Its own image and repo, deliberately NOT the web image: that surface has a small startup
  # contract on purpose, and putting an SMTP credential into it would widen exactly the boundary
  # PGL-034A draws. Single replica — see the Deployment header for why that is correctness.
  - name: bleedingoptions-email
    managedBy: standalone
    namespace: bleedingoptions
    image: oe-email-service
    deployments: [bleedingoptions-email]
    container: email
    buildJob: oe-email-service-deploy
    sourceRepo: oe-email-service
    envs: [production]
    dependsOnInfraOnly: true
    consumedTopics: []       # it reads Keycloak over HTTP and its own ledger; no Kafka at all
    producedTopics: []
    requiredConfigKeys: [SMTP_HOST, SMTP_USERNAME, MAIL_FROM, POSTGRES_JDBC_URL, KEYCLOAK_BASE_URL, KEYCLOAK_CLIENT_ID, APPROVED_GROUP]

  # --- fullfunding tenant --------------------------------------------------------------
  # The `namespace` field is what routes this away from options-edge. Without it the deploy
  # would default to options-edge and the render/registry guard would refuse it.
  - name: fullfunding-app
    namespace: fullfunding
    managedBy: standalone
    image: fullfunding-app
    deployments: [fullfunding-app]
    container: web
    sourceRepo: fullfunding-workspace
    envs: [production]
    dependsOnInfraOnly: true
    consumedTopics: []
    producedTopics: []
    requiredConfigKeys: []
  # --- monolith (deployed by options-edge-deploy; migrate in batches) ------------------
  - { name: databento-feed,               managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-databento-feed,               deployments: [options-edge-databento-feed], buildJob: options-edge-databento-feed-deploy }
  - { name: databento-sr3-feed,           managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-databento-sr3-feed,           deployments: [databento-sr3-feed-service], buildJob: options-edge-databento-sr3-feed-deploy }
  # databento-vix-feed: STANDALONE VIX OPRA feed (VIX feed separation PR-2). PROD-ONLY;
  # IMAGE REUSE — same image as databento-feed (command override selects the vix role),
  # so it builds in options-edge-databento-feed-deploy and needs no new pinning wiring.
  - { name: databento-vix-feed,           managedBy: standalone, sliceGenerated: true, envs: [production],      image: options-edge-databento-feed,               deployments: [databento-vix-feed], buildJob: options-edge-databento-feed-deploy }
  # ibkr-feed: DEV-ONLY since 2026-07-29 (IBKR SPX index priority-1 spot, requirement rev4) —
  # runs on the dev cluster next to the Mac-hosted IB Gateway and dual-produces the
  # underlying.spx.index.price hop topic to BOTH brokers. Prod overlay keeps it at 0, so the
  # standalone slice renders replicas:1 on dev and replicas:0 on production (prod never runs
  # the pod but the slice stays declared + mirror-validated; a production service-deploy is a
  # harmless 0-replica apply). Image builds in the options-edge-ibkr-feed job.
  - { name: ibkr-feed,                    managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-ibkr-feed,                    deployments: [ibkr-feed-service], buildJob: options-edge-ibkr-feed }
  - { name: feed-gateway,                 managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-feed-gateway,                 deployments: [feed-gateway-service], buildJob: feed-gateway-deploy }
  - { name: raw-to-display,               managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-raw-to-display,               deployments: [raw-to-display-service, raw-to-display-databento-service] }
  - { name: databento-volume-aggregator,  managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-databento-volume-aggregator,  deployments: [databento-volume-aggregator] }
  - { name: databento-gex,                managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-databento-gex,                deployments: [databento-gex-service] }
  - { name: databento-gex-history,        managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-databento-gex-history,        deployments: [databento-gex-history-service] }
  - { name: gamma-migration,             managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-gamma-migration,             deployments: [gamma-migration-service] }
  - { name: databento-mission-sandwich,   managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-databento-mission-sandwich,   deployments: [databento-mission-sandwich-service] }
  - { name: delta-flow,                   managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-delta-flow,                   deployments: [delta-flow-service] }
  - { name: dealer-ledger,                managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-dealer-ledger,                deployments: [dealer-ledger-service] }
  - { name: dealer-ledger-calibration,    managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-dealer-ledger-calibration,    deployments: [dealer-ledger-calibration-scorer, dealer-ledger-calibration-accumulator] }
  - { name: strike-intelligence,          managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-strike-intelligence,          deployments: [strike-intelligence-service] }
  - { name: option-truth-engine,          managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-option-truth-engine,          deployments: [option-truth-engine-service] }
  - { name: market-carry,                 managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-market-carry,                 deployments: [market-carry-service] }
  - { name: strike-invasion,              managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-strike-invasion,              deployments: [strike-invasion-service] }
  - { name: invasion-postgres-writer,     managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-invasion-postgres-writer,     deployments: [invasion-postgres-writer] }
  - { name: spread-skew,                  managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-spread-skew,                  deployments: [spread-skew-service] }
  - { name: es-spx-align,                 managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-es-spx-align,                 deployments: [es-spx-align-service] }
  - { name: reversal-confirmation,        managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-reversal-confirmation,        deployments: [reversal-confirmation-service] }
  - { name: drop-classifier,              managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-drop-classifier,              deployments: [drop-classifier-service] }
  - { name: spread-skew-postgres-writer,  managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-spread-skew-postgres-writer,  deployments: [spread-skew-postgres-writer] }
  - { name: es-open-direction,            managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-es-open-direction,            deployments: [es-open-direction-service] }
  - { name: close-direction,              managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-close-direction,              deployments: [close-direction-service] }
  - { name: spot-vol-regime,              managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-spot-vol-regime,              deployments: [spot-vol-regime-service] }
  - { name: indicator-service,            managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-indicator-service,            deployments: [indicator-service] }
  - { name: context-tape,                 managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-context-tape,                 deployments: [context-tape-service] }
  # multileg-structure: DESCRIPTIVE co-print observation surface (options.opra.tcbbo -> ranked
  # observations + per-window status). It claims no ownership, direction or dealer attribution —
  # OPRA carries no multi-leg marker (measured 2026-08-18) — so it is a screening surface only.
  - { name: multileg-structure,           managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-multileg-structure,           deployments: [multileg-structure-service] }
  # stock-gex: SPX-500 single-stock GEX (Databento equity options; NO Kafka). Its image builds in the
  # options-edge-databento-feed repo (Dockerfile.stockgex), like databento-sr3-feed — hence buildJob.
  # DEV-FIRST/on-demand: prod overlay holds it at replicas:0 until the nightly OI-index builder exists.
  - { name: stock-gex,                    managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-stock-gex,                    deployments: [stock-gex-service], buildJob: options-edge-stock-gex-deploy }
  # SPXW session-close open-interest shadow experiment. Ships DISABLED (OI_SHADOW_ENABLED=false):
  # the requirement's observation calendar starts at a NAMED session, so being deployed must not
  # be the same thing as having started. No consumers by design.
  - { name: oi-shadow,                    managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-oi-shadow,                    deployments: [oi-shadow-service] }
  - { name: vix-option-inteligence,        managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-vix-option-inteligence,        deployments: [vix-option-inteligence-service] }
  - { name: greek-move-authenticity,       managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-greek-move-authenticity,       deployments: [greek-move-authenticity-service] }
  - { name: es-open-direction-postgres-writer, managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-es-open-direction-postgres-writer, deployments: [es-open-direction-postgres-writer] }
  - { name: reversal-postgres-writer,     managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-reversal-postgres-writer,     deployments: [reversal-postgres-writer] }
  # Hot-strike paper follower (HOT-STRIKE-PAPER-FOLLOWER-GATE1 §3.1): ONE image, TWO per-market
  # deployments — SPX on the local broker, ES against the es4 broker over LAN; both write the
  # prod Postgres signal_ledger. Dev is SPX-only (signal-follower-es pinned to 0 in the dev overlay).
  - { name: signal-follower,              managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-signal-follower,              deployments: [signal-follower-spx, signal-follower-es] }
  # short-premium-agent: ONE Deployment, TWO containers (Agent A live recommender + Agent B EOD advisor daemon).
  # dev = 72B on the Mac's Ollama; prod = 7B on the .252 T1000 GPU (per-env patch overrides model/URL +
  # SP_REQUIRE_REAL). Referenced from BOTH overlays (like web), not k8s/base.
  - { name: short-premium-agent,          managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-short-premium-agent,          deployments: [short-premium-agent-service] }
  - { name: databento-maxpain,            managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-databento-maxpain,            deployments: [databento-maxpain-service] }
  - { name: strike-liquidity-heatmap,     managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-strike-liquidity-heatmap,     deployments: [strike-liquidity-heatmap-service] }
  - { name: option-price-behavior,        managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-option-price-behavior,        deployments: [option-price-behavior-service] }
  - { name: directional-pressure,         managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-directional-pressure,         deployments: [directional-pressure-service, directional-pressure-databento-service] }
  - { name: volume-pace,                  managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-volume-pace,                  deployments: [volume-pace-databento-service] }
  - { name: strike-flow-classifier,       managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-strike-flow-classifier,       deployments: [strike-flow-classifier-databento] }
  - { name: strike-flow-avro-adapter,     managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-strike-flow-avro-adapter,     deployments: [strike-flow-avro-adapter] }
  - { name: unified-sr,                   managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-unified-sr,                   deployments: [unified-sr-service] }
  - { name: gex-delta-redis-writer,       managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-gex-delta-redis-writer,       deployments: [gex-delta-redis-writer] }
  - { name: raw-postgres-writer,          managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-raw-postgres-writer,          deployments: [raw-postgres-writer] }
  - { name: pin-postgres-writer,          managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-pin-postgres-writer,          deployments: [pin-postgres-writer] }
  - { name: pressure-postgres-writer,     managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-pressure-postgres-writer,     deployments: [pressure-postgres-writer] }
  - { name: hpsf-postgres-writer,         managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-hpsf-postgres-writer,         deployments: [hpsf-postgres-writer-service] }
  - { name: spx-mission-control,          managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-spx-mission-control,          deployments: [spx-mission-control-service] }
  - { name: redis,                        managedBy: monolith, image: redis,                                     deployments: [options-edge-redis] }

# Infra workloads (Keycloak etc.) are owned by common-infra (k8s/infra), not listed here.
