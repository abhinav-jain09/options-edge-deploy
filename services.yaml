# SERVICE REGISTRY — single source of truth for the standalone-service-deployment design
# (design doc: options-edge-documents/design/STANDALONE-SERVICE-DEPLOYMENT-DESIGN.md §5).
#
# Every deployable unit is registered here. scripts/ci/validate-services.sh enforces:
#   * every `standalone` service has its k8s/services/<name> slice + env overlays, and
#     its standalone render is EQUIVALENT to the monolithic overlay's render of the same
#     workload (the mirror rule);
#   * every Deployment rendered by the monolithic overlays is registered here
#     (completeness — a new service that skips registration fails CI: the gap that let
#     delta-flow/maxpain/integration-test reach a deploy with no image);
#   * blast-radius: standalone slices carry only service-owned kinds.
#
# deployment: the k8s Deployment name(s) the service owns.
# image:      the image basename in the env registry (oeProfile prepends the registry).
# managedBy:  standalone = has its own <svc>-deploy fast path;
#             monolith   = still deployed by the monolithic options-edge-deploy.
# namespace:  WHICH APPLICATION the service belongs to. Optional; unset means `options-edge`,
#             so every pre-existing entry keeps its behaviour and nothing needs back-filling.
#             Set it to `fullfunding` (or a future tenant) and service-deploy applies there
#             instead — the build reads this rather than assuming, and refuses if the rendered
#             manifests disagree with what is registered here.
#             The namespace itself is created by its own tenant/infra job, never by a service
#             deploy: see k8s/tenants/<tenant>/bootstrap.
# Migration COMPLETE for the processing repo (2026-07-02): every processing service is
# standalone. sliceGenerated entries get their overlays from
# scripts/deploy/generate-service-slices.sh (the monolith render of just that service —
# mirror rule by construction); re-run it whenever base manifests/patches change.
# Still monolith-only: feeds, gateway, integration-test, redis (other repos / infra).

services:
  - name: rithmic-depth-bridge
    managedBy: es4
    image: rithmic-depth-bridge
    deployments: [rithmic-depth-bridge, rithmic-depth-mirror-dev, rithmic-depth-mirror-production]
    sourceRepo: rithmic-depth-bridge
    # Moved out of es4-deploy 2026-11-08: a two-source release cannot carry that job's
    # permitted-commit guard, and one unguardable branch made the whole es4 job unguardable.
    buildJob: rithmic-depth-bridge-release
    envs: [es4]
    consumedTopics: []
    producedTopics: [es.rithmic.depth]
  # --- standalone (per-service fast path) ---------------------------------------------
  - name: web
    managedBy: standalone
    image: options-edge-web
    deployments: [options-edge-web]
    container: web
    buildJob: options-edge-web-deploy
    sourceRepo: options-edge
    envs: [dev, production, experiment]
    dependsOnInfraOnly: true
    consumedTopics: []       # browser data arrives via the feed-gateway WS, not Kafka
    producedTopics: []
    requiredConfigKeys: [KAFKA_BOOTSTRAP_SERVERS, SCHEMA_REGISTRY_URL, POSTGRES_JDBC_URL]

  # --- bleedingoptions tenant (the PUBLIC Gamma Lab) ------------------------------------
  # The `namespace` field routes this away from options-edge; without it the deploy would default
  # there and the render/registry guard would refuse it.
  #
  # ⚠️ Ships at replicas: 0. scripts/deploy/verify-public-gate.sh runs on this service's apply path
  # (service-deploy.sh) and refuses a scale-up without PGL-050/051/052 evidence for the exact image
  # digest. Same image as `web` — one codebase, one image, one PUBLIC_SURFACE switch.
  - name: bleedingoptions-gamma-lab
    managedBy: standalone
    namespace: bleedingoptions
    image: options-edge-web
    deployments: [bleedingoptions-gamma-lab]
    container: web
    buildJob: options-edge-web-deploy
    sourceRepo: options-edge
    envs: [production]
    dependsOnInfraOnly: true
    consumedTopics: []       # the public tier reads one REST endpoint; it touches no Kafka at all
    producedTopics: []
    requiredConfigKeys: [PUBLIC_SURFACE, PUBLIC_BOARD_UPSTREAM_URL, VITE_AUTH_ISSUER, AUTH_JWK_SET_URI]

  # The tenant's email sender (approval notices today; any outbound mail from here on).
  # Its own image and repo, deliberately NOT the web image: that surface has a small startup
  # contract on purpose, and putting an SMTP credential into it would widen exactly the boundary
  # PGL-034A draws. Single replica — see the Deployment header for why that is correctness.
  # THE CLOSING-BOARD SCHEDULE, owned by the batch itself (USER 2026-09-01: "I don't want
  # anything Jenkins-based, it should run based on Spring Batch configuration"). A long-lived pod
  # holding two cron triggers in New York time; the Jenkins job that used to drive this keeps only
  # its manual entry point. Same image as the one-shot close Job — one batch, one build.
  - name: stock-gex-close-scheduler
    managedBy: standalone
    image: oe-close-batch
    deployments: [stock-gex-close-scheduler]
    container: scheduler
    buildJob: oe-close-batch
    sourceRepo: oe-close-batch
    envs: [dev, production]

  - name: bleedingoptions-email
    managedBy: standalone
    namespace: bleedingoptions
    image: oe-email-service
    deployments: [bleedingoptions-email]
    container: email
    buildJob: oe-email-service-deploy
    sourceRepo: oe-email-service
    envs: [production]
    dependsOnInfraOnly: true
    consumedTopics: []       # it reads Keycloak over HTTP and its own ledger; no Kafka at all
    producedTopics: []
    requiredConfigKeys: [SMTP_HOST, SMTP_USERNAME, MAIL_FROM, POSTGRES_JDBC_URL, KEYCLOAK_BASE_URL, KEYCLOAK_CLIENT_ID, APPROVED_GROUP]

  # --- fullfunding tenant --------------------------------------------------------------
  # The `namespace` field is what routes this away from options-edge. Without it the deploy
  # would default to options-edge and the render/registry guard would refuse it.
  - name: fullfunding-app
    namespace: fullfunding
    managedBy: standalone
    image: fullfunding-app
    deployments: [fullfunding-app]
    container: web
    sourceRepo: fullfunding-workspace
    envs: [production]
    dependsOnInfraOnly: true
    consumedTopics: []
    producedTopics: []
    requiredConfigKeys: []
  # --- monolith (deployed by options-edge-deploy; migrate in batches) ------------------
  - { name: databento-feed,               managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-databento-feed,               deployments: [options-edge-databento-feed], buildJob: options-edge-databento-feed-deploy }
  - { name: databento-sr3-feed,           managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-databento-sr3-feed,           deployments: [databento-sr3-feed-service], buildJob: options-edge-databento-sr3-feed-deploy }
  # databento-vix-feed: STANDALONE VIX OPRA feed (VIX feed separation PR-2). PROD-ONLY;
  # IMAGE REUSE — same image as databento-feed (command override selects the vix role),
  # so it builds in options-edge-databento-feed-deploy and needs no new pinning wiring.
  - { name: databento-vix-feed,           managedBy: standalone, sliceGenerated: true, envs: [production],      image: options-edge-databento-feed,               deployments: [databento-vix-feed], buildJob: options-edge-databento-feed-deploy }
  # ibkr-feed: DEV-ONLY since 2026-07-29 (IBKR SPX index priority-1 spot, requirement rev4) —
  # runs on the dev cluster next to the Mac-hosted IB Gateway and dual-produces the
  # underlying.spx.index.price hop topic to BOTH brokers. Prod overlay keeps it at 0, so the
  # standalone slice renders replicas:1 on dev and replicas:0 on production (prod never runs
  # the pod but the slice stays declared + mirror-validated; a production service-deploy is a
  # harmless 0-replica apply). Image builds in the options-edge-ibkr-feed job.
  - { name: ibkr-feed,                    managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-ibkr-feed,                    deployments: [ibkr-feed-service], buildJob: options-edge-ibkr-feed }
  # Same image/build job as ibkr-feed (com.optionsedge.ibkrfeed.thetadata is a second main
  # class in the same shaded jar — see options-edge-ibkr-feed's Dockerfile.thetadata); the
  # ThetaData overnight (GTH) feed is its own Deployment with a command override. Dev-only
  # (base replicas:0, dev overlay patches to 1), same as ibkr-feed's own dev-only story.
  - { name: thetadata-feed,               managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-ibkr-feed,                    deployments: [thetadata-feed-service], buildJob: options-edge-ibkr-feed }
  - { name: feed-gateway,                 managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-feed-gateway,                 deployments: [feed-gateway-service], buildJob: feed-gateway-deploy }
  - { name: raw-to-display,               managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-raw-to-display,               deployments: [raw-to-display-service, raw-to-display-databento-service] }
  - { name: databento-volume-aggregator,  managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-databento-volume-aggregator,  deployments: [databento-volume-aggregator] }
  - { name: databento-gex,                managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-databento-gex,                deployments: [databento-gex-service] }
  - { name: databento-gex-history,        managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-databento-gex-history,        deployments: [databento-gex-history-service] }
  - { name: gamma-migration,             managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-gamma-migration,             deployments: [gamma-migration-service] }
  - { name: gamma-ladder-path,           managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-gamma-ladder-path,           deployments: [gamma-ladder-path-service] }
  - { name: vol-state,                    managedBy: standalone, sliceGenerated: true, envs: [dev], image: options-edge-vol-state,                    deployments: [vol-state-service] }
  # oi-next-publication: DEV-ONLY by owner decision ("this service is only dev", 2026-09-23). A
  # Streams service that publishes per-leg NEXT-morning open interest at each session's Curb close
  # (options.spx.oi.next-publication). PRODUCING since 2026-10-02 (the image ships its model, the
  # Deployment admits it); its postgres-writer below lands it in the table GEX reads.
  - { name: oi-next-publication,          managedBy: standalone, sliceGenerated: true, envs: [dev], image: options-edge-oi-next-publication,          deployments: [oi-next-publication-service] }
  - { name: oi-next-publication-postgres-writer, managedBy: standalone, sliceGenerated: true, envs: [dev], image: options-edge-oi-next-publication-postgres-writer, deployments: [oi-next-publication-postgres-writer] }
  - { name: gamma-leadership,            managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-gamma-leadership,            deployments: [gamma-leadership-service] }
  - { name: nifty-gex,                    managedBy: standalone, envs: [dev, production], image: options-edge-nifty-gex,                    deployments: [nifty-gex-service], container: nifty-gex, sourceRepo: options-edge-nifty-gex }
  # zn-gex: CME ZN (10Y T-Note futures) options -> yield-equivalent GEX (Databento GLBX.MDP3,
  # Black-76 + versioned DV01 map). NEW, dev-only until the ingestion path + DV01 mapping have
  # a live proof — add `production` here only after that soak, mirroring the vol-state pattern.
  - { name: zn-gex,                       managedBy: standalone, envs: [dev], image: options-edge-zn-gex,                       deployments: [zn-gex-service], container: zn-gex, sourceRepo: options-edge-zn-gex }
  - { name: corridor-gauge,               managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-corridor-gauge,               deployments: [corridor-gauge-service] }
  - { name: databento-mission-sandwich,   managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-databento-mission-sandwich,   deployments: [databento-mission-sandwich-service] }
  - { name: delta-flow,                   managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-delta-flow,                   deployments: [delta-flow-service] }
  - { name: dealer-ledger,                managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-dealer-ledger,                deployments: [dealer-ledger-service] }
  - { name: dealer-ledger-calibration,    managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-dealer-ledger-calibration,    deployments: [dealer-ledger-calibration-scorer, dealer-ledger-calibration-accumulator] }
  - { name: strike-intelligence,          managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-strike-intelligence,          deployments: [strike-intelligence-service] }
  - { name: option-truth-engine,          managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-option-truth-engine,          deployments: [option-truth-engine-service] }
  - { name: market-carry,                 managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-market-carry,                 deployments: [market-carry-service] }
  # Dark-deployed (replicas 0) pending the MIN_ACTIONABLE_LEAD_MS drill and operator-approved
  # promotion gates. dev only: production is not listed on purpose — nothing about this service
  # has cleared a production gate, and adding the env here is the deliberate act that would say it had.
  - { name: approach-monitor,             managedBy: standalone, sliceGenerated: true, envs: [dev],             image: options-edge-approach-monitor,             deployments: [approach-monitor-service] }
  - { name: approach-position-publisher,  managedBy: standalone, sliceGenerated: true, envs: [dev],             image: options-edge-approach-position-publisher, deployments: [approach-position-publisher], buildJob: options-edge-approach-position-publisher }
  - { name: strike-invasion,              managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-strike-invasion,              deployments: [strike-invasion-service] }
  - { name: invasion-postgres-writer,     managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-invasion-postgres-writer,     deployments: [invasion-postgres-writer] }
  - { name: spread-skew,                  managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-spread-skew,                  deployments: [spread-skew-service] }
  - { name: es-spx-align,                 managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-es-spx-align,                 deployments: [es-spx-align-service] }
  - { name: reversal-confirmation,        managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-reversal-confirmation,        deployments: [reversal-confirmation-service] }
  - { name: drop-classifier,              managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-drop-classifier,              deployments: [drop-classifier-service] }
  - { name: spread-skew-postgres-writer,  managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-spread-skew-postgres-writer,  deployments: [spread-skew-postgres-writer] }
  - { name: es-open-direction,            managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-es-open-direction,            deployments: [es-open-direction-service] }
  - { name: close-direction,              managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-close-direction,              deployments: [close-direction-service] }
  - { name: spot-vol-regime,              managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-spot-vol-regime,              deployments: [spot-vol-regime-service] }
  - { name: vol-premium,                  managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-vol-premium,                  deployments: [vol-premium-service] }
  - { name: indicator-service,            managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-indicator-service,            deployments: [indicator-service] }
  - { name: context-tape,                 managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-context-tape,                 deployments: [context-tape-service] }
  # es-aggressor-flow: PRODUCTION ONLY (dev has no ES feed). On prod it publishes only the
  # Kyle-style signed-flow response slope; the legacy absorption label is switched off there.
  - { name: es-aggressor-flow,            managedBy: standalone, sliceGenerated: true, envs: [production],      image: options-edge-es-aggressor-flow,            deployments: [es-aggressor-flow-service] }
  # es-trade-linearizer: dev+prod since 2026-10-07 (dev's databento feed DOES write underlying.es.trades, 32 partitions,
  # same as prod; the dev overlay patches ES_LINEARIZER_BOOTSTRAP_SERVERS to the env-local broker). It republishes
  # underlying.es.trades in one durable total order onto a single-partition tape so the slope
  # above can run at all. PUBLISHES under the APPEND late policy — ES_LINEARIZER_OUTPUT_ENABLED=true in the manifest.
  - { name: es-trade-linearizer,          managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-es-trade-linearizer,          deployments: [es-trade-linearizer-service] }
  # es-compression-expansion: dev SHADOW; production is held at replicas 0 by the production overlay after the
  # 2026-10-16 accuracy-gate withdrawal. It reads the linearizer's tape plus the SPX-side evidence topics; the
  # ES-side ones (footprint, auction) exist only on prod and are reported UNAVAILABLE on dev. No Service object.
  - { name: es-compression-expansion,     managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-es-compression-expansion,     deployments: [es-compression-expansion-service] }
  # hedging-pressure: DEPLOYED HELD AT replicas 0 on dev AND production (owner turns it on later). Consumes
  # delta-flow-by-strike, underlying.spx.price, options.databento.strike-flow and options.databento.gex.strike and
  # publishes hedging-pressure.state (compacted) + hedging-pressure.cycle-input in ONE Kafka transaction per cycle.
  # SINGLE replica only (a second instance with the same transactional.id fences the first). No Service object.
  # Held down by: replicas: 0 in the base, KEEP_DOWN in morning-autostart.sh + oe-boot-bringup.sh, DISABLED_DEV in
  # dev-cleanup.sh. HEDGING_PRESSURE_REGIMES is deliberately unset (the service then reports UNAVAILABLE(REGIME_UNSET)).
  - { name: hedging-pressure,             managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-hedging-pressure,             deployments: [hedging-pressure-service] }
  # multileg-structure: DESCRIPTIVE co-print observation surface (options.opra.tcbbo -> ranked
  # observations + per-window status). It claims no ownership, direction or dealer attribution —
  # OPRA carries no multi-leg marker (measured 2026-08-18) — so it is a screening surface only.
  - { name: multileg-structure,           managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-multileg-structure,           deployments: [multileg-structure-service] }
  # market-structure: RUNNING on dev and production (replicas 1). Consumes options.indicators.bars
  # read-only (the owner's SPX 1m/5m/15m bars) and publishes options.spx.market-structure.ui — the
  # projection the Context Tape page already validates — plus .sequence (R3's session records) and
  # .dlq (R2's rejections), and transactional .recovery. Lifecycle and structural state are now in the UI;
  # the broader public snapshot contract remains separate. SINGLE replica only
  # (per-environment transactional.id). All four output/recovery topics must exist at start —
  # scripts/kafka/ensure-market-structure-topics.sh is the first-deploy barrier and the service's own
  # R13 boot verification refuses readiness until they match.
  - { name: market-structure,             managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-market-structure,             deployments: [market-structure-service] }
  # market-commentary: shadow on dev and production (replicas 1). Fuses the auction lean, the spread-skew option lean, SPX spot and option quote
  # spreads into one labelled description per minute; publishes options.spx.market-commentary.{minute,current,events,rejections}.
  # Makes no forecast. Single replica only (per-environment transactional.id). All four topics must exist at start —
  # scripts/kafka/ensure-market-commentary-topics.sh is the first-deploy barrier.
  - { name: market-commentary,            managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-market-commentary,            deployments: [market-commentary-service] }
  # early-auction-verdict: shadow predictor of the auction desk's four selling confirmations
  # (EARLY-AUCTION-VERDICT-STAGE1-GATE1.md rev 18a). HELD AT replicas 0 everywhere: the pod
  # cannot even start before the verifier-produced lock ConfigMap exists (EAV-R2a fail-closed
  # boot), and EAV-R17's emission floor blocks any non-dev enable. Reads the auction + witness
  # topics read-only; writes only early-auction.verdicts.shadow (1 partition, retention -1).
  - { name: early-auction-verdict,        managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-early-auction-verdict,        deployments: [early-auction-verdict-service] }
  # break-score: RETIRED 2026-10-25 as a predictor (never deployed; held at 0 everywhere; BREAK_SCORE_MODE and the SHADOW mode are retired with it). Scored a break of a level from the linearized ES tape
  # (underlying.es.trades.linearized) and publishes futures.break-score.events (1 partition, delete, retention.ms=-1,
  # retention.bytes=16777216). Held at replicas 0 on dev AND production and not to be enabled.
  # Held down by: replicas: 0 in the base, KEEP_DOWN in morning-autostart.sh + oe-boot-bringup.sh, DISABLED_DEV in dev-cleanup.sh.
  # scripts/kafka/ensure-break-score-topics.sh is the first-deploy barrier. No Service object.
  - { name: break-score,                  managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-break-score,                  deployments: [break-score-service] }
  # level-absorption: EYEBALL phase (status events, NO verdict). RUNS ON DEV (replicas 1 through k8s/overlays/dev/level-absorption-dev-enable-patch.yaml since 2026-10-25),
  # held at replicas 0 on production (docs/level-absorption/DEPLOY-WIRING.md). Reads the
  # linearized ES tape, es.futures.footprint.bars, es.futures.auction, the manual-line topic and (version 2, host sites) the
  # market-structure UiProjection topic options.spx.market-structure.ui; publishes futures.level-absorption.{events,voice,closures}.
  # Production: same hold-down paths as the retired break-score; DEV runs it at replicas 1 (EYEBALL). scripts/kafka/ensure-level-absorption-topics.sh is the first-deploy barrier.
  - { name: level-absorption,             managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-level-absorption,             deployments: [level-absorption-service] }
  # es-trade-tools (TICK-TRADE-TOOLS, TA books): Point-and-Figure charts, volume nodes and flow bars from the linearized ES tape
  # (underlying.es.trades.linearized), published as Avro on futures.pf.* / futures.volume-nodes / futures.flow.* / futures.tradetools.state.
  # DEPLOYED HELD AT replicas 0 on dev AND production with TT_ENABLED and all four family flags "false" (requirement D-R20.1: dev first, no
  # environment beyond dev before the calibration job). Held down by: replicas: 0 in the base, KEEP_DOWN in morning-autostart.sh +
  # oe-boot-bringup.sh, DISABLED_DEV in dev-cleanup.sh. scripts/kafka/ensure-es-trade-tools-topics.sh is the first-deploy barrier. No Service object.
  - { name: es-trade-tools,               managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-es-trade-tools,               deployments: [es-trade-tools-service] }
  # wave-cycle (ELLIOTT-FIB-CYCLE-TOOLS, TA books): Elliott waves, Fibonacci time and cycles for SPX from options.indicators.bars, Avro on
  # options.spx.wave-cycle.{waves,cycles,recovery}. DEPLOYED HELD AT replicas 0 on dev AND production with WAVE_CYCLE_ENABLED and
  # WAVE_CYCLE_SEASONALITY_ENABLED "false"; it needs its five Avro subjects registered even with the flags off. Same hold-down paths as
  # es-trade-tools. scripts/kafka/ensure-wave-cycle-topics.sh is the first-deploy barrier. No Service object.
  - { name: wave-cycle,                   managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-wave-cycle,                   deployments: [wave-cycle-service] }
  # break-classifier (Phase F, TA books): classifies SPX/ES level breaks from options.indicators.bars, es.futures.footprint.bars and the Phase B/C parent and pivot topics (no producer of those two yet, so it
  # publishes status and no marks), Avro on options.spx.break-classification{,.checkpoint}. Its pre-registered validation FAILED: every classification it publishes is UNDECIDED(NO_MEASURED_EDGE). LIVE (replicas 1, BREAK_CLASSIFIER_ENABLED true) on dev AND production through the per-environment enable patches
  # (k8s/overlays/<env>/break-classifier-{dev,prod}-enable-patch.yaml); the shared base is replicas 0 / "false". Needs its six Avro subjects (2601-2606) and the barrier
  # scripts/kafka/ensure-break-classification-topics.sh (topic-level checkpoint limit only; no broker-wide change). Single replica; no Service object. NOT in KEEP_DOWN or DISABLED_DEV.
  - { name: break-classifier,             managedBy: standalone, sliceGenerated: true, envs: [dev, production], image: options-edge-break-classifier,             deployments: [break-classifier-service] }
