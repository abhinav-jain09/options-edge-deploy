name: Deploy Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          set -euo pipefail
          curl -fsSLo kubectl "https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install yq
        run: |
          set -euo pipefail
          # PINNED, and the validators must be exercised against THIS version. A yq-version
          # difference (4.44 vs 4.53) silently turned validate-preopen-single-publisher into a
          # permanently red check that could not distinguish a real misconfiguration from the
          # tool: the `//` alternative operator is evaluated per document, so every non-matching
          # document in a rendered multi-doc stream produced its own default line.
          curl -fsSLo yq "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64"
          chmod +x yq
          sudo mv yq /usr/local/bin/yq

      - name: Service slices are regenerated (no drift)
        # Catches the recurring mirror-drift class: someone tunes a service's patch in the
        # monolith overlay (k8s/overlays/*) but forgets to re-run the slice generator, so the
        # generated k8s/services/*/overlays/* slices go stale and every deploy's Validate stage
        # fails later. Run the generator here and fail the PR if it would change any committed
        # slice — i.e. the author must commit the regenerated output.
        run: |
          set -euo pipefail
          bash scripts/deploy/generate-service-slices.sh
          if ! git diff --quiet -- k8s/services; then
            echo "::error::Service slices are out of date. Run scripts/deploy/generate-service-slices.sh and commit the regenerated k8s/services/**."
            git --no-pager diff --stat -- k8s/services
            echo "----- full diff -----"
            git --no-pager diff -- k8s/services
            exit 1
          fi
          echo "Service slices are up to date."

      # The same drift class one environment over, and a worse blast radius: k8s/es4/services/**
      # is generated from the PRODUCTION slices, so a prod env change silently queues itself up
      # for es4 — a LIVE environment — and lands whenever someone next re-renders for an
      # unrelated reason. Three such problems were sitting on main when this gate was added: an
      # inherited DATABENTO_GEX_DYNAMIC_OI_ENABLED flip, the IBKR_GEX_* pre-open wiring, and two
      # manifests that fell out of the renderer's SERVICES list yet are still deployed by
      # deploy-all. The gate therefore checks the file SET as well as file contents — deploy-all
      # globs the directory, so an un-rendered or uncommitted file there still reaches the box.
      # PyYAML is pinned to the version the committed manifests were rendered with: the check
      # compares emitted YAML byte-for-byte, so a formatting change between releases would read
      # as drift.
      - name: Install PyYAML
        run: python3 -m pip install --quiet 'pyyaml==6.0.3'

      - name: es4 manifests are regenerated and fully accounted for (no drift)
        run: bash scripts/ci/validate-es4-render.sh

      - name: Validate service registry (completeness + mirror + image name)
        run: scripts/ci/validate-services.sh

      # ES Footprint G-R8: the record ceiling is ONE value across two manifests, and the relay's
      # working set lives outside the heap. Neither fact is visible from either manifest alone,
      # and both fail SILENTLY in production — a producer above the gateway's ceiling loses records
      # at the relay with nothing logged upstream, and a container whose limit equals its -Xmx is
      # OOM-killed on native growth the heap never sees. Checked only where the relay is enabled.
      - name: ES Footprint deployment contingency (paired ceiling, G-R8 headroom)
        run: scripts/ci/validate-footprint-gateway-contingency.sh

      - name: ES Footprint contingency guard refuses each of its own violations
        run: scripts/ci/validate-footprint-gateway-contingency-test.sh

      # A topic auto-created after a reset comes up on the BROKER's defaults, and those defaults may
      # happen to match what the declaration asks for — so `kafka-configs --describe` shows no drift
      # because it shows no topic-level config at all. The agreement is a coincidence that ends the
      # moment a default moves. This exercises the guard's arms against a fake broker; the live
      # assertion runs on the deploy paths, which have a real one.
      - name: Declared retention overrides must be set on the topic, not inherited (guard arms)
        run: scripts/ci/validate-declared-overrides-are-explicit-test.sh

      # es4 is the one environment CI cannot reach: its declaration and its broker exist only behind
      # the shims on that box, so the guard's es4 arm is otherwise never run against any broker at
      # all. This EXECUTES scripts/es4/create-es-topics.sh end to end against a fake es4 Kafka and
      # checks that the guard runs there, reads the es4 declaration, and fails the reconciliation
      # when a declared topic is left sitting on the broker default.
      - name: The es4 reconciliation proves itself (create-es-topics end to end)
        run: scripts/ci/validate-es4-reconciliation-guard-test.sh

      # VIX feed separation §7: validate-services.sh already runs the single-publisher
      # assertion against the REAL render; this additionally exercises the assertion's
      # full predicate matrix (five planned rollout states, both-owners violations,
      # runtime-equivalent spellings, fail-closed states) against crafted fixtures, so
      # a predicate regression cannot hide behind a currently-green render.
      - name: VIX single-publisher assertion test matrix
        run: python3 -m unittest -v tests.test_vix_single_publisher

      # One Service One Identity Rule: no service identity (Streams application.id / consumer group)
      # may carry a version suffix. FAIL-CLOSED — a red result here blocks the merge. This exists
      # because oi-shadow was born as "oi-shadow-v1" eleven days AFTER the platform-wide unversioning
      # migration and survived five weeks: a point-in-time sweep cannot see what is created after it.
      - name: Service identities are unversioned (One Service One Identity Rule)
        run: python3 -m unittest -v tests.test_service_identity_unversioned

      # Every tests/test_*.py must be COLLECTABLE by unittest, the only runner this repo has.
      # Three files were written as bare module-level test_ functions (pytest style) and so ran as
      # "0 tests ... OK" — including one carrying a genuinely failing assertion nobody could see.
      - name: Test files are collectable by unittest (no silently-empty suites)
        run: bash scripts/ci/validate-tests-are-collectable.sh

      # The es4 topic contract: topics.env is the single source of truth for the es4 broker, and
      # these two modules are what hold it to that. Both were among the uncollectable files above,
      # so neither had ever run here.
      # The close chain's session arithmetic, and the rule that no shell script may do date
      # arithmetic at all: `date -v` (BSD) vs `date -d` (GNU) is decided by the agent's PATH, and
      # that bet cost the 2026-09-01 morning catch-up its entire run.
      - name: Close-board session resolution + shell date-portability guard
        run: python3 -m unittest -v tests.test_close_board_session_resolution

      - name: es4 topic SSOT + partition contract
        run: python3 -m unittest -v tests.test_es4_topics_ssot tests.test_es4_topic_partition_contract tests.test_remove_retired_workloads

      # The dev/prod arm of the same wedge: options.opra.tcbbo was undeclared, so after a wipe broker
      # auto-create (num.partitions=1) shaped it and strike-flow-classifier's repartition topics were
      # created at 1 against a 32-partition source (dev, 2026-09-10: 0 records for ~8h, READY).
      - name: OPRA tape declared at its real shape (dev/prod)
        run: python3 -m unittest -v tests.test_opra_tcbbo_declared

      # Same wedge, third door: the es4->dev MM1 mirrors kept producing through the dev wipe and
      # re-created gex.strike/gex.spxbridge/indicators.bars/strike-intelligence-by-strike at 1 partition
      # before ensure_topics ran (2026-09-14). dev-cleanup must unload them around the delete.
      - name: dev wipe pauses the es4->dev mirrors
        run: python3 -m unittest -v tests.test_dev_cleanup_pauses_dev_mirrors

      # The repair half: a Streams app that rejects an internal topic's partition count never becomes
      # READY and restarts never help. Every bring-up (dev start/overnight, prod boot, es4 reset) runs the
      # doctor, which reads Streams' expected count from the log and recreates only that app's topic.
      - name: Streams partition doctor (simulated cluster) + bring-up wiring
        run: python3 -m unittest -v tests.test_streams_partition_doctor

      # The prod boot bring-up scales up every deployment at 0 except its KEEP_DOWN; the morning wake-up
      # holds down its own KEEP_DOWN. A service held down only in the morning is resurrected by the next
      # reboot — a shorter boot list took production down twice (2026-08-24).
      - name: Boot bring-up and morning autostart hold down the same services
        run: python3 -m unittest -v tests.test_keep_down_lists_agree

      # The prevention half: every topic dev needs has ONE partition count and is created before any
      # service starts, and declarations match what owners create (2026-09-15 partition audit).
      - name: Partition-only topics + raised declarations
        run: python3 -m unittest -v tests.test_partition_only_topics

      # One hop further: Streams sources written by ANOTHER service (strike-flow, strike.avro,
      # strike-sr.current, strike-intelligence-by-strike). Runs the real apply-topics.sh for prod and
      # dev plus dev-cleanup's topic_desired, and holds each declaration to the live shape its owner
      # stamps, so the declaration pre-creates the right partition count without changing any config.
      - name: Cross-service Streams sources declared at their live shape
        run: python3 -m unittest -v tests.test_cross_service_streams_sources_declared

      # The es4 arm of the same contract, EXECUTED: tests.test_vix_option_inteligence_prune runs the
      # real scripts/es4/create-es-topics.sh — its CLI shims and the shared applier all the way down
      # — against a fake es4 broker. That is the only place the es4 path is exercised at all: CI
      # cannot reach es4, and the topic modules above only read topics.env. Neither module ran here,
      # and both of the prune module's end-to-end cases were RED on main: the shims run `sudo -n
      # docker exec`, nothing stubbed `sudo`, and the real one asked for a password. A test nothing
      # runs is a test that goes red and stays red.
      - name: vix-option-inteligence prune + deploy contract (executes create-es-topics.sh)
        run: python3 -m unittest -v tests.test_vix_option_inteligence_prune tests.test_vix_option_inteligence_deploy

      - name: Validate dev GEX availability safeguards
        run: bash scripts/ci/validate-gex-dev-safety.sh

      # A mirrored es4 topic has two owners that both write its shape — the MM1 job that creates
      # and asserts it, and apply-topics.sh, which rewrites retention.ms + cleanup.policy on every
      # declared topic on every deploy. Undeclared, it was a deletion candidate for
      # cleanup-topics.sh; declared with the wrong shape, the deploy reconciles the mirror's own
      # contract away. This makes the two declarations unmergeable when they disagree.
      # (The retention=-1 preserved-or-rebuildable classification that es.tape-zones.board now
      # depends on is already gated: validate-services.sh runs
      # scripts/ci/validate-durable-topic-preservation.sh as its section 6.)
      - name: Validate mirrored es4 topic contracts (mirror jobs vs topics.env)
        run: bash scripts/ci/validate-mirrored-topic-contracts.sh

      # A Groovy pipeline is not shell-checked by anything. Jenkinsfile.es-auction-mirror shipped with
      # an unterminated brace group (`fi; { : }`) that Groovy and review both accepted and that failed
      # at RUNTIME on the job's first install, after the preflight had already talked to both brokers.
      - name: Validate the es-auction mirror's shell blocks parse
        run: bash scripts/ci/validate-jenkinsfile-shell-blocks.sh

      # The enumeration mirror's payload proof compares a 71 KB single-line record. `grep -F -x -f`
      # died on it with "out of memory" while the mirror itself had copied the record perfectly, and
      # the shell read-loop that replaced it could not prove byte identity either: `read` discards
      # NUL bytes, a reference lacking its final LF could never match, and newline-delimited output
      # is not record-delimited. The comparison now happens in bytes, in python. This drives that
      # helper against each of those cases — a proof nobody exercises is not a proof.
      - name: Validate the mirrored-record byte comparison
        run: bash scripts/ci/find-mirrored-record-test.sh

      # A shell FUNCTION used in a `sh` block that does not DEFINE it is a runtime failure nothing
      # else catches: `bash -n` parses `es4 "..."` happily as a command, and review sees a helper
      # that plainly exists — twelve lines away, in a different stage's shell. Each `sh` step is its
      # own process. Introduced with the es4-docker mirror runner, which added three such helpers.
      - name: Validate mirror shell helpers are defined where they are used
        run: bash scripts/ci/validate-mirror-shell-helpers.sh

      # The MM1 producer stanza is generated inside a heredoc that NO other check reads: the mirror
      # shape tests extract only the block after BEGIN SHAPE ASSERTIONS, so an edit back to acks=1 or
      # a dropped enable.idempotence would land silently. Four assertions: the seven stanzas hash EQUAL
      # to one another, that stanza carries exactly one acks= (all) and one enable.idempotence= (true),
      # no line outside the heredoc writes the file, and each generated run-mirror*.sh actually hands
      # the file to kafka-mirror-maker — bytes nothing runs would prove nothing.
      - name: Validate the mirror producer contract (acks=all, pinned idempotence)
        run: bash scripts/ci/mirror-producer-contract-test.sh

      # ansible/ is a SECOND generator for the same unit files, used when no Jenkins console is being
      # watched. This fails the build when the table and the pipelines stop agreeing on the producer
      # stanza, the consumer group formula, the offset reset, the isolation level, the topic
      # allow-list or the unit naming. (The per-end shape assertions it cannot read are named in its
      # header, not implied away.)
      - name: Validate the Ansible mirror table against the pipelines
        run: bash scripts/ci/validate-ansible-mirror-parity.sh

      # The stop and start guards are the only part of the Ansible mirror path that touches a LIVE
      # mirror, and the cases they exist for are quiet ones: a failed `launchctl load` leaves the OLD
      # process running, and deregistering a unit can leave it running while a load starts a SECOND
      # mirror on the same topic. Driven against stub launchctl/ps, once per way they can be lied to.
      - name: Validate the mirror stop/start guards (stubbed launchctl scenarios)
        run: bash scripts/ci/mirror-stop-start-guard-test.sh

      # The comparison decides whether a LIVE mirror is reloaded, and both wrong answers cost: "in
      # sync" when a property changed leaves the old settings running, "would install" for a comment
      # opens a gap in fourteen healthy mirrors. It is also easy to break silently — an apostrophe
      # inside its awk program once made every unit read "unparseable".
      - name: Validate the mirror comparison guard
        run: bash scripts/ci/mirror-diff-guard-test.sh

      # What an ABSENT consumer group means is the difference between a first install and re-copying a
      # retention window into the target — and a SUCCESSFUL but empty listing is the correct answer on
      # a source with no groups, not a failure. Driven once per outcome against a stubbed CLI.
      - name: Validate the mirror consumer-group check
        run: bash scripts/ci/mirror-group-check-test.sh

      # The install replaces five files for a unit the stop phase has already brought DOWN, so a
      # failed move must restore the previous generation whole — which depends on `set -E`, without
      # which the ERR trap is not inherited by the function doing the moves and the mixed generation
      # the trap exists to undo is exactly what is left behind.
      - name: Validate the mirror install rollback
        run: bash scripts/ci/mirror-install-rollback-test.sh

      # A production reload from this playbook must enforce the Deployment Permission Rule itself,
      # with the same guard script and the DECLARED version hash Jenkins passes — a computed hash
      # would let a locally edited guard self-approve. Asserted statically and behaviourally.
      - name: Validate the Ansible production permission path
        run: |
          python3 -m pip install --quiet --disable-pip-version-check ansible-core
          bash scripts/ci/validate-ansible-prod-permission.sh

      # Catches a playbook that cannot even be loaded — a YAML or module-name error in ansible/ is
      # otherwise found only by the operator running it, mid-install — and then runs the playbook's
      # own identity logic: the parity gate reads the table and the templates and cannot see the Jinja
      # that composes a unit's group.id, label, directory and plist from them, which is the most
      # dangerous code in the file.
      - name: Ansible syntax check + unit identity (mirror playbook)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check ansible-core
          ansible-playbook --syntax-check ansible/es-mirrors.yml
          bash scripts/ci/validate-ansible-mirror-naming.sh

      # bash -n cannot see this: a backslash escape Groovy rejects inside a '''...''' sh block fails the
      # whole pipeline at COMPILE time ("unexpected char: '\\'"). #1027 merged one and broke every
      # action of the enumeration mirror job until the Jenkins linter was run by hand.
      - name: Validate Jenkinsfile Groovy escapes
        run: bash scripts/ci/validate-jenkinsfile-groovy-escapes.sh

      # `docker top C -o args` is refused by docker (no PID column); with stderr dropped the check reads
      # false on a healthy container. It failed the enumeration mirror's es4 install on a live MirrorMaker.
      - name: Validate docker top keeps the pid column
        run: bash scripts/ci/validate-docker-top-has-pid.sh

      # Deployment Permission Rule (options-edge rule.md): "Jenkins enforces the permitted commit, not
      # the assistant." A build queued for commit A can check out a newer B once main moves and publish
      # or roll B before anyone can react; cancelling afterwards undoes nothing. So every deploy job
      # takes PERMITTED_SHA and runs scripts/jenkins/permitted-sha-guard.sh BEFORE its first effect,
      # failing closed on a missing/short/mismatched value or a non-main checkout. This holds every
      # Jenkinsfile to that: the parameter, the guard stage, its POSITION (nothing that mutates before
      # it), no catchError around it, restart-from-stage disabled, downstream triggers bound or marked,
      # post{} mutations gated — and forces every Jenkinsfile to be classified in or out of scope.
      - name: Jenkins deploy jobs carry the permitted-commit guard before any effect
        run: bash scripts/ci/validate-jenkins-permitted-sha-guard.sh

      # ...and the scripts the guards call are EXECUTED: the guard through the shell cases of the rule's
      # acceptance contract (missing / empty / short / mismatched SHA, branch advanced between queue and
      # checkout, forbidden ref via GIT_BRANCH, BRANCH_NAME, their contradiction, or the selected --ref,
      # bare repository, nested checkout); the downstream compatibility check and the child image-lock
      # fetch against a local stand-in controller; the post{} recovery gate with a sentinel kubectl and
      # a stranded marker; the required-image binder with a stub registry. The validator runs against
      # one mutation per rule it enforces (rc == 0, an echoed flag name, an UNBOUND annotation, a git
      # pull after the guard, ...) and the committed apply-before-guard fixture. What this does NOT
      # cover: Jenkins itself — parameter registration, post execution, restart behaviour, controller
      # compilation. Those are owner activation steps (see the PR).
      - name: permitted-commit guard scripts refuse their unpermitted cases; validator refuses its mutations
        run: python3 -m unittest -v tests.test_jenkins_permitted_sha_guard

      # topics.env is only the DEPLOY-TIME half of "the archive is never compacted". The other half
      # is the boot-time stamp: processing-common KafkaTopics.ensureTopic() runs
      # incrementalAlterConfigs on every service start, so a topic the deploy just set to delete is
      # re-compacted by the next restart unless OPTIONS_EDGE_UNCOMPACTED_SERVED_TOPICS="true" is in
      # the environment the services actually read. Compaction kept coming back on prod for exactly
      # this reason — each repair fixed one writer. This asserts the rendered environment carries
      # the flag on prod and es4, and that it never leaks into dev (which must stay compacted).
      - name: Validate archive uncompaction flag reaches prod + es4 and not dev
        run: bash scripts/ci/validate-archive-uncompaction-env.sh

      # Uncompacted is only half of "the archive survives". The other half is RETENTION: the daily
      # capture is checkpoint-based and runs on a WEEKDAY cron (10 17 * * 1-5 ET), so a missed
      # FRIDAY run is not retried until MONDAY — 72 hours. Any nightly-archived topic whose
      # declared retention is shorter than that loses whole sessions with no error at capture time;
      # the archiver only reports the hole afterwards. oe-topics.env records this exact loss
      # happening before (delta-flow-by-strike, option-price-behavior-by-strike).
      - name: Validate nightly-archived topics outlive a missed archive run
        run: bash scripts/ci/validate-archived-topic-retention.sh

      # "checked 5 mirrored topic(s)" proves only that five names were found. This drives the
      # validator against crafted fixtures — one broken dimension each, plus the mutations that
      # make its own parsing return nothing — so a checker that quietly starts approving
      # everything fails here instead of going green.
      - name: Mirrored-topic contract validator mutation suite
        run: bash scripts/ci/validate-mirrored-topic-contracts-test.sh

      # topics.env agreeing with the mirror job is only half the contract: --create --if-not-exists
      # binds nothing on an EXISTING target, so the job's own preflight assertions are what stand
      # between a drifted topic and a mirror that runs against it. This drives those assertions —
      # extracted from the Jenkinsfile, never copied — against mocked brokers, including a
      # pre-existing pure-compact target sitting at compact,delete.
      - name: es-cvd-mirror source/target shape assertions
        run: bash scripts/ci/es-cvd-mirror-shape-test.sh

      # Same contract for the auction-desk mirror (es.futures.auction), whose job additionally
      # RECONCILES a pre-existing target's config before asserting it -- so the suite also proves
      # a wrong-partition target is refused untouched and an ineffective alter still fails.
      - name: es-auction-mirror source/target shape assertions
        run: bash scripts/ci/es-auction-mirror-shape-test.sh

      # es.futures.footprint.strike is exact-partition and reset-preserved in BOTH topic sets; a
      # partition drift plus the global KAFKA_RECREATE_MISMATCHED_TOPICS=true must stop apply-topics
      # before any delete/create (NEVER_RECREATE), for dev, production and TOPIC_SET=es4 — and a mutant
      # without the declaration must delete it, so the test is shown to be sensitive to it.
      - name: apply-topics never recreates the strike episode log
        run: bash scripts/kafka/apply-topics-strike-safety-test.sh

      # The six vol-premium Gate-1 topics (rollout step 3): four kept forever (RESET-PRESERVED, NEVER-RECREATE,
      # retention.bytes=-1), two rebuildable; the calendar ledger is a Postgres table, not a topic (2026-09-13).
      # Drives the real apply-topics.sh and cleanup-topics.sh over creation,
      # config reconcile, partition drift and every cleanup mode, for dev and production, and shows that a copy of
      # topics.env missing any one protecting membership fails. validate-services.sh also runs it (through
      # validate-durable-topic-preservation.sh); this step gives a failure its own name.
      - name: apply-topics / cleanup-topics keep the vol-premium ledgers
        run: bash scripts/kafka/apply-topics-vol-premium-safety-test.sh

      # apply-topics.sh's exit STATUS must tell "the list was reconciled except for these topics" from
      # "the run did not complete": exit 9 plus a SKIPPED_TOPIC_NAMES line versus any other non-zero.
      # scripts/ops/prod-clean-slate.sh acts on that difference, and on 2026-10-07 — when both were
      # exit 1 — one drifted topic left all twelve es4->prod mirrors paused.
      - name: apply-topics separates a skip from a failure
        run: bash scripts/kafka/apply-topics-skip-exit-test.sh

      # The sibling files apply-topics.sh sources must be copied by every test that runs it out of a
      # temp directory. Hard-coding that list is what made TWO such tests report findings about
      # topics.env the day apply-topics.sh gained resolve-prod-partition-overrides.sh (#1165): their
      # copies died at `source: No such file or directory` and the durable-topic gate went red on main.
      - name: apply-topics sibling files are derived, not hard-coded
        run: bash scripts/kafka/apply-topics-sibling-files-test.sh

      # What a partial recreate permits: mirrors start, prod does NOT come up. Every status combination
      # is driven through the real decision function, and each rule is mutated to show it is load-bearing.
      - name: the clean-slate recreate decision
        run: bash scripts/ops/clean-slate-decision-test.sh

      # And which mirrors may start: the per-agent half of that decision, including every way reading an
      # agent's --whitelist can fail, each of which must be a HOLD rather than a start.
      - name: mirror-topic-filter holds the right mirrors
        run: bash scripts/ops/mirror-topic-filter-test.sh

      # The gate in front of the production wipe: which mirrors are LOADED and producing into the broker
      # about to be wiped, asked of launchd rather than of the plist files — because a job stays loaded
      # when its plist is moved or edited, and a plist that fails to parse was silently skipped. Every
      # case where it must REFUSE rather than answer "nothing is loaded" is driven with a stubbed
      # launchctl, with mutations.
      - name: the loaded-mirror gate fails closed
        run: bash scripts/ops/loaded-mirror-agents-test.sh

      # The paused-mirror ledger's invariant: a row leaves the file ONLY when its agent is confirmed
      # loaded. Held agents, failed loads, a plist that is briefly absent, duplicate rows and a
      # scratch file that cannot be written all keep their rows — otherwise an agent stays down with
      # nothing recording that it is.
      - name: the paused-mirror ledger never loses a down agent
        run: bash scripts/ops/mirror-ledger-test.sh

      # The one lever that makes a declared partition count SMALLER on production, in front of two
      # scripts that must agree: apply-topics.sh accepting the live topic and verify-topics.sh not
      # then calling it "below the expected minimum". Every way it can go wrong is quiet — not
      # applying, applying to dev or es4, or surviving as a stale name — so each is a case.
      - name: Validate the prod-only partition overrides
        run: bash scripts/kafka/prod-partition-overrides-test.sh

      # The vol-premium event calendar the deployment PINS (VOL_PREMIUM_CALENDAR_VERSION / _CONTENT_HASH in
      # k8s/base/vol-premium-deployment.yaml) and the file the publish job writes to the Postgres ledger
      # (scripts/vol-premium/calendars/calendar-2026.1.json) must be one artefact: the engine halts at boot when
      # the ledger row's content hash differs from the pin. This recomputes the contract's canonical content hash
      # from the file (a stdlib port of CanonicalBytes for the calendar record shape, held to the declared hash),
      # checks the file against the CalendarArtifact rules the engine applies on load, and asserts the manifests
      # pin exactly that version and hash.
      - name: vol-premium calendar artefact matches its pins (canonical content hash recomputed)
        run: bash scripts/ci/validate-vol-premium-calendar.sh

      # The validator's load path is a PORT of the contract (Jackson + CalendarArtifact + CanonicalBytes), not the
      # contract. scripts/ci/fixtures/vol-premium-calendar/expected.tsv is generated from the real contract classes
      # over the vector files (positive, Jackson-leniency and negative); the port must give every vector the same
      # verdict and the same hash, or it is not describing what the engine will do with a file.
      - name: vol-premium calendar validator agrees with the contract on every vector
        run: bash scripts/ci/validate-vol-premium-calendar.sh --vectors

      # ...and the vectors can FAIL it: each contract rule removed from a copy of the port (entry cap, NFC, duplicate
      # keys, Java trim, wire cap) must turn --vectors red, caught by the vector that exists for it.
      - name: vol-premium calendar validator mutation suite
        run: bash scripts/ci/validate-vol-premium-calendar-mutation-test.sh

      # The publish job's permitted-commit guard, EXTRACTED from the Jenkinsfile and driven against throwaway git
      # repositories: exact SHA, main-only (including refs that merely END in /main), empty/short/uppercase/branch
      # values refused, HEAD ahead of or behind the permitted commit refused.
      - name: vol-premium ledger publish guard refuses every forbidden ref and SHA
        run: bash scripts/ci/vol-premium-ledger-publish-guard-test.sh

      # The 0DTE Stage-B provisioning files (deploy/zerodte/): the declaration passes the Job's own rules; the VIRGIN attestation is
      # hash-chained and APPEND-ONLY against the merge target (design §5.1 "attestation-append-only"); the validators refuse every
      # violation they claim to (fixtures), and the port of the chain hash agrees with the Java implementation on golden vectors.
      - name: zerodte provisioning declarations pass the Job's rules
        run: bash scripts/ci/validate-zerodte-provisioning.sh
      - name: zerodte VIRGIN attestation is chained and append-only (the base is fetched EXPLICITLY — a missing base is a refusal)
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref || 'main' }}"
          bash scripts/ci/validate-zerodte-attestation.sh --base "origin/${{ github.base_ref || 'main' }}"
      - name: zerodte YAML subset — the CI port and the Job's loader agree on the shared corpus
        run: python3 scripts/ci/zerodte_attestation.py --corpus
      - name: zerodte attestation/provisioning validators refuse every violation
        run: bash scripts/ci/validate-zerodte-attestation-test.sh
      - name: secrets-sync never degrades the 0DTE ledger key (the stage's exact shell block against a fake kubectl)
        run: bash scripts/ci/secrets-sync-ledger-key-test.sh
      - name: zerodte corpus peer gate refuses every drift (the gate itself runs in the provisioning pipeline, where the peer is reachable)
        run: bash scripts/ci/validate-zerodte-corpus-peer-test.sh
      - name: zerodte provision guard refuses every forbidden ref and SHA
        run: bash scripts/ci/zerodte-provision-guard-test.sh
      # The wrapper's receipt contract, driven against a fake kubectl through every outcome the provisioner can print.
      - name: zerodte provision wrapper holds the receipt to the letter
        run: bash scripts/ci/zerodte-provision-receipt-test.sh
      - name: zerodte research-migration declarations pass the Job's rules
        run: bash scripts/ci/validate-zerodte-research-migration.sh
      - name: zerodte research-migrate guard refuses every forbidden ref and SHA
        run: bash scripts/ci/zerodte-research-migrate-guard-test.sh
      - name: zerodte research-migrate wrapper holds the receipt to its canonical grammar and proves the legacy writers' quiescence from a closed world
        run: bash scripts/ci/zerodte-research-migrate-receipt-test.sh
      - name: zerodte research-migrate barrier is held mutual exclusion (the real service deploy against a bounded fake)
        run: bash scripts/ci/zerodte-migrate-barrier-test.sh
      - name: zerodte compatibility render — every overlay sets the legacy writer OFF as a literal
        run: bash scripts/ci/zerodte-compat-flag-test.sh
      - name: zerodte writer-activate guard refuses every forbidden ref and SHA
        run: bash scripts/ci/zerodte-writer-activate-guard-test.sh
      - name: zerodte writer-activate wrapper holds the WRITER_CHECK receipt to its grammar, binds it to the committed receipt and gates the one replica
        run: bash scripts/ci/zerodte-writer-activate-receipt-test.sh

      # es4's clean-reset deletes the whole Kafka data dir; it must refuse while the strike archive
      # marker is short of the log end (fail closed on unreadable state, explicit opt-out only).
      - name: es4 clean-reset strike archive interlock
        run: bash scripts/es4/strike-archive-interlock-test.sh

      - name: Validate image-pinning completeness (every rendered image wired into resolve-images + apply)
        run: scripts/ci/validate-image-pinning.sh

      # DBP-R4 drift gate. The 2026-07-24 Databento incident was caused by a feed deployment that
      # mounted only its API-key Secret and therefore inherited library code defaults
      # (DATABENTO_USE_LIVE_REPLAY=true, DATABENTO_PUBLISH_INTERVAL_MS=250). This resolves the FULL
      # rendered environment (env over envFrom, as Kubernetes does) and fails on any mandatory key
      # that is left to a default.
      - name: Validate feed configuration is fully explicit (no inherited library defaults)
        run: bash scripts/ci/validate-feed-config-explicit.sh

      # U16 (CL-R10 L4/O3): promtool check + unit tests over the CVD SPX levels paging rules.
      # The script downloads a sha256-pinned promtool when none is on PATH, so it is mandatory
      # here on the GitHub-hosted runner, not just runnable where prometheus is installed.
      - name: Validate CVD SPX levels alert rules (promtool check + test)
        run: bash scripts/ci/validate-cvd-levels-alerts.sh

      - name: Validate deploy image locks
        run: scripts/deploy/validate-image-lock-ci.sh
