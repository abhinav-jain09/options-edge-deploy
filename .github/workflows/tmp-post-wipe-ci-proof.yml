name: TMP post-wipe test CI proof (remove before merge)
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-post-wipe-ci-proof.yml'
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: runner coreutils and tools
        run: |
          sort --version | head -1
          paste --version | head -1
          grep --version | head -1
          bash --version | head -1
          git --version
          python3 --version
      - name: the new dev-cleanup post-wipe test, on the runner
        run: bash scripts/ops/dev-cleanup-post-wipe-test.sh
