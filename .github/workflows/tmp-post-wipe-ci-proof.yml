name: TMP post-wipe test CI proof (remove before merge)
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-post-wipe-ci-proof.yml'
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: runner coreutils and tools
        run: |
          sort --version | head -1
          paste --version | head -1
          grep --version | head -1
          bash --version | head -1
          git --version
          python3 --version
      - name: the new dev-cleanup post-wipe test, on the runner
        run: bash scripts/ops/dev-cleanup-post-wipe-test.sh
      - name: TRACE section 3 on the runner
        if: always()
        run: |
          POST_WIPE_NO_MUTANTS=1 bash -x scripts/ops/dev-cleanup-post-wipe-test.sh 2>&1 | sed -n '/== 3\./,/== 4\./p' | grep -nE 'fake-kt|kafka_list_topics|--list|tries|sleep|FAKE_DIR|existing=|ERROR' | head -60 | cut -c1-260
