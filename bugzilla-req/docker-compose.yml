# Requirement-intake portal stack (REQ-5a, REQ-4, REQ-9, REQ-10b).
#
# A SECOND, DEDICATED Bugzilla with its own empty database. It shares nothing with the internal
# instance (compose project `bugzilla`, host port 8092) — no volume, no database, no account table.
# That is what makes the historical-data isolation structural rather than ACL-dependent, and it is
# why REQ-6 can require the internal stack to be a strict no-op.
#
# Deployed by Jenkins (Jenkinsfile.bugzilla-req) to /home/options-edge/deploy/bugzilla-req/ on .252;
# both images are referenced BY DIGEST, substituted from the build. Never `docker compose up` this
# by hand on the host — that would be a non-Jenkins deployment.
name: bugzilla-req

services:
  bugzilla-req-web:
    image: ${BUGZILLA_REQ_WEB_IMAGE:?BUGZILLA_REQ_WEB_IMAGE must be a digest-pinned reference}
    container_name: options-edge-bugzilla-req-web
    # Two loopback host bindings onto the container's two real Apache listeners (REQ-5a):
    #   8093 -> :80 public, OIDC-protected, the ONLY port any cloudflared ingress may reference
    #   8095 -> :81 admin, native login, reachable only through an `ssh -L` tunnel
    # Loopback binding means neither port is reachable from the LAN — proven by `ss -ltn` in V-lan,
    # not inferred. 8094 is deliberately NOT used: the tunnel already routes fullfunding.nl there.
    ports:
      - "127.0.0.1:8093:80"
      - "127.0.0.1:8095:81"
    environment:
      # Non-secret settings only. Every credential arrives through the file mount below (REQ-9), so
      # `docker inspect` on this container exposes nothing sensitive.
      BZ_DB_HOST: bugzilla-req-db
      BZ_DB_PORT: "3306"
      BZ_DB_NAME: bugzilla_req
      BZ_DB_USER: bugzilla_req
      BZ_URLBASE: https://req.fullfunding.nl/
      BZ_ADMIN_EMAIL: ${BZ_ADMIN_EMAIL:-abhinav@fullfunding.nl}
      BZ_ADMIN_REALNAME: ${BZ_ADMIN_REALNAME:-Abhinav Jain}
      PORTAL_SECRET_FILE: /run/secrets/bugzilla-req.env
    volumes:
      - /home/options-edge/data/bugzilla-req/data:/var/www/html/data:Z
      # 0600 on the host, mounted read-only. The entrypoint renders it into a root-0400 Apache
      # fragment and never echoes a value.
      - /home/options-edge/config/bugzilla-req.env:/run/secrets/bugzilla-req.env:ro
    tmpfs:
      - /tmp
      - /run/lock
    healthcheck:
      # Liveness only — Apache is up and its configuration parses. Readiness (Bugzilla bootstrapped
      # + DB reachable) is a separate post-deploy gate in the Jenkins job, because an HTTP probe
      # that accepts the public listener's OIDC redirect would prove mod_auth_openidc answered, not
      # that Bugzilla works (REQ-10b).
      test: ["CMD-SHELL", "apachectl -t && nc -z 127.0.0.1 81"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      bugzilla-req-db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      # Bounded retention: portal logs are covered data (REQ-13), and an unbounded json-file log on
      # the shared prod host is also a disk risk (R-12).
      driver: json-file
      options: {max-size: "50m", max-file: "3"}

  bugzilla-req-db:
    image: ${BUGZILLA_REQ_DB_IMAGE:?BUGZILLA_REQ_DB_IMAGE must be a digest-pinned reference}
    container_name: options-edge-bugzilla-req-db
    # No host port: the database is reachable only from the web container on the compose network.
    environment:
      MARIADB_DATABASE: bugzilla_req
      MARIADB_USER: bugzilla_req
    env_file:
      # A SEPARATE, narrower secret file holding only what the mariadb bootstrap contract needs.
      # Deliberately not the web container's file: env_file values land in this container's
      # environment (visible to `docker inspect`), and the OIDC client secret must never go there —
      # its only authorized locations are the 0600 host file, the web container's read-only mount,
      # and the rendered root-0400 Apache fragment (REQ-9). Keeping the files split is what makes
      # that allowlist true rather than aspirational.
      - /home/options-edge/config/bugzilla-req-db.env
    volumes:
      - /home/options-edge/data/bugzilla-req/mysql:/var/lib/mysql:Z
    tmpfs:
      - /tmp
      - /var/lock
    healthcheck:
      # Application-level, not just `mysqladmin ping`: a real authenticated query, so a server that
      # is listening but not yet accepting credentials does not read as healthy (REQ-10b). The
      # schema/app-user readiness check runs later, in the Jenkins post-deploy gate, because the
      # database and its user are created by the web container's checksetup on first boot.
      test: ["CMD-SHELL", "mysql -uroot -p\"$$MARIADB_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
