# PUBLIC listener (:80 in-container) — REQ-5a.
#
# How :80 is exposed is the deployment's concern and is superseded by fullfunding-namespace-gate1.md
# §4 (ClusterIP + platform-owned Ingress). The SECURITY contract below is unchanged by that move.
#
# This listener's ONLY vhost is OIDC-protected. There is deliberately no native-login vhost here, so
# no Host header value, absolute-form request target, duplicate Host header, HTTP/1.0 no-Host
# request or HTTP/2 authority variation can select a native-login vhost through this port. That is
# the structural property V3 tests.
PerlSwitches -w -T

<VirtualHost *:80>
    ServerName req.fullfunding.nl
    ServerAdmin webmaster@fullfunding.nl
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/portal-public-error.log
    CustomLog ${APACHE_LOG_DIR}/portal-public-access.log combined

    # --- identity-header trust boundary (REQ-5a / REQ-7) ---------------------------------------
    # Bugzilla's Env login reads PROCESS env vars by their exact param-configured names
    # (Bugzilla/Auth/Login/Env.pm:29-31 @ 276673ab6) and CGI maps request headers only to HTTP_*
    # names, so a client cannot forge them through the CGI mapping alone. These unsets are defence
    # in depth on top of that structural property, and are what V6b exercises. `early` runs the
    # unset before any authorization phase reads the request.
    RequestHeader unset X-Remote-User early
    RequestHeader unset Remote-User early
    RequestHeader unset X-Forwarded-User early
    RequestHeader unset REMOTE-USER early
    RequestHeader unset REMOTE_USER early
    RequestHeader unset OIDC-CLAIM-sub early
    RequestHeader unset OIDC-CLAIM-email early
    RequestHeader unset OIDC-CLAIM-name early
    RequestHeader unset OIDC_CLAIM_sub early
    RequestHeader unset OIDC_CLAIM_email early
    RequestHeader unset OIDC_CLAIM_name early
    RequestHeader unset Authorization early

    # --- OIDC (REQ-2 client, REQ-5a directives, REQ-5b session bounds) --------------------------
    OIDCProviderMetadataURL https://auth.fullfunding.nl/realms/req/.well-known/openid-configuration
    OIDCClientID bugzilla-web
    OIDCRedirectURI https://req.fullfunding.nl/oidc-callback
    OIDCScope "openid email profile"
    OIDCRemoteUserClaim email
    OIDCPKCEMethod S256

    # Claims reach Bugzilla as ENVIRONMENT variables only — never as headers, which is what keeps
    # the forged-header path closed. Tokens are not propagated to the application at all.
    OIDCPassClaimsAs environment
    OIDCPassAccessToken Off
    OIDCPassRefreshToken Off
    OIDCPassIDTokenAs claims
    # Restrict which claims reach the application at all. OIDCPassClaimsAs alone does NOT filter —
    # it only chooses the transport — so without this every claim in the token would be handed to
    # CGI. The deploy job verifies this directive is supported by the installed package before the
    # stack is ever exposed; if it is not, that is a launch blocker, not a silent downgrade.
    OIDCWhiteListedClaims sub email name

    # Sessions live in Apache's shared-memory cache, so restarting this container invalidates every
    # portal session. That restart — not any passphrase abstraction — is the offboarding control
    # (REQ-5b); the bounds below cap how long a session can outlive a Keycloak change without one.
    # Pinned explicitly, not inherited from the package default: the whole offboarding model
    # (disable user -> restart this container -> every session dies) is only true for server-side
    # sessions held in Apache's shared memory. A package or config change that silently moved
    # sessions into cookies would break that guarantee without any visible symptom.
    OIDCSessionType server-cache
    OIDCCacheType shm
    OIDCSessionCacheFallbackToCookie Off
    OIDCSessionInactivityTimeout 1800
    OIDCSessionMaxDuration 28800

    # Caps state-cookie creation at the initial unauthenticated redirect surface, which is the real
    # state-flood vector (a callback-only limit would miss it). Per-browser bound, NOT an
    # origin-wide rate limiter — REQ-11 layer 3 covers that at the edge.
    OIDCStateMaxNumberOfCookies 7 true

    # Secrets are rendered into a root-owned 0400 fragment at container start from file-mounted
    # values; they are never baked into this image, never in the container environment, and never in
    # healthcheck text (REQ-9).
    IncludeOptional /etc/apache2/conf-portal-secret/oidc-secret.conf

    <Location />
        AuthType openid-connect

        # This is the enforcement point for the email contract (REQ-5a), NOT OIDCRemoteUserClaim —
        # that directive only names the claim used for REMOTE_USER. `Require valid-user` alone would
        # admit a subject with no email, and Bugzilla's Env login would then return AUTH_NODATA
        # (Login/Env.pm:33) and fall through to CGI native login. This regex closes that fail-open
        # path: absent, empty and malformed email are denied inside Apache before Bugzilla runs.
        #
        # Known and accepted limit (V4d tests both shapes): the module can match a MEMBER of a claim
        # array. A multi-member array is fail-closed one layer down — the joined value fails
        # validate_email_syntax and returns a hard AUTH_ERROR auth_invalid_email with no account
        # created (Verify.pm:76-80). A singleton array flattens to the identical scalar identity and
        # is accepted on purpose; identity is keyed on sub/extern_id, not on the JSON container.
        Require claim "email~^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$"
    </Location>

    PerlSwitches -w -T
    PerlConfigRequire /var/www/html/mod_perl.pl
</VirtualHost>
