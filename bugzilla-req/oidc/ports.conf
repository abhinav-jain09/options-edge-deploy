# Two real Apache listeners (REQ-5a). The vhost split is structural, not ServerName-based:
#   80 -> public, OIDC-protected only. No native-login vhost is defined on this listener.
#   81 -> admin, native login only.
#
# Reachability is the DEPLOYMENT's job, not this file's, and it is the part
# fullfunding-namespace-gate1.md §4 supersedes: under the namespace model, :80 is reached through a
# ClusterIP Service and a platform-owned Ingress, while :81 is denied over the pod network by a
# port-specific, platform-owned NetworkPolicy the tenant cannot rewrite. What this file guarantees
# either way is that the two vhost sets can never be reached through the wrong port.
Listen 80
Listen 81
