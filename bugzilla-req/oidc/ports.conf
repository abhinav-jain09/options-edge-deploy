# Two real Apache listeners (REQ-5a). The vhost split is structural, not ServerName-based:
#   80 -> public, OIDC-protected only. No native-login vhost is defined on this listener.
#   81 -> admin, native login only. No tunnel ingress rule ever points at it.
# The compose file binds these to 127.0.0.1:8093 and 127.0.0.1:8095 respectively, loopback only.
Listen 80
Listen 81
