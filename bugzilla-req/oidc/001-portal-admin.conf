# ADMIN listener (:81 in-container, 127.0.0.1:8095 on the host) — REQ-5a, accepted risk R-7.
#
# Break-glass and initial setup only, reachable solely through an `ssh -L` tunnel to .252. No
# cloudflared ingress rule references this port (asserted by config inspection, not by port number
# alone), and the host binding is loopback, proven by `ss -ltn` in V-lan.
#
# No OIDC module scope applies here, so Bugzilla's Env login finds no claim env vars, returns
# AUTH_NODATA (Bugzilla/Auth/Login/Env.pm:33 @ 276673ab6) and falls through cleanly to native CGI
# login — which is exactly what break-glass access needs.
PerlSwitches -w -T

<VirtualHost *:81>
    ServerName bugzilla-req-admin.local
    ServerAdmin webmaster@fullfunding.nl
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/portal-admin-error.log
    CustomLog ${APACHE_LOG_DIR}/portal-admin-access.log combined

    # Identity headers are stripped here too. Without this, a request arriving on the admin listener
    # could try to smuggle Env-auth values and skip the native login form entirely.
    RequestHeader unset X-Remote-User early
    RequestHeader unset Remote-User early
    RequestHeader unset X-Forwarded-User early
    RequestHeader unset REMOTE-USER early
    RequestHeader unset REMOTE_USER early
    RequestHeader unset OIDC-CLAIM-sub early
    RequestHeader unset OIDC-CLAIM-email early
    RequestHeader unset OIDC-CLAIM-name early
    RequestHeader unset OIDC_CLAIM_sub early
    RequestHeader unset OIDC_CLAIM_email early
    RequestHeader unset OIDC_CLAIM_name early

    PerlSwitches -w -T
    PerlConfigRequire /var/www/html/mod_perl.pl
</VirtualHost>
