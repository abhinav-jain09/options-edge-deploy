# The ONE-SHOT external VIRGIN attestation (design §5.1; increment 7 Q5). APPEND-ONLY: scripts/ci/validate-zerodte-attestation.sh refuses
# a change that removes or alters an existing lineage or entry, or breaks the prevEntryHash chain. The provisioning Job VERIFIES this file;
# it never writes it. An entry is added only through a reviewed change, with the exact values the Job's ATTESTATION_REQUIRED receipt printed.
#
# A lineage is an ENVIRONMENT'S IDENTITY: a UUID minted once; a renamed environment keeps its id; a CLONE is a new lineage that names its
# parent and needs the owner's recorded approval. approvedBy is the OWNER's name, written by the owner — the rows below carry the marker
# UNAPPROVED until then, and BOTH readers (the Job's VirginAttestation and scripts/ci/zerodte_attestation.py) REFUSE a lineage that still
# carries it: nothing can be provisioned under these rows before the owner's edit (Codex 7b r1, D1). That edit is the owner's alone.
#
# ledgerTopicId, clusterId and prevEntryHash are QUOTED strings: YAML reads an all-digit scalar as a number.
