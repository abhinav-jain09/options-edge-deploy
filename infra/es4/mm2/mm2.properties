# MirrorMaker 2 — prod (.252) -> es4 (.4), exactly TWO market-input topics.
#
# WHY (Gate-2 rev 10): ES futures trades are subscribed from Databento exactly ONCE
# (by the existing prod feed). This mirror redistributes them internally to the es4
# cluster — the Databento-recommended middleware pattern; no tick is billed twice.
#
# Topic naming: the source-cluster alias is "es", so DefaultReplicationPolicy writes
# the target topic as "es.underlying.es.trades" — matching the TOPIC_PREFIX=es.
# default of every es4 consumer. Do NOT change the alias without changing every
# consumer's topic expectations.

clusters = es, es4
es.bootstrap.servers = 192.168.100.252:9092
es4.bootstrap.servers = kafka:29092

# one-way: prod -> es4 only
es->es4.enabled = true
es4->es.enabled = false

# The VIX reference required by the 0DTE volatility engine; everything else remains excluded.
#
# DBP-R32 (2026-07-26): underlying.es.trades REMOVED from this mirror. The ES-futures
# subscription moved to es4, so es4's own feed now produces es.underlying.es.trades natively —
# mirroring prod's copy here would be a second writer to that topic. The traffic now flows the
# OTHER way, es4 -> prod, over the renaming bridge (see the es-trades bridge job), because prod
# needs the name `underlying.es.trades` while es4 needs `es.underlying.es.trades` and MM2's
# replication policy cannot rename.
#
# Leaving BOTH directions live for the same logical topic is what produced the 2026-07-24
# es.es.es... runaway; keeping this mirror to VIX only means the reverse bridge cannot feed back.
es->es4.topics = underlying.vix.price
# NOTE: NO spaces after commas — MM2 splits on "," and does NOT trim, so " es[.].*"
# (leading space) never matches any topic and the exclude silently no-ops.
es->es4.topics.exclude = .*[.]internal,.*[.]replica,__.*,mm2.*,es[.].*,.*heartbeats.*,.*checkpoints.*

# JSON bytes through; single-partition-preserving defaults
replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
offset.storage.replication.factor = 1
status.storage.replication.factor = 1
config.storage.replication.factor = 1

refresh.topics.interval.seconds = 60
sync.topic.configs.enabled = false
sync.topic.acls.enabled = false
emit.checkpoints.enabled = false
emit.heartbeats.interval.seconds = 30

# we don't need consumer-group offset sync (no group migration)
sync.group.offsets.enabled = false

# keep ALL MM2 internal topics on the TARGET cluster — never create/write anything
# on production (strictly one-way, minimally invasive; Codex #9)
es->es4.offset-syncs.topic.location = target

tasks.max = 1

# 2026-07-24: disable heartbeat emission — the MirrorHeartbeatConnector was emitting heartbeats
# to the SOURCE (prod .252) which got recursively re-mirrored into es.es.es...heartbeats topics
# (78 garbage topics on both clusters). This 2-topic mirror does not need heartbeats.
emit.heartbeats.enabled = false
