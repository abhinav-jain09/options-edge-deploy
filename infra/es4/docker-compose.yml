# ES4 infra stack — the self-contained ES-0DTE box (192.168.100.4, "es4").
#
# Design (Gate-2 GATE-2-SERVICE-DESIGNS.md §0.2 + Codex decisions D1/D2/D5, 2026-07-12):
#   * app services run in single-node k3s ON this box; stateful infra runs OUTSIDE the
#     cluster in this compose stack so it survives k3s rebuilds (prod runs native Kafka
#     for the same reason — this is the container equivalent for a fresh box).
#   * Kafka advertises the LAN IP (192.168.100.4) — reachable from .252 (es-feed producer)
#     AND from in-cluster pods. Never localhost / compose-hostname-only (the
#     docker-desktop advertised-listener trap).
#   * 12h retention EVERYWHERE (org policy), 4 default partitions (org policy),
#     auto.create.topics.enable=true (org relies on broker auto-create for the long tail;
#     core topics are still created explicitly by scripts/es4/create-es-topics.sh).
#   * MM2 mirrors prod underlying.es.trades -> es.underlying.es.trades here (source-alias
#     "es" + DefaultReplicationPolicy = exactly the es. prefix the consumers expect).
#   * images pinned; volumes persist under /home/es4 (NVMe).
#
# Managed by: scripts/es4/bootstrap-es4.sh (rsync'd + run via the es4-deploy Jenkins job).
# Change path: PR -> Codex 3-bar review -> merge -> Jenkins es4-deploy INFRA_SYNC.

name: es4-infra

services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1@sha256:653f49c51cfebcf8301938d01044efead6afbd8dd60acd2bcf1605d7c6494d3b
    container_name: es4-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"          # EXTERNAL — advertised as 192.168.100.4:9092
      # controller (9093) stays on the compose network only — never published (Codex #8)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://192.168.100.4:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: lyHmDdAXgdfFEJPbLqf9ZQ   # 22-char base64url UUID (KRaft requirement); stable across re-runs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      # FALLBACK ONLY — not a policy knob. With KAFKA_AUTO_CREATE_TOPICS_ENABLE=false (below)
      # the broker never conjures a topic, and every declared topic is created by
      # apply-topics.sh, which always passes an explicit --partitions from topics.env. The one
      # remaining consumer of this default is Kafka Streams creating its OWN internal topics
      # (repartition/changelog) when a boot race leaves it unable to resolve its source topic's
      # partition count. At 4 it built 4-partition internals for 32-partition applications and
      # every one of them then died with:
      #   StreamsException: Existing internal topic ...-repartition has invalid partitions:
      #   expected: 32; actual: 4                                       (es4, 2026-07-31)
      # es4's topics are overwhelmingly 32 partitions (114 of 166), so 32 is the fallback that
      # is right when the race happens. Declared topics are unaffected either way.
      KAFKA_NUM_PARTITIONS: 32
      KAFKA_LOG_RETENTION_MS: 43200000             # 12h org retention policy
      KAFKA_LOG_SEGMENT_BYTES: 268435456           # 256MB segments (changelog-segment-I/O lesson: never 1GB)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # see topics.env — every topic is contract-created
      KAFKA_HEAP_OPTS: "-Xms2g -Xmx6g"             # ES-only load is light vs the SPX firehose
    volumes:
      - /home/es4/volumes/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1@sha256:e8c6de70b76f78d33238f5f972da17fc93e5b96b00d08ffed07d9f5f03fbc1ce
    container_name: es4-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xmx1g"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
    container_name: es4-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: options_edge_es
      POSTGRES_USER: options_edge_es
      # Password comes from /home/es4/infra/.env (created once by bootstrap, never committed).
      POSTGRES_PASSWORD: ${ES4_POSTGRES_PASSWORD:?set in /home/es4/infra/.env}
    volumes:
      - /home/es4/volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U options_edge_es -d options_edge_es"]
      interval: 15s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.1@sha256:bb142a9c18ac18a16713c1491d779697b4e107c22a97266616099d288237ef47
    container_name: es4-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - /home/es4/volumes/redis:/data
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 12

  # MirrorMaker 2 — ONE topic, prod -> es4. Source-cluster alias "es" makes
  # DefaultReplicationPolicy name the target topic "es.underlying.es.trades",
  # exactly what TOPIC_PREFIX=es. consumers expect. Bytes-through (JSON payloads;
  # the topic is HpsfJsonSerde JSON, no Schema Registry subjects involved).
  mm2:
    image: confluentinc/cp-kafka:7.7.1@sha256:653f49c51cfebcf8301938d01044efead6afbd8dd60acd2bcf1605d7c6494d3b
    container_name: es4-mm2
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    command: ["connect-mirror-maker", "/etc/mm2/mm2.properties"]
    volumes:
      - ./mm2/mm2.properties:/etc/mm2/mm2.properties:ro
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
