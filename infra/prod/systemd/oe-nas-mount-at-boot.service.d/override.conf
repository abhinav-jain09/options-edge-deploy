[Service]
# 2026-09-21: the NAS was off for a day. The unit retried 101 times over 50 minutes, gave up, and
# then stayed `failed` forever — so when the NAS came back nothing mounted it and the 17:10 archive
# had no share to write to. Keep retrying indefinitely instead: the whole point of this unit is to
# win whenever the NAS returns, which may be hours later.
Restart=on-failure
RestartSec=300
