events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }
  server {
    listen 8098;
    server_name _;
    location = /ws/events {
      proxy_pass http://host.docker.internal:8091/ws/events;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    # The UI treats its page path as a reverse-proxy prefix, so a page opened at
    # /<page> (/option-chain is the Keycloak redirect target, /es-seller-activity
    # a standalone page) calls /<page>/api/... and /<page>/ws/events. Strip the
    # single page segment so those reach the real /api/... and /ws/events.
    location ~ ^/[^/]+/ws/events$ {
      rewrite ^ /ws/events break;
      proxy_pass http://host.docker.internal:8091;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    # The journal's DATA is not a page-prefixed API, so it must NOT be stripped.
    #
    # The rule below reads the first segment of /<page>/api/... as a page prefix and removes it.
    # That is right for a page that treats its own path as a reverse-proxy prefix. The journal
    # page does not: it is served at /journal by the web app and asks that SAME app for
    # /journal/api/..., which is a real path with a real handler (a proxy on to the journal
    # service). Stripping turned it into /api/day-list, which no handler maps, so the web app's
    # fail-closed rule refused it with an empty 403 — a ROUTING fault wearing an authorization
    # fault's face, and the journal page showed "This journal belongs to one account" for days.
    #
    # Note which requests did NOT break: /journal/api on its own does not match the regex (it
    # needs a segment after api/), so it passed through untouched and answered correctly. The
    # failure was invisible from here and looked like a permissions problem from the page.
    #
    # ^~ is load-bearing. Nginx prefers a matching regex location over a plain prefix one, so a
    # plain `location /journal/api/` would lose to the rule below no matter the order. ^~ wins.
    # The bare prefix, routed explicitly so it is ANSWERED rather than redirected. A prefix
    # location written with a trailing slash and served by proxy_pass makes nginx reply 301 to
    # the slashed form for a request without it — and it builds that Location from the Host and
    # scheme it was reached on, which behind the tunnel came out as http://localhost:8098/... .
    # Nothing asks for the bare prefix and the app refuses it either way, but a redirect that
    # names the origin is not a thing to ship for the sake of a path that only ever 400s.
    location = /journal/api {
      proxy_pass http://host.docker.internal:8090;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }
    location ^~ /journal/api/ {
      proxy_pass http://host.docker.internal:8090;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      # A board screenshot is PUT through here; the default 1m would refuse it at 413.
      client_max_body_size 8m;
      proxy_read_timeout 30s;
    }
    location ~ ^/[^/]+/(api/.*)$ {
      proxy_pass http://host.docker.internal:8090/$1$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }
    location / {
      proxy_pass http://host.docker.internal:8090;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      sub_filter_once off;
      sub_filter_types text/html text/css application/javascript application/json;
      sub_filter 'ws://localhost:8091/ws/events' 'wss://dev.bleadingoptions.com/ws/events';
      sub_filter 'http://192.168.100.102:8089/' 'https://dev-auth.bleadingoptions.com/';
    }
  }
}
