events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }
  server {
    listen 8098;
    server_name _;
    location = /ws/events {
      proxy_pass http://host.docker.internal:8091/ws/events;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    # The UI treats its page path as a reverse-proxy prefix, so a page opened at
    # /<page> (/option-chain is the Keycloak redirect target, /es-seller-activity
    # a standalone page) calls /<page>/api/... and /<page>/ws/events. Strip the
    # single page segment so those reach the real /api/... and /ws/events.
    location ~ ^/[^/]+/ws/events$ {
      rewrite ^ /ws/events break;
      proxy_pass http://host.docker.internal:8091;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    location ~ ^/[^/]+/(api/.*)$ {
      proxy_pass http://host.docker.internal:8090/$1$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }
    location / {
      proxy_pass http://host.docker.internal:8090;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      sub_filter_once off;
      sub_filter_types text/html text/css application/javascript application/json;
      sub_filter 'ws://localhost:8091/ws/events' 'wss://dev.bleadingoptions.com/ws/events';
      sub_filter 'http://192.168.100.102:8089/' 'https://dev-auth.bleadingoptions.com/';
    }
  }
}
