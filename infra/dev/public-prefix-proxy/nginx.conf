events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }
  server {
    listen 8098;
    server_name _;
    location = /dev { return 308 /dev/; }
    location /dev/ {
      proxy_pass http://host.docker.internal:8090/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Prefix /dev;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      sub_filter_once off;
      sub_filter_types text/html text/css application/javascript application/json;
      sub_filter 'href="/' 'href="/dev/';
      sub_filter 'src="/' 'src="/dev/';
      sub_filter 'url(/' 'url(/dev/';
      sub_filter 'ws://localhost:8091/' 'wss://bleadingoptions.com/dev/ws/';
      sub_filter 'http://192.168.100.102:8089/' 'https://auth.bleadingoptions.com/';
    }
  }
}
