---
# Install EVERY es4 -> environment MirrorMaker-1 unit in one pass.
#
# Why this exists: the mirror Jenkins pipelines install ONE (target, topic) per build and each build
# spends ~5-20 minutes on kafka-topics/kafka-configs round trips, so bringing all 14 units onto a new
# producer contract is a 2-3 hour serial crawl. This playbook renders the same unit files and reloads
# the same launchd units for all of them.
#
# What it deliberately does NOT do: create, alter or delete a topic, and prove a payload end to end.
# Topic lifecycle and the payload proof stay in the pipelines, where the permitted-commit guard, the
# pollution baseline and the drain proof live. Here a topic whose shape does not already match the
# shape its own pipeline asserts — at the ends THAT pipeline asserts, which is both ends for the cvd
# and auction/tape-zones rows, the target only for indicator, and nothing at all for strike-intel
# (ansible/vars/es-mirrors.yml records each one) — is a FAILURE here, never something to fix in passing.
#
#   # plan only — renders every unit under ansible/.ansible-rendered/ and reports, per file,
#   # whether installing would change the live copy. It reads brokers and never writes a unit.
#   ansible-playbook -i ansible/inventory/oe-mirror-hosts.yml ansible/es-mirrors.yml
#   # dev
#   ansible-playbook -i ansible/inventory/oe-mirror-hosts.yml ansible/es-mirrors.yml -e confirm_mirror_install=true
#   # prod — needs the permitted commit, the same rule Jenkins enforces: this checkout must be on
#   # origin/main and HEAD must be exactly that commit
#   ansible-playbook -i ansible/inventory/oe-mirror-hosts.yml ansible/es-mirrors.yml \
#       -e mirror_target_ip=192.168.100.252 -e mirror_target_port=9092 \
#       -e confirm_mirror_install=true -e permitted_sha=$(git rev-parse origin/main)
#   # one topic
#   ansible-playbook -i ansible/inventory/oe-mirror-hosts.yml ansible/es-mirrors.yml -e only_topics=es.futures.footprint.bars -e confirm_mirror_install=true
#   # the dealer-ledger leg, which runs ON .74
#   ansible-playbook -i ansible/inventory/oe-mirror-hosts.yml ansible/es-mirrors.yml -e mirror_run_host=mac74 \
#       -e mirror_target_ip=192.168.100.252 -e mirror_target_port=9092
#
# WHERE THE PRODUCTION LOCK ACTUALLY IS. In Ansible an extra var outranks every var, fact and
# register, so a play-level condition is advisory: `-e oe_prod_permitted=true` defeated the first
# version of this. The binding lock therefore lives in ansible/templates/mirror-stop.sh.j2 — the
# first thing that touches a unit — which, for the production target, re-runs the repository's own
# permitted-commit guard before stopping or writing anything. That cannot be waved through from the
# command line: the guard passes only when THIS checkout is on origin/main with HEAD exactly the
# permitted commit, and a forged PERMITTED_SHA is compared against the real HEAD and the real
# origin/main. The checks in this play remain, in front of it, so a refusal is reported once and
# early rather than once per unit.
#
# A unit is reloaded ONLY when something that matters differs: an EFFECTIVE property of
# consumer/producer.properties (compared key-and-value with comments and key order ignored — not the
# full java.util.Properties grammar; see ansible/templates/mirror-diff.sh.j2, which falls back to a
# byte comparison wherever that parse would be unfaithful — so a comment is not a reason to open a gap
# in a live mirror), the bytes of log4j.properties/run-mirror.sh/the plist, that the runner is still
# executable, an absent file, an absent process, or a process OLDER than any of those files — MirrorMaker reads its
# config once, at startup, so a rewritten file under an older process still runs the old settings.
# ⚠ THIS PLAY EXISTS BECAUSE A BAD mirror_run_host IS OTHERWISE SILENT (Codex r2 on #1166, P0).
# `hosts:` below is a variable, and Ansible treats a pattern matching no host as "skipping: no hosts
# matched" with an EMPTY recap and exit 0 — so `-e mirror_run_host=mac47` reported success having
# installed nothing, and the row validation inside that play never ran because the play never ran.
# A typo is indistinguishable from a completed run, which is the worst possible failure for a tool
# whose whole job is making mirror state visible.
#
# So the requested host is validated HERE, on localhost, which always matches. hostvars is the oracle
# rather than groups['all']: Ansible's IMPLICIT localhost is not a member of any inventory group, so
# groups['all'] rejected a perfectly good default invocation (Codex r2, P1) while hostvars contains
# every host Ansible knows about, implicit or not.
- name: Validate the requested run host before any host selection
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # ⚠ hostvars AND groups['all'] are BOTH empty on an inventory-less run — measured: hostvars=[],
    # groups={'all': [], 'ungrouped': []} — because Ansible's implicit localhost is a member of
    # neither. Codex r2 flagged groups['all'] for this; my first fix swapped in hostvars, which has
    # the identical hole and rejected the default `mirror_run_host=localhost` outright. The oracle is
    # therefore the union with localhost, which is always a legal run host.
    oe_known_hosts: "{{ (hostvars.keys() | list) | union(['localhost']) }}"
  tasks:
    - name: Refuse a mirror_run_host that is not a host Ansible knows
      ansible.builtin.assert:
        that:
          - (mirror_run_host | default('localhost')) in oe_known_hosts
        fail_msg: >-
          mirror_run_host={{ mirror_run_host | default('localhost') }} is not a host in this
          inventory. Known: {{ oe_known_hosts }}. A pattern matching no host makes Ansible
          skip the play and exit 0, so this would have reported success while installing nothing.
          Pass -i ansible/inventory/oe-mirror-hosts.yml, or fix the name.

- name: Install the es4 -> environment MirrorMaker-1 units
  # ⚠ hosts is the RUN HOST, not always localhost (Codex on #1166, P0). Until this was a variable the
  # play was `hosts: localhost, connection: local` and `mirror_run_host` only SELECTED rows while
  # Ansible still executed here — so a row declaring run_host: mac74 could never be installed on .74
  # and the "installs only from a play running ON its run_host" claim was false. The connection comes
  # from the inventory now (localhost carries ansible_connection: local) rather than being pinned
  # here, which is what let the play claim a remote target it could not reach.
  hosts: "{{ mirror_run_host | default('localhost') }}"
  gather_facts: false

  vars_files:
    - vars/es-mirrors.yml

  vars:
    oe_source_ip: "{{ mirror_source_ip | default('192.168.100.4') }}"
    oe_source_port: "{{ mirror_source_port | default('9092') }}"
    oe_target_ip: "{{ mirror_target_ip | default('127.0.0.1') }}"
    oe_target_port: "{{ mirror_target_port | default('19092') }}"
    # lookup('env','HOME') reads the CONTROLLER's environment even when the play targets another
    # machine, so every unit path would have been written with /Users/abhinav on a host whose home is
    # /Users/rajuljain. The inventory carries oe_home per host; the lookup remains the fallback, which
    # is correct for localhost and is what every existing es4 row still resolves through.
    oe_home: "{{ hostvars[inventory_hostname].oe_home | default(lookup('env', 'HOME')) }}"
    oe_kbin: "{{ kafka_bin | default(hostvars[inventory_hostname].oe_kafka_bin | default('/Users/abhinav/development/confluent-7.3.1/bin')) }}"
    oe_ops: "{{ ops_dir | default(oe_home ~ '/oe-ops') }}"
    oe_agents: "{{ launch_agents_dir | default(oe_home ~ '/Library/LaunchAgents') }}"
    oe_confirm: "{{ confirm_mirror_install | default(false) | bool }}"
    oe_allow_new_group: "{{ allow_new_consumer_group | default(false) | bool }}"
    oe_only: "{{ (only_topics | default('')) | trim }}"
    # For MESSAGES only. Never a decision and never a row's field: it is derived, so `-e
    # oe_target=127.0.0.1:19092` would have skipped the production guard while every unit path and
    # group id — which come from oe_target_ip/oe_target_port — stayed production. Decisions and rows
    # read those two inputs directly, so overriding them changes the target CONSISTENTLY.
    oe_source: "{{ oe_source_ip }}:{{ oe_source_port }}"
    oe_target: "{{ oe_target_ip }}:{{ oe_target_port }}"
    # Named for messages ONLY. Every DECISION below compares against the literal, because an Ansible
    # extra var (-e) outranks every var, fact and register in the play: with the decision taken
    # through these names, `-e oe_prod_target=127.0.0.1:19092` would make the real production broker
    # pass the allow-list, skip the permitted-commit guard and set the permission true.
    oe_run_host: "{{ mirror_run_host | default('localhost') }}"
    # Same union as the validation play above, and for the same measured reason: the implicit
    # localhost is in neither hostvars nor groups['all'].
    oe_known_hosts: "{{ (hostvars.keys() | list) | union(['localhost']) }}"
    oe_prod_target: "192.168.100.252:9092"
    oe_dev_target: "127.0.0.1:19092"
    # On the controller this stays exactly where it was. On a REMOTE run host it cannot: the modules
    # create this directory on the TARGET, and playbook_dir is the controller checkout's absolute
    # path, which does not exist there (Codex r2 on #1166, P1). The live unit paths already derive
    # from oe_home; this one did not.
    oe_rendered_dir: >-
      {{ (playbook_dir ~ '/.ansible-rendered/es-mirrors') if inventory_hostname == 'localhost'
         else (oe_home ~ '/.ansible-rendered/es-mirrors') }}
    # -e dump_rows=<path> writes the rows this run WOULD act on and stops before touching a broker.
    # It exists so scripts/ci/validate-ansible-mirror-naming.sh can test the group.id and unit-name
    # generation in this file — the parity gate reads the table and the templates, and could not see
    # a change to the Jinja that composes them.
    oe_dump: "{{ dump_rows | default('') }}"
    # Deployment Permission Rule (options-edge rule.md): a PRODUCTION effect runs only under a commit
    # Abhinav permitted, on main, proven inside the checkout the effect comes from. Jenkins enforces
    # it per job; this playbook can reload a production unit from a laptop, so it enforces the same
    # rule with the SAME script Jenkins runs — no local re-implementation to drift from it.
    oe_permitted_sha: "{{ permitted_sha | default('') }}"
    # The guard's version hash is NOT a variable: it is written out literally wherever the guard is
    # invoked (here and in ansible/templates/mirror-stop.sh.j2), because an extra var would let
    # `-e oe_guard_version=<hash of an edited guard>` self-approve a modified guard.
    # scripts/ci/validate-ansible-prod-permission.sh asserts both literals against the Jenkinsfiles.

  tasks:
    - name: Validate the broker pair, fail-closed
      # The target is an ALLOW-LIST, not a free string: these units are per (target, topic) and a
      # typo'd broker would install a unit nothing reads, under a group nothing commits.
      ansible.builtin.assert:
        that:
          - oe_source_ip == '192.168.100.4'
          - oe_source_port == '9092'
          - (oe_target_ip ~ ':' ~ oe_target_port) in ['127.0.0.1:19092', '192.168.100.252:9092']
        fail_msg: >-
          source must be es4 (192.168.100.4:9092) and target must be dev ({{ oe_dev_target }})
          or prod ({{ oe_prod_target }}); got source={{ oe_source }} target={{ oe_target }}.

    - name: Refuse a run_host that is not a host in the inventory
      # The other half of the P0 above. `run_host` was a free label: a row saying `mac47` deferred
      # forever under a SUCCESSFUL plan, so a typo looked like a deliberate deferral and the unit was
      # never installed by anything. Checking it against the inventory turns that into a build
      # failure naming the row. Note this also means a row for a host the caller did not supply an
      # inventory for fails loudly rather than deferring into silence — which is the point.
      # hostvars, not groups['all']: the implicit localhost belongs to no group, so groups['all']
      # rejected the documented inventory-less invocation outright (Codex r2 on #1166, P1).
      ansible.builtin.assert:
        that:
          - (mirror_units | map(attribute='run_host') | map('default', 'localhost') | unique | reject('in', oe_known_hosts) | list) | length == 0
        fail_msg: >-
          ansible/vars/es-mirrors.yml declares run_host value(s) that are not hosts in this
          inventory: {{ mirror_units | map(attribute='run_host') | map('default', 'localhost')
          | unique | reject('in', oe_known_hosts) | list }}. Known hosts: {{ oe_known_hosts }}.
          A run_host that resolves to nothing is never installed by any play and reports as a
          deferral, so a typo is indistinguishable from a decision. Pass
          -i ansible/inventory/oe-mirror-hosts.yml, or fix the row.

    - name: Refuse a path that could carry shell
      # ops_dir, launch_agents_dir and kafka_bin are operator-supplied, and they are written into
      # run-mirror.sh — the script launchd EXECUTES — where they cannot be quoted without breaking the
      # byte-identity with the pipelines' own generated runner that the parity gate asserts. So a
      # hostile value is REFUSED here rather than neutralised in six places: a path outside this
      # character set is rejected before anything is rendered, let alone run.
      ansible.builtin.assert:
        that:
          - oe_ops is match('^[A-Za-z0-9._/-]+$')
          - oe_agents is match('^[A-Za-z0-9._/-]+$')
          - oe_kbin is match('^[A-Za-z0-9._/-]+$')
          - oe_rendered_dir is match('^[A-Za-z0-9._/-]+$')
        fail_msg: >-
          ops_dir, launch_agents_dir, kafka_bin and the render directory must be plain paths
          ([A-Za-z0-9._/-]); got ops_dir={{ oe_ops }} launch_agents_dir={{ oe_agents }}
          kafka_bin={{ oe_kbin }} rendered={{ oe_rendered_dir }}.

    - name: Enforce the permitted commit before any PRODUCTION effect
      # The guard refuses: a checkout that is not on origin/main, a missing/short/malformed
      # PERMITTED_SHA (nothing is substituted for it), and a HEAD that is not exactly that commit.
      # Only a production INSTALL goes through it — a plan reads brokers and writes nothing, and dev
      # is not production.
      when: oe_confirm and (oe_target_ip == '192.168.100.252') and (oe_target_port == '9092')
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          cd "{{ playbook_dir }}/.."
          PERMITTED_SHA="${OE_PERMITTED_SHA:-}" \
          PERMITTED_SHA_GUARD_VERSION="2f6fc2ab7aa51eb8a9e8aa350f2d774cd2fb7a253de2591e43645a19a9886b24" \
          bash scripts/jenkins/permitted-sha-guard.sh
        executable: /bin/bash
      environment:
        # in the environment, not interpolated into the command text: an extra var is operator data,
        # and `-e permitted_sha='...; function bash(){ return 0; }; ...'` would otherwise run
        OE_PERMITTED_SHA: "{{ oe_permitted_sha }}"
      register: oe_guard
      changed_when: false
      failed_when: oe_guard.rc != 0

    - name: Production permission, as a fact every mutating task re-checks
      # Defence in depth, and not hypothetical: while testing this very gate I made the task above
      # non-fatal as a mutation, and the run went on to install and START three production units.
      # One fatal assertion was the only thing standing between a refusal and a production change, so
      # now every task that stops, writes or starts a unit re-checks this fact as well.
      ansible.builtin.set_fact:
        oe_prod_permitted: "{{ ((oe_target_ip ~ ':' ~ oe_target_port) != '192.168.100.252:9092') or ((oe_guard.rc | default(1)) == 0) }}"

    - name: Check the Kafka CLI is where this playbook expects it
      # Not in dump mode: that path stops before any broker or unit access, and the identity gate runs
      # it on a CI runner that has no confluent install.
      when: oe_dump | length == 0
      ansible.builtin.stat:
        path: "{{ oe_kbin }}/kafka-mirror-maker"
      register: oe_mm_bin

    - name: Refuse without the CLI the units exec
      when: oe_dump | length == 0
      ansible.builtin.assert:
        that: [oe_mm_bin.stat.exists]
        fail_msg: "{{ oe_kbin }}/kafka-mirror-maker not found — pass -e kafka_bin=<confluent>/bin."

    - name: Flatten the unit table into one row per launchd unit
      ansible.builtin.set_fact:
        oe_units: "{{ (oe_units | default([])) + [row] }}"
      loop: "{{ mirror_units | subelements('topics') }}"
      loop_control:
        label: "{{ item.0.pipeline }}/{{ item.1.name }}"
      vars:
        slug: >-
          {{ ((item.0.target_ip | default(oe_target_ip)) ~ '-' ~ (item.0.target_port | default(oe_target_port)) ~ (('-' ~ item.1.name) if item.0.slug_with_topic else ''))
             | regex_replace('[^A-Za-z0-9-]', '-') }}
        row:
          pipeline: "{{ item.0.pipeline }}"
          topic: "{{ item.1.name }}"
          # the group.id the pipeline writes, from the RAW ip/port/topic (dots kept) — never the slug
          # The ROW's target, not the global one (Codex on #1166, P1). This expression read
          # oe_target_ip/oe_target_port, so dl-mirror rendered a producer for .252 while its group id
          # said 127.0.0.1-19092 — and the group id is where the committed offsets live, so a wrong
          # one is a NEW consumer group and an offset reset, not a cosmetic mismatch. Every es4 row is
          # unchanged: its target_ip/target_port default to exactly these globals.
          group_id: >-
            {{ item.0.pipeline ~ '-' ~ (item.0.group_parts
               | map('extract', {'ip': (item.0.target_ip | default(oe_target_ip)),
                                 'port': (item.0.target_port | default(oe_target_port)),
                                 'topic': item.1.name})
               | join('-')) }}
          offset_reset: "{{ item.0.offset_reset }}"
          commit_interval: "{{ item.0.commit_interval_ms | default('') }}"
          isolation_level: "{{ item.0.isolation_level }}"
          assert_source: "{{ item.1.assert.source | default({}) }}"
          assert_target: "{{ item.1.assert.target | default({}) }}"
          prod_only: "{{ item.1.prod_only | default(false) | bool }}"
          mdir: "{{ oe_ops }}/{{ item.0.pipeline }}-{{ slug }}"
          label: "com.optionsedge.{{ item.0.pipeline }}-{{ slug }}"
          plist: "{{ oe_agents }}/com.optionsedge.{{ item.0.pipeline }}-{{ slug }}.plist"
          # Per-row source/target, DEFAULTING to the globals so every es4 row renders exactly as it
          # did before this field existed. Only a row that declares its own (the dealer-ledger
          # offload leg, whose source is .74 and target is prod) differs.
          source: "{{ item.0.source_ip | default(oe_source_ip) }}:{{ item.0.source_port | default(oe_source_port) }}"
          target: "{{ item.0.target_ip | default(oe_target_ip) }}:{{ item.0.target_port | default(oe_target_port) }}"
          run_host: "{{ item.0.run_host | default('localhost') }}"

    - name: Select the units this run covers
      ansible.builtin.set_fact:
        oe_selected: >-
          {{ oe_units
             | selectattr('topic', 'in', (oe_only | split(',') | map('trim') | select | list))
             | list
             if (oe_only | length > 0) else oe_units }}

    - name: Refuse an only_topics value that matches nothing
      ansible.builtin.assert:
        that: [oe_selected | length > 0]
        fail_msg: "only_topics={{ oe_only }} selected no unit — see ansible/vars/es-mirrors.yml for the topics."

    - name: Hold back the production-only units when the target is not production
      # es.futures.cvd.levels is PRODUCTION-ONLY (ES-CVD-SPX-LEVELS-DESIGN.md CL-R6 L1/M1): the dev
      # resource must stay ABSENT. Skipped here, not failed, so a dev run of the whole table works.
      ansible.builtin.set_fact:
        oe_held: "{{ oe_selected | selectattr('prod_only') | map(attribute='topic') | list if ((oe_target_ip ~ ':' ~ oe_target_port) != '192.168.100.252:9092') else [] }}"
        oe_env_plan: "{{ oe_selected | rejectattr('prod_only') | list if ((oe_target_ip ~ ':' ~ oe_target_port) != '192.168.100.252:9092') else oe_selected }}"

    # A SEPARATE task, not two more keys above: within one set_fact, Ansible resolves every key
    # against the facts as they were BEFORE the task, so `oe_plan: "{{ oe_env_plan | ... }}"` beside
    # its own producer fails with "'oe_env_plan' is undefined" — which is exactly how I broke this
    # play on the first attempt.
    - name: Keep only the units this host installs, and name the ones it defers
      # A unit is installed only by a play running ON its run_host — a single play cannot install
      # some units on .102 and others on .74. The rest are REPORTED as deferred, never dropped: a row
      # silently missing from a plan is how a mirror goes unnoticed, which is the failure this whole
      # table exists to prevent.
      ansible.builtin.set_fact:
        # inventory_hostname — the host this play is ACTUALLY executing on — not the operator's
        # mirror_run_host string (Codex on #1166, P0). With the string, `-e mirror_run_host=mac47`
        # selected a typo'd row and installed it on localhost while reporting mac47 as its
        # destination. Resolving `hosts:` through the inventory makes a typo fail to resolve a host
        # instead, and this comparison then cannot disagree with where the files are being written.
        oe_plan: "{{ oe_env_plan | selectattr('run_host', 'equalto', inventory_hostname) | list }}"
        oe_deferred: "{{ oe_env_plan | rejectattr('run_host', 'equalto', inventory_hostname) | list }}"

    - name: Report the plan
      ansible.builtin.debug:
        msg: >-
          {{ oe_source }} -> {{ oe_target }} | {{ oe_plan | length }} unit(s) on {{ inventory_hostname }}{{
          (", " ~ (oe_deferred | length | string) ~ " deferred to another run_host: " ~ (oe_deferred | map(attribute='label') | join(', '))) if (oe_deferred | length > 0) else "" }}
          {{ '(PLAN ONLY — pass -e confirm_mirror_install=true to install)' if not oe_confirm else '(INSTALLING)' }}
          {{ ('| held back as production-only: ' ~ (oe_held | join(', '))) if (oe_held | length > 0) else '' }}

    - name: Dump the rows and stop, when asked
      when: oe_dump | length > 0
      ansible.builtin.copy:
        content: "{{ oe_plan | to_nice_json }}\n"
        dest: "{{ oe_dump }}"
        mode: "0644"

    - name: End the play after a dump
      when: oe_dump | length > 0
      ansible.builtin.meta: end_play

    - name: Find the units whose source and target partition counts differ
      # ⚠ NOT a selectattr chain. `selectattr('assert_source.parts', 'ne', 'assert_target.parts')`
      # compares the attribute against the literal STRING 'assert_target.parts', so it is true for
      # every row and my first version of this gate selected all 15 units — it would have refused to
      # install every es4 mirror. Jinja's selectattr cannot compare one attribute to another; `when`
      # can, so the list is built here and the assert below only counts it.
      ansible.builtin.set_fact:
        oe_asym: "{{ (oe_asym | default([])) + [item.label] }}"
      loop: "{{ oe_plan }}"
      loop_control:
        label: "{{ item.label }}"
      when:
        - item.assert_source.parts is defined
        - item.assert_target.parts is defined
        - item.assert_target.parts != 'source'
        - (item.assert_source.parts | string) != (item.assert_target.parts | string)

    - name: Refuse to INSTALL a unit whose source and target partition counts differ
      # Codex on #1166, P1: "partition asymmetry must be demonstrated before carrying production
      # traffic". MM1's byte-array producer plus the default partitioner remaps a NON-NULL key
      # deterministically, so 8->32 does not inherently break per-key ordering — but that is not a
      # safety claim: a null key, a changed key serialization or a custom partitioner each void the
      # premise, Kafka gives no ordering across topics regardless of co-partitioning, and nothing
      # here demonstrates that all four mirrored topics' PRODUCERS key on symbol|expiry.
      #
      # PLACED HERE, after the plan is computed and before anything is installed: oe_asym reads
      # oe_plan, and my first attempt put this task near the other refusals at the top of the play
      # where oe_plan does not exist yet — the same undefined-fact mistake I had already made once
      # in this file.
      #
      # So the asymmetry cannot be enabled by prose. A plan always renders and reports it; an
      # INSTALL of such a unit is refused until someone passes
      # -e partition_asymmetry_demonstrated=<evidence reference>, which is a deliberate act that
      # names where the evidence is. This is the only gate in this play that exists because a claim is
      # unproven rather than because a value is wrong.
      ansible.builtin.assert:
        that:
          - ((oe_asym | default([])) | length == 0) or ((partition_asymmetry_demonstrated | default('')) | trim | length > 0)
        fail_msg: >-
          refusing to install {{ (oe_asym | default([])) | length }} unit(s) whose source and target
          partition counts differ: {{ (oe_asym | default([])) | join(', ') }}. MirrorMaker re-partitions by key, so records
          co-partitioned at the source are redistributed at the target. That is believed harmless for
          these topics and is NOT demonstrated. Pass
          -e partition_asymmetry_demonstrated='<where the keyed-record evidence is>' to proceed, or
          align the partition counts first. Planning (without confirm_mirror_install) is unaffected.
      when: oe_confirm

    - name: Install each unit
      ansible.builtin.include_tasks: tasks/es-mirror-unit.yml
      loop: "{{ oe_plan }}"
      loop_control:
        loop_var: item
        label: "{{ item.label }}"

    - name: Summary
      ansible.builtin.debug:
        msg: "{{ oe_report | default([]) }}"

    - name: Fail when any unit was not installable or did not reload
      # Reported per unit above, and fatal here: a run that could not install part of the table, or
      # whose reload did not prove a replacement, has not done what it was asked, and a green exit
      # would say it had. A failed RELOAD is the more serious of the two — that unit's files are new
      # on disk while its process may still be the old one.
      ansible.builtin.assert:
        that:
          - (oe_failed | default([])) | length == 0
          - (oe_reload_failed | default([])) | length == 0
        fail_msg: >-
          {{ ('not installable: ' ~ (oe_failed | default([]) | join(', '))) if (oe_failed | default([]) | length > 0) else '' }}
          {{ ('reload did not prove a replacement: ' ~ (oe_reload_failed | default([]) | join(', '))) if (oe_reload_failed | default([]) | length > 0) else '' }}
          — see the Summary above for each reason.
        success_msg: "{{ oe_plan | length }} unit(s) accounted for{{ ' (plan only)' if not oe_confirm else '' }}."
