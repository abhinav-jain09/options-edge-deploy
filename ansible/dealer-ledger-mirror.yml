---
# Provision a Kafka mirror-maker leg of the dealer-ledger OFFLOAD lane, on the host that leg runs on.
# Intended to run from Jenkins (Jenkinsfile.dealer-ledger-mirror) — NEVER laid down by hand.
#
#   ansible-playbook -i ansible/inventory/oe-offload.yml ansible/dealer-ledger-mirror.yml   # plan only
#   ansible-playbook -i ansible/inventory/oe-offload.yml ansible/dealer-ledger-mirror.yml \
#       -e confirm_mirror_deploy=true                                                       # apply
#
# THE LANE (offload requirement 3.2). The dealer ledger is memory-hungry and unproven, so it runs on
# .74 rather than on dev or prod:
#
#   dev(.102) --[leg 1: 6 input topics, mirror ON .102]--> .74 --> ledger + calibration scorer (k8s)
#                                                           |
#                        [leg 2: mirror ON .74] <-----------+-----------> [leg 3: mirror ON .102]
#                                 v                                                v
#                            PROD(.252)                                       DEV(.102)
#
# WHY EACH LEG SITS WHERE IT DOES, and why leg 2 cannot simply run on .102 with the others: dev's
# broker advertises host.docker.internal:19092, which is host-relative and resolvable ONLY on .102,
# so any leg touching dev must run there. Prod advertises a routable 192.168.100.252:9092, which .74
# can reach (verified from .74: /dev/tcp to 192.168.100.252:9092 succeeds), so leg 2 runs on .74 and
# keeps prod's feed off .102's already-loaded mirror host.
#
# Inputs arrive via -e and are normalized into oe_* vars below — never `x: "{{ x | default(...) }}"`,
# which ansible-core 2.21 rejects as a recursive self-reference (same rule as loki-stack.yml).
- name: Provision a dealer-ledger mirror leg
  hosts: "{{ mirror_host | default('mac74') }}"
  gather_facts: true

  vars:
    oe_instance: "{{ mirror_instance | default('dl-mirror-mac74-to-prod') }}"
    oe_source: "{{ mirror_source | default('127.0.0.1:9092') }}"
    oe_target: "{{ mirror_target | default('192.168.100.252:9092') }}"
    oe_topics: "{{ mirror_topics | default('dealer-ledger-profile dealer-ledger-state dealer-ledger-signal-fired dealer-ledger-outcome-scored') }}"
    oe_group_id: "{{ mirror_group_id | default('oe-prod-mirror-from-mac74') }}"
    # latest, deliberately. The ledger on .74 holds the whole lineage since it was built (371k profile
    # records on 2026-10-06); 'earliest' would replay all of it into prod on first start. Prod wants
    # the live tail, and close-direction evaluates on fresh frames only.
    oe_auto_offset_reset: "{{ mirror_auto_offset_reset | default('latest') }}"
    oe_compression: "{{ mirror_compression | default('lz4') }}"
    oe_num_streams: "{{ mirror_num_streams | default(1) }}"
    oe_state: "{{ mirror_state | default('present') }}"
    oe_confirm: "{{ confirm_mirror_deploy | default(false) | bool }}"
    oe_rationale: "{{ mirror_rationale | default('leg 2 of the offload lane: ledger outputs from .74 to prod. Runs ON .74 because prod advertises a routable address .74 can reach, keeping prod independent of .102 mirror load.') }}"

    # ansible_facts['env'], not ansible_env: INJECT_FACTS_AS_VARS defaults to True today but is
    # deprecated and goes away in ansible-core 2.24, at which point the top-level alias disappears.
    oe_home: "{{ hostvars[inventory_hostname].oe_home | default(ansible_facts['env']['HOME']) }}"
    oe_root: "{{ oe_home }}/oe-ops"
    oe_instance_dir: "{{ oe_root }}/{{ oe_instance }}"
    oe_label: "com.optionsedge.{{ oe_instance }}"
    oe_plist: "{{ oe_home }}/Library/LaunchAgents/{{ oe_label }}.plist"
    # The mirror needs a Kafka distribution that still SHIPS kafka.tools.MirrorMaker. It was removed
    # in Kafka 4.x — prod itself runs 4.3.0 — so every mirror in this estate runs the confluent-7.3.1
    # (Kafka 3.3-era) tooling. Only bin/ and share/java/kafka/ are needed (~183 MB of a 6.5 GB tree).
    oe_kafka_tools: "{{ oe_home }}/oe-kafka-tools/confluent-7.3.1"
    oe_tools_src: "{{ kafka_tools_src | default('/Users/abhinav/development/confluent-7.3.1') }}"
    oe_topics_list: "{{ oe_topics.split() }}"
    oe_tools_tar: /tmp/oe-kafka-tools-confluent-7.3.1.tgz
    oe_probe_timeout: "{{ mirror_probe_timeout | default(10) }}"
    oe_liveness_settle: "{{ mirror_liveness_settle | default(20) }}"
    oe_topics_regex: "{{ oe_topics_list | map('regex_replace', '\\.', '\\\\.') | join('|') }}"

  tasks:
    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - oe_instance | length > 0
          - oe_instance is match('^[a-z0-9][a-z0-9-]*\Z')
          - oe_source | length > 0
          - oe_target | length > 0
          - oe_source != oe_target
          - oe_topics_list | length > 0
          # STRICT, because these values are rendered into a shell script and into broker configs.
          # Kafka's own legal topic charset is [a-zA-Z0-9._-]; anything else (a quote, a newline, a
          # semicolon) would break out of the single-quoted --whitelist argument in run-mirror.sh and
          # execute on the target. Same for the endpoints, which must be host:port and nothing else.
          # \Z, NOT $. Python's `$` also matches immediately BEFORE a trailing newline, so
          # "1.2.3.4:9092\n" satisfied every `...$` pattern here and the newline then reached a
          # rendered config or a shell comment (Codex r3). \Z is the true end of string.
          - oe_topics_list | select('match', '^[A-Za-z0-9._-]+\Z') | list | length == oe_topics_list | length
          - oe_source is match('^[A-Za-z0-9.-]+:[0-9]{1,5}\Z')
          - oe_target is match('^[A-Za-z0-9.-]+:[0-9]{1,5}\Z')
          - oe_group_id is match('^[A-Za-z0-9._-]+\Z')
          - oe_auto_offset_reset in ['latest', 'earliest']
          - oe_state in ['present', 'absent']
          # `| int >= 1` is NOT a validation: Jinja's int filter parses the leading digits and
          # discards the rest, so "1; id" passes it and then renders unquoted into run-mirror.sh.
          # Require the WHOLE value to be decimal.
          - oe_num_streams is string or oe_num_streams is number
          - (oe_num_streams | string) is match('^[1-9][0-9]{0,2}\Z')
          # Rendered verbatim into producer.properties; constrain to the codecs Kafka accepts.
          - oe_compression in ['none', 'gzip', 'snappy', 'lz4', 'zstd']
          # Reaches `stat` and a tar argument vector on the CONTROLLER. Absolute, no traversal,
          # no whitespace or option-looking prefix.
          - oe_tools_src is match('^/[A-Za-z0-9._/-]+\Z')
          - "'..' not in oe_tools_src"
          # A digit-count regex accepts :0 and :99999. Bound the actual range.
          - oe_source.split(':')[1] | int >= 1
          - oe_source.split(':')[1] | int <= 65535
          - oe_target.split(':')[1] | int >= 1
          - oe_target.split(':')[1] | int <= 65535
          # oe_home controls every path this play writes and CAN be overridden through extra vars.
          - oe_home is match('^/[A-Za-z0-9._/-]+\Z')
          - "'..' not in oe_home"
          # `hosts:` is resolved before any task, so this cannot gate host selection — it is a
          # tripwire for a direct playbook invocation against something the lane does not own.
          - inventory_hostname in ['mac74']
          # Reaches wait_for.timeout; an absurd value turns the safety probe into the outage.
          - (oe_probe_timeout | string) is match('^[1-9][0-9]{0,2}\Z')
          - (oe_liveness_settle | string) is match('^[1-9][0-9]{0,2}\Z')
        fail_msg: >-
          mirror_instance must be a lowercase slug; source and target must be host:port with a port
          in 1..65535 and must differ; every topic and the group id must match Kafka's legal charset
          [A-Za-z0-9._-]; num_streams must be wholly decimal; compression must be a Kafka codec;
          tools_src and home must be absolute paths without '..'; auto_offset_reset latest|earliest;
          state present|absent; the target host must be one this lane owns.

    # A mirror whose source or target is unreachable FROM THE HOST IT RUNS ON installs cleanly, goes
    # into a connect-retry loop, and reports nothing — that is how seven prod-targeted legs sat dead.
    # Prove both hops from the managed node before laying anything down.
    #
    # wait_for, not `exec 3<>/dev/tcp/...` in a shell: it takes a real timeout (this host has no
    # coreutils `timeout` and no nc, so a shell probe against a blackholed port blocks until the OS
    # TCP timeout, minutes later), and it passes host and port as MODULE ARGUMENTS rather than
    # interpolating them into a shell command line.
    - name: Prove both brokers are reachable from this host
      ansible.builtin.wait_for:
        host: "{{ item.split(':')[0] }}"
        port: "{{ item.split(':')[1] | int }}"
        timeout: "{{ oe_probe_timeout | int }}"
        state: started
      loop:
        - "{{ oe_source }}"
        - "{{ oe_target }}"
      when: oe_state == 'present'

    - name: Report the plan
      ansible.builtin.debug:
        msg:
          - "instance : {{ oe_instance }}   state={{ oe_state }}  confirm={{ oe_confirm }}"
          - "route    : {{ oe_source }}  ->  {{ oe_target }}"
          - "topics   : {{ oe_topics_list | join(', ') }}"
          - "regex    : {{ oe_topics_regex }}"
          - "group    : {{ oe_group_id }}  auto.offset.reset={{ oe_auto_offset_reset }}"
          - "dir      : {{ oe_instance_dir }}"
          - "agent    : {{ oe_label }}"

    - name: Stop here when not confirmed (plan only)
      ansible.builtin.meta: end_play
      when: not oe_confirm

    # ---------------- teardown (state=absent ONLY) ----------------
    # ⚠ `when: oe_state == 'absent'` on the BOOTOUT as well as the removal. Without it this task ran
    # on every confirmed apply, so a `present` run stopped the live mirror FIRST and any later
    # failure — absent tooling, a bad render, a failed lint — left the agent unloaded and the leg
    # dark. A re-apply must never take the mirror down before it has something working to put back.
    - name: Unload the launchd agent
      ansible.builtin.command: 'launchctl bootout gui/{{ ansible_user_uid }}/{{ oe_label }}'
      register: oe_bootout
      changed_when: oe_bootout.rc == 0
      failed_when: false
      when: oe_state == 'absent'

    - name: Remove the agent plist and instance directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ oe_plist }}"
        - "{{ oe_instance_dir }}"
      when: oe_state == 'absent'

    - name: Stop here when tearing down
      ansible.builtin.meta: end_play
      when: oe_state == 'absent'

    # ---------------- Kafka tooling ----------------
    # Preflight on the CONTROLLER first. delegate_to: localhost is the real Jenkins `local-mac`
    # executor, not this reviewer's laptop, so an absent source tree must fail HERE — before any
    # target-side work — rather than halfway through.
    - name: Preflight the controller-side Kafka tooling source
      ansible.builtin.stat:
        path: "{{ oe_tools_src }}/{{ item }}"
      delegate_to: localhost
      register: oe_src_stat
      loop:
        - bin/kafka-mirror-maker
        - bin/kafka-run-class
        - share/java/kafka

    - name: Fail early when the controller has no Kafka tooling to ship
      ansible.builtin.assert:
        that: oe_src_stat.results | map(attribute='stat.exists') | select | list | length == 3
        fail_msg: >-
          {{ oe_tools_src }} does not look like a usable Kafka tooling tree on the Ansible controller
          ({{ inventory_hostname }} is the TARGET; the controller is the Jenkins agent). All three of
          bin/kafka-mirror-maker, bin/kafka-run-class and share/java/kafka must exist — the first two
          because the launcher execs one through the other, the third because it IS the classpath.
          Pass kafka_tools_src=<path to a confluent-7.3.x tree>: kafka.tools.MirrorMaker was removed
          in Kafka 4.x, so a 4.x tree would satisfy a mere existence check and then fail at runtime.

    - name: Check whether the Kafka tooling is already present
      ansible.builtin.stat:
        path: "{{ oe_kafka_tools }}/bin/kafka-mirror-maker"
      register: oe_tools

    # NO `creates:`. With it, a truncated or wrong-version tarball left in /tmp by an interrupted
    # run is reused forever and nothing ever notices. This task only runs when the TARGET lacks the
    # tooling, i.e. once per host, so re-packing costs seconds and is always the tree just verified.
    - name: Pack the minimal Kafka tooling on the controller
      ansible.builtin.command:
        argv:
          - tar
          - -czf
          - "{{ oe_tools_tar }}"
          - -C
          - "{{ oe_tools_src }}"
          - bin
          - share/java/kafka
      delegate_to: localhost
      changed_when: true
      when: not oe_tools.stat.exists

    # unarchive does NOT create its destination; without this the FIRST apply on a host fails.
    - name: Create the Kafka tooling directory
      ansible.builtin.file:
        path: "{{ oe_kafka_tools }}"
        state: directory
        mode: '0755'
      when: not oe_tools.stat.exists

    - name: Ship and unpack the Kafka tooling
      ansible.builtin.unarchive:
        src: "{{ oe_tools_tar }}"
        dest: "{{ oe_kafka_tools }}"
        remote_src: false
        creates: "{{ oe_kafka_tools }}/bin/kafka-mirror-maker"
      when: not oe_tools.stat.exists

    - name: Verify the three paths the launcher needs EXIST on the target
      ansible.builtin.stat:
        path: "{{ oe_kafka_tools }}/{{ item }}"
      register: oe_tgt_tools
      loop:
        - bin/kafka-mirror-maker
        - bin/kafka-run-class
        - share/java/kafka

    - name: Fail when the shipped tooling is incomplete on the target
      ansible.builtin.assert:
        that: oe_tgt_tools.results | map(attribute='stat.exists') | select | list | length == 3
        fail_msg: >-
          {{ oe_kafka_tools }} on {{ inventory_hostname }} is missing one of
          bin/kafka-mirror-maker, bin/kafka-run-class or share/java/kafka after the unpack. The
          controller preflight only proves the SOURCE was complete; a truncated transfer or a
          partially-extracted archive would otherwise surface as a crash-looping agent (Codex r3).
          NOTE: this proves EXISTENCE only. Executability is the next task.

    - name: Make the Kafka tooling executable
      ansible.builtin.file:
        path: "{{ oe_kafka_tools }}/bin"
        mode: '0755'
        recurse: true
      when: not oe_tools.stat.exists

    # ---------------- the mirror instance ----------------
    - name: Create the instance and LaunchAgents directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ oe_instance_dir }}"
        - "{{ oe_home }}/Library/LaunchAgents"

    - name: Render the mirror configuration
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ oe_instance_dir }}/{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: mirror-run.sh.j2,                dest: run-mirror.sh,         mode: '0755' }
        - { src: mirror-consumer.properties.j2,   dest: consumer.properties,   mode: '0644' }
        - { src: mirror-producer.properties.j2,   dest: producer.properties,   mode: '0644' }
        - { src: mirror-log4j.properties.j2,      dest: log4j.properties,      mode: '0644' }
        - { src: mirror-readme.txt.j2,            dest: README.txt,            mode: '0644' }
      register: oe_rendered

    - name: Install the launchd agent
      ansible.builtin.template:
        src: mirror-launchd.plist.j2
        dest: "{{ oe_plist }}"
        mode: '0644'
      register: oe_agent

    - name: Validate the rendered agent plist
      ansible.builtin.command: 'plutil -lint {{ oe_plist }}'
      changed_when: false

    - name: Validate the rendered launcher syntax
      ansible.builtin.command: 'bash -n {{ oe_instance_dir }}/run-mirror.sh'
      changed_when: false

    # ⚠ EXISTENCE IS NOT EXECUTABILITY (Codex r4, P1). Three stat'd paths say nothing about whether
    # this host's Java can actually run the tool: wrong architecture, an unreadable jar, a JDK too
    # old or too new, or an environment launchd does not provide would all pass the stats and then
    # crash-loop a freshly registered agent that mirrors nothing — the highest-risk outcome of a
    # first apply, and the same "absent is not failed" blindness that left seven legs dead, one
    # level deeper.
    #
    # TWO THINGS THIS GETS RIGHT THAT MY FIRST VERSION DID NOT (Codex r5, P1):
    #
    # 1. `env -i` — a TRULY scrubbed environment, not just an overridden PATH. Ansible's
    #    `environment:` sets PATH but leaves JAVA_HOME, CLASSPATH, KAFKA_OPTS, KAFKA_HEAP_OPTS and
    #    LOG_DIR inherited from the connection, so the probe could resolve a working Java through an
    #    inherited JAVA_HOME while launchd — whose plist supplies ONLY PATH — resolves /usr/bin/java
    #    and fails. `env -i PATH=...` reproduces the launcher's actual environment; verified that it
    #    leaves PATH alone in it.
    #
    # 2. POSITIVE evidence, not the absence of a blacklist. The first version accepted every exit
    #    code but 127 unless one of four substrings appeared, so a corrupt jar, a wrapper error or a
    #    permission failure phrased differently passed. The test is now that MirrorMaker's own option
    #    parser RAN: its help text is unmistakable and only reachable after the class resolved.
    #    The exit code is deliberately NOT the test — MM1 exits 1 on --help (measured).
    - name: Prove the shipped tooling actually runs, in launchd's own environment
      ansible.builtin.command:
        argv:
          - /usr/bin/env
          - -i
          - PATH=/usr/bin:/bin:/usr/sbin:/sbin
          - "{{ oe_kafka_tools }}/bin/kafka-run-class"
          - kafka.tools.MirrorMaker
          - --help
      register: oe_classload
      changed_when: false
      failed_when: false

    - name: Fail unless MirrorMaker's own option parser ran
      ansible.builtin.assert:
        that:
          - "'continuously copy data between two Kafka clusters' in (oe_classload.stdout + oe_classload.stderr)"
          - "'--consumer.config' in (oe_classload.stdout + oe_classload.stderr)"
          - "'--producer.config' in (oe_classload.stdout + oe_classload.stderr)"
        fail_msg: >-
          {{ oe_kafka_tools }}/bin/kafka-run-class did not produce MirrorMaker's help text on
          {{ inventory_hostname }} under launchd's environment (env -i, PATH only), so the class did
          not load or the tool could not run. rc={{ oe_classload.rc }} — note the rc is not the
          test; MM1 exits 1 on --help. This is the failure that would otherwise appear as an agent
          launchd accepts and then restarts forever. First 500 chars of its output:
          {{ (oe_classload.stdout + oe_classload.stderr)[:500] }}

    - name: Check whether launchd already holds the label
      ansible.builtin.shell: 'launchctl list | grep -F "{{ oe_label }}"'
      args: { executable: /bin/bash }
      register: oe_already
      changed_when: false
      failed_when: false

    # RESTART ONLY WHEN SOMETHING CHANGED, or when the agent is not loaded at all. Every restart of a
    # MirrorMaker v1 leg is an at-least-once boundary: records produced before the source offset was
    # committed are re-delivered, so a no-op re-apply that bounced the mirror would duplicate records
    # into the target for nothing. The configs and the plist are rendered and VALIDATED above, before
    # this point, so by the time the agent goes down a working replacement already exists on disk.
    - name: Decide whether the agent must be (re)loaded
      ansible.builtin.set_fact:
        oe_reload: "{{ (oe_rendered is changed) or (oe_agent is changed) or (oe_already.rc != 0) }}"

    - name: Report the reload decision
      ansible.builtin.debug:
        msg: >-
          reload={{ oe_reload }} (configs changed={{ oe_rendered is changed }},
          plist changed={{ oe_agent is changed }}, already loaded={{ oe_already.rc == 0 }})

    # bootout then bootstrap: launchctl does not re-read a plist for a label it already holds, so a
    # route change would otherwise survive a green apply with the OLD route still running.
    - name: Unload any previous instance of the agent
      ansible.builtin.command: 'launchctl bootout gui/{{ ansible_user_uid }}/{{ oe_label }}'
      register: oe_pre_bootout
      changed_when: oe_pre_bootout.rc == 0
      failed_when: false
      when: oe_reload | bool

    - name: Load the agent
      ansible.builtin.command: 'launchctl bootstrap gui/{{ ansible_user_uid }} {{ oe_plist }}'
      when: oe_reload | bool

    # ⚠ A LABEL IS NOT A LIVE PROCESS (Codex r4, P1). `launchctl list` keeps the service record for a
    # job that starts and exits immediately; with KeepAlive=true that is a crash-loop, which looks
    # identical to health in a single read. So sample the PID TWICE: it must be numeric both times
    # (the process exists) AND unchanged (it has not been restarted in between). launchctl's columns
    # are PID, last-exit-status, label; a job that is not currently running shows '-' for the PID.
    - name: Read the agent's PID
      ansible.builtin.shell: |
        set -o pipefail
        launchctl list | awk -v L="{{ oe_label }}" '$3==L {print $1}'
      args: { executable: /bin/bash }
      register: oe_pid0
      changed_when: false
      retries: 6
      delay: 5
      until: oe_pid0.stdout is match('^[0-9]+$')

    - name: Let it run before believing it
      ansible.builtin.wait_for:
        timeout: "{{ oe_liveness_settle | int }}"
      delegate_to: localhost

    - name: Read the agent's PID again
      ansible.builtin.shell: |
        set -o pipefail
        launchctl list | awk -v L="{{ oe_label }}" '$3==L {print $1" "$2}'
      args: { executable: /bin/bash }
      register: oe_pid1
      changed_when: false

    - name: Fail when the agent is not a sustained process
      ansible.builtin.assert:
        that:
          - (oe_pid1.stdout.split() | first | default('-')) is match('^[0-9]+\Z')
          - (oe_pid1.stdout.split() | first | default('-')) == oe_pid0.stdout.strip()
        fail_msg: >-
          {{ oe_label }} is registered with launchd but is NOT a sustained process on
          {{ inventory_hostname }}: pid was {{ oe_pid0.stdout.strip() }} and is now
          "{{ oe_pid1.stdout.strip() }}" after {{ oe_liveness_settle }}s. A '-' pid means it is not
          running; a DIFFERENT pid means KeepAlive restarted it, i.e. it is crash-looping and
          mirroring nothing. Check {{ oe_instance_dir }}/mirror.err.log on the host.

    - name: Report the running agent
      ansible.builtin.debug:
        msg: >-
          {{ oe_label }} running as pid {{ oe_pid0.stdout.strip() }}, unchanged over
          {{ oe_liveness_settle }}s (launchctl row: {{ oe_pid1.stdout.strip() }})
