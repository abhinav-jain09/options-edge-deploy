---
# One mirror unit, in one order for both plan and install: assert the topic shape the owning pipeline
# asserts, assert the consumer group already exists, RENDER into a scratch directory, compare with
# what is installed, and only then — and only when something that matters differs — copy into place
# and reload. Plan mode is the same path with the copy and the reload left out, so what a plan reports
# is what an install would do.
- name: "{{ item.label }} | scratch directory for everything this run renders"
  ansible.builtin.file:
    path: "{{ oe_rendered_dir }}/{{ item.label }}"
    state: directory
    mode: "0755"
  changed_when: false

- name: "{{ item.label }} | render the shape check"
  ansible.builtin.template:
    src: mirror-shape-check.sh.j2
    dest: "{{ oe_rendered_dir }}/{{ item.label }}/shape-check.sh"
    mode: "0755"
  changed_when: false

- name: "{{ item.label }} | topic shape, exactly what the owning pipeline asserts"
  # Read-only, and no weaker or stronger than the pipeline that owns the topic: see the rendered
  # script and ansible/vars/es-mirrors.yml. A skew is reported, not fatal — the other units are still
  # installable and the play exits non-zero at the end; aborting here would let one skew hide the rest.
  ansible.builtin.command:
    cmd: "bash {{ oe_rendered_dir }}/{{ item.label }}/shape-check.sh"
  register: oe_shape
  changed_when: false
  failed_when: false

- name: "{{ item.label }} | the consumer group must already exist on the source"
  # The group carries the committed offsets. A group that does not exist yet means THIS install is the
  # first one — and a first install copies from auto.offset.reset={{ item.offset_reset }}, which on an
  # `earliest` unit is the whole retained history. That is a decision, not a side effect, so it needs
  # -e allow_new_consumer_group=true.
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      G="{{ item.group_id }}"
      # The LISTING must have succeeded before its silence means anything: a broker that refused the
      # query, or a kafka-consumer-groups that failed, prints nothing — which read as "the group does
      # not exist" and, with allow_new_consumer_group=true, installed a mirror that then re-read the
      # whole retention window. A failed or empty listing is now a refusal whatever the flag says.
      LIST=$("{{ oe_kbin }}/kafka-consumer-groups" --bootstrap-server "{{ item.source }}" --list 2>&1); rc=$?
      if [ "$rc" != 0 ] || [ -z "$(printf '%s' "$LIST" | tr -d '[:space:]')" ]; then
        echo "FAIL: cannot list consumer groups on {{ item.source }} (rc=$rc) — refusing, because an"
        echo "      unreadable listing is indistinguishable from an absent group:"
        printf '%s\n' "$LIST" | sed 's/^/      /' | head -5
        exit 1
      fi
      if printf '%s\n' "$LIST" | grep -Fxq "$G"; then
        echo "group exists: $G"
      elif [ "{{ oe_allow_new_group | lower }}" = "true" ]; then
        echo "group ABSENT, creating a FIRST install under $G (allow_new_consumer_group=true, auto.offset.reset={{ item.offset_reset }})"
      else
        echo "FAIL: consumer group $G does not exist on {{ item.source }}."
        echo "      A first install re-reads from auto.offset.reset={{ item.offset_reset }}; pass -e allow_new_consumer_group=true to accept that."
        exit 1
      fi
    executable: /bin/bash
  register: oe_group
  changed_when: false
  failed_when: false
  when: oe_shape.rc == 0

- name: "{{ item.label }} | this unit is installable"
  ansible.builtin.set_fact:
    oe_ok: "{{ (oe_shape.rc == 0) and ((oe_group.rc | default(1)) == 0) }}"

- name: "{{ item.label }} | render the unit files into the scratch directory"
  # Rendered here even on an install, never straight over the live files: the comparison below needs
  # both copies, and a half-written unit directory is not a state to leave a mirror in.
  when: oe_ok
  ansible.builtin.template:
    src: "{{ tpl.src }}"
    dest: "{{ oe_rendered_dir }}/{{ item.label }}/{{ tpl.dest }}"
    mode: "{{ tpl.mode }}"
  loop:
    - { src: mirror-consumer.properties.j2, dest: consumer.properties, mode: "0644" }
    - { src: mirror-producer.properties.j2, dest: producer.properties, mode: "0644" }
    - { src: mirror-log4j.properties.j2,    dest: log4j.properties,    mode: "0644" }
    - { src: run-mirror.sh.j2,              dest: run-mirror.sh,       mode: "0755" }
    - { src: mirror.plist.j2,               dest: plist.xml,           mode: "0644" }
  loop_control:
    loop_var: tpl
    label: "{{ tpl.dest }}"
  changed_when: false

- name: "{{ item.label }} | render the comparison"
  when: oe_ok
  ansible.builtin.template:
    src: mirror-diff.sh.j2
    dest: "{{ oe_rendered_dir }}/{{ item.label }}/diff.sh"
    mode: "0755"
  changed_when: false

- name: "{{ item.label }} | compare the rendered unit with the installed one"
  # What counts as a difference, and why, is in the rendered script's own header and in
  # ansible/templates/mirror-diff.sh.j2. It is read-only.
  when: oe_ok
  ansible.builtin.command:
    cmd: "bash {{ oe_rendered_dir }}/{{ item.label }}/diff.sh"
  register: oe_diff
  changed_when: false

- name: "{{ item.label }} | unit directory"
  when: oe_ok and oe_confirm and (oe_diff.stdout is search('would install'))
  ansible.builtin.file:
    path: "{{ item.mdir }}"
    state: directory
    mode: "0755"

- name: "{{ item.label }} | install the rendered files"
  # Each file is copied beside its target and MOVED into place, so no reader ever sees a torn file,
  # and the five moves happen before the reload — the live process keeps running its old config until
  # then. The five together are NOT one transaction: an interruption between them leaves a unit whose
  # files are part new, with the OLD process still serving. That state is detected by the comparison
  # above on the next run and finished; it is not silently carried, and nothing is reloaded onto it.
  when: oe_ok and oe_confirm and (oe_diff.stdout is search('would install'))
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      R="{{ oe_rendered_dir }}/{{ item.label }}"; M="{{ item.mdir }}"
      put() { # rendered-name  destination  mode
        cp "$R/$1" "$2.ansible-new"
        chmod "$3" "$2.ansible-new"
        mv -f "$2.ansible-new" "$2"
      }
      put consumer.properties "$M/consumer.properties" 0644
      put producer.properties "$M/producer.properties" 0644
      put log4j.properties    "$M/log4j.properties"    0644
      put run-mirror.sh       "$M/run-mirror.sh"       0755
      put plist.xml           "{{ item.plist }}"       0644
      echo "installed 5 file(s) into $M"
    executable: /bin/bash

- name: "{{ item.label }} | render the reload guard"
  when: oe_ok and oe_confirm and (oe_diff.stdout is search('would install'))
  ansible.builtin.template:
    src: mirror-reload.sh.j2
    dest: "{{ oe_rendered_dir }}/{{ item.label }}/reload.sh"
    mode: "0755"
  changed_when: false

- name: "{{ item.label }} | reload the launchd unit"
  # Only reached when something that matters differed — a reload is a gap in a live mirror, so the
  # condition is the point of this whole task file. The script proves the replacement; see its header.
  # A failed reload is RECORDED, not fatal here, so the remaining units still get installed, and the
  # play's final assertion names it and exits non-zero.
  when: oe_ok and oe_confirm and (oe_diff.stdout is search('would install'))
  ansible.builtin.command:
    cmd: "bash {{ oe_rendered_dir }}/{{ item.label }}/reload.sh"
  register: oe_reload
  failed_when: false

- name: "{{ item.label }} | replication lag on the source"
  when: oe_ok and oe_confirm
  ansible.builtin.shell:
    cmd: |
      set -uo pipefail
      "{{ oe_kbin }}/kafka-consumer-groups" --bootstrap-server "{{ item.source }}" --describe \
        --group "{{ item.group_id }}" 2>/dev/null \
        | awk -v t="{{ item.topic }}" '$2==t{printf "partition %s lag %s\n", $3, $6}'
    executable: /bin/bash
  register: oe_lag
  changed_when: false

- name: "{{ item.label }} | record"
  ansible.builtin.set_fact:
    oe_report: >-
      {{ (oe_report | default([])) + [
           item.label ~ ' | ' ~ ('OK' if oe_ok else 'NOT INSTALLED')
           ~ ' | ' ~ (((oe_shape.stdout | default('')) ~ (oe_shape.stderr | default(''))) | trim)
           ~ ' | ' ~ (((oe_group.stdout | default('')) ~ (oe_group.stderr | default(''))) | trim)
           ~ ' | ' ~ ((oe_diff.stdout | default('not compared')) | trim)
           ~ ' | ' ~ (((oe_reload.stdout | default('no reload')) ~ (oe_reload.stderr | default(''))) | trim)
           ~ ' | ' ~ ((oe_lag.stdout | default('lag not read')) | trim)
         ] }}
    oe_failed: "{{ (oe_failed | default([])) + ([] if oe_ok else [item.label]) }}"
    oe_reload_failed: >-
      {{ (oe_reload_failed | default([])) + ([item.label] if ((oe_reload.rc | default(0)) != 0) else []) }}
