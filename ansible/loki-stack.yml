---
# Deploy Loki + Promtail (central pod-log collection) to an OptionsEdge cluster.
# Intended to run from Jenkins (Jenkinsfile.loki) — NOT applied to prod by hand.
# Mirrors replay-stack.yml conventions: hosts=localhost / connection=local, KUBECONFIG-driven,
# validate-and-render first, apply only when confirm_loki_deploy=true.
#
#   ansible-playbook ansible/loki-stack.yml -e @/secure/loki-stack.yml            # validate/plan only
#   ansible-playbook ansible/loki-stack.yml -e @/secure/loki-stack.yml -e confirm_loki_deploy=true
#
# Inputs come via -e (deploy_environment, loki_namespace, ...). They are normalized into
# distinct oe_* vars below — never `x: "{{ x | default(...) }}"`, which ansible-core 2.21 rejects
# as a recursive self-reference.
#
# Loki lives in its OWN namespace (default 'loki'), intentionally NOT labeled
# options-edge/deploy-guard=jenkins-only, so the jenkins-only admission policy does not block it.
- name: Deploy Loki + Promtail log stack
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    oe_env: "{{ deploy_environment | default('prod') }}"
    oe_loki_ns: "{{ loki_namespace | default('loki') }}"
    oe_live_ns: "{{ live_namespace | default('options-edge') }}"
    oe_helm_release: "{{ helm_release | default('loki') }}"
    oe_helm_repo_name: grafana
    oe_helm_repo_url: https://grafana.github.io/helm-charts
    oe_helm_chart: "{{ helm_chart | default('grafana/loki-stack') }}"
    oe_helm_version: "{{ helm_chart_version | default('2.10.2') }}"
    oe_retention_hours: "{{ loki_retention_hours | default(168) }}"
    oe_pvc_size: "{{ loki_pvc_size | default('10Gi') }}"
    oe_timeout: "{{ rollout_timeout | default('300s') }}"
    oe_confirm: "{{ confirm_loki_deploy | default(false) | bool }}"
    oe_kubeconfig: "{{ kubeconfig | default(lookup('env', 'KUBECONFIG'), true) | default('', true) }}"
    oe_kube_env: "{{ {'KUBECONFIG': oe_kubeconfig} if (oe_kubeconfig | length > 0) else {} }}"
    oe_rendered: "{{ playbook_dir }}/.ansible-rendered/loki-values-{{ oe_env }}.yaml"

  tasks:
    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - oe_loki_ns | length > 0
          - oe_loki_ns != oe_live_ns
          - oe_env in ['dev', 'staging', 'prod']
        fail_msg: "loki_namespace must be set and differ from live_namespace; deploy_environment must be dev/staging/prod."

    - name: Check kubectl is available
      ansible.builtin.command: kubectl version --client=true
      changed_when: false

    - name: Check helm is available
      ansible.builtin.command: helm version --short
      changed_when: false

    - name: Add grafana helm repo
      ansible.builtin.command: "helm repo add {{ oe_helm_repo_name }} {{ oe_helm_repo_url }} --force-update"
      register: repo_add
      changed_when: "'has been added' in repo_add.stdout or 'has been updated' in repo_add.stdout"

    - name: Update helm repo
      ansible.builtin.command: "helm repo update {{ oe_helm_repo_name }}"
      changed_when: false

    - name: Create render directory
      ansible.builtin.file:
        path: "{{ oe_rendered | dirname }}"
        state: directory
        mode: "0700"

    - name: Render Helm values from template
      ansible.builtin.template:
        src: loki-values.yaml.j2
        dest: "{{ oe_rendered }}"
        mode: "0600"

    - name: Render the chart for validation (helm template)
      ansible.builtin.command: >
        helm template {{ oe_helm_release }} {{ oe_helm_chart }}
        --version {{ oe_helm_version }}
        --namespace {{ oe_loki_ns }}
        --values {{ oe_rendered }}
      environment: "{{ oe_kube_env }}"
      changed_when: false
      register: helm_rendered

    - name: Confirm rendered chart is non-empty
      ansible.builtin.assert:
        that:
          - helm_rendered.stdout | length > 0
        fail_msg: "helm template produced no output — check chart/version/values."

    - name: Plan only (no apply) unless confirm_loki_deploy=true
      ansible.builtin.debug:
        msg: "VALIDATED. Rendered values: {{ oe_rendered }}. Re-run with -e confirm_loki_deploy=true to apply."
      when: not oe_confirm

    - name: Apply — helm upgrade --install
      ansible.builtin.command: >
        helm upgrade --install {{ oe_helm_release }} {{ oe_helm_chart }}
        --version {{ oe_helm_version }}
        --namespace {{ oe_loki_ns }} --create-namespace
        --values {{ oe_rendered }}
        --wait --timeout {{ oe_timeout }}
      environment: "{{ oe_kube_env }}"
      when: oe_confirm
      register: helm_apply

    - name: Show pods
      ansible.builtin.command: "kubectl -n {{ oe_loki_ns }} get pods -o wide"
      environment: "{{ oe_kube_env }}"
      changed_when: false
      when: oe_confirm
      register: loki_pods

    - name: Result
      ansible.builtin.debug:
        var: loki_pods.stdout_lines
      when: oe_confirm
